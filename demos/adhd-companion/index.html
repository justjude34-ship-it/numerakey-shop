  :root {
    --bg: #06080c;
    --surface: #10151c;
    --inset: #0c1116;
    --heading: #d7e6e8;
    --teal: #7ed6d0;
    --ink: #eef3f3;
    --muted: #8d9aa0;
    --line: rgba(255, 255, 255, 0.08);
    --soft: rgba(126, 214, 208, 0.14);
    --btn: #1d646c;
    --btn-ink: #f3eeef;
    --field: #101218;
    --display: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
    --sans: "Outfit", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body { font-family: var(--sans); font-weight: 400; line-height: 1.5; letter-spacing: 0.005em; -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, .display { font-family: var(--display); font-optical-sizing: auto; color: var(--heading); letter-spacing: -0.03em; line-height: 1.15; font-weight: 600; }
  h1 { font-size: 2.15rem; margin: 0; font-weight: 500; }
  h2 { font-size: 1.2rem; margin: 0; font-weight: 500; }
  a { color: inherit; text-decoration: none; }
  .stage { max-width: 34rem; margin: 0 auto; }
  .wrap { padding: 0 1.05rem 5.5rem; }
  .stack { display: grid; gap: 0.8rem; margin-top: 1.15rem; }
  .hero { position: relative; padding: 1rem 1rem 0; }
  .hero img, .hero video {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 40 / 21;
    object-fit: cover;
    object-position: center center;
    border-radius: 1.15rem;
    filter: none;
    opacity: 1;
    background: #06080c;
  }
  .cover-name {
    position: absolute;
    left: 1.15rem;
    right: 1.15rem;
    bottom: 0.9rem;
    top: auto;
    margin: 0;
    text-align: left;
    font-family: var(--display);
    color: #eef3f3;
    font-size: 1.85rem;
    font-weight: 500;
    line-height: 1;
    text-shadow: none;
  }
  .cover-name span {
    display: block;
    font-family: var(--sans);
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--teal);
    font-weight: 600;
    margin-bottom: 0.35rem;
  }
  .eyebrow, .subhead {
    color: var(--teal);
    font-family: var(--sans);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.68rem;
    margin: 0;
  }
  .subline { color: var(--teal); margin: 0.4rem 0 0; font-weight: 500; }
  .card {
    background: var(--surface);
    border-radius: 1.15rem;
    border: 1px solid var(--line);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
    padding: 1.15rem 1.15rem 1.2rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    min-height: 3.35rem;
    width: 100%;
    border: 0;
    border-radius: 0.95rem;
    background: var(--surface);
    color: var(--ink);
    font-weight: 500;
    letter-spacing: 0.01em;
    padding: 0.75rem 1.1rem;
    border: 1px solid rgba(126, 214, 208, 0.4);
  }
  .btn:disabled { opacity: 0.4; }
  .btn.teal { background: #3e6468; }
  .btn.ghost { background: transparent; color: var(--teal); min-height: 2.75rem; font-weight: 600; }
  .btn.surface { background: var(--inset); color: var(--ink); border: 1px solid var(--line); }
  .btn:active:not(:disabled) { transform: scale(0.985); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    min-height: 2.7rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    background: var(--inset);
    color: var(--ink);
    font-weight: 500;
  }
  .chip.on { background: var(--btn); color: var(--btn-ink); border-color: transparent; }
  label.lbl, .lbl { display: block; color: var(--teal); font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.45rem; }
  input[type="text"], textarea {
    width: 100%;
    background: var(--inset);
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    padding: 0.85rem 1rem;
    outline: none;
  }
  textarea { min-height: 6.5rem; resize: vertical; }
  input:focus, textarea:focus { border-color: var(--teal); }
  .back { display: inline-flex; align-items: center; min-height: 2.6rem; color: var(--teal); font-weight: 600; letter-spacing: 0.02em; }
  .muted { color: var(--muted); }
  .small { font-size: 0.92rem; }
  .streak {
    font-family: var(--display);
    font-size: 3.4rem;
    color: var(--heading);
    font-weight: 600;
    line-height: 0.9;
    letter-spacing: -0.04em;
  }
  .linkrow, .tool {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.85rem;
    width: 100%;
    text-align: left;
    background: var(--inset);
    color: inherit;
    border: 1px solid transparent;
    border-radius: 0.9rem;
    min-height: 3.1rem;
    padding: 0.7rem 0.95rem;
    font-weight: 500;
  }
  .tool {
    background: var(--surface);
    border-color: var(--line);
    border-radius: 1.15rem;
    padding: 0.95rem 1rem;
    min-height: 4.4rem;
  }
  .icon {
    width: 2.55rem; height: 2.55rem; border-radius: 0.8rem;
    background: var(--soft); color: var(--teal);
    display: grid; place-items: center; flex: none;
    border: 1px solid rgba(142, 180, 186, 0.22);
  }
  .icon svg, .btn svg { width: 1.15rem; height: 1.15rem; }
  .checkin { width: 100%; background: transparent; border: 0; color: inherit; text-align: left; padding: 0.8rem 1rem; }
  .divide > * + * { border-top: 1px solid var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
  .statebtn { min-height: 4.6rem; text-align: left; }
  .statebtn.on { border-color: var(--teal); }
  .pulse-dot { width: 3.6rem; height: 3.6rem; border-radius: 999px; background: var(--soft); border: 1px solid rgba(142, 180, 186, 0.35); margin: 0 auto; }
  .pulse-dot.on { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(0.92); opacity: 0.8; } }
  .foot { text-align: center; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.04em; margin: 0.4rem 0 0; }
  .num { font-family: var(--display); color: var(--heading); text-align: center; font-weight: 600; margin: 0; letter-spacing: -0.04em; }
  .num.xl { font-size: 4.4rem; }
  .num.lg { font-size: 3.1rem; }
  .center { text-align: center; }
  @media (min-width: 800px) {
    .hero img, .hero video { height: auto; }
  }
  @media (prefers-reduced-motion: reduce) { .pulse-dot.on { animation: none; } }
</style>
</head>

const LEARN = [
  {id:"what",title:"What ADHD actually is",body:"A difference in how attention, motivation, and self-regulation are timed — mostly dopamine and norepinephrine, plus the networks that start, switch, and stop. Not a character flaw, and not something you outgrow by trying harder. Interest, urgency, novelty, and challenge can switch the system on. Their absence can switch it off. That's why you can hyperfocus on one thing and be unable to start the boring thing. Both are this brain."},
  {id:"types",title:"Inattentive versus hyperactive",body:"Inattentive traits are the quiet ones: trouble starting, holding a thread, organizing, remembering dull details, losing things, drifting in conversation, never quite finishing. Often missed, especially in girls, women, and adults who learned to mask. Hyperactive and impulsive traits are restlessness, fidgeting, feeling driven, talking over people, interrupting, difficulty waiting. In adults this often moves inside — a racing mind, not a child running the room. Many people have a mix. The name is the pattern, not a personality."},
  {id:"adults",title:"How it shows up in adults",body:"Not usually \"can't sit still in class.\" More often: late bills, piles, half-finished projects, time blindness, emotional spikes, a scroll hole, caffeine as a steering wheel, grazing instead of meals, brilliant bursts and long stalls. Relationships feel the forgotten text. Work feels the unread email. Rest doesn't restore if the nervous system never downshifts. A lot of adults were capable children who were told they didn't try hard enough — then hit a life with no external structure."},
  {id:"myths",title:"Common myths",body:"If you can hyperfocus, you don't have it — hyperfocus is part of it. It's only for boys who disrupt class — inattentive and high-masking people are still missed. It's a discipline problem — willpower is a bad tool for a timing problem. Everyone is a little ADHD — traits are common; a diagnosis is about a persistent pattern and real impairment, not a bad week. Medication is cheating — it's one tool, not a moral test, and not everyone uses it. Someone would have caught it in childhood — often, they didn't."},
  {id:"assessment",title:"What a proper assessment looks like",body:"A clinician looks at the whole pattern, not one quiz. Usually: history from childhood through now, examples of impairment at work, home, and relationships, and a check for lookalikes — anxiety, depression, trauma, sleep, thyroid, substances. Sometimes a collateral voice if you have one: a partner, a parent, old reports. Screening tools like the ASRS can open the door. They don't close it. You can ask whether they assess adults, including the inattentive presentation, and what they actually use."}

function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>{if(c==="&")return "&"+"amp;";if(c==="<")return "&"+"lt;";if(c===">")return "&"+"gt;";if(c==='"')return "&"+"quot;";return "&"+"#39;";});}
function localDateKey(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,"0"),d=String(date.getDate()).padStart(2,"0");return `${y}-${m}-${d}`;}
function shiftDateKey(key,delta){const [y,m,d]=key.split("-").map(Number);return localDateKey(new Date(y,m-1,d+delta));}
function dateKeyFromIso(iso){return localDateKey(new Date(iso));}
function quietDate(iso){const dt=new Date(iso);const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return `${dt.getDate()} ${months[dt.getMonth()]}`;}
function quietTime(iso){const dt=new Date(iso);let h=dt.getHours();const m=String(dt.getMinutes()).padStart(2,"0");const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${m} ${ap}`;}
function greetingFor(date){const hour=date.getHours();if(hour<5)return{hello:"Still here",line:"A small night still counts."};if(hour<12)return{hello:"Good morning",line:"You don't have to feel ready."};if(hour<17)return{hello:"Good afternoon",line:"One honest step is enough."};if(hour<21)return{hello:"Good evening",line:"The day can still be gentle."};return{hello:"Good night",line:"Rest is not something you earn."};}
function quietStreak(keys,today=localDateKey()){const set=new Set(keys);let cursor=today;if(!set.has(cursor))cursor=shiftDateKey(cursor,-1);let n=0;while(set.has(cursor)){n++;cursor=shiftDateKey(cursor,-1);}return n;}
function affirmationIndex(len,today=localDateKey()){let hash=0;for(let i=0;i<today.length;i++)hash=(hash+today.charCodeAt(i)*(i+1))%997;return len?hash%len:0;}
function unstickFrom(tags){if(!tags.length)return "Name the snag, then do the ugly first two minutes. That's the whole method.";const lines=tags.map(id=>FRICTION_MOVES[id]).filter(Boolean);return `${lines.slice(0,2).join(" ")} Then do the ugly first two minutes.`;}
function scoreAsrs(answers){let inn=0,hyp=0;ASRS.forEach((item,i)=>{const v=answers[i]??0;const positive=item.loose?v>=2:v>=3;if(!positive)return;if(item.domain==="inattentive")inn++;else hyp++;});if(inn+hyp<=4)return "low";if(inn>=5&&inn>hyp)return "inattentive";return "mixed";}

  } else {
    const step=ui.step||0;
    screen=`<p class="small" style="color:var(--teal)">${step+1} of ${ASRS.length}</p><h2>${esc(ASRS[step].text)}</h2><div class="stack">${ASRS_CHOICES.map((label,v)=>`<button class="linkrow" data-act="asrs-pick" data-v="${v}">${esc(label)}</button>`).join("")}</div>${step>0?`<button class="btn ghost" data-act="asrs-back">Back</button>`:""}`;
  }
  return shell("Learn","Open one thing. Leave the rest closed.", mods+`<section class="card stack"><p class="subhead">Self-screen</p>${screen}</section>`);
}

function view(path){
  if(path==="/pulse") return viewPulse();
  if(path==="/kickstart") return viewKick();
  if(path.startsWith("/kickstart/")) return viewKick(path.split("/")[2]);
  if(path==="/habits") return viewHabits();
  if(path==="/reframes") return viewReframes();
  if(path==="/friction") return viewFriction();
  if(path==="/state") return viewState();
  if(path==="/anchor") return viewAnchor();
  if(path==="/learn") return viewLearn();
  return viewHome();
}

function render(){
  const path=pathNow();
  const same=ui.path===path;
  const prev=same?document.querySelector(".hero video"):null;
  const t=prev?prev.currentTime:0;
  if(!same){clearTimer();ui={path};window.scrollTo(0,0);}
  const y=same&&ui.keepScroll?window.scrollY:0;
  document.getElementById("app").innerHTML=view(path);
  if(same&&ui.keepScroll) window.scrollTo(0,y);
  ui.keepScroll=false;
  const v=document.querySelector(".hero video");
  if(!v) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){v.pause();return;}
  if(t) v.currentTime=t;
}

function act(name,el){
  if(name==="open-pulse"){ui.open=ui.open===el.dataset.id?null:el.dataset.id;ui.keepScroll=true;render();return;}
  if(name==="pulse-word"){ui.word=el.dataset.word;ui.custom="";render();return;}
  if(name==="pulse-energy"){ui.energy=ui.energy===el.dataset.id?undefined:el.dataset.id;render();return;}
  if(name==="save-pulse"){
    const word=((ui.custom||"").trim()||ui.word||"").trim();
    if(!word) return;
    db.pulses.unshift({id:uid(),at:new Date().toISOString(),word,energy:ui.energy,note:(ui.note||"").trim()||undefined});
    db.pulses=db.pulses.slice(0,80); persist(); location.hash="#/"; return;
  }
  if(name==="door-start"){
    ui.running=true; ui.left=120; ui.done=false; clearTimer();
    ui.timer=setInterval(()=>{ui.left-=1;if(ui.left<=0){ui.left=0;ui.done=true;ui.running=false;clearTimer();}render();},1000);
    render(); return;
  }
  if(name==="count-start"){
    ui.n=5; ui.go=false; clearTimer();
    ui.timer=setInterval(()=>{ui.n-=1;if(ui.n<=0){ui.n=0;ui.go=true;clearTimer();}render();},700);
    render(); return;
  }
  if(name==="double-mins"){ui.mins=Number(el.dataset.m);render();return;}
  if(name==="double-start"){
    ui.left=(ui.mins||10)*60; ui.running=true; ui.closed=false; clearTimer();
    ui.timer=setInterval(()=>{ui.left-=1;if(ui.left<=0){ui.left=0;ui.running=false;ui.closed=true;clearTimer();}render();},1000);
    render(); return;
  }
  if(name==="channel-next"){ui.channel=(ui.channel||0)+1;render();return;}
  if(name==="badly-ok"){if((ui.ugly||"").trim()){ui.ok=true;render();}return;}
  if(name==="habit"){
    const today=localDateKey();
    let day=db.habitDays.find(d=>d.date===today);
    if(!day){day={date:today,ids:[]};db.habitDays.push(day);}
    day.ids=day.ids.includes(el.dataset.id)?day.ids.filter(x=>x!==el.dataset.id):[...day.ids,el.dataset.id];
    persist(); ui.keepScroll=true; render(); return;
  }
  if(name==="star"){
    const id=el.dataset.id;
    if(el.dataset.built==="1") db.starred=db.starred.includes(id)?db.starred.filter(x=>x!==id):[...db.starred,id];
    else db.reframes=db.reframes.map(r=>r.id===id?{...r,starred:!r.starred}:r);
    persist(); ui.keepScroll=true; render(); return;
  }
  if(name==="del-reframe"){db.reframes=db.reframes.filter(r=>r.id!==el.dataset.id);persist();render();return;}
  if(name==="save-reframe"){
    const d=(ui.distortion||"").trim(), r=(ui.reframe||"").trim();
    if(!d||!r) return;
    db.reframes.unshift({id:uid(),distortion:d,reframe:r,starred:false});
    persist(); ui.distortion=""; ui.reframe=""; render(); return;
  }
  if(name==="tag"){
    ui.tags=ui.tags||[];
    ui.tags=ui.tags.includes(el.dataset.id)?ui.tags.filter(x=>x!==el.dataset.id):[...ui.tags,el.dataset.id];
    ui.saved=false; ui.keepScroll=true; render(); return;
  }
  if(name==="save-friction"){
    const task=(ui.task||"").trim(); if(!task) return;
    db.friction.unshift({id:uid(),at:new Date().toISOString(),task,tags:[...(ui.tags||[])],seventy:(ui.seventy||"").trim()||undefined,unstick:unstickFrom(ui.tags||[])});
    db.friction=db.friction.slice(0,50); persist(); ui.saved=true; render(); return;
  }
  if(name==="state"){
    const s=STATES.find(x=>x.id===el.dataset.id);
    db.states.unshift({id:uid(),at:new Date().toISOString(),state:s.id,body:(ui.body||"").trim()||undefined});
    db.states=db.states.slice(0,80); persist();
    ui.lastId=s.id; ui.witness=s.witness; ui.body=""; render(); return;
  }
  if(name==="anchor"||name==="learn"){ui.open=ui.open===el.dataset.id?null:el.dataset.id;ui.keepScroll=true;render();return;}
  if(name==="asrs-begin"){ui.started=true;ui.step=0;ui.answers=[];render();return;}
  if(name==="asrs-pick"){
    const step=ui.step||0; const next=(ui.answers||[]).slice(0,step); next[step]=Number(el.dataset.v); ui.answers=next;
    if(step<ASRS.length-1) ui.step=step+1; render(); return;
  }
  if(name==="asrs-back"){ui.step=Math.max(0,(ui.step||0)-1);render();return;}
  if(name==="asrs-reset"){ui.started=false;ui.step=0;ui.answers=[];render();return;}
}

const root=document.getElementById("app");
root.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;act(el.dataset.act,el);});
root.addEventListener("input",e=>{const el=e.target;if(!el.dataset||!el.dataset.bind)return;ui[el.dataset.bind]=el.value;if(el.dataset.bind.startsWith("step")){ui.steps=ui.steps||["","",""];ui.steps[Number(el.dataset.bind.slice(4))]=el.value;}if(el.dataset.bind==="seventy"){const p=document.getElementById("seventy-line");if(p){const t=el.value.trim();p.textContent=t?"Permission: "+t:"";}}ui.saved=false;const save=document.querySelector("[data-act='save-pulse'],[data-act='save-reframe'],[data-act='save-friction'],[data-act='badly-ok']");if(save){const ok=save.dataset.act==="save-pulse"?(((ui.custom||"").trim()||ui.word)):(save.dataset.act==="save-reframe"?((ui.distortion||"").trim()&&(ui.reframe||"").trim()):(save.dataset.act==="badly-ok"?(ui.ugly||"").trim():(ui.task||"").trim()));save.disabled=!ok;if(save.dataset.act==="save-friction")save.textContent="Keep this unstick";}});
root.addEventListener("change",e=>{const el=e.target;if(el.dataset&&el.dataset.act==="ten-check"){ui.tenDone=ui.tenDone||[false,false,false];ui.tenDone[Number(el.dataset.i)]=el.checked;}});
window.addEventListener("hashchange",render);
render();
</script>
</body>
