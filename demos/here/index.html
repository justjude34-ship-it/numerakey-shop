@keyframes fill{to{width:100%}}
.orb{width:11rem;height:11rem;border-radius:50%;margin:1.5rem auto;background:radial-gradient(circle at 35% 35%,#7ff2e8,var(--teal) 55%,#0a4a52);box-shadow:0 0 50px rgba(26,166,160,.5);transform:scale(.55);transition:transform 4s ease-in-out}
.orb.in{transform:scale(1);transition-duration:4s}
.orb.out{transform:scale(.55);transition-duration:6s}
.big{font-size:1.6rem;text-align:center;font-weight:700}
.inp{width:100%;min-height:3rem;padding:.6rem .8rem;border-radius:.9rem;border:1px solid var(--line);background:#000;color:var(--fg);font:inherit;font-size:1.05rem;margin:.2rem 0 .6rem}
textarea.inp{min-height:5.5rem;resize:vertical}
label.l{display:block;margin:.8rem 0 .1rem;font-weight:700}
.opts button{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:1rem;padding:.8rem 1rem;margin:.45rem 0;font:inherit;font-size:1.05rem;cursor:pointer;min-height:3.2rem}
.opts button.on{border-color:var(--teal);background:#10262a}
.row{display:flex;justify-content:space-between;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:1.5rem 1.5rem 0 0;padding:1.1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
.line{display:block;text-decoration:none;color:var(--fg);padding:.8rem 0;border-bottom:1px solid var(--line)}
.line b{display:block;color:var(--teal);font-size:1.2rem}
.line span{color:var(--muted);font-size:.92rem}
.toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:#123e3c;color:#fff;padding:.7rem 1.1rem;border-radius:999px;z-index:50}
.note{font-size:.9rem;color:var(--muted)}
a{color:var(--teal)}
</style>
</head>

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- content ---------- */
const STATES=[
 {id:"flash",n:"Flashback",d:"It feels like it's happening again",t:["date","senses","lid"]},
 {id:"alert",n:"High alert",d:"Jumpy, wired, scanning for danger",t:["outbreath","orient","senses"]},
 {id:"shutdown",n:"Shut down",d:"Numb, heavy, far away, frozen",t:["feet","move","reach"]},
 {id:"shame",n:"Shame spiral",d:"Everything is my fault, I'm wrong",t:["name","kind","anchor"]},
 {id:"pulling",n:"Pulling away",d:"Wanting to hide or cut people off",t:["reach","move","kind"]},
 {id:"sleep",n:"Can't sleep",d:"Body tired, mind and body won't settle",t:["outbreath","muscle","safeplace","lid"]},
 {id:"snap",n:"About to snap",d:"Anger or irritation rising fast",t:["pause","muscle","outbreath"]},
 {id:"unknown",n:"Don't know who I am",d:"Lost, blank, not myself",t:["anchor","date","name"]}
];
const TOOLS={
 date:{n:"Date the moment",d:"Tell your brain what year and day it is now",steps:[["Look at today's date, and say it: <b>{DATE}</b>.",15],["Say how old you are now, today.",10],["Say where you are: the room, the building, the town.",15],["Say it out loud or in your head: <b>That was then. This is now.</b>",15],["Find one thing in the room that wasn't in your life back then.",20]]},
 senses:{n:"5-4-3-2-1",d:"Use your senses to land in the room",steps:[["Name <b>5 things you can see</b>. Slowly. Let your eyes rest on each one.",25],["Name <b>4 things you can feel</b>: your clothes, the chair, the floor, the air.",25],["Name <b>3 things you can hear</b>. Near ones, then far ones.",20],["Name <b>2 things you can smell</b>. Or two smells you like.",15],["Name <b>1 thing you can taste</b>, or one thing you like in this room.",10]]},
 outbreath:{n:"Longer out-breath",d:"A slow breath that tells your body it's safe",breath:true,steps:[["Sit or lean back, whatever feels okay. Let your shoulders drop.",10],["Follow the circle. <b>In for 4, out for 6.</b> The long out-breath is the part that calms you.",0]]},
 orient:{n:"Look around slowly",d:"Show your body there's no danger here",steps:[["Turn your head slowly to the left. Let your eyes land on things.",20],["Now slowly to the right. Name the colours you see.",20],["Find the door or the way out. Just knowing where it is helps.",15],["Say: <b>I'm looking around, and nothing here is a threat right now.</b>",20]]},
 feet:{n:"Feet and chair",d:"Feel the weight of your body again",steps:[["Press your feet into the floor. Feel the floor push back.",20],["Notice the chair or bed holding your weight. You don't have to hold yourself up.",20],["Press your palms together hard for 5 seconds, then let go.",15],["Notice your hands and feet. Wiggle your toes.",15]]},
 move:{n:"Wake the body up",d:"Gentle movement to bring you back",steps:[["Shake out your hands for 10 seconds.",12],["Roll your shoulders back, slowly, 5 times.",15],["Stand up if you can, and stretch your arms up.",15],["Walk to a window or another room. Look outside.",25],["Drink some water, slowly.",15]]},
 name:{n:"Name it",d:"Putting a word on it takes some of its power",steps:[["What are you feeling? Pick the closest word: scared, angry, sad, ashamed, empty, overwhelmed.",20],["Where is it in your body? Chest, throat, stomach, hands?",15],["Say: <b>I'm having the feeling of ____.</b> It's a feeling. It's not a fact.",20],["Feelings rise and fall. This one will too.",15]]},
 kind:{n:"Kind voice",d:"Talk to yourself the way you'd talk to a friend",steps:[["Think of someone you love who was feeling exactly like this.",15],["What would you say to them? Think of the words.",20],["Now say those words to yourself, quietly.",20],["Rest a hand on your chest or arm. A steady, warm touch.",20],["You're allowed to feel this and not be wrong.",10]]},
 lid:{n:"Put the lid on",d:"Set the memory aside, for now",steps:[["If a memory is pushing in, you don't have to open it right now.",10],["Picture a strong container: a box, a safe, a jar with a tight lid.",15],["Place the memory inside. Close the lid and turn the lock.",20],["Tell yourself: <b>Not forever, just for now. I can come back to it with help, when I choose.</b>",15],["Look at something in the room and name its colour.",15]]},
 safeplace:{n:"A safe place",d:"Picture somewhere calm, real or imagined",steps:[["Picture a place where you feel calm. Real or made up. Beach, garden, a cosy room.",15],["What do you see there? Colours, light.",20],["What do you hear? What does the air feel like?",20],["Let your body settle into it. Take three slow breaths there.",25]]},
 reach:{n:"Reach out",d:"One small bit of connection",steps:[["Pick one person, or one animal. A pet counts.",10],["Send one line: <b>Having a rough hour. Can you talk or just be there?</b>",20],["Or sit near your pet, and stroke them slowly. Feel the warmth.",25],["You don't have to explain it all. Being near is enough.",10]]},
 pause:{n:"Pause before you reply",d:"Give the first wave time to pass",steps:[["Put the phone down, or step out of the room if you can.",10],["Breathe out slowly, 5 times. Out-breath longer than the in-breath.",30],["Count slowly back from 20.",20],["Ask yourself: <b>What do I want to happen after this?</b>",15],["Reply later. It will still be there, and so will you.",10]]},
 muscle:{n:"Tense and let go",d:"Release the tension your body is holding",steps:[["Make tight fists for 5 seconds, then let go.",12],["Shoulders up to your ears, hold, then drop them.",12],["Scrunch your face tight, hold, then let it go soft.",12],["Press your legs down into the floor, hold, then release.",12],["Notice the difference between tight and loose.",12]]},
 anchor:{n:"Who am I right now",d:"Remind yourself who's here today",steps:[["Say your name, and today's date: <b>{DATE}</b>.",12],["Say three things that are true about you today. Anything. You have a pet. You got up. You're here.",25],["Name one thing you care about.",15],["Name one small thing you did today, even tiny.",15],["Say: <b>I'm still me.</b>",8]]}
};

 "Memories or flashes of what happened pushed in when I didn't want them.",
 "I went out of my way to avoid reminders: places, people, thoughts, feelings.",

function blank(){return{sessions:[],checks:[],plan:{signs:"",calm:"",people:"",places:"",reasons:"",env:""}}}
let D=(function(){try{const r=lsGet();if(r){const o=JSON.parse(r);return Object.assign(blank(),o)}}catch(e){}return blank()})();
function save(){lsSet(JSON.stringify(D))}
let V={tab:"home",view:"home",stateId:null,flow:null,checkAns:[],showPlanEdit:false};
function today(){return new Date().toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function fill(t){return t.replace("{DATE}",esc(today()))}

/* ---------- views ---------- */
function home(){
  let h='<main class="frame"><img class="hero" src="'+HERO+'" alt=""><div class="pad">';
  h+='<h2 style="margin-top:1.1rem">What\'s happening right now?</h2><p class="muted" style="margin:0 0 .4rem">Tap the closest one. It\'s okay if it isn\'t exact.</p>';
  STATES.forEach(s=>{h+='<button class="state" data-act="state" data-id="'+s.id+'"><b>'+s.n+"</b><span>"+s.d+"</span></button>"});
  h+='<div class="card" style="margin-top:1.2rem"><b>What Here is, and isn\'t</b><p class="muted" style="margin:.4rem 0 0">Here helps you steady yourself in the bad hour. It does not process what happened. Opening the whole story without a trained person can flood you, so Here keeps the lid on and helps you get back to now. For the rest, there are treatments with a research base, and a GP can point you to a trauma-trained clinician.</p></div>';
  return h+"</div></main>"
}
function stateView(){
  const s=STATES.find(x=>x.id===V.stateId);
  let h='<main class="frame"><div class="pad"><button class="quiet" data-act="home">&larr; Back</button><h2>'+s.n+'</h2><p class="muted">Here\'s what tends to help. Pick one. Each takes about two minutes.</p>';
  s.t.forEach(id=>{h+='<button class="tool" data-act="tool" data-id="'+id+'"><b>'+TOOLS[id].n+"</b><span>"+TOOLS[id].d+"</span></button>"});
  h+='<p class="note" style="margin-top:1rem">If you\'re in danger or thinking of hurting yourself, tap <b>Help now</b> at the top.</p></div></main>';
  return h
}
function rateBtns(sel,act){let h='<div class="rate">';for(let i=0;i<=10;i++)h+='<button data-act="'+act+'" data-v="'+i+'" class="'+(sel===i?"on":"")+'">'+i+"</button>";return h+'</div><div class="ends"><span>0 = calm</span><span>10 = as bad as it gets</span></div>'}
function flowView(){
  const f=V.flow,T=TOOLS[f.tool];
  let h='<main class="frame"><div class="pad"><button class="quiet" data-act="quit">&larr; Stop</button><h2>'+T.n+"</h2>";
  if(f.phase==="before"){
    h+='<p class="muted">First, how strong is it right now?</p>'+rateBtns(f.before,"rb");
    h+='<button class="btn" data-act="startflow"'+(f.before==null?" disabled style=\"opacity:.45\"":"")+">Begin</button>"
  }else if(f.phase==="steps"){
    if(T.breath&&f.step===T.steps.length-1){
      h+='<div class="prog"><i style="width:'+Math.round(f.step/T.steps.length*100)+'%"></i></div><p class="step" style="min-height:0">'+fill(T.steps[f.step][0])+'</p><div class="orb" id="orb"></div><div class="big" id="bt">Get ready</div><p class="muted" style="text-align:center" id="bc"></p><button class="btn ghost small" data-act="stepnext">I\'m done</button>'
    }else{
      const st=T.steps[f.step];
      h+='<div class="prog"><i style="width:'+Math.round(f.step/T.steps.length*100)+'%"></i></div><p class="muted">Step '+(f.step+1)+" of "+T.steps.length+'. Take your time.</p>';
      if(st[1])h+='<div class="secs"><i style="animation-duration:'+st[1]+'s"></i></div>';
      h+='<p class="step">'+fill(st[0])+'</p><button class="btn" data-act="stepnext">'+(f.step===T.steps.length-1?"I\'m done":"Next")+'</button>';
      if(f.step>0)h+='<button class="btn ghost small" data-act="stepprev">Back one</button>'
    }
  }else if(f.phase==="after"){
    h+='<p class="muted">Check in with your body. How strong is it now?</p>'+rateBtns(f.after,"ra");
    h+='<button class="btn" data-act="finish"'+(f.after==null?" disabled style=\"opacity:.45\"":"")+">See how it went</button>"
  }else{
    const d=f.before-f.after;let msg,col;
    if(d>0){msg="It came down from <b>"+f.before+"</b> to <b>"+f.after+"</b>. Your body moved.";col="var(--good)"}
    else if(d===0){msg="It stayed at about <b>"+f.after+"</b>. That's information, not failure. Give it a few minutes, or try a different tool.";col="var(--purple)"}
    else{msg="It went up, from <b>"+f.before+"</b> to <b>"+f.after+"</b>. That happens, and it doesn't mean you did it wrong or failed. Some tools stir things up. Try a gentler one, like <b>Feet and chair</b>, or reach out to someone. <b>Help now</b> is always at the top.";col="var(--warn)"}
    h+='<div class="card" style="border-color:'+col+'"><p style="margin:0;font-size:1.15rem">'+msg+"</p></div>";
    const others=(STATES.find(s=>s.id===V.stateId)||{t:[]}).t.filter(x=>x!==f.tool);
    if(d<=0&&others.length){h+='<p class="muted" style="margin:1rem 0 0">Try another:</p>';others.forEach(id=>{h+='<button class="tool" data-act="tool" data-id="'+id+'"><b>'+TOOLS[id].n+"</b><span>"+TOOLS[id].d+"</span></button>"})}
    h+='<button class="btn" data-act="home">Done</button>'
  }
  return h+"</div></main>"
}
function skills(){
  let h='<main class="frame"><div class="pad"><h2>All 14 skills</h2><p class="muted">Pick any one. You\'ll rate before and after, so you can see what actually works for you.</p>';
  Object.keys(TOOLS).forEach(id=>{h+='<button class="tool" data-act="tool" data-id="'+id+'"><b>'+TOOLS[id].n+"</b><span>"+TOOLS[id].d+"</span></button>"});
  return h+"</div></main>"
}
function check(){
  let h='<main class="frame"><div class="pad"><h2>A six-point check</h2><p class="muted">Six things people living with long-term trauma often notice. This is not a diagnosis, just a way to see how much is showing up. Think of the last month.</p>';
  CHECK.forEach((q,i)=>{
    h+='<div class="card"><p style="margin:0 0 .4rem"><b>'+(i+1)+".</b> "+q+'</p><div class="opts">'+CHOICES.map((c,j)=>'<button data-act="ck" data-i="'+i+'" data-v="'+j+'" class="'+(V.checkAns[i]===j?"on":"")+'">'+c+"</button>").join("")+"</div></div>"
  });
  const done=V.checkAns.filter(x=>x!=null).length===CHECK.length;
  h+='<button class="btn" data-act="score"'+(done?"":" disabled style=\"opacity:.45\"")+">See what it shows</button>";
  if(D.checks.length){const c=D.checks[D.checks.length-1];h+='<p class="note" style="margin-top:1rem">Last time ('+new Date(c.t).toLocaleDateString("en-AU")+"): "+c.score+" out of 18.</p>"}
  return h+"</div></main>"
}
function scoreView(){
  const sc=V.checkAns.reduce((a,b)=>a+b,0);
  let band,txt;
  if(sc<=5){band="Not much is showing up right now.";txt="That's good to see. Keep the tools handy for harder days."}
  else if(sc<=11){band="Quite a bit is showing up.";txt="A lot of people with this much going on find it helps to talk to a GP or a trauma-trained therapist, even if things feel manageable."}
  else{band="A lot is showing up.";txt="That's a heavy load, and you don't have to carry it alone. Please consider seeing a GP or a trauma-trained clinician. Treatments with a research base include trauma-focused CBT, EMDR, prolonged exposure and cognitive processing therapy. Phoenix Australia (phoenixaustralia.org) is a good place to look for what's out there."}
  return'<main class="frame"><div class="pad"><h2>'+sc+" out of 18</h2><div class=\"card\"><p style=\"margin:0 0 .5rem;font-size:1.15rem\"><b>"+band+"</b></p><p style=\"margin:0\">"+txt+'</p></div><p class="note">This check uses original wording and is not a diagnosis. Only a trained professional can tell you what\'s going on for you.</p><button class="btn" data-act="tab" data-t="home">Back to Here</button></div></main>'
}
function plan(){
  const p=D.plan;
  const F=[["signs","My warning signs","What I notice when things are starting to slip (thoughts, feelings, body, behaviours)"],["calm","Things that help me settle","Tools from Here, music, a bath, my pet..."],["people","People I can contact","Names and numbers"],["places","Places that feel safe","Somewhere I can go"],["reasons","What matters to me","Reasons to stay safe, people and animals who need me"],["env","Making things safer","Anything I can put out of reach or ask someone to hold for me"]];
  let h='<main class="frame"><div class="pad"><h2>My safety plan</h2><p class="muted">Write it when you\'re okay, so it\'s ready when you\'re not. It stays on this phone.</p>';
  F.forEach(f=>{h+='<label class="l">'+f[1]+'</label><textarea class="inp" data-plan="'+f[0]+'" placeholder="'+esc(f[2])+'">'+esc(p[f[0]])+"</textarea>"});
  h+='<div class="card"><b>Crisis lines (Australia)</b>'+LINES.map(l=>'<a class="line" href="tel:'+l[2]+'"><b>'+l[0]+" · "+l[1]+"</b><span>"+l[3]+"</span></a>").join("")+"</div>";
  h+='<button class="btn" data-act="showplan">Show my plan</button>';
  return h+"</div></main>"
}
function me(){
  let h='<main class="frame"><div class="pad"><h2>What\'s worked</h2>';
  if(!D.sessions.length)h+='<div class="card muted">Nothing yet. After you use a tool, you\'ll see here how much it moved things.</div>';
  else{
    const by={};D.sessions.forEach(s=>{(by[s.tool]=by[s.tool]||[]).push(s.before-s.after)});
    const best=Object.keys(by).map(k=>[k,by[k].reduce((a,b)=>a+b,0)/by[k].length,by[k].length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
    if(best.length)h+='<div class="card"><b>Helped you most so far</b>'+best.map(b=>'<div class="row"><span>'+TOOLS[b[0]].n+'</span><span class="muted">about '+b[1].toFixed(1)+" points, "+b[2]+"x</span></div>").join("")+"</div>";
    h+='<div class="card"><b>Recent</b>'+D.sessions.slice(-15).reverse().map(s=>'<div class="row"><span>'+TOOLS[s.tool].n+'<br><small class="muted">'+new Date(s.t).toLocaleDateString("en-AU",{day:"numeric",month:"short"})+'</small></span><span>'+s.before+" &rarr; "+s.after+"</span></div>").join("")+"</div>"
  }
  h+='<div class="card"><b>Your data</b><p class="muted" style="margin:.3rem 0">Everything stays on this phone.</p><button class="btn ghost small" data-act="copy">Copy my data</button><button class="btn ghost small" data-act="wipe">Erase everything</button></div>';
  return h+"</div></main>"
}
function nav(){
  const t=[["home","Now"],["skills","Skills"],["check","Check"],["plan","Plan"],["me","Me"]];
  return'<div class="nav"><div>'+t.map(x=>'<button data-act="tab" data-t="'+x[0]+'" class="'+(V.tab===x[0]?"on":"")+'">'+x[1]+"</button>").join("")+"</div></div>"
}
function render(){
  stopBreath();
  let body;
  if(V.view==="flow")body=flowView();
  else if(V.view==="state")body=stateView();
  else if(V.view==="score")body=scoreView();
  else body=V.tab==="skills"?skills():V.tab==="check"?check():V.tab==="plan"?plan():V.tab==="me"?me():home();
  $("app").innerHTML=body+nav();
  if(V.view==="flow"&&V.flow.phase==="steps"&&TOOLS[V.flow.tool].breath&&V.flow.step===TOOLS[V.flow.tool].steps.length-1)startBreath();
  window.scrollTo(0,0)
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* breathing: in 4, out 6, eight rounds */
let bTimer=null;
function stopBreath(){if(bTimer){clearInterval(bTimer);bTimer=null}}
function startBreath(){
  let sec=0,round=1;const ROUNDS=8;
  const orb=$("orb"),bt=$("bt"),bc=$("bc");
  function tick(){
    const c=sec%10;
    if(c===0){orb.className="orb in";bt.textContent="Breathe in…"}
    if(c===4){orb.className="orb out";bt.textContent="Slowly out…"}
    if(c<4)bc.textContent="Round "+round+" of "+ROUNDS+" · "+(4-c);else bc.textContent="Round "+round+" of "+ROUNDS+" · "+(10-c);
    sec++;
    if(sec%10===0){round++;if(round>ROUNDS){stopBreath();bt.textContent="Well done";bc.textContent="Rest here a moment, then tap done.";orb.className="orb"}}
  }
  setTimeout(()=>{orb.className="orb"},50);
  bTimer=setInterval(tick,1000);tick()
}

/* ---------- actions ---------- */
function openHelp(){
  const d=document.createElement("div");d.className="ov";
  d.innerHTML='<div class="sheet"><h2 style="margin-top:0">Help now</h2><p class="muted">You don\'t have to be in crisis to call. All free, from Australia.</p>'+LINES.map(l=>'<a class="line" href="tel:'+l[2]+'"><b>'+l[0]+" · "+l[1]+"</b><span>"+l[3]+'</span></a>').join("")+'<button class="btn ghost" id="cl">Close</button></div>';
  d.onclick=e=>{if(e.target===d||e.target.id==="cl")d.remove()};
  document.body.appendChild(d)
}
function showPlan(){
  const p=D.plan,F=[["signs","My warning signs"],["calm","Things that help me settle"],["people","People I can contact"],["places","Places that feel safe"],["reasons","What matters to me"],["env","Making things safer"]];
  const d=document.createElement("div");d.className="ov";
  d.innerHTML='<div class="sheet"><h2 style="margin-top:0">My safety plan</h2>'+F.map(f=>p[f[0]].trim()?'<p><b>'+f[1]+'</b><br>'+esc(p[f[0]]).replace(/\n/g,"<br>")+"</p>":"").join("")+'<p><b>Crisis lines</b><br>Lifeline 13 11 14 · 13YARN 13 92 76 · Suicide Call Back Service 1300 659 467 · Emergency 000</p><button class="btn ghost" id="cl">Close</button></div>';
  d.onclick=e=>{if(e.target===d||e.target.id==="cl")d.remove()};
  document.body.appendChild(d)
}
const ACT={
 helpnow:openHelp,
 home(){V.view="home";V.tab="home";V.flow=null;render()},
 tab(el){V.view="home";V.tab=el.dataset.t;if(V.tab==="check")V.checkAns=[];render()},
 state(el){V.stateId=el.dataset.id;V.view="state";render()},
 tool(el){V.flow={tool:el.dataset.id,phase:"before",before:null,after:null,step:0};V.view="flow";render()},
 rb(el){V.flow.before=+el.dataset.v;render()},
 ra(el){V.flow.after=+el.dataset.v;render()},
 startflow(){if(V.flow.before==null)return;V.flow.phase="steps";V.flow.step=0;render()},
 stepnext(){const T=TOOLS[V.flow.tool];if(V.flow.step>=T.steps.length-1){V.flow.phase="after"}else V.flow.step++;render()},
 stepprev(){if(V.flow.step>0)V.flow.step--;render()},
 finish(){const f=V.flow;if(f.after==null)return;D.sessions.push({t:Date.now(),tool:f.tool,before:f.before,after:f.after});save();f.phase="result";render()},
 quit(){V.view="home";V.flow=null;render()},
 ck(el){V.checkAns[+el.dataset.i]=+el.dataset.v;const y=window.scrollY;render();window.scrollTo(0,y)},
 score(){if(V.checkAns.filter(x=>x!=null).length<CHECK.length)return;const sc=V.checkAns.reduce((a,b)=>a+b,0);D.checks.push({t:Date.now(),score:sc,a:V.checkAns.slice()});save();V.view="score";render()},
 showplan:showPlan,
 copy(){
  let t="Here: my data\n\nSessions\n"+D.sessions.map(s=>new Date(s.t).toLocaleDateString("en-AU")+" "+TOOLS[s.tool].n+": "+s.before+" -> "+s.after).join("\n")+"\n\nSafety plan\n"+Object.keys(D.plan).map(k=>k+": "+D.plan[k]).join("\n");
  try{navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>fb(t))}catch(e){fb(t)}
 },
 wipe(){if(confirm("Erase everything in Here, including your safety plan? This can't be undone.")){D=blank();save();toast("Erased");V.tab="home";render()}}
};
function fb(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(e){toast("Couldn't copy")}ta.remove()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el)});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.plan;if(k){D.plan[k]=e.target.value;save()}});
render();
</script>
</body>
