    +'<div class="chips">'+chips+'</div>'
    +'<div class="grid">'+list.map(function(i){
      return '<button class="tile'+(S.read[i]?" done":"")+(S.fav[i]?" heart":"")+(i===tn?" today":"")+'" data-n="'+i+'">'
        +art(i,CH[i-1][1])+'<span class="n">'+i+(i===tn?" · today":"")+'</span><span class="lab">'+esc(CH[i-1][0])+'</span></button>';
    }).join("")+'</div>'
    +(list.length?"":'<p class="small center" style="margin-top:36px">Nothing matches that yet.</p>')+'</div>';
  var inp=$("#q");
  inp.oninput=function(e){
    query=e.target.value;
    var p=e.target.selectionStart;
    if(window._qT)clearTimeout(window._qT);
    window._qT=setTimeout(function(){browse();var n=$("#q");if(n){n.focus();try{n.setSelectionRange(p,p)}catch(err){}}},80);
  };
  [].forEach.call(document.querySelectorAll(".chip"),function(b){b.onclick=function(){filter=b.dataset.f;browse()}});
  [].forEach.call(document.querySelectorAll(".tile"),function(b){b.onclick=function(){fromTab="browse";setTab("browse");chapter(+b.dataset.n,+b.dataset.n===tn)}});
}

function journal(){
  var all=[];
  Object.keys(S.notes).forEach(function(n){S.notes[n].forEach(function(e){all.push({n:+n,d:e.d,t:e.t})})});
  all.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.n-a.n});
  app.innerHTML=head()+'<div class="fade"><h2 class="grad" style="font-size:1.85rem;margin-bottom:6px">Journal</h2>'
    +'<p class="small">Lines you have written. They stay on this device.</p>'
    +(all.length?all.map(function(e){
      return '<div class="entry"><small>'+esc(niceYmd(e.d))+' · <a href="#" data-n="'+e.n+'">Ch. '+e.n+' '+esc(CH[e.n-1][0])+'</a></small><p>'+esc(e.t)+'</p></div>';
    }).join(""):'<div class="box center"><p>No lines yet. One sentence on today’s chapter is enough.</p><div class="row" style="justify-content:center"><button class="btn main" id="openToday">Open today’s chapter</button></div></div>')
    +(all.length?'<div class="row"><button class="btn" id="exp">Export</button><button class="btn ghost" id="shareJ">Share</button></div>':'')
    +'</div>';
  [].forEach.call(document.querySelectorAll(".entry a"),function(a){a.onclick=function(ev){ev.preventDefault();fromTab="journal";setTab("journal");chapter(+a.dataset.n,+a.dataset.n===todayN())}});
  var ot=$("#openToday");if(ot)ot.onclick=function(){go("today")};
  var x=$("#exp");
  if(x)x.onclick=function(){
    var t=all.map(function(e){return e.d+"  Chapter "+e.n+" — "+CH[e.n-1][0]+"\n"+e.t}).join("\n\n");
    try{var b=new Blob([t],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="tao-journal.txt";document.body.appendChild(a);a.click();a.remove();toast("Exported")}catch(e){copyText(t)}
  };
  var sj=$("#shareJ");
  if(sj)sj.onclick=function(){
    var t=all.map(function(e){return e.d+"  Chapter "+e.n+" — "+CH[e.n-1][0]+"\n"+e.t}).join("\n\n");
    if(navigator.share)navigator.share({title:"Tao journal",text:t}).catch(function(){copyText(t)});
    else copyText(t);
  };
}

function pathView(){
  var rc=Object.keys(S.read).length,fc=Object.keys(S.fav).length,st=streak(),tn=todayN();
  var dots="";
  for(var i=1;i<=N;i++){
    var cls="dot";
    if(i===tn)cls+=" today";
    else if(S.read[i])cls+=" walked";
    else if(S.fav[i])cls+=" kept";
    dots+='<button class="'+cls+'" data-n="'+i+'" title="Chapter '+i+' · '+esc(CH[i-1][0])+'" aria-label="Chapter '+i+'"></button>';

    ?'<div class="a2hs" id="a2hs">Add this to your home screen if you want it like a small book in your pocket. <button class="btn text" id="hideA2HS">Not now</button></div>'

    +'<p class="small" style="margin-top:0">Eighty-one chapters. One a day. Then begin again.</p>'
    +'<div class="stat"><div><b>'+rc+'</b><span>Walked</span></div><div><b>'+st+'</b><span>Days walking</span></div><div><b>'+fc+'</b><span>Kept</span></div></div>'
    +'<div class="box"><h3>The eighty-one</h3><div class="path81">'+dots+'</div></div>'

    +'<div class="box"><h3>This copy</h3><p>You own this file. Keep it on as many of your own devices as you like. Notes never leave the device they are written on.</p><p style="margin-top:10px">The Tao Te Ching is ancient and belongs to everyone. The plain wording and this companion are © 2026 Judith Anne Crighton / NumeraKey. Please do not resell the file or present the wording as a scholarly translation.</p><p class="small" style="margin-top:10px">Version 1.0 · Yours to keep.</p></div>'
    +'<div class="box"><h3>Reading</h3><p class="small" style="margin-bottom:10px">Ink for night. Parchment for day. Larger type if the eyes are tired.</p>'
    +'<div class="ctrl"><button class="chip'+(S.theme==="ink"?" on":"")+'" id="thInk">Ink</button>'
    +'<button class="chip'+(S.theme==="parchment"?" on":"")+'" id="thParch">Parchment</button></div>'
    +'<div class="ctrl"><button class="chip'+(S.size==="s"?" on":"")+'" id="szS">A−</button>'

    +a2hs
    +'<div class="box"><h3>This copy</h3><p>You own this file. Keep it on as many of your own devices as you like. Notes never leave the device they are written on.</p><p style="margin-top:10px">The Tao Te Ching is ancient and belongs to everyone. The plain wording and this companion are yours to keep. Please don’t resell the file or present the wording as a scholarly translation.</p><p class="small" style="margin-top:10px">Tao · 1.0 · A NumeraKey companion. © 2026 Judith Anne Crighton.</p></div>'
    +'<div class="box"><h3>This copy</h3><p>This is a copy you keep. Notes, kept chapters and your place stay on this device. Nothing is sent away.</p><p class="small" style="margin-top:10px">Version 1.0 · NumeraKey</p></div>'
    +'<div class="box"><h3>Begin again</h3><p class="small" style="margin-bottom:10px">Today becomes chapter 1 again. Walking history clears. Notes and kept chapters stay.</p>'
    +'<button class="btn" id="restart">Restart from chapter 1</button></div></div>';
  [].forEach.call(document.querySelectorAll(".path81 button"),function(b){
    b.onclick=function(){fromTab="path";setTab("path");chapter(+b.dataset.n,+b.dataset.n===tn)};
  });
  $("#thInk").onclick=function(){S.theme="ink";save();applyChrome();pathView()};
  $("#thParch").onclick=function(){S.theme="parchment";save();applyChrome();pathView()};
  $("#szS").onclick=function(){S.size="s";save();applyChrome();pathView()};
  $("#szM").onclick=function(){S.size="m";save();applyChrome();pathView()};
  $("#szL").onclick=function(){S.size="l";save();applyChrome();pathView()};
  var hide=$("#hideA2HS");if(hide)hide.onclick=function(){S.hideA2HS=true;save();pathView()};
  $("#restart").onclick=function(){
    if(this.dataset.sure!=="1"){
      this.dataset.sure="1";this.textContent="Tap again to begin at chapter 1";
      var btn=this;setTimeout(function(){if(btn.dataset.sure==="1"){btn.dataset.sure="";btn.textContent="Restart from chapter 1"}},4000);

function setTab(t){
  [].forEach.call(document.querySelectorAll("nav.tabs button"),function(b){
    var on=b.dataset.v===t;
    b.classList.toggle("on",on);
    if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
  });
}
function go(v){
  document.body.classList.remove("welcome");
  view=v;fromTab=v;setTab(v==="today"?"today":v);
  if(window.speechSynthesis)try{speechSynthesis.cancel()}catch(e){}
  speaking=false;
  if(v==="today")chapter(todayN(),true);
  else if(v==="browse")browse();
  else if(v==="journal")journal();
  else pathView();
  window.scrollTo(0,0);
}

function bootIcons(){
  try{
    var icon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0c0b0a"/><circle cx="256" cy="256" r="148" fill="none" stroke="#d6b882" stroke-width="28" stroke-linecap="round" stroke-dasharray="780 190"/><circle cx="256" cy="256" r="16" fill="#7eb8a8"/></svg>');
    var m={name:"Tao — 81 chapters, one a day",short_name:"Tao",start_url:".",display:"standalone",background_color:"#0c0b0a",theme_color:"#0c0b0a",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]};
    var l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l);
    var a=document.createElement("link");a.rel="apple-touch-icon";a.href=icon;document.head.appendChild(a);
    var i=document.createElement("link");i.rel="icon";i.href=icon;document.head.appendChild(i);
  }catch(e){}
}

function boot(){
  if(!N){app.innerHTML="<p style='padding:30px'>No chapters loaded.</p>";return}
  load();
  [].forEach.call(document.querySelectorAll("nav.tabs button"),function(b){b.onclick=function(){go(b.dataset.v)}});
  bootIcons();
  if(!S.welcomed)welcome();
  else{
    if(!S.start){S.start=ymd();save()}
    go("today");
  }
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
