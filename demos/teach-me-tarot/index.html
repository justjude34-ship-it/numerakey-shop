<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Teach Me Tarot">
<title>Teach Me Tarot</title>
<style>
:root{--bg:#0c0a12;--card:#15111f;--card2:#1c1629;--line:#2c2440;--text:#f1ebf7;--muted:#b9aed0;--gold:#e0c27a;--teal:#2ec4b6;--purple:#9b5de5;--magenta:#e040b0;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:17px/1.6 Georgia,"Iowan Old Style",Palatino,serif;min-height:100vh;padding-bottom:84px}
h1,h2,h3{font-weight:normal;line-height:1.2}
.grad{background:linear-gradient(90deg,var(--teal),var(--purple),var(--magenta));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px}
.hero{text-align:center;padding:30px 12px 10px}
.hero h1{font-size:2.5rem;letter-spacing:.5px}
.hero p{color:var(--muted);margin-top:8px;font-style:italic}
.hero .fan{display:flex;justify-content:center;gap:0;margin:20px 0 4px;height:190px;overflow:hidden;padding-top:8px}
.hero .fan .c{width:98px;height:max-content;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px #000a;border:1px solid #d9b66a55;transform-origin:50% 120%;margin:0 -16px;background:#000}
.hero .fan .c:nth-child(1){transform:rotate(-12deg) translateY(10px)}
.hero .fan .c:nth-child(2){transform:rotate(-4deg)}
.hero .fan .c:nth-child(3){transform:rotate(4deg)}
.hero .fan .c:nth-child(4){transform:rotate(12deg) translateY(10px)}
.fan svg,.fan img{display:block;width:100%;height:100%;object-fit:cover}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.panel h2{font-size:1.35rem;margin-bottom:8px}
.lead{color:var(--muted)}
.btn{display:inline-block;background:linear-gradient(135deg,var(--teal),var(--purple));color:#07050c;border:0;border-radius:999px;padding:12px 22px;font:inherit;font-size:1rem;cursor:pointer;text-decoration:none;font-weight:bold}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid #d9b66a77}
.btn.small{padding:8px 16px;font-size:.92rem}
.btn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.list{display:grid;gap:10px}
.item{display:flex;gap:14px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit}
.item:hover{border-color:#d9b66a88}
.item .n{flex:0 0 38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid #d9b66a77;color:var(--gold);font-size:.95rem}
.item.done .n{background:linear-gradient(135deg,var(--teal),var(--purple));color:#07050c;border-color:transparent}
.item b{display:block;font-weight:normal;font-size:1.05rem}
.item small{color:var(--muted);font-size:.9rem;line-height:1.35;display:block}
.lock{opacity:.55}
.bar{height:8px;background:#241d36;border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--purple),var(--magenta));width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.back{color:var(--gold);text-decoration:none;font-size:.95rem}
.kick{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:.78rem}
h2.t{font-size:1.9rem;margin:2px 0 6px}
.prose p{margin:0 0 .9em}
.prose h3{font-size:1.2rem;margin:1.2em 0 .4em;color:var(--gold)}
.call{border-left:3px solid var(--teal);background:#12202a;padding:12px 14px;border-radius:0 12px 12px 0;margin:14px 0}
.call.m{border-color:var(--magenta);background:#241322}
.try{border:1px dashed #d9b66a88;border-radius:14px;padding:14px;margin:16px 0}
.try h3{margin-top:0}
.try li{margin:6px 0 6px 20px}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{color:var(--gold);font-weight:normal}
.cardpage{display:grid;gap:18px}
.face{width:min(100%,300px);margin:6px auto;border-radius:14px;overflow:hidden;box-shadow:0 14px 40px #000c,0 0 0 1px #d9b66a44;background:#000;transition:transform .5s}
.face.rev{transform:rotate(180deg)}
.face svg,.face img{display:block;width:100%;height:auto}
.tabs{display:flex;gap:8px;justify-content:center;margin:6px 0 2px}
.tab{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font:inherit;cursor:pointer}
.tab[aria-pressed=true]{color:#07050c;background:linear-gradient(135deg,var(--teal),var(--purple));border-color:transparent;font-weight:bold}
.kw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.kw span{border:1px solid #d9b66a66;color:var(--gold);padding:4px 12px;border-radius:999px;font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.mini{display:block;text-decoration:none;color:inherit;text-align:center;font-size:.78rem;line-height:1.25}
.mini .im{border-radius:8px;overflow:hidden;border:1px solid #2c2440;background:#000;position:relative}
.mini.done .im{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.mini.done .im:after{content:"\2713";position:absolute;right:4px;top:4px;background:var(--teal);color:#07050c;width:18px;height:18px;border-radius:50%;font-size:12px;display:grid;place-items:center;font-weight:bold}
.mini svg,.mini img{display:block;width:100%;height:auto}
.mini span{display:block;margin-top:4px;color:var(--muted)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:18px 0}
.q{margin:14px 0}
.q p{margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt.ok{border-color:var(--teal);background:#0f2a2a}
.opt.no{border-color:var(--magenta);background:#2a1226}
.why{color:var(--muted);font-size:.95rem;margin-top:6px}
textarea{width:100%;min-height:90px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
select{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;max-width:100%}
.spread{display:grid;gap:12px;margin:14px 0}
.slot{display:flex;gap:14px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.slot .t{width:84px;flex:0 0 84px;border-radius:8px;overflow:hidden;cursor:pointer;background:#000;border:1px solid #d9b66a55;perspective:600px}
.slot .t svg,.slot .t img{display:block;width:100%;height:auto}
.slot .t.rev img,.slot .t.rev svg{transform:rotate(180deg)}
.slot b{display:block;font-weight:normal;color:var(--gold)}
.slot small{color:var(--muted)}
.entry{border-top:1px solid var(--line);padding:12px 0}
.entry small{color:var(--muted)}
.foot{color:var(--muted);font-size:.85rem;text-align:center;padding:18px 16px 6px}
.dock{position:fixed;left:0;right:0;bottom:0;background:#0c0a12ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
.dock a{color:var(--muted);text-decoration:none;font-size:.78rem;text-align:center;padding:4px 8px;border-radius:10px;min-width:58px}
.dock a[aria-current=page]{color:var(--gold)}
.dock a b{display:block;font-weight:normal;font-size:1.25rem;line-height:1.1}
.demo{background:linear-gradient(90deg,#2ec4b622,#e040b022);border:1px solid #9b5de566;border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.92rem;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function artSVG(c){

  else if(c.rankIdx<10){inner=PIPS[c.rankIdx+1].map(function(p){return sym(c.suit,p[0],p[1],c.rankIdx>7?.62:.74)}).join("");}
  else{var crown=[ "M112 178 H188 L180 150 L165 168 L150 140 L135 168 L120 150Z","M118 176 H182 L176 154 L150 172 L124 154Z","M108 178 H192 L186 148 L168 166 L150 138 L132 166 L114 148Z","M104 180 H196 L192 140 L172 160 L150 128 L128 160 L108 140Z"][c.rankIdx-10];
    inner='<circle cx="150" cy="220" r="86" fill="url(#gl)"/><path d="'+crown+'" fill="#e0c27a44" stroke="'+GOLD+'" stroke-width="3" stroke-linejoin="round"/><circle cx="150" cy="212" r="26" fill="none" stroke="'+GOLD+'" stroke-width="3"/><path d="M96 330 C96 268 204 268 204 330" fill="none" stroke="'+GOLD+'" stroke-width="3"/>'+sym(c.suit,150,300,.75)+'<text x="150" y="365" text-anchor="middle" fill="'+GOLD+'" font-size="15" font-family="Georgia,serif" letter-spacing="3">'+esc(c.rank.toUpperCase())+'</text>';}
  var kw=c.kwUp.slice(0,3).join(" • ");
  return '<svg viewBox="0 0 300 450" role="img" aria-label="'+esc(c.name)+'" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9b5de5" stop-opacity=".45"/><stop offset="1" stop-color="#9b5de5" stop-opacity="0"/></radialGradient><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0912"/><stop offset=".6" stop-color="#171028"/><stop offset="1" stop-color="#0b0912"/></linearGradient></defs><rect width="300" height="450" fill="url(#bg)"/>'
  +(maj?'<circle cx="150" cy="235" r="120" fill="url(#gl)"/>':'')
  +'<rect x="9" y="9" width="282" height="432" rx="14" fill="none" stroke="'+GOLD+'" stroke-width="2"/><rect x="17" y="17" width="266" height="416" rx="9" fill="none" stroke="'+GOLD+'" stroke-opacity=".5" stroke-width="1"/>'
  +'<path d="M30 52 q10 -22 32 -22 M270 52 q-10 -22 -32 -22 M30 398 q10 22 32 22 M270 398 q-10 22 -32 22" fill="none" stroke="'+GOLD+'" stroke-width="2" stroke-linecap="round"/>'
  +'<text x="150" y="62" text-anchor="middle" fill="'+GOLD+'" font-family="Georgia,serif" font-size="'+(title.length>16?21:25)+'">'+title+'</text>'
  +inner
  +'<text x="150" y="405" text-anchor="middle" fill="#cdbfe6" font-family="Georgia,serif" font-size="11.5">'+esc(kw)+'</text></svg>';
}

 {h:"What tarot is (and is not)",p:["A tarot deck has 78 cards, each with a picture and a set of meanings. It began in fifteenth-century Italy as a card game and was later adopted for divination and self-reflection.","Today most people use it as a way of thinking. You ask a question, draw a card, and let the picture start a conversation with yourself. The card is a mirror. It does not tell you your fate, and it can't make decisions for you."]},

  +'<div class="tabs"><button class="tab" data-rev="0" aria-pressed="'+(!REV)+'">Upright</button><button class="tab" data-rev="1" aria-pressed="'+REV+'">Reversed</button></div>'
  +'<div id="cardbody">'+body()+'</div>'
  +'<div class="nav">'+(p?'<a class="btn ghost small" href="#/card/'+p.id+'">← '+esc(p.name.length>16?"Previous":p.name)+'</a>':'<span></span>')+'<button class="btn small" id="studied">'+(S.studied[id]?"Studied ✓":"Mark as studied")+'</button>'+(nextOpen?'<a class="btn ghost small" href="#/card/'+n.id+'">'+esc(n.name.length>16?"Next":n.name)+' →</a>':'<a class="btn ghost small" href="#/">Home</a>')+'</div></div>'+foot()+'</div>'
}
/* practice */
var P={spread:"one",cards:[],flipped:[],note:""};
function practice(){
  if(DEMO)return'<div class="wrap"><span class="kick">Practice</span><h2 class="t grad">Practice readings</h2>'+demoNote()+'<div class="panel"><h2>In the full course</h2><p class="lead">Draw one card, a three-card spread or a full Celtic Cross, flip each card, and save your readings to a journal. The full app also has a card quiz.</p></div>'+foot()+'</div>';
  var sp=SPREADS[P.spread];
  var h='<div class="wrap"><span class="kick">Practice</span><h2 class="t grad">Practice readings</h2><p class="lead">Ask an open question, choose a spread, then tap each card to turn it over.</p>'
  +'<div class="panel"><div class="row"><label for="sp">Spread</label><select id="sp">'+Object.keys(SPREADS).map(function(k){return'<option value="'+k+'"'+(k===P.spread?' selected':'')+'>'+SPREADS[k].n+'</option>'}).join("")+'</select><button class="btn small" id="deal">Shuffle and deal</button></div><p class="lead" style="margin-top:8px">'+esc(sp.d)+'</p></div>';
  if(P.cards.length){
    h+='<div class="spread">'+P.cards.map(function(c,i){var fl=P.flipped[i];var pos=sp.pos[i];
      return'<div class="slot"><div class="t'+(fl&&c.rev?' rev':'')+'" data-i="'+i+'" role="button" tabindex="0" aria-label="Turn card '+(i+1)+'">'+(fl?art(c):backArt())+'</div><div><b>'+esc(pos[0])+'</b><small>'+esc(pos[1])+'</small>'+(fl?'<p style="margin-top:6px"><b style="color:var(--text)">'+esc(c.name)+(c.rev?' (reversed)':'')+'</b><br><span class="lead">'+esc((c.rev?c.kwRev:c.kwUp).join(" • "))+'</span></p><p style="font-size:.95rem">'+esc(c.rev?c.rm:c.um)+'</p><a class="back" href="#/card/'+c.id+'">Read the card page →</a>':'<p class="lead" style="margin-top:6px">Tap the card to turn it over.</p>')+'</div></div>'}).join("")+'</div>';
    var all=P.flipped.length&&P.flipped.every(Boolean);
    if(all)h+='<div class="panel"><h2>Tell the story</h2><p class="lead">Look at the whole spread first. What is the mood? Then join the cards into two or three sentences.</p><textarea id="pnote" placeholder="What do you notice?">'+esc(P.note)+'</textarea><p style="margin-top:10px"><button class="btn small" id="savej">Save to journal</button></p></div>';
  }
  return h+foot()+'</div>'
}
function dealNow(){var n=SPREADS[P.spread].pos.length;P.cards=shuffle(CARDS).slice(0,n).map(function(c){var o={};for(var k in c)o[k]=c[k];o.rev=Math.random()<.5;return o});P.flipped=P.cards.map(function(){return false});P.note=""}
/* quiz */
var QZ=null;
function quiz(){
  if(DEMO)return'<div class="wrap"><span class="kick">Quiz</span><h2 class="t grad">Card quiz</h2>'+demoNote()+'<div class="panel"><h2>In the full course</h2><p class="lead">Ten keyword questions every round, drawn from all 78 cards. The demo has a quick quiz at the end of each of its lessons.</p></div>'+foot()+'</div>';
  if(!QZ||QZ.i>=QZ.q.length){
    var fin=QZ&&QZ.i>=QZ.q.length;
    if(fin&&QZ.score>S.best){S.best=QZ.score;save()}
    var msg=fin?'<div class="panel"><h2>You scored '+QZ.score+' of '+QZ.q.length+'</h2><p class="lead">Best so far: '+S.best+'</p></div>':"";
    return'<div class="wrap"><span class="kick">Quiz</span><h2 class="t grad">Card quiz</h2><p class="lead">Ten questions. You see three keywords and pick the card they belong to.</p>'+msg+'<p style="margin-top:12px"><button class="btn" id="qstart">'+(fin?'Play again':'Start the quiz')+'</button></p>'+foot()+'</div>'
  }
  var q=QZ.q[QZ.i];
  return'<div class="wrap"><span class="kick">Question '+(QZ.i+1)+' of '+QZ.q.length+'</span><h2 class="t">Which card is this?</h2><div class="panel"><div class="kw">'+q.c.kwUp.map(function(k){return'<span>'+esc(k)+'</span>'}).join("")+'</div></div><div id="qo">'+q.o.map(function(o,i){return'<button class="opt" data-o="'+o.id+'">'+esc(o.name)+'</button>'}).join("")+'</div><div class="why" id="qw" hidden></div><p style="margin-top:12px"><button class="btn small" id="qnext" hidden>Next →</button></p></div>'
}
function startQuiz(){var qs=shuffle(CARDS).slice(0,10).map(function(c){var same=CARDS.filter(function(x){return x.id!==c.id&&x.arcana===c.arcana&&(x.suit||"")===(c.suit||"")});var wrong=shuffle(same.length>=3?same:CARDS.filter(function(x){return x.id!==c.id})).slice(0,3);return{c:c,o:shuffle([c].concat(wrong))}});QZ={q:qs,i:0,score:0}}
/* journal */
function journal(){
  var h='<div class="wrap"><span class="kick">Journal</span><h2 class="t grad">Your journal</h2><p class="lead">Saved readings, kept only on this device.</p>';
  if(!S.journal.length)h+='<div class="panel"><p class="lead">Nothing saved yet. Do a practice reading and save it here.</p></div>';
  h+=S.journal.slice().reverse().map(function(e,ri){var i=S.journal.length-1-ri;var d=new Date(e.ts);return'<div class="entry"><small>'+d.toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})+' • '+esc(e.spread)+'</small><p style="margin:4px 0"><b>'+esc(e.cards.join(", "))+'</b></p>'+(e.note?'<p class="lead">'+esc(e.note)+'</p>':'')+'<button class="btn ghost small" data-del="'+i+'">Delete</button></div>'}).join("");
  return h+foot()+'</div>'
}
function more(){
  return'<div class="wrap"><span class="kick">More</span><h2 class="t grad">More</h2><div class="list" style="margin-top:12px"><a class="item" href="#/quiz"><span class="n">?</span><span><b>Card quiz</b><small>Ten keyword questions</small></span></a><a class="item" href="#/journal"><span class="n">✎</span><span><b>Journal</b><small>Your saved readings</small></span></a></div>'
  +'<div class="panel"><h2>Back up your progress</h2><p class="lead">Everything is stored on this device only. Save a backup file if you want to keep your journal safe or move it to another device.</p><p style="margin-top:10px" class="row"><button class="btn small" id="bk">Save a backup</button><button class="btn ghost small" id="rs">Restore from a backup</button><input type="file" id="rsf" accept="application/json,.json" hidden></p></div>'
  +'<div class="panel"><h2>About this course</h2><p class="lead">Teach Me Tarot teaches the classic 78-card structure with its own plain-language text. It works with any deck. The cards pictured are from the Lumen deck where available. Everything runs on this device, with no account and nothing sent anywhere.</p></div>'+foot()+'</div>'
}

/* ---------- router ---------- */
function route(){
  var h=location.hash||"#/";var m;var html;
  if(h==="#/"||h==="")html=home();
  else if(h==="#/lessons")html=lessons();
  else if(m=h.match(/^#\/lesson\/(\d+)$/))html=lesson(+m[1]);
  else if(h==="#/major")html=majors();
  else if(h==="#/suits")html=suits();
  else if(m=h.match(/^#\/suit\/(\w+)$/))html=suit(m[1]);
  else if(m=h.match(/^#\/card\/(\d+)$/))html=card(m[1]);
  else if(h==="#/practice")html=practice();
  else if(h==="#/quiz")html=quiz();
  else if(h==="#/journal")html=journal();
  else if(h==="#/more")html=more();
  else if(h==="#/locked")html=locked();
  else html=home();
  app.innerHTML=html;drawDock(h);window.scrollTo(0,0);wire(h)
}
function wire(h){
  var m;
  if(m=h.match(/^#\/lesson\/(\d+)$/)){
    var i=+m[1];var L=LESSONS[i];if(!L)return;
    document.querySelectorAll(".q").forEach(function(box){var qi=+box.getAttribute("data-q");var x=L.quiz[qi];box.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(box.getAttribute("data-done"))return;box.setAttribute("data-done","1");var a=+b.getAttribute("data-a");b.classList.add(a===x.c?"ok":"no");if(a!==x.c)box.querySelectorAll(".opt")[x.c].classList.add("ok");var w=box.querySelector(".why");w.hidden=false;w.textContent=x.w}})});
    var d=$("#done");if(d)d.onclick=function(){S.lessons[i]=true;save();d.textContent="Done ✓"};
  }
  if(h==="#/practice"&&!DEMO){
    $("#sp").onchange=function(){P.spread=this.value;P.cards=[];P.flipped=[];route2()};
    $("#deal").onclick=function(){dealNow();route2()};
    document.querySelectorAll(".slot .t").forEach(function(t){var go=function(){var i=+t.getAttribute("data-i");P.flipped[i]=true;var y=window.scrollY;route2();window.scrollTo(0,y)};t.onclick=go;t.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
    var n=$("#pnote");if(n)n.oninput=function(){P.note=n.value};
    var sj=$("#savej");if(sj)sj.onclick=function(){S.journal.push({ts:Date.now(),spread:SPREADS[P.spread].n,cards:P.cards.map(function(c){return c.name+(c.rev?" (reversed)":"")}),note:P.note});save();sj.textContent="Saved ✓";sj.disabled=true};
  }
  if(h==="#/quiz"&&!DEMO){
    var qs=$("#qstart");if(qs)qs.onclick=function(){startQuiz();route2()};
    var qo=$("#qo");if(qo){qo.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){if(qo.getAttribute("data-done"))return;qo.setAttribute("data-done","1");var q=QZ.q[QZ.i];var id=+b.getAttribute("data-o");var ok=id===q.c.id;if(ok)QZ.score++;b.classList.add(ok?"ok":"no");qo.querySelectorAll(".opt").forEach(function(x){if(+x.getAttribute("data-o")===q.c.id)x.classList.add("ok")});var w=$("#qw");w.hidden=false;w.textContent=q.c.name+": "+q.c.um;var nx=$("#qnext");nx.hidden=false;nx.onclick=function(){QZ.i++;route2()}}})}
  }
  if(h==="#/journal"){document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){S.journal.splice(+b.getAttribute("data-del"),1);save();route2()}})}
  if(h==="#/more"){
    $("#bk").onclick=function(){var b=new Blob([JSON.stringify(S)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="teach-me-tarot-backup.json";document.body.appendChild(a);a.click();a.remove()};
    $("#rs").onclick=function(){$("#rsf").click()};
    $("#rsf").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);S={studied:o.studied||{},lessons:o.lessons||{},journal:Array.isArray(o.journal)?o.journal:[],best:o.best||0};save();alert("Backup restored.");route()}catch(e){alert("That file could not be read.")}};r.readAsText(f)};
  }
}
function route2(){var y=window.scrollY;var h=location.hash||"#/";app.innerHTML=({"#/practice":practice,"#/quiz":quiz,"#/journal":journal})[h]();wire(h);window.scrollTo(0,y)}
window.addEventListener("hashchange",route);route();
})();
</script>
</body>
</html>
