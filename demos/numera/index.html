se deserves changing."},empty:{name:"Arrow of Hesitancy",alias:"Procrastination",text:"Difficulty getting started and following through; you wait for the perfect moment.",tip:"Commit to small immediate actions; done beats perfect."}},{id:"compassion",numbers:[3,5,7],orientation:"diagonal",strength:{name:"Arrow of the Compassionate",alias:"Arrow of Spirituality",text:"A deeply compassionate, sympathetic nature with genuine spiritual awareness. You feel other people's pain and are drawn to heal, counsel or serve. Caution: absorbing others' burdens until you are drained."},empty:{name:"Arrow of Scepticism",text:'A questioning, "prove-it" nature that distrusts anything intangible.',tip:"Keep the healthy scepticism, but allow direct experience to teach you as well as evidence."}},{id:"intellect",numbers:[3,6,9],orientation:"across",strength:{name:"Arrow of the Intellect",text:"A powerful, agile mind — excellent memory, sharp analysis and a thirst for knowledge. Superb reasoning power. Caution: living in the head and analysing feelings instead of feeling them."},empty:{name:"Arrow of Poor Memory",text:"Names, dates and details slip away.",tip:"Lists, journals and repetition; you retain what you actively record."}},{id:"emotional-balance",numbers:[2,5,8],orientation:"across",strength:{name:"Arrow of Emotional Balance",text:"Rare and beautiful. Emotional equilibrium, poise and serenity under pressure. Others come to you as an anchor. Caution: emotional detachment can read as coolness."},empty:{name:"Arrow of Hypersensitivity",text:"Feelings bruise easily and criticism cuts deep.",tip:"Build a buffer between what is said and what you accept as true."}},{id:"practical",numbers:[1,4,7],orientation:"across",strength:{name:"Arrow of the Practical",text:"Grounded, methodical, hands-on capability. You build things that last and prefer the tangible to the theoretical. Caution: rigidity and suspicion of the abstract or spiritual."},empty:{name:"Arrow of Impracticality",alias:"the Frustrated Order",text:"Practical detail and physical order feel like an uphill climb.",tip:"Build simple systems and let others handle what drains you."}},{id:"planner",numbers:[1,2,3],orientation:"down",strength:{name:"Arrow of the Planner",text:"Superb organisational mind — you see the whole plan before you start and set things out in orderly sequence. Excellent administrator. Caution: over-planning at the expense of doing."},empty:{name:"Arrow of Confusion",alias:"Disorder",text:"Difficulty organising thought and sequence; the plan scatters.",tip:"Write the steps down before acting; structure imposed from outside becomes freedom."}},{id:"will",numbers:[4,5,6],orientation:"down",strength:{name:"Arrow of the Will",text:"Great willpower and self-determination. You cannot be pushed around and will follow your own path regardless of pressure. Caution: obstinacy and a fixed refusal to be advised."},empty:{name:"Arrow of Frustration",text:"A feeling that effort meets a wall — repeated setbacks that test resolve.",tip:"Treat frustration as a training ground for patience and persistence."}},{id:"activity",numbers:[7,8,9],orientation:"down",strength:{name:"Arrow of Activity",text:"Restless physical and mental energy. Constantly busy, active, doing. Caution: burnout and inability to sit still or rest."},empty:{name:"Arrow of Passivity",alias:"Lethargy",text:"Low natural drive to act; things get put off.",tip:"Momentum is generated, not waited for — schedule activity rather than waiting for the urge."}}],ln={1:{digit:1,title:"The Ego / Self-Expression",keyword:"Self-Expression",subtitle:"How you express who you are",absent:"Extremely rare. Great difficulty putting the self into words; identity expressed through action rather than speech.",tiers:[{min:1,max:1,label:"one 1",text:"Finds it hard to express innermost feelings and thoughts; means well but the words don't come out. Learning to communicate the self is a life task."},{min:2,max:2,label:"two 1s",text:"The balanced position. Expresses thoughts and feelings clearly, honestly and easily. The most comfortable expression of the ego."},{min:3,max:3,label:"three 1s",text:"Swings between chattering and complete silence. Talks a great deal when comfortable, clams up entirely when not. Needs to find the middle."},{min:4,max:4,label:"four 1s",text:"Over-expression of self — talks too much, or over-corrects into deep introversion. Strong ego that must be consciously modulated."},{min:5,max:5,label:"five 1s",text:"An intense, forceful ego. Powerful presence and a tendency to dominate conversation; humility is the lesson."},{min:6,max:1/0,label:"six or more 1s",text:"A rare concentration of ego energy. Enormous self-expressive force that must be directed to serve others, not the self alone."}]},2:{digit:2,title:"Intuition & Sensitivity",keyword:"Intuition",subtitle:"The antenna",absent:"Little natural intuition; you trust logic and evidence. Sensitivity to others must be consciously learned.",tiers:[{min:1,max:1,label:"one 2",text:"Sensitive, tactful and perceptive. Reads atmospheres and people well; good with detail."},{min:2,max:2,label:"two 2s",text:"Highly intuitive, close to psychic. Feels others' moods as if they were your own — powerful gift, exhausting if unguarded."},{min:3,max:1/0,label:"three or more 2s",text:"Extreme sensitivity. Deeply intuitive but easily overwhelmed by crowds, conflict and other people's emotions. Protection and solitude are necessities, not luxuries."}]},3:{digit:3,title:"The Mind, Memory & Imagination",keyword:"Mind",subtitle:"Memory, thought and imagination",absent:"Memory and imagination need deliberate training; you learn through doing rather than picturing.",tiers:[{min:1,max:1,label:"one 3",text:"A good, active mind with a healthy imagination and aptitude for words and ideas."},{min:2,max:2,label:"two 3s",text:"A sharp intellect with vivid imagination and quick mental agility. Strong literary or artistic potential; can overthink."},{min:3,max:3,label:"three 3s",text:"A brilliant but scattered mind. Imagination can run to daydreaming, exaggeration or escapism. Enormous creative potential when focused."},{min:4,max:1/0,label:"four or more 3s",text:"Mental energy in overload — extraordinary imagination that must be given a disciplined outlet or it turns to fantasy and worry."}]},4:{digit:4,title:"Practicality & The Physical",keyword:"Practicality",subtitle:"Hands, order and the tangible",absent:"Not naturally practical or hands-on; theory appeals more than tools. Practical skill must be learned deliberately.",tiers:[{min:1,max:1,label:"one 4",text:"Practical, capable and methodical. Good with the hands and with physical order."},{min:2,max:2,label:"two 4s",text:"Highly practical and physically industrious. A natural builder, organiser and doer; happiest when busy with real things."},{min:3,max:1/0,label:"three or more 4s",text:"Intensely physical and work-driven, to the point of workaholism. Learning to rest is the lesson."}]},5:{digit:5,title:"Feeling, Emotion & Freedom",keyword:"Feeling",subtitle:"The heart centre of the chart",absent:"Emotion is held back and hard to express; deep feelings exist but rarely surface. Relationships are the teacher.",tiers:[{min:1,max:1,label:"one 5",text:"A balanced, controlled feeling nature. Emotions are felt genuinely and expressed appropriately."},{min:2,max:2,label:"two 5s",text:"Deep emotional intensity and a passionate love of freedom. Feels everything strongly; travel and variety feed the soul."},{min:3,max:3,label:"three 5s",text:"Highly emotional and restless. Loves fiercely, hurts deeply, resists all confinement. Emotional discipline is the great lesson."},{min:4,max:1/0,label:"four or more 5s",text:"Emotional overload — extraordinary depth of feeling that can swamp reason. Must learn to channel rather than suppress."}]},6:{digit:6,title:"Creativity, Home & Family",keyword:"Creativity",subtitle:"The domestic and artistic square",absent:"Creative and domestic expression is undeveloped; must be consciously cultivated.",tiers:[{min:1,max:1,label:"one 6",text:"Genuine creative potential and a caring, home-loving nature."},{min:2,max:2,label:"two 6s",text:"Strong creative drive and deep devotion to family and home. Often artistic, musical or beautifully practical in the domestic sphere."},{min:3,max:1/0,label:"three or more 6s",text:"Over-attachment to home and family — worry, possessiveness and self-sacrifice for loved ones. The creative gift must be given an outlet beyond the household."}]},7:{digit:7,title:"Learning Through Experience & Sacrifice",keyword:"Experience",subtitle:"The teacher square",absent:"Life teaches you by gentler means; fewer hard losses, but wisdom must be sought deliberately.",tiers:[{min:1,max:1,label:"one 7",text:"Learns through direct experience — some losses and sacrifices that mature you into a philosophical outlook."},{min:2,max:2,label:"two 7s",text:"Significant learning through loss and sacrifice. Deep spiritual understanding earned the hard way; a natural teacher and healer."},{min:3,max:1/0,label:"three or more 7s",text:"Heavy sacrifices and profound spiritual testing. The pain is not meaningless — it is the raw material of exceptional wisdom, and it is meant to be passed on."}]},8:{digit:8,title:"Order, Method & Independence",keyword:"Order",subtitle:"Wisdom in action",absent:"Order and method don't come naturally; systems must be built consciously.",tiers:[{min:1,max:1,label:"one 8",text:"Methodical, tidy and detail-conscious. A good, orderly mind."},{min:2,max:2,label:"two 8s",text:"Highly organised and mentally restless, with real business acumen and a fierce streak of independence."},{min:3,max:1/0,label:"three or more 8s",text:"Obsessive orderliness and constant restless motion. Enormous capability, but it must be paced."}]},9:{digit:9,title:"Ambition, Idealism & Humanitarianism",keyword:"Idealism",subtitle:"The humanitarian square",absent:"(Only in pre-1900 births.) Idealism must be actively develop The early part of a 1 life often involves borrowed authority. You work under someone, follow a family script, or shape yourself around a stronger personality. The turning point comes when you stop asking permission. Everything that reads as difficulty before that point tends to read as momentum after it.

The shadow is the version of independence that hardens into isolation — refusing help you genuinely need, mistaking stubbornness for strength, competing where cooperation would serve you better. The mature 1 leads without needing to dominate, and can say 'I was wrong' without feeling the ground move.`,expression:`Your natural equipment is originality and drive. You see the direct route while other people are still discussing the map, and you would rather build something imperfect and yours than something polished and borrowed. Starting things is your gift — the first version, the new department, the business nobody else believed in.

The work to be done is finishing, and delegating. A 1 Expression can start five things brilliantly and complete none, because the thrill lives in the launch. Learn to hand over the middle section to people who love maintenance the way you love beginnings, and your output multiplies.

You also carry a directness that lands as refreshing to some and abrasive to others. Soften the delivery, never the substance. Your value to any room is that you will say the thing everyone is thinking.`,soulUrge:`Underneath everything, what you want is to be your own authority. Not fame, not necessarily wealth — autonomy. The freedom to make the call and live with it. Being managed, monitored or second-guessed drains you faster than hard work ever will.

This is why you can be perfectly happy working brutal hours on your own project and miserable doing half that in someone else's system. The heart wants ownership. Any life design that gives you a genuine sphere of control — however small — will feel right.

Watch the loneliness this can create. A 1 Soul Urge often does not ask for support because asking feels like admitting dependence. The people around you would help if you let them see the strain.`,personality:`People meet someone who looks capable and slightly separate. You come across as self-contained, decisive, a little ahead of the conversation. Strangers assume you are in charge before you have said anything that proves it, and they are often right.

The cost is approachability. What you experience as focus reads to others as unavailability, and people can feel they need an appointment to talk to you. Small deliberate warmth — asking a question, remembering a detail — dissolves that instantly and costs you nothing.

You also project certainty even when you do not feel it, which means people rarely check whether you are all right. Say it out loud when you are not.`,birthday:"You were born with a gift for initiative. When a situation stalls, you are the one who moves first, and that single quality has quietly redirected more of your life than you realise. Original solutions arrive naturally to you.",maturity:"From your late thirties onward, life pushes you toward standing fully in your own name. Whatever you have been building under someone else's banner wants to become yours. Expect a chapter where you go independent, take the lead role, or finally back your own judgement without a committee behind it."},2:{key:"2",keyword:"The Diplomat",lifePath:`Your lifetime is a study in partnership, patience and the power of the quieter position. You are here to learn that influence does not require the loudest voice — that the person who holds the room together often shapes the outcome more than the person at the front of it.

Relationships are your main classroom. Not only romance: business partners, collaborators, the difficult colleague, the parent whose approval you wanted. Each one teaches the same lesson from a different angle — how to stay yourself while genuinely meeting someone else. You feel the emotional weather of a room before anyone speaks, and that sensitivity is a working instrument, not a weakness.

The trap is self-erasure. A 2 can become so skilled at accommodating that it forgets what it wanted. The lesson completes when you can keep your own position and the peace at the same time, and can tolerate someone being briefly unhappy with you.`,expression:`You work through cooperation, tact and attention to what others miss. You notice the detail, the tone, the unspoken objection — and you can raise it without triggering defensiveness. That is a rare professional skill and it is genuinely yours.

The work is to claim your contribution. A 2 Expression tends to do the essential invisible labour and then watch someone else describe it in the meeting. Learn to say what you did, plainly, without apology. Being valuable and being visible are not the same thing, and you need both.

You also do best with a counterpart. Solo ventures ask you to be your own opposition, which is exhausting. Find the partner, the co-founder, the editor — your quality rises sharply against another mind.`,soulUrge:`What your heart actually wants is peace, and to be genuinely close to someone. Not admiration — companionship. The sense that there is at least one person who knows the whole picture and stays.

This makes you loyal past the point of good sense sometimes. You will hold on to a relationship or a role long after the evidence is in, because ending it feels like a failure of love. Learn to tell the difference between commitment and endurance.

When the closeness is real, you are extraordinarily happy on very little. Status barely moves you. A calm home and honest company is most of what you need.`,personality:`You come across as warm, considered and easy to be near. People tell you things they have not told anyone. You have a low-threat presence that makes rooms relax, and you rarely make an enemy on first meeting.

The risk is being underestimated. Gentleness reads as softness to people who mistake volume for strength, and you may be handed the supportive role by default. Correct that early with one clear, direct statement of what you want — it surprises people, and it resets the assumption permanently.

Others also mistake your listening for agreement. Say when you disagree; you have the tact to make it land well.`,birthday:"You were born with an instinct for timing and for people. You can read a mood in seconds and know exactly when to speak and when to wait — a gift that resolves situations other people escalate.",maturity:"From your late thirties, the emphasis shifts toward relationship, mediation and shared work. Life tends to hand you the role of the person who holds things together — the bridge between factions, the steady centre of a family or a team. It will feel less like ambition and more like being needed, and it will suit you."},3:{key:"3",keyword:"The Communicator",lifePath:`Your lifetime is about expression — finding your voice and using it in the open. Words, images, performance, teaching, design: some channel where what is inside you gets out and lands on other people. When that channel is open, your life works. When it closes, everything else clogs up with it.

The test is scattering. Three is the number of abundant creative energy, and it arrives faster than you can develop it. You can spend decades with eleven interesting half-projects and nothing finished, mistaking activity for output. The lesson is depth: choosing one thing and staying with it past the exciting part.

There is also an emotional dimension. Many 3s learn early to be the entertaining one, the light one — and then find it very hard to be seen struggling. Real expression includes the difficult material. When you let people see that too, your work stops being charming and starts being important.`,expression:`You have an unusual facility with language and imagination. You can make a complicated thing simple, a dull thing interesting, and a tense room laugh. Whatever your job title, you are in communication, and your career improves the moment you accept that.

The work to be done is discipline and follow-through. Talent this fluent rarely gets tested early, so structure never gets built. Deadlines, editors, a daily practice — anything that forces the second and third draft — will do more for you than another burst of inspiration.

Guard against using charm to avoid depth. You can talk your way past most obstacles, which means you can also talk your way past the ones you were supposed to go through.`,soulUrge:`Your heart wants joy and it wants an audience — not vanity, but the specific happiness of making something and having it received. You need beauty around you, colour, music, good conversation. Grey environments genuinely dim you.

You also want to be liked, and that is worth watching. It can make you agreeable when you should be honest, or performative when you should be quiet. The people who matter want the real version, including the unfunny days.

When creative expression is missing from your life, it does not disappear — it turns into restlessness, gossip, or a low unexplained sadness. Put the outlet back and the mood lifts within weeks.`,personality:`You read as bright, expressive and good company. You have presence in a room — people look up when you arrive and remember you afterwards. Style matters to you and it shows.

The assumption you will fight is that light means unserious. People underestimate your depth because the surface is so pleasant. Let them see the work behind it occasionally; the contrast is compelling.

You also broadcast more emotion than you realise. Your face tells the truth before your words do, which makes you a poor liar and a very convincing enthusiast.`,birthday:"You were born with a natural gift for words and delight — the ability to lift a room, phrase a thing memorably, and find the interesting angle on almost any subject. It opens doors that credentials do not.",maturity:"From your late thirties, life pushes you toward expression on a larger scale — the book, the teaching, the public role, the creative work you kept private. What was a hobby becomes the point. Many people with this maturity number find their most visible chapter starts around fifty."},4:{key:"4",keyword:"The Builder",lifePath:`Your lifetime is about building something solid and learning to trust process over luck. You are here to become the person who can be relied on absolutely — and to find out what that costs and what it is worth.

Work arrives early and often for a 4 life. There is frequently a stretch of genuine limitation — money, health, family responsibility — that removes shortcuts and teaches method. That period is not a detour; it is the training. What you build afterwards holds because you learned to lay foundations when nobody was watching.

The shadow is rigidity: mistaking the system for the goal, refusing a better route because it is unfamiliar, working past the point where the work still serves you. The mature 4 keeps the discipline and loosens the grip. Rest is part of the method, not a failure of it.`,expression:`Your gift is order. You can see how a thing should be constructed, in what sequence, and where it will fail — and you have the patience to actually do it. Give a 4 Expression a chaotic situation and it comes back organised, documented and durable.

The work is flexibility and delegation. You genuinely believe it is faster to do it yourself, and often it is, which is precisely how you end up carrying everything. Teach the system instead of performing it.

You also undersell. Practical competence is quiet and does not announce itself, so people take it for granted. Keep a record of what you have built; you will need it when it is time to be paid properly.`,soulUrge:`What you want underneath is security — a life that does not wobble. A home that is yours, work that will still be there next year, people who do what they said they would do. It is not a small ambition; it is the ambition, and it is unfashionable to admit.

Because of this, uncertainty hits you harder than it hits most. You would rather have a modest certain thing than a brilliant risky one, and you should design your life accordingly rather than pretending otherwise.

The trap is postponement. A 4 heart can defer every pleasure until the foundation is finished, and the foundation is never finished. Build in the enjoyment now, deliberately, as part of the plan.`,personality:`People meet someone dependable, grounded and straight. You look like the person who will still be standing there when everyone else has gone home, and you usually are. Your word carries weight because you do not spend it lightly.

The cost is being seen as immovable. Others may not bring you their wild idea because they assume you will crush it, and sometimes you would. Say yes to one unproven thing publicly and watch how it changes what people bring you.

You also project more sternness than you feel. A little visible humour goes a long way against that.`,birthday:"You were born with a builder's hands and a builder's patience. Where others see an overwhelming mess, you see the first three steps — and you will still be working on it long after the enthusiasts have left.",maturity:"From your late thirties, life asks you to consolidate: property, institution, the long project, the thing with your name on it that outlasts you. There is often a marked increase in responsibility and in stability at the same time. What you build in this chapter tends to be the thing you are remembered for."},5:{key:"5",keyword:"The Free Spirit",lifePath:`Your lifetime is about freedom and the constructive use of change. You are here to experience widely — places, people, ideas, appetites — and to learn to steer that hunger rather than be dragged by it.

A 5 life rarely runs in a straight line. Careers change, countries change, the plan at twenty-five bears no resemblance to the life at forty-five, and that is not failure — it is the design. You learn by contact, not by theory, and you will trust nothing you have not personally tested.

The lesson is the difference between freedom and escape. Freedom is choosing to stay as much as choosing to leave. When restlessness runs unexamined it burns through relationships, money and health at speed. Commit to something — one person, one craft, one place — and let the variety happen inside that frame. That is where a 5 life becomes remarkable instead of merely eventful.`,expression:`You are versatile, quick and persuasive — you learn fast, adapt faster, and can sell an idea to a room that walked in sceptical. Change does not frighten you, which makes you enormously useful in any situation that is in flux.

The work is depth and completion. You reach competence quickly and then get bored precisely where mastery begins. The people who go past that point are not more talented than you; they simply stayed. Pick one thing and stay past the boredom once — it changes your whole relationship with your own ability.

Overuse of the gift looks like scattering: too many irons, too many tabs, promises made in enthusiasm and quietly dropped. Fewer commitments, better kept.`,soulUrge:`Your heart wants the open road — variety, sensation, the next thing. Being fenced in makes you physically uncomfortable, and any arrangement that removes your options will eventually be sabotaged, consciously or not.

The honest version of this is to build a life with genuine escape valves rather than pretending you do not need them: work that travels, a schedule with air in it, a partner who does not need you in the same chair every evening.

Watch the appetite side. Five governs the senses, and the same drive that makes you adventurous makes you susceptible — to substances, to spending, to the affair that costs everything. The discipline you resist is the thing that keeps the freedom intact.`,personality:`You come across as energetic, magnetic and interesting. You are good at first meetings — quick, funny, curious about people — and you can enter almost any social situation and find your footing within minutes.

What people are less sure of is whether you will still be here next year. Your evident freedom can read as unreliability, and it will cost you opportunities that go to steadier-seeming candidates. Visible follow-through is your best correction.

You also change register easily, which is a real charm and occasionally makes people wonder which version is the real one. It is all real; say so.`,birthday:"You were born adaptable — able to land in an unfamiliar situation and be useful in it within a day. That resilience, plus a genuine curiosity about people, gets you through doors that qualifications do not open.",maturity:"From your late thirties, life opens up rather than narrowing. Expect travel, a change of direction, or a freedom you did not have earlier — often after a period of obligation ends. The task is to use the freedom for something, not simply to enjoy having it."},6:{key:"6",keyword:"The Nurturer",lifePath:`Your lifetime is about responsibility, home and love given in practical form. People end up leaning on you — family, friends, colleagues — and the arc of your life is decided by how well you learn to carry that without resentment and without taking over.

There is usually a large early duty in a 6 life: a family situation, an ill parent, a sibling you effectively raised, a business you held together. It shapes you into someone unusually capable of care, and it can also leave you convinced that your needs come last.

The lesson is balanced service. Help that is asked for, not imposed. Support that has an end. Learning to receive as easily as you give is the hardest and most transformative work available to you — and it is the difference between a 6 life that glows and one that quietly martyrs itself.`,expression:`Your natural work is making things right for people: teaching, healing, counselling, feeding, designing spaces where people feel safe. You have an eye for harmony and a genuine talent for making others functional.

The work to be done is boundaries. A 6 Expression takes on the emotional labour of an entire organisation or family without ever being asked to, and then feels unappreciated. Say what you will and will not carry, out loud, in advance.

Beware perfectionism aimed at others. The same standard that makes your work beautiful can become criticism nobody requested. Offer the standard; do not enforce it.`,soulUrge:`What you want is a home worth coming back to and people in it who are all right. Domestic peace is not a consolation prize for you — it is the actual goal, and you will trade a great deal of ambition for it without regret.

You also want to be needed, and it is worth knowing that about yourself. It can lead you to choose people who need fixing over people who are well, and to feel obscurely redundant when everyone around you is thriving.

Beauty matters too. Six is the aesthetic number as well as the domestic one; a home that looks and feels right does more for your state of mind than almost anything else.`,personality:`People meet someone warm, responsible and safe. You are the one strangers ask for directions and colleagues bring problems to. There is an immediate sense that you can be trusted with something that matters.

The consequence is a steady inflow of other people's burdens. If you never signal a limit, you will be handed everything. A pleasant, clear 'not this one' protects the warmth rather than diminishing it.

You also project competence at care so convincingly that people forget to ask how you are. They are not callous; they are following your signal.`,birthday:"You were born with a gift for creating harmony — the ability to walk into a strained situation and settle it, and to make any space feel like somewhere people want to stay. Others rest near you.",maturity:"From your late thirties, the themes of family, home and responsibility come to the centre — often literally, through property, children, or caring for a previous generation. You become the pivot around which a group organises itself, and you are unusually well suited to it if you keep your own life inside the arrangement."}},yj={7:{key:"7",keyword:"The Seeker",lifePath:`Your lifetime is about understanding — going beneath the surface of things until you reach something that is actually true. You are not satisfied by the accepted answer, and you never have been. This makes you a natural analyst, researcher, specialist or contemplative, whatever your job description says.

Solitude is part of the design. A 7 life includes periods of genuine withdrawal, and they are productive rather than sad — it is where your thinking gets done. Trouble comes when the withdrawal becomes permanent and the analysis replaces living.

The classic 7 test is faith versus proof. You will be handed experiences that cannot be reasoned through: a loss, an illness, a love, an intuition that turns out right for no traceable reason. Learning to trust something you cannot evidence — without abandoning your rigour — is the central work of this lifetime.`,expression:`You have a fine analytical mind and a low tolerance for nonsense. You spot the flaw in the argument, the gap in the data, the thing that does not add up, and you can hold a complicated subject in your head long enough to actually master it.

The work is communication and warmth. What is obvious inside your head is not obvious outside it, and if you do not translate, your best work goes unused. Explain more than feels necessary; you are almost never overexplaining.

Specialise. Generalist roles waste you. Depth is where your quality is undeniable, and a 7 who becomes the authority on one narrow thing has a very good career.`,soulUrge:`What your heart wants is truth and quiet. Time alone is not a luxury for you, it is maintenance — you become irritable and vague without it. You would rather have one real conversation a month than twenty pleasant ones.

This makes intimacy complicated. You want to be known, and you make it difficult by being private. The person who gets in will be the one who is comfortable with your silences and does not read them as rejection.

There is often a spiritual or philosophical thread that you rarely discuss. Give it real time rather than treating it as a side interest; it is closer to the centre of you than most of what fills your calendar.`,personality:`You come across as composed, thoughtful and slightly unreadable. People sense there is a great deal going on that you are not saying, and they are right. You are the one at the table whose opinion carries weight precisely because you offer it sparingly.

The cost is coolness. Reserve reads as aloofness or judgement, especially to warmer types, and people can feel evaluated in your presence. A small amount of deliberate openness — an opinion, a personal detail — changes that entirely.

You also look calmer than you are. Internal storms rarely reach your face, so nobody offers help.`,birthday:"You were born with an investigative mind — the instinct to check, to dig, to ask the question nobody asked. You find what other people walk past, and you can concentrate for far longer than the people around you.",maturity:"From your late thirties, life turns inward and upward: study, specialism, teaching, or a genuine spiritual practice. There is often a withdrawal from noise and a deepening of expertise. This is the chapter where the accumulated thinking finally becomes wisdom other people come to you for."},8:{key:"8",keyword:"The Executive",lifePath:`Your lifetime is about power, money and material mastery — learning to handle all three without being handled by them. You are here to build something substantial in the visible world and to discover what it is actually for.

An 8 life typically includes a full swing of the pendulum: real gain and real loss, sometimes more than once. That pattern is not bad luck. It is how the number teaches — you find out what you are underneath the balance sheet, and you learn that money made without judgement leaves the same way it arrived.

The lesson is stewardship. Authority used generously multiplies; authority used for control corrodes. When an 8 finally works for something beyond personal accumulation — people employed, a family secured, a cause funded — the results tend to become disproportionate to the effort.`,expression:`You have executive capability: you can see the whole enterprise, judge people accurately, make hard decisions quickly and carry the responsibility afterwards. Organisation and money are your natural instruments, and you understand leverage instinctively.

The work is trust and delegation without abdication. You know you can do it better, and that belief will cap the size of anything you build. Hire strength, not comfort.

Be careful with bluntness under pressure. You cut to the decision fast, and people who need a moment of process experience that as steamrolling. A little visible respect buys you enormous loyalty.`,soulUrge:`What you actually want is achievement you can point at — status, security, the position that proves the effort was real. There is no use pretending otherwise, and the pretence is what gets 8s into trouble.

Underneath the ambition is usually a memory of not having, or of watching someone be diminished by not having. That is the engine. Know it, because unexamined it will never let you feel you have arrived, no matter what you build.

The satisfaction that actually lasts, for this heart, comes from using what you built for people you care about. Provision, not accumulation.`,personality:`You project authority. People assume you are senior, competent and worth listening to, and they defer before they know why. You handle money, conflict and decisions in public with obvious ease.

The cost is intimidation. Others edit themselves around you and you receive filtered information as a result — which is a genuine strategic problem, not just a social one. Ask direct questions and reward honest answers visibly.

Appearance carries more weight for you than for most. How you present is read as a statement of competence, fairly or not, and it is worth handling deliberately.`,birthday:"You were born with a head for the material world — organisation, money, scale, and the nerve to make a large decision without flinching. Where others see risk, you see a structure to be managed.",maturity:"From your late thirties, matters of money, authority and legacy move to the centre. Expect greater responsibility and greater material scope — and a growing concern with what it is all for. This is the chapter where an 8 either becomes a builder of other people or a fortress; the choice is genuinely open."},9:{key:"9",keyword:"The Humanitarian",lifePath:`Your lifetime is about giving on a wide scale and learning to let go. Nine is the completion number: you are here to finish things, to serve something bigger than your own household, and to release what has run its course.

A 9 life is marked by endings — relationships, chapters, places, identities — that arrive whether or not you are ready. This is not punishment. You are being cleared repeatedly so you cannot build a life that is too small. The people who fight it hardest suffer most; the ones who learn to open the hand find each release followed by something wider.

You feel the state of the world personally. That sensitivity is your instrument, and it needs a channel — work, art, service, teaching — or it curdles into disappointment. Compassion with an outlet is your natural condition.`,expression:`You work best where the work matters. Broad vision, genuine empathy and an ability to inspire — you can lift a group with a sense of purpose better than almost anyone. Teaching, healing, the arts, advocacy, anything with a human beneficiary at the end of it.

The work is completion and self-interest. You will pour everything into a cause and forget to invoice for it. Practical structures — contracts, boundaries, savings — are not a betrayal of the ideal; they are what let you keep serving it.

You also idealise. When people fail the picture you had of them, the disappointment is severe. Meeting people as they are is the maturity of a 9 Expression.`,soulUrge:`Your heart wants to be of use to something larger than yourself, and it wants beauty. A life that is only about your own comfort feels hollow to you within weeks, no matter how comfortable it is.

You love broadly, sometimes at the expense of the person directly in front of you. The 9 heart can care deeply about humanity while the partner at the kitchen table feels unseen. Bring the compassion home first.

There is usually something you must forgive — a parent, a betrayal, an old version of yourself. Doing that work releases more energy than any other single thing available to you.`,personality:`You come across as warm, wise and slightly removed — someone who has seen a lot. People trust you quickly with serious things and often treat you as older than you are. There is a natural dignity in how you carry yourself.

The cost is distance. Universal warmth can feel less personal than particular warmth, and people sometimes cannot tell whether you especially care about them. Be specific with the people who matter.

You also attract the wounded, who sense you will listen. Choose deliberately how much of that you accept.`,birthday:"You were born generous and wide-visioned — able to see the whole picture and to care about people you will never meet. That breadth makes you the one who raises the question of what this is all for.",maturity:"From your late thirties, life turns toward service, teaching and letting go. Old attachments loosen; a wider audience appears. Many people with a 9 maturity find their most meaningful work arrives late and involves giving away what they spent the first half of life acquiring."},11:{key:"11",keyword:"The Illuminator",lifePath:`You carry a master number, and it is a heightened, more demanding version of the 2. Your lifetime is about illumination — receiving insight and transmitting it in a way that raises the people around you. You are unusually intuitive, and you knew things you had no way of knowing long before you had language for it.

Eleven runs at high voltage. Nerves, sleep and sensitivity to atmosphere are all part of the package, and you cannot live the way robust people live. Rest is not indulgence for you, it is regulation. The great 11 struggle is inconsistency: extraordinary clarity one week, unusable static the next.

Until the vision is developed, an 11 often lives as a 2 — supportive, sensitive, waiting. That is fine, and it is not the whole assignment. The moment you accept that you are meant to say the thing out loud, the nervous static tends to organise itself into signal.`,expression:`Your equipment is inspiration. You can make people feel the significance of something — an idea, a possibility, a person's own potential — and that is a rarer talent than technical skill. Teaching, writing, ministry, design, therapy, any work that changes how someone sees.

The work is grounding. Vision without delivery becomes frustration, and 11s are prone to brilliant unexecuted ideas. Partner with practical people and accept the schedule.

You also carry higher standards than the situation usually requires, which reads to others as intensity. Aim it at the work, not at the people.`,soulUrge:`Your heart wants meaning and connection at depth — the sense that your life is part of something intelligible. Small talk is genuinely painful; one honest conversation restores you for a week.

You want peace as much as any 2, but you will trade peace for truth when it counts. That tension defines most of your important relationships.

Guard your inputs. What you take in — company, media, atmosphere — affects you more than it affects others, and managing that is not fussiness, it is basic maintenance.`,personality:`People sense something unusual before you have said much. You come across as gentle but charged — perceptive, a little otherworldly, obviously not ordinary. Some are drawn to it immediately; others find it uncomfortable.

You are read as knowing more than you have disclosed, which is generally accurate. It gives you unusual influence, and it can isolate you.

The practical correction is ordinariness: humour, small talk you tolerate, warmth without the depth charge. It lets people come closer.`,birthday:"You were born with heightened intuition — the ability to sense what is really going on beneath what is being said, and to know things before the evidence arrives. Learn to act on the first impression; it is usually right.",maturity:"From your late thirties, the intuitive and inspirational side becomes central rather than incidental. Expect a role where you illuminate for others — teaching, guiding, creating work that shifts how people see. The nervous intensity of earlier years typically settles into something usable around this time."},22:{key:"22",keyword:"The Master Builder",lifePath:`You carry the most materially powerful of the master numbers — a 4 with the scale turned up. Your lifetime is about building something large and lasting that serves many people: an institution, an enterprise, a body of work, a structure others will use long after you.

Twenty-two is heavy to carry. There is often a long apprenticeship where nothing seems commensurate with the pressure you feel, and it is easy to conclude you have overestimated yourself. You have not; the timescale is simply longer. Most 22 lives assemble the pieces for decades and build in the second half.

The test is nerve. The vision is genuinely big, and part of you knows it, which makes ordinary work feel unbearable and the real work feel impossible. Take the practical next step anyway. Twenty-two becomes real one built thing at a time.`,expression:`You can hold a vision and a plan at the same time — the rare combination. Where a 4 builds well and a dreamer imagines widely, you do both: you see the finished thing and you know what has to happen on Tuesday.

The work is scale and trust. You will need other people, in numbers, and your instinct is to control the detail. Build the system that lets competent people work without you in the room.

Do not shrink the plan to fit your current resources. Twenty-two consistently attracts what it needs after the commitment, not before.`,soulUrge:`What your heart wants is to leave something behind that mattered — not applause, but a structure that works and keeps working. Personal comfort barely registers next to that.

This can make you severe with yourself. Rest, family and enjoyment get filed as later, and later arrives with your health spent. Build them into the plan the way you would build in anything else you took seriously.

You also feel a private responsibility for people you have never met. That is not grandiosity; it is the number. Give it an outlet and it steadies you.`,personality:`You project capability and gravity. People trust you with large things quickly, and you often end up leading before you have formally been given the role.

The cost is that few people see the strain. Your visible steadiness makes it invisible, and you rarely correct the impression. Tell someone the truth about the load.

You also make others feel slightly behind — not through arrogance, but through evident purpose. Explicit encouragement from you goes further than you would guess.`,birthday:"You were born with the ability to think in structures — to see how a large thing could actually be assembled from small ones. It marks you out early, usually before you have anything to point at.",maturity:"From your late thirties, the large build begins in earnest. Resources, credibility and opportunity converge, and the thing you have been quietly preparing for becomes possible. This is the chapter where a 22 stops preparing and starts constructing."},33:{key:"33",keyword:"The Master Teacher",lifePath:`You carry the rarest master number — a 6 raised to its widest expression. Your lifetime is about love given as service on a scale beyond the family: teaching, healing, protecting, lifting the people who cannot lift themselves.

Thirty-three asks for extraordinary generosity, and it usually asks early. There is often a formative period where you carry more than a young person should — and it builds a capacity for care that other people simply do not have.

The danger is martyrdom. This number can give until nothing remains and then feel guilty for being empty. The mature 33 gives from surplus, not from the last reserve, and understands that a depleted helper helps nobody. Sustainable compassion is the whole lesson.`,expression:`Your gift is uplift through care — you make people better by taking them seriously. Teaching, healing, counselling, community building, any work where the transformation of a person is the product.

The work is boundaries and self-care, and you will need to be taught them, probably more than once. Structure your giving: hours, limits, a real life outside the service.

You also carry high standards for how people should be treated, which can turn into quiet judgement of those who fall short. Teach it rather than resent it.`,soulUrge:`Your heart wants to heal what is broken, in people and in situations. It is not a strategy, it is a reflex — you move toward suffering rather than away from it.

What you rarely admit is how much you need care yourself. Learning to receive without deflecting is the growth edge, and it will feel unnatural for years.

Beauty and harmony feed you the way rest feeds other people. Keep your surroundings kind.`,personality:`People experience you as unusually warm and safe — a sense of being accepted rather than assessed. Strangers open up quickly and children and animals gravitate toward you.

The cost is a constant inflow of need. Without a visible limit you will be inundated, and the resentment that follows is not your character, it is arithmetic.

You also look more resourced than you are. Say when you are running low; nobody will guess.`,birthday:"You were born with an exceptional capacity for compassion — the ability to be genuinely present with someone in difficulty without flinching or fixing. It changes people more than advice does.",maturity:"From your late thirties, the teaching and healing dimension becomes the centre of your life rather than a private quality. Expect a role of real responsibility for other people's growth — and the requirement, finally, to look after yourself as well as you look after everyone else."}},Af={1:{title:"Karmic Lesson 1 — Standing alone",text:"No letter of your name reduces to 1, so self-assertion is not issued to you as standard equipment. You will tend to defer, consult, or wait for consensus when what the situation needs is one person deciding. The lesson is to develop an independent will deliberately: form your own opinion before you canvass anyone else's, and act on it at least sometimes without seeking approval first. Every time you do, the muscle strengthens."},2:{title:"Karmic Lesson 2 — Tact and cooperation",text:"Your name carries no 2, so diplomacy has to be learned rather than felt. You are direct, sometimes bluntly so, and you can trample a sensitivity you genuinely did not notice. The lesson is patience with other people's pace and attention to the emotional temperature of a room. Ask more questions than you answer. Working closely with someone whose instinct for people is better than yours is the fastest possible education here."},3:{title:"Karmic Lesson 3 — Self-expression and lightness",text:"With no 3 in the name, expressing yourself openly does not come naturally. You may find creative or emotional expression awkward, be self-critical about your own work, or default to seriousness because levity feels unearned. The lesson is to express anyway — write it, say it, make it, badly at first. Optimism is also part of this lesson: choosing the lighter reading of a situation when both readings fit the facts."},4:{title:"Karmic Lesson 4 — Order and application",text:"No 4 in your name means system and steady application must be built rather than inherited. You may drift between projects, resist routine, or find the practical scaffolding of life — filing, maintenance, process — genuinely tedious. The lesson is method: one system, kept, until it becomes automatic. Choose work that requires discipline rather than avoiding it. What you build with deliberate structure will hold better than anything you improvise."},5:{title:"Karmic Lesson 5 — Freedom and change",text:"A missing 5 makes change harder than it needs to be. You may cling to the familiar, resist travel or new methods, and stay too long in situations that stopped working. The lesson is deliberate flexibility: say yes to the unfamiliar on a small scale regularly, so that when a large change arrives you are not paralysed by it. Adaptability is a skill here, not a temperament."},6:{title:"Karmic Lesson 6 — Responsibility and commitment",text:"Without a 6, commitment to people is something you must consciously choose. You may hesitate at responsibility, keep an exit open in relationships, or find domestic duty heavier than others seem to. The lesson is to commit fully to something that needs you — a person, a family, a long obligation — and to stay through the unglamorous middle. Reliability practised becomes reliability felt."},7:{title:"Karmic Lesson 7 — Depth and self-knowledge",text:"No 7 in the name means you may skate along the surface: taking things at face value, staying busy, avoiding the quiet in which self-examination happens. There can be a scepticism toward anything not immediately practical. The lesson is depth — study one subject properly, spend deliberate time alone, and develop a contemplative or analytical practice. What you find there is what the rest of your life has been missing."},8:{title:"Karmic Lesson 8 — Money, power and judgement",text:"A missing 8 usually shows up as an uneasy relationship with money and authority. You may avoid financial detail, undercharge, hand power to others, or swing between carelessness and anxiety about material things. The lesson is competence: learn how money actually works, negotiate for yourself, and practise using authority cleanly. Material mastery is a skill you are meant to acquire in this lifetime, not one you were given."},9:{title:"Karmic Lesson 9 — Compassion and the wider view",text:"With no 9, empathy on the large scale is not automatic. You may be genuinely warm with your own circle and indifferent past its edge, or find broad ideals abstract and unconvincing. The lesson is to extend the circle deliberately: give time or resources to people who cannot repay you, and practise tolerance for those whose lives look nothing like yours. Detachment — letting go when something is finished — belongs to this lesson too."}},xj={1:"The repeated 1s make independence the driving obsession. Whatever else you are doing, you are working toward being the one who decides. You do not fully relax inside anyone else's structure, and any life that gives you no sphere of your own will eventually be dismantled — by you.",2:"Repeated 2s make connection the obsession. You are constantly reading the relational field, and you would rather be close to people than be right in front of them. Peace matters to you more than victory, and you will pay for it, sometimes too much.",3:"Repeated 3s make expression the driving force. You need to be creating, talking, writing, performing — something has to come out of you regularly. Deprived of an outlet, the energy turns into restlessness and scattered chatter. Given one, you are unstoppable.",4:"Repeated 4s make order the obsession. You want things solid, sequential and correct, and you will do the unglamorous work others avoid. The risk is rigidity — treating the system as the point rather than the servant of the point.",5:"Repeated 5s make freedom the engine. Variety, movement and sensation pull you constantly, and any fence — a job, a routine, a rule you did not choose — provokes an almost physical reaction. Channelled, it makes you exceptionally adaptable. Unchannelled, it burns through everything.",6:"Repeated 6s make responsibility the obsession. You are drawn to fix, feed, teach and hold together, and you take on other people's welfare without being asked. It is a genuine gift, and it will run you into the ground unless you learn where you end.",7:"Repeated 7s make understanding the driving passion. You cannot leave a question half-answered, and you need solitude the way others need company. There is often a private philosophical or spiritual life running underneath the visible one.",8:"Repeated 8s make achievement and material mastery the engine. You measure yourself against results you can point at, and you are far more comfortable with power and money than most people admit to being. The work is deciding what it is all for before you get there.",9:"Repeated 9s make the wider good your obsession. You want your effort to count for something beyond yourself, and purely personal ambition leaves you cold. Idealism this strong needs a real outlet, or it curdles into disappointment with everyone."},wj={13:{code:"13/4",title:"Karmic Debt 13/4 — the debt of work",text:"Thirteen reduces to 4, but it carries a specific history: effort that was avoided, or work that was left for others to finish. In this life it presents as a persistent sense that everything takes longer and costs more for you than for other people. Progress is real but slow, and shortcuts collapse in your hands with unusual reliability.",work:"Work it off through consistency rather than intensity. Choose one thing, apply yourself daily, and keep your commitments even when they become inconvenient. Do not look for the clever route — for you it does not exist. The frustration lifts the moment you stop resenting the labour and simply do it; then the accumulated work starts compounding in your favour."},14:{code:"14/5",title:"Karmic Debt 14/5 — the debt of freedom misused",text:"Fourteen reduces to 5 and points to freedom previously taken without responsibility. It shows up as instability: constant change of circumstance, difficulty with commitment, and strong temptations toward excess — food, drink, spending, sex, whatever the escape of the moment is.",work:"The remedy is voluntary structure. Moderation you choose, not moderation imposed on you. Keep a routine you did not have to keep, honour a commitment past the point where it stopped being exciting, and practise adaptability without abandonment. Freedom becomes genuinely yours once you can also stay."},16:{code:"16/7",title:"Karmic Debt 16/7 — the debt of the fallen tower",text:"Sixteen reduces to 7 and is the most demanding of the four. It brings the collapse of something you built your identity on — a relationship, a career, a belief, a self-image — usually at the point where it seemed most secure. Ego constructions fall so that something truer can be built. It often arrives more than once.",work:"Work it off by holding your position lightly and by refusing to build identity on any single external structure. Develop the inner life deliberately; that is the part nothing can take. People with this debt who go through the collapse without bitterness become unusually wise, and are frequently the ones others come to after their own tower falls."},19:{code:"19/1",title:"Karmic Debt 19/1 — the debt of independence",text:"Nineteen reduces to 1 and points to power used for self at the expense of others. In this life it produces enforced independence: you are repeatedly put in positions where you must stand alone, where help does not arrive, and where you learn what it is to need something and not receive it.",work:"The lesson is interdependence. Ask for help — actually ask, not hint — and accept it without repaying it immediately. Use whatever authority you gain for people who cannot return the favour. The isolation eases in proportion to how genuinely you let others in."}},Mf={A:"An A first vowel means your instinctive response to life is to act. Before you have consciously decided anything, you are already moving toward the thing. Independent, quick, occasionally rash — you would rather correct a bad decision in motion than deliberate in place. The reflex serves you well in a crisis and costs you when patience would have paid better.",E:"An E first vowel gives an instinctive reach for freedom and variety. Your first reaction to any situation is to check the exits and the options — where can this go, what else is possible. It makes you quick, adaptable and slightly hard to pin down; commitment always registers first as a narrowing before it registers as a gain.",I:"An I first vowel makes feeling the first instrument. You respond emotionally before you respond rationally, and your first read on a person or a room is usually accurate. Highly sensitive and easily moved, you need genuine recovery time after intense situations; without it the sensitivity turns into anxiety.",O:"An O first vowel means you pause before you commit. The instinctive reaction is to assess, weigh and hold back until you understand the shape of the thing. Cautious, thorough, and difficult to rush — people occasionally mistake the deliberation for reluctance, but your first judgement, once given, is rarely wrong.",U:"A U first vowel produces an instinctive openness — you receive first and evaluate later. Generous, accumulative and a little unguarded, you take things in readily, which makes you creative and occasionally means you absorb what you should have deflected. Learn to shut the receiver as easily as you open it.",Y:"A Y first vowel gives a hesitant, intuitive first response. You neither move nor decide immediately; you wait for a sense of the thing to arrive, and it usually does. Others read the pause as indecision, but the intuition it protects is genuinely reliable — provided you eventually act on it rather than waiting indefinitely."},ci={A:{cornerstone:"You approach new things head-on and alone — deciding for yourself, moving before consensus, trusting your own read.",capstone:"You finish by force of will, pushing through the last stretch on determination when interest has long since gone."},B:{cornerstone:"You approach cautiously and with feeling, sensing the situation before entering it and preferring company to solo ventures.",capstone:"You finish by staying sensitive to how it lands — but hesitation near the finish line is the pattern to watch."},C:{cornerstone:"You approach expressively and intuitively — talking it through, sensing the possibilities, finding the enjoyable angle first.",capstone:"You finish with flourish and communication, though enthusiasm can fade before the final detail is done."},D:{cornerstone:"You approach practically and methodically, wanting the plan and the resources in place before you commit.",capstone:"You finish thoroughly and on schedule; completion genuinely matters to you and you rarely leave loose ends."},E:{cornerstone:"You approach with curiosity and an eye on the exits — versatile, quick to start, keen to keep the options open.",capstone:"You finish restlessly, often already looking at the next thing; deliberate closure is the discipline to build."},F:{cornerstone:"You approach with a sense of duty and care, considering who will be affected before you consider whether you want to.",capstone:"You finish responsibly, seeing the obligation through even when the reward has evaporated."},G:{cornerstone:"You approach thoughtfully and privately, gathering information and turning it over before anyone knows you are interested.",capstone:"You finish precisely, on your own terms and usually alone."},H:{cornerstone:"You approach with an eye to the result — what it is worth, what it could become, whether it is worth your effort.",capstone:"You finish with an eye on the return; you rarely walk away from something you have invested in."},I:{cornerstone:"You approach through feeling, reading the emotional truth of a situation before the facts of it.",capstone:"You finish intensely, and take the outcome personally either way."},J:{cornerstone:"You approach with initiative and originality, looking for the route nobody else has taken.",capstone:"You finish by starting something else — the completion of one thing is your cue to begin the next."},K:{cornerstone:"You approach intuitively, with a heightened sense of what is really at stake — often taking on more than the situation asked for.",capstone:"You finish with unusual intensity, and rarely at half strength."},L:{cornerstone:"You approach with imagination and warmth, seeing the appealing version of the thing before the practical one.",capstone:"You finish generously, often doing more than was strictly required."},M:{cornerstone:"You approach with steady practicality — head down, sleeves up, evaluating what it will actually take.",capstone:"You finish by outlasting the difficulty; endurance is your closing move."},N:{cornerstone:"You approach with curiosity and a taste for change, drawn to whatever is new in the situation.",capstone:"You finish flexibly, adapting the ending to what the circumstances turned out to be."},O:{cornerstone:"You approach cautiously and completely — you want to understand the whole shape before committing any of yourself.",capstone:"You finish thoroughly and protectively; you close the circle properly."},P:{cornerstone:"You approach analytically, weighing the thing intellectually before you commit emotionally.",capstone:"You finish once you understand it fully — which can mean staying long past the point others left."},Q:{cornerstone:"You approach unpredictably, following an instinct that others cannot see the logic of.",capstone:"You finish in your own idiosyncratic way, and the result rarely resembles the plan."},R:{cornerstone:"You approach with breadth and idealism, asking what the wider point of it is before you begin.",capstone:"You finish by giving it away — the completion matters more than the credit."},S:{cornerstone:"You approach with feeling and drama; beginnings carry emotional charge for you and rarely feel neutral.",capstone:"You finish with a decisive break — endings, for you, tend to be clean and final."},T:{cornerstone:"You approach cooperatively and with sensitivity, checking who is with you before you move.",capstone:"You finish in partnership; solo completion feels unfinished to you."},U:{cornerstone:"You approach receptively, letting the situation reveal itself before you decide what it is.",capstone:"You finish having gained something you did not expect at the outset."},V:{cornerstone:"You approach with vision and unusual practicality at once — you see the finished structure and the first brick together.",capstone:"You finish at scale; small completions rarely satisfy you."},W:{cornerstone:"You approach with enthusiasm and multiple options open, energised by the possibilities.",capstone:"You finish in a rush of energy — or leave it just short and move on."},X:{cornerstone:"You approach through the senses and instinct rather than analysis, drawn to what feels alive.",capstone:"You finish when the appetite for it is satisfied, not when the schedule says so."},Y:{cornerstone:"You approach hesitantly, waiting for intuition to settle before you move — and it usually does, correctly.",capstone:"You finish once the inner sense says it is right; deadlines matter less to you than that signal."},Z:{cornerstone:"You approach with optimism and pace, expecting it to work and moving quickly on that assumption.",capstone:"You finish with resolve, and take the outcome as a verdict on yourself."}},ox="Two systems, kept distinct. The 3 × 3 birth-chart grid, the Arrows of Strength and Emptiness, the planes and the repeated-digit readings follow David A. Phillips. The name-based numbers — Expression, Soul Urge, Personality, Ka
