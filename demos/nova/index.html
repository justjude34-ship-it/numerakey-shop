<script>
const KEY = "nova-adhd-v1";
const MOODS = [
  ["Great", "#5dce8a"], ["Good", "#3dceb4"], ["Okay", "#e6c07b"], ["Low", "#e07a6a"],
  ["Rough", "#f08bb0"], ["Anxious", "#a78bfa"], ["Scattered", "#6d93f6"], ["Tired", "#9aa3b8"]

const today = () => new Date().toISOString().slice(0, 10);
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const load = () => {
  const base = {
    name: "Friend", mode: "friend", streak: 1, shields: 1, last: today(),
    focusMins: 0, moods: [], tasks: [], stepsDone: 0, tasksDone: 0,
    chats: { friend: [], coach: [], therapist: [] }

  try { return Object.assign(base, JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch { return base; }
};

touchStreak();
let screen = "home";

}

  $("#say").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  document.querySelectorAll("#quicks [data-q]").forEach(b => b.onclick = () => { $("#say").value = b.dataset.q; send(); });
  const logEl = $("#log"); if (logEl) logEl.scrollTop = logEl.scrollHeight;
}
function hello() {
  const lines = {
    friend: "Hey. No lecture incoming. What's actually going on?",
    coach: "We can make this small. What's the one thing sitting heaviest?",
    therapist: "I'm here, and we can go slowly. What feels closest right now?"
  };
  return lines[state.mode];
}
function replyFor(text) {
  const t = text.toLowerCase();
  const bank = {
    friend: {
      over: "That makes sense. How long has this been sitting on you? You don't have to fix it in this message.",
      start: "Can't start is information, not a character flaw. What's the smallest visible thing — open the file, put the mug down, name the pile?",
      focus: "Focus isn't a moral quality. Want a 10-minute sit with me, or a smaller first step?",
      else: "I hear you. We can stay with this, or shrink it to one next thing. Your call."
    },
    coach: {
      over: "Overwhelm usually means the pile is still one object. Name the pile in five words, then we cut it to a 2-minute start.",
      start: "Start line: set a 5-minute timer and touch the task. Stopping after 5 is a win.",
      focus: "Sprint offer: 25 minutes, body double on, phone face down. I'll hold the clock.",
      else: "Next step only. What can be done in under ten minutes, with the energy you have now?"
    },
    therapist: {
      over: "Overwhelm is a nervous system doing its job loudly. What does your body want before any task — water, stillness, or a person nearby?",
      start: "Starting trouble often protects you from a feeling. What feeling shows up at the edge of this task?",
      focus: "Attention wanders when something unfinished is louder. We can note it, then return. No scolding.",
      else: "Thank you for saying it. What would feel like enough for the next few minutes?"
    }
  };
  const pack = bank[state.mode];
  if (/overwhelm|too much|can't cope|spiral/.test(t)) return pack.over;
  if (/start|avoid|stuck|paralys/.test(t)) return pack.start;
  if (/focus|distract|timer|sprint/.test(t)) return pack.focus;
  return pack.else;
}
function send() {
  const input = $("#say");
  const text = (input.value || "").trim();
  if (!text) return;
  state.chats[state.mode] = state.chats[state.mode] || [];
  state.chats[state.mode].push({ role: "me", text });
  state.chats[state.mode].push({ role: "nova", text: replyFor(text) });
  save();
  render();
}
function renderFocus() {
  const m = String(Math.floor(timer.secs / 60)).padStart(2, "0");
  const s = String(timer.secs % 60).padStart(2, "0");
  const pct = timer.total ? (timer.total - timer.secs) / timer.total : 0;
  const c = 2 * Math.PI * 96;
  const dash = c * (1 - pct);
  $("#focus").innerHTML = `
    <h2 class="display">Focus studio</h2>
    <p class="lede">Short sprints beat heroic marathons. Body doubling welcome.</p>
    <div class="ring-wrap">
      <span class="badge">Focus</span>
      <div class="ring">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="96" stroke="#243049" stroke-width="10" fill="none"/>
          <circle cx="110" cy="110" r="96" stroke="#6d93f6" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${dash.toFixed(1)}"/>
        </svg>
        <div class="time"><b>${m}:${s}</b><span>${timer.running ? "Nova is here" : "Ready when you are"}</span></div>
      </div>
      <div class="actions">
        <button class="primary" id="toggle">${timer.running ? "Pause" : "▶ Start"}</button>
        <button class="ghost" id="reset">↺ Reset</button>
      </div>
      <div class="presence"><span class="dotpulse ${timer.running ? "on" : ""}"></span>${timer.running ? "Body double on. I'm sitting with you. You can stop." : "When you start, I'll stay. No commentary."}</div>
    </div>
    <div class="card">
      <h3>Presets</h3>
      <div class="presets">
        ${[5, 15, 25, 50].map(n => `<button class="chip ${timer.total === n * 60 && !timer.running ? "on" : ""}" data-min="${n}">${n} min</button>`).join("")}
      </div>
    </div>`;
  $("#toggle").onclick = toggleTimer;
  $("#reset").onclick = () => { stopTimer(false); timer.secs = timer.total; render(); };
  document.querySelectorAll("[data-min]").forEach(b => b.onclick = () => {
    if (timer.running) return;
    timer.total = timer.secs = Number(b.dataset.min) * 60;
    render();
  });
}
function toggleTimer() {
  if (timer.running) { stopTimer(false); render(); return; }
  timer.running = true;
  timer.id = setInterval(() => {
    timer.secs -= 1;
    if (timer.secs <= 0) { timer.secs = 0; finishSprint(); }
    if (screen === "focus") renderFocus();
  }, 1000);
  render();
}
function stopTimer(done) {
  timer.running = false;
  if (timer.id) clearInterval(timer.id);
  timer.id = null;
  if (!done && screen === "focus") renderFocus();
}
function finishSprint() {
  stopTimer(true);
  const mins = Math.round(timer.total / 60);
  state.focusMins += mins;
  save();
  toast(mins + " minutes counted. That was enough.");
  timer.secs = timer.total;
  render();
}
function shrink(text, energyLevel) {
  const name = text.replace(/\.$/, "");
  if (energyLevel === "Low") return [
    "Open it. Just the lid, file, or tab. Stop there if you want.",
    "Do two minutes of " + name + ", then you may leave.",
    "Optional: note the next crumb for later-you."
  ];
  if (energyLevel === "High") return [
    "Clear a 25-minute window for " + name + ".",
    "Do the first real chunk, not the whole mountain.",
    "Park leftovers on a list so they stop orbiting.",
    "Close the loop with one sentence: done enough."
  ];
  return [
    "Name the very first physical action for " + name + ".",
    "Do only that action.",
    "If there's juice left, take one more crumb. If not, stop on purpose."
  ];
}
function renderTasks() {
  $("#tasks").innerHTML = `
    <h2 class="display">Tiny steps</h2>
    <p class="lede">Mountains become foothills. Nova auto-breaks anything you add.</p>
    <div class="card">
      <h3>✦ Break a task</h3>
      <input class="field" id="task" placeholder="e.g. File taxes, clean kitchen, finish deck" />
      <div class="chips" style="margin:12px 0">
        ${["Low", "Medium", "High"].map(e => `<button class="chip ${taskEnergy === e ? "on" : ""}" data-en="${e}">${e} energy</button>`).join("")}
      </div>
      <button class="primary block" id="add">+ Add & break down</button>
    </div>
    <div class="card" id="tasklist">
      ${state.tasks.length ? state.tasks.map((t, i) => `
        <div class="task">
          <h4>${esc(t.title)} <span style="color:var(--faint);font-weight:380">· ${t.energy}</span></h4>
          ${t.steps.map((s, j) => `<label class="step ${s.done ? "done" : ""}"><input type="checkbox" data-ti="${i}" data-si="${j}" ${s.done ? "checked" : ""}/><span>${esc(s.text)}</span></label>`).join("")}
        </div>`).join("") : `<div style="text-align:center;padding:18px 8px"><h3>No tasks yet</h3><p class="sub">Add something you've been avoiding — we'll shrink it.</p></div>`}
    </div>`;
  document.querySelectorAll("[data-en]").forEach(b => b.onclick = () => { taskEnergy = b.dataset.en; render(); });
  $("#add").onclick = () => {
    const title = $("#task").value.trim();
    if (!title) return toast("Name the mountain first.");
    const last = state.moods[state.moods.length - 1];
    const level = last && last.energy <= 3 ? "Low" : taskEnergy;
    state.tasks.unshift({ title, energy: level, steps: shrink(title, level).map(text => ({ text, done: false })) });
    save();
    toast(level === "Low" ? "Shrunk for low energy. First step is tiny." : "Broken into foothills.");
    render();
  };
  document.querySelectorAll("[data-ti]").forEach(box => box.onchange = () => {
    const t = state.tasks[box.dataset.ti];
    const step = t.steps[box.dataset.si];
    step.done = box.checked;
    if (step.done) state.stepsDone += 1;
    if (t.steps.every(s => s.done)) state.tasksDone += 1;
    save();
    render();
  });
}
function renderMood() {
  $("#mood").innerHTML = `
    <h2 class="display">Mood check-in</h2>
    <p class="lede">Name it to tame it. Patterns beat perfection.</p>
    <div class="card">
      <h3>How do you feel right now?</h3>
      <div class="moods">
        ${MOODS.map(([n, c]) => `<button class="mood ${moodPick === n ? "on" : ""}" data-mood="${n}"><i style="background:${c}"></i>${n}</button>`).join("")}
      </div>
      <div class="row-between" style="margin-top:16px"><span>Energy</span><span id="enlab">${energy}/10</span></div>
      <input class="slider" id="en" type="range" min="0" max="10" value="${energy}" />
      <div class="row-between"><span>Focus capacity</span><span id="folab">${focusCap}/10</span></div>
      <input class="slider" id="fo" type="range" min="0" max="10" value="${focusCap}" />
      <textarea class="field" id="note" placeholder="Optional note — triggers, wins, context..."></textarea>
      <button class="primary block" id="save-mood" style="margin-top:12px">Save check-in</button>
    </div>`;
  document.querySelectorAll("[data-mood]").forEach(b => b.onclick = () => { moodPick = b.dataset.mood; render(); });
  $("#en").oninput = e => { energy = +e.target.value; $("#enlab").textContent = energy + "/10"; };
  $("#fo").oninput = e => { focusCap = +e.target.value; $("#folab").textContent = focusCap + "/10"; };
  $("#save-mood").onclick = () => {
    state.moods.push({ date: today(), mood: moodPick, energy, focus: focusCap, note: $("#note").value.trim() });
    touchStreak();
    state.last = today();
    save();
    toast("Saved. That's the whole job.");
    go("home");
  };
}
function renderTools() {
  $("#tools").innerHTML = `
    <h2 class="display">Calm tools</h2>
    <p class="lede">Regulation first. The list can wait.</p>
    <div class="grid2">
      <div class="card" style="margin:0"><h3 style="font-size:18px">Name 3 sounds</h3><p class="sub">Interrupt the spiral with audio</p></div>
      <div class="card" style="margin:0"><h3 style="font-size:18px">Feet on floor</h3><p class="sub">Weight, temperature, contact</p></div>
    </div>
    <div class="card" style="text-align:center">
      <div class="breath ${breathOn ? "go" : ""}" id="ball"><div><b id="phase">Inhale</b><div class="sub">4 seconds</div></div></div>
      <button class="primary" id="breath">${breathOn ? "Stop" : "Start breathing"}</button>
      <p class="sub" style="margin-top:10px">Inhale 4 · hold 4 · exhale 4 · hold 4. Stop whenever.</p>
    </div>`;
  $("#breath").onclick = () => {
    breathOn = !breathOn;
    clearInterval(breathId);
    if (breathOn) {
      const phases = ["Inhale", "Hold", "Exhale", "Hold"];
      let i = 0;
      breathId = setInterval(() => { i = (i + 1) % 4; const p = document.getElementById("phase"); if (p) p.textContent = phases[i]; }, 4000);
    }
    render();
  };
}
function renderInsights() {
  const recent = state.moods.slice(-8);
  const w = 320, h = 92;
  const pts = recent.map((m, i) => {
    const x = recent.length === 1 ? w / 2 : (i / (recent.length - 1)) * (w - 16) + 8;
    const y = h - 10 - (m.energy / 10) * (h - 24);
    return [x, y];
  });
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  $("#insights").innerHTML = `
    <h2 class="display">Insights</h2>
    <p class="lede">Patterns over perfection — gentle data for curious brains.</p>
    <div class="metrics">
      <div class="metric"><span>Streak</span><b style="color:var(--coral)">${state.streak}d</b></div>
      <div class="metric"><span>Focus mins</span><b style="color:var(--blue)">${state.focusMins}</b></div>
      <div class="metric"><span>Steps done</span><b style="color:var(--teal)">${state.stepsDone}</b></div>
      <div class="metric"><span>Tasks done</span><b style="color:var(--gold)">${state.tasksDone}</b></div>
    </div>
    <div class="card">
      <h3>Energy & focus</h3>
      ${recent.length ? `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="#6d93f6" stroke-width="3" stroke-linecap="round"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#e6c07b"/>`).join("")}</svg><p class="sub">Last ${recent.length} check-in${recent.length === 1 ? "" : "s"}. Shields left: ${state.shields}.</p>` : `<p class="sub" style="padding:28px 0">Log a few mood check-ins to see your trend.</p>`}
    </div>
    <p class="disclaimer">On this phone only. Nothing is sent anywhere. Not a diagnosis, not a medical record.</p>`;
}
function rename() {
  const next = prompt("What should Nova call you?", state.name);
  if (next && next.trim()) { state.name = next.trim(); save(); render(); }
}
function bindJumps() {
  document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => go(b.dataset.jump));
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
