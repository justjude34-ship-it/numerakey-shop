.ask button{width:3.2rem;border-radius:50%;border:0;background-image:linear-gradient(100deg,var(--teal),var(--purple));font-weight:800;color:var(--ink);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:1.5rem 1.5rem 0 0;padding:1.1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
.sheet label{display:block;margin:.7rem 0 .2rem;color:var(--muted);font-size:.9rem}
.sheet input,.sheet select{width:100%;min-height:3.1rem;padding:.5rem .8rem;border-radius:.8rem;border:1px solid var(--line);background:#000;color:var(--fg);font:inherit;font-size:1.1rem}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.cbtn{min-height:3rem;border-radius:.9rem;border:2px solid var(--line);background:#000;color:var(--fg);font:inherit;cursor:pointer;padding:.3rem .5rem}
.cbtn.on{border-color:var(--c);background:#10171a;font-weight:700}
.err{color:var(--bad);margin:.5rem 0 0}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#123e3c;color:#fff;padding:.7rem 1.1rem;border-radius:999px;z-index:30}
.note{font-size:.88rem;color:var(--muted)}
a{color:var(--teal)}

/* cool instrument theme */
:root{--teal:#38bdf8;--purple:#818cf8;--ink:#03121c;--card:#080d14;--card2:#0d1520;--line:#1b2a3b;--good:#34d399;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
body{background:linear-gradient(rgba(56,189,248,.04) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(56,189,248,.04) 1px,transparent 1px) 0 0/28px 28px,#02050a;background-attachment:fixed}
.tile{border-radius:.4rem;border-left:3px solid var(--teal);background:#080d14}
.tile:nth-child(2){border-left-color:#f87171}.tile:nth-child(3){border-left-color:#34d399}.tile:nth-child(4){border-left-color:#818cf8}
.tile span{text-transform:uppercase;letter-spacing:.12em;font-size:.7rem}
.tile b,.cat .r b,.row .a{font-family:var(--mono);letter-spacing:-.02em}
.card,.sheet{border-radius:.5rem}
.btn{border-radius:.5rem;background-image:linear-gradient(100deg,#38bdf8,#6366f1);letter-spacing:.02em}
.btn.alt{background:transparent}
.tabs{border-radius:.5rem;background:#080d14}
.tabs button.on{background:#12202f;box-shadow:inset 0 -2px 0 var(--teal);color:#fff}
.arrow{border-radius:.5rem}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;color:var(--teal)}
.cbar{height:.4rem;border-radius:2px}
.cbar i{border-radius:2px}
.chip{border-radius:.4rem}
.chat .me{background:#102a40;border-radius:.6rem}
.chat .bot{border-radius:.6rem}
.cbtn{border-radius:.4rem}
.toast{background:#102a40}
.hero{border-bottom:1px solid var(--line)}
.ask input{border-radius:.5rem}.ask button{border-radius:.5rem}
.mnav b{font-family:var(--mono);letter-spacing:.04em;font-size:1.05rem}

</style>

let mem=null;
function lsGet(){try{return localStorage.getItem(KEY)}catch(e){return mem}}
function lsSet(v){try{localStorage.setItem(KEY,v)}catch(e){mem=v}}
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Math.random().toString(36).slice(2,9)}
function dollars(n,cents){n=Number(n)||0;const s=Math.abs(n).toLocaleString("en-AU",cents?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:0});return(n<0?"-":"")+"$"+s}
const CATS=[
 {id:"housing",n:"Housing",g:"needs",c:"#a77bff"},{id:"groceries",n:"Groceries",g:"needs",c:"#f5c86b"},
 {id:"transport",n:"Transport",g:"needs",c:"#ff9a7a"},{id:"bills",n:"Bills & utilities",g:"needs",c:"#7aa8ff"},
 {id:"health",n:"Health",g:"needs",c:"#4fd1a5"},{id:"eating",n:"Eating out",g:"wants",c:"#ff7ac0"},
 {id:"fun",n:"Fun & hobbies",g:"wants",c:"#1aa6a0"},{id:"shopping",n:"Shopping",g:"wants",c:"#d4a5ff"},
 {id:"other",n:"Other",g:"wants",c:"#93a0a3"}];
const cat=id=>CATS.find(c=>c.id===id)||CATS[8];
function ym(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function todayStr(){const d=new Date();return ym(d)+"-"+String(d.getDate()).padStart(2,"0")}
function monthName(k){const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-AU",{month:"long",year:"numeric"})}
function shift(k,n){const[y,m]=k.split("-").map(Number);return ym(new Date(y,m-1+n,1))}

function blank(){return{entries:[],month:ym(new Date()),tab:"overview",chat:[]}}
let S=(function(){try{const r=lsGet();if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.entries))return Object.assign(blank(),o,{chat:[],tab:"overview"})}}catch(e){}return blank()})();
function save(){lsSet(JSON.stringify({entries:S.entries,month:S.month}))}

function monthEntries(k){return S.entries.filter(e=>e.date.slice(0,7)===(k||S.month))}
function calc(k){
  const es=monthEntries(k);let inc=0,out=0;const by={};CATS.forEach(c=>by[c.id]=0);
  es.forEach(e=>{if(e.type==="in")inc+=e.amt;else{out+=e.amt;by[e.cat]=(by[e.cat]||0)+e.amt}});
  const rem=inc-out,rate=inc>0?rem/inc*100:null;
  let needs=0,wants=0;CATS.forEach(c=>{if(c.g==="needs")needs+=by[c.id];else wants+=by[c.id]});
  return{inc,out,rem,rate,by,needs,wants,n:es.length}
}

/* ---------- coach: written in advance, answers from your numbers ---------- */
function ranked(m){return CATS.map(c=>({c,v:m.by[c.id]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)}
function pct(a,b){return b>0?Math.round(a/b*100):0}
const COACH={
 snapshot(m){
  if(!m.n)return"<p>There's nothing logged for "+monthName(S.month)+" yet. Add your income and a few expenses, or try the sample month under Help, and I can give you a snapshot.</p>";
  if(m.inc<=0)return"<p>You've logged <b>"+dollars(m.out)+"</b> of spending but no income yet for this month. Add your income and I can tell you where you stand.</p>";
  const top=ranked(m)[0];
  let t="<p>This month you've brought in <b>"+dollars(m.inc)+"</b> and spent <b>"+dollars(m.out)+"</b>, which leaves <b>"+dollars(m.rem)+"</b>. Your savings rate is <b>"+Math.round(m.rate)+"%</b>.</p>";
  if(m.rem<0)t+="<p>You're <b>"+dollars(-m.rem)+"</b> over for the month. The quickest place to look is "+(top?"<b>"+top.c.n+"</b>, your biggest area at "+dollars(top.v)+".":"your expenses.")+"</p>";
  else if(m.rate>=20)t+="<p>That's a healthy margin. A common target is 20% or more, and you're at or above it.</p>";
  else if(m.rate>=10)t+="<p>That's a decent start. Getting to about 20% would give you a stronger cushion"+(top?", and "+top.c.n+" ("+dollars(top.v)+") is the biggest place to look.":".")+"</p>";
  else t+="<p>That's a thin margin, so a surprise bill would be felt."+(top?" Your biggest area is <b>"+top.c.n+"</b> at "+dollars(top.v)+" ("+pct(top.v,m.inc)+"% of income).":"")+"</p>";
  return t},
 plan(m){
  if(m.inc<=0)return"<p>The 50/30/20 split needs your income. Add what you earn this month and I'll work it out.</p>";
  const nT=m.inc*.5,wT=m.inc*.3,sT=m.inc*.2;
  const row=(l,t,a)=>"<p><b>"+l+":</b> target "+dollars(t)+", you're at "+dollars(a)+" ("+pct(a,m.inc)+"%) "+(a<=t?"✓":"· "+dollars(a-t)+" over")+"</p>";
  let t="<p>The 50/30/20 idea: about 50% of income to needs, 30% to wants, 20% to savings. On "+dollars(m.inc)+":</p>";
  t+=row("Needs (housing, groceries, transport, bills, health)",nT,m.needs);
  t+=row("Wants (eating out, fun, shopping, other)",wT,m.wants);
  t+="<p><b>Savings:</b> target "+dollars(sT)+", you have "+dollars(Math.max(m.rem,0))+" left ("+Math.max(0,Math.round(m.rate))+"%) "+(m.rem>=sT?"✓":"· "+dollars(sT-Math.max(m.rem,0))+" short")+"</p>";
  t+="<p class=\"note\">It's a rule of thumb, not a rule. If your housing is high, needs will run over 50%, and that's very common.</p>";
  return t},
 where(m){
  const r=ranked(m);if(!r.length)return"<p>No spending logged for "+monthName(S.month)+" yet.</p>";
  return"<p>Your money is going mainly to:</p>"+r.slice(0,4).map(x=>"<p><b>"+x.c.n+":</b> "+dollars(x.v)+" ("+pct(x.v,m.out)+"% of what you spent)</p>").join("")},
 trim(m){
  const r=ranked(m).filter(x=>x.c.g==="wants");
  if(!r.length)return"<p>I can't see any wants spending to trim for this month. Your spending is mostly needs, which is harder to cut. If housing or bills feel heavy, comparing providers is the usual first step.</p>";
  const x=r[0];
  return"<p>The easiest place to start is your \"wants\". Your biggest is <b>"+x.c.n+"</b> at "+dollars(x.v)+".</p><p>Trimming it by 10% would free about <b>"+dollars(x.v*.1)+"</b> a month, or "+dollars(x.v*.1*12)+" over a year. Small and kind to yourself, rather than cutting it out.</p>"},
 help(){return"<p>I can answer from your numbers. Try: <b>How am I doing?</b>, <b>Give me a 50/30/20 plan</b>, <b>Where is my money going?</b> or <b>What can I trim?</b></p>"}
};
function route(q){
  q=q.toLowerCase();
  if(/50|30|20|split|plan/.test(q))return"plan";
  if(/trim|cut|save more|spend less|reduce/.test(q))return"trim";
  if(/where|going|spend|category|biggest/.test(q))return"where";
  if(/how|doing|snapshot|status|left|remain/.test(q))return"snapshot";
  return"help"
}
function insights(m){
  const out=[];
  if(!m.n)return[["var(--muted)","Nothing logged for "+monthName(S.month)+" yet. Add your income first, then your spending."]];
  if(m.inc<=0)out.push(["var(--muted)","No income logged yet this month, so the percentages can't be worked out."]);
  else{
    if(m.rem<0)out.push(["var(--bad)","You've spent "+dollars(-m.rem)+" more than you earned this month."]);
    else if(m.rate>=20)out.push(["var(--good)","Savings rate "+Math.round(m.rate)+"%. That's at or above the usual 20% target."]);
    else out.push(["var(--purple)","Savings rate "+Math.round(m.rate)+"%. About 20% is the usual target, so there's some room."]);
    const h=pct(m.by.housing,m.inc);
    if(h>35)out.push(["var(--bad)","Housing is "+h+"% of your income. The common guide is about a third."]);
    else if(h>0)out.push(["var(--good)","Housing is "+h+"% of your income, within the common guide of about a third."]);
    const w=pct(m.wants,m.inc);
    if(w>30)out.push(["var(--purple)","Wants are "+w+"% of your income, a bit over the usual 30%."])
  }
  const r=ranked(m)[0];if(r)out.push(["var(--teal)","Your biggest area is "+r.c.n+" at "+dollars(r.v)+"."]);
  return out
}

function tilesHtml(m){
  const rem=m.rem;
  return'<div class="tiles">'+
  '<div class="tile"><span>Income</span><b style="color:var(--good)">'+dollars(m.inc)+'</b></div>'+
  '<div class="tile"><span>Expenses</span><b>'+dollars(m.out)+'</b></div>'+
  '<div class="tile"><span>Remaining</span><b style="color:'+(rem<0?"var(--bad)":"var(--teal)")+'">'+dollars(rem)+'</b></div>'+
  '<div class="tile"><span>Savings rate</span><b style="color:'+(m.rate==null?"var(--muted)":m.rate<0?"var(--bad)":"var(--purple)")+'">'+(m.rate==null?"—":Math.round(m.rate)+"%")+"</b></div></div>"
}
function overview(m){
  let h="";
  const r=ranked(m);
  h+="<h2>Where it went</h2>";
  if(!r.length)h+='<div class="card muted">No spending yet for this month.</div>';
  else h+='<div class="card">'+r.map(x=>'<div class="cat"><div class="r"><span>'+x.c.n+'</span><b>'+dollars(x.v)+'</b></div><div class="cbar"><i style="width:'+pct(x.v,m.out)+"%;background:"+x.c.c+'"></i></div></div>').join("")+"</div>";
  h+="<h2>What this says</h2><div class=\"card\">"+insights(m).map(i=>'<div class="ins"><span class="dot" style="background:'+i[0]+'"></span><span>'+esc(i[1])+"</span></div>").join("")+"</div>";
  return h
}
function entries(){
  const es=monthEntries().slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!es.length)return'<div class="card muted">Nothing logged for '+monthName(S.month)+" yet.</div>";
  return'<div class="card">'+es.map(e=>'<div class="row"><div class="t"><b>'+esc(e.type==="in"?"Income":cat(e.cat).n)+"</b>"+(e.note?" · "+esc(e.note):"")+"<small>"+new Date(e.date+"T12:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"short"})+'</small></div><div class="a" style="color:'+(e.type==="in"?"var(--good)":"var(--fg)")+'">'+(e.type==="in"?"+":"-")+dollars(e.amt,true)+'</div><button data-act="del" data-id="'+e.id+'">✕</button></div>').join("")+"</div>"
}
function coach(){
  let h='<div class="card chat">'+(S.chat.length?"":'<div class="bot">'+"<p>Hi, I'm your coach. I answer from your numbers, in plain terms. Ask me something:</p></div>");
  S.chat.forEach(c=>{h+='<div class="me">'+esc(c.q)+'</div><div class="bot">'+c.a+"</div>"});
  h+='<div class="chips">'+[["snapshot","How am I doing?"],["plan","50/30/20 plan"],["where","Where is my money going?"],["trim","What can I trim?"]].map(c=>'<button class="chip" data-act="ask" data-k="'+c[0]+'" data-q="'+esc(c[1])+'">'+c[1]+"</button>").join("")+"</div>";
  h+='<div class="ask"><input id="q" placeholder="Or type a question" enterkeyhint="send"><button data-act="send">&rarr;</button></div></div>';
  h+='<p class="note">The replies are written in advance, not generated. Nothing is sent anywhere. General information, not financial advice.</p>';
  return h
}
function help(){
  return'<div class="card"><b>Try it first</b><p class="muted" style="margin:.3rem 0">Load a sample month to see how everything works, then clear it and add your own.</p>'+
   '<button class="btn full" data-act="sample">Load a sample month</button><button class="btn alt full" data-act="clearmonth">Clear this month</button></div>'+
   '<div class="card"><b>Need to talk to someone?</b><p style="margin:.4rem 0">National Debt Helpline: <a href="tel:1800007007">1800 007 007</a><br>Lifeline: <a href="tel:131114">13 11 14</a><br>Emergency: <a href="tel:000">000</a></p></div>'+
   '<div class="card"><b>Your data</b><p class="muted" style="margin:.3rem 0">Stays on this device. Nothing is sent anywhere.</p><button class="btn alt full" data-act="copy">Copy this month\'s summary</button><button class="btn alt full" data-act="wipe">Erase everything</button></div>'+
   '<p class="note">BudgetPilot gives general information, not financial advice.</p>'
}
function render(){
  const m=calc();
  const body=S.tab==="overview"?overview(m):S.tab==="coach"?coach():S.tab==="entries"?entries():help();
  $("app").innerHTML='<main class="frame"><img class="hero" src="'+HERO+'" alt="">'+
  '<div class="pad">'+
  '<div class="mnav"><button class="arrow" data-act="prev" aria-label="Previous month">&lsaquo;</button><b>'+monthName(S.month)+'</b><button class="arrow" data-act="nextm" aria-label="Next month">&rsaquo;</button></div>'+
  tilesHtml(m)+
  '<div class="add"><button class="btn" data-act="add" data-t="in">+ Income</button><button class="btn" data-act="add" data-t="out">+ Expense</button></div>'+
  '<div class="tabs">'+[["overview","Overview"],["coach","Coach"],["entries","Entries"],["help","Help"]].map(t=>'<button data-act="tab" data-t="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'">'+t[1]+"</button>").join("")+"</div>"+
  body+"</div></main>"
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function sheet(type){
  const d=document.createElement("div");d.className="ov";d.id="ov";
  const defDate=(S.month===ym(new Date()))?todayStr():S.month+"-01";
  d.innerHTML='<div class="sheet"><h2 style="margin-top:0">'+(type==="in"?"Add income":"Add an expense")+'</h2>'+
  '<label>Amount ($)</label><input id="f_a" type="number" inputmode="decimal" placeholder="0.00">'+
  (type==="out"?'<label>What was it for? (tap one)</label><div class="cgrid" id="f_c" data-v="'+(S.lastCat||"groceries")+'">'+CATS.map(c=>'<button type="button" class="cbtn'+(c.id===(S.lastCat||"groceries")?" on":"")+'" data-id="'+c.id+'" style="--c:'+c.c+'">'+c.n+"</button>").join("")+"</div>":"")+
  '<label>Note (optional)</label><input id="f_n" type="text" placeholder="'+(type==="in"?"e.g. Pay":"e.g. Woolworths")+'">'+
  '<label>Date</label><input id="f_d" type="date" value="'+defDate+'">'+
  '<div class="err" id="err"></div><button class="btn full" id="f_save">Save</button><button class="btn alt full" id="f_more">Save and add another</button><button class="btn alt full" id="f_x" style="border:0;color:var(--muted)">Cancel</button></div>';
  d.addEventListener("click",e=>{const b=e.target.closest(".cbtn");if(!b)return;document.querySelectorAll(".cbtn").forEach(x=>x.classList.remove("on"));b.classList.add("on");$("f_c").dataset.v=b.dataset.id});
  document.body.appendChild(d);
  $("f_a").focus();
  $("f_x").onclick=()=>d.remove();
  d.onclick=e=>{if(e.target===d)d.remove()};
  const commit=again=>{
    const a=parseFloat($("f_a").value);
    if(!(a>0)){$("err").textContent="Type the amount first.";return}
    const dt=$("f_d").value||defDate;
    const c=type==="out"?$("f_c").dataset.v:null;if(c)S.lastCat=c;
    S.entries.push({id:uid(),type,amt:Math.round(a*100)/100,cat:c,note:$("f_n").value.trim(),date:dt});
    S.month=dt.slice(0,7);save();d.remove();render();toast("Saved");
    if(again)sheet(type)
  };
  $("f_save").onclick=()=>commit(false);$("f_more").onclick=()=>commit(true)
}
function sampleMonth(){
  const k=S.month,D=n=>k+"-"+String(n).padStart(2,"0");
  const add=(t,a,c,n,d)=>S.entries.push({id:uid(),type:t,amt:a,cat:c,note:n,date:D(d)});
  add("in",2150,null,"Pay",5);add("in",2150,null,"Pay",19);add("in",120,null,"Side job",12);
  add("out",1380,"housing","Rent",1);add("out",412.4,"groceries","Supermarket",4);add("out",187.65,"groceries","Supermarket",18);
  add("out",96.5,"transport","Fuel",7);add("out",84,"transport","Fuel",21);add("out",168,"bills","Power",9);add("out",89,"bills","Internet & phone",10);
  add("out",65,"health","Pharmacy",14);add("out",134.2,"eating","Takeaway & cafes",16);add("out",78,"fun","Streaming & hobbies",3);add("out",142.9,"shopping","Clothes",20);add("out",45,"other","Gift",24);
  save()
}
const ACT={
 prev(){S.month=shift(S.month,-1);save();render()},
 nextm(){S.month=shift(S.month,1);save();render()},
 tab(el){S.tab=el.dataset.t;render()},
 add(el){sheet(el.dataset.t)},
 del(el){if(confirm("Delete this entry?")){S.entries=S.entries.filter(e=>e.id!==el.dataset.id);save();render()}},
 ask(el){S.chat.push({q:el.dataset.q,a:COACH[el.dataset.k](calc())});render();scrollEnd()},
 send(){const i=$("q"),v=i.value.trim();if(!v)return;S.chat.push({q:v,a:COACH[route(v)](calc())});render();scrollEnd()},
 sample(){if(monthEntries().length&&!confirm("This will add a sample month on top of what's already here. Continue?"))return;sampleMonth();S.tab="overview";render();toast("Sample month loaded")},
 clearmonth(){if(confirm("Delete everything logged for "+monthName(S.month)+"?")){S.entries=S.entries.filter(e=>e.date.slice(0,7)!==S.month);save();render()}},
 wipe(){if(confirm("Erase everything in BudgetPilot? This can't be undone.")){S=blank();save();render()}},
 copy(){
  const m=calc();let t="BudgetPilot - "+monthName(S.month)+"\nIncome: "+dollars(m.inc)+"\nExpenses: "+dollars(m.out)+"\nRemaining: "+dollars(m.rem)+"\nSavings rate: "+(m.rate==null?"-":Math.round(m.rate)+"%")+"\n";
  ranked(m).forEach(x=>t+=x.c.n+": "+dollars(x.v)+"\n");
  try{navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>fb(t))}catch(e){fb(t)}
 }
};
function fb(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(e){toast("Couldn't copy")}ta.remove()}
function scrollEnd(){setTimeout(()=>{const i=$("q");if(i)i.scrollIntoView({block:"center"})},30)}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="q")ACT.send()});
render();
</script>
</body>
</html>
