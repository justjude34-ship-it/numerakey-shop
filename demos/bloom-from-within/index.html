/* ------------------------------------------------------------- pin lock */
let unlocked = false;
async function hashPin(p){
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('bloom:'+p));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0; for(let i=0;i<p.length;i++){ h=(h*31+p.charCodeAt(i))|0; } return 'f'+h;
  }
}
function renderLock(){
  $('#tabs').hidden = true;
  let entry = '';
  const paint = ()=>{
    $('#app').innerHTML = '<div class="lock" id="lockw">'+
      seatedFigure(true)+
      '<h1 class="title grad" style="font-size:26px;margin-top:22px">Bloom From Within</h1>'+
      '<p class="sub">Enter your PIN</p>'+
      '<div class="dots">'+[0,1,2,3].map(i=>'<i class="'+(i<entry.length?'on':'')+'"></i>').join('')+'</div>'+
      '<div class="keys">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-pin="'+n+'">'+n+'</button>').join('')+
        '<button></button><button data-pin="0">0</button><button data-pin="del">\u232b</button></div>'+
      '</div>';
    $$('[data-pin]').forEach(b=> b.onclick = async ()=>{
      const v = b.dataset.pin;
      if(v==='del'){ entry = entry.slice(0,-1); paint(); return; }
      if(entry.length>=4) return;
      entry += v; paint();
      if(entry.length===4){
        const h = await hashPin(entry);
        if(h===S.settings.pinHash){ unlocked = true; render(); }
        else { const w=$('#lockw'); if(w) w.classList.add('shake'); entry=''; setTimeout(paint,420); }
      }
    });
  };
  paint();
}
function openPinSetup(){
  if(S.settings.pinHash){
    sheet('<h2>PIN lock</h2><p class="hint">A PIN is on. It keeps a casual look over your shoulder out, nothing stronger than that.</p>'+
      '<button class="btn sm danger" id="pinOff" style="margin-top:16px">Turn PIN off</button>');
    $('#pinOff').onclick = ()=>{ S.settings.pinHash=null; save(); closeSheet(); render(); toast('PIN removed'); };
    return;
  }
  sheet('<h2>Set a PIN</h2><p class="hint">Four digits, asked for each time the app opens. There is no way to recover it, so choose something you will not lose.</p>'+
    '<div class="field" style="margin-top:16px"><label class="fl">New PIN</label>'+
      '<input type="text" inputmode="numeric" maxlength="4" id="pin1" placeholder="0000"></div>'+
    '<div class="field"><label class="fl">Confirm</label>'+
      '<input type="text" inputmode="numeric" maxlength="4" id="pin2" placeholder="0000"></div>'+
    '<button class="btn primary" id="pinSave">Turn PIN on</button>');
  $('#pinSave').onclick = async ()=>{
    const a=$('#pin1').value.trim(), b=$('#pin2').value.trim();
    if(!/^\d{4}$/.test(a)){ toast('Four digits, please'); return; }
    if(a!==b){ toast('Those do not match'); return; }
    S.settings.pinHash = await hashPin(a); unlocked = true; save(); closeSheet(); toast('PIN on');
  };
}
function openHardDates(){
  const rows = (S.hardDates||[]).map(h=>
    '<div class="between" style="padding:11px 0;border-bottom:1px solid var(--line)">'+
    '<div><div style="font-size:14px">'+esc(h.label)+'</div><div class="hint">'+h.md.split('-').reverse().join('/')+'</div></div>'+
    '<button class="p-go" data-hddel="'+h.id+'">Remove</button></div>').join('');
  sheet('<div class="between"><h2>Dates your body remembers</h2><button class="iconbtn" id="hdclose">'+svg(I.close)+'</button></div>'+
    '<p class="hint">Anniversaries, court dates, the day something happened. On these days the app quietly lowers the bar instead of asking more of you.</p>'+
    (rows||'')+
    '<div class="field" style="margin-top:16px"><label class="fl">What is the date?</label><input type="date" id="hdDate"></div>'+
    '<div class="field"><label class="fl">Name it however you want</label><input type="text" id="hdLabel" placeholder="A hard anniversary"></div>'+
    '<button class="btn sm" id="hdSave">Add date</button>');
  $('#hdclose').onclick = closeSheet;
  $('#hdSave').onclick = ()=>{
    const v=$('#hdDate').value, l=$('#hdLabel').value.trim()||'A date that matters';
    if(!v){ toast('Pick a date'); return; }
    const p = v.split('-').map(Number);
    S.hardDates.push({id:uid(), md:p[1]+'-'+p[2], label:l});
    save(); closeSheet(); render(); toast('Date added');
  };
}
function exportJournalText(){
  const lines = S.journal.slice().sort((a,b)=>a.ts-b.ts).map(e=>
    prettyDate(e.date)+' \u2014 '+(PROMPTS[e.cat]?PROMPTS[e.cat].label:(e.cat==='review'?'Weekly review':'Free'))+
    '\n'+(e.prompt?e.prompt+'\n':'')+'\n'+e.text+'\n\n' + '-'.repeat(40)+'\n');
  const blob = new Blob(['Bloom From Within \u2014 journal\n\n'+lines.join('\n')],{type:'text/plain'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='bloom-journal-'+TODAY()+'.txt'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Journal exported');
}

/* ------------------------------------------------------------ add / edit forms */
function openAddPractice(){
  sheet('<h2>Add a practice</h2><p class="hint">Make it small enough that a bad day cannot beat it.</p>'+
    '<div class="field" style="margin-top:16px"><label class="fl">Name</label><input type="text" id="npTitle" placeholder="Ten minutes outside"></div>'+
    '<div class="field"><label class="fl">What it is, in one line</label><input type="text" id="npDesc" placeholder="Daylight before screens"></div>'+
    '<div class="field"><label class="fl">Category</label><select id="npCat">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select></div>'+
    '<button class="btn primary" id="npSave">Add practice</button>');
  $('#npSave').onclick = ()=>{
    const t = $('#npTitle').value.trim(); if(!t){ $('#npTitle').focus(); return; }
    S.practices.push({id:uid(), title:t, desc:$('#npDesc').value.trim(), cat:$('#npCat').value, archived:false, order:S.practices.length});
    save(); closeSheet(); render(); toast('Practice added');
  };
}
function openAddCommit(){
  sheet('<h2>New commitment</h2><p class="hint">A promise plus the reason behind it. The reason is the part that holds.</p>'+
    '<div class="field" style="margin-top:16px"><label class="fl">What are you committing to?</label>'+
      '<input type="text" id="ncText" placeholder="Answer messages when I have capacity, not instantly"></div>'+
    '<div class="field"><label class="fl">Why does it matter?</label>'+
      '<textarea id="ncWhy" style="min-height:90px" placeholder="Because instant is a survival habit, not a value of mine."></textarea></div>'+
    '<button class="btn primary" id="ncSave">Add commitment</button>');
  $('#ncSave').onclick = ()=>{
    const t=$('#ncText').value.trim(); if(!t){ $('#ncText').focus(); return; }
    S.commitments.push({id:uid(), text:t, why:$('#ncWhy').value.trim(), created:TODAY(), days:[]});
    save(); closeSheet(); render(); toast('Commitment added');
  };
}
function openWrite(cat, editId){
  const entry = editId ? S.journal.find(e=>e.id===editId) : null;
  const c = entry ? entry.cat : cat;
  const isFree = c==='free' || !PROMPTS[c];
  const list = isFree ? [] : PROMPTS[c].list;
  let prompt = entry ? entry.prompt : (isFree ? '' : list[new Date().getDate()%list.length]);
  const draw = ()=>{
    sheet('<div class="between"><h2>'+(isFree?'Free writing':PROMPTS[c].label)+'</h2>'+
      '<button class="iconbtn" id="jclose">'+svg(I.close)+'</button></div>'+
      (isFree?'' : '<div class="j-prompt" id="jp" style="font-size:15px;margin:10px 0 6px">'+esc(prompt)+'</div>'+
        '<button class="p-go" id="jshuffle">Different prompt</button>')+
      '<div class="field" style="margin-top:14px">'+
        '<textarea id="jtext" style="min-height:190px" placeholder="No one is reading this. Spelling does not matter.">'+esc(entry?entry.text:'')+'</textarea></div>'+
      '<button class="btn primary" id="jsave">'+(entry?'Save changes':'Save entry')+'</button>'+
      (entry?'<button class="btn sm ghost danger" id="jdel" style="margin-top:8px">Delete entry</button>':'')+
      '<p class="note" style="margin-top:14px">If writing about this starts to feel like too much, stop and orient instead. Stopping is a skill.</p>');
    $('#jclose').onclick = closeSheet;
    const sh = $('#jshuffle');
    if(sh) sh.onclick = ()=>{ const cur=$('#jtext').value; prompt = list[Math.floor(Math.random()*list.length)];
      $('#jp').textContent = prompt; $('#jtext').value = cur; };
    $('#jsave').onclick = ()=>{
      const t = $('#jtext').value.trim(); if(!t){ $('#jtext').focus(); return; }
      if(entry){ entry.text=t; entry.prompt=prompt; }
      else S.journal.push({id:uid(), date:TODAY(), ts:Date.now(), cat:isFree?'free':c, prompt:prompt, text:t});
      save(); closeSheet(); render(); toast(entry?'Entry saved':'Entry saved');
    };
    const del = $('#jdel');
    if(del) del.onclick = ()=>{ if(confirm('Delete this entry permanently?')){ S.journal = S.journal.filter(e=>e.id!==entry.id); save(); closeSheet(); render(); toast('Entry deleted'); } };
  };
  draw();
}
function openIntentHistory(){
  const rows = Object.keys(S.intentions).sort().reverse().map(k=>
    '<div style="padding:12px 0;border-bottom:1px solid var(--line)">'+
    '<div class="hint">Week of '+parseKey(k).toLocaleDateString(undefined,{day:'numeric',month:'long'})+'</div>'+
    '<div style="font-family:var(--serif);font-size:14.5px;margin-top:5px;color:var(--dim)">'+esc(S.intentions[k])+'</div></div>').join('');
  sheet('<h2>Past intentions</h2>'+rows+'<button class="btn sm ghost" id="ihc" style="margin-top:16px">Close</button>');
  $('#ihc').onclick = closeSheet;
}
function openSettings(){
  const sw = (id,on)=>'<button class="sw '+(on?'on':'')+'" data-sw="'+id+'" aria-label="toggle"><i></i></button>';
  sheet('<div class="between"><h2>Settings</h2><button class="iconbtn" id="setclose">'+svg(I.close)+'</button></div>'+
    '<div class="field" style="margin-top:16px"><label class="fl">Name</label><input type="text" id="setName" value="'+esc(S.name)+'"></div>'+
    '<div class="field"><label class="fl">Why you are here</label><textarea id="setWhy" style="min-height:80px">'+esc(S.why||'')+'</textarea></div>'+
    '<button class="btn sm" id="setSave">Save</button>'+
    '<div class="divider"></div>'+
    '<div class="settings-row"><div><div class="t">Gentle mode</div><div class="d">Hides streaks and scores. Use it when counting starts to feel like pressure.</div></div>'+sw('gentle',S.settings.gentle)+'</div>'+
    '<div class="settings-row"><div><div class="t">Reduce motion</div><div class="d">Stops the breathing animation and transitions.</div></div>'+sw('reduceMotion',S.settings.reduceMotion)+'</div>'+
    '<div class="settings-row"><div><div class="t">Show journal prompts</div><div class="d">Turn off for a blank page only.</div></div>'+sw('showPrompts',S.settings.showPrompts)+'</div>'+
    '<div class="settings-row"><div><div class="t">Gentle vibration</div><div class="d">A small buzz when you complete something or a timer ends.</div></div>'+sw('haptics',S.settings.haptics)+'</div>'+
    '<div class="divider"></div>'+
    '<div class="settings-row"><div><div class="t">PIN lock</div><div class="d">'+(S.settings.pinHash?'On. Asked for each time the app opens.':'Off. Add a four digit PIN before the journal holds much.')+'</div></div>'+
      '<button class="p-go" data-open="pin">'+(S.settings.pinHash?'Change':'Set up')+'</button></div>'+
    '<div class="settings-row"><div><div class="t">Dates your body remembers</div><div class="d">'+((S.hardDates||[]).length||'No')+' saved. The app softens itself on those days.</div></div>'+
      '<button class="p-go" data-open="hardDates">Manage</button></div>'+
    '<div class="divider"></div>'+
    '<div class="btn2"><button class="btn sm" id="expBtn">Export data</button><button class="btn sm" id="impBtn">Import data</button></div>'+
    '<button class="btn sm" id="expTxt" style="margin-top:10px">Export journal as text</button>'+
    '<input type="file" id="impFile" accept="application/json" hidden>'+
    '<button class="btn sm danger" id="resetBtn" style="margin-top:10px">Erase everything</button>'+
    '<div class="divider"></div>'+
    '<p class="note">Bloom From Within is a self-guided companion for trauma recovery and nervous system care. It is not therapy, diagnosis, or crisis support, and it does not replace working with a trained person.</p>'+
    '<p class="note" style="margin-top:10px">If things feel unsafe or bigger than an app, please contact your doctor, a therapist, or your local crisis line. Reaching out is a nervous system skill too.</p>'+
    '<p class="note" style="margin-top:10px">All data is stored only in this browser on this device. Clearing site data will erase it, so export now and then.</p>');
  $('#setclose').onclick = closeSheet;
  $('#setSave').onclick = ()=>{ const n=$('#setName').value.trim(); if(n) S.name=n; S.why=$('#setWhy').value.trim(); save(); render(); toast('Saved'); };
  $$('[data-sw]').forEach(b=> b.onclick = ()=>{
    const k=b.dataset.sw; S.settings[k]=!S.settings[k]; save(); b.classList.toggle('on',S.settings[k]);
    document.body.classList.toggle('reduced', !!S.settings.reduceMotion);
  });
  $('#expBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'bloom-from-within-'+TODAY()+'.json';
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); toast('Exported');
  };
  $('#expTxt').onclick = exportJournalText;
  $('#impBtn').onclick = ()=> $('#impFile').click();
  $('#impFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!d.practices) throw 0;
        if(confirm('Replace everything currently in the app with this file?')){ S=d; load(); save(); closeSheet(); render(); toast('Data imported'); }
      }catch(err){ toast('That file could not be read'); }
    };
    r.readAsText(f);
  };
  $('#resetBtn').onclick = ()=>{
    if(!confirm('Erase all practices, check-ins, journal entries and progress? This cannot be undone.')) return;
    if(!confirm('Really erase everything?')) return;
    localStorage.removeItem(KEY); S = blank(); save(); closeSheet(); render();
  };
}

/* ================================================================ actions */
function setDone(id,val){
  const r = rec(TODAY());
  const has = r.done.includes(id);
  if(val===true && !has) r.done.push(id);
  if(val===false && has) r.done = r.done.filter(x=>x!==id);
  if(val==null) r.done = has ? r.done.filter(x=>x!==id) : r.done.concat([id]);
  save();
}
function afterRender(){
  const cap = $('#bannerCap');
  if(cap){
    const p = pct(TODAY());
    cap.textContent = p===0 ? 'Nothing yet today. Starting counts.'
      : p>=60 ? 'You met yourself today.'
      : 'Something is better than the whole thing.';
  }
  const act = $('#act');
  if(act){
    act.oninput = ()=>{ const r=rec(TODAY()); r.activation = +act.value; save(); render(); };
  }
  const sn = $('#saveNote');
  if(sn) sn.onclick = ()=>{ rec(TODAY()).note = $('#cnote').value.trim(); save(); toast('Note saved'); };
  const si = $('#saveIntent');
  if(si) si.onclick = ()=>{ const v=$('#intent').value.trim(); if(v) S.intentions[weekStartKey()]=v; else delete S.intentions[weekStartKey()]; save(); toast('Intention saved'); render(); };
  const js = $('#jsearch');
  if(js){
    js.oninput = ()=>{ journalQuery = js.value; };
    js.onchange = ()=>{ journalQuery = js.value; render(); setTimeout(()=>{ const n=$('#jsearch'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },0); };
    js.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); js.blur(); } });
  }
  const gi = $('#glimIn');
  if(gi) gi.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ ev.preventDefault();
    const b=document.querySelector('[data-glimmer]'); if(b) b.click(); } });
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-tab],[data-tab-go],[data-toggle],[data-guide],[data-filter],[data-archive],[data-restore],[data-open],[data-scale],[data-milestone],[data-state],[data-honour],[data-write],[data-jedit],[data-jdel],[data-jfilter],[data-cdel],[data-practice],[data-body],[data-rest],[data-glimmer],[data-gdel],[data-celeb],[data-pedit],[data-pmove],[data-hddel]');
  if(!t) return;
  const d = t.dataset;
  if(d.body!==undefined){ const r=rec(TODAY()); r.body=r.body||[];
    r.body = r.body.includes(d.body) ? r.body.filter(x=>x!==d.body) : r.body.concat([d.body]); save(); render(); return; }
  if(d.rest){ const r=rec(TODAY()); r.rest = !r.rest; save(); haptic(); render();
    toast(r.rest?'Rest day. Your streak holds.':'Rest day removed'); return; }
  if(d.glimmer){ const inp=$('#glimIn'); const v=inp?inp.value.trim():'';
    if(!v){ if(inp) inp.focus(); return; }
    S.glimmers.push({id:uid(), date:TODAY(), ts:Date.now(), text:v}); save(); haptic(); render(); toast('Glimmer kept'); return; }
  if(d.gdel){ S.glimmers = S.glimmers.filter(g=>g.id!==d.gdel); save(); render(); return; }
  if(d.celeb){ S.celebrated.push(+d.celeb); save(); render(); return; }
  if(d.pedit) return openEditPractice(d.pedit);
  if(d.pmove){ const parts=d.pmove.split(':'); movePractice(parts[0], +parts[1]); return; }
  if(d.hddel){ S.hardDates = S.hardDates.filter(h=>h.id!==d.hddel); save(); closeSheet(); openHardDates(); return; }
  if(d.tab) return go(d.tab);
  if(d.tabGo) return go(d.tabGo);
  if(d.toggle){ setDone(d.toggle,null); haptic(); render(); return; }
  if(d.guide) return openGuide(d.guide);
  if(d.practice && !d.toggle && !d.guide){ if(builtin(d.practice)) return openGuide(d.practice); }
  if(d.filter){ filterCat = d.filter; render(); return; }
  if(d.jfilter){ journalFilter = d.jfilter; render(); return; }
  if(d.archive){ const p=S.practices.find(x=>x.id===d.archive); if(p){p.archived=true; save(); render(); toast('Archived');} return; }
  if(d.restore){ const p=S.practices.find(x=>x.id===d.restore); if(p){p.archived=false; save(); render(); toast('Restored');} return; }
  if(d.scale){ const r=rec(TODAY()); const v=+d.val; r[d.scale] = r[d.scale]===v?null:v; save(); render(); return; }
  if(d.milestone){ const r=rec(TODAY()); const m=d.milestone;
    r.milestones = r.milestones.includes(m) ? r.milestones.filter(x=>x!==m) : r.milestones.concat([m]); save(); render(); return; }
  if(d.state){ const r=rec(TODAY()); r.state = r.state===d.state?null:d.state; save(); render(); return; }
  if(d.honour){ const c=S.commitments.find(x=>x.id===d.honour); if(c){ c.days=c.days||[];
      const k=TODAY(); c.days = c.days.includes(k)?c.days.filter(x=>x!==k):c.days.concat([k]); save(); render(); } return; }
  if(d.cdel){ if(confirm('Remove this commitment?')){ S.commitments = S.commitments.filter(c=>c.id!==d.cdel); save(); render(); } return; }
  if(d.write) return openWrite(d.write);
  if(d.jedit) return openWrite(null, d.jedit);
  if(d.jdel){ if(confirm('Delete this entry permanently?')){ S.journal=S.journal.filter(x=>x.id!==d.jdel); save(); render(); toast('Entry deleted'); } return; }
  if(d.open==='settings') return openSettings();
  if(d.open==='addPractice') return openAddPractice();
  if(d.open==='addCommit') return openAddCommit();
  if(d.open==='intentHistory') return openIntentHistory();
  if(d.open==='settle') return openSettle();
  if(d.open==='review') return openWeeklyReview();
  if(d.open==='pin') return openPinSetup();
  if(d.open==='hardDates') return openHardDates();
});

/* ================================================================ install */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredPrompt = e; render(); });
function installBanner(){
  if(!deferredPrompt) return '';
  return '<div class="card tight" style="margin-top:18px"><div class="between">'+
    '<div><div style="font-size:14px;font-weight:500">Keep it on your home screen</div>'+
    '<div class="hint" style="margin-top:3px">Opens full screen and works offline.</div></div>'+
    '<button class="p-go" id="installBtn" style="color:var(--ink)">Install</button></div></div>';
}
document.addEventListener('click', e=>{
  if(e.target && e.target.id==='installBtn' && deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; render(); });
  }
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* =================================================================== boot */
load();
if(!S.seeded && S.name) seedHistory();
const hash = (location.hash||'').replace('#','');
if(['checkin','journal','practices','progress'].includes(hash)) tab = hash;
render();
if(hash==='settle' && S.name && !(S.settings.pinHash && !unlocked)) setTimeout(openSettle, 260);
window.addEventListener('pageshow', ()=>{ if(S && S.name) render(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ stopTools(); }
});
</script>
</body>
</html>
