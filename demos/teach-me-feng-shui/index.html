.opt.right{border-color:var(--wood);background:#0b1a11}
.opt.wrong{border-color:var(--fire);background:#1c0b10}
.why{display:none;color:var(--muted);font-size:.94rem;margin-top:8px}
.q.answered .why{display:block}
.score{color:var(--muted);font-size:.9rem;margin:6px 0 0}
textarea{width:100%;min-height:110px;background:#0b0911;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;resize:vertical}

.gua.on{box-shadow:0 0 0 2px var(--c,#b86bff) inset;background:#14101e}

.door{text-align:center;color:var(--muted);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;border-top:3px solid var(--p);padding-top:6px;margin:0 20px 12px;border-radius:2px}
.panel{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;margin:10px 0}

.seg{display:flex;gap:6px;background:#0b0911;border:1px solid var(--line);border-radius:12px;padding:4px;margin:8px 0}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;border-radius:9px;padding:9px 6px;cursor:pointer;min-height:42px;font-size:.88rem}
.seg button.on{background:#1b1528;color:var(--text)}
.acc{border:1px solid var(--line);border-radius:16px;background:var(--card);margin:10px 0;overflow:hidden}
.acc button{width:100%;text-align:left;background:transparent;border:0;color:var(--text);font:inherit;font-weight:700;padding:15px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;min-height:52px}

.acc ul{margin:6px 0 0;padding-left:20px}
.acc li{margin:5px 0}

.done-card h2{font-size:1.7rem}
.fade{animation:f .28s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes drift{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
.flow{stroke-dasharray:6 8;animation:drift 4s linear infinite}
@media (prefers-reduced-motion:reduce){.flow{animation:none}.fade{animation:none}}
footer{color:var(--muted);font-size:.82rem;text-align:center;margin:30px 0 10px}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:8px}

{
 t:"What feng shui really is",sub:"The idea, the history, and how this course works",
 lead:"Feng shui is the old Chinese art of arranging a space so it supports the people living in it.",
 blocks:[
  {h:"Wind and water",p:["Feng shui (pronounced \"fung shway\") means wind and water. The name comes from an old idea: energy is carried by the wind and held by the water, so a good place for a home is one where both are gentle and well placed.","It began thousands of years ago as a way of choosing where to build villages and homes, looking at hills, rivers, sunlight and shelter. Over time it grew into a full system for arranging whatever is inside the walls too."]},
  {h:"Chi: the feel of a space",p:["The central word is chi (also written qi), usually described as life energy. You don't need to believe in anything mystical to use it. Think of chi as the feel of a space: the way a tidy, bright, welcoming room lifts you, and the way a cramped, dim, cluttered one drags at you.","Feng shui asks one question again and again: how does this space make me feel, and how can I arrange it so it supports me better?"]},
  {h:"Two main schools",p:["The Form school looks at shapes, layout, light and the flow of movement through a space. It's visual and practical.","The Compass school works with directions and calculations, often using a compass and a person's birth details. It's more technical.","This course teaches the Form approach plus the door-based bagua map that most modern, home-friendly feng shui uses. It's the best route for beginners because everything can be seen and tried straight away."]},
  {h:"What to expect",p:["Seven short lessons, each with a few ideas, something to try at home, and a quick quiz. Do one a day, or all seven in a weekend. By the end you'll be able to walk into any room and read it, and you'll have a simple plan for your own home."]}
 ],
 call:{t:"Remember",b:"Feng shui isn't about buying objects. It's about noticing how your space feels and arranging it on purpose.",c:""},
 act:{h:"Try it at home",items:["Go outside your front door, then walk in slowly as if you were a visitor.","Notice the very first feeling you get in the doorway. Welcomed, blocked, squeezed, calm?","Write that first feeling in your notes below. You'll come back to it in lesson 7."]},
 quiz:[
  {q:"What does \"feng shui\" literally mean?",a:["Wind and water","Home and garden","Light and shadow"],c:0,w:"Wind carries energy and water holds it. That's the root of the name."},
  {q:"What is chi best understood as, for everyday use?",a:["A kind of money luck","The feel and vitality of a space","A type of furniture"],c:1,w:"Chi is the life energy of a place, which you can sense as how a room makes you feel."},
  {q:"Which school looks at layout, shapes and flow you can see?",a:["Form school","Compass school","Colour school"],c:0,w:"The Form school is visual and practical, which makes it the best place to start."}
 ]
},
{
 t:"Chi and flow",sub:"The front door, the command position and sharp edges",
 lead:"Chi should move through a home like a gentle stream: not rushing, not stuck.",
 blocks:[
  {h:"Too fast, too slow",p:["When chi travels in a straight line, such as a long hallway running from the front door to a back door, it rushes straight through without settling. Homes like this can feel like nothing stays. Slow it down with a rug, a plant, a curtain or a piece of furniture that makes the path curve a little.","When chi can't move, because of clutter, blocked corners, or doors that won't open fully, it stagnates. These are the dull, heavy spots in a home."]},
  {h:"The mouth of chi",p:["The front door is where chi, and everything else, enters your life. It's called the mouth of chi. Keep it clear, well lit, easy to open all the way, and welcoming. A tidy entrance sets the tone for the whole home."]},
  {h:"The command position",p:["This is one of the most useful ideas in feng shui. Where you spend long stretches, such as your bed, your desk and your stove, place yourself so you can see the door without being directly in line with it, with a solid wall behind you.","Why it works: it's how a person feels safest. Your back is supported, nothing can sneak up on you, and you can see what's coming. That quiet sense of security is what makes a bed restful and a desk focused."]},
  {h:"Sharp edges and poison arrows",p:["Sharp corners, pointed beams or the edge of a wall pointing at where you sit or sleep are called poison arrows (sha chi). They create a low-level feeling of being pressed on. Soften them with a plant, a rounded piece of furniture, a drape or simply by moving your seat out of their line."]},
  {h:"Light and windows",p:["Light is the easiest way to move chi. Clean windows, open curtains in the day, and lamps in dark corners wake a room up. A room that is always dim feels stuck, whatever its layout."]}
 ],
 call:{t:"Quick rule",b:"See the door, don't sit in line with it, and keep a solid wall at your back. Apply that to your bed and desk first.",c:"t"},

/* ---------- state & render ---------- */
var V={view:"home",i:0};
var ringEl=$("#ring");

function pct(){var n=0;for(var i=0;i<LESSONS.length;i++)if(S.done[i])n++;return n;}
function drawRing(){
  var n=pct(),f=n/LESSONS.length,c=2*Math.PI*18,off=c*(1-f);
  ringEl.innerHTML='<svg width="46" height="46" viewBox="0 0 46 46"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b86bff"/><stop offset=".6" stop-color="#ff5fa8"/><stop offset="1" stop-color="#2ee6c8"/></linearGradient></defs><circle cx="23" cy="23" r="18" fill="none" stroke="#221d30" stroke-width="4"/><circle cx="23" cy="23" r="18" fill="none" stroke="url(#rg)" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 23 23)"/></svg><span>'+n+'/'+LESSONS.length+'</span>';
}
function tabs(){$$(".tab").forEach(function(b){var v=b.getAttribute("data-v");b.classList.toggle("on",(V.view==="lesson"?"home":V.view)===v);});}
function go(view,i){if(view==="lesson"&&typeof i==="number"&&i>=2){if(window.NKDemo)NKDemo.show("Lessons 3 to 7 are part of the full app.");return;}V.view=view;if(typeof i==="number")V.i=i;render();window.scrollTo(0,0);}

function render(){
  drawRing();tabs();
  if(V.view==="home")home();
  else if(V.view==="lesson")lesson();
  else if(V.view==="gloss")gloss();
  else if(V.view==="plan")plan();
}

function home(){
  var n=pct(),next=0,i;
  for(i=0;i<LESSONS.length;i++){if(!S.done[i]){next=i;break;}if(i===LESSONS.length-1)next=i;}
  var h='<div class="fade"><div class="hero">'+ART.hero()+'<div class="txt"><h1 class="gt">Teach Me Feng Shui</h1><p>Seven short lessons to read any room, balance a home, and make your space work for you. No experience needed.</p><div class="row cta"><button class="btn" id="go-next">'+(n===0?"Start lesson 1":n===LESSONS.length?"Review the course":"Continue with lesson "+(next+1))+'</button></div></div></div><div class="sec">The course</div><div class="list">';
  LESSONS.forEach(function(L,k){h+='<button class="lcard'+(S.done[k]?" done":"")+'" data-l="'+k+'"><div class="num">'+(S.done[k]?"&#10003;":(k+1))+'</div><div><h3>'+L.t+'</h3><small>'+L.sub+'</small></div><div class="chev">&rsaquo;</div></button>';});
  h+='</div>';
  if(n===LESSONS.length)h+='<div class="done-card"><h2 class="gt">Course complete</h2><p class="lead">You can now read a space and know what to adjust. Revisit your plan any time.</p><button class="btn" id="to-plan">Open my plan</button></div>';
  h+='<footer>Saved on this device &middot; <button id="reset">Reset progress</button></footer></div>';
  app.innerHTML=h;
  $("#go-next").onclick=function(){go("lesson",n===LESSONS.length?0:next);};
  $$(".lcard").forEach(function(b){b.onclick=function(){go("lesson",+b.getAttribute("data-l"));};});
  var tp=$("#to-plan");if(tp)tp.onclick=function(){go("plan");};
  $("#reset").onclick=function(){if(confirm("Clear all progress, notes and your plan on this device?")){S={done:[],notes:{},plan:["","",""],checks:{},quiz:{},last:0};save();render();}};
}

function lesson(){
  var k=V.i,L=LESSONS[k],h='<div class="fade"><div class="lhero">'+ART[k+1]()+'</div><div class="eyebrow">Lesson '+(k+1)+' of '+LESSONS.length+'</div><h1 class="lt gt">'+L.t+'</h1><p class="lead">'+L.lead+'</p>';
  L.blocks.forEach(function(b){
    if(b.w){h+='<div class="blk" data-w="'+b.w+'"></div>';return;}
    h+='<div class="blk"><h2>'+b.h+'</h2>'+b.p.map(function(p){return '<p>'+p+'</p>';}).join("")+'</div>';
  });
  h+='<div class="callout '+(L.call.c||"")+'"><b>'+L.call.t+'</b>'+L.call.b+'</div>';
  h+='<div class="act"><h3>'+L.act.h+'</h3>';
  L.act.items.forEach(function(t,j){var id=k+"-"+j;h+='<label class="chk"><input type="checkbox" data-c="'+id+'"'+(S.checks[id]?" checked":"")+'><span>'+t+'</span></label>';});
  h+='</div><div class="sec">Quick quiz</div>';
  L.quiz.forEach(function(q,j){
    h+='<div class="q" data-q="'+j+'"><p>'+q.q+'</p>';
    q.a.forEach(function(a,m){h+='<button class="opt" data-m="'+m+'">'+a+'</button>';});
    h+='<div class="why">'+q.w+'</div></div>';
  });
  h+='<div class="score" id="score"></div>';
  h+='<div class="sec">My notes</div><textarea id="note" placeholder="Anything you noticed, or want to remember from this lesson&hellip;"></textarea>';
  h+='<div class="nav">'+(k>0?'<button class="btn ghost" id="prev">Back</button>':'')+'<button class="btn" id="done">'+(S.done[k]?"Completed &#10003;":"Mark complete")+'</button>'+(k<LESSONS.length-1?'<button class="btn ghost" id="next">Next</button>':'')+'</div></div>';
  app.innerHTML=h;
  $("#note").value=S.notes[k]||"";
  $("#note").oninput=function(){S.notes[k]=this.value;save();};
  $$(".chk input").forEach(function(c){c.onchange=function(){S.checks[c.getAttribute("data-c")]=c.checked;save();};});
  /* quiz */
  var st=S.quiz[k]||{};
  function scoreTxt(){var a=0,r=0,t=L.quiz.length;for(var j=0;j<t;j++){if(st[j]!==undefined){a++;if(st[j]===L.quiz[j].c)r++;}}$("#score").textContent=a?(r+" of "+t+" correct"+(a<t?" so far":"")):"";}
  $$(".q").forEach(function(qb){
    var j=+qb.getAttribute("data-q");
    function mark(sel){
      qb.classList.add("answered");
      $$(".opt",qb).forEach(function(o,m){o.classList.remove("right","wrong");if(m===L.quiz[j].c)o.classList.add("right");else if(m===sel)o.classList.add("wrong");});
    }
    if(st[j]!==undefined)mark(st[j]);
    $$(".opt",qb).forEach(function(o){o.onclick=function(){var m=+o.getAttribute("data-m");st[j]=m;S.quiz[k]=st;save();mark(m);scoreTxt();};});
  });
  scoreTxt();
  var p=$("#prev"),n=$("#next");
  if(p)p.onclick=function(){go("lesson",k-1);};
  if(n)n.onclick=function(){go("lesson",k+1);};
  $("#done").onclick=function(){
    S.done[k]=!S.done[k];save();
    if(S.done[k]){if(k<LESSONS.length-1)go("lesson",k+1);else go("home");}else render();
  };
  S.last=k;save();
  $$("[data-w]").forEach(function(el){var w=el.getAttribute("data-w");({elements:wElements,cycles:wCycles,bagua:wBagua,rooms:wRooms,plan:wPlan})[w](el);});
}

function wCycles(el){
  var order=["Fire","Earth","Metal","Water","Wood"],pos={},mode="prod",cur="Wood";
  order.forEach(function(n,i){var a=(-90+i*72)*Math.PI/180;pos[n]=[160+98*Math.cos(a),150+98*Math.sin(a)];});
  function draw(){
    var s='<svg viewBox="0 0 320 300" width="100%" role="img" aria-label="Five element cycles"><defs>';
    order.forEach(function(n){s+='<marker id="ar'+n+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="'+EL[n].c+'"/></marker>';});
    s+='</defs>';
    var pairs=mode==="prod"?order.map(function(n){return [n,EL[n].feeds];}):order.map(function(n){return [n,EL[n].controls];});
    pairs.forEach(function(p){
      var a=pos[p[0]],b=pos[p[1]],dx=b[0]-a[0],dy=b[1]-a[1],d=Math.sqrt(dx*dx+dy*dy),ux=dx/d,uy=dy/d;
      var hot=(p[0]===cur);
      s+='<line x1="'+(a[0]+ux*28).toFixed(1)+'" y1="'+(a[1]+uy*28).toFixed(1)+'" x2="'+(b[0]-ux*32).toFixed(1)+'" y2="'+(b[1]-uy*32).toFixed(1)+'" stroke="'+EL[p[0]].c+'" stroke-width="'+(hot?3.4:1.6)+'" opacity="'+(hot?1:.45)+'" marker-end="url(#ar'+p[0]+')"/>';
    });
    order.forEach(function(n){s+='<g data-e="'+n+'" style="cursor:pointer"><circle cx="'+pos[n][0].toFixed(1)+'" cy="'+pos[n][1].toFixed(1)+'" r="26" fill="#000" stroke="'+EL[n].c+'" stroke-width="'+(n===cur?4:2)+'"/><text x="'+pos[n][0].toFixed(1)+'" y="'+(pos[n][1]+4).toFixed(1)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="'+EL[n].c+'" font-family="sans-serif">'+n+'</text></g>';});
    s+='</svg>';
    var e=EL[cur],t=mode==="prod"?'<b style="color:'+e.c+'">'+cur+'</b> feeds <b style="color:'+EL[e.feeds].c+'">'+e.feeds+'</b>, and is fed by <b style="color:'+EL[e.fedBy].c+'">'+e.fedBy+'</b>.':'<b style="color:'+e.c+'">'+cur+'</b> controls <b style="color:'+EL[e.controls].c+'">'+e.controls+'</b>, and is controlled by <b style="color:'+EL[e.controlledBy].c+'">'+e.controlledBy+'</b>.';
    el.innerHTML='<div class="seg"><button data-m="prod" class="'+(mode==="prod"?"on":"")+'">Feeds (productive)</button><button data-m="ctrl" class="'+(mode==="ctrl"?"on":"")+'">Controls</button></div>'+s+'<div class="panel">'+t+'<p style="margin-top:6px;color:var(--muted);font-size:.92rem">Tap an element to see its connections.</p></div>';
    $$("[data-m]",el).forEach(function(b){b.onclick=function(){mode=b.getAttribute("data-m");draw();};});
    $$("g[data-e]",el).forEach(function(g){g.onclick=function(){cur=g.getAttribute("data-e");draw();};});
  }
  draw();
}

function wBagua(el){
  var cur=4;
  function draw(){
    var g=BAGUA[cur],h='<div class="bagua">';
    BAGUA.forEach(function(b,i){h+='<button class="gua'+(i===cur?" on":"")+'" data-g="'+i+'" style="--c:'+b.c+'"><span class="dot"></span><b>'+b.n+'</b><i>'+b.el+'</i></button>';});
    h+='</div><div class="door">Front door wall</div>';
    h+='<div class="panel" style="border-color:'+g.c+'55"><h3 style="color:'+g.c+'">'+g.n+' <span style="color:var(--muted);font-weight:500;font-size:.9rem">&middot; '+g.s+'</span></h3><p>'+g.d+'</p><p><b>Element:</b> '+g.el+'</p><p><b>Where:</b> '+g.pos+'</p><p><b>To strengthen it:</b> '+g.act+'</p></div>';
    el.innerHTML=h;
    $$(".gua",el).forEach(function(b){b.onclick=function(){cur=+b.getAttribute("data-g");draw();};});
  }
  draw();
}

function wRooms(el){
  var h="";
  ROOMS.forEach(function(r,i){h+='<div class="acc'+(i===0?" open":"")+'"><button><span>'+r.n+'</span><span class="pl">+</span></button><div class="body"><ul>'+r.b.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ul></div></div>';});
  el.innerHTML=h;
  $$(".acc > button",el).forEach(function(b){b.onclick=function(){b.parentNode.classList.toggle("open");};});
}

function wPlan(el){
  el.innerHTML='<h2>Your three changes</h2><p class="lead" style="margin-bottom:12px">Pick three small, doable changes for your home. Write them here and they\'ll appear on the My plan tab.</p>'+
  [0,1,2].map(function(i){return '<textarea data-p="'+i+'" style="min-height:70px;margin-bottom:10px" placeholder="Change '+(i+1)+'&hellip;"></textarea>';}).join("");
  $$("textarea",el).forEach(function(t){var i=+t.getAttribute("data-p");t.value=S.plan[i]||"";t.oninput=function(){S.plan[i]=t.value;save();};});
}

  var h='<div class="fade"><h1 class="lt gt" style="margin-top:14px">My plan</h1><p class="lead">Your three changes and your notes from each lesson, all in one place.</p><div class="sec">Three changes</div>';
  [0,1,2].forEach(function(i){h+='<textarea data-p="'+i+'" style="min-height:70px;margin-bottom:10px" placeholder="Change '+(i+1)+'&hellip;"></textarea>';});
  h+='<div class="sec">Lesson notes</div>';
  var any=false;
  LESSONS.forEach(function(L,k){var t=(S.notes[k]||"").trim();if(t){any=true;h+='<div class="panel"><h3>'+(k+1)+'. '+L.t+'</h3><p class="note-'+k+'" style="white-space:pre-wrap;margin:0"></p></div>';}});
  if(!any)h+='<p class="lead">Notes you write inside the lessons will show up here.</p>';
  h+='</div>';app.innerHTML=h;
  $$("textarea",app).forEach(function(t){var i=+t.getAttribute("data-p");t.value=S.plan[i]||"";t.oninput=function(){S.plan[i]=t.value;save();};});
  LESSONS.forEach(function(L,k){var p=$(".note-"+k);if(p)p.textContent=S.notes[k];});
}
