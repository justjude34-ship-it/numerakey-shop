<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hello, Mate">
<title>Hello, Mate (Demo)</title>
<style>
:root{--bg:#04070b;--card:#0a1119;--card2:#0f1924;--line:#182736;--tx:#e9f2f8;--mu:#8da3b6;--b:#2f7bff;--t:#17d1c0;--rose:#ff7a90;--g:linear-gradient(135deg,#2f7bff,#17d1c0)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 24px}
header{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--mu);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
h1{font-size:28px;line-height:1.2;margin:14px 0 8px;font-weight:700;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:20px;line-height:1.3;margin:0 0 8px;font-weight:650}
h3{font-size:16px;margin:0 0 6px;font-weight:650}
p{margin:0 0 10px}
.lead{color:var(--mu);font-size:17px}
.mu{color:var(--mu)}
.small{font-size:14px}
.hero{margin:6px -6px 0}
.hero svg,.hero img{width:100%;height:auto;display:block;max-height:300px;object-fit:contain}
.hero img,.empty img,#welcome img{mix-blend-mode:screen}
#welcome img,#welcome svg{width:100%;height:auto;display:block;margin:0 auto}
.empty img{width:200px;height:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.card.glow{border-color:#1d4a63;box-shadow:0 0 0 1px rgba(23,209,192,.08),0 10px 40px rgba(47,123,255,.08)}
.tag{display:inline-block;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--t);margin-bottom:6px;font-weight:650}
.btn{background:var(--g);color:#031018;border:0;border-radius:14px;padding:13px 18px;font-family:inherit;font-weight:650;font-size:16px;cursor:pointer;min-height:46px}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:8px 13px;min-height:36px;font-size:14px;border-radius:11px}
.btn.danger{background:transparent;color:var(--rose);border:1px solid #4a2230}
.link{background:none;border:0;color:var(--t);padding:6px 0;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1}
.nav-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;color:var(--tx);font-family:inherit;font-size:16px;cursor:pointer}
.nav-card .ni{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--t);flex:none}
.nav-card .ni svg{width:22px;height:22px}
.nav-card b{display:block;font-weight:650}
.nav-card span.s{color:var(--mu);font-size:14px}
.quote{border-left:3px solid var(--t);padding:6px 0 6px 14px;margin:22px 0 10px;color:#cfe3ee;font-size:17px}
.foot{color:var(--mu);font-size:13px;text-align:center;margin-top:18px}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:15px}
label.f span{color:var(--mu);font-weight:400}
input[type=text],textarea,select{width:100%;background:#070d14;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #1d6f9a;outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:var(--card);color:var(--tx);font-family:inherit;font-size:15px;cursor:pointer}
.chip.on{border-color:var(--t);background:#082a30;color:#dffcf8}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:14px 0;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--mu);padding:10px 6px;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px #1d4a63}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--tx);font-family:inherit;font-size:16px}
.chk:last-child{border-bottom:0}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #2a4258;flex:none;margin-top:1px;display:grid;place-items:center}
.chk.on .box{background:var(--g);border-color:transparent}
.chk.on .box:after{content:"";width:6px;height:11px;border:solid #031018;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.gh{color:var(--t);font-size:13px;letter-spacing:1.2px;text-transform:uppercase;font-weight:650;margin:18px 0 2px}
.op{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.op p{margin:0 0 10px}
.badge{font-size:12px;font-weight:650;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.badge.n1{color:var(--t);border-color:#0e4b49}
.badge.n2{color:#7fb2ff;border-color:#1f3f7a}
.badge.n3{color:var(--rose);border-color:#5a2a38}
.pace{border-radius:14px;padding:14px;margin:14px 0;border:1px solid var(--line);background:var(--card2)}
.pace.n3{border-color:#5a2a38}
.pace ul{margin:8px 0 0;padding-left:20px;color:#cfe3ee}
.mrow{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;color:var(--tx);font-family:inherit;font-size:16px;cursor:pointer}
.empty{text-align:center;padding:10px 0}
.empty svg{width:180px;height:auto;opacity:.9}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(4,7,11,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav .tab{flex:1;background:none;border:0;color:#6c8296;font-family:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;font-weight:600}
nav .tab svg{width:24px;height:24px}
nav .tab.on{color:var(--t)}
.overlay{position:fixed;inset:0;background:rgba(2,4,7,.78);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#08101a;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.full-ov{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.dots{display:flex;gap:14px;margin:18px 0 22px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #2a4258}
.dots i.on{background:var(--g);border-color:transparent}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pad button{height:62px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:24px;font-family:inherit;cursor:pointer}
.pad button.x{border:0;background:none;color:var(--mu);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0e2230;border:1px solid #1d4a63;color:var(--tx);padding:10px 16px;border-radius:12px;z-index:80;font-size:15px;max-width:90%}
.orb{width:150px;height:150px;border-radius:50%;margin:22px auto;background:radial-gradient(circle at 35% 30%,#17d1c0,#2f7bff 60%,#0b2a6b);box-shadow:0 0 50px rgba(23,209,192,.35);transform:scale(.62);transition:transform 4s ease-in-out}
.orb.in{transform:scale(1)}
.orb.out{transform:scale(.62);transition-duration:6s}
@media (prefers-reduced-motion:reduce){.orb{transition:none}}
.sr{position:absolute;left:-9999px}
</style>
</head>

  <div class="brand" id="brand">Hello, Mate</div>
  <button class="icon-btn" data-act="gear" aria-label="Settings">

</header>
<main id="view"></main>
<nav id="nav">
  <button class="tab" data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button class="tab" data-act="tab" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Profile</button>
  <button class="tab" data-act="tab" data-tab="matches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Matches</button>
  <button class="tab" data-act="tab" data-tab="night"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13.5A8.5 8.5 0 1 1 10.5 3a7 7 0 0 0 10.5 10.5z"/></svg>Night</button>
</nav>
<div id="layer"></div>

/* ---------- copy / toast ---------- */
function toast(msg){
  var old = $('.toast'); if (old) old.remove();
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(function(){ if (t.parentNode) t.remove(); }, 1800);
}
function copyText(txt){
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch(e){ toast('Could not copy'); }
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast('Copied'); }, fallback);
  } else fallback();
}

/* ---------- bios ---------- */
function list(a){
  var x = (a || '').split(/[,\n;]+/).map(function(s){ return s.trim(); }).filter(Boolean).slice(0, 4);
  if (x.length <= 1) return x[0] || '';
  return x.slice(0, -1).join(', ') + ' and ' + x[x.length - 1];
}
function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function strip(s){ return (s || '').trim().replace(/[.!?]+$/, ''); }
var LOOK = { real:'Looking for something real.', go:'Keen to see where things go with the right person.', slow:'Taking it slow and keeping it honest.', open:'Open to meeting someone good and seeing what happens.' };
function makeBios(){
  var a = S.ans, job = strip(a.job), loves = list(a.loves), wk = strip(a.weekend), ex = strip(a.extra), lk = LOOK[S.look] || '';
  if (!job && !loves && !wk && !ex && !lk) return [];
  var easy = [job && cap(job) + '.', loves && 'Into ' + loves + '.', wk && 'A good weekend is ' + wk + '.', lk, ex && cap(ex) + '.'].filter(Boolean).join(' ');
  var straight = [job && cap(job) + '.', loves && 'Spare time goes on ' + loves + '.', wk && 'Ideal weekend: ' + wk + '.', lk, ex && cap(ex) + '.', 'If that sounds like you, say hello.'].filter(Boolean).join(' ');
  var dry = [job && cap(job) + ' by day.', loves && cap(loves) + ' by choice.', wk && 'Weekends: ' + wk + '.', ex && cap(ex) + '.', lk, "That's the lot. Message me for the rest."].filter(Boolean).join(' ');
  return [{ t:'Easy-going', x:easy }, { t:'Straight-up', x:straight }, { t:'Dry', x:dry }];
}

/* ---------- PIN lock ---------- */
function hashPin(pin, salt){
  if (window.crypto && crypto.subtle && window.TextEncoder) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return x.toString(16).padStart(2, '0'); }).join('');
    });
  }
  var h = 5381, s = salt + ':' + pin;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return Promise.resolve('d' + h);
}
function pinPad(opts){
  var layer = document.createElement('div'); layer.className = 'full-ov'; layer.id = 'pinov';
  var buf = '';
  function draw(msg){
    layer.innerHTML = '<h2>' + esc(opts.title) + '</h2>' + (opts.sub ? '<p class="mu">'+esc(opts.sub)+'</p>' : '') +
      '<div class="dots">' + [0,1,2,3].map(function(i){ return '<i class="'+(i<buf.length?'on':'')+'"></i>'; }).join('') + '</div>' +
      (msg ? '<p style="color:var(--rose)">'+esc(msg)+'</p>' : '') +
      '<div class="pad">' + [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button data-n="'+n+'">'+n+'</button>'; }).join('') +
      '<button class="x" data-n="cancel">' + (opts.cancel ? 'Cancel' : '') + '</button><button data-n="0">0</button><button class="x" data-n="del">Delete</button></div>' +
      (opts.extra || '');
  }
  layer.addEventListener('click', function(e){
    var b = e.target.closest('[data-n]');
    if (e.target.closest('[data-forgot]')) { opts.onForgot && opts.onForgot(); return; }
    if (!b) return;
    var n = b.dataset.n;
    if (n === 'cancel') { if (opts.cancel) { layer.remove(); opts.cancel(); } return; }
    if (n === 'del') { buf = buf.slice(0, -1); draw(); return; }
    if (buf.length >= 4) return;
    buf += n; draw();
    if (buf.length === 4) {
      var pin = buf; buf = '';
      setTimeout(function(){
        opts.done(pin, function(err){ if (err) { draw(err); } else { layer.remove(); } });
      }, 120);
    }
  });
  draw(); document.body.appendChild(layer);
}
function showLock(){
  if (!S.lock || $('#pinov')) return;
  pinPad({
    title:'Welcome back', sub:'Enter your PIN',
    extra:'<p style="margin-top:22px"><button class="link" data-forgot="1">Forgot PIN?</button></p>',
    onForgot:function(){
      if (confirm('Forgot PIN erases everything in the app and starts fresh. Erase?')) { wipe(); var o = $('#pinov'); if (o) o.remove(); locked = false; render(); }
    },
    done:function(pin, cb){
      hashPin(pin, S.lock.s).then(function(h){
        if (h === S.lock.h) { locked = false; cb(); } else cb('That is not it. Try again.');
      });
    }
  });
}
function setPin(){
  pinPad({ title:'Choose a PIN', sub:'4 digits', cancel:function(){}, done:function(p1, cb){
    cb();
    pinPad({ title:'Enter it again', cancel:function(){}, done:function(p2, cb2){
      if (p1 !== p2) { cb2("Those don't match. Try again."); return; }
      var salt = uid();
      hashPin(p1, salt).then(function(h){ S.lock = { s:salt, h:h }; save(); cb2(); toast('PIN set'); openSettings(); });
    }});
  }});
}
function removePin(){
  pinPad({ title:'Enter your PIN to remove it', cancel:function(){}, done:function(pin, cb){
    hashPin(pin, S.lock.s).then(function(h){
      if (h === S.lock.h) { S.lock = null; save(); cb(); toast('PIN removed'); openSettings(); } else cb('That is not it. Try again.');
    });
  }});
}

function act(a, el){

    case 'tab': ui.tab = el.dataset.tab; ui.tool = null; if (ui.tab !== 'matches') ui.match = null; render(); break;
    case 'gear': openSettings(); break;
    case 'close': closeSheet(); break;

    case 'seg-go': ui.tab = 'matches'; ui.match = null; ui.seg = el.dataset.seg; render(); break;
    case 'seg': ui.seg = el.dataset.seg; render(true); break;
    case 'look': S.look = (S.look === el.dataset.v ? '' : el.dataset.v); save(); render(true); break;
    case 'bio-make':
      ui.bios = makeBios();
      if (!ui.bios.length) toast('Fill in at least one thing first');
      render(true);
      if (ui.bios.length) { var g = document.querySelector('.gh'); if (g) g.scrollIntoView({ behavior:'smooth', block:'start' }); }
      break;
    case 'bio-save': var b = ui.bios[+el.dataset.i]; if (b) { S.bios.unshift({ id:uid(), x:b.x }); save(); toast('Saved'); render(true); } break;
    case 'bio-del': S.bios = S.bios.filter(function(x){ return x.id !== el.dataset.id; }); save(); render(true); break;
    case 'copy': copyText(el.dataset.t); break;
    case 'photo': S.photo[el.dataset.k] = !S.photo[el.dataset.k]; save(); render(true); break;
    case 'match-add': openAddMatch(); break;
    case 'match-save':
      var nm = $('#mname').value.trim(); if (!nm) { toast('Add a name first'); return; }
      var m = { id:uid(), name:nm, where:$('#mwhere').value.trim(), notes:'', signs:{}, added:Date.now() };
      S.matches.unshift(m); save(); closeSheet(); ui.match = m.id; render(); break;
    case 'match-open': ui.match = el.dataset.id; render(); break;
    case 'match-back': ui.match = null; render(); break;
    case 'match-del':
      if (confirm('Delete this match?')) { S.matches = S.matches.filter(function(x){ return x.id !== ui.match; }); ui.match = null; save(); render(); } break;
    case 'sign': var mm = getMatch(ui.match); if (mm) { mm.signs = mm.signs || {}; mm.signs[el.dataset.k] = !mm.signs[el.dataset.k]; save(); render(true); } break;
    case 'mood': ui.mood = (ui.mood === el.dataset.k ? null : el.dataset.k); render(true); break;
    case 'go':
      var to = el.dataset.to;
      if (to === 'matches') { ui.tab = 'matches'; ui.match = null; ui.seg = 'people'; render(); }
      else if (to === 'notes') { var nt = $('#newnote'); if (nt) { nt.scrollIntoView({ behavior:'smooth', block:'center' }); nt.focus(); } }
      else { ui.tool = to; ui.gstep = 0; render(); }
      break;
    case 'tool': ui.tool = el.dataset.tool || null; ui.gstep = 0; render(); break;
    case 'gnext': ui.gstep++; render(true); break;
    case 'note-save':
      var ta = $('#newnote'), v = ta.value.trim(); if (!v) { toast('Write something first'); return; }
      S.notes.push({ id:uid(), x:v, d:new Date().toLocaleString([], { day:'numeric', month:'short', hour:'numeric', minute:'2-digit' }) });
      save(); toast('Saved'); render(true); break;
    case 'note-del': S.notes = S.notes.filter(function(x){ return x.id !== el.dataset.id; }); save(); render(true); break;
    case 'pin-set': closeSheet(); setPin(); break;
    case 'pin-remove': closeSheet(); removePin(); break;
    case 'export':
      var blob = new Blob([JSON.stringify(S, null, 2)], { type:'application/json' });
      var url = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = url; link.download = 'hello-mate-backup.json'; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000); break;
    case 'import': var f = $('#impfile'); if (f) f.click(); break;
    case 'erase':
      if (confirm('Erase everything in this app? This cannot be undone.')) { wipe(); closeSheet(); render(); toast('Erased'); } break;
  }
}

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  act(el.dataset.act, el);
});
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.dataset && t.dataset.f) { S.ans[t.dataset.f] = t.value; save(); }
  else if (t.dataset && t.dataset.mn) { var m = getMatch(ui.match); if (m) { m.notes = t.value; save(); } }
  else if (t.id === 'oname') { ui.oname = t.value; var l = $('#olist'); if (l) l.innerHTML = openersHTML(); }
});
document.addEventListener('change', function(e){
  if (e.target.id !== 'impfile') return;
  var file = e.target.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var o = JSON.parse(r.result);
      if (!o || typeof o !== 'object' || !Array.isArray(o.matches)) throw new Error('bad');
      var keep = S.lock;
      S = Object.assign(blank(), o); S.lock = keep; S.seen = true;
      save(); closeSheet(); render(); toast('Loaded');
    } catch(err){ toast("That file didn't load"); }
  };
  r.readAsText(file);
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden && S.lock) { locked = true; }
  else if (!document.hidden && locked && S.lock) { showLock(); }
});

/* ---------- PWA bits ---------- */
function makeIcon(size){
  try {
    var c = document.createElement('canvas'); c.width = c.height = size; var x = c.getContext('2d');
    x.fillStyle = '#04070b'; x.fillRect(0, 0, size, size);
    var g = x.createLinearGradient(0, 0, size, size); g.addColorStop(0, '#2f7bff'); g.addColorStop(1, '#17d1c0');
    x.strokeStyle = g; x.lineWidth = size * 0.045; x.lineCap = 'round';
    var r = size * 0.22; x.beginPath(); x.arc(size * 0.38, size * 0.5, r, 0, Math.PI * 2); x.stroke();
    x.beginPath(); x.arc(size * 0.62, size * 0.5, r, 0, Math.PI * 2); x.stroke();
    return c.toDataURL('image/png');
  } catch(e){ return ''; }
}
function setupPWA(){
  try {
    var i192 = makeIcon(192), i512 = makeIcon(512);
    if (i192) {
      var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = i192; document.head.appendChild(l);
      var ic = document.createElement('link'); ic.rel = 'icon'; ic.href = i192; document.head.appendChild(ic);
      var base = location.href.split('#')[0];
      var mf = { name:APP_NAME, short_name:APP_NAME, start_url:base, scope:base.replace(/[^\/]*$/, ''), display:'standalone', background_color:'#04070b', theme_color:'#04070b',
        icons:[{ src:i192, sizes:'192x192', type:'image/png' }, { src:i512, sizes:'512x512', type:'image/png' }] };
      var ml = document.createElement('link'); ml.rel = 'manifest';
      ml.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(mf)); document.head.appendChild(ml);
    }
  } catch(e){}
  try { if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e){}
}

/* ---------- start ---------- */
setupPWA();
render();
if (S.lock) showLock(); else if (!S.seen) welcome();
})();
</script>
