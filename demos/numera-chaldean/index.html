<title>Numera Chaldean</title>
<style>

.inp,select.inp{width:100%;min-height:3.1rem;padding:.5rem .8rem;border-radius:.8rem;border:1px solid var(--line);background:#000;color:var(--fg);font:inherit;font-size:1.1rem}

.dt{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:.5rem}

.bar i{display:block;height:100%}
.pill{display:inline-block;padding:.1rem .6rem;border-radius:999px;font-size:.85rem;font-weight:700}
.F{background:#0f3a2c;color:var(--good)}.N{background:#2c2a12;color:var(--gold)}.D{background:#3a1820;color:var(--bad)}

td,th{padding:.5rem .3rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.85rem}
.best td{background:#10262a}

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

/* ---------- the Chaldean method ---------- */
const MAP={A:1,B:2,C:3,D:4,E:5,F:8,G:3,H:5,I:1,J:1,K:2,L:3,M:4,N:5,O:7,P:8,Q:1,R:2,S:3,T:4,U:6,V:6,W:6,X:5,Y:1,Z:7};
function root(n){while(n>9)n=String(n).split("").reduce((a,b)=>a+ +b,0);return n}
function digitSum(n){return String(n).split("").reduce((a,b)=>a+ +b,0)}
function nameTotal(s){let t=0;String(s||"").toUpperCase().split("").forEach(c=>{if(MAP[c])t+=MAP[c]});return t}
/* compound: a total up to 52 is its own compound; beyond that it is folded by adding its digits */
function compoundOf(n){while(n>52)n=digitSum(n);return n}
function numInfo(total){const c=compoundOf(total);return{total,compound:c,single:root(c),isCompound:c>9}}

const FR=[[1,2],[1,3],[1,9],[2,3],[2,5],[3,9],[4,5],[4,6],[4,8],[5,6],[5,8],[6,8],[7,9],[1,7]];
const DF=[[1,8],[1,6],[2,4],[2,8],[2,7],[3,6],[3,5],[4,9],[5,9]];
function rel(a,b){
  if(a===b)return"F";
  const has=l=>l.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
  return has(FR)?"F":has(DF)?"D":"N"
}
const RS={F:1,N:.5,D:0};
const RN={F:"Friendly",N:"Neutral",D:"Difficult"};
const COMP={
 10:["Wheel of fortune","Honour and rising fortune, and the wheel that turns. Hold steady when it does."],
 11:["Hidden dangers","Strength with traps you can't always see. Look before you leap and watch for hidden opposition."],
 12:["The anxious one","A feeling of being sacrificed or dependent on others. Trust your own judgment and keep your plans your own."],

 14:["Movement and risk (karmic)","Travel, change and speculation. Strong magnetism, but take care with excess, haste and gambles."],
 15:["Charm and eloquence","Magnetism and a gift for words. Use it with integrity and it opens doors."],
 16:["The shattered tower (karmic)","Pride meets a sudden fall. Build again on humble ground, and it holds. Often the most feared compound, and also an awakening."],
 17:["The star of hope","Peace, lasting hope and elevation beyond loss. Among the luckiest of the compounds."],
 18:["Conflict and mixed forces","Tension between the material and the spiritual, quarrels in the circle. Forgiveness is the key."],
 19:["The prince of heaven (karmic)","Success, honour and happiness. In the karmic view, a lesson of leaning too hard on independence. Let others in."],
 20:["The awakening","A call to renew your purpose. New plans, a verdict on the past, a fresh direction."],
 21:["The crown","Advancement, honour and victory after a trial. Rewards for persistence."],
 22:["Good judgment, vulnerable to deceit","Sound sense, but trusting too easily can cost you. Read the small print."],
 23:["The royal star","Success and help from people in authority. Protection and favour."],
 24:["Love and fortune","Warm partnerships and favourable money. Affection and helpers close by."],
 25:["Observation","Insight through experience. Early setbacks, then success. Keep an eye on health and nerves."],
 26:["Partnership with caution","Collaboration can help or harm. Be careful with shared money and joint deals."],
 27:["The sceptre","Authority and reward for creative effort. Command that has been earned."],
 28:["Strength tested","Independent and capable, but tests and setbacks come through others. Persist."],
 29:["Uncertainty","Ups and downs, and the odd deception. Keep clear records and keep your own counsel."],
 30:["The thinker","Depth of mind and self-contained deduction. Can be aloof; warmth balances it."],
 31:["Self-reliance","Alone but steady. Solitary success, introspection, quiet strength."],
 32:["The gift of words","Communication, trade and commerce. Stay connected and don't dig in over small things."],
 33:["Uplift and service","Compassion and a talent for lifting others. Give, and keep something back for yourself."],
 34:["Cautious progress","Gains come slowly and by steady steps. Avoid hurrying decisions."],
 35:["Quick wits","Clever, versatile, often travelling. Guard against scattering your energy."],
 36:["Warm influence","Charm and affection, a magnet for friends and helpers. Don't over-give."],
 37:["Friendship","Good fortune in friendship and partnership, and loyal people near you."],
 38:["Uphill, then through","Obstacles that are overcome by effort. Persistence pays."],
 39:["Practical steadiness","Gains through patient, practical work. Reliable and trusted."],
 40:["The planner","Organisation and foresight. Good for building, and not for gambling."],
 41:["Ability and drive","Strong self-reliance with the energy to make things happen. Mind your temper."],
 42:["Easy affection","Gentle, well-liked and fortunate with others. Don't let people lean on you too long."],
 43:["Revolution","Upsets and unconventional paths. Change is the rule here, so hold your centre."],
 44:["Hard tests","Trials that build resilience. Keep your health and your head."],
 45:["Quiet success","Competence that is noticed in time. Rewards come through careful work."],
 46:["Harmony in work","Cooperation and ease. Gains through working with others."],
 47:["Luck with care","Opportunity arrives; steady hands keep it."],
 48:["The helper","Support from others and a talent for supporting them. Keep your own aims in view."],
 49:["Strong feelings","Deep emotion and loyalty. Balance heart with judgment."],
 50:["Inner work","Spiritual or study focus. Turn insight into something others can use."],
 51:["Leadership with energy","Competitive, driven and bold. Guard against burning out or running over people."],
 52:["Constructive power","Influence that is built, not grabbed. Fair dealing makes it last."]
};
const KARMIC=[13,14,16,19];

/* ---------- state ---------- */
function blank(){return{name:"",d:"",m:"",y:"",tab:"read"}}
let P=(function(){try{const r=lsGet();if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){}return blank()})();
function save(){lsSet(JSON.stringify(P))}
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function dateOk(d,m,y){d=+d;m=+m;y=+y;if(!d||!m||!y||y<1000||y>2999)return false;const t=new Date(y,m-1,d);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===d}
function calcDate(d,m,y){
  const psy=numInfo(+d);
  const dest=numInfo(digitSum(d)+digitSum(m)+digitSum(y));
  return{psy,dest,digits:(String(d)+String(m)+String(y)).split("").map(Number)}
}
function lo(info,digs){
  const all=digs.filter(x=>x>0).concat([info.psy.single,info.dest.single]);
  const c={};all.forEach(x=>c[x]=(c[x]||0)+1);return c
}
function calcAll(name,d,m,y){
  const dt=dateOk(d,m,y)?calcDate(d,m,y):null;
  const nm=nameTotal(name)>0?numInfo(nameTotal(name)):null;
  return{dt,nm}
}
function fitOf(dt,nm){
  const dateFit=RS[rel(dt.psy.single,dt.dest.single)];
  if(!nm)return{dateFit,nameFit:null,score:dateFit*100};
  const nameFit=(RS[rel(nm.single,dt.psy.single)]+RS[rel(nm.single,dt.dest.single)])/2;
  return{dateFit,nameFit,score:Math.round((dateFit*.7+nameFit*.3)*100)}
}
function band(s){return s>=75?["Strongly supportive","var(--good)"]:s>=50?["Supportive","var(--teal)"]:s>=30?["Mixed","var(--gold)"]:["Working against itself","var(--bad)"]}

/* ---------- views ---------- */
function dateInputs(pre,v){
  let h='<div class="dt"><select class="inp" id="'+pre+'d"><option value="">Day</option>';
  for(let i=1;i<=31;i++)h+='<option value="'+i+'"'+(+v.d===i?" selected":"")+">"+i+"</option>";
  h+='</select><select class="inp" id="'+pre+'m"><option value="">Month</option>';
  MONTHS.forEach((n,i)=>h+='<option value="'+(i+1)+'"'+(+v.m===i+1?" selected":"")+">"+n+"</option>");
  return h+'</select><input class="inp" id="'+pre+'y" type="number" inputmode="numeric" placeholder="Year" value="'+esc(v.y)+'"></div>'
}
function numCard(label,info,extra){
  return'<div class="num"><small>'+label+'</small><b>'+info.single+'</b><span>'+(info.isCompound?info.compound+"/"+info.single:"")+(extra||"")+"</span></div>"
}
function compNote(info,who){
  if(!info.isCompound)return"";
  const c=COMP[info.compound];if(!c)return"";
  return'<div class="card"><h3>'+who+" · compound "+info.compound+": "+c[0]+(KARMIC.indexOf(info.compound)>=0?' <span class="k">karmic</span>':"")+"</h3><p style=\"margin:.3rem 0 0\">"+c[1]+"</p></div>"
}
function readTab(){
  let h='<div class="card"><label class="l" style="margin-top:0">Your full name, as you use it</label><input class="inp" id="nm" value="'+esc(P.name)+'" placeholder="e.g. Jane Anne Smith" autocomplete="off"><label class="l">Date of birth</label>'+dateInputs("r",P)+'<button class="btn" data-act="read">Read my numbers</button></div>';
  const a=calcAll(P.name,P.d,P.m,P.y);
  if(!a.dt&&!a.nm)return h+'<p class="note">Add your date of birth, and your name for the full reading. The date carries about 70% of the Chaldean reading, the name about 30%.</p>';
  if(!a.dt)return h+'<p class="note">Add a full date of birth for the driver, conductor and the Lo Shu grid.</p>';
  const {psy,dest}=a.dt,nm=a.nm;
  h+='<h2>Your core numbers</h2><div class="trio">'+numCard("Driver",psy," · by day")+numCard("Conductor",dest," · by date")+(nm?numCard("Name",nm," · by name"):'<div class="num"><small>Name</small><b>—</b><span>add a name</span></div>')+"</div>";
  h+='<div class="card"><h3>Driver '+psy.single+", "+SINGLE[psy.single][0]+' <span class="muted">· '+PLANET[psy.single]+"</span></h3><p style=\"margin:.3rem 0 0\">"+SINGLE[psy.single][1]+"</p></div>";
  h+='<div class="card"><h3>Conductor '+dest.single+", "+SINGLE[dest.single][0]+' <span class="muted">· '+PLANET[dest.single]+"</span></h3><p style=\"margin:.3rem 0 0\">"+SINGLE[dest.single][1]+"</p></div>";
  if(nm)h+='<div class="card"><h3>Name '+nm.single+", "+SINGLE[nm.single][0]+' <span class="muted">· '+PLANET[nm.single]+"</span></h3><p style=\"margin:.3rem 0 0\">"+SINGLE[nm.single][1]+"</p><p class=\"note\" style=\"margin:.4rem 0 0\">Letters add to "+nm.total+(nm.total!==nm.compound?", folded to "+nm.compound:"")+".</p></div>";
  const f=fitOf(a.dt,nm),b=band(f.score);
  h+='<h2>How they fit together</h2><div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="color:'+b[1]+';font-size:1.2rem">'+b[0]+'</b><span class="muted">'+f.score+"%</span></div>"+
   '<div class="bar"><i style="width:'+(f.dateFit*70)+'%;background:var(--gold)"></i><i style="width:'+((f.nameFit==null?0:f.nameFit)*30)+'%;background:var(--purple)"></i></div>'+
   '<p class="note" style="margin:.2rem 0 0"><span style="color:var(--gold)">■</span> date, 70% (driver and conductor are <span class="pill '+rel(psy.single,dest.single)+'">'+RN[rel(psy.single,dest.single)]+'</span>) '+(nm?'· <span style="color:var(--purple)">■</span> name, 30% (name with date: <span class="pill '+(f.nameFit>=.75?"F":f.nameFit>=.4?"N":"D")+'">'+(f.nameFit>=.75?"Friendly":f.nameFit>=.4?"Neutral":"Difficult")+"</span>)":"· add a name to include the 30% for the name")+"</p></div>";
  h+=compNote(psy,"Driver")+compNote(dest,"Conductor")+(nm?compNote(nm,"Name"):"");
  /* Lo Shu */
  const cnt=lo(a.dt,a.dt.digits),square=[[4,9,2],[3,5,7],[8,1,6]];
  h+='<h2>Lo Shu grid</h2><div class="card"><div class="grid">'+square.flat().map(n=>cnt[n]?'<div class="cell has"><small>'+n+"</small>"+Array(cnt[n]).fill(n).join(" ")+"</div>":'<div class="cell miss">'+n+"</div>").join("")+"</div>";
  const miss=[1,2,3,4,5,6,7,8,9].filter(n=>!cnt[n]),rep=Object.keys(cnt).filter(n=>cnt[n]>1);
  h+='<p class="note" style="text-align:center;margin:.2rem 0 .5rem">Your birth digits, with your driver and conductor added, placed on the Lo Shu square.</p>';
  h+='<p style="margin:.3rem 0"><b>Strong (repeated):</b> '+(rep.length?rep.map(n=>n+" ("+SINGLE[n][0]+")").join(", "):"none")+"</p><p style=\"margin:.3rem 0\"><b>Missing:</b> "+(miss.length?miss.join(", "):"none")+"</p>";
  if(miss.length)h+='<p class="note" style="margin:.3rem 0">Missing numbers are qualities to build deliberately: '+miss.map(n=>n+" "+SINGLE[n][0].toLowerCase()).join(", ")+".</p>";
  h+="</div>";
  /* timing */
  const yr=new Date().getFullYear(),py=root(digitSum(P.d)+digitSum(P.m)+digitSum(yr)),lk=LUCKY[psy.single];
  h+='<h2>Timing for '+yr+'</h2><div class="card"><h3>Personal year '+py+'</h3><p style="margin:.3rem 0 0">'+YEAR[py]+'</p></div>';
  h+='<h2>Your lucky field</h2><div class="card"><p style="margin:.2rem 0"><b>Ruled by:</b> '+PLANET[psy.single]+'</p><p style="margin:.2rem 0"><b>Good days:</b> '+lk.days+'</p><p style="margin:.2rem 0"><b>Colours:</b> '+lk.colours+'</p><p style="margin:.2rem 0"><b>Direction:</b> '+lk.dir+'</p><p style="margin:.2rem 0"><b>Friendly numbers:</b> '+lk.nums+"</p></div>";
  h+='<h2>Practices for a '+psy.single+"</h2><div class=\"card\">"+PRACTICE[psy.single].map(p=>"<p style=\"margin:.3rem 0\">• "+p+"</p>").join("")+"</div>";
  return h
}
function labTab(){
  let h='<div class="card"><h3>Name laboratory</h3><p class="muted" style="margin:.2rem 0 0">Test spellings before you commit to one. One per line.</p><label class="l">Spellings to test</label><textarea class="inp" id="lab" placeholder="Jane Smith&#10;Jayne Smith&#10;Jane A. Smith">'+esc(P.lab||"")+"</textarea>"+
   '<label class="l">Date of birth (to score the fit)</label>'+dateInputs("l",P)+'<button class="btn" data-act="lab">Test them</button></div>';
  if(!P.lab||!P.lab.trim())return h;
  const lines=P.lab.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,12),hasD=dateOk(P.d,P.m,P.y),dt=hasD?calcDate(P.d,P.m,P.y):null;
  const rows=lines.map(n=>{const info=numInfo(nameTotal(n));const fit=dt?fitOf(dt,info).score:null;return{n,info,fit}}).filter(r=>r.info.total>0);
  if(dt)rows.sort((a,b)=>b.fit-a.fit);
  h+='<div class="card"><table><tr><th>Spelling</th><th>Total</th><th>Number</th>'+(dt?"<th>Fit</th>":"")+"</tr>"+rows.map((r,i)=>'<tr'+(dt&&i===0&&rows.length>1?' class="best"':"")+'><td>'+esc(r.n)+'</td><td>'+r.info.total+(r.info.total!==r.info.compound?"→"+r.info.compound:"")+"</td><td>"+(r.info.isCompound?r.info.compound+"/":"")+r.info.single+(KARMIC.indexOf(r.info.compound)>=0?' <span class="k">karmic</span>':"")+"</td>"+(dt?"<td>"+r.fit+"%</td>":"")+"</tr>").join("")+"</table>";
  if(!dt)h+='<p class="note">Add your birth date above to rank the spellings by how well they fit your driver and conductor.</p>';
  else if(rows.length>1)h+='<p class="note">Highlighted is the best fit with your date. A good spelling also has a compound number that reads well. Check its note under Numbers.</p>';
  return h+"</div>"
}
function checkTab(){
  let h='<div class="card"><h3>Number check</h3><p class="muted" style="margin:.2rem 0 0">Type a number, or a name or word, to see its compound and meaning.</p><input class="inp" id="chk" style="margin-top:.6rem" value="'+esc(P.chk||"")+'" placeholder="e.g. 23, or a name"><button class="btn" data-act="chk">Check</button></div>';
  if(!P.chk||!P.chk.trim())return h;
  const v=P.chk.trim();let total;const isNum=/^\d+$/.test(v);
  total=isNum?+v:nameTotal(v);
  if(!total)return h+'<p class="note">No letters or digits to count.</p>';
  const info=numInfo(total),c=COMP[info.compound];
  h+='<div class="card"><h3>'+(isNum?v:esc(v))+" = "+total+(total!==info.compound?", folded to "+info.compound:"")+" → "+info.single+'</h3>'+(c?'<p style="margin:.4rem 0 0"><b>'+info.compound+", "+c[0]+"</b>"+(KARMIC.indexOf(info.compound)>=0?' <span class="k">karmic</span>':"")+"<br>"+c[1]+"</p>":"")+'<p style="margin:.5rem 0 0"><b>'+info.single+", "+SINGLE[info.single][0]+"</b> · "+PLANET[info.single]+"<br>"+SINGLE[info.single][1]+"</p></div>";
  return h
}
function harmTab(){
  const H=P.h||{};
  let h='<div class="card"><h3>Two-chart harmony</h3><p class="muted" style="margin:.2rem 0 0">Read one person against another.</p>'+
  '<label class="l">Person one: name (optional)</label><input class="inp" id="n1" value="'+esc(H.n1||"")+'">'+dateInputs("a",{d:H.d1,m:H.m1,y:H.y1})+
  '<label class="l">Person two: name (optional)</label><input class="inp" id="n2" value="'+esc(H.n2||"")+'">'+dateInputs("b",{d:H.d2,m:H.m2,y:H.y2})+
  '<button class="btn" data-act="harm">Read the two together</button></div>';
  if(!(dateOk(H.d1,H.m1,H.y1)&&dateOk(H.d2,H.m2,H.y2)))return h;
  const A=calcAll(H.n1,H.d1,H.m1,H.y1),B=calcAll(H.n2,H.d2,H.m2,H.y2);
  const items=[["Driver with driver",A.dt.psy.single,B.dt.psy.single,25],["Conductor with conductor",A.dt.dest.single,B.dt.dest.single,25],["One's driver with two's conductor",A.dt.psy.single,B.dt.dest.single,10],["One's conductor with two's driver",A.dt.dest.single,B.dt.psy.single,10]];
  const bothN=A.nm&&B.nm;if(bothN)items.push(["Name with name",A.nm.single,B.nm.single,30]);
  const wsum=items.reduce((a,i)=>a+i[3],0),score=Math.round(items.reduce((a,i)=>a+RS[rel(i[1],i[2])]*i[3],0)/wsum*100),b=band(score);
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="color:'+b[1]+';font-size:1.2rem">'+b[0]+'</b><span class="muted">'+score+"%</span></div><table>"+items.map(i=>'<tr><td>'+i[0]+"</td><td>"+i[1]+" &amp; "+i[2]+'</td><td><span class="pill '+rel(i[1],i[2])+'">'+RN[rel(i[1],i[2])]+"</span></td></tr>").join("")+"</table>";
  h+='<p class="note">Dates carry about 70% of the weight and names 30%'+(bothN?"":" (add both names to include that part)")+".</p></div>";
  h+='<div class="card"><p style="margin:0"><b>Person one:</b> driver '+A.dt.psy.single+", conductor "+A.dt.dest.single+(A.nm?", name "+A.nm.single:"")+"<br><b>Person two:</b> driver "+B.dt.psy.single+", conductor "+B.dt.dest.single+(B.nm?", name "+B.nm.single:"")+"</p></div>";
  return h
}
function refTab(){
  let h='<h2 style="margin-top:.4rem">The nine</h2>';
  for(let i=1;i<=9;i++)h+='<details class="card"><summary>'+i+" · "+SINGLE[i][0]+' <span class="muted">· '+PLANET[i]+"</span></summary><p style=\"margin:.2rem 0\">"+SINGLE[i][1]+"</p></details>";
  h+='<h2>Compound numbers 10 to 52</h2><p class="muted" style="margin:0 0 .4rem">The tradition reads these in full. Karmic ones are marked.</p>';
  Object.keys(COMP).forEach(k=>{const c=COMP[k];h+='<details class="card"><summary>'+k+" · "+c[0]+(KARMIC.indexOf(+k)>=0?' <span class="k">karmic</span>':"")+'</summary><p style="margin:.2rem 0">'+c[1]+"</p></details>"});
  h+='<h2>The Chaldean letter map</h2><div class="card"><p style="margin:0;line-height:1.9">1: A I J Q Y<br>2: B K R<br>3: C G L S<br>4: D M T<br>5: E H N X<br>6: U V W<br>7: O Z<br>8: F P<br><span class="muted">No letter is a 9. It is held sacred.</span></p></div>';
  return h
}
function render(){
  const tabs=[["read","Reading"],["lab","Name lab"],["chk","Check"],["harm","Harmony"],["ref","Numbers"]];
  const body=P.tab==="lab"?labTab():P.tab==="chk"?checkTab():P.tab==="harm"?harmTab():P.tab==="ref"?refTab():readTab();
  $("app").innerHTML='<main class="frame"><img class="hero" src="'+HERO+'" alt=""><div class="pad"><h1 class="grad">Numera Chaldean</h1><p class="muted" style="margin:0">The older system, worked properly.</p>'+body+'<p class="note" style="margin-top:1.4rem">Chaldean numerology in the tradition of Dr J. C. Chaudhry. Your details stay on this device.</p></div></main>'+
   '<div class="nav"><div>'+tabs.map(t=>'<button data-act="tab" data-t="'+t[0]+'" class="'+(P.tab===t[0]?"on":"")+'">'+t[1]+"</button>").join("")+"</div></div>"
}
function readDate(pre){return{d:$(pre+"d").value,m:$(pre+"m").value,y:$(pre+"y").value}}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const ACT={
 tab(el){P.tab=el.dataset.t;save();render();window.scrollTo(0,0)},
 read(){const d=readDate("r");P.name=$("nm").value;P.d=d.d;P.m=d.m;P.y=d.y;save();render();if(!dateOk(d.d,d.m,d.y))toast("Check the date of birth")},
 lab(){const d=readDate("l");P.lab=$("lab").value;P.d=d.d;P.m=d.m;P.y=d.y;save();render()},
 chk(){P.chk=$("chk").value;save();render()},
 harm(){const a=readDate("a"),b=readDate("b");P.h={n1:$("n1").value,d1:a.d,m1:a.m,y1:a.y,n2:$("n2").value,d2:b.d,m2:b.m,y2:b.y};save();render();if(!(dateOk(a.d,a.m,a.y)&&dateOk(b.d,b.m,b.y)))toast("Check both dates")}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el)});
render();
</script>
