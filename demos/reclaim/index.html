.hero-inner{position:absolute;left:20px;right:20px;bottom:18px}
.brand{letter-spacing:.28em;font-size:11px;color:var(--gold);font-family:system-ui,sans-serif;margin-bottom:8px}
h1{font-weight:500;font-size:40px}
.date{margin-top:8px;color:#cfc6b0;font-size:16px;font-family:system-ui,sans-serif}
.panel{padding:8px 18px 110px;flex:1;overflow:auto}
.amy-card{background:#16130e;border:1px solid #2a2418;border-radius:22px;padding:22px 20px 18px}
.amy-label{font-family:system-ui,sans-serif;letter-spacing:.2em;font-size:11px;color:var(--gold);margin-bottom:10px}
.amy-quote{font-size:26px;line-height:1.25}
.hint{margin-top:10px;color:var(--muted);font-family:system-ui,sans-serif;font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px 20px;font-size:18px;font-family:Georgia,serif;cursor:pointer;margin-top:16px}
.btn-gold{background:var(--gold-btn);color:#1a1408}
.btn-dark{background:#1c1a16;color:var(--cream);border:1px solid #2e2a24}
nav{position:fixed;left:12px;right:12px;bottom:14px;background:#16130e;border-radius:28px;display:flex;padding:8px;z-index:20}
nav button{flex:1;background:none;border:0;color:#8a8374;padding:10px 0 8px;font-family:system-ui,sans-serif;font-size:12px}
nav button.on{color:var(--gold);background:#241e14;border-radius:22px}
.call{align-items:center;padding:48px 22px 120px;text-align:center}
.avatar-wrap{width:128px;height:128px;border-radius:50%;border:2px solid #c9a227;overflow:hidden;margin:12px auto 16px}
.avatar-wrap img{width:100%;height:100%;object-fit:cover}
.call h2{font-size:36px;font-weight:500;margin-bottom:8px}
.status{min-height:24px;color:var(--muted);font-family:system-ui,sans-serif;font-size:14px;margin-bottom:8px}
.pulse{width:14px;height:14px;border-radius:50%;background:#3d3;display:inline-block;margin-right:8px;animation:p 1.2s infinite}
.pulse.off{background:#666;animation:none}
.pulse.speak{background:var(--gold)}
@keyframes p{50%{opacity:.35}}
.transcript{width:100%;max-width:420px;text-align:left;margin:18px 0 8px;max-height:28vh;overflow:auto;font-family:system-ui,sans-serif;font-size:15px}
.bubble{padding:10px 12px;border-radius:14px;margin:8px 0}
.you{background:#241e14}
.her{background:#1a2218}
.typebar{width:100%;max-width:420px;display:flex;gap:8px;margin-top:8px}
.typebar input{flex:1;background:#16130e;border:1px solid #2e2a24;color:var(--cream);border-radius:999px;padding:12px 16px;font-size:16px}
.typebar button{background:var(--gold-btn);border:0;border-radius:999px;padding:0 16px}
.err{color:#e8b4a0;font-family:system-ui,sans-serif;font-size:13px;margin-top:10px;max-width:360px}
</style>
</head>

<script>
(function(){
const $=id=>document.getElementById(id);

const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
const now=new Date();
$("dateLine").textContent=days[now.getDay()]+" "+now.getDate()+" "+months[now.getMonth()];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,speaking=false;
function setStatus(text,mode){$("callStatus").textContent=text;$("dot").className="pulse "+(mode==="listen"?"":mode==="speak"?"speak":"off");}

function amyReply(userText){const t=(userText||"").toLowerCase();let reply="I am right here. Take a breath with me. What feels heaviest this morning?";if(!t.trim())reply="I am listening. You can talk or type.";else if(/hello|hi |hey/.test(t))reply="Hi. I am glad you called. How are you landing today?";else if(/anxious|panic|scared|overwhelm/.test(t))reply="That is a lot to hold. You are safe in this moment. Name one thing you can see near you.";else if(/sad|cry|lonely|empty/.test(t))reply="I hear the ache in that. You do not have to tidy it up. I am sitting with you.";else if(/angry|furious|rage/.test(t))reply="Anger is allowed here.";else if(/tired|exhaust|sleep/.test(t))reply="Of course you are tired. One gentle next step is enough.";else if(/task|paralysis|stuck/.test(t))reply="Task paralysis is not laziness. Pick the smallest possible start.";else if(/thank/.test(t))reply="You are welcome. I will be here whenever you tap Call.";else reply="I heard you. We can stay with that, or shift to one small kinder step.";addBubble("amy",reply);speak(reply);}
function speak(text){try{speechSynthesis.cancel();}catch(e){}if(!window.speechSynthesis){setStatus("Amy replied","off");return;}speaking=true;setStatus("Amy is speaking...","speak");const u=new SpeechSynthesisUtterance(text);u.rate=0.95;u.pitch=1.05;const voices=speechSynthesis.getVoices();const v=voices.find(x=>/female|samantha|zira|google uk english female/i.test(x.name))||voices.find(x=>x.lang&&x.lang.startsWith("en"));if(v)u.voice=v;u.onend=function(){speaking=false;setStatus(listening?"Listening - just talk":"Tap Start listening, or type below",listening?"listen":"off");};speechSynthesis.speak(u);}
function startListen(){$("err").textContent="";if(!SR){$("err").textContent="No speech recognition here. Type below.";setStatus("Type to talk","off");$("typed").focus();return;}if(listening)return;try{rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang="en-AU";rec.onstart=function(){listening=true;$("micBtn").textContent="Listening... tap to pause";setStatus("Listening - just talk","listen");};rec.onresult=function(e){const last=e.results[e.results.length-1];if(!last||!last.isFinal)return;const said=last[0].transcript.trim();if(!said)return;addBubble("you",said);amyReply(said);};rec.onerror=function(e){listening=false;$("micBtn").textContent="Start listening";const code=e.error||"unknown";if(code==="not-allowed")$("err").textContent="Microphone blocked. Tap the lock in the address bar, then Permissions, Microphone, Allow.";else $("err").textContent="Voice error: "+code+". Type below.";setStatus("Type or tap Start listening","off");};rec.onend=function(){listening=false;$("micBtn").textContent="Start listening";if(!speaking)setStatus("Paused - tap Start listening or type","off");};rec.start();}catch(err){$("err").textContent="Could not start the mic. Type below.";}}
function stopListen(){try{if(rec)rec.stop();}catch(e){}listening=false;$("micBtn").textContent="Start listening";}
function openCall(){show("call");$("log").innerHTML="";$("err").textContent="";addBubble("amy","I am right here. You can talk or type.");setStatus("Starting...","off");if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){stream.getTracks().forEach(function(t){t.stop();});startListen();speak("I am here. Just talk when you are ready.");}).catch(function(){$("err").textContent="Mic permission did not come through. Type below.";setStatus("Type to talk","off");speak("I cannot hear the microphone yet. Type to me and I will still sit with you.");$("typed").focus();});}else startListen();}
function endCall(){stopListen();try{speechSynthesis.cancel();}catch(e){}show("today");}
$("homeCall").addEventListener("click",openCall);
$("landCall").addEventListener("click",openCall);
$("landBack").addEventListener("click",function(){show("today");});
$("endCall").addEventListener("click",endCall);
$("micBtn").addEventListener("click",function(){listening?stopListen():startListen();});
$("sendTyped").addEventListener("click",sendType);
$("typed").addEventListener("keydown",function(e){if(e.key==="Enter")sendType();});
function sendType(){const v=$("typed").value.trim();if(!v)return;$("typed").value="";addBubble("you",v);amyReply(v);}
document.querySelectorAll("nav button").forEach(function(b){b.addEventListener("click",function(){show(b.dataset.go);});});
if(window.speechSynthesis)speechSynthesis.getVoices();
})();
</script>
