<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swimming with Sharks">
<title>Swimming with Sharks (Demo)</title>
<style>
:root{--bg:#03090c;--card:#08141a;--card2:#0c1c24;--line:#14303a;--tx:#e8f4f2;--mu:#8aa8a8;--b:#22c1d6;--t:#34e0a1;--rose:#ff6f7d;--g:linear-gradient(135deg,#22c1d6,#34e0a1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 24px}
header{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 6px}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--mu);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
h1{font-size:27px;line-height:1.2;margin:14px 0 8px;font-weight:700;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:20px;line-height:1.3;margin:0 0 8px;font-weight:650}
h3{font-size:16px;margin:0 0 6px;font-weight:650}
p{margin:0 0 10px}
.lead{color:var(--mu);font-size:17px}
.mu{color:var(--mu)}
.small{font-size:14px}
.hero{margin:6px -6px 0}
.hero svg,.hero img{width:100%;height:auto;display:block;max-height:240px;object-fit:contain}
.hero img,.empty img,#welcome img,#gate img{mix-blend-mode:screen}
.empty img{width:100%;height:auto}
#welcome img,#gate img{width:100%;height:auto;display:block;margin:0 auto 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}
.card.glow{border-color:#17505a;box-shadow:0 0 0 1px rgba(52,224,161,.07),0 10px 40px rgba(34,193,214,.08)}
.card.alert{border-color:#6a2a33;background:#150a0d}
.tag{display:inline-block;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--t);margin-bottom:6px;font-weight:650}
.tag.r{color:var(--rose)}
.btn{background:var(--g);color:#02120f;border:0;border-radius:14px;padding:13px 18px;font-family:inherit;font-weight:650;font-size:16px;cursor:pointer;min-height:46px}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:8px 13px;min-height:36px;font-size:14px;border-radius:11px}
.btn.danger{background:transparent;color:var(--rose);border:1px solid #4a2230}
.link{background:none;border:0;color:var(--t);padding:6px 0;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.nav-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;color:var(--tx);font-family:inherit;font-size:16px;cursor:pointer}
.nav-card .ni{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--t);flex:none}
.nav-card .ni svg{width:22px;height:22px}
.nav-card b{display:block;font-weight:650}
.nav-card span.s{color:var(--mu);font-size:14px}
.quote{border-left:3px solid var(--t);padding:6px 0 6px 14px;margin:22px 0 10px;color:#cfe6e2;font-size:17px}
.foot{color:var(--mu);font-size:13px;text-align:center;margin-top:18px}
label.f{display:block;margin:14px 0 6px;font-weight:600;font-size:15px}
label.f span{color:var(--mu);font-weight:400}
input[type=text],textarea{width:100%;background:#060f14;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-family:inherit;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #1a7c8c;outline-offset:1px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;color:var(--tx);font-family:inherit;font-size:16px}
.chk:last-child{border-bottom:0}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #25444e;flex:none;margin-top:1px;display:grid;place-items:center}
.chk.on .box{background:var(--g);border-color:transparent}
.chk.on .box:after{content:"";width:6px;height:11px;border:solid #02120f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk.bad.on .box{background:var(--rose)}
.gh{color:var(--t);font-size:13px;letter-spacing:1.2px;text-transform:uppercase;font-weight:650;margin:18px 0 2px}
.gh.r{color:var(--rose)}
.op{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.op p{margin:0 0 10px}
.badge{font-size:12px;font-weight:650;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.badge.n1{color:var(--t);border-color:#10553f}
.badge.n2{color:#7fd6e6;border-color:#1c5a66}
.badge.n3{color:var(--rose);border-color:#5a2a38}
.pace{border-radius:14px;padding:14px;margin:14px 0;border:1px solid var(--line);background:var(--card2)}
.pace.n3{border-color:#5a2a38}
.pace ul{margin:8px 0 0;padding-left:20px;color:#cfe6e2}
.mrow{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;color:var(--tx);font-family:inherit;font-size:16px;cursor:pointer}
.shark{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;color:var(--tx);font-family:inherit;font-size:16px;cursor:pointer;display:block}
.shark.open{border-color:#17505a}
.shark .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shark .hd b{font-size:17px}
.shark .sub{color:var(--rose);font-size:13px;font-weight:650;margin-top:2px}
.shark .bd{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;cursor:default}
.shark ul{margin:4px 0 12px;padding-left:20px}
.shark li{margin:3px 0}
.chev{color:var(--mu);transition:transform .2s}
.shark.open .chev{transform:rotate(180deg)}
.empty{text-align:center;padding:10px 0}
.empty svg{width:200px;height:auto}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(3,9,12,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav .tab{flex:1;background:none;border:0;color:#5f8185;font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;font-weight:600}
nav .tab svg{width:24px;height:24px}
nav .tab.on{color:var(--t)}
.overlay{position:fixed;inset:0;background:rgba(1,4,6,.78);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#06121a;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.full-ov{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#welcome svg,#gate svg{width:100%;height:auto;display:block;margin:0 auto 6px}
.dots{display:flex;gap:14px;margin:18px 0 22px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #25444e}
.dots i.on{background:var(--g);border-color:transparent}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pad button{height:62px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:24px;font-family:inherit;cursor:pointer}
.pad button.x{border:0;background:none;color:var(--mu);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0b2a2e;border:1px solid #17505a;color:var(--tx);padding:10px 16px;border-radius:12px;z-index:80;font-size:15px;max-width:90%}
.sr{position:absolute;left:-9999px}
.prog{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--g)}
</style>
</head>

  <div class="brand">Swimming with Sharks</div>
  <button class="icon-btn" data-act="gear" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>

</header>
<main id="view"></main>
<nav id="nav">
  <button class="tab" data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button class="tab" data-act="tab" data-tab="sharks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 17c2-5 4-9 6-13 .5 4 2 8 5 13"/><path d="M3 20.5c3-1.5 6 1.5 9 0s6-1.5 9 0"/></svg>Sharks</button>
  <button class="tab" data-act="tab" data-tab="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/></svg>Check</button>
  <button class="tab" data-act="tab" data-tab="meet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Meet</button>
  <button class="tab" data-act="tab" data-tab="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Rules</button>
</nav>
<div id="layer"></div>

/* ---------- toast / copy ---------- */
function toast(msg){
  var old = $('.toast'); if (old) old.remove();
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(function(){ if (t.parentNode) t.remove(); }, 1800);
}
function copyText(txt){
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch(e){ toast('Could not copy'); }
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function(){ toast('Copied'); }, fallback);
  } else fallback();
}

/* ---------- PIN lock ---------- */
function hashPin(pin, salt){
  if (window.crypto && crypto.subtle && window.TextEncoder) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)).then(function(b){
      return Array.prototype.map.call(new Uint8Array(b), function(x){ return x.toString(16).padStart(2, '0'); }).join('');
    });
  }
  var h = 5381, s = salt + ':' + pin;
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return Promise.resolve('d' + h);
}
function pinPad(opts){
  var layer = document.createElement('div'); layer.className = 'full-ov'; layer.id = 'pinov';
  var buf = '';
  function draw(msg){
    layer.innerHTML = '<h2>' + esc(opts.title) + '</h2>' + (opts.sub ? '<p class="mu">'+esc(opts.sub)+'</p>' : '') +
      '<div class="dots">' + [0,1,2,3].map(function(i){ return '<i class="'+(i<buf.length?'on':'')+'"></i>'; }).join('') + '</div>' +
      (msg ? '<p style="color:var(--rose)">'+esc(msg)+'</p>' : '') +
      '<div class="pad">' + [1,2,3,4,5,6,7,8,9].map(function(n){ return '<button data-n="'+n+'">'+n+'</button>'; }).join('') +
      '<button class="x" data-n="cancel">' + (opts.cancel ? 'Cancel' : '') + '</button><button data-n="0">0</button><button class="x" data-n="del">Delete</button></div>' +
      (opts.extra || '');
  }
  layer.addEventListener('click', function(e){
    if (e.target.closest('[data-forgot]')) { opts.onForgot && opts.onForgot(); return; }
    var b = e.target.closest('[data-n]'); if (!b) return;
    var n = b.dataset.n;
    if (n === 'cancel') { if (opts.cancel) { layer.remove(); opts.cancel(); } return; }
    if (n === 'del') { buf = buf.slice(0, -1); draw(); return; }
    if (buf.length >= 4) return;
    buf += n; draw();
    if (buf.length === 4) {
      var pin = buf; buf = '';
      setTimeout(function(){ opts.done(pin, function(err){ if (err) { draw(err); } else { layer.remove(); } }); }, 120);
    }
  });
  draw(); document.body.appendChild(layer);
}
function showLock(){

  pinPad({

    extra:'<p style="margin-top:22px"><button class="link" data-forgot="1">Forgot PIN?</button></p>',
    onForgot:function(){
      if (confirm('Forgot PIN erases everything in the app and starts fresh. Erase?')) { wipe(); var o = $('#pinov'); if (o) o.remove(); locked = false; render(); }
    },
    done:function(pin, cb){
      hashPin(pin, S.lock.s).then(function(h){
        if (h === S.lock.h) { locked = false; cb(); } else cb('That is not it. Try again.');
      });
    }
  });
}
function setPin(){

    cb();
    pinPad({ title:'Enter it again', cancel:function(){}, done:function(p2, cb2){

      var salt = uid();

    }});
  }});
}

function act(a, el){
  switch (a) {
    case 'tab': ui.tab = el.dataset.tab; if (ui.tab !== 'check') ui.match = null; render(); break;
    case 'gear': openSettings(); break;
    case 'close': closeSheet(); break;
    case 'unlock': tryUnlock(); break;
    case 'start': S.seen = true; save(); var w = $('#welcome'); if (w) w.remove(); break;
    case 'week': S.week[el.dataset.k] = !S.week[el.dataset.k]; save(); render(true); break;
    case 'shark': ui.open = (ui.open === el.dataset.k ? null : el.dataset.k); render(true); break;
    case 'match-add': openAddMatch(); break;
    case 'match-save':
      var nm = $('#mname').value.trim(); if (!nm) { toast('Add a name first'); return; }
      var m = { id:uid(), name:nm, where:$('#mwhere').value.trim(), notes:'', signs:{}, checks:{} };
      S.matches.unshift(m); save(); closeSheet(); ui.match = m.id; render(); break;
    case 'match-open': ui.match = el.dataset.id; render(); break;
    case 'match-back': ui.match = null; render(); break;
    case 'match-del':
      if (confirm('Delete this match?')) { S.matches = S.matches.filter(function(x){ return x.id !== ui.match; }); ui.match = null; save(); render(); } break;
    case 'sign': var mm = getMatch(ui.match); if (mm) { mm.signs = mm.signs || {}; mm.signs[el.dataset.k] = !mm.signs[el.dataset.k]; save(); render(true); } break;
    case 'vchk': var mv = getMatch(ui.match); if (mv) { mv.checks = mv.checks || {}; mv.checks[el.dataset.k] = !mv.checks[el.dataset.k]; save(); render(true); } break;
    case 'pc': S.planChecks[el.dataset.k] = !S.planChecks[el.dataset.k]; save(); render(true); break;
    case 'plan-copy': copyText(planMsg()); break;
    case 'plan-reset': if (confirm('Clear this plan and start again?')) { S.plan = {}; S.planChecks = {}; save(); render(); } break;
    case 'copy': copyText(el.dataset.t); break;
    case 'rule': S.rules[el.dataset.k] = !S.rules[el.dataset.k]; save(); render(true); break;
    case 'rule-add':
      var ip = $('#newrule'), v = ip.value.trim(); if (!v) { toast('Write a rule first'); return; }
      S.custom.push({ id:uid(), x:v }); save(); render(true); break;
    case 'rule-del': S.custom = S.custom.filter(function(x){ return x.id !== el.dataset.id; }); save(); render(true); break;
    case 'pin-set': closeSheet(); setPin(); break;
    case 'pin-remove': closeSheet(); removePin(); break;
    case 'export':
      var ex = Object.assign({}, S); delete ex.unlock; delete ex.lock;
      var blob = new Blob([JSON.stringify(ex, null, 2)], { type:'application/json' });
      var url = URL.createObjectURL(blob), link = document.createElement('a');

    case 'import': var f = $('#impfile'); if (f) f.click(); break;
    case 'erase':
      if (confirm('Erase everything in this app? This cannot be undone.')) { wipe(); closeSheet(); render(); toast('Erased'); } break;
  }
}
