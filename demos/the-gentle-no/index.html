<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--text);font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;line-height:1.6}
body{min-height:100vh;padding-bottom:86px}
#app{max-width:640px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-weight:600;line-height:1.2;margin:0}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.top{display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top)) 0 6px;min-height:52px}
.top .back{background:none;border:1px solid var(--line);color:var(--lil);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.top .brand{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-left:auto}
.hero{border-radius:20px;overflow:hidden;border:1px solid var(--line);margin:8px 0 18px;background:#000}
.hero svg{display:block;width:100%;height:auto}
.title{font-size:38px;margin:6px 0 6px}
.sub{color:var(--mute);font-size:17px;margin:0 0 18px}
.prog{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:var(--mute);font-size:14px}
.bar{flex:1;height:6px;border-radius:99px;background:#1a1226;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
.les{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 10px;color:var(--text);font:inherit;cursor:pointer}
.les:active{background:var(--card2)}
.num{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid #3a2656;color:var(--lil);font-size:16px}
.les.done .num{background:var(--grad);border-color:transparent;color:#000;font-weight:700}
.les b{display:block;font-weight:600;font-size:17px}
.les span.s{display:block;color:var(--mute);font-size:14px}
.chev{margin-left:auto;color:#5d4a7d;font-size:22px}
.lh{margin:8px 0 4px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--pk)}
.lt{font-size:32px;margin:0 0 6px}
.ls{color:var(--mute);margin:0 0 18px;font-size:17px}
p{margin:0 0 14px;font-size:17px}
.h{font-size:20px;margin:24px 0 8px;color:var(--lil)}
ul.l{padding:0;margin:0 0 14px;list-style:none}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 16px}
.card h3{font-size:18px;margin-bottom:8px;color:var(--lil)}
.ex{background:linear-gradient(180deg,#140b22,#0c0913);border:1px solid #3a2656;border-radius:18px;padding:18px;margin:26px 0 16px}
.ex .tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--pk);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{border:1px solid #3a2656;background:#0a0710;color:var(--text);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--grad);color:#000;border-color:transparent;font-weight:600}
label.al{display:block;margin:12px 0 6px;font-size:16px;color:var(--text)}
textarea,input[type=text]{width:100%;background:#07040c;color:var(--text);border:1px solid #33224b;border-radius:12px;padding:12px;font:inherit;font-size:16px;resize:vertical}
textarea{min-height:92px}
textarea:focus,input:focus{outline:none;border-color:var(--p)}
.btn{display:inline-block;border:0;border-radius:999px;padding:13px 22px;font:inherit;font-size:16px;font-weight:700;color:#000;background:var(--grad);cursor:pointer}
.btn.ghost{background:none;color:var(--lil);border:1px solid #3a2656;font-weight:500}
.btn.sm{padding:8px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.take{border:1px solid #3a2656;border-radius:18px;padding:18px;margin:8px 0 18px;background:radial-gradient(120% 120% at 0% 0%,#1d0f33 0%,#07040c 70%)}
.take .tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--pk);margin-bottom:6px}
.take p{margin:0;font-size:18px}
.ladder .step{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px;background:var(--card)}
.ladder .step small{display:block;text-transform:uppercase;letter-spacing:.16em;font-size:11.5px;margin-bottom:4px}
.ladder .step:nth-child(1) small{color:#d8b4fe}
.ladder .step:nth-child(2) small{color:#e879f9}
.ladder .step:nth-child(3) small{color:#f472b6}
.ladder .step .t{font-size:17px}
.ladder .step button{margin-top:8px}
.pb{margin:0 0 12px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px}
.pb .said{color:var(--pk);font-size:15px;font-style:italic;margin-bottom:6px}
.pb .reply{font-size:16.5px}
.mine li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.x{background:none;border:0;color:#7a6a99;font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
.empty{color:var(--mute);font-size:15px;margin:4px 0 14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 10px max(10px,env(safe-area-inset-bottom));z-index:5}
.tabs div{display:flex;width:100%;max-width:640px}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;padding:6px 0;cursor:pointer;letter-spacing:.04em}
.tabs button svg{display:block;margin:0 auto 3px}
.tabs button.on{color:var(--lil)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1b1129;border:1px solid #3a2656;color:var(--text);padding:10px 18px;border-radius:999px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.help{font-size:14.5px;color:var(--mute);border-top:1px solid var(--line);margin-top:22px;padding-top:14px}
.note{border-left:2px solid #3a2656;padding:6px 0 6px 12px;margin:0 0 10px;font-size:15.5px;color:var(--text);white-space:pre-wrap}
.note small{display:block;color:var(--mute);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.fin{text-align:center;padding:10px 0 6px}
.fin h2{font-size:28px;margin:8px 0}
</style>

var SCEN=[
 {n:"Favours & requests",s:["I'd love to help, but I can't take that on right now.","No, that doesn't work for me.","I've given you my answer, and it isn't going to change."]},
 {n:"Invitations & time",s:["Thank you for thinking of me. I'm going to sit this one out.","I'm not available for that.","I won't be coming, and I'd like to leave it there."]},

/* ---------- the course ---------- */
var L=[
{t:"What a boundary is",s:"Where you end and someone else begins",b:[
 {k:"p",x:"A boundary isn't a wall, a punishment, or a way of controlling anyone. It's a line that says what you will do, what you will accept, and what you need in order to stay well."},
 {k:"p",x:"Most people who struggle here were never shown what a healthy one looks like. That's not a flaw. It's just something nobody taught you, and it can be learned."},
 {k:"h",x:"A boundary is about you, not them"},
 {k:"q",x:"“Stop shouting at me” is a demand. “I'll leave the room if the shouting starts” is a boundary."},
 {k:"p",x:"You can't make another person change. You can decide what you'll do. That's the whole trick, and it's why boundaries work even when other people don't cooperate."},
 {k:"h",x:"Six places boundaries live"},
 {k:"list",x:["Time: what you'll give and when","Energy: how much you can carry for others","Emotional: whose feelings you're responsible for (only yours)","Physical: your body, your space, your things","Money and belongings: what you will and won't lend or pay","Digital: messages, calls, and how fast you must reply"]},
 {k:"chips",id:"l1c",ask:"Which of these feels most crowded in your life right now? Pick any.",o:["Time","Energy","Emotional","Physical","Money","Digital"]},
 {k:"area",id:"l1a",ask:"What's one situation where you wish you had a line?",ph:"Write as much or as little as you like…"}
 ],take:"A boundary isn't about changing other people. It's about deciding what you will do."},

{t:"Why they feel so hard",s:"It isn't weakness. It's learning.",b:[
 {k:"p",x:"If saying no makes your stomach drop, there's usually a reason, and it usually made sense at the time."},
 {k:"list",x:["You learned early that no caused trouble, so yes became safe","You were praised for being the helpful, easy, or “good” one","You were responsible for other people's moods","You never saw anyone say no kindly","You fear being left, disliked, or seen as selfish"]},
 {k:"p",x:"Saying yes to keep the peace is a skill that once protected you. Now it's costing you. Both are true."},
 {k:"q",x:"Feeling uncomfortable doesn't mean you're doing it wrong. It means you're doing something new."},
 {k:"h",x:"What the discomfort is (and isn't)"},
 {k:"p",x:"The wobble after a no is usually your nervous system noticing that you've broken an old rule. It's not evidence that you've harmed anyone. It fades with practice, the way any new habit does."},
 {k:"area",id:"l2a",ask:"When I say no, I'm afraid that…",ph:"Finish the sentence honestly. Nobody else will read this."},
 {k:"area",id:"l2b",ask:"Where do you think you learned that?",ph:"A person, a family rule, a moment you remember…"}
 ],take:"Saying yes was once how you stayed safe. Learning no is just an update to an old rule."},

{t:"Knowing your limits and feelings",s:"You can't set a line you can't feel",b:[
 {k:"p",x:"Before you can say no to someone else, you need to notice your own no. For many people it shows up in the body long before it shows up in words."},
 {k:"h",x:"Signals that you've hit a limit"},
 {k:"chips",id:"l3c",ask:"Which of these do you notice? Pick any.",o:["Tight chest","Knot in the stomach","Heavy shoulders","Sudden tiredness","Dread","Irritation","Resentment","Wanting to hide","Going blank","Racing thoughts"]},
 {k:"p",x:"Resentment is the big one. If you keep feeling quietly resentful after helping someone, that's usually a boundary you didn't set."},
 {k:"h",x:"The three-answer check"},
 {k:"p",x:"Before you reply to a request, pause and ask: is this a yes, a no, or a not yet? “Not yet” is a real answer. It buys you time to feel, and it's allowed."},
 {k:"list",x:["Yes: I'm happy to, and I have the room","No: it costs me more than I can give","Not yet: I need time. “Let me think and get back to you.”"]},
 {k:"area",id:"l3a",ask:"Something I said yes to recently that I wish I hadn't:",ph:"What was it, and what did your body say at the time?"}
 ],take:"Your body usually knows before your mouth does. Learn to listen for the no."},

{t:"Saying no without the guilt",s:"Guilt is a feeling, not a verdict",b:[
 {k:"p",x:"Guilt feels like proof that you did something wrong. Usually it isn't. It's a feeling that shows up when you break a habit, especially a people-pleasing one."},
 {k:"h",x:"Three different things"},
 {k:"list",x:["Guilt: a feeling that you've broken an old rule","Regret: wishing you'd handled it differently","Wrongdoing: you actually harmed someone"]},
 {k:"p",x:"Saying a kind, clear no is almost never the third one. You're allowed to feel guilty and do it anyway. The feeling can come along for the ride; it doesn't get to drive."},
 {k:"h",x:"Gentle reframes"},
 {k:"list",x:["“No” to this is “yes” to something I need","I'm not rejecting them. I'm declining the request","Other people are allowed to feel disappointed. I'm not responsible for fixing it","A kind no now is better than a bitter yes later","If it were a friend in my place, I'd tell them it's fine to say no"]},
 {k:"area",id:"l4a",ask:"A no I'd like to be able to say:",ph:"To whom, and about what?"},
 {k:"area",id:"l4b",ask:"What would you say to a friend who was in your exact position?",ph:"Be as kind as you'd be to them."}
 ],take:"You can feel guilty and still be doing the right thing. The feeling passes. The boundary stays."},

{t:"The gentle no in practice",s:"Phrases from soft to firm",b:[
 {k:"p",x:"A gentle no has three parts: warmth, clarity, and nothing extra. You don't need a long explanation. Over-explaining invites debate."},
 {k:"q",x:"Start soft. If it isn't heard, get clearer. If it still isn't heard, get firm. You're not being harsh, you're being heard."},
 {k:"ladder"},
 {k:"h",x:"A few rules of thumb"},
 {k:"list",x:["Say no first, kindly, then stop talking","“I can't” invites solutions. “I won't” or “that doesn't work for me” doesn't","Skip the apology spiral. One “sorry” at most, and only if you mean it","You don't have to give a reason. A short one is fine if it helps you"]},
 {k:"area",id:"l5a",ask:"Write a no in your own words, for something real in your life:",ph:"Warmth, then clarity, then stop."}
 ],take:"Warm, clear, short. Start soft and move firmer only when you need to."},

{t:"Handling pushback",s:"When they don't take it well",b:[
 {k:"p",x:"Some people will accept your no with grace. Some won't, especially if they've benefited from your yes. Pushback doesn't mean you were wrong. It often means the boundary is working."},
 {k:"h",x:"Common pushback, and calm replies"},
 {k:"push"},
 {k:"h",x:"Three tools"},
 {k:"list",x:["The broken record: say the same calm sentence again, without adding anything","The pause: “I need to think about that and I'll get back to you”","The exit: end the conversation or leave if it turns into shouting or insults"]},
 {k:"p",x:"You don't have to win the argument. You only have to hold your line. Repeating yourself is allowed."},
 {k:"chips",id:"l6c",ask:"Which pushback is hardest for you?",o:["Guilt trips","Anger","Bargaining","Being called selfish","Silent treatment","Being asked why"]},
 {k:"area",id:"l6a",ask:"Write your calm reply to that one:",ph:"Short, repeatable, no extra explanation."}
 ],take:"You don't have to win the argument. You just have to hold your line, calmly, and as often as needed."},

{t:"Keeping them over time",s:"Boundaries are a practice, not a one-off",b:[
 {k:"p",x:"Expect wobbles. You'll cave sometimes, over-explain, or say yes and regret it. That isn't failure. It's what learning looks like."},
 {k:"h",x:"Follow-through is the boundary"},
 {k:"p",x:"A boundary only works if you do what you said you would. That's not a threat or a punishment. It's simply acting in line with what you've told them. “If the shouting starts, I'll end the call” only matters if you then end the call."},
 {k:"h",x:"When you wobble"},
 {k:"list",x:["Name it without self-attack: “I gave in, and I'm learning”","Ask what made it hard: the person, the moment, or the fear?","Reset kindly: “I've thought about it, and I need to change my answer”","Try again next time. Small and steady beats perfect"]},
 {k:"h",x:"Check in now and then"},
 {k:"p",x:"Once a month, ask: where am I resentful? Where am I exhausted? What did I say yes to that I'd rather not have? Those answers show you where the next boundary goes."},
 {k:"mine",ask:"Your first three boundaries. Write them as what you will do:",ph:"e.g. I don't answer work messages after 7pm"}
 ],take:"A boundary isn't a single brave moment. It's a steady practice, and you're allowed to keep learning it."}
];

  for(var k=0;k<SCEN.length;k++){h+='<button class="chip'+(k===i?' on':'')+'" data-act="sc" data-key="'+key+'" data-i="'+k+'">'+esc(SCEN[k].n)+'</button>';}
  h+='</div><div class="ladder">';
  for(var j=0;j<3;j++){
    h+='<div class="step"><small>'+LEVELS[j]+'</small><div class="t">“'+esc(SCEN[i].s[j])+'”</div><button class="btn ghost sm" data-act="copy" data-txt="'+esc(SCEN[i].s[j])+'">Copy</button></div>';
  }
  return h+'</div>';
}
function pushHTML(){
  var h="";
  for(var i=0;i<PUSH.length;i++){h+='<div class="pb"><div class="said">'+PUSH[i].s+'</div><div class="reply">'+esc(PUSH[i].r)+'</div></div>';}
  return h;
}
function mineListHTML(){
  if(!S.mine.length)return '<p class="empty">Nothing here yet.</p>';
  var h='<ul class="l mine">';
  for(var i=0;i<S.mine.length;i++){h+='<li><span>'+esc(S.mine[i])+'</span><button class="x" data-act="rm" data-i="'+i+'" aria-label="Remove">&times;</button></li>';}
  return h+'</ul>';
}

function block(b){
  switch(b.k){
    case "p":return "<p>"+esc(b.x)+"</p>";
    case "h":return '<h3 class="h">'+esc(b.x)+"</h3>";
    case "q":return '<div class="q">'+esc(b.x)+"</div>";
    case "list":return '<ul class="l">'+b.x.map(function(t){return "<li>"+esc(t)+"</li>";}).join("")+"</ul>";
    case "chips":
      var on=S.chips[b.id]||[];
      return '<div class="ex"><div class="tag">Try it</div><label class="al">'+esc(b.ask)+'</label><div class="chips">'+b.o.map(function(o){return '<button class="chip'+(on.indexOf(o)>-1?' on':'')+'" data-act="chip" data-id="'+b.id+'" data-v="'+esc(o)+'">'+esc(o)+"</button>";}).join("")+"</div></div>";
    case "area":
      return '<div class="ex"><div class="tag">Reflect</div><label class="al" for="'+b.id+'">'+esc(b.ask)+'</label><textarea id="'+b.id+'" data-act="txt" data-id="'+b.id+'" placeholder="'+esc(b.ph)+'">'+esc(S.text[b.id]||"")+"</textarea></div>";
    case "ladder":return ladderHTML("lsc");
    case "push":return pushHTML();
    case "mine":
      return '<div class="ex"><div class="tag">Your turn</div><label class="al" for="mi">'+esc(b.ask)+'</label><div class="row"><input type="text" id="mi" placeholder="'+esc(b.ph)+'" maxlength="160" style="flex:1;min-width:0"><button class="btn sm" data-act="addmine">Add</button></div><div style="margin-top:12px" id="minelist">'+mineListHTML()+"</div></div>";
  }
  return "";
}

function viewLesson(){
  var i=state.les,x=L[i];
  var h='<div class="top"><button class="back" data-act="home">&lsaquo; Lessons</button><span class="brand">'+(i+1)+' / 7</span></div>';
  h+='<div class="lh">Lesson '+(i+1)+'</div><h1 class="lt grad">'+esc(x.t)+'</h1><p class="ls">'+esc(x.s)+'</p>';
  for(var k=0;k<x.b.length;k++)h+=block(x.b[k]);
  h+='<div class="take"><div class="tag">Take with you</div><p>'+esc(x.take)+'</p></div>';
  h+='<div class="row" style="margin-bottom:10px">';
  h+='<button class="btn'+(S.done[i]?' ghost':'')+'" data-act="done" data-i="'+i+'">'+(S.done[i]?"Completed &#10003;":"Mark lesson complete")+'</button>';
  if(i<L.length-1)h+='<button class="btn ghost" data-act="open" data-i="'+(i+1)+'">Next lesson &rsaquo;</button>';
  h+='</div>';
  if(i===L.length-1&&S.done[i]){h+='<div class="fin"><div>'+sparkle()+'</div><h2 class="grad">That\'s the course.</h2><p class="sub">Be patient with yourself. Every gentle no is practice.</p></div>';}
  return h;
}
function viewPhrases(){
  var h='<div class="top"><span class="brand">NumeraKey</span></div>';
  h+='<h1 class="title grad">Phrase bank</h1><p class="sub">Pick a situation. Start soft and move firmer only if you need to. Tap Copy to use one.</p>';
  h+=ladderHTML("sc");
  h+='<h3 class="h">When they push back</h3>'+pushHTML();
  return h;
}
function viewMine(){
  var h='<div class="top"><span class="brand">NumeraKey</span></div>';
  h+='<h1 class="title grad">Mine</h1><p class="sub">Your boundaries and your notes. Everything stays on this device.</p>';
  h+='<h3 class="h">My boundaries</h3><div class="row" style="margin-bottom:10px"><input type="text" id="mi" placeholder="I will…" maxlength="160" style="flex:1;min-width:0"><button class="btn sm" data-act="addmine">Add</button></div><div id="minelist">'+mineListHTML()+'</div>';
  var notes="";
  for(var i=0;i<L.length;i++){
    L[i].b.forEach(function(b){
      if(b.k==="area"&&S.text[b.id]&&S.text[b.id].trim()){notes+='<div class="note"><small>Lesson '+(i+1)+' · '+esc(b.ask)+'</small>'+esc(S.text[b.id])+'</div>';}
    });
  }
  h+='<h3 class="h">My notes</h3>'+(notes||'<p class="empty">Your reflections from the lessons will collect here.</p>');
  h+='<div class="help"><b>If you are being hurt.</b> A boundary is not a substitute for safety. If a relationship is frightening or violent, contact support. Australia: 1800RESPECT 1800 737 732, Lifeline 13 11 14, or 000 in an emergency. UK: National Domestic Abuse Helpline 0808 2000 247. USA: National Domestic Violence Hotline 1-800-799-7233. Elsewhere, use your local emergency number.</div>';
  h+='<div style="margin-top:18px"><button class="btn ghost sm" data-act="reset">Clear my progress and notes</button></div>';
  return h;
}

var TABS=[

 {id:"phrases",n:"Phrases",i:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>'},

function drawTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(function(t){return '<button class="'+(state.tab===t.id?'on':'')+'" data-act="tab" data-id="'+t.id+'">'+t.i+t.n+"</button>";}).join("");
}
function render(keepScroll){
  var y=window.scrollY;
  var h;
  if(state.tab==="course")h=state.les===null?viewCourse():viewLesson();
  else if(state.tab==="phrases")h=viewPhrases();
  else h=viewMine();
  app.innerHTML=h;
  drawTabs();
  window.scrollTo(0,keepScroll?y:0);
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act");
  if(a==="tab"){state.tab=el.getAttribute("data-id");if(state.tab!=="course")state.les=null;render();}
  else if(a==="open"){state.tab="course";state.les=+el.getAttribute("data-i");render();}
  else if(a==="home"){state.les=null;render();}
  else if(a==="done"){var i=+el.getAttribute("data-i");S.done[i]=!S.done[i];save();render(true);if(S.done[i])toast("Lesson complete");}
  else if(a==="chip"){
    var id=el.getAttribute("data-id"),v=el.getAttribute("data-v");var arr=S.chips[id]||[];var p=arr.indexOf(v);
    if(p>-1)arr.splice(p,1);else arr.push(v);S.chips[id]=arr;save();el.classList.toggle("on");
  }
  else if(a==="sc"){state[el.getAttribute("data-key")]=+el.getAttribute("data-i");render(true);}
  else if(a==="copy"){copy(el.getAttribute("data-txt"));}
  else if(a==="addmine"){
    var inp=document.getElementById("mi");var v2=inp.value.trim();if(!v2)return;
    S.mine.push(v2);save();inp.value="";document.getElementById("minelist").innerHTML=mineListHTML();
  }
  else if(a==="rm"){S.mine.splice(+el.getAttribute("data-i"),1);save();document.getElementById("minelist").innerHTML=mineListHTML();}
  else if(a==="reset"){if(confirm("Clear all your progress, boundaries and notes on this device?")){S=blank();save();state.les=null;state.tab="course";render();}}
});
document.addEventListener("input",function(e){
  var el=e.target;if(el.getAttribute&&el.getAttribute("data-act")==="txt"){S.text[el.getAttribute("data-id")]=el.value;save();}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target&&e.target.id==="mi"){e.preventDefault();var b=document.querySelector('[data-act="addmine"]');if(b)b.click();}
});

render();
})();

<div id="demoBar"><b>Demo.</b> Lessons 1 and 2 are open. The full app unlocks all seven.</div>
<div id="demoLock"><div><h3>In the full app</h3><p>This part is in the full version of The Gentle No, yours to keep with a single purchase.</p><button type="button" id="demoOk">Back</button></div></div>
<script>
(function(){
document.addEventListener('click',function(e){
 var b=e.target.closest&&e.target.closest('[data-act="open"]');
 if(b&&+b.dataset.i>=2){e.stopImmediatePropagation();e.preventDefault();document.getElementById('demoLock').classList.add('on');}
},true);
document.getElementById('demoOk').onclick=function(){document.getElementById('demoLock').classList.remove('on');};
})();
</script>
