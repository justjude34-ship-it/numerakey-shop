<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kindness First — Demo</title>
<meta name="description" content="A bedtime path of small kind deeds for children and the grown-ups who love them.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kindness First">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000000'/%3E%3Cpath d='M32 50C14 37 12 26 19 20c5-4 11-2 13 3 2-5 8-7 13-3 7 6 5 17-13 30z' fill='%23f2c36b'/%3E%3C/svg%3E">
<style>
:root{--bg:#000000;--card:rgba(255,255,255,.075);--line:rgba(255,150,210,.42);--text:#fff7ee;--muted:#dcc9ee;--gold:#f2c36b;--gold2:#ffdf9b;--ink:#2a1d04;--serif:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--c-me:#c4b5ff;--c-family:#ffa8c0;--c-friends:#f2c36b;--c-world:#95e8ae;--c-tiny:#97d8ff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) radial-gradient(130% 70% at 50% 0%,#2b1040 0%,var(--bg) 62%) fixed;color:var(--text);font:18px/1.55 var(--sans);min-height:100vh}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:700;line-height:1.2;margin:0 0 .4em}
h1{font-size:1.9rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.wrap{max-width:580px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom))}
#main{outline:none}
.view>*+*{margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.hero{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:3/2;border:1px solid var(--line);background:#0a0a0a}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.9))}
.hero-t{position:absolute;left:18px;right:18px;bottom:14px;z-index:2}
.hero-t h1{margin:0;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.kicker{margin:0 0 2px;color:var(--gold2);font-weight:600}
.btn{min-height:52px;padding:12px 22px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 1.02rem var(--sans);cursor:pointer;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);border-color:transparent;box-shadow:0 6px 22px rgba(242,195,107,.28)}
.btn.soft{background:rgba(185,168,255,.14);border-color:rgba(185,168,255,.5)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.small{min-height:44px;padding:8px 16px;font-size:.95rem}
.btn[disabled]{opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,.switch:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.gap{justify-content:flex-start;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.85rem;font-weight:700;color:var(--ink);background:var(--gold);margin-bottom:6px}
[data-cat=me] .tag,.tag[data-cat=me]{background:var(--c-me)}
[data-cat=family] .tag,.tag[data-cat=family]{background:var(--c-family)}
[data-cat=friends] .tag,.tag[data-cat=friends]{background:var(--c-friends)}
[data-cat=world] .tag,.tag[data-cat=world]{background:var(--c-world)}
[data-cat=tiny] .tag,.tag[data-cat=tiny]{background:var(--c-tiny)}
.heartcard{display:flex;gap:14px;align-items:center}
.hj{flex:0 0 auto;filter:drop-shadow(0 0 14px rgba(242,195,107,.45))}
.hglow{animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.78}}
.next{margin:0;font-size:.95rem;color:var(--gold2)}
.offers{display:grid;gap:10px;margin:12px 0}
.offer{display:block;width:100%;text-align:left;min-height:84px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font:inherit;cursor:pointer;touch-action:manipulation}
.offer:active{transform:scale(.99)}
.otext{display:block;font-size:1.08rem}
.ktext{font-family:var(--serif);font-size:1.5rem;line-height:1.35;margin:.1em 0 .6em}
.think{color:var(--muted);font-size:.98rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{min-height:46px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:600 .98rem var(--sans);cursor:pointer;touch-action:manipulation}
.chip[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.lab{display:block;font-weight:600;margin:10px 0 6px}
.field{width:100%;min-height:50px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:inherit}
textarea.field{min-height:92px;resize:vertical}
.glow{box-shadow:0 0 40px rgba(242,195,107,.22);border-color:rgba(242,195,107,.6)}
.lit{display:flex;justify-content:center;margin-bottom:6px;filter:drop-shadow(0 0 18px rgba(255,200,90,.8));animation:pulse 2.4s ease-in-out infinite}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:rgba(242,195,107,.14);border:1px solid var(--gold);border-radius:16px;padding:12px 14px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:10px}
.stats b{display:block;font:700 1.6rem var(--serif);color:var(--gold2)}
.stats span{font-size:.85rem;color:var(--muted)}
.trail{width:100%;height:auto;display:block}
.story{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;cursor:pointer;min-height:84px}
.story img{width:92px;height:62px;object-fit:cover;border-radius:12px;flex:0 0 auto}
.story.locked img{filter:blur(9px) brightness(.55)}
.story strong{display:block;font-family:var(--serif)}
.story em{font-style:normal;color:var(--muted);font-size:.93rem}
.list>*+*{margin-top:10px}
.entry,.note{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.04)}
.entry p,.note p{margin:0 0 4px;white-space:pre-wrap}
.entry small,.note small{color:var(--muted)}
.link{background:none;border:0;color:var(--gold2);text-decoration:underline;font:inherit;min-height:44px;padding:0 6px;cursor:pointer}
.switch{position:relative;width:62px;height:36px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.12);cursor:pointer;flex:0 0 auto}
.switch .knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked=true]{background:var(--gold)}
.switch[aria-checked=true] .knob{transform:translateX(26px);background:var(--ink)}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
ul.tips{padding-left:1.2em;margin:.4em 0}
ul.tips li{margin-bottom:.5em}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(0,0,0,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabbtn{flex:1;max-width:136px;min-height:58px;border:0;background:transparent;color:var(--muted);font:600 .8rem var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;cursor:pointer}
.tabbtn[aria-current=page]{color:var(--gold2);background:rgba(242,195,107,.12)}
.tabbtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{width:100%;max-width:580px;max-height:94vh;overflow:auto;background:#140c1c;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));outline:none}
.sheet.full{align-items:stretch}
.sheet.full .panel{max-height:none;height:100%;border-radius:0;border:0;background:var(--bg) radial-gradient(130% 70% at 50% 0%,#2b1040 0%,var(--bg) 62%)}
.sheet img.big{width:100%;border-radius:18px;display:block;margin-bottom:14px}
.dots{display:flex;justify-content:center;gap:8px;margin:14px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:var(--gold)}
.breath{text-align:center;margin:10px 0 16px}
.orb{width:150px;height:150px;margin:6px auto 10px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3c4,#f2c36b 60%,#b8832a);transform:scale(.55);transition:transform 4s ease-in-out;box-shadow:0 0 40px rgba(242,195,107,.5)}
.kword{font-family:var(--serif);font-size:1.25rem;line-height:1.4;border-left:3px solid var(--gold);padding-left:12px;margin:8px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92%;background:#fff;color:#1a1a2e;padding:12px 18px;border-radius:14px;font-weight:600;z-index:90;display:none;box-shadow:0 8px 30px rgba(0,0,0,.4);text-align:center}
#dim{position:fixed;inset:0;pointer-events:none;background:rgba(45,20,0,.34);z-index:100;display:none}
body.dim #dim{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.1);border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:var(--muted);flex:0 0 auto}
.avatar img,.hero-av img{width:100%;height:100%;object-fit:cover;display:block}
.hero-av{position:absolute;top:12px;left:12px;z-index:3;width:50px;height:50px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,223,155,.85);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:rgba(242,195,107,.22);color:var(--gold2);font-size:.72rem;font-weight:800;letter-spacing:.08em;margin-left:8px;vertical-align:middle}
.wbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.wdots{display:flex;gap:6px}.wdots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25)}.wdots i.on{background:var(--gold)}
.wscene{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:3/2;background:#0b0a24;cursor:pointer;border:1px solid var(--line);margin-bottom:12px}
.wscene img.sc{width:100%;height:100%;object-fit:cover;display:block}
.wscene .av{position:absolute;top:10px;left:10px;width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid rgba(255,223,155,.85)}
.wscene .hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:.8rem;color:rgba(255,236,190,.95);text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none}
.lumi{position:absolute;right:18%;top:30%;pointer-events:none;animation:floaty 5s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,211,90,.9))}
.lumi svg{display:block;transform:scale(var(--ls,1));opacity:var(--lo,1);transition:transform .6s,opacity .6s}
@keyframes floaty{50%{transform:translate(-14px,-10px)}}
.sparkle{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#fff 0,#f6e7a1 40%,transparent 70%);box-shadow:0 0 12px #e0b84a;animation:sparkRise 1.1s ease-out forwards;pointer-events:none}
@keyframes sparkRise{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-48px) scale(1.3)}}
.wnarr{font-family:var(--serif);font-size:1.2rem;line-height:1.55;margin:0 0 12px;outline:none}
.name-hl{color:var(--gold2);font-weight:700}
.badge{display:inline-block;font-size:.8rem;font-weight:700;color:var(--gold2);background:rgba(242,195,107,.14);padding:4px 12px;border-radius:999px;margin-bottom:8px}
.wchoice{display:block;width:100%;text-align:left;min-height:60px;padding:14px 16px;margin-bottom:10px;border-radius:18px;border:1.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);font:600 1.05rem var(--sans);cursor:pointer;touch-action:manipulation}
.wchoice[aria-pressed=true]{border-color:var(--gold);background:rgba(242,195,107,.18)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media (min-width:600px){body{font-size:19px}}

/* colourful on black */
.btn.primary{background:linear-gradient(135deg,#ffe27a,#ffb36b 55%,#ff8fc0);box-shadow:0 6px 22px rgba(255,140,190,.35)}
.hero{border-color:#ff8fc0;box-shadow:0 0 26px rgba(255,120,190,.25)}
.card{border-color:rgba(255,150,210,.42);background:linear-gradient(160deg,rgba(255,120,190,.10),rgba(120,110,255,.08))}
.kicker{color:#ff9ccb}
.offers .offer:nth-child(1){border-color:#ff8fc0;background:rgba(255,143,192,.10)}
.offers .offer:nth-child(2){border-color:#ffd35a;background:rgba(255,211,90,.09)}
.offers .offer:nth-child(3){border-color:#6fe8d6;background:rgba(111,232,214,.09)}
.stats>*:nth-child(1) b{color:#ff9ccb}.stats>*:nth-child(2) b{color:#ffd35a}.stats>*:nth-child(3) b{color:#6fe8d6}
.tabbtn[aria-current=page]{color:#ff9ccb;background:rgba(255,143,192,.16)}
.chip{border-color:rgba(190,160,255,.6)}
.btn.soft{background:rgba(160,130,255,.22);border-color:rgba(190,160,255,.7)}
.wchoice{border-color:rgba(190,160,255,.5);background:rgba(160,130,255,.10)}
.wchoice[aria-pressed=true]{border-color:#ff8fc0;background:rgba(255,143,192,.2)}
.next,.name-hl,.link{color:#ffc4e0}
.dots i.on,.wdots i.on{background:#ff8fc0}
</style>
</head>

var CATS={
 me:{label:'Kind to me'},family:{label:'Kind to my family'},friends:{label:'Kind to my friends'},world:{label:'Kind to the world'},tiny:{label:'A tiny kindness'}};
var P={
 me:['Look in the mirror and say one nice thing to yourself.','Take three slow dragon breaths. Smell the flower, blow out the candle.','Think of one thing you tried today, even if it was hard. Be proud of trying.','Give yourself a big, squeezy hug.','If you make a mistake today, say, “That’s okay. I’m still learning.”','Do something you love, just because you love it.','Say, “I’m doing my best,” and mean it.','Drink a glass of water, slowly, like a cosy bear.','Look up at the sky and think of one thing you’re glad about.','If your body feels tired, give it a little rest.','Say, “I can’t do it yet,” instead of, “I can’t do it.”','Tuck yourself in tonight like someone you love.'],
 family:['Give someone in your family a big, long hug. Ask first.','Say thank you for a meal, and say what you liked about it.','Help set the table or clear it away without being asked.','Draw a picture for someone at home.','Tell someone in your family one thing you love about them.','Give your pet a gentle pat and check they have fresh water. A grown-up can help.','Let someone else go first today.','Share your favourite snack or toy with someone at home.','Say “I love you” out loud, in a note, or in a drawing.','Tidy up one thing that isn’t yours.','Be a good listener. Look at them while they talk.','Make your grown-up a pretend cup of tea.'],
 friends:['Invite someone who is on their own to play.','Say “Well done!” to a friend.','Share your turn.','If you hurt someone, even by accident, say sorry.','If someone looks sad, ask, “Are you okay?”','Include someone in your game.','Pick up something a friend dropped and hand it back.','Tell a friend one thing you like about them.','Cheer for a friend, even if you didn’t win.','Say, “Come and sit with me.”','Use kind words, even when you feel cross.','Help a friend who is stuck.'],
 world:['Water a plant.','Fill a bowl of fresh water for the birds. A grown-up can help.','Pick up three pieces of rubbish. A grown-up can help.','Switch off a light you don’t need.','Turn the tap off while you brush your teeth.','If a bug is in the house, help it get outside safely.','Say hello to a tree.','Plant a seed and give it water.','Find a toy or book you’ve outgrown and give it to someone who’d love it.','Look after a library book or a toy like it’s precious.','Say thank you to a helper, like a teacher, a bus driver or a shopkeeper.','Walk gently around a garden and notice something beautiful.'],
 tiny:['Take one slow breath.','Smile at someone.','Say please and thank you today.','Wave hello.','Give a thumbs-up to someone.','Say good morning, or good night, in a kind voice.','Whisper something kind to your teddy.','Hold a door open.','Clap for someone.','Look at someone’s face and say hi.']
};
var THINK={me:'Being kind to you counts, too. It’s where kindness starts.',family:'Think: how do you think they will feel when you do this?',friends:'Think: how would you feel if someone did this for you?',world:'Think: how might the plants, animals and planet feel?',tiny:'Tiny kindnesses are real kindnesses.'};
var WORDS=['You are loved just as you are.','Mistakes help your brain grow.','Big feelings are okay. They come, and they go.','You can try again tomorrow.','Being kind to yourself is a good start.','It’s okay to ask for a hug.','You are not too much.','Even the moon has quiet nights.','You don’t have to be perfect to be kind.','You are not behind. You’re on your own path.'];
var CELEBRATE=['You made the Kindness Heart glow a little brighter.','Someone’s day just got softer because of you.','That was your idea, and it was a kind one.','Kindness grows every time you use it.','You noticed, and then you did something. That’s how kind people work.','A tiny kindness is never really tiny.'];
var NOTICE=[['smile','They smiled'],['thanks','They said thank you'],['warm','I felt warm inside'],['better','They felt better'],['hard','It was hard, but I did it'],['nothing','Nothing happened, and that’s okay']];
var WHEN=['This morning','At school or kinder','After school','Tonight'];
var CH=[
 {id:'begin',title:'The Heart in the Sky',at:0,art:'cover',alt:'A golden heart glowing over a moonlit garden path',story:[
  'Far away, where the moon sits low and the stars come very close, there is a path. It is soft and quiet, and it winds past gardens full of sleepy flowers.',
  'Above the path floats a heart made of golden light. It is called the Kindness Heart.',
  'Here is its secret. Every time somebody does something kind, it glows a little brighter. A smile makes it glow. A hug makes it glow. Sharing makes it glow, and so does saying sorry.',
  'Tonight, the Kindness Heart is waiting for you. Not because you have to. Because you can.',
  'The path is always more beautiful when there are lanterns along it. Sleep well. Tomorrow we’ll light the first one.']},
 {id:'gate',title:'The Lantern Gate',at:0,art:'gate',alt:'A stone gate with a glowing lantern among flowers on a moonlit path',story:[
  'At the end of the path there is an old stone gate, covered in tiny flowers. A lantern glows inside it, warm and golden.',
  'But tonight something is not quite right. On the step sits a little firefly, and its light is very, very dim.',
  '“What’s the matter?” you ask softly.',
  '“Nobody noticed me,” the firefly whispers. “I felt so small that my light went out.”',
  'You do not rush. You do not try to fix it. You just sit down beside the firefly, and you stay.',
  'After a while, the firefly gives a tiny flicker. Then a glow. Then a shine so bright that the whole gate sparkles.',
  '“Thank you for noticing me,” says the firefly.',
  'Sometimes the kindest thing is simply to notice someone, and sit with them for a little while.',
  'Up in the sky, the Kindness Heart glows a little brighter. Goodnight, noticer.']},
 {id:'letter',title:'The Letter',at:1,art:'letter',alt:'Flowers and a folded paper with a glowing heart on a stone path',story:[
  'Beside the path, on a flat grey stone, you find a bunch of flowers and a folded piece of paper. A tiny heart of light glows on top of it.',
  'You open the paper. It says: For whoever needs it.',
  'There is no name. There is no “from”. Someone left this kindness here and walked home without waiting to be thanked.',
  'You smell the flowers. They smell like summer. For a moment, your whole chest feels warm.',
  '“I wonder who left it,” you say to the moon. The moon only smiles.',
  'Then you have an idea. You find a pencil in your pocket, and you draw a big smile on the back of the paper. You fold it up again and leave it for the next person to find.',
  'Kindness doesn’t have to be seen to be real.',
  'As you walk on, the heart in the sky shines a little brighter, and you hum all the way down the path. Goodnight, kind secret-keeper.']},
 {id:'walk',title:'The Walk',at:5,art:'walk',alt:'A person walking a flower-lined path toward mountains under a glowing heart',story:[
  'The path is long tonight, and your legs are tired. Fireflies drift over the flowers like tiny floating lanterns.',
  'You could keep walking and walking. But instead, you stop. You sit on a smooth rock beside the stream, and you take three slow breaths. Smell the flower. Blow out the candle.',
  '“It’s okay to rest,” you tell yourself. “Being kind includes being kind to me.”',
  'You scoop a sip of cool water in your hands. Your tummy feels calm. Your legs feel strong again.',
  'Just then you hear a tiny rustle. A baby possum is sitting in the dark, too scared to move.',
  'You hold out your lantern. The light makes a warm little circle on the ground.',
  '“Follow the light,” you say gently. One small step, and then another. The possum comes along, all the way home to its tree.',
  'You didn’t have to be big. You only had to be kind, and a little bit brave.',
  'When you look up, the heart in the sky is glowing softly. Goodnight, light-carrier.']},
 {id:'bridge',title:'The Bridge',at:12,art:'bridge',alt:'A wooden bridge over a river under a golden heart in the night sky',story:[
  'At last you come to a river, wide and shining with moonlight. Across it there is a bridge, made of warm old wood, with fireflies glowing along its rails.',
  'You put your foot on the first plank. “Who built this?” you wonder.',
  'A whisper comes up from the wood. “Everyone who was ever kind to you.”',
  'This plank is the person who made your breakfast. This one is the friend who shared. This one is the teacher who smiled. Every kindness you were ever given is here, holding you up.',
  'You walk across, plank by plank, feeling very safe.',
  'On the other side, you turn around. And you notice something wonderful. You have been building a bridge too, for someone you haven’t even met yet. Every kind thing you do is another plank.',
  'The Kindness Heart glows gold all across the water.',
  'You did that. Goodnight, bridge-builder.']}
];
