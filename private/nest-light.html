<title>Nest Light</title>
<meta name="description" content="A quiet self-care companion. Mood, talk, breath, and tiny next steps. Not therapy." />
<meta name="theme-color" content="#07080c" />

<style>
  :root {
    --bg: #07080c;
    --card: #10131b;
    --ink: #f4efe6;
    --muted: #b7b0a4;
    --gold: #d4b46a;
    --line: rgba(212, 180, 106, 0.22);
    --teal: #7ec8c0;
    --danger: #e8b4b4;
    --display: "Cormorant Garamond", "Iowan Old Style", Palatino, Georgia, serif;
    --sans: Outfit, ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); }
  body {
    font-family: var(--sans);
    background:
      radial-gradient(900px 520px at 80% -8%, rgba(126, 200, 192, 0.11), transparent 55%),
      radial-gradient(700px 420px at -12% 18%, rgba(212, 180, 106, 0.08), transparent 50%),
      var(--bg);
  }
  button, [role="button"] { cursor: pointer; font: inherit; color: inherit; }
  button { background: none; border: 0; }
  a { color: var(--gold); text-decoration: none; }
  input, textarea { font: inherit; color: var(--ink); }
  .shell {
    max-width: 36rem;
    margin: 0 auto;
    min-height: 100dvh;
    padding: 1.25rem 1.25rem calc(8.4rem + env(safe-area-inset-bottom));
  }
  .view { animation: rise 0.28s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } .mic.live { animation: none; } }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; }
  .brand { font-family: var(--display); font-size: 1.55rem; letter-spacing: 0.02em; }
  .brand em { font-style: normal; color: var(--gold); }
  .kicker { margin: 0 0 0.45rem; font-size: 0.74rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--teal); }
  h1 { margin: 0 0 0.5rem; font-family: var(--display); font-weight: 600; font-size: clamp(1.85rem, 6vw, 2.55rem); line-height: 1.05; }
  h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.45rem; }
  .muted { color: var(--muted); line-height: 1.55; }
  .hero { overflow: hidden; border-radius: 1.25rem; border: 1px solid var(--line); margin-bottom: 1rem; }
  .hero img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: center; }
  .amy { display: flex; align-items: center; gap: 0.85rem; margin: 0.15rem 0 0.9rem; }
  .amy img { width: 5.4rem; height: 5.4rem; border-radius: 50%; object-fit: cover; object-position: center 12%; border: 2px solid rgba(212,180,106,0.7); flex: none; }
  .amy strong { display: block; font-size: 1.15rem; letter-spacing: -0.02em; }
  .amy span { display: block; color: var(--muted); font-size: 0.9rem; margin-top: 0.15rem; line-height: 1.35; }
  .card {
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    background: linear-gradient(180deg, rgba(255,255,255,.03), transparent 42%), var(--card);
    padding: 1rem;
    margin-bottom: 0.75rem;
  }
  .gold, .ghost, .linebtn, .choice {
    min-height: 3.5rem;
    border-radius: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0.75rem 1rem;
  }
  .gold { width: 100%; border: 1px solid var(--gold); background: var(--gold); color: #1a1408; font-weight: 600; font-size: 1.02rem; }
  .gold:active, .linebtn:active, .choice:active { transform: scale(0.98); }
  .ghost { min-height: 0; border-radius: 999px; border: 1px solid var(--line); padding: 0.45rem 0.9rem; font-size: 0.9rem; }
  .linebtn { flex: 1; border: 1px solid var(--line); background: rgba(255,255,255,0.03); }
  .choice { width: 100%; margin-bottom: 0.6rem; border: 1px solid var(--line); background: rgba(255,255,255,0.03); font-size: 1.02rem; }
  .choice.on { border-color: var(--gold); background: rgba(212,180,106,0.15); }
  .field, .area {
    width: 100%;
    border-radius: 1rem;
    border: 1px solid var(--line);
    background: #0b0e14;
    padding: 0.9rem 1rem;
    outline: none;
  }
  .field:focus, .area:focus { border-color: var(--gold); }
  .area { min-height: 9rem; resize: vertical; line-height: 1.55; }
  .split { display: flex; gap: 0.6rem; margin: 0.75rem 0; }
  .stones { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.4rem; }
  .stone, .day {
    aspect-ratio: 1;
    border-radius: 999px;
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.68rem;
    min-height: 4.2rem;
  }
  .stone b { color: var(--ink); font-size: 1.15rem; font-weight: 500; }
  .stone.on { border-color: var(--gold); background: rgba(212,180,106,0.2); color: var(--ink); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; margin-top: 0.7rem; }
  .day { min-height: 0; font-size: 0.62rem; }
  .day.on { border-color: var(--gold); color: var(--gold); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; }
  .tile {
    min-height: 6rem;
    border-radius: 1.15rem;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    padding: 0.85rem;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .tile span { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
  .tile strong { font-family: var(--display); font-size: 1.28rem; font-weight: 600; }
  .bubbles { display: flex; flex-direction: column; gap: 0.65rem; min-height: 38dvh; }
  .herrow { display: flex; align-items: flex-end; gap: 0.45rem; }
  .herface { width: 1.85rem; height: 1.85rem; border-radius: 50%; object-fit: cover; object-position: center 12%; flex: none; }
  .bubble { max-width: 92%; border-radius: 1.05rem; border: 1px solid var(--line); padding: 0.75rem 1rem; line-height: 1.55; white-space: pre-wrap; }
  .herrow .bubble { max-width: 86%; }
  .bubble.user { align-self: flex-end; border-color: rgba(212,180,106,0.3); background: rgba(212,180,106,0.15); }
  .bubble.her { align-self: flex-start; background: #141821; }
  .bubble.crisis { align-self: flex-start; border-color: rgba(232,180,180,0.35); background: #1a1012; color: #f6e6e6; }
  .micwrap { position: sticky; bottom: calc(4.6rem + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 0.7rem; margin-top: 0.8rem; }
  .mic {
    width: 5rem; height: 5rem; border-radius: 999px;
    border: 1px solid var(--gold); background: var(--gold); color: #1a1408;
    display: flex; align-items: center; justify-content: center;
  }
  .mic.live { animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212,180,106,0.45); }
    50% { box-shadow: 0 0 0 16px rgba(212,180,106,0); }
  }
  .miclabel { margin: 0; color: var(--gold); font-weight: 600; text-align: center; }
  .composer { display: flex; gap: 0.5rem; width: 100%; }
  .composer .field { min-height: 3rem; flex: 1; }
  .composer .gold { width: auto; min-width: 4.6rem; min-height: 3rem; }
  .orbwrap { display: flex; flex-direction: column; align-items: center; padding: 1.5rem 0; }
  .orb {
    width: min(58vw, 15.5rem); height: min(58vw, 15.5rem);
    border-radius: 999px; border: 1px solid rgba(126,200,192,0.4);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-size: 1.8rem;
    background: radial-gradient(circle at 40% 35%, rgba(244,239,230,.22), rgba(126,200,192,.08) 42%, rgba(7,8,12,.2));
    transform: scale(0.82);
    transition: transform 1s linear;
  }
  .orb.in { transform: scale(1.05); }
  .count { margin-top: 0.75rem; color: var(--gold); font-size: 1.1rem; }
  .entry { border-bottom: 1px solid var(--line); padding: 0.75rem 0; }
  .entry:last-child { border-bottom: 0; }
  .entry time { display: block; color: var(--gold); font-size: 0.75rem; margin-bottom: 0.25rem; }
  .step { display: flex; gap: 0.75rem; align-items: flex-start; border: 1px solid var(--line); border-radius: 1rem; padding: 0.85rem; margin-bottom: 0.6rem; background: rgba(255,255,255,0.02); }
  .step input { width: 1.25rem; height: 1.25rem; margin-top: 0.15rem; accent-color: var(--gold); }
  .step.done p { text-decoration: line-through; opacity: 0.55; }
  .crisis, .dock {
    position: fixed; left: 0; right: 0; z-index: 20;
  }
  .crisis {
    bottom: calc(4.6rem + env(safe-area-inset-bottom));
    background: #0c0e13; border-top: 1px solid var(--line);
    text-align: center; color: var(--muted); font-size: 0.78rem; padding: 0.45rem 0.75rem;
  }
  .dock {
    bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.15rem;
    border-top: 1px solid var(--line);
    background: rgba(7,8,12,0.94);
    padding: 0.35rem 0.4rem calc(0.35rem + env(safe-area-inset-bottom));
  }
  .dock button { border-radius: 0.6rem; padding: 0.45rem 0.2rem; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .dock button.on { background: rgba(212,180,106,0.1); color: var(--gold); }
  .dock svg { display: block; margin: 0 auto 0.15rem; }
  .fine { font-size: 0.9rem; color: var(--muted); }
</style>
</head>

  if (CRISIS.test(t)) return { crisis: true, text: "I’m glad you said that here, and this is bigger than an app. Please reach a real person now.\n\nAustralia: Emergency 000 · Lifeline 13 11 14 (24 hours) · Beyond Blue 1300 22 4636\n\nIf you can, stay with someone or call one of those numbers." };
  if (/anxious|anxiety|panic|racing/.test(t)) return { text: "Anxiety makes everything feel urgent. You’re safe enough to slow the next minute. Want four breaths, or to keep talking?" };
  if (/angry|furious|rage|crossed a line/.test(t)) return { text: "Anger gets a seat too. What crossed a line?" };
  if (/tired|exhausted|cannot|can't keep/.test(t)) return { text: "Tired is information. Do you need rest, or just a softer next step?" };
  if (/overwhelm|too much|spinning|everything/.test(t)) return { text: "That’s a lot to be carrying. Want to dump it here, or do one slow breath first?" };
  if (/stuck|can't start|cannot start|paralys|frozen/.test(t)) return { text: "Stuck is allowed. What’s the smallest next move that still counts?" };
  if (/lonely|alone|nobody/.test(t)) return { text: "You’re not talking into empty air. I’m here. What would feel less alone for the next five minutes?" };
  if (/don't know|dont know|no idea|idk/.test(t)) return { text: "Not knowing is allowed. We can sit with that, or tap a mood instead." };
  if (/thank|that's enough|thats enough|goodnight|bye/.test(t)) return { text: "That’s enough for now. You showed up. That counts." };
  if (/pet|cat|dog|furbaby/.test(t)) return { text: "The animals often know before we do. Are they nearby? Sometimes that’s the whole plan: sit with them for one minute." };
  if (/sleep|insomnia|awake/.test(t)) return { text: "Sleep fights back when we chase it. A slower exhale can be enough for this minute. Want the breath tool?" };
  const fallbacks = ["I’m listening. Say a little more if you want, or we can pick one small tool.", "That can sit here. What part of it is loudest right now?", "Take your time. There’s no right way to start.", "Noted. Do you want company with the feeling, or a tiny next step?"];
  return { text: fallbacks[Math.floor(Math.random() * fallbacks.length)] };
}
function opener(brought) {
  return ({ overwhelmed: "That’s a lot to be carrying. Want to dump it here, or do one slow breath first?", stuck: "We don’t have to fix the whole thing. What’s the very first inch?", lonely: "Thanks for coming in. You don’t have to perform okay-ness here.", checking: "I’m Amy. Say it however it comes." })[brought] || "I’m Amy. Say it however it comes.";
}

function persist() {
  const next = Object.assign({}, state);
  if (next.moods.length > 180) next.moods = next.moods.slice(-90);
  if (next.journal.length > 200) next.journal = next.journal.slice(-200);
  if (next.chats.length > 100) next.chats = next.chats.slice(-100);
  if (next.steps.length > 40) next.steps = next.steps.slice(-40);
  try { localStorage.setItem(KEY, JSON.stringify(next)); } catch { /* this phone is full */ }
  state = next;
}

let speakToken = 0;
let player = null;
const speaker = new Audio();
let pendingHear = null;
function primeVoice() {
  try {
    speaker.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
    const p = speaker.play();
    if (p && p.catch) p.catch(function () {});
  } catch { /* ignore */ }
}
function haltPlayback() {
  speakToken += 1;
  pendingHear = null;
  try { speaker.pause(); } catch { /* ignore */ }
  if (player && player !== speaker) {
    try { player.pause(); } catch { /* ignore */ }
  }
  player = null;
  window.speechSynthesis && window.speechSynthesis.cancel();
}
function stopVoice() {
  haltPlayback();
  try { recog && recog.abort(); } catch { /* ignore */ }
  recog = null;
  heard = "";
  voicePhase = "idle";
}
function deviceSpeak(line, crisis, token, done) {
  if (!window.speechSynthesis) { done(); return; }
  const u = new SpeechSynthesisUtterance(line);
  u.lang = "en-AU";
  u.rate = 0.92;
  u.pitch = 1.04;
  const voices = window.speechSynthesis.getVoices();
  const en = voices.filter((v) => /^en/i.test(v.lang));
  const pool = en.length ? en : voices;
  const voice = pool.find((v) => /karen|moira|samantha|female|google uk english female/i.test(v.name)) || pool[0];
  if (voice) u.voice = voice;
  u.onend = u.onerror = () => { if (token === speakToken) done(); };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
}
function speak(text, crisis) {
  const line = crisis
    ? "Please reach a real person now. In Australia, Lifeline is 13 11 14, twenty four hours."
    : String(text || "").replace(/\s+/g, " ").trim();
  if (!line) { voicePhase = "idle"; render(); return; }
  haltPlayback();
  const token = speakToken;
  voicePhase = "speaking";
  voiceHint = "Amy’s speaking…";
  const done = () => {
    if (token !== speakToken) return;
    voicePhase = "idle";
    voiceHint = crisis ? "Please use the numbers below if you can." : "Your turn. Tap the gold button, speak, then tap again when you’re done.";
    render();
  };
  render();
  const playBlob = (blob) => {
    const url = URL.createObjectURL(blob);
    player = speaker;
    speaker.onended = () => { URL.revokeObjectURL(url); if (player === speaker) player = null; done(); };
    speaker.onerror = () => { URL.revokeObjectURL(url); if (token === speakToken) { voicePhase = "idle"; voiceHint = "Amy’s reply is above. Tap to speak again."; render(); } };
    speaker.src = url;
    const started = speaker.play();
    if (started && started.catch) {
      started.catch(() => {
        if (token !== speakToken) return;
        pendingHear = url;
        voicePhase = "idle";
        voiceHint = "Tap Hear Amy. That’s her voice.";
        render();
      });
    }
  };
  if (location.protocol === "file:") { deviceSpeak(line, crisis, token, done); return; }
  fetch("/api/speak", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ text: line.slice(0, 420) }),
  }).then(async (res) => {
    if (token !== speakToken) return;
    if (!res.ok) { voicePhase = "idle"; voiceHint = "Amy’s reply is written above. Her voice missed that one — tap to speak again."; render(); return; }
    const blob = await res.blob();
    if (token !== speakToken) return;
    if (blob.size < 80) { voicePhase = "idle"; voiceHint = "Amy’s reply is written above."; render(); return; }
    playBlob(blob);
  }).catch(() => {
    if (token !== speakToken) return;
    voicePhase = "idle";
    voiceHint = "Amy’s reply is written above. Tap to speak again.";
    render();
  });
}
function pushChat(role, text, crisis) {
  state.chats = state.chats.concat([{ id: uid(), role, at: new Date().toISOString(), text, crisis: !!crisis }]);
  persist();
}
async function ingest(text) {
  const trimmed = String(text || "").trim();
  if (!trimmed) return null;
  if (CRISIS.test(trimmed)) {
    const r = replyTo(trimmed);
    pushChat("user", trimmed);
    pushChat("companion", r.text, true);
    return r;
  }
  pushChat("user", trimmed);
  voicePhase = "thinking";
  voiceHint = "Amy heard: “" + trimmed + "”";
  render();
  let reply = "";
  try {
    const res = await fetch("/api/reply", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        name: state.profile.name,
        said: trimmed,
        messages: state.chats.slice(-8).map((c) => ({ role: c.role, text: c.text })),
      }),
    });
    if (res.ok) {
      const body = await res.json();
      if (body && body.text) reply = String(body.text);
    }
  } catch { /* Amy answers from the phone if the line is quiet */ }
  if (!reply) reply = replyTo(trimmed).text;
  pushChat("companion", reply);
  return { text: reply, crisis: false };
}
function ensureOpener() {
  if (state.chats.length) return;
  state.chats = [{ id: uid(), role: "companion", at: new Date().toISOString(), text: opener(state.profile.brought) }];
  persist();
}
function startListen() {
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) {
    voicePhase = "idle";
    voiceHint = "This phone needs the microphone. You can still type below — Amy will answer out loud.";
    render();
    return;
  }
  heard = "";
  recog = new Ctor();
  recog.lang = "en-AU";
  recog.interimResults = true;
  recog.continuous = true;
  recog.onresult = (ev) => {
    let line = "";
    for (let i = 0; i < ev.results.length; i++) line += ev.results[i][0].transcript;
    heard = line.replace(/\s+/g, " ").trim();
  };
  recog.onerror = () => {};
  try { recog.start(); } catch { /* already started */ }
  voicePhase = "listening";
  voiceHint = "Listening. Say the whole thing, then tap the gold button when you’re done.";
  render();
}
function finishListen() {
  const text = heard;
  try { recog && recog.stop(); } catch { /* ignore */ }
  recog = null;
  if (!text) {
    voicePhase = "idle";
    voiceHint = "I didn’t catch that. Tap the gold button and say it again.";
    render();
    return;
  }
  voicePhase = "thinking";
  voiceHint = "Amy heard: “" + text + "”";
  render();
  ingest(text).then((r) => {
    if (r) speak(r.text, r.crisis);
    else { voicePhase = "idle"; render(); }
  });
}
function toggleMic() {
  primeVoice();
  if (pendingHear) {
    const url = pendingHear;
    pendingHear = null;
    voicePhase = "speaking";
    voiceHint = "Amy’s speaking…";
    render();
    speaker.src = url;
    speaker.onended = () => {
      voicePhase = "idle";
      voiceHint = "Your turn. Tap the gold button, speak, then tap again when you’re done.";
      render();
    };
    speaker.play().catch(() => {});
    return;
  }
  if (voicePhase === "thinking") return;
  if (voicePhase === "listening") return finishListen();
  if (voicePhase === "speaking") {
    stopVoice();
    voiceHint = "Your turn. Tap the gold button when you’re ready.";
    render();
    return;
  }
  window.speechSynthesis && window.speechSynthesis.getVoices();
  startListen();
}
function go(next) {
  if (next !== "breathe") { breathOn = false; breathTick = 0; if (breathTimer) { clearInterval(breathTimer); breathTimer = null; } }
  if (view === "talk" && next !== "talk") stopVoice();
  if (next === "ground") groundStep = 0;
  if (next === "talk") ensureOpener();
  view = next;
  render();
  window.scrollTo(0, 0);
}

function suggest() {
  const last = state.moods[state.moods.length - 1];
  if (last && last.score <= 2) return { go: "ground", title: "Come back to the room", copy: "When things feel stormy or heavy, naming five things you can see is enough for now." };
  const map = {
    talk: { go: "talk", title: "Talk for a minute", copy: "A short, unhurried check-in. No performance required." },
    breathe: { go: "breathe", title: "Four breaths", copy: "In for 4. Out for 6. Stop whenever you want." },
    write: { go: "journal", title: "Write one sentence", copy: "One honest line is a full entry." },
    tiny: { go: "tiny", title: "Pick a tiny next step", copy: "The smallest move that still counts. That’s the whole task." }
  };
  const fromBrought = { overwhelmed: "breathe", stuck: "tiny", lonely: "talk", checking: state.profile.helps || "talk" };
  const key = state.profile.helps || fromBrought[state.profile.brought] || "talk";
  return map[key] || map.talk;
}

    if (!text) return;
    state.steps = state.steps.concat([{ id: uid(), at: new Date().toISOString(), text, done: false }]);
    tinyDraft = ""; persist(); render();
  }));
  if (!state.steps.length) root.append(h("p", "fine", "No steps yet. Tiny is the point."));
  else [...state.steps].reverse().forEach((s) => {
    const lab = h("label", "step" + (s.done ? " done" : ""));
    const box = document.createElement("input");
    box.type = "checkbox"; box.checked = s.done;
    box.addEventListener("change", () => { s.done = !s.done; persist(); render(); });
    lab.append(box, h("p", "", s.text));
    root.append(lab);
  });
}

function renderHelp(root) {
  const row = h("div", "row");
  row.append(brand(), btn("ghost", "Home", () => go("home")));
  root.append(row);
  const a = h("div", "card");
  a.append(h("p", "kicker", "Please read this"), h("h2", "", "Not therapy. Not crisis care."));
  a.append(h("p", "muted", "Nest Light is a self-care companion. It is not therapy, not a diagnosis, and not a substitute for a doctor, psychologist, or emergency service. It does not treat ADHD, PTSD, depression, or any condition."));
  const b = h("div", "card");
  b.append(h("p", "kicker", "If you are in danger in Australia"));
  const nums = h("p", "muted");
  nums.append("Emergency ", Object.assign(h("a", "", "000"), { href: "tel:000" }), document.createElement("br"), "Lifeline ", Object.assign(h("a", "", "13 11 14"), { href: "tel:131114" }), " (24 hours)", document.createElement("br"), "Beyond Blue ", Object.assign(h("a", "", "1300 22 4636"), { href: "tel:1300224636" }), document.createElement("br"), "Blue Knot ", Object.assign(h("a", "", "1300 657 380"), { href: "tel:1300657380" }));
  b.append(nums);
  const c = h("div", "card");
  c.append(h("p", "kicker", "This phone only"));
  c.append(h("p", "muted", "Moods and journal stay on this phone. Amy answers out loud, in her own voice."));
  const split = h("div", "split");
  split.append(btn("linebtn", "Download my data", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "nest-light-data.json"; a.click();
  }));
  split.append(btn("linebtn", "Start over", () => {
    if (!confirm("Erase everything saved on this phone and start over?")) return;
    localStorage.removeItem(KEY);
    state = blank(); nameDraft = ""; stopVoice(); view = "onboard"; render();
  }));
  c.append(split);
  root.append(a, b, c);
}

function render() {
  const focusId = document.activeElement && document.activeElement.id;
  const caret = document.activeElement && document.activeElement.selectionStart;
  const root = document.getElementById("app");
  root.replaceChildren(h("div", "shell view"));
  const shell = root.firstChild;
  if (view === "onboard") renderOnboard(shell);
  else if (view === "home") renderHome(shell);
  else if (view === "talk") renderTalk(shell);
  else if (view === "journal") renderJournal(shell);
  else if (view === "breathe") renderBreathe(shell);
  else if (view === "ground") renderGround(shell);
  else if (view === "tiny") renderTiny(shell);
  else renderHelp(shell);
  const dock = document.getElementById("dock");
  dock.replaceChildren();
  [["home","Home","home"],["talk","Talk","talk"],["journal","Journal","journal"],["help","Help","help"]].forEach(([id, label, icon]) => {
    const on = view === id || (id === "home" && view === "onboard");
    const b = btn(on ? "on" : "", label, () => go(id === "home" && !state.profile.onboardedAt ? "onboard" : id));
    b.insertAdjacentHTML("afterbegin", ICONS[icon]);
    dock.append(b);
  });
  if (focusId) {
    const n = document.getElementById(focusId);
    if (n) { n.focus(); try { n.setSelectionRange(caret, caret); } catch { /* not a text field */ } }
  }
}

const mf = document.createElement("link");
mf.rel = "manifest";
mf.href = URL.createObjectURL(new Blob([JSON.stringify({
  name: "Nest Light", short_name: "Nest Light", start_url: "./nest-light.html", display: "standalone",
  background_color: "#07080c", theme_color: "#07080c", lang: "en-AU"
})], { type: "application/manifest+json" }));
document.head.append(mf);
if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => {};
render();
</script>
</body>
</html>
