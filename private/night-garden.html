<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#061018"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Night Garden"/>
<title>Night Garden — Understanding Complex PTSD</title>
<style>
:root{
  --night:#050b12; --deep:#0a1824;
  --glass:rgba(12,36,52,.82);
  --line:rgba(94,235,255,.5);
  --cream:#fff6ea; --mute:#c5d6d8; --dim:#86a0a3;
  --cyan:#5eebff; --aqua:#7dffd6; --violet:#c4a0ff;
  --peach:#ffb889; --gold:#ffd56a; --rose:#ffb4b0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--night);color:var(--cream)}
body{
  font-family:Georgia,"Iowan Old Style",Palatino,"Times New Roman",serif;
  font-size:19px;line-height:1.55;min-height:100dvh;
  padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom));
}
button,.btn{font-family:"Avenir Next","Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 18px 28px}
.hero{position:relative;margin:-18px -18px 12px;background:var(--night)}
.hero-photo{display:block;width:100%;height:52vh;object-fit:cover;object-position:center 28%;
  filter:saturate(1.28) contrast(1.1) brightness(1.06)}
.hero-fade{position:absolute;left:0;right:0;bottom:0;height:48px;
  background:linear-gradient(transparent, var(--night));pointer-events:none}
.hero-copy{padding:4px 0 8px;background:var(--night)}
.brand{font-family:"Avenir Next","Segoe UI",sans-serif;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--cyan)}
h1{font-size:34px;line-height:1.12;font-weight:600;margin:8px 0 8px;color:#fff8ec;text-shadow:0 0 28px rgba(255,213,106,.22)}
h2{font-size:26px;line-height:1.2;margin:0 0 12px;font-weight:600}
h3{font-size:20px;margin:0 0 8px;font-weight:600}
p{margin:0 0 14px}
.lede{color:var(--mute);font-size:18px}
.muted{color:var(--mute)}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px;
  box-shadow:0 0 0 1px rgba(196,160,255,.22),0 0 28px rgba(94,235,255,.08),0 10px 30px rgba(0,0,0,.28);backdrop-filter:blur(10px)}
.card.click{cursor:pointer}
.card.click:active{transform:scale(.99)}
.kicker{font-family:"Avenir Next","Segoe UI",sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{font-family:"Avenir Next","Segoe UI",sans-serif;font-size:12px;color:var(--aqua);border:1px solid rgba(125,255,214,.55);padding:4px 9px;border-radius:999px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;font-weight:650;font-size:16px;background:var(--gold);color:#1a1208;box-shadow:0 0 18px rgba(255,213,106,.28)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(94,235,255,.4)}
.btn.cyan{background:var(--cyan);color:#042026;box-shadow:0 0 18px rgba(94,235,255,.28)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.note{background:rgba(245,193,108,.08);border-left:3px solid var(--gold);padding:12px 14px;border-radius:12px;margin:14px 0}
.warn{background:rgba(232,180,174,.08);border-left:3px solid var(--rose);padding:12px 14px;border-radius:12px;margin:14px 0;color:#f6ddd9}
.back{background:none;border:0;color:var(--cyan);padding:0;cursor:pointer;font-size:15px;margin-bottom:10px;font-family:"Avenir Next","Segoe UI",sans-serif;text-shadow:0 0 10px rgba(94,231,255,.35)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(6,16,24,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;color:var(--dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer}
.nav button.on{color:var(--cyan)}
.nav .ico{font-size:17px;line-height:1}
.help-list a{display:block;color:var(--cream);text-decoration:none;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px}
.help-list small{display:block;color:var(--mute);margin-top:4px}
.ground-box{font-size:22px;text-align:center;padding:30px 12px}
.ground-box .step{color:var(--gold);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.petals{display:grid;gap:10px}
.petal{padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--glass);cursor:pointer;text-align:left;color:var(--cream);font:inherit}
.petal.on{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 22px rgba(94,235,255,.25)}
.tiny{font-family:"Avenir Next","Segoe UI",sans-serif;font-size:13px;color:var(--dim)}
.sale{font-family:"Avenir Next","Segoe UI",sans-serif;font-size:12px;color:var(--mute)}
</style>
</head>

const LESSONS=[
{id:"know",title:"You already know something is true",mins:"3 min",body:["Wanting to understand complex PTSD is not navel-gazing. It is one of the most useful first moves a person can make.","A name is not a life sentence. It is a map. Once you can see the shape of a thing, you stop spending quite so much energy blaming your character for what your nervous system learned to do.","This app teaches. It does not diagnose, treat, or process trauma. It will not ask you to write the story of what happened. If a page lights you up too much, close it. That is success, not failure."],today:"Curiosity about your own mind is a form of care."},
{id:"what",title:"What complex PTSD actually is",mins:"6 min",body:["The World Health Organization’s ICD-11 lists Complex post-traumatic stress disorder as its own diagnosis (code 6B41). Australia uses that manual. The American DSM-5-TR does not list C-PTSD separately. That does not make the pattern imaginary. Two books cut the cloth differently.","ICD-11 C-PTSD means the three core features of PTSD, plus three longer-standing difficulties called disturbances in self-organisation.","The PTSD triad: re-experiencing the trauma in the here-and-now, not only remembering it; avoiding reminders; and a persistent sense of current threat — jumpiness, scanning, the body still on guard.","The DSO triad: trouble regulating emotion; a deeply negative view of yourself — worthless, defeated, ashamed, guilty; and real difficulty feeling close to people or keeping connection going.","You cannot have both ICD-11 PTSD and ICD-11 C-PTSD at once. C-PTSD is PTSD plus those self-organisation difficulties. Clinicians usually see more day-to-day impairment with C-PTSD than with PTSD alone."],today:"If “just PTSD” never quite fitted, this is often why. The extra layer is the self — how you feel, how you see yourself, how you attach."},
{id:"why",title:"Why the word “complex”",mins:"5 min",note:"This lesson names kinds of harm. Skip it if today is already full.",body:["“Complex” does not mean you are more dramatic. It describes a pattern that tends to grow when threat went on for a long time, happened more than once, or came from a person or situation you could not easily leave.","ICD-11 does not require a particular kind of trauma. Still, the pattern is more common after repeated interpersonal trauma — childhood abuse or neglect, prolonged domestic violence, captivity, organised cruelty — especially when escape was hard.","Harm in adulthood counts. A long relationship that trained your nervous system to walk on glass can leave the same kind of imprint as harm that started young. There is no prize for whose story was worse.","The “complex” part is that the wound is not only fear of a memory. It is also how a person learned to feel, to judge themselves, and to be with other people."],today:"If you catch yourself ranking your pain, that ranking is often the old shame talking."},
{id:"day",title:"How it shows up in a day",mins:"6 min",body:["Official clusters are useful. Daily life is where they cost energy.","Re-experiencing can look like a full flashback. It can also look like an emotional flashback: a sudden flood of fear, shame, or smallness with no movie attached. The body has time-travelled. The kitchen has not.","Avoidance is not only staying off a street. It is changing the subject, going blank in a shop, putting off mail, keeping the house so you do not have to be among people.","A sense of current threat can be checking locks, reading a room, flinching at a tone, sleeping lightly.","Affect dysregulation: a small friction becomes a tidal wave, or the opposite — going flat, numb, unable to feel pleasure. Both are regulation problems. Neither is a personality.","Negative self-concept: “I am the problem.” Shame that arrives faster than thought.","Relationship disturbance: wanting closeness and bracing against it in the same hour. Fawning to keep the peace. Finding ordinary intimacy exhausting."],today:"The next time a small thing floors you, try: “This may be the old system, not the whole of me.”"},
{id:"adhd",title:"When C-PTSD and ADHD wear the same coat",mins:"7 min",body:["They can look almost identical from the kitchen. That is not you being confused. Adults with ADHD have substantially higher rates of PTSD than people without ADHD. They amplify each other. You can have both. Many people do.","The mirror: cannot start a simple task; mind gone mid-conversation; feelings that arrive too fast; sleep that will not settle; lost things; snapping then shame; restlessness; pleasing people until you disappear. Different engines. Same weather.","ADHD is a neurodevelopmental difference — how the brain was built. It shows up even on a quiet, reasonably safe day, especially on necessary tasks that are not interesting.","C-PTSD is an adaptation after prolonged threat. Attention is recruited for scanning danger, or it leaves the room. Executive function often collapses when you leave the window of tolerance.","A useful question that is not a diagnosis: would this still happen if I felt reasonably safe, and the task was interesting enough? If yes, ADHD is often in the room. Did something just feel like danger, criticism, being watched, or a small thing that feels huge and old? If yes, C-PTSD is often in the room. Both answers can be yes in the same hour.","They stack. Freeze and ADHD start-up failure feel identical in the body. Fawn and rejection-sensitive dysphoria can look like one thing.","ADHD in girls of earlier generations was widely missed. Trauma was often unnamed. Naming both is not self-indulgence.","One toolkit is rarely enough. A planner will not soothe an emotional flashback. Grounding will not invent working memory."],today:"When a task will not start, try two names at once: “This may be freeze, and it may also be ADHD.”"},
{id:"window",title:"The nervous system map",mins:"6 min",body:["Dan Siegel’s window of tolerance is a simple picture of a complicated body. Inside the window you can feel, think, and stay connected. Above it is hyperarousal — too much. Below it is hypoarousal — too little: fog, freeze, “I am not here.”","Trauma often narrows the window. Sleep, hunger, pain, loneliness, and anniversary seasons narrow it further. Rest, safety, kindness, and predictable days can widen it a little. Widening is slow work. That is not a moral verdict.","In Night Garden the window is the garden bed. Too open: petals blown wide. In the garden: lit from inside and still rooted. Closed: folded for the night. None of those states is a failure. They are weather."],today:"If you freeze at a simple job, that may be below the window, not laziness."},
{id:"flash",title:"Emotional flashbacks",mins:"5 min",note:"This lesson talks about flashbacks. Stop if it starts to swell.",body:["Some flashbacks have pictures. Many do not. An emotional flashback is a sudden drop into an old feeling-state — fear, shame, smallness, abandonment — while the room you are standing in has not changed.","Pete Walker named this plainly so people would stop searching for a movie that is not there. The body has time-travelled. The kitchen has not.","A useful sentence is simply: “I am having a flashback.” Naming does not end it. It locates you. Then change the channel of the body before you try to think your way out — feet on the floor, cold water, a known object, an animal in the room.","The size of the trigger is not the size of the wound."],today:"If the feeling is huge and the scene is ordinary, you may be in an emotional flashback. You are here, now."},
{id:"fourf",title:"Fight, flight, freeze, fawn",mins:"5 min",body:["The 4Fs are a lived-experience map of survival. They were once brilliant. They kept a person alive in a place that was not safe.","Fight can look like irritability or a hard edge that arrives before you have chosen it.","Flight can look like busyness, overwork, leaving a room, or shopping when the feeling starts.","Freeze can look like going still, blank, or unable to start a simple task.","Fawn can look like people-pleasing, apologising first, making yourself small so someone else stays calm. It was intelligent in an unsafe room. In a safer room it costs you.","None of these is a character flaw. They are the body doing an old job in a new room."],today:"If you agree too fast, that may be fawn, not kindness. A practice sentence: “I need to think about that.”"},
{id:"shame",title:"The inner critic and shame",mins:"5 min",note:"This lesson talks about shame. Stop if it starts to swell.",body:["In C-PTSD, shame is often not a conclusion you reached after careful thought. It is closer to an installed alarm. It goes off when closeness happens, when a mistake happens, when you take up space.","The inner critic can sound like a person who once had power over you. It can also sound like your own voice. Its job was once protection: if you attack yourself first, maybe nobody else will. That bargain is expensive now.","Shame shrinks when it is met with accurate language and with other safe people. It rarely shrinks when it is argued with at 2 a.m. by the same mind that produces it."],today:"Noticing “that is the alarm, not a verdict” is already a different relationship with the critic."},
{id:"relate",title:"Relationships and pacing",mins:"5 min",body:["One of the three DSO clusters is relationship disturbance: difficulty feeling close, staying close, or trusting that closeness will not turn.","This can look like wanting people and bracing against them in the same hour. Pulling away after a good conversation. Fawning. Choosing distance that later feels like loneliness.","You get to go slowly. You get to leave a gathering early. You get to say “I go quiet when I am full.” Safe people can bear that sentence. Unsafe people punish it — which is information.","Kindness can be taken in teaspoons. That is not coldness. That is how a threat-trained nervous system learns that warmth can be survived."],today:"Closeness is allowed to be paced. A teaspoon today is still a real sip."},
{id:"limits",title:"Limitations that are real",mins:"6 min",body:["Living your best life with C-PTSD is not the same as pretending the limits are gone. Some limits are real. Energy is finite. Trust is slower. Crowds cost more. Memory under stress is patchy. Starting is harder than people with quiet nervous systems believe.","Accommodation is not giving up. It is intelligent self-respect. A ramp is not a moral failure of the staircase.","Things that often help: external memory; one thing at a time; predictable mornings; leaving before you are empty; recovery time after social effort; letting a good-enough day count.","Grief belongs here too. There is a life that might have been easier. Mourning that is not self-pity. It is how people stop asking the past to refund them, and start spending what they actually have."],today:"Pick one accommodation you already use and thank it."},
{id:"helps",title:"What actually helps — and what this is not",mins:"6 min",body:["A teaching app can reduce shame and give you language. It cannot do the work of a skilled clinician. The evidence-aligned path is usually phase-based: first safety and stabilisation, then trauma-focused work if and when you have enough stability, then reconnection with a life that is yours.","That sequence comes from Judith Herman’s recovery frame and from treatments such as STAIR (Marylene Cloitre and colleagues). Trauma-focused CBT and EMDR are used for C-PTSD as well, often with more time on stabilisation first.","Phoenix Australia’s national guidelines cover PTSD and complex PTSD. Blue Knot Foundation is Australia’s National Centre of Excellence for Complex Trauma.","This app will not walk you through a trauma narrative. That belongs with a person who can stay with you if it goes badly.","Things that narrow the window: no sleep, isolation, substances as the only off-switch, relationships that re-enact the old pattern. Things that often help a little: meals, daylight, chosen movement, one safe person, and care that has a point — including the care of animals.","Books later, not homework: Pete Walker’s Complex PTSD: From Surviving to Thriving; Arielle Schwartz’s The Complex PTSD Workbook; Bessel van der Kolk’s The Body Keeps the Score. Put them down when they are too much."],today:"The next useful step is allowed to be small."}
];

const TRANSLATOR=[
{q:"I froze at a simple task",a:"Freeze is a survival state. The body decided “don’t move” before you chose it. When ADHD is also in the room, starting needs both a plan and a nervous system that feels safe enough to begin. Shrink the task until it is almost silly."},
{q:"I cannot start, and I do not know which one it is",a:"ADHD: the first step will not load. C-PTSD: freeze. Together: the body says danger and the brain cannot find the first inch. Treat both as true until the hour tells you otherwise."},
{q:"I said yes when I meant no",a:"That may be fawn: keeping someone else regulated so you stay safe. A practice sentence: “I need to think about that.” You do not owe an instant answer."},
{q:"A small mistake and I feel worthless",a:"Negative self-concept is one of the three DSO clusters. The jump from “I did a thing wrong” to “I am wrong” is the old wiring, not a fair court."},
{q:"I went blank in a shop or conversation",a:"Blankness can be hypoarousal or a sliver of dissociation. Get one sense back: feet on the floor, cold water, five things you can see. You do not have to finish the conversation."},
{q:"Someone was kind and I pulled away",a:"Closeness can register as danger when harm once came from people who were supposed to be safe. You can take kindness in teaspoons."},
{q:"I flooded over something tiny",a:"That may be an emotional flashback, or a narrow window on a tired day. The size of the trigger is not the size of the wound. Name it: “this is a lot.” Then change the channel of the body."},
{q:"I cannot switch the guard off",a:"A persistent sense of current threat is part of the PTSD triad. Safety is built in the present tense: locked door, known evening, one person who does not punish feeling."},
{q:"I look lazy. I am just empty",a:"Collapse after a “normal” day is a common C-PTSD tax. Empty is information. Rest is not a prize you earn after a perfect day."},
{q:"I zoned out mid-sentence",a:"ADHD: interest slipped. C-PTSD: freeze or a sliver of dissociation. You are not stupid. Ask them to say it again, or write it down."},
{q:"A small comment ruined the day",a:"ADHD: rejection-sensitive dysphoria. C-PTSD: shame as an installed alarm. They can stack. Name the stack, then change the channel of the body."},
{q:"The day got away from me again",a:"ADHD: time-blindness. C-PTSD: avoidance plus the tax of running a threat system all day. A day that holds food and one true thing is not a wasted day."},
{q:"I cannot open the envelope",a:"Avoidance plus freeze plus working-memory load. The envelope is not just paper. Open it in a safer hour, or ask someone to sit nearby for the first inch."},
{q:"I bought another thing I already own",a:"Sometimes ADHD memory. Sometimes soothing. Sometimes avoiding a room that feels like too much. No court case. Label the duplicate."},
{q:"I want the animals near and people far",a:"Animals often feel simpler to the nervous system — warmth without the old relational map. That is information, not a failing. People can still be taken in teaspoons."}
];

const LIVE=[
{t:"Energy budgeting",d:"C-PTSD already spent some spoons before breakfast. Put the real work in the best hours. Leave a margin. Cancel without a court case."},
{t:"Memory on the outside",d:"Working memory dips when the alarm is on. Write it down. One list. Reminders with the actual next verb."},
{t:"One thing at a time",d:"Split until the next action is obvious. The unit of progress is the next inch."},
{t:"Relationship pacing",d:"You get to go slowly. You get to leave early. You get to say “I go quiet when I am full.”"},
{t:"Good-enough days",d:"A day that holds food, kindness to the animals, and no self-attack is a successful day."},
{t:"The body is not the enemy",d:"Sleep, food, daylight, and gentle movement change the width of the window. They are physiology."},
{t:"Two toolkits, one life",d:"ADHD tools will not soothe a flashback. Trauma tools will not invent working memory. Use both. Shame is not a third toolkit."},
{t:"Leaving before empty",d:"Exit while you still have a little left. That is skill, not rudeness."},
{t:"Sleep is treatment-adjacent",d:"A short night narrows the window. Protect the evening as if it mattered — because it does."},
{t:"Animals nearby",d:"Warmth and a living rhythm in the room can help the body stand down. That is not a cure. It is a real form of regulation."}
];

["ICD-11","The World Health Organization’s diagnostic manual. Australia uses it. C-PTSD is listed here. DSM-5-TR does not list it separately."],
["DSO","Disturbances in self-organisation: emotion regulation, negative self-concept, and relationship difficulties."],
["Re-experiencing","The past arriving as if it is now."],
["Emotional flashback","Being dropped into old fear or shame without a clear picture of the original scene."],
["Window of tolerance","The zone where you can feel and think at once. Above it: too much. Below it: too little."],
["4Fs","Fight, flight, freeze, fawn. Fawn means appeasing to stay safe."],
["Hypervigilance","The body scanning for danger as if it is still required to."],
["Psychoeducation","Clear teaching about what is happening. Not the same as therapy."],
["Phase-based care","Safety and skills first, then trauma processing with a clinician if you have enough stability, then building a life."],
["ADHD overlap","ADHD and C-PTSD can look the same from the outside. Different engines. Often both are present."],
["RSD","Rejection-sensitive dysphoria: a fast, outsized sting after criticism. Common in ADHD. Can stack with C-PTSD shame."]
];

const GROUND=[["Five","Look around. Name five things you can see."],["Four","Name four things you can feel — clothes, chair, floor, air."],["Three","Name three things you can hear."],["Two","Name two things you can smell, or two colours near you."],["One","Name one thing you can taste, or one slow breath out."]];

function go(screen,extra){state.screen=screen;if(screen==="lesson")state.lesson=extra;if(screen==="item")state.item=extra;if(screen==="ground")state.groundStep=0;window.scrollTo(0,0);render();}
window.go=go;
window.mark=id=>{markSat(id);render();};
window.nextGround=()=>{state.groundStep=Math.min(4,state.groundStep+1);render();};
window.prevGround=()=>{state.groundStep=Math.max(0,state.groundStep-1);render();};
window.pickWindow=p=>{state.windowPick=p;render();};

function nav(){
  const items=[["home","⌂","Home"],["lessons","☰","Learn"],["translator","↔","Why"],["live","✦","Live"],["help","☎","Help"]];
  const onFor=id=>state.screen===id||(id==="lessons"&&state.screen==="lesson")||(id==="translator"&&state.screen==="whyone")||(id==="live"&&(state.screen==="liveone"||state.screen==="window"||state.screen==="glossary"));
  document.getElementById("nav").innerHTML=items.map(([id,ico,label])=>`<button class="${onFor(id)?"on":""}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join("");
}
function home(){
  const n=state.data.sat.length;
  return `<div class="hero"><img class="hero-photo" alt="Luminous night-garden flowers" src="${HERO}"/><div class="hero-fade"></div></div>
  <div class="hero-copy"><div class="brand">Night Garden</div>
    <h1>See the shape of it.<br>Live with it more kindly.</h1>
    <p class="lede">A guide to understanding complex PTSD. Short lessons. No tests. No trauma processing. Stop whenever you need to.</p>
  </div>
  <p class="sale">Buy once. Yours forever. One file. Nothing leaves the phone.</p>
  <div class="note">This is psychoeducation, not therapy and not a diagnosis. If you are in danger call <strong>000</strong>. If you need to talk, Lifeline is <strong>13 11 14</strong>.</div>
  <div class="card click" onclick="go('lessons')"><div class="kicker">Learn</div><h3>Twelve short lessons</h3><p class="muted" style="margin:0">What C-PTSD is, how it mirrors ADHD, and how to live with real limits. ${n} of 12 sat with.</p></div>
  <div class="card click" onclick="go('translator')"><div class="kicker">Today</div><h3>Why did I just…</h3><p class="muted" style="margin:0">A translator for freeze, fawn, shame, blankness, and the stack with ADHD.</p></div>
  <div class="card click" onclick="go('live')"><div class="kicker">With limits</div><h3>Living-well cards</h3><p class="muted" style="margin:0">Accommodations that are intelligent, not giving up.</p></div>
  <div class="card click" onclick="go('window')"><div class="kicker">Right now</div><h3>Window check-in</h3><p class="muted" style="margin:0">Too open, in the garden, or closed for the night.</p></div>
  <div class="actions">
    <button class="btn ghost" onclick="go('glossary')">Glossary</button>
    <button class="btn ghost" onclick="go('help')">Help in Australia</button>
    <button class="btn ghost" onclick="go('ground')">Ground</button>
    <button class="btn ghost" onclick="go('about')">About this copy</button>
  </div>`;
}
function lessons(){
  return `<button class="back" onclick="go('home')">← Home</button><h2>Lessons</h2>
    <p class="muted">One idea at a time. Harder pages have a note at the top.</p>
    ${LESSONS.map((L,i)=>`<div class="card click" onclick="go('lesson',${i})"><div class="row"><div><div class="kicker">Lesson ${i+1} · ${L.mins}</div><h3>${L.title}</h3></div><div class="pill">${sat(L.id)?"sat with":"open"}</div></div></div>`).join("")}`;
}
function lesson(){
  const L=LESSONS[state.lesson], i=state.lesson;
  return `<button class="back" onclick="go('lessons')">← Lessons</button>
    <div class="kicker">Lesson ${i+1} · ${L.mins}</div><h2>${L.title}</h2>
    ${L.note?`<div class="warn">${L.note}<div class="actions"><button class="btn ghost" onclick="go('ground')">Open grounding</button></div></div>`:""}
    ${L.body.map(p=>`<p>${p}</p>`).join("")}
    <div class="note"><div class="kicker">How this might show up today</div>${L.today}</div>
    <div class="actions">
      <button class="btn" onclick="mark('${L.id}')">${sat(L.id)?"Sat with ✓":"I’ve sat with this"}</button>
      ${i<LESSONS.length-1?`<button class="btn ghost" onclick="go('lesson',${i+1})">Next lesson</button>`:`<button class="btn ghost" onclick="go('translator')">Open the translator</button>`}
      <button class="btn ghost" onclick="go('ground')">I need to stop</button>
    </div>`;
}
function translator(){
  return `<button class="back" onclick="go('home')">← Home</button><h2>Why did I just…</h2>
    <p class="muted">Translations, not verdicts.</p>
    ${TRANSLATOR.map((t,i)=>`<div class="card click" onclick="state.screen='whyone';state.item=${i};window.scrollTo(0,0);render();"><h3>${t.q}</h3></div>`).join("")}`;
}
function whyone(){
  const t=TRANSLATOR[state.item];
  return `<button class="back" onclick="go('translator')">← Why</button><div class="kicker">Translator</div><h2>${t.q}</h2><p>${t.a}</p>
    <div class="actions"><button class="btn ghost" onclick="go('ground')">Ground</button><button class="btn ghost" onclick="go('live')">Living-well cards</button></div>`;
}
function live(){
  return `<button class="back" onclick="go('home')">← Home</button><h2>Living well with limits</h2>
    <p class="muted">Accommodation is intelligent self-respect.</p>
    ${LIVE.map((c,i)=>`<div class="card click" onclick="state.screen='liveone';state.item=${i};window.scrollTo(0,0);render();"><h3>${c.t}</h3><p class="muted" style="margin:0">${c.d}</p></div>`).join("")}`;
}
function liveone(){
  const c=LIVE[state.item];
  return `<button class="back" onclick="go('live')">← Living</button><div class="kicker">Living well</div><h2>${c.t}</h2><p>${c.d}</p>`;
}
function windowPage(){
  const picks=[["high","Too open","Above the window — racing, flooding, the guard shouting."],["in","In the garden","Inside the window — you can feel and think at once."],["low","Closed for the night","Below the window — fog, freeze, gone quiet."]];
  const note={high:"You do not have to solve anything from here. Lower the lights. One sense. Come back later.",in:"This is a good hour for a short lesson, or for one ordinary task.",low:"Fog is information. Shrink the next thing until it is almost nothing. No court case."}[state.windowPick]||"Tap the petal that is closest. There is no score.";
  return `<button class="back" onclick="go('home')">← Home</button><h2>Where is the window?</h2>
    <p class="muted">A garden check-in. No numbers. No verdict.</p>
    <div class="petals">${picks.map(([id,t,d])=>`<button class="petal ${state.windowPick===id?"on":""}" onclick="pickWindow('${id}')"><div class="kicker">${t}</div>${d}</button>`).join("")}</div>
    <div class="note">${note}</div>
    <div class="actions"><button class="btn ghost" onclick="go('ground')">Ground</button></div>`;
}
function glossary(){
  return `<button class="back" onclick="go('home')">← Home</button><h2>Glossary</h2>
    ${GLOSSARY.map(([k,v])=>`<div class="card"><h3>${k}</h3><p class="muted" style="margin:0">${v}</p></div>`).join("")}`;
}
function help(){
  return `<button class="back" onclick="go('home')">← Home</button><h2>Help in Australia</h2>
    <p class="muted">Save these before you need them.</p>
    <div class="help-list">
      <a href="tel:000"><strong>000</strong><small>Emergency — if life is in danger</small></a>
      <a href="tel:131114"><strong>Lifeline 13 11 14</strong><small>24 hours, every day</small></a>
      <a href="tel:1300224636"><strong>Beyond Blue 1300 22 4636</strong><small>24 hours, every day</small></a>
      <a href="tel:1300657380"><strong>Blue Knot 1300 657 380</strong><small>Complex trauma specialist line · 9am–5pm AEST · 7 days</small></a>
    </div>
    <p>Blue Knot Foundation is Australia’s National Centre of Excellence for Complex Trauma.</p>
    <p class="muted">Ask a GP for someone who works with complex trauma or ICD-11 C-PTSD, not only single-incident PTSD.</p>`;
}
function ground(){
  const g=GROUND[state.groundStep];
  return `<button class="back" onclick="go('home')">← Close</button><h2>Back in this room</h2>
    <p class="muted">A simple sensory count. Nothing to achieve.</p>
    <div class="card ground-box"><div class="step">${g[0]}</div><div>${g[1]}</div></div>
    <div class="actions">
      ${state.groundStep>0?`<button class="btn ghost" onclick="prevGround()">Back</button>`:""}
      ${state.groundStep<4?`<button class="btn" onclick="nextGround()">Next</button>`:`<button class="btn cyan" onclick="go('home')">I’m here</button>`}
    </div>
    <p class="muted">If this is not enough, call Lifeline 13 11 14 or 000.</p>`;
}
function about(){
  return `<button class="back" onclick="go('home')">← Home</button><h2>About this copy</h2>
    <p>Night Garden is a single-file progressive web app. Buy once. Keep it. It runs on this device. It does not need an account and it does not send your reading history anywhere.</p>
    <p>It is a teaching companion for complex PTSD — psychoeducation and living-well language. It is not therapy, not a diagnosis, and not a crisis service.</p>
    <p>Add to Home Screen from your browser if you want it to sit with your other apps. Keep a copy of this file. It is yours.</p>
    <p class="tiny">Clinical frame: ICD-11 6B41. Further reading: Phoenix Australia, Blue Knot Foundation, Cloitre / STAIR, Herman’s recovery phases, Siegel’s window of tolerance. Lived-experience language for emotional flashbacks and the 4Fs draws on Pete Walker, paraphrased.</p>
    <p class="tiny">A Numerikey app. Yours to keep.</p>`;
}
function render(){
  nav();
  const el=document.getElementById("app"), s=state.screen;
  if(s==="home") el.innerHTML=home();
  else if(s==="lessons") el.innerHTML=lessons();
  else if(s==="lesson") el.innerHTML=lesson();
  else if(s==="translator") el.innerHTML=translator();
  else if(s==="whyone") el.innerHTML=whyone();
  else if(s==="live") el.innerHTML=live();
  else if(s==="liveone") el.innerHTML=liveone();
  else if(s==="window") el.innerHTML=windowPage();
  else if(s==="glossary") el.innerHTML=glossary();
  else if(s==="help") el.innerHTML=help();
  else if(s==="ground") el.innerHTML=ground();
  else if(s==="about") el.innerHTML=about();
}
render();

</script>
</body>
</html>
