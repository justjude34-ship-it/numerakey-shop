<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="description" content="Quietshore — a private room of still water. Short sits, quiet tides, nothing to earn.">
<title>Quietshore</title>
<style>
:root{
  --bg:#08090b;--fg:#e8ece8;--card:#0d1114;--muted:#8b9590;--subtle:#5c6662;--pearl:#d7e0d9;--ink:#070809;
  --jewel:#3e6a66;--hair:#2f524f;--hair2:#4d7a74;--input:#1a2422;
  --display:"Cormorant Garamond","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;font-weight:500}
p{text-wrap:pretty}
img{display:block}
:focus-visible{outline:2px solid var(--pearl);outline-offset:3px;border-radius:4px}
::selection{background:rgba(62,106,102,.42);color:var(--pearl)}

.kicker{font-size:.6875rem;letter-spacing:.22em;text-transform:uppercase}
.muted{color:var(--muted)}.subtle{color:var(--subtle)}.pearl{color:var(--pearl)}.jewel{color:#5f9a94}
.title-deep{font-family:var(--display);font-weight:500;letter-spacing:-.03em;text-wrap:balance;
  background-image:linear-gradient(168deg,#f2f4f0 0%,#c9d6d0 32%,#7d9a93 66%,#355551 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05}
.hair{box-shadow:0 0 0 1px var(--hair);transition:box-shadow .22s cubic-bezier(.22,1,.36,1)}
.hair:hover{box-shadow:0 0 0 1px var(--hair2)}
.plate{outline:1px solid rgba(232,236,232,.1);outline-offset:-1px}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 28px;border-radius:12px;
  font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;background:var(--pearl);color:var(--ink);transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.lg{min-height:52px;padding:0 36px}
.btn.outline{background:transparent;color:var(--fg);box-shadow:0 0 0 1px var(--hair)}
.btn.outline:hover{box-shadow:0 0 0 1px var(--hair2);opacity:1}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg)}
.btn.icon{width:44px;padding:0}
.iconbtn{display:inline-flex;width:44px;height:44px;align-items:center;justify-content:center;color:rgba(215,224,217,.8)}
.iconbtn:hover{color:var(--pearl)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

/* shell */
header.top{position:fixed;inset:0 0 auto 0;z-index:40;pointer-events:none}
header.top .line{height:1px;background:rgba(47,82,79,.8)}
header.top .bar{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;padding:20px 24px}
header.top.home .bar{background:linear-gradient(to bottom,rgba(7,8,9,.55),transparent)}
header.top:not(.home) .bar{background:rgba(8,9,11,.85);backdrop-filter:blur(2px)}
.brand{display:flex;align-items:center;gap:12px}
.brand .dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--jewel)}
.brand .title-deep{font-size:1.4rem;line-height:1}
nav.deskn{display:none;gap:36px}
nav.deskn a{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);transition:color .15s}
nav.deskn a:hover{color:var(--fg)}nav.deskn a.on{color:var(--pearl)}
nav.botn{position:fixed;inset:auto 0 0 0;z-index:40;border-top:1px solid rgba(47,82,79,.7);background:rgba(8,9,11,.92);padding-bottom:env(safe-area-inset-bottom)}
nav.botn ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
nav.botn a{display:flex;min-height:56px;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
nav.botn a.on{color:var(--pearl)}
nav.botn .sd{width:6px;height:6px;border-radius:50%;border:1px solid currentColor}
.page{padding:96px 0 112px}.page.home{padding:0}
.wrap{max-width:1152px;margin:0 auto;padding:0 24px}
.wrap.narrow{max-width:768px}
@media(min-width:768px){
  header.top .bar{padding:20px 48px}.brand .title-deep{font-size:1.6rem}
  nav.deskn{display:flex}nav.botn{display:none}
  .page{padding:96px 0 64px}.wrap{padding:0 48px}
}

/* home */
.hero{position:relative;min-height:100dvh;overflow:hidden}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,8,9,.35),rgba(7,8,9,.15),rgba(7,8,9,.65))}
.hero .in{position:relative;z-index:2;max-width:1152px;margin:0 auto;display:flex;min-height:100dvh;flex-direction:column;justify-content:center;padding:96px 24px 112px}
.hero h1{font-size:clamp(3.4rem,13vw,6rem);margin-top:24px}
.hero .lede{margin-top:32px;max-width:28rem;font-size:1.05rem;line-height:1.7;color:rgba(215,224,217,.9)}
.hero .cta{margin-top:48px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
@media(min-width:768px){.hero .in{padding:96px 48px}}
.drift{animation:drift 80s ease-in-out alternate infinite;will-change:transform}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.045)}}
.rise>*{opacity:0;transform:translateY(12px);filter:blur(4px);animation:rise .5s cubic-bezier(.22,1,.36,1) forwards}
.rise>*:nth-child(1){animation-delay:40ms}.rise>*:nth-child(2){animation-delay:120ms}.rise>*:nth-child(3){animation-delay:200ms}
.rise>*:nth-child(4){animation-delay:280ms}.rise>*:nth-child(5){animation-delay:360ms}.rise>*:nth-child(6){animation-delay:440ms}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
.principles{display:grid;gap:48px;margin-top:40px}
@media(min-width:768px){.principles{grid-template-columns:repeat(3,1fr);gap:64px}}
.principles h2{font-size:1.6rem;margin-top:16px}
.principles p.c{margin-top:16px;font-size:.875rem;line-height:1.7;color:var(--muted);max-width:24rem}
hr.sep{border:0;height:1px;background:var(--hair);margin:0;opacity:.6}
section.blk{padding:96px 0}
@media(min-width:768px){section.blk{padding:128px 0}}

/* cards */
.grid2{display:grid;gap:40px}
@media(min-width:768px){.grid2{grid-template-columns:1fr 1fr;gap:64px 48px}}
.card{display:block;border-radius:28px;background:var(--card);padding:8px;text-align:left;width:100%}
.card .ph{position:relative;overflow:hidden;border-radius:20px;aspect-ratio:3/2}
.card.feat .ph{aspect-ratio:16/9}
@media(min-width:768px){.card.feat .ph{aspect-ratio:21/9}}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease-out}
.card:hover .ph img{transform:scale(1.03)}
.card .ph .g{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,8,9,.7),rgba(7,8,9,.1),transparent)}
.card .ph .k{position:absolute;left:16px;bottom:16px;color:rgba(215,224,217,.85)}
.card .tx{padding:24px 12px 12px}
.card.feat .tx{padding:32px 12px 16px}
.card h3{margin-top:8px;font-size:1.6rem;letter-spacing:-.01em}
.card.feat h3{font-size:2.2rem}
.card .bl{margin-top:12px;font-size:.875rem;line-height:1.7;color:var(--muted);max-width:36rem}
.pagehead{max-width:42rem;padding:16px 0 64px}
@media(min-width:768px){.pagehead{padding-bottom:96px}}
.pagehead h1{margin-top:20px;font-size:clamp(3rem,10vw,4.5rem)}
.pagehead .sub{margin-top:24px;max-width:28rem;font-size:1rem;line-height:1.7;color:var(--muted)}

/* tides */
.tidehead{display:flex;flex-direction:column;gap:40px}
@media(min-width:768px){.tidehead{flex-direction:row;align-items:flex-end;justify-content:space-between}}
.levelbox{width:100%;max-width:20rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--hair);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--hair);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--pearl);margin-top:-8px;border:0}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--pearl);border:0}
.playbtn{position:absolute;right:16px;bottom:16px;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--pearl);color:var(--ink)}
.playbtn.on{background:var(--jewel);color:var(--pearl)}
.meter{display:flex;height:32px;align-items:flex-end;justify-content:center;gap:4px;margin-top:20px}
.meter span{display:block;width:1px;height:100%;background:var(--pearl);transform:scaleY(.22);transform-origin:bottom;opacity:.35}
.meter.on span{animation:bar 2.6s ease-in-out infinite;opacity:.8}
@keyframes bar{0%,100%{transform:scaleY(.22)}50%{transform:scaleY(1)}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px 0;border-top:1px solid rgba(47,82,79,.7)}
.sw:first-child{border-top:0}
.sw .t{font-size:.875rem}.sw .h{margin-top:4px;font-size:.875rem;line-height:1.6;color:var(--muted)}
.sw button{min-width:64px;height:44px;padding:0 16px;border-radius:12px;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 0 0 1px var(--hair)}
.sw button:hover{box-shadow:0 0 0 1px var(--hair2)}

/* ledger */
.empty{border-radius:28px;background:var(--card);padding:64px 32px}
.empty .big{font-family:var(--display);font-size:1.9rem}
.entry{padding:32px 0;border-top:1px solid rgba(47,82,79,.5)}
.entry:first-child{border-top:0}
.entry .r{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.entry h2{font-size:1.6rem}
.entry .d{font-family:var(--display);font-size:1.15rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* session */
.sess{position:relative;min-height:100dvh;overflow:hidden;background:var(--bg)}
.sess>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sess .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,8,9,.55),rgba(7,8,9,.35),rgba(7,8,9,.88))}
.sess .col{position:relative;z-index:2;display:flex;min-height:100dvh;flex-direction:column}
.sess .topbar,.sess .botbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px}
.sess .botbar{padding:32px 20px}
.sess .mid{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:0 24px}
@media(min-width:768px){.sess .topbar,.sess .botbar{padding-left:40px;padding-right:40px}}
.intro{max-width:28rem;text-align:center}
.intro h1{margin-top:20px;font-size:clamp(3rem,12vw,4.5rem)}
.intro .b{margin-top:24px;font-size:.875rem;line-height:1.7;color:rgba(215,224,217,.75)}
.ringbox{position:relative;display:grid;place-items:center;width:224px;height:224px}
@media(min-width:768px){.ringbox{width:256px;height:256px}}
.ringbox svg.arc{position:absolute;inset:0;transform:rotate(-90deg)}
.ringbox .wash{position:absolute;inset:28px;border-radius:50%;background:rgba(215,224,217,.8);transform:scale(.4);opacity:.14}
.ringbox .ring{position:absolute;inset:8px;border-radius:50%;box-shadow:0 0 0 1px var(--hair2);transform:scale(.78);opacity:.55}
.ringbox .ctr{position:relative;text-align:center}
.ringbox .clock{font-family:var(--display);font-size:2.4rem;font-weight:500;color:var(--pearl);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ringbox .ph{margin-top:12px;color:var(--pearl)}
.ringbox .ct{margin-top:8px;font-family:var(--display);font-size:1.9rem;color:var(--pearl);font-variant-numeric:tabular-nums}
.capt{margin-top:40px;max-width:24rem;text-align:center;font-size:1rem;line-height:1.7;color:var(--pearl)}
.guide{margin-top:20px;max-width:24rem;text-align:center;font-size:.875rem;line-height:1.7;color:rgba(215,224,217,.7)}
.done{position:relative;z-index:2;max-width:32rem;margin:0 auto;display:flex;min-height:100dvh;flex-direction:column;justify-content:center;padding:96px 24px 64px}
.done h1{margin-top:16px;font-size:clamp(3rem,11vw,4rem)}
.wash-close{position:absolute;inset:0;background:rgba(215,224,217,.2);pointer-events:none;animation:cw 5s ease-out forwards;opacity:0}
@keyframes cw{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
label.l{display:block;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
textarea{width:100%;min-height:96px;margin-top:12px;border-radius:12px;border:0;background:rgba(26,36,34,.8);color:var(--fg);padding:14px 16px;font:inherit;font-size:.9rem;box-shadow:0 0 0 1px var(--hair);resize:vertical}
textarea::placeholder{color:var(--subtle)}
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(7,8,9,.7);padding:24px}
.modal .box{width:100%;max-width:26rem;border-radius:24px;background:var(--card);padding:32px;box-shadow:0 0 0 1px var(--hair)}
.modal h2{font-size:1.8rem}
.modal p{margin-top:12px;font-size:.875rem;color:var(--muted);line-height:1.7}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fine{margin-top:48px;font-size:.78rem;color:var(--subtle);line-height:1.7;max-width:28rem}
@media(prefers-reduced-motion:reduce){.drift,.rise>*,.meter.on span,.wash-close{animation:none}.rise>*{opacity:1;transform:none;filter:none}}
</style>
</head>

/* ---------- breath envelope ---------- */
var SMIN=.78,SSPAN=.22;
function cosine(t){var x=Math.min(1,Math.max(0,t));return .5-.5*Math.cos(Math.PI*x)}
function env(phase,scale,swell,rem,len){return{phase:phase,scale:scale,swell:swell,rem:rem,len:len}}
function breathEnvelope(el,b){
  var cycle=b.inhale+b.hold+b.exhale+b.rest;
  if(cycle<=0)return env("Rest",SMIN,0,0,0);
  var c=((el%cycle)+cycle)%cycle;
  if(b.inhale>0&&c<b.inhale){var u=cosine(c/b.inhale);return env("Inhale",SMIN+SSPAN*u,u,b.inhale-c,b.inhale)}
  c-=b.inhale;
  if(b.hold>0&&c<b.hold)return env("Hold",SMIN+SSPAN,1,b.hold-c,b.hold);
  if(b.hold>0)c-=b.hold;
  if(b.exhale>0&&c<b.exhale){var v=cosine(c/b.exhale);return env("Exhale",SMIN+SSPAN*(1-v),1-v,b.exhale-c,b.exhale)}
  c-=b.exhale;
  return env("Rest",SMIN,0,Math.max(0,b.rest-c),b.rest);
}

  }
  function tick(){

    els.wash.style.transform="scale("+(.4+v.swell*.52)+")";els.wash.style.opacity=String(.1+v.swell*.2);
    var remain=v.len<=0?0:v.rem/v.len;els.arc.style.strokeDashoffset=String(ARC_C*(1-remain));
    setSwell(v.swell);
    if(v.phase!==lastPhase){lastPhase=v.phase;
      if(v.phase==="Inhale")waveIn();if(v.phase==="Exhale")waveOut();
      if(S.haptics)hapticPhase(v.phase);

      '<div class="row"><button class="btn" id="lv">Leave</button><button class="btn outline" id="st">Stay</button></div></div>';
    document.body.appendChild(m);

    else{halt();location.hash="#/gallery"}

  function halt(){cancelAnimationFrame(raf);window.clearInterval(guideTimer);hapticSilence();stopTide();releaseWake()}
  function finish(completed,dur){
    halt();status="done";
    if(completed){if(!S.tideMuted)playChime();if(S.haptics)vib([50,80,50,80,100]);chimed=!S.tideMuted}
    entryId=addEntry({sitId:sit.id,title:sit.title,startedAt:Date.now()-dur*1000,durationSec:Math.round(dur),note:"",completed:completed});
    drawDone();
  }
  function drawDone(){
    app.innerHTML='<div class="sess"><img class="bg plate" src="'+IMG[sit.image]+'" alt=""><div class="shade" style="background:linear-gradient(to bottom,rgba(7,8,9,.5),rgba(7,8,9,.7),rgba(7,8,9,.92))"></div>'+
      '<div class="wash-close"></div><div class="done"><p class="kicker muted">Closed</p><h1 class="title-deep">The water holds.</h1>'+
      '<p class="muted" style="margin-top:20px;font-size:.875rem">'+minutes(Math.max(1,Math.round(elapsed/60)))+' · '+esc(sit.title)+'</p>'+
      (S.captions?'<p style="margin-top:16px;font-size:.875rem;color:rgba(215,224,217,.8)">'+(chimed?"A low chime sounded. The sit is closed.":"The sit is closed.")+'</p>':'')+
      '<div style="margin-top:40px"><label class="l" for="note">A line for the ledger</label><textarea id="note" maxlength="160" placeholder="Optional. One sentence is enough."></textarea></div>'+
      '<div class="row"><button class="btn" id="sv">Save</button><a class="btn outline" href="#/gallery">Gallery</a></div></div></div>';
    document.getElementById("sv").onclick=function(){
      var v=document.getElementById("note").value.trim();if(entryId&&v)updateNote(entryId,v);location.hash="#/ledger"};
  }
  drawIdle();
  cleanup=function(){halt()};
}

/* ---------- router ---------- */
function route(){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  var h=(location.hash||"#/").slice(1);
  var m=h.match(/^\/sit\/([^/]+)$/);
  if(m)viewSit(decodeURIComponent(m[1]));
  else if(h==="/gallery")viewGallery();
  else if(h==="/tides")viewTides();
  else if(h==="/ledger")viewLedger();
  else viewHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
})();
</script>
</body>
