<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teint</title>
<meta name="description" content="Find the colours that love you back. Twelve-season analysis, a five-swatch studio, contrast checks, and CSS export. Private to this device.">
<meta name="theme-color" content="#3d4a42">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23f3efe6%22%2F%3E%3Crect%20x%3D%224%22%20y%3D%226%22%20width%3D%225%22%20height%3D%2220%22%20rx%3D%221%22%20fill%3D%22%23E07A5F%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%226%22%20width%3D%225%22%20height%3D%2220%22%20rx%3D%221%22%20fill%3D%22%233d4a42%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%226%22%20width%3D%225%22%20height%3D%2220%22%20rx%3D%221%22%20fill%3D%22%23C4A035%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%226%22%20width%3D%225%22%20height%3D%2220%22%20rx%3D%221%22%20fill%3D%22%231A3A7A%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap">
<style>
:root {
  --bg: #f3efe6;
  --elev: #faf7f1;
  --subtle: #ebe4d6;
  --fg: #1c1916;
  --muted: #6b6560;
  --faint: #8a847c;
  --primary: #3d4a42;
  --on-primary: #faf7f1;
  --line: #ddd4c6;
  --ink: #1c1916;
  --paper: #faf7f1;
  --serif: "Cormorant Garamond", Palatino, "Palatino Linotype", Georgia, serif;
  --sans: Outfit, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --shadow: 0 0 0 1px rgba(28, 25, 22, 0.06), 0 1px 2px rgba(28, 25, 22, 0.05),
    0 2px 4px rgba(28, 25, 22, 0.04);
  --shadow-h: 0 0 0 1px rgba(28, 25, 22, 0.1), 0 10px 24px -12px rgba(28, 25, 22, 0.18);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --pad: 16px;
  --max: 1120px;
}

* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  font-weight: 400;
}
button, a { -webkit-tap-highlight-color: transparent; }
button:not(:disabled), [role="button"]:not(:disabled) { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
h1, h2, h3 {
  font-family: var(--serif);
  font-weight: 500;
  letter-spacing: -0.02em;
  text-wrap: balance;
  margin: 0;
}
p { text-wrap: pretty; margin: 0; }
img, svg { display: block; max-width: 100%; }

.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
}
.bar {
  max-width: var(--max);
  margin: 0 auto;
  padding: 0 var(--pad);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.logo {
  font-family: var(--serif);
  font-size: 28px;
  line-height: 1;
  color: var(--fg);
  text-decoration: none;
}
.nav { display: flex; align-items: center; gap: 2px; }
.nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  padding: 10px 10px;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  border-radius: 10px;
}
.nav a[aria-current="page"], .nav a:hover { color: var(--fg); background: var(--subtle); }

.ribbon {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px 12px;
  padding: 8px var(--pad);
  background: var(--primary);
  color: var(--on-primary);
  font-size: 13px;
  line-height: 1.4;
}
.ribbon p { color: var(--on-primary); }
.ribbon .row { display: flex; flex-wrap: wrap; gap: 8px; }
.ribbon button {
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--on-primary) 40%, transparent);
  background: transparent;
  color: var(--on-primary);
  font: 500 13px/1 var(--sans);
}
.ribbon button:hover { background: color-mix(in srgb, var(--on-primary) 12%, transparent); }

.wrap {
  max-width: var(--max);
  margin: 0 auto;
  padding: 28px var(--pad) 48px;
}
.hero {
  display: grid;
  gap: 28px;
  align-items: center;
}
.kicker {
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
h1.display {
  margin-top: 10px;
  font-size: 44px;
  line-height: 0.95;
}
.lede {
  margin-top: 14px;
  max-width: 38rem;
  color: var(--muted);
}
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 12px;
  border: 0;
  background: var(--primary);
  color: var(--on-primary);
  font: 500 15px/1 var(--sans);
  text-decoration: none;
}
.btn.secondary { background: var(--subtle); color: var(--fg); }
.btn.ghost { background: transparent; color: var(--fg); }
.btn:hover { box-shadow: var(--shadow-h); }
.btn:disabled { opacity: 0.45; box-shadow: none; }
.fine { margin-top: 14px; font-size: 14px; color: var(--faint); }
.fine a, .text-link {
  color: var(--fg);
  text-underline-offset: 3px;
}

.panel {
  background: var(--elev);
  box-shadow: var(--shadow);
  border-radius: 18px;
  overflow: hidden;
}
.panel figcaption {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px 14px;
  font-size: 14px;
}
.panel figcaption span:last-child { color: var(--muted); }
.chips { display: flex; gap: 6px; padding: 0 14px 14px; }
.chips i {
  flex: 1;
  height: 10px;
  border-radius: 999px;
  display: block;
}

.band {
  margin-top: 36px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 22px;
  padding: 22px 0;
}
.band h2 { font-size: 28px; }
.num {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--faint);
}
.band p, .muted { color: var(--muted); }
.section { margin-top: 36px; }
.section h2 { font-size: 34px; }
.sub { margin-top: 6px; color: var(--muted); max-width: 36rem; }
.headrow {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}

.families, .season-grid, .notes, .split {
  display: grid;
  gap: 12px;
  margin-top: 16px;
}
.card {
  background: var(--elev);
  box-shadow: var(--shadow);
  border-radius: 16px;
  padding: 16px;
  color: inherit;
  text-decoration: none;
  display: block;
}
a.card:hover, button.card:hover { box-shadow: var(--shadow-h); }
.strip { display: flex; gap: 4px; }
.strip b {
  flex: 1;
  height: 28px;
  border-radius: 4px;
  display: block;
}
.strip b:first-child { border-radius: 8px 4px 4px 8px; }
.strip b:last-child { border-radius: 4px 8px 8px 4px; }
.card h3 { margin-top: 12px; font-size: 26px; }
.card p { margin-top: 4px; color: var(--muted); font-size: 14px; }
.meta {
  margin-top: 8px;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--faint);
}

.keys { margin-top: 16px; display: grid; gap: 8px; }
.keys li { display: flex; align-items: center; gap: 10px; font-size: 14px; list-style: none; }
kbd {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--subtle);
  border-radius: 6px;
  padding: 4px 7px;
  min-width: 28px;
  text-align: center;
}

.progress {
  height: 4px;
  background: var(--subtle);
  border-radius: 999px;
  margin-top: 10px;
  overflow: hidden;
}
.progress span {
  display: block;
  height: 100%;
  background: var(--primary);
  transition: width 220ms var(--ease);
}
.quiz-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.prompt { margin-top: 18px; font-size: 34px; line-height: 1.05; max-width: 40rem; }
.note { margin-top: 10px; color: var(--muted); font-size: 14px; max-width: 40rem; }
.options { margin-top: 22px; display: grid; gap: 10px; }
.options.many { grid-template-columns: 1fr 1fr; }
.opt {
  text-align: left;
  background: var(--elev);
  box-shadow: var(--shadow);
  border: 0;
  border-radius: 14px;
  padding: 14px;
  min-height: 72px;
  color: var(--fg);
  font: inherit;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}
.opt.on { box-shadow: var(--shadow-h); outline: 2px solid color-mix(in srgb, var(--primary) 55%, transparent); }
.opt:hover { box-shadow: var(--shadow-h); }
.dot {
  width: 28px;
  height: 28px;
  border-radius: 999px;
  box-shadow: var(--shadow);
}
.opt strong { font-weight: 500; font-size: 15px; }
.opt em { font-style: normal; color: var(--muted); font-size: 13px; }
.quiz-nav {
  margin-top: 28px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.studio-top, .studio-grid { display: grid; gap: 22px; }
.eyebrow {
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.studio-top h1 { font-size: 44px; line-height: 1; margin-top: 6px; }
.summary { margin-top: 12px; color: var(--muted); max-width: 40rem; }
.also { margin-top: 10px; font-size: 14px; color: var(--faint); }
.also button {
  border: 0;
  background: none;
  color: var(--fg);
  font: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: 4px 0;
  min-height: 44px;
}
.toolrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.swatches { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swatch {
  background: var(--elev);
  box-shadow: var(--shadow);
  border-radius: 14px;
  overflow: hidden;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.swatch.on { box-shadow: var(--shadow-h); outline: 2px solid color-mix(in srgb, var(--primary) 40%, transparent); }
.swatch.wide { grid-column: span 2; }
.chip {
  position: relative;
  height: 92px;
  width: 100%;
  border: 0;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.chip .idx { position: absolute; left: 10px; top: 8px; opacity: 0.75; }
.chip .flash {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
}
.body { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sname {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.sname p { font-size: 14px; font-weight: 500; }
.lock {
  width: 44px;
  height: 44px;
  flex: none;
  border: 0;
  border-radius: 10px;
  background: var(--subtle);
  color: var(--muted);
  display: grid;
  place-items: center;
}
.lock.on { background: var(--primary); color: var(--on-primary); }
.codes { display: grid; gap: 4px; }
.codes button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--fg);
  font-family: var(--mono);
  font-size: 11px;
  text-align: left;
  padding: 4px 0;
  min-height: 36px;
  overflow-wrap: anywhere;
}
.codes button span { color: var(--faint); font-size: 10px; letter-spacing: 0.08em; }
.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.contrast div {
  background: var(--subtle);
  border-radius: 8px;
  padding: 6px;
  display: flex;
  gap: 6px;
  align-items: center;
  min-width: 0;
}
.contrast i {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  font-family: var(--serif);
  font-size: 13px;
  font-style: normal;
  flex: none;
}
.contrast small { display: block; color: var(--faint); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
.contrast b { font-family: var(--mono); font-size: 11px; font-weight: 500; }

.notes { margin-top: 22px; }
.notes article, .split article {
  background: var(--elev);
  box-shadow: var(--shadow);
  border-radius: 16px;
  padding: 16px;
}
.notes h2, .split h2 { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); font-family: var(--sans); font-weight: 500; }
.notes p, .split li { margin-top: 8px; font-size: 14px; }
.split { margin-top: 16px; }
.split h2.serif { font-family: var(--serif); font-size: 28px; letter-spacing: -0.02em; text-transform: none; color: var(--fg); }
.split ul { margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.split li { color: var(--muted); list-style: none; }
.back { color: var(--muted); text-decoration: none; font-size: 14px; display: inline-flex; min-height: 44px; align-items: center; }
.back:hover { color: var(--fg); }

.family-block { margin-top: 28px; }
.family-block h2 { font-size: 32px; }

.empty { max-width: 32rem; margin: 24px auto; text-align: center; }
.empty h1 { font-size: 40px; }
.empty p { margin-top: 10px; color: var(--muted); }
.empty .actions { justify-content: center; }

.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  align-items: end;
  padding: 16px;
  background: color-mix(in srgb, var(--fg) 35%, transparent);
}
.sheet {
  background: var(--elev);
  border-radius: 18px;
  box-shadow: var(--shadow-h);
  padding: 18px;
  width: min(520px, 100%);
  margin: 0 auto;
  max-height: min(80vh, 640px);
  overflow: auto;
}
.sheet h2 { font-size: 30px; }
pre.css {
  margin-top: 12px;
  background: var(--subtle);
  border-radius: 12px;
  padding: 12px;
  overflow: auto;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.55;
  max-height: 280px;
}
.sheet dl { margin: 12px 0 0; }
.sheet .shortcut {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.sheet .shortcut:last-child { border-bottom: 0; }
.sheet .shortcut dd { margin: 0; color: var(--muted); }

.tour {
  position: fixed;
  z-index: 40;
  left: 12px;
  right: 12px;
  bottom: 12px;
  margin: 0 auto;
  width: min(440px, calc(100% - 24px));
  background: var(--elev);
  box-shadow: var(--shadow-h);
  border-radius: 16px;
  padding: 14px 16px 12px;
}
.tour .kicker { color: var(--primary); }
.tour h2 { font-size: 26px; margin-top: 4px; }
.tour p { margin-top: 6px; color: var(--muted); font-size: 14px; }
.tour .actions { margin-top: 12px; }

.toast {
  position: fixed;
  z-index: 60;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--elev);
  border-radius: 999px;
  padding: 10px 14px;
  font-size: 14px;
  box-shadow: var(--shadow-h);
}
.foot {
  border-top: 1px solid var(--line);
  padding: 22px var(--pad) 28px;
  color: var(--faint);
  font-size: 12px;
}
.foot div {
  max-width: var(--max);
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 16px;
  justify-content: space-between;
}
.lip {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 999px;
  margin-right: 6px;
  vertical-align: -1px;
  box-shadow: var(--shadow);
}

@media (min-width: 720px) {
  :root { --pad: 24px; }
  .bar { height: 64px; }
  h1.display { font-size: 60px; }
  .band { grid-template-columns: repeat(3, 1fr); gap: 28px; padding: 28px 0; }
  .families { grid-template-columns: repeat(2, 1fr); }
  .options.many { grid-template-columns: repeat(4, 1fr); }
  .options.few { grid-template-columns: repeat(3, 1fr); }
  .swatches { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .swatch.wide { grid-column: auto; }
  .notes, .split { grid-template-columns: 1fr 1fr 1fr; }
  .split { grid-template-columns: 1fr 1fr; }
  .modal { align-items: center; }
  .prompt { font-size: 40px; }
}
@media (min-width: 960px) {
  .hero { grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: 40px; }
  .hero .panel { max-width: 460px; justify-self: end; width: 100%; }
  .families { grid-template-columns: repeat(4, 1fr); }
  .season-grid { grid-template-columns: repeat(3, 1fr); }
  .studio-top { grid-template-columns: minmax(0, 1.1fr) auto; align-items: end; }
  .studio-grid { grid-template-columns: minmax(0, 0.78fr) minmax(0, 1.22fr); align-items: start; }
  .toolrow { justify-content: flex-end; }
  .swatches { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .chip { height: 112px; }
}
@media (max-width: 719px) {
  .nav a { padding: 10px 8px; font-size: 13px; }
  .logo { font-size: 26px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

</style>
</head>

  const state = {
    answers: {},
    seasonId: null,
    also: [],
    coloring: { skin: "#E0B394", hair: "#5A3A1E", eyes: "#4A5C3A" },
    swatches: [],
    lookIndex: 0,

  let lastSeason = null;
  let lastView = "";
  let toastTimer = 0;
  let flashTimer = 0;

  function byId(id) {
    return SEASONS.find((s) => s.id === id);
  }
  function esc(s) {
    return String(s ?? "").replace(/[&<>"]/g, (c) => {
      const map = { "&": "amp", "<": "lt", ">": "gt", '"': "quot" };
      return "&" + map[c] + ";";
    });
  }
  function norm(hex) {
    let h = String(hex || "").trim().replace(/^#/, "").toUpperCase();
    if (h.length === 3) h = h.split("").map((c) => c + c).join("");
    if (!/^[0-9A-F]{6}$/.test(h)) return "#000000";
    return "#" + h;
  }
  function rgb(hex) {
    const h = norm(hex).slice(1);
    return {
      r: parseInt(h.slice(0, 2), 16),
      g: parseInt(h.slice(2, 4), 16),
      b: parseInt(h.slice(4, 6), 16),
    };
  }
  function hsl(hex) {
    const { r, g, b } = rgb(hex);
    const R = r / 255, G = g / 255, B = b / 255;
    const max = Math.max(R, G, B), min = Math.min(R, G, B);
    const d = max - min;
    let h = 0;
    const l = (max + min) / 2;
    const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
    if (d !== 0) {
      if (max === R) h = ((G - B) / d) % 6;
      else if (max === G) h = (B - R) / d + 2;
      else h = (R - G) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
  }
  function fmtRgb(hex) {
    const c = rgb(hex);
    return "rgb(" + c.r + ", " + c.g + ", " + c.b + ")";
  }
  function fmtHsl(hex) {
    const c = hsl(hex);
    return "hsl(" + c.h + ", " + c.s + "%, " + c.l + "%)";
  }
  function lum(hex) {
    const { r, g, b } = rgb(hex);
    const lin = (c) => {
      const s = c / 255;
      return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
    };
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }
  function contrast(a, b) {
    const l1 = lum(a), l2 = lum(b);
    const hi = Math.max(l1, l2), lo = Math.min(l1, l2);
    return (hi + 0.05) / (lo + 0.05);
  }
  function wcag(ratio) {
    if (ratio >= 7) return "AAA";
    if (ratio >= 4.5) return "AA";
    return "fail";
  }
  function inkOn(bg) {
    return contrast(bg, "#111111") >= contrast(bg, "#FFFFFF") ? "#111111" : "#FFFFFF";
  }
  function cssVars(swatches) {
    const lines = swatches.map((sw, i) => {
      const n = i + 1;
      const c = rgb(sw.hex);
      const h = hsl(sw.hex);
      return (
        "  --teint-" + n + ": " + norm(sw.hex) + ";\n" +
        "  --teint-" + n + "-rgb: " + c.r + " " + c.g + " " + c.b + ";\n" +
        "  --teint-" + n + "-hsl: " + h.h + " " + h.s + "% " + h.l + "%;"
      );
    });
    return ":root {\n" + lines.join("\n") + "\n}\n";
  }
  function nameFor(season, hex) {
    const found = season.bank.find((c) => c.hex.toLowerCase() === hex.toLowerCase());
    return found ? found.name : norm(hex);
  }
  function fromLook(season, index) {
    const look = season.looks[index] || season.signature;
    return look.map((hex) => ({ hex, locked: false, name: nameFor(season, hex) }));
  }
  function score(answers) {
    let temp = 0, value = 0, chroma = 0, tw = 0, vw = 0, cw = 0;
    QUIZ.forEach((step) => {
      const id = answers[step.id];
      if (!id) return;
      const opt = step.options.find((o) => o.id === id);
      if (!opt) return;
      const w = WEIGHTS[step.id] || 1;
      temp += opt.temp * w;
      value += opt.value * w;
      chroma += opt.chroma * w;
      tw += w; vw += w; cw += w;
    });
    const clamp = (n) => Math.max(-1, Math.min(1, n));
    return {
      temp: clamp(tw ? temp / tw : 0),
      value: clamp(vw ? value / vw : 0),
      chroma: clamp(cw ? chroma / cw : 0),
    };
  }
  function nearest(v) {
    let best = "true-autumn", bestD = Infinity;
    Object.keys(VECTORS).forEach((id) => {
      const p = VECTORS[id];
      const d = (v.temp - p.temp) ** 2 + (v.value - p.value) ** 2 + (v.chroma - p.chroma) ** 2;
      if (d < bestD) { bestD = d; best = id; }
    });
    return best;
  }
  function runners(v) {
    return Object.keys(VECTORS)
      .map((id) => {
        const p = VECTORS[id];
        return {
          id,
          d: (v.temp - p.temp) ** 2 + (v.value - p.value) ** 2 + (v.chroma - p.chroma) ** 2,
        };
      })
      .sort((a, b) => a.d - b.d)
      .slice(1, 3)
      .map((s) => s.id);
  }
  function coloringFrom(answers) {
    return {
      skin: SKIN[answers.skin] || "#E0B394",
      hair: HAIR[answers.hair] || "#5A3A1E",
      eyes: EYES[answers.eyes] || "#4A5C3A",
    };
  }
  function shuffleArr(items) {
    const next = items.slice();
    for (let i = next.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const a = next[i];
      next[i] = next[j];
      next[j] = a;
    }
    return next;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        answers: state.answers,
        seasonId: state.seasonId,
        also: state.also,
        coloring: state.coloring,
        swatches: state.swatches,
        lookIndex: state.lookIndex,
        focused: state.focused,
        analyzedAt: state.analyzedAt,
        step: state.step,
        demo: state.demo,
      }));
    } catch (e) { /* private mode */ }
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || typeof data !== "object") return;
      Object.assign(state, data);
    } catch (e) { /* ignore */ }
  }
  function setQuery(on) {
    const url = new URL(location.href);
    if (on) url.searchParams.set("demo", "1");
    else url.searchParams.delete("demo");
    history.replaceState(null, "", url.pathname + url.search + url.hash);
  }
  function parseRoute() {
    const h = (location.hash || "#/").replace(/^#/, "");
    const path = h.charAt(0) === "/" ? h : "/" + h;
    const parts = path.split("/").filter(Boolean);
    if (parts[0] === "analyse") return { view: "analyse" };
    if (parts[0] === "seasons") return { view: "seasons" };
    if (parts[0] === "studio") return { view: "studio" };
    if (parts[0] === "s" && parts[1]) return { view: "season", id: decodeURIComponent(parts[1]) };
    return { view: "home" };
  }
  function go(hash) {
    if (location.hash === hash) render();

  function toast(msg) {

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const el = document.createElement("textarea");
        el.value = text;
        el.setAttribute("readonly", "");
        el.style.position = "fixed";
        el.style.left = "-9999px";
        document.body.appendChild(el);
        el.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(el);
        return ok;
      } catch (err) {
        return false;
      }
    }
  }
  function flash(i, label) {

  function applySample() {
    const vector = score(SAMPLE);
    const id = nearest(vector);
    const season = byId(id);
    state.answers = Object.assign({}, SAMPLE);
    state.seasonId = id;
    state.also = runners(vector);
    state.coloring = coloringFrom(SAMPLE);
    state.lookIndex = 0;
    state.focused = 0;
    state.swatches = fromLook(season, 0);
    state.analyzedAt = Date.now();
    state.step = 0;
    state.demo = true;
  }
  function openSeason(id) {
    const season = byId(id);
    if (!season) return;
    const keep = Boolean(state.analyzedAt);
    state.seasonId = id;
    state.lookIndex = 0;
    state.focused = 0;
    state.swatches = fromLook(season, 0);
    if (!keep) {
      state.coloring = {
        skin: season.defaultSkin,
        hair: season.defaultHair,
        eyes: season.defaultEyes,
      };
    }
    save();
  }
  function shuffle() {
    const season = byId(state.seasonId);
    if (!season || !state.swatches.length) return;
    const anyLocked = state.swatches.some((s) => s.locked);
    if (!anyLocked) {
      const next = (state.lookIndex + 1) % season.looks.length;
      state.lookIndex = next;
      state.swatches = fromLook(season, next);
    } else {
      const locked = {};
      state.swatches.forEach((s) => { if (s.locked) locked[s.hex.toLowerCase()] = true; });
      const pool = shuffleArr(season.bank.filter((c) => !locked[c.hex.toLowerCase()]));
      let i = 0;
      state.swatches = state.swatches.map((s) => {
        if (s.locked) return s;
        const n = pool[i++];
        if (!n) return s;
        return { hex: n.hex, locked: false, name: n.name };
      });
    }
    save();
    render();
  }
  function finish() {
    const vector = score(state.answers);
    const id = nearest(vector);
    const season = byId(id);
    state.seasonId = id;
    state.also = runners(vector);
    state.coloring = coloringFrom(state.answers);
    state.lookIndex = 0;
    state.focused = 0;
    state.swatches = fromLook(season, 0);
    state.analyzedAt = Date.now();

    state.tour = null;

  function analyseHTML() {

      ? '<p class="note">Shop demo. The sample used gold, a golden tan, green veins, medium skin, golden-brown hair, hazel eyes, and medium contrast. <button class="text-link" type="button" data-act="studio-sample" style="border:0;background:none;padding:0;font:inherit;text-decoration:underline;min-height:44px">Skip to that result</button></p>'

  function seasonsHTML() {
    const blocks = FAMILY_ORDER.map((family) => {
      const meta = FAMILIES[family];
      const kids = SEASONS.filter((s) => s.family === family).map((s) => {
        return '<a class="card" href="#/s/' + esc(s.id) + '">' + strip(s.signature) + "<h3>" + esc(s.name) + "</h3><p>" + esc(s.tagline) + '</p><p class="meta">' + esc(s.temperature) + " · " + esc(s.value) + " · " + esc(s.chroma) + "</p></a>";
      }).join("");
      return '<section class="family-block"><h2>' + esc(meta.name) + '</h2><p class="sub">' + esc(meta.line) + '</p><div class="season-grid">' + kids + "</div></section>";
    }).join("");
    return (
      '<div class="wrap"><p class="kicker">Guide</p><h1 class="display" style="font-size:44px">The twelve seasons</h1>' +
      '<p class="lede">Each season is a temperature, a depth, and a clarity. Open one to drape it and shuffle looks in the studio.</p>' +
      blocks + "</div>"
    );
  }

  function swatchCard(sw, i) {
    const text = inkOn(sw.hex);
    const vsInk = contrast(sw.hex, INK);
    const vsPaper = contrast(sw.hex, PAPER);
    const flashLabel = state.flash && state.flash.i === i ? state.flash.label : "";
    const wide = i === 4 ? " wide" : "";
    const on = state.focused === i ? " on" : "";
    function chip(label, sample, ratio) {
      const level = wcag(ratio);
      return '<div><i style="background:' + esc(sw.hex) + ";color:" + esc(sample) + '">A</i><div><small>' + label + "</small><b>" + ratio.toFixed(1) + " " + (level === "fail" ? "fail" : level) + "</b></div></div>";
    }
    return (
      '<article class="swatch' + wide + on + '" data-act="focus" data-i="' + i + '">' +
      '<button type="button" class="chip" style="background:' + esc(sw.hex) + ";color:" + text + '" data-act="copy" data-i="' + i + '" data-value="' + esc(norm(sw.hex)) + '" data-label="HEX" aria-label="Copy HEX ' + esc(sw.hex) + '">' +
      '<span class="idx">' + (i + 1) + '</span><span class="flash">' + (flashLabel ? "Copied " + esc(flashLabel) : "") + "</span></button>" +
      '<div class="body"><div class="sname"><p>' + esc(sw.name) + '</p>' +
      '<button type="button" class="lock' + (sw.locked ? " on" : "") + '" data-act="lock" data-i="' + i + '" aria-pressed="' + (sw.locked ? "true" : "false") + '" aria-label="' + (sw.locked ? "Unlock colour" : "Lock colour") + '">' +
      icon(sw.locked ? "lock" : "unlock") + "</button></div>" +
      '<div class="codes">' +
      '<button type="button" data-act="copy" data-i="' + i + '" data-value="' + esc(norm(sw.hex)) + '" data-label="HEX"><span>HEX</span>' + esc(norm(sw.hex)) + "</button>" +
      '<button type="button" data-act="copy" data-i="' + i + '" data-value="' + esc(fmtRgb(sw.hex)) + '" data-label="RGB"><span>RGB</span>' + esc(fmtRgb(sw.hex)) + "</button>" +
      '<button type="button" data-act="copy" data-i="' + i + '" data-value="' + esc(fmtHsl(sw.hex)) + '" data-label="HSL"><span>HSL</span>' + esc(fmtHsl(sw.hex)) + "</button>" +
      "</div><div class=\"contrast\">" + chip("Ink", INK, vsInk) + chip("Paper", PAPER, vsPaper) + "</div></div></article>"
    );
  }

  function studioHTML(fromSeason) {
    const season = byId(state.seasonId);
    if (!season || !state.swatches.length) {
      return '<div class="wrap empty"><h1>Open the studio</h1><p>Run a colour analysis first, or pick a season to drape.</p><div class="actions"><a class="btn" href="#/analyse">Begin analysis</a><a class="btn secondary" href="#/seasons">Browse seasons</a><button class="btn ghost" type="button" data-act="demo">Try the demo</button></div></div>';
    }
    const also = (state.also || []).map((id, i) => {
      const s = byId(id);
      if (!s) return "";
      return (i ? ", " : "") + '<button type="button" data-act="also" data-id="' + esc(id) + '">' + esc(s.name) + "</button>";
    }).join("");
    const back = fromSeason ? '<a class="back" href="#/seasons">All seasons</a>' : "";
    return (
      '<div class="wrap">' + back +
      '<header class="studio-top"><div>' +
      '<p class="eyebrow">' + esc(season.family) + " · " + esc(season.temperature) + " · " + esc(season.value) + " · " + esc(season.chroma) + (state.demo ? " · sample" : "") + "</p>" +
      "<h1>" + esc(season.name) + "</h1>" +
      '<p class="summary">' + esc(season.summary) + "</p>" +
      (also ? '<p class="also">Also close: ' + also + "</p>" : "") +
      "</div><div class=\"toolrow\">" +
      '<button class="btn" type="button" data-act="shuffle">Shuffle <kbd style="background:transparent;color:inherit;padding:0">Space</kbd></button>' +
      '<button class="btn secondary" type="button" data-act="modal" data-which="css">CSS</button>' +
      '<button class="btn ghost" type="button" data-act="modal" data-which="keys" aria-label="Keyboard shortcuts">Keys</button>' +
      "</div></header>" +
      '<div class="studio-grid">' +
      drape(state.coloring, season.lipstickHex, state.swatches, season.name) +
      '<div class="swatches">' + state.swatches.map(swatchCard).join("") + "</div></div>" +
      '<section class="notes">' +
      "<article><h2>Metals</h2><p>" + esc(season.metals) + "</p></article>" +
      "<article><h2>Makeup</h2><p><i class=\"lip\" style=\"background:" + esc(season.lipstickHex) + "\"></i>" + esc(season.lipstick) + ". Blush: " + esc(season.blush) + ". Liner: " + esc(season.eyeliner) + ".</p></article>" +
      "<article><h2>Wear</h2><p>" + esc(season.wardrobe.join(" ")) + "</p></article>" +
      "</section>" +
      '<section class="split">' +
      '<article><h2 class="serif">Reach for</h2><ul>' + season.wardrobe.map((w) => "<li>" + esc(w) + "</li>").join("") + "</ul></article>" +
      '<article><h2 class="serif">Set aside</h2><ul>' + season.avoid.map((w) => "<li>" + esc(w) + "</li>").join("") + "</ul></article>" +
      "</section></div>"
    );
  }

  function shortcuts() {
    const rows = [
      ["Space", "Shuffle unlocked colours"],
      ["1–5", "Lock or unlock a swatch"],
      ["← →", "Move focus"],
      ["C", "Copy focused HEX"],
      ["Shift+C", "Copy CSS variables"],
      ["E", "Open CSS export"],
      ["L", "Lock the focused swatch"],
      ["?", "This panel"],
    ];
    return rows.map((r) => '<div class="shortcut"><dt><kbd>' + r[0] + "</kbd></dt><dd>" + r[1] + "</dd></div>").join("");
  }

  function shell(main) {
    const route = parseRoute();
    const cur = route.view === "season" ? "studio" : route.view;
    function link(hash, id, label) {
      const on = cur === id ? ' aria-current="page"' : "";
      return '<a href="' + hash + '"' + on + ">" + label + "</a>";
    }
    const ribbon = state.demo
      ? '<div class="ribbon"><p>Shop demo · a sample reading, so you can click through the atelier.</p><div class="row"><button type="button" data-act="tour">Tour</button><button type="button" data-act="own">Start my analysis</button></div></div>'
      : "";
    let tour = "";
    if (state.tour !== null && TOUR[state.tour]) {
      const t = TOUR[state.tour];
      const last = state.tour === TOUR.length - 1;
      tour =
        '<aside class="tour" role="dialog" aria-label="Demo tour">' +
        '<p class="kicker">' + esc(t.k) + "</p><h2>" + esc(t.t) + "</h2><p>" + esc(t.p) + "</p>" +
        '<div class="actions"><button class="btn ghost" type="button" data-act="tour-close">Close</button>' +
        (state.tour > 0 ? '<button class="btn secondary" type="button" data-act="tour-prev">Back</button>' : "") +
        '<button class="btn" type="button" data-act="' + (last ? "tour-close" : "tour-next") + '">' + (last ? "Done" : "Next") + "</button></div></aside>";
    }
    let modal = "";
    if (state.modal === "css") {
      modal =
        '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
        '<div class="sheet"><h2 id="modal-title">Export CSS variables</h2><pre class="css">' + esc(cssVars(state.swatches)) + "</pre>" +
        '<div class="actions"><button class="btn secondary" type="button" data-act="close">Close</button><button class="btn" type="button" data-act="copy-css">Copy CSS</button></div></div></div>';
    } else if (state.modal === "keys") {
      modal =
        '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
        '<div class="sheet"><h2 id="modal-title">Keyboard</h2><dl>' + shortcuts() + "</dl>" +
        '<div class="actions"><button class="btn" type="button" data-act="close">Close</button></div></div></div>';
    }
    const toast = state.toast ? '<div class="toast" role="status">' + esc(state.toast) + "</div>" : "";
    return (
      '<header class="top"><div class="bar"><a class="logo" href="#/">Teint</a><nav class="nav">' +
      link("#/analyse", "analyse", "Analysis") +
      link("#/seasons", "seasons", "Seasons") +
      link("#/studio", "studio", "Studio") +
      "</nav></div>" + ribbon + "</header>" +
      "<main>" + main + "</main>" +
      '<footer class="foot"><div><p>Teint — a colour atelier. Apps by Judith.</p><p>Twelve-season analysis. Private to this device. One file.</p></div></footer>' +
      tour + modal + toast
    );
  }

  function render() {
    const route = parseRoute();
    let main = "";
    if (route.view === "analyse") main = analyseHTML();
    else if (route.view === "seasons") main = seasonsHTML();
    else if (route.view === "studio") main = studioHTML(false);
    else if (route.view === "season") main = studioHTML(true);
    else main = homeHTML();
    document.getElementById("app").innerHTML = shell(main);
    const viewKey = route.view + ":" + (route.id || "");
    if (viewKey !== lastView) {
      lastView = viewKey;
      window.scrollTo(0, 0);
    }
    const season = byId(state.seasonId);
    document.title = season && (route.view === "studio" || route.view === "season")
      ? season.name + " · Teint"
      : "Teint";
  }

  function onRoute() {
    const route = parseRoute();
    if (route.view === "season") {
      if (route.id !== lastSeason) {
        lastSeason = route.id;
        openSeason(route.id);
      }
    } else {
      lastSeason = null;
    }
    render();
  }

  document.getElementById("app").addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.getAttribute("data-act");
    if (act === "demo") {
      e.preventDefault();
      startDemo();
      return;
    }
    if (act === "own") {
      beginOwn();
      return;
    }
    if (act === "tour") {
      state.tour = 0;
      if (parseRoute().view === "home") go("#/studio");
      else render();
      return;
    }
    if (act === "tour-next") { state.tour = Math.min(TOUR.length - 1, (state.tour || 0) + 1); render(); return; }
    if (act === "tour-prev") { state.tour = Math.max(0, (state.tour || 0) - 1); render(); return; }
    if (act === "tour-close") { state.tour = null; render(); return; }
    if (act === "studio-sample") {
      applySample();
      save();
      go("#/studio");
      return;
    }
    if (act === "answer") {
      state.answers = Object.assign({}, state.answers, { [t.getAttribute("data-step")]: t.getAttribute("data-opt") });
      save();
      render();
      return;
    }
    if (act === "back") {
      if (state.step === 0) go("#/");
      else { state.step -= 1; save(); render(); }
      return;
    }
    if (act === "next") {
      const current = QUIZ[state.step];
      if (!current || !state.answers[current.id]) return;
      if (state.step >= QUIZ.length - 1) finish();
      else { state.step += 1; save(); render(); }
      return;
    }
    if (act === "shuffle") { shuffle(); return; }
    if (act === "lock") {
      const i = Number(t.getAttribute("data-i"));
      state.swatches = state.swatches.map((sw, idx) => idx === i ? Object.assign({}, sw, { locked: !sw.locked }) : sw);
      state.focused = i;
      save();
      render();
      return;
    }
    if (act === "focus") {
      state.focused = Number(t.getAttribute("data-i"));
      render();
      return;
    }
    if (act === "copy") {
      e.stopPropagation();
      const value = t.getAttribute("data-value");
      const label = t.getAttribute("data-label") || "value";
      const i = Number(t.getAttribute("data-i"));
      copyText(value).then((ok) => {
        if (!ok) { toast("Couldn’t copy"); return; }
        flash(i, label);
        toast("Copied " + label);
      });
      return;
    }
    if (act === "copy-css") {
      copyText(cssVars(state.swatches)).then((ok) => toast(ok ? "Copied CSS variables" : "Couldn’t copy"));
      return;
    }
    if (act === "modal") { state.modal = t.getAttribute("data-which"); render(); return; }
    if (act === "close") { state.modal = null; render(); return; }
    if (act === "also") {
      const id = t.getAttribute("data-id");
      const season = byId(id);
      if (!season) return;
      state.seasonId = id;
      state.lookIndex = 0;
      state.focused = 0;
      state.swatches = fromLook(season, 0);
      save();
      const route = parseRoute();
      if (route.view === "season") {
        lastSeason = id;
        go("#/s/" + id);
      } else render();
    }
  });

  document.getElementById("app").addEventListener("click", (e) => {
    if (e.target.classList && e.target.classList.contains("modal")) {
      state.modal = null;
      render();
    }
  });

  window.addEventListener("keydown", (e) => {
    const route = parseRoute();
    if (e.key === "Escape") {
      state.modal = null;
      state.tour = null;
      render();
      return;
    }
    if (route.view !== "studio" && route.view !== "season") return;
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "?" || (e.key === "/" && e.shiftKey)) {
      e.preventDefault();
      state.modal = state.modal === "keys" ? null : "keys";
      render();
      return;
    }
    if (e.code === "Space" && !e.repeat) {
      if (e.target.closest && e.target.closest("button, a")) return;
      e.preventDefault();
      shuffle();
      return;
    }
    if (e.key >= "1" && e.key <= "5") {
      const i = Number(e.key) - 1;
      if (!state.swatches[i]) return;
      e.preventDefault();
      state.swatches = state.swatches.map((sw, idx) => idx === i ? Object.assign({}, sw, { locked: !sw.locked }) : sw);
      state.focused = i;
      save();
      render();
      return;
    }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const n = Math.max(state.swatches.length, 1);
      e.preventDefault();
      state.focused = e.key === "ArrowRight" ? (state.focused + 1) % n : (state.focused - 1 + n) % n;
      render();
      return;
    }
    if ((e.key === "l" || e.key === "L") && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      const i = state.focused;
      state.swatches = state.swatches.map((sw, idx) => idx === i ? Object.assign({}, sw, { locked: !sw.locked }) : sw);
      save();
      render();
      return;
    }
    if ((e.key === "c" || e.key === "C") && !e.metaKey && !e.ctrlKey) {
      const sw = state.swatches[state.focused] || state.swatches[0];
      if (!sw) return;
      e.preventDefault();
      if (e.shiftKey) {
        copyText(cssVars(state.swatches)).then((ok) => toast(ok ? "Copied CSS variables" : "Couldn’t copy"));
      } else {
        copyText(norm(sw.hex)).then((ok) => {
          if (!ok) { toast("Couldn’t copy"); return; }
          flash(state.focused, "HEX");
          toast("Copied HEX");
        });
      }
      return;
    }
    if (e.key === "e" || e.key === "E") {
      e.preventDefault();
      state.modal = "css";
      render();
    }
  });

  window.addEventListener("hashchange", onRoute);

  load();
  const wantDemo = new URLSearchParams(location.search).get("demo") === "1";
  if (wantDemo) applySample();
  save();
  onRoute();
})();

</script>
</body>
</html>
