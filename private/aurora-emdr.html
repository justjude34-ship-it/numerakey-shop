<style>
:root{
  --pink:#ff7eb3; --gold:#ffd166; --emerald:#34d399; --cyan:#22d3ee;
  --blue:#60a5fa; --violet:#a78bfa; --magenta:#e879f9; --light:#fff8e7;
  --display:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#ebe8f4;font-family:var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
#app{min-height:100%;position:relative;overflow-x:hidden}
.ribbons{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ribbons::before,.ribbons::after{content:"";position:absolute;left:-20%;right:-20%;height:42%;filter:blur(42px);border-radius:40% 60% 50% 50%;animation:drift 18s ease-in-out infinite}
.ribbons::before{top:6%;background:linear-gradient(90deg,transparent,rgba(255,126,179,.32) 15%,rgba(255,209,102,.28) 30%,rgba(52,211,153,.32) 45%,rgba(34,211,238,.38) 60%,rgba(96,165,250,.28) 75%,rgba(167,139,250,.32) 90%,transparent)}
.ribbons::after{top:26%;height:28%;opacity:.7;animation-delay:-8s;background:linear-gradient(90deg,transparent,rgba(167,139,250,.28) 20%,rgba(34,211,238,.32) 45%,rgba(255,126,179,.26) 75%,transparent)}
@keyframes drift{0%,100%{transform:translateX(-4%)}50%{transform:translateX(4%) translateY(8px)}}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;animation:breathe 12s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.26;transform:scale(1)}50%{opacity:.42;transform:scale(1.06)}}
.rainbow{background:linear-gradient(100deg,#ff7eb3,#ffd166 18%,#34d399 36%,#22d3ee 52%,#60a5fa 68%,#a78bfa 84%,#e879f9);background-size:240% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shift 9s linear infinite}
@keyframes shift{to{background-position:240% center}}
.btn-aurora{background:linear-gradient(135deg,#ff7eb3,#ffd166,#34d399,#22d3ee,#60a5fa,#a78bfa);background-size:220% 220%;animation:shift 7s ease infinite;color:#0a0a0c;font-weight:600;border-radius:16px;padding:.75rem 1.25rem;box-shadow:0 4px 28px rgba(34,211,238,.22)}
.btn-ghost{padding:.75rem 1.1rem;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.card{background:linear-gradient(155deg,rgba(24,22,42,.94),rgba(10,12,20,.97));border:1px solid rgba(34,211,238,.08);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 40px rgba(167,139,250,.05)}
.glass{background:rgba(8,10,18,.76);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.06)}
.hairline{height:1px;background:linear-gradient(90deg,transparent,#ff7eb3,#ffd166,#34d399,#22d3ee,#60a5fa,#a78bfa,#e879f9,transparent)}
header.top{position:sticky;top:0;z-index:40}
header.top .inner{max-width:960px;margin:0 auto;padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--display);font-size:1.2rem;cursor:pointer}
main{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:1.1rem 1rem 6.5rem}
h1.page{font-family:var(--display);font-size:1.7rem;text-align:center}
.sub{text-align:center;color:rgba(255,255,255,.5);font-size:.82rem;margin:.25rem 0 1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.grid3{display:grid;grid-template-columns:1fr;gap:.7rem}
@media(min-width:640px){.grid3{grid-template-columns:1fr 1fr}.h1lg{font-size:2.4rem}}
@media(min-width:900px){.grid3{grid-template-columns:1fr 1fr 1fr}}
.navb{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(8,10,18,.88);backdrop-filter:blur(16px)}
.navb .row{display:flex;justify-content:space-around;padding:.45rem .25rem calc(.45rem + env(safe-area-inset-bottom))}
.navb button{display:flex;flex-direction:column;align-items:center;gap:.15rem;color:rgba(255,255,255,.48);font-size:.62rem;min-width:56px}
.navb button.on{color:#fff}
input,textarea,select{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:.7rem .9rem;outline:none}
textarea{min-height:90px;resize:vertical}
label.field{display:block;font-size:.78rem;color:rgba(255,255,255,.55);margin-bottom:.35rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .7rem;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);font-size:.7rem;color:rgba(255,255,255,.7)}
.art{border-radius:16px;overflow:hidden;border:1px solid rgba(34,211,238,.12);background:#030306}
.art svg{display:block;width:100%;height:auto}
.stage{position:relative;height:360px;background:#050508;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.stim{position:absolute;top:50%;transform:translate(-50%,-50%);transition:left .55s ease-in-out}
.bfly{width:72px;height:auto;background:transparent;display:block;filter:drop-shadow(0 6px 14px rgba(34,211,238,.28));animation:bflyfloat 3.2s ease-in-out infinite}
@keyframes bflyfloat{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
.hidden{display:none!important}
.row{display:flex;flex-wrap:wrap;gap:.55rem;align-items:center}
.muted{color:rgba(255,255,255,.5);font-size:.8rem;line-height:1.5}
.warn{border:1px solid rgba(251,191,36,.25)}
.msg-coach{background:linear-gradient(155deg,rgba(24,22,42,.94),rgba(10,12,20,.97));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:.9rem 1rem;font-size:.88rem;line-height:1.55;color:rgba(255,255,255,.82);white-space:pre-wrap}
.msg-user{background:linear-gradient(135deg,rgba(255,126,179,.22),rgba(167,139,250,.18));border-radius:16px;padding:.7rem 1rem;font-size:.88rem;align-self:flex-end;max-width:92%}
.actions button{font-size:.72rem;padding:.35rem .7rem;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#a5f3fc;margin:.2rem .25rem 0 0}
@media(prefers-reduced-motion:reduce){.rainbow,.btn-aurora,.orb,.ribbons::before,.ribbons::after,.bfly{animation:none!important}}
</style>
</head>

function load(){

      safePlaces:Array.isArray(d.safePlaces)?d.safePlaces:[],

}

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function butterflySVG(size){
  return `<img class="bfly" alt="" width="${size}" style="width:${size}px;height:auto;background:transparent" src="${BFLY}" />`;
}

let page='home';
const view=document.getElementById('view');

function setPage(p){
  page=p;
  document.querySelectorAll('.navb button').forEach(b=>b.classList.toggle('on', b.getAttribute('data-go')===p || (p!=='home'&&p!=='bls'&&p!=='coach'&&p!=='calm'&&p!=='settings'&&b.getAttribute('data-go')==='more')));
  render();
  window.scrollTo(0,0);
}
document.body.addEventListener('click', e=>{
  const go=e.target.closest('[data-go]');
  if(go){ e.preventDefault(); setPage(go.getAttribute('data-go')); }
});

/* ---------- pages ---------- */
function pageHome(){
  const s=state.sessions;
  const sets=s.reduce((a,x)=>a+(x.sets||0),0);
  const mins=s.reduce((a,x)=>a+(x.minutes||0),0);
  const suds=s.filter(x=>x.sudsBefore!=null&&x.sudsAfter!=null).map(x=>x.sudsBefore-x.sudsAfter);
  const avg=suds.length?(suds.reduce((a,b)=>a+b,0)/suds.length).toFixed(1):'—';
  const tools=[
    ['bls','Butterfly BLS','Bilateral stimulation studio'],
    ['coach','AI Coach','On-device session guidance'],
    ['stabilize','Stabilize','Safe place & resources'],
    ['grounding','Grounding','5-4-3-2-1 · breath · scan'],
    ['guided','Guided session','7-step structured path'],
    ['learn','Learn EMDR','8 phases · CPTSD tips'],
    ['journal','Journal','Private notes on this device'],
    ['progress','Progress','SUDS trends & history'],
    ['calm','Calm Now','Grounding + crisis shortcuts']
  ];
  return `
  <section class="card" style="overflow:hidden;margin-bottom:1rem">

function pageBLS(){
  return `
  <h1 class="page rainbow">Butterfly BLS Studio</h1>
  <p class="sub">Left–right bilateral stimulation · dual-awareness ready</p>
  <div class="stage" id="stage">
    <div class="stim" id="stim" style="left:50%">${butterflySVG(72)}</div>
    <div id="stageMsg" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(255,255,255,.45);font-size:.9rem">Press start when ready</div>
  </div>
  <div class="card" style="padding:1rem;margin-top:.8rem">
    <div class="row">
      <label class="field" style="flex:1">Mode
        <select id="blsMode"><option value="visual">Visual</option><option value="audio">Audio</option><option value="both" selected>Both</option></select>
      </label>
      <label class="field" style="flex:1">Speed
        <select id="blsSpeed"><option value="slow">Slow</option><option value="medium" selected>Medium</option><option value="fast">Fast</option><option value="custom">Custom</option></select>
      </label>
    </div>
    <label class="field" style="margin-top:.5rem">Set length (seconds)
      <input id="blsDur" type="number" min="8" max="180" value="${state.settings.blsDefaultDuration||30}" />
    </label>
    <label class="field" style="margin-top:.5rem">Stimulus
      <select id="blsStim"><option value="butterfly">Rainbow butterfly</option><option value="orb">Aurora orb</option></select>
    </label>
    <div class="muted" id="blsClock" style="margin:.5rem 0">0s</div>
    <div class="row">
      <button class="btn-aurora" id="blsStart">Start</button>
      <button class="btn-ghost" id="blsStop">Stop / ground</button>
      <button class="btn-ghost" id="blsFs">Fullscreen</button>
    </div>
  </div>`;
}

function pageCoach(){
  return `
  <h1 class="page rainbow">AI Coach</h1>
  <p class="sub">On-device guidance · not therapy · private</p>
  <div class="card warn" style="padding:.7rem .9rem;margin-bottom:.7rem">
    <p class="muted" style="font-size:.72rem">Aurora Coach is structured self-support, not a clinician or crisis service. If you feel unsafe, stop and use Calm Now or local emergency help.</p>
  </div>
  <div id="coachLog" style="display:flex;flex-direction:column;gap:.55rem;min-height:220px"></div>
  <div class="row" style="margin:.7rem 0" id="coachChips"></div>
  <form id="coachForm" class="row">
    <input id="coachIn" placeholder="Ask the coach…" style="flex:1" autocomplete="off" />
    <button class="btn-aurora" type="submit">Send</button>
  </form>`;
}

function pageStabilize(){
  const list=state.safePlaces.map(p=>`
    <div class="card" style="padding:.9rem;margin-top:.55rem">
      <div style="display:flex;justify-content:space-between;gap:.5rem">
        <strong>${esc(p.name)}</strong>
        <button class="chip del-place" data-id="${p.id}">Remove</button>
      </div>
      <p class="muted">${esc(p.description||'')}</p>
      <p class="muted">${esc(p.sensory||'')}</p>
    </div>`).join('') || '<p class="muted">No safe places saved yet.</p>';
  return `
  <h1 class="page rainbow">Stabilize</h1>
  <p class="sub">Phase 2 first · safe place · container · resources</p>
  <div class="art" style="margin-bottom:.8rem">${ART.safe}</div>
  <div class="card" style="padding:1rem">
    <div style="font-weight:600;margin-bottom:.35rem">Safe place</div>
    <p class="muted" style="margin-bottom:.6rem">A scene that feels protected and fully yours. Build it with all senses. Install with short BLS when calm.</p>
    <label class="field">Name<input id="spName" placeholder="e.g. Ocean cove" /></label>
    <label class="field">Description<textarea id="spDesc" placeholder="What you see…"></textarea></label>
    <label class="field">Senses<textarea id="spSens" placeholder="Sound, temperature, scent, touch…"></textarea></label>
    <button class="btn-aurora" id="spSave">Save safe place</button>
  </div>
  <div class="card" style="padding:1rem;margin-top:.7rem">
    <div style="font-weight:600">Container</div>
    <p class="muted">Imagine a strong container that can hold leftover material until you or your clinician choose to work with it. Close the lid. You can come back later.</p>
  </div>
  <div class="card" style="padding:1rem;margin-top:.7rem">
    <div style="font-weight:600">Resource installation</div>
    <p class="muted">Hold a felt sense of strength, calm, or connection. Run short BLS sets and notice it deepen. For complex trauma, resource work often comes before target processing.</p>
    <button class="btn-ghost" data-go="bls" style="margin-top:.6rem">Open BLS</button>
  </div>
  <h2 style="font-family:var(--display);margin:1rem 0 .4rem">Saved places</h2>
  ${list}`;
}

function pageGround(){
  return `
  <h1 class="page rainbow">Grounding</h1>
  <p class="sub">Return to the present under gentle light</p>
  <div class="card" style="padding:1rem">
    <div style="font-weight:600">5-4-3-2-1</div>
    <p class="muted">Name 5 things you see, 4 you can touch, 3 you hear, 2 you smell, 1 you taste or a quality of breath.</p>
  </div>
  <div class="card" style="padding:1rem;margin-top:.7rem;text-align:center">
    <div style="font-weight:600">Box breathing</div>
    <div id="boxLabel" class="rainbow" style="font-family:var(--display);font-size:2rem;margin:.4rem 0">In</div>
    <div class="muted" id="boxCount">4</div>
    <button class="btn-aurora" id="boxToggle" style="margin-top:.6rem">Start breathing</button>
  </div>
  <div class="card" style="padding:1rem;margin-top:.7rem">
    <div style="font-weight:600">Body scan</div>
    <p class="muted">From crown to feet, notice sensation without fixing it. If charge rises, pause, look around the room, feel your feet.</p>
  </div>`;
}

function pageLearn(){

/* ---------- binders / engines ---------- */
let blsTimer=null, audioCtx=null, blsRunning=false, blsSide='left', blsElapsed=0;
const SPEED={slow:1200,medium:700,fast:400};

function playTone(left){
  const mode=document.getElementById('blsMode')?.value||'both';
  if(mode==='visual') return;
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain(), pan=audioCtx.createStereoPanner();
  osc.frequency.value=left?440:523.25;
  pan.pan.value=left?-1:1;
  gain.gain.value=0.14;
  osc.connect(pan); pan.connect(gain); gain.connect(audioCtx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.15);
  osc.stop(audioCtx.currentTime+0.16);
}

function stopBLS(log){
  blsRunning=false;
  if(blsTimer){ clearInterval(blsTimer); blsTimer=null; }
  if(log && blsElapsed>5){
    state.sessions.unshift({id:uid(),date:new Date().toISOString(),type:'bls',sets:1,minutes:Math.round(blsElapsed/6)/10});
    if(state.sessions.length>200) state.sessions.length=200;
    save();
  }
}

function bind(){
  if(page==='home'){
    const d=document.getElementById('dismiss');
    if(d) d.onclick=()=>{ state.settings.disclaimerDismissed=true; save(); render(); };
  }
  if(page==='bls'){
    const stage=document.getElementById('stage');
    const stim=document.getElementById('stim');
    const msg=document.getElementById('stageMsg');
    const clock=document.getElementById('blsClock');
    document.getElementById('blsStart').onclick=()=>{
      const dur=+document.getElementById('blsDur').value||30;
      const speed=document.getElementById('blsSpeed').value;
      const period=speed==='custom'?800:SPEED[speed];
      const kind=document.getElementById('blsStim').value;
      blsElapsed=0; blsSide='left'; blsRunning=true;
      msg.style.display='none';
      if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      const paint=()=>{
        stim.style.left=blsSide==='left'?'16%':'84%';
        stim.innerHTML=kind==='orb'
          ? `<div style="width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#ffd166,#a78bfa 70%);box-shadow:0 0 36px #22d3ee,0 0 60px #ff7eb366"></div>`
          : butterflySVG(72);
        playTone(blsSide==='left');
      };
      paint();
      blsTimer=setInterval(()=>{
        blsSide=blsSide==='left'?'right':'left';
        blsElapsed+=period/1000;
        clock.textContent=Math.floor(blsElapsed)+'s / '+dur+'s';
        if(blsElapsed>=dur){
          stopBLS(true);
          msg.style.display='flex';
          msg.innerHTML=`<div style="text-align:center;padding:1rem"><div class="rainbow" style="font-family:var(--display);font-size:1.3rem">Set complete</div><p class="muted" style="max-width:16rem;margin:.4rem auto">Notice what you notice — body, emotion, thought. Stay dual-aware.</p><button class="btn-aurora" id="again">Another set</button></div>`;
          document.getElementById('again').onclick=()=>document.getElementById('blsStart').click();
          return;
        }
        paint();
      }, period);
    };
    document.getElementById('blsStop').onclick=()=>{ stopBLS(true); msg.style.display='flex'; msg.textContent='Paused. Ground if you need to.'; };
    document.getElementById('blsFs').onclick=()=>{ if(!document.fullscreenElement) stage.requestFullscreen?.(); else document.exitFullscreen?.(); };
  }
  if(page==='coach') bindCoach();
  if(page==='stabilize'){
    document.getElementById('spSave').onclick=()=>{
      const name=document.getElementById('spName').value.trim();
      if(!name) return;
      state.safePlaces.unshift({id:uid(),name,description:document.getElementById('spDesc').value,sensory:document.getElementById('spSens').value,created:new Date().toISOString()});
      save(); render();
    };
    view.querySelectorAll('.del-place').forEach(b=>b.onclick=()=>{ state.safePlaces=state.safePlaces.filter(p=>p.id!==b.dataset.id); save(); render(); });
  }
  if(page==='grounding'){
    document.getElementById('boxToggle').onclick=()=>{ if(breathOn) stopBreath(); else startBreath(); };
  }
  if(page==='guided') bindGuided();
  if(page==='journal'){
    document.getElementById('jSave').onclick=()=>{
      const content=document.getElementById('jText').value.trim();
      if(!content) return;
      const mood=document.getElementById('jMood').value;
      state.journal.unshift({id:uid(),date:new Date().toISOString(),content,mood:mood?+mood:undefined,tags:document.getElementById('jTags').value.trim()||undefined});
      save(); render();
    };
    view.querySelectorAll('.del-j').forEach(b=>b.onclick=()=>{ state.journal=state.journal.filter(j=>j.id!==b.dataset.id); save(); render(); });
  }
  if(page==='settings'){
    document.getElementById('setSave').onclick=()=>{
      state.settings.userName=document.getElementById('setName').value.trim();
      state.settings.reducedMotion=document.getElementById('setMotion').checked;
      state.settings.crisisNumber=document.getElementById('setCrisis').value.trim();
      save();
      document.body.classList.toggle('reduce', state.settings.reducedMotion);
      alert('Saved on this device.');
    };
    document.getElementById('exp').onclick=()=>{
      const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),sessions:state.sessions,journal:state.journal,safePlaces:state.safePlaces,settings:state.settings},null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='aurora-emdr-backup.json'; a.click();
    };
    document.getElementById('imp').onclick=()=>document.getElementById('impFile').click();
    document.getElementById('impFile').onchange=e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const d=JSON.parse(r.result);
          state.sessions=Array.isArray(d.sessions)?d.sessions:state.sessions;
          state.journal=Array.isArray(d.journal)?d.journal:state.journal;
          state.safePlaces=Array.isArray(d.safePlaces)?d.safePlaces:state.safePlaces;
          state.settings=Object.assign({},state.settings,d.settings||{});
          save(); document.getElementById('impMsg').textContent='Import successful.';
        }catch(err){ document.getElementById('impMsg').textContent='Import failed.'; }
      };
      r.readAsText(f);
    };
    document.getElementById('wipe').onclick=()=>{
      if(confirm('Wipe all Aurora EMDR data on this device? This cannot be undone.')){
        state={sessions:[],journal:[],safePlaces:[],settings:Object.assign({},defaults)};
        save(); render();
      }
    };
  }
}

let breathOn=false, breathT=null;
function startBreath(){
  breathOn=true;
  const phases=[['In',4],['Hold',4],['Out',4],['Rest',4]];
  let i=0,c=4;
  const lab=document.getElementById('boxLabel'), cnt=document.getElementById('boxCount'), btn=document.getElementById('boxToggle');
  if(btn) btn.textContent='Stop';
  const tick=()=>{
    if(!breathOn) return;
    if(c<=1){ i=(i+1)%4; c=phases[i][1]; if(lab) lab.textContent=phases[i][0]; }
    else c--;
    if(cnt) cnt.textContent=c;
  };
  if(lab) lab.textContent='In';
  if(cnt) cnt.textContent='4';
  breathT=setInterval(tick,1000);
}
function stopBreath(){
  breathOn=false;
  if(breathT){ clearInterval(breathT); breathT=null; }
  const btn=document.getElementById('boxToggle');
  if(btn) btn.textContent='Start breathing';
}

let gStep=0, gSudsB=5, gSudsA=3, gVoc=3;
function bindGuided(){
  const paint=()=>{
    document.getElementById('gDots').innerHTML=GUIDED.map((_,i)=>`<div style="height:6px;width:22px;border-radius:99px;background:${i<=gStep?'linear-gradient(90deg,#ff7eb3,#22d3ee)':'rgba(255,255,255,.12)'}"></div>`).join('');
    document.getElementById('gStepN').textContent='Step '+(gStep+1)+' of '+GUIDED.length;
    document.getElementById('gTitle').textContent=GUIDED[gStep][0];
    document.getElementById('gDesc').textContent=GUIDED[gStep][1];
    let extra='';
    if(gStep===0) extra=`<label class="field">SUDS now: <span id="sv">${gSudsB}</span><input id="gs" type="range" min="0" max="10" value="${gSudsB}"></label>`;
    if(gStep===2) extra=`<label class="field">VOC: <span id="sv">${gVoc}</span><input id="gs" type="range" min="1" max="7" value="${gVoc}"></label>`;
    if(gStep===3) extra=`<button class="btn-aurora" data-go="bls">Open BLS studio →</button>`;
    if(gStep===6) extra=`<label class="field">SUDS after: <span id="sv">${gSudsA}</span><input id="gs" type="range" min="0" max="10" value="${gSudsA}"></label>`;
    document.getElementById('gExtra').innerHTML=extra;
    const sl=document.getElementById('gs');
    if(sl) sl.oninput=()=>{
      const v=+sl.value; document.getElementById('sv').textContent=v;
      if(gStep===0) gSudsB=v; if(gStep===2) gVoc=v; if(gStep===6) gSudsA=v;
    };
    document.getElementById('gNext').textContent=gStep===GUIDED.length-1?'Complete & log':'Next';
  };
  document.getElementById('gBack').onclick=()=>{ gStep=Math.max(0,gStep-1); paint(); };
  document.getElementById('gNext').onclick=()=>{
    if(gStep<GUIDED.length-1){ gStep++; paint(); }
    else{
      state.sessions.unshift({id:uid(),date:new Date().toISOString(),type:'guided',sets:3,minutes:15,sudsBefore:gSudsB,sudsAfter:gSudsA});
      save(); gStep=0; alert('Session logged on this device.'); paint();
    }
  };
  paint();
}

const COACH={
welcome: (n)=>`${n?`Hi ${n}. `:`Hi. `}I’m your on-device Aurora coach — structured guidance between clinical sessions, not a therapist.\n\nI can help you prepare, pace BLS sets, ground if things get loud, and close sessions gently. Everything stays on this device.\n\nWhat would be most useful right now?`,
prep: `Before any processing, check your window of tolerance.\n\n1. Rate SUDS 0–10.\n2. If SUDS is 7+, stabilize first — safe place, container, or grounding.\n3. Choose a small, manageable target.\n4. Keep dual awareness: one foot in the present.\n\nYou are in charge of the pace.`,
between: `Between sets, pause and notice what shifted — image, body, emotion, thought — without forcing change.\n\n• If material is moving and you feel resourced → another short set.\n• If intensity is rising or you feel floaty → stop, ground, or return to safe place.\n• Keep sets short. Dual awareness matters more than duration.`,
after: `Closing well protects the work.\n\n1. Body scan — residual charge? Container it if needed.\n2. Return to safe place.\n3. Log SUDS if you tracked it.\n4. Plan something gentle. Processing can continue after BLS.\n\nYou do not need to finish everything today.`,
overwhelm: `Stop processing. Orient to the room.\n\nFeel your feet. Name 3 things you can see, 2 you can hear, 1 you can touch.\n\nOpen Grounding or Calm Now if you need to. Overwhelm is information — not failure. Stabilization comes before processing.`,
safe: `Safe place is a Phase 2 resource — a scene that feels protected, calm, and fully yours.\n\nBuild it with all senses. Include a boundary if that helps. Install with short BLS while holding the image. Return to it between sets or when activated.`,
resource: `Resource installation strengthens adaptive material — calm, strength, connection, a preferred belief.\n\nHold the resource. Run short BLS sets and notice it deepen. For complex trauma self-support, resource work often comes before target processing.`,
learn: `EMDR uses bilateral stimulation while you notice material, so the nervous system can reprocess stuck experiences.\n\nStandard phases move from history & preparation → assessment → desensitization → installation → body scan → closure → reevaluation.\n\nFor CPTSD, preparation and stabilization are essential and often take longer.`,
crisis: `If you feel unsafe or might harm yourself, please stop using this app and contact emergency services or a crisis line right away.\n\nAurora EMDR is a support tool between clinical sessions — not a crisis service and not a replacement for professional care.\n\nOpen Calm Now for grounding shortcuts and your local crisis number if you saved one.`,
general: `I can walk you through preparation, pacing between sets, closing a session, safe place / resources, or what to do when intensity rises.\n\nI stay on this device. I do not diagnose, excavate trauma, or replace your clinician.`
};
const COACH_ACT={
welcome:[['Prepare a session','prep'],['Between BLS sets','between'],['I’m overwhelmed','overwhelm'],['Safe place help','safe']],
prep:[['Open Stabilize','stabilize'],['Guided path','guided'],['Start BLS','bls']],
between:[['Back to BLS','bls'],['Ground now','grounding'],['Safe place','stabilize']],
after:[['Progress','progress'],['Journal','journal'],['Safe place','stabilize']],
overwhelm:[['Grounding','grounding'],['Calm Now','calm'],['Safe place','stabilize']],
safe:[['Open Stabilize','stabilize'],['Gentle BLS','bls']],
resource:[['Stabilize','stabilize'],['BLS studio','bls'],['Learn','learn']],
learn:[['Learn EMDR','learn'],['Guided session','guided']],
crisis:[['Calm Now','calm'],['Grounding','grounding']],
general:[['Prepare','prep'],['Between sets','between'],['After session','after'],['Overwhelm','overwhelm']]
};
function detectIntent(t){
  t=t.toLowerCase();
  if(/suicid|kill myself|end my life|self.?harm|want to die|hurt myself|crisis|emergency/.test(t)) return 'crisis';
  if(/overwhelm|too much|panic|flood|spinning|dysreg/.test(t)) return 'overwhelm';
  if(/safe place|container/.test(t)) return 'safe';
  if(/between set|after set|next set/.test(t)) return 'between';
  if(/after session|finished|closure|closing/.test(t)) return 'after';
  if(/prep|prepare|before session|ready/.test(t)) return 'prep';
  if(/resource|install belief|positive/.test(t)) return 'resource';
  if(/how does|what is emdr|learn|phase|bls work|cptsd/.test(t)) return 'learn';
  return 'general';
}
function bindCoach(){
  const log=document.getElementById('coachLog');
  const chips=document.getElementById('coachChips');
  function addCoach(key){
    const text=typeof COACH[key]==='function'?COACH[key](state.settings.userName):COACH[key];
    const acts=COACH_ACT[key]||[];
    const div=document.createElement('div');
    div.className='msg-coach';
    div.innerHTML=`<div class="muted" style="font-size:.7rem;margin-bottom:.3rem">Aurora Coach</div>${esc(text).replace(/\n/g,'<br/>')}<div class="actions">${acts.map(([l,k])=> k.length<12 && ['bls','calm','stabilize','grounding','learn','journal','progress','guided'].includes(k) ? `<button data-go="${k}">${l} →</button>` : `<button data-intent="${k}">${l}</button>`).join('')}</div>`;
    log.appendChild(div);
    log.scrollTop=log.scrollHeight;
  }
  function addUser(t){
    const div=document.createElement('div'); div.className='msg-user'; div.textContent=t; log.appendChild(div);
  }
  addCoach('welcome');
  [['Prepare a session','prep'],['Between BLS sets','between'],['After session close','after'],['I’m overwhelmed','overwhelm'],['Safe place help','safe'],['How EMDR works','learn']].forEach(([l,k])=>{
    const b=document.createElement('button'); b.className='chip'; b.textContent=l;
    b.onclick=()=>{ addUser(l); addCoach(k); };
    chips.appendChild(b);
  });
  log.addEventListener('click',e=>{
    const it=e.target.closest('[data-intent]');
    if(it){ addUser(it.textContent); addCoach(it.getAttribute('data-intent')); }
  });
  document.getElementById('coachForm').onsubmit=e=>{
    e.preventDefault();
    const v=document.getElementById('coachIn').value.trim();
    if(!v) return;
    document.getElementById('coachIn').value='';
    addUser(v); addCoach(detectIntent(v));
  };
}

if(state.settings.reducedMotion) document.body.classList.add('reduce');
render();
})();
</script>
</body>
