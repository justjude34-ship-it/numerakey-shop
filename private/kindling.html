<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kindling</title>
<meta name="description" content="A quiet coach for late-identified ADHD and AuDHD adults. One file. Yours. Nothing leaves this device.">
<meta name="theme-color" content="#07080c">
<!--
  Kindling — single-file app for resale.
  Buy once. Open in any browser. Works offline after the first open.
  Not therapy. Not a diagnosis. Not crisis care.
  Buyer keeps this file. Nothing is sent anywhere.
-->
<style>
  :root {
    --bg: #07080c;
    --card: #10131b;
    --ink: #f4efe6;
    --muted: #b7b0a4;
    --spark: #e0a85c;
    --anchor: #7ec8c0;
    --line: rgba(224, 168, 92, 0.22);
    --field: #0b0e14;
    --sans: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
    --display: Georgia, "Palatino Linotype", Palatino, serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body {
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(224,168,92,.12), transparent 55%),
      radial-gradient(720px 460px at -14% 16%, rgba(126,200,192,.1), transparent 52%),
      var(--bg);
  }
  button, [role="button"] { cursor: pointer; font: inherit; color: inherit; }
  h1, h2 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0 0 .6rem; }
  p { text-wrap: pretty; }
  #app { min-height: 100dvh; }
  .shell { width: min(36rem, 100%); margin: 0 auto; padding: 1rem 1rem 2rem; }
  .shell.chrome { padding-bottom: calc(9.5rem + env(safe-area-inset-bottom)); }
  .hero { display: block; width: 100%; margin: 0 0 1.1rem; border-radius: .85rem; overflow: hidden; background: #163844; box-shadow: inset 0 0 0 3px var(--spark); }
  .hero img { display: block; width: 100%; height: auto; }
  .cover {
    min-height: 100dvh;
    background:
      radial-gradient(70% 42% at 50% 0%, rgba(36, 110, 150, 0.42), transparent 70%),
      #07141f;
  }
  .cover-title {
    font-family: var(--display);
    font-weight: 500;
    font-size: 3.2rem;
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0.15rem 0 0.55rem;
  }
  .cover-title span { color: var(--spark); }
  .brand { font-family: var(--display); font-size: 1.7rem; line-height: 1; }
  .brand span { color: var(--spark); }
  .kicker { margin: 0 0 .45rem; font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--anchor); font-weight: 600; }
  .kicker.spark { color: var(--spark); }
  .lead { color: var(--muted); line-height: 1.5; margin: 0 0 1rem; }
  .card { background: var(--card); border-radius: 1.15rem; padding: 1rem; box-shadow: 0 0 0 1px var(--line); margin-bottom: .75rem; }
  .gold, .quiet, .choice, .chip {
    min-height: 3rem; border-radius: .7rem; border: 1px solid var(--line); background: transparent;
    width: 100%; padding: .75rem 1rem;
  }
  .gold { background: var(--spark); color: #1a1208; font-weight: 650; border: 0; }
  .gold:active, .quiet:active, .choice:active, .chip:active { transform: scale(.98); }
  .quiet { color: var(--ink); }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .85rem; }
  .chip { width: auto; border-radius: 999px; padding: .55rem .9rem; min-height: 2.75rem; }
  .chip.on, .choice.on { border-color: var(--spark); background: rgba(224,168,92,.15); }
  .choice { text-align: center; margin-bottom: .5rem; }
  label.field { display: block; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--anchor); margin-bottom: .45rem; }
  input, textarea {
    width: 100%; border-radius: .7rem; border: 1px solid var(--line); background: var(--field);
    color: var(--ink); padding: .85rem 1rem; font: inherit; margin-bottom: .85rem;
  }
  textarea { min-height: 7rem; resize: vertical; }
  .coach { display: block; width: 100%; height: 220px; object-fit: cover; object-position: center 22%; border-radius: .9rem; margin-bottom: .85rem; box-shadow: inset 0 0 0 2px var(--spark); background: #1a2430; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .75rem; }
  .ghost { background: none; border: 0; color: var(--muted); min-height: 2.5rem; padding: 0 .25rem; }
  .dock, .crisis {
    position: fixed; left: 0; right: 0; z-index: 20; background: rgba(7,8,12,.95); border-top: 1px solid var(--line);
  }
  .crisis { bottom: calc(4.4rem + env(safe-area-inset-bottom)); text-align: center; font-size: .78rem; color: var(--muted); padding: .55rem .75rem; }
  .crisis a, .help a { color: var(--spark); text-decoration: none; }
  .dock { bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); padding: .25rem .25rem calc(.25rem + env(safe-area-inset-bottom)); }
  .dock button { background: none; border: 0; min-height: 3rem; color: var(--muted); font-size: .68rem; letter-spacing: .04em; text-transform: uppercase; }
  .dock button.on { color: var(--spark); }
  .note { border: 1px solid var(--line); background: var(--field); border-radius: .8rem; padding: 1rem; margin-bottom: .75rem; }
  .muted { color: var(--muted); }
  .sale { font-size: .8rem; color: var(--muted); margin-top: .5rem; }
</style>
</head>

}
function chips(list, key) {
  return '<div class="row">' + list.map(([id, label]) =>
    '<button type="button" class="chip' + (state[key] === id ? " on" : "") + '" data-set="' + key + '" data-val="' + id + '">' + esc(label) + "</button>"
  ).join("") + "</div>";
}
function choices(list, key) {
  return list.map(([id, label]) =>
    '<button type="button" class="choice' + (state[key] === id ? " on" : "") + '" data-set="' + key + '" data-val="' + id + '">' + esc(label) + "</button>"
  ).join("");
}
function mast(title, right) {
  return '<div class="top"><div class="brand" style="font-size:1.45rem">' + title + '</div>' + (right || "") + "</div>";
}
function chrome(inner) {
  return '<div class="shell chrome">' + inner + '</div>' +
    '<div class="crisis">In danger in Australia? <a href="tel:000">000</a> · <a href="tel:131114">Lifeline 13 11 14</a> <button type="button" class="ghost" data-go="help" aria-label="Help">?</button></div>' +
    '<nav class="dock" aria-label="Main">' +
    [["home", "Home"], ["session", "Session"], ["skills", "Skills"], ["notes", "Notes"], ["restart", "Restart"]].map(([id, label]) =>
      '<button type="button" class="' + (screen() === id ? "on" : "") + '" data-go="' + id + '">' + label + "</button>"
    ).join("") + "</nav>";
}

function viewCover() {
  return '<div class="cover"><div class="shell"><figure class="hero"><img src="' + COVER + '" alt=""></figure>' +
    '<h1 class="cover-title">Kindl<span>ing</span></h1>' +
    '<p class="lead">A quiet coach for late-identified ADHD and AuDHD adults.</p>' +
    '<button type="button" class="gold" id="enter">Enter</button></div></div>';
}
function viewOnboard() {
  return '<div class="shell"><figure class="hero"><img src="' + DUSK + '" alt=""></figure>' +
    '<div class="brand">Kindl<span>ing</span></div><p class="kicker">A quiet start</p>' +
    '<h1>You found out late. That changes the map.</h1>' +
    '<p class="lead">Three taps. Then this space is yours. Nothing leaves this phone.</p>' +
    '<div class="card"><label class="field" for="name">What should we call you?</label>' +
    '<input id="name" maxlength="40" placeholder="First name — optional" value="' + esc(state.name) + '"></div>' +
    '<div class="card"><p class="kicker">What resonates?</p>' + choices(WIRING, "wiring") + "</div>" +
    '<div class="card"><p class="kicker">When did you find out?</p>' + choices(FOUND, "found") + "</div>" +
    '<div class="card"><p class="kicker">How should the coach sound?</p>' + choices(VOICES, "voice") + "</div>" +
    '<button type="button" class="gold" id="finish">Light the kindling</button>' +
    '<p class="sale">Not therapy. Not a diagnosis. Not for crisis.</p></div>';
}
function viewHome() {
  const o = offer();
  const day = new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" });
  return chrome(
    '<figure class="hero"><img src="' + DUSK + '" alt=""></figure>' +
    '<div class="brand">Kindl<span>ing</span></div><p class="kicker">' + esc(day) + "</p>" +
    "<h1>" + esc(greeting()) + "</h1><p class=\"lead\">" + esc(homeLine()) + "</p>" +
    '<div class="card"><img class="coach" src="' + COACH + '" alt="The Kindling coach">' +
    '<p class="kicker spark">Coach</p><p class="lead">She speaks from this card.</p>' +
    "<p>" + esc(capacity()) + "</p><h2>" + esc(o.title) + "</h2><p class=\"lead\">" + esc(o.copy) + "</p>" +
    '<button type="button" class="quiet" id="hear" style="margin-bottom:.6rem">Hear the coach</button>' +
    '<button type="button" class="gold" data-go="' + o.go + '">Open</button></div>' +
    '<div class="card"><p class="kicker">Capacity weather</p>' +
    '<p class="muted">Energy</p>' + chips(ENERGY, "energy") +
    '<p class="muted">Sensory</p>' + chips(SENSORY, "sensory") +
    '<p class="muted">Social battery</p>' + chips(SOCIAL, "social") +
    '<p class="muted">Trauma load</p>' + chips(TRAUMA, "trauma") + "</div>"
  );
}
function viewSession() {
  const step = STEPS[state.step] || STEPS[0];
  return chrome(
    mast("Session", '<button type="button" class="ghost" data-go="home">Home</button>') +
    '<p class="lead">Step ' + (state.step + 1) + " of 3</p>" +
    '<div class="card"><p class="kicker spark">' + esc(step[0]) + "</p><p>" + esc(step[1]) + "</p>" +
    '<button type="button" class="quiet" id="hear">Hear this</button>' +
    '<textarea id="field" maxlength="600">' + esc(state[step[2]]) + "</textarea></div>" +
    '<div style="display:flex;gap:.5rem">' +
    (state.step ? '<button type="button" class="quiet" id="back">Back</button>' : "") +
    '<button type="button" class="gold" id="next">' + (state.step === 2 ? "Save & finish" : "Next") + "</button></div>"
  );
}
function viewSkills() {
  return chrome(
    mast("Skills", '<button type="button" class="ghost" data-go="home">Home</button>') +
    '<p class="lead">Short practice cards. Take what helps. Leave the rest.</p>' +
    SKILLS.map(([id, title, copy]) =>
      '<div class="card"><p class="kicker spark">' + esc(title) + "</p><p>" + esc(copy) + "</p>" +
      '<button type="button" class="quiet" data-clip="skill-' + id + '" style="margin:.6rem 0">Hear this</button>' +
      '<button type="button" class="quiet" data-try="' + id + '">' + (state.skillsTried.includes(id) ? "Noted" : "Try this") + "</button></div>"
    ).join("")
  );
}
function viewNotes() {
  const list = state.notes.slice().reverse();
  const body = list.length ? list.map((n) => {
    const when = new Date(n.at).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    return '<article class="note"><p class="kicker">' + esc(when) + "</p>" +
      "<p><strong>Matters:</strong> " + esc(n.matters || "—") + "</p>" +
      "<p><strong>In the way:</strong> " + esc(n.block || "—") + "</p>" +
      "<p><strong>Experiment:</strong> " + esc(n.experiment || "—") + "</p></article>";
  }).join("") : '<p class="muted">No notes yet. A session will write the first one.</p>';
  return chrome(
    mast("Notes", '<button type="button" class="ghost" data-go="home">Home</button>') +
    '<p class="lead">Every session leaves a page you can re-read. Working memory gets a copy.</p>' + body
  );
}
function viewRestart() {
  const opts = [
    ["Lights low. Notifications off. One room. No new input for ten minutes.", "Reduce input"],
    ["Feet on floor. Long exhale. Water. No decisions yet.", "Downshift the body"],
    ["One physical action only: stand, drink, or put the object in your hand. That is the whole plan.", "One next inch"]
  ];
  return chrome(
    mast("Restart", '<button type="button" class="ghost" data-go="home">Home</button>') +
    '<p class="lead">Everything fell over. That\'s expected. Shame is not a feature.</p>' +
    opts.map(([note, label]) => '<button type="button" class="choice" data-note="' + esc(note) + '">' + label + "</button>").join("") +
    '<button type="button" class="choice" data-go="home">Just sit here</button>' +
    (state.restartNote ? '<p>' + esc(state.restartNote) + "</p>" : "")
  );
}
function viewHelp() {
  return '<div class="shell help">' + mast("Help", '<button type="button" class="ghost" data-go="home">Home</button>') +
    '<div class="card"><p class="kicker">Please read this</p><h2>Not therapy. Not crisis care.</h2>' +
    '<p class="lead">Kindling is a self-care coach for late-identified adults. It is not therapy, not a diagnosis, not medication advice, and not a substitute for a doctor or emergency service.</p></div>' +
    '<div class="card"><p class="kicker">If you are in danger</p><p class="lead">Australia — <a href="tel:000">000</a> · Lifeline <a href="tel:131114">13 11 14</a> · Beyond Blue <a href="tel:1300224636">1300 22 4636</a><br>US — <a href="tel:911">911</a> · <a href="tel:988">988</a><br>UK — <a href="tel:999">999</a> · <a href="tel:116123">116 123</a></p></div>' +
    '<div class="card"><p class="kicker">This file only</p><p class="lead">One HTML file. Buy once. Open it in any browser. Notes stay on this device. Nothing is sent to a server.</p>' +
    '<button type="button" class="quiet" id="wipe">Start over on this device</button></div></div>';
}

function render(keepScroll) {
  stopVoice();
  const y = keepScroll ? window.scrollY : 0;
  const s = screen();
  const html = {
    cover: viewCover, onboard: viewOnboard, home: viewHome, session: viewSession,
    skills: viewSkills, notes: viewNotes, restart: viewRestart, help: viewHelp
  }[s]();
  document.getElementById("app").innerHTML = html;
  if (keepScroll) window.scrollTo(0, y);
  else window.scrollTo(0, 0);
  bind();
}
function bind() {
  const enter = document.getElementById("enter");
  if (enter) enter.addEventListener("click", () => { state.coverSeen = true; save(); render(); });
  const finish = document.getElementById("finish");
  if (finish) finish.addEventListener("click", () => {
    const name = document.getElementById("name");
    if (name) state.name = name.value.slice(0, 40);
    state.onboarded = true;
    state.coverSeen = true;
    state.view = "home";
    save();
    render();
  });
  document.querySelectorAll("[data-set]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state[btn.getAttribute("data-set")] = btn.getAttribute("data-val");
      save();
      render(true);
    });
  });
  document.querySelectorAll("[data-go]").forEach((btn) => {
    btn.addEventListener("click", () => go(btn.getAttribute("data-go")));
  });
  const hear = document.getElementById("hear");
  if (hear) hear.addEventListener("click", () => {
    if (screen() === "session") {
      playClips([["session-matters", "session-block", "session-experiment"][state.step]]);
    } else {
      playClips(["home-" + state.wiring, capacityId(), offerId()]);
    }
  });
  document.querySelectorAll("[data-clip]").forEach((btn) => {
    btn.addEventListener("click", () => playClips([btn.getAttribute("data-clip")]));
  });
  document.querySelectorAll("[data-try]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-try");
      if (!state.skillsTried.includes(id)) state.skillsTried.push(id);
      save();
      render();
    });
  });
  const field = document.getElementById("field");
  if (field) {
    const key = STEPS[state.step][2];
    field.addEventListener("input", () => { state[key] = field.value.slice(0, 600); save(); });
  }
  const next = document.getElementById("next");
  if (next) next.addEventListener("click", () => {
    if (state.step < 2) { state.step += 1; save(); render(); return; }
    state.notes.push({
      at: new Date().toISOString(),
      matters: state.matters.trim(),
      block: state.block.trim(),
      experiment: state.experiment.trim()
    });
    state.notes = state.notes.slice(-80);
    state.matters = ""; state.block = ""; state.experiment = ""; state.step = 0;
    state.view = "notes";
    save();
    render();
  });
  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => { state.step = Math.max(0, state.step - 1); save(); render(); });
  document.querySelectorAll("[data-note]").forEach((btn) => {
    btn.addEventListener("click", () => { state.restartNote = btn.getAttribute("data-note"); save(); render(); });
  });
  const wipe = document.getElementById("wipe");
  if (wipe) wipe.addEventListener("click", () => {
    if (!confirm("Start over on this device? Your notes here will be cleared.")) return;
    state = defaults();
    state.coverSeen = false;
    localStorage.removeItem(KEY);
    render();
  });
  const name = document.getElementById("name");
  if (name && screen() === "onboard") {
    name.addEventListener("input", () => { state.name = name.value.slice(0, 40); save(); });
  }
}
render();
})();
</script>
</body>
</html>
