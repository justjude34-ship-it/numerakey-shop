<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1020" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Nova — a private, on-device ADHD companion. Not medical care." />
<title>Nova — ADHD companion</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@380;460;560&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b1020;
    --bg-2: #10162a;
    --card: #161d30;
    --card-2: #1c2438;
    --line: rgba(244, 239, 230, 0.08);
    --line-strong: rgba(244, 239, 230, 0.14);
    --text: #f4efe6;
    --muted: #9aa3b8;
    --faint: #6e7890;
    --blue: #6d93f6;
    --blue-deep: #4f78e6;
    --coral: #e07a6a;
    --teal: #3dceb4;
    --gold: #e6c07b;
    --purple: #a78bfa;
    --green: #5dce8a;
    --pink: #f08bb0;
    --amber: #e6b15c;
    --shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
    --r: 22px;
    --nav: 74px;
    --serif: "Fraunces", "Iowan Old Style", Palatino, serif;
    --sans: "Outfit", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070b16; color: var(--text); font-family: var(--sans); }
  button, input, textarea { font-family: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--blue); outline-offset: 2px;
  }
  .app {
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    background:
      radial-gradient(900px 420px at 80% -10%, rgba(120, 80, 180, 0.18), transparent 55%),
      radial-gradient(700px 380px at -10% 8%, rgba(70, 110, 200, 0.16), transparent 50%),
      var(--bg);
    position: relative; overflow: hidden;
  }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 18px 8px; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .mark {
    width: 36px; height: 36px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #ffe7a8, #ff8a3d 42%, #6a2cff 78%);
    box-shadow: 0 0 0 2px rgba(255, 200, 120, 0.25), 0 0 18px rgba(255, 140, 60, 0.35);
    position: relative; flex: none;
  }
  .mark::after {
    content: ""; position: absolute; inset: 11px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0 30%, transparent 62%);
  }
  .brand h1 { font-family: var(--serif); font-size: 22px; margin: 0; font-weight: 560; letter-spacing: -0.02em; }
  .kicker { color: var(--muted); font-size: 13px; letter-spacing: 0.01em; }
  main { padding: 6px 16px calc(var(--nav) + 22px); }
  .screen { display: none; animation: rise 0.35s ease; }
  .screen.on { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h2.display {
    font-family: var(--serif); font-weight: 560; letter-spacing: -0.03em;
    font-size: 34px; margin: 8px 0 6px; line-height: 1.05;
  }
  .lede { color: var(--muted); margin: 0 0 16px; line-height: 1.45; font-size: 15.5px; }
  .hero {
    position: relative; border-radius: 26px; overflow: hidden; min-height: 188px;
    margin: 4px 0 14px; box-shadow: var(--shadow);
    background:
      radial-gradient(120px 80px at 62% 28%, rgba(255, 236, 190, 0.95), transparent 70%),
      radial-gradient(220px 140px at 70% 20%, rgba(255, 170, 90, 0.55), transparent 70%),
      radial-gradient(280px 180px at 28% 70%, rgba(90, 70, 180, 0.55), transparent 70%),
      radial-gradient(240px 160px at 88% 78%, rgba(180, 70, 50, 0.4), transparent 72%),
      linear-gradient(160deg, #1a1440 0%, #0e1a3a 48%, #1a1030 100%);
  }
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 40% 20%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 82% 40%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,.45) 50%, transparent 51%);
  }
  .hero-copy { position: relative; padding: 28px 20px 20px; }
  .eyebrow { color: var(--gold); letter-spacing: 0.16em; font-size: 12px; font-weight: 560; margin: 0 0 6px; }
  .hero h2 { font-family: var(--serif); font-size: 42px; margin: 0 0 8px; font-weight: 560; }
  .hero p { margin: 0; max-width: 30ch; color: #efe8dc; line-height: 1.4; font-size: 16px; }
  .chip-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(16, 20, 36, 0.72); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 12px 8px 8px; backdrop-filter: blur(8px);
  }
  .pill b { font-family: var(--serif); font-size: 18px; font-weight: 560; }
  .ico {
    width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none;
  }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent 40%), var(--card);
    border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 12px 0;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
  }
  .card h3 { font-family: var(--serif); font-size: 22px; margin: 0 0 6px; font-weight: 560; }
  .sub { color: var(--muted); margin: 0; line-height: 1.4; font-size: 14.5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    border: 1px solid var(--line); border-radius: 20px; padding: 16px 14px 14px;
    text-align: left; min-height: 124px; background: var(--card-2); color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .tile:active { transform: scale(0.98); }
  .tile .glyph { font-size: 22px; margin-bottom: 10px; display: block; }
  .tile strong { display: block; font-size: 16.5px; font-weight: 560; margin-bottom: 4px; }
  .tile span { color: var(--muted); font-size: 13px; line-height: 1.3; }
  .tile.nova { background: linear-gradient(180deg, #1a2744, #141c30); }
  .tile.focus { background: linear-gradient(180deg, #12352f, #132028); }
  .tile.steps { background: linear-gradient(180deg, #2a2614, #1a1c16); }
  .tile.calm { background: linear-gradient(180deg, #321c24, #1c1620); }
  .statrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .stat {
    border-radius: 999px; padding: 7px 12px; font-size: 13.5px; border: 1px solid var(--line);
    background: #12182a;
  }
  .stat.coral { color: #f0b0a6; background: rgba(224, 122, 106, 0.12); border-color: rgba(224,122,106,0.25); }
  .stat.blue { color: #c9d7ff; background: rgba(109, 147, 246, 0.12); border-color: rgba(109,147,246,0.25); }
  .bar { height: 8px; border-radius: 99px; background: #243049; overflow: hidden; margin: 8px 0 4px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6d93f6, #3dceb4); border-radius: inherit; }
  .row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .ghost, .primary, .soft {
    border-radius: 999px; border: 1px solid var(--line); background: transparent;
    padding: 12px 16px; font-size: 15.5px; font-weight: 560;
  }
  .primary {
    background: linear-gradient(180deg, #7ea2ff, #5b86f3); color: #0c1224; border-color: transparent;
    box-shadow: 0 8px 20px rgba(91, 134, 243, 0.28);
  }
  .primary.block, .ghost.block { width: 100%; }
  .soft { background: #12182a; }
  .mode {
    width: 100%; text-align: left; background: #12182a; border: 1px solid var(--line);
    border-radius: 18px; padding: 14px 16px; margin: 8px 0; display: flex; justify-content: space-between; align-items: center;
  }
  .mode small { display: block; color: var(--muted); margin-top: 3px; font-size: 13.5px; font-weight: 380; }
  .mode.on { border-color: rgba(109,147,246,0.7); box-shadow: 0 0 0 1px rgba(109,147,246,0.35) inset; }
  .heart {
    width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center;
    background: rgba(167, 139, 250, 0.16); color: #c4b5fd; margin-right: 10px;
  }
  .remind { display: flex; align-items: flex-start; }
  .chips { display: flex; gap: 8px; overflow: auto; padding-bottom: 4px; }
  .chip {
    border-radius: 999px; border: 1px solid var(--line); background: #141b2e; color: var(--text);
    padding: 10px 14px; white-space: nowrap; font-size: 14px;
  }
  .chip.on { border-color: rgba(109,147,246,0.8); background: #1a2748; }
  .log { display: flex; flex-direction: column; gap: 10px; min-height: 180px; margin: 12px 0; }
  .bubble {
    max-width: 88%; background: #1a2236; border: 1px solid var(--line); border-radius: 18px;
    padding: 12px 14px; line-height: 1.45;
  }
  .bubble.me { align-self: flex-end; background: #2a4ea8; border-color: transparent; }
  .who { display: flex; gap: 8px; align-items: center; color: #b7c6ee; font-size: 13px; margin-bottom: 6px; }
  .tag { border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
  .composer { display: flex; gap: 8px; align-items: center; }
  .composer input, .field, textarea.field {
    width: 100%; background: #12182a; border: 1px solid var(--line); border-radius: 18px;
    padding: 14px 16px; font-size: 15.5px;
  }
  textarea.field { min-height: 84px; resize: vertical; }
  .send {
    width: 52px; height: 52px; border-radius: 50%; border: 0; flex: none;
    background: linear-gradient(180deg, #7ea2ff, #5b86f3); color: #0c1224; font-size: 20px;
  }
  .disclaimer { color: var(--faint); font-size: 12.5px; line-height: 1.45; margin: 12px 2px 0; }
  .ring-wrap {
    background: #12182a; border: 1px solid var(--line); border-radius: 28px; padding: 22px 16px 18px;
    text-align: center; margin-top: 8px;
  }
  .badge {
    display: inline-block; background: rgba(224, 122, 106, 0.16); color: #f0b0a6;
    border-radius: 999px; padding: 4px 10px; font-size: 13px; margin-bottom: 8px;
  }
  .ring { width: 220px; height: 220px; margin: 8px auto; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring .time {
    position: absolute; inset: 0; display: grid; place-items: center; align-content: center;
  }
  .ring .time b { font-family: var(--serif); font-size: 52px; font-weight: 520; letter-spacing: -0.03em; }
  .ring .time span { color: var(--muted); }
  .actions { display: flex; gap: 10px; justify-content: center; }
  .actions .primary { min-width: 140px; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .presence {
    display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 14px;
  }
  .dotpulse {
    width: 10px; height: 10px; border-radius: 50%; background: var(--teal);
    box-shadow: 0 0 0 0 rgba(61, 206, 180, 0.6);
  }
  .dotpulse.on { animation: pulse 1.8s ease-out infinite; }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 10px rgba(61, 206, 180, 0); }
    100% { box-shadow: 0 0 0 0 rgba(61, 206, 180, 0); }
  }
  .moods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mood {
    text-align: left; background: #12182a; border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; min-height: 72px;
  }
  .mood.on { border-color: rgba(109,147,246,0.85); background: #1a2744; }
  .mood i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .slider { width: 100%; accent-color: var(--blue); }
  .breath {
    width: 210px; height: 210px; margin: 18px auto; border-radius: 50%;
    border: 8px solid #35508f; display: grid; place-items: center; text-align: center;
    background: #141c30; transition: transform 4s ease;
  }
  .breath b { font-family: var(--serif); font-size: 36px; font-weight: 520; }
  .breath.go { animation: breathe 16s ease-in-out infinite; }
  @keyframes breathe {
    0% { transform: scale(0.86); border-color: #35508f; }
    25% { transform: scale(1); border-color: #6d93f6; }
    50% { transform: scale(1); border-color: #3dceb4; }
    75% { transform: scale(0.86); border-color: #a78bfa; }
    100% { transform: scale(0.86); border-color: #35508f; }
  }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric { background: #12182a; border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  .metric span { color: var(--muted); font-size: 13px; }
  .metric b { display: block; font-family: var(--serif); font-size: 32px; margin-top: 6px; font-weight: 520; }
  .spark { width: 100%; height: 92px; display: block; }
  .task { border-top: 1px solid var(--line); padding: 12px 0; }
  .task h4 { margin: 0 0 6px; font-size: 16px; }
  .step { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; color: var(--muted); }
  .step input { margin-top: 3px; accent-color: var(--gold); width: 18px; height: 18px; }
  .step.done span { text-decoration: line-through; color: var(--faint); }
  nav.dock {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(480px, 100%);
    background: rgba(10, 14, 26, 0.92); backdrop-filter: blur(16px);
    border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(7, 1fr);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); z-index: 5;
  }
  nav.dock button {
    background: none; border: 0; color: var(--faint); font-size: 10.5px; padding: 4px 0;
    display: grid; justify-items: center; gap: 3px;
  }
  nav.dock button.on { color: var(--blue); }
  nav.dock svg { width: 22px; height: 22px; }
  .toast {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(12px);
    background: #1d2740; border: 1px solid var(--line-strong); color: var(--text);
    padding: 10px 14px; border-radius: 999px; opacity: 0; pointer-events: none; transition: 0.25s ease;
    z-index: 6; font-size: 14px; max-width: 90%;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .namebtn { background: none; border: 0; padding: 0; font: inherit; color: inherit; }
  @media (prefers-reduced-motion: reduce) {
    .screen, .breath.go, .dotpulse.on { animation: none !important; }
    .tile:active { transform: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <h1>Nova</h1>
    </div>
    <div class="kicker">ADHD companion</div>
  </header>
  <main>
    <section class="screen on" id="home"></section>
    <section class="screen" id="nova"></section>
    <section class="screen" id="focus"></section>
    <section class="screen" id="tasks"></section>
    <section class="screen" id="mood"></section>
    <section class="screen" id="tools"></section>
    <section class="screen" id="insights"></section>
  </main>
  <nav class="dock" aria-label="Primary">
    <button data-go="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>Home</button>
    <button data-go="nova" aria-label="Nova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 18c2-6 4-9 6-9s4 3 6 9"/><path d="M8 14h8"/></svg>Nova</button>
    <button data-go="focus" aria-label="Focus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>Focus</button>
    <button data-go="tasks" aria-label="Tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 7h11M8 12h11M8 17h11"/><path d="M4 7h.01M4 12h.01M4 17h.01"/></svg>Tasks</button>
    <button data-go="mood" aria-label="Mood"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.6-7 10-7 10Z"/></svg>Mood</button>
    <button data-go="tools" aria-label="Tools"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 14c2-1 3-4 4-4s2 3 4 3 3-5 4-5 2 3 4 2"/></svg>Tools</button>
    <button data-go="insights" aria-label="Insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V10M12 19V5M19 19v-7"/></svg>Insights</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
const KEY = "nova-adhd-v1";
const MOODS = [
  ["Great", "#5dce8a"], ["Good", "#3dceb4"], ["Okay", "#e6c07b"], ["Low", "#e07a6a"],
  ["Rough", "#f08bb0"], ["Anxious", "#a78bfa"], ["Scattered", "#6d93f6"], ["Tired", "#9aa3b8"]
];
const today = () => new Date().toISOString().slice(0, 10);
const dayDiff = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const load = () => {
  const base = {
    name: "Judith", mode: "friend", streak: 1, shields: 1, last: today(),
    focusMins: 0, moods: [], tasks: [], stepsDone: 0, tasksDone: 0,
    chats: { friend: [], coach: [], therapist: [] }
  };
  try { return Object.assign(base, JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch { return base; }
};
let state = load();
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function touchStreak() {
  const d = dayDiff(state.last, today());
  if (d === 0) return;
  if (d === 1) state.streak += 1;
  else if (d === 2 && state.shields > 0) { state.shields -= 1; toast("Shield used. Still counts. Brains rest."); }
  else { state.streak = 1; state.shields = 1; }
  state.last = today();
  save();
}
touchStreak();
let screen = "home";
let moodPick = "Okay";
let energy = 5;
let focusCap = 5;
let taskEnergy = "Medium";
let timer = { secs: 25 * 60, total: 25 * 60, running: false, id: null };
let breathOn = false;
let breathId = null;
const $ = (s) => document.querySelector(s);
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2200);
}
function haptic() { if (navigator.vibrate) navigator.vibrate(10); }
function greet() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}
function openCount() { return state.tasks.reduce((n, t) => n + t.steps.filter(s => !s.done).length, 0); }
function doneSteps() { return state.tasks.reduce((n, t) => n + t.steps.filter(s => s.done).length, 0); }
function go(name) {
  screen = name;
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === name));
  document.querySelectorAll("nav.dock button").forEach(b => b.classList.toggle("on", b.dataset.go === name));
  render();
  haptic();
}
document.querySelectorAll("nav.dock button").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
function render() {
  if (screen === "home") renderHome();
  if (screen === "nova") renderNova();
  if (screen === "focus") renderFocus();
  if (screen === "tasks") renderTasks();
  if (screen === "mood") renderMood();
  if (screen === "tools") renderTools();
  if (screen === "insights") renderInsights();
}
function renderHome() {
  const steps = doneSteps();
  const total = state.tasks.reduce((n, t) => n + t.steps.length, 0);
  const pct = total ? Math.round(steps / total * 100) : 0;
  const moodsToday = state.moods.filter(m => m.date === today()).length;
  $("#home").innerHTML = `
    <div class="hero">
      <div class="hero-copy">
        <p class="eyebrow">${greet().toUpperCase()}</p>
        <h2><button class="namebtn" id="rename">${esc(state.name)}</button></h2>
        <p>Soft structure for a brain that runs on interest, novelty, and care.</p>
      </div>
    </div>
    <div class="chip-row">
      <div class="pill"><span class="ico" style="background:#3a221c;color:#e07a6a">🔥</span><div><div style="color:var(--muted);font-size:12px">Streak</div><b>${state.streak} day${state.streak === 1 ? "" : "s"}</b></div></div>
      <div class="pill"><span class="ico" style="background:#1d2438;color:var(--gold)">◈</span><div><div style="color:var(--muted);font-size:12px">Shields</div><b>${state.shields}</b></div></div>
    </div>
    <div class="card">
      <div class="row-between">
        <div class="heart">✦</div>
        <div style="flex:1">
          <h3 style="margin:0">How's your headspace?</h3>
          <p class="sub">A 20-second check-in helps Nova meet you where you are.</p>
        </div>
      </div>
      <button class="primary block" id="to-check" style="margin-top:14px">Check in →</button>
    </div>
    <div class="grid2">
      <button class="tile nova" data-jump="nova"><span class="glyph">💬</span><strong>Talk to Nova</strong><span>Coach · friend · support</span></button>
      <button class="tile focus" data-jump="focus"><span class="glyph">⏱</span><strong>Focus sprint</strong><span>Timer + body double</span></button>
      <button class="tile steps" data-jump="tasks"><span class="glyph">☰</span><strong>Tiny steps</strong><span>Break the mountain</span></button>
      <button class="tile calm" data-jump="tools"><span class="glyph">〰</span><strong>Calm tools</strong><span>Breathe & ground</span></button>
    </div>
    <div class="card">
      <div class="row-between"><h3>Today's progress</h3><span class="stat teal" style="color:var(--teal)">${openCount()} open</span></div>
      <div class="row-between" style="margin-top:10px"><span>Tiny steps</span><span>${steps}/${total}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="statrow">
        <span class="stat blue">${state.focusMins} min focused</span>
        <span class="stat coral">${moodsToday} mood log${moodsToday === 1 ? "" : "s"}</span>
      </div>
      <button class="ghost block" data-jump="tasks">☰ Manage tasks</button>
    </div>
    <div class="card">
      <h3>Companion modes</h3>
      ${modeButton("friend", "Friend", "Warm, casual, zero lecture")}
      ${modeButton("coach", "Coach", "Structure, sprints, next steps")}
      ${modeButton("therapist", "Therapist", "Reflective, paced, deeper")}
    </div>
    <div class="card">
      <div class="remind"><div class="heart">♡</div><div><h3 style="margin:0">Gentle reminder</h3><p class="sub">Productivity is optional. Regulation and rest count as progress.</p></div></div>
      <button class="primary block" data-jump="insights" style="margin-top:14px;background:#1a2748;color:#9eb6ff;box-shadow:none">View insights</button>
    </div>`;
  bindJumps();
  $("#to-check").onclick = () => go("mood");
  $("#rename").onclick = rename;
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; save(); toast(label(state.mode) + " mode"); render(); });
}
function modeButton(id, title, blurb) {
  return `<button class="mode ${state.mode === id ? "on" : ""}" data-mode="${id}"><div><strong>${title}</strong><small>${blurb}</small></div><span>→</span></button>`;
}
function label(m) { return m[0].toUpperCase() + m.slice(1); }
function renderNova() {
  const log = state.chats[state.mode] || [];
  $("#nova").innerHTML = `
    <h2 class="display">Nova</h2>
    <p class="lede">ADHD-aware companion · private on-device chat</p>
    <button class="soft" id="newchat">↺ New chat</button>
    <div class="chips" style="margin-top:12px">
      ${["friend", "coach", "therapist"].map(m => `<button class="chip ${state.mode === m ? "on" : ""}" data-mode="${m}"><strong>${label(m)}</strong><div style="color:var(--muted);font-size:12px">${m === "friend" ? "Warm & casual" : m === "coach" ? "Action-focused" : "Reflective"}</div></button>`).join("")}
    </div>
    <div class="log" id="log">
      ${log.length ? log.map(m => m.role === "me"
        ? `<div class="bubble me">${esc(m.text)}</div>`
        : `<div class="bubble"><div class="who">✦ Nova <span class="tag">${label(state.mode)}</span></div>${esc(m.text)}</div>`).join("")
        : `<div class="bubble"><div class="who">✦ Nova <span class="tag">${label(state.mode)}</span></div>${esc(hello())}</div>`}
    </div>
    <div class="chips" id="quicks">
      <button class="chip" data-q="I'm overwhelmed">I'm overwhelmed</button>
      <button class="chip" data-q="Can't start">Can't start</button>
      <button class="chip" data-q="Focus help">Focus help</button>
    </div>
    <div class="composer" style="margin-top:10px">
      <input id="say" placeholder="Tell Nova what's going on..." />
      <button class="send" id="send" aria-label="Send">➤</button>
    </div>
    <p class="disclaimer">Nova is an AI-style companion for reflection, structure, and ADHD-friendly coping skills. It is not medical care, diagnosis, or a substitute for a clinician. If you are in danger, contact local emergency services.</p>`;
  document.querySelectorAll("#nova [data-mode]").forEach(b => b.onclick = () => { state.mode = b.dataset.mode; save(); render(); });
  $("#newchat").onclick = () => { state.chats[state.mode] = []; save(); render(); };
  $("#send").onclick = send;
  $("#say").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  document.querySelectorAll("#quicks [data-q]").forEach(b => b.onclick = () => { $("#say").value = b.dataset.q; send(); });
  const logEl = $("#log"); if (logEl) logEl.scrollTop = logEl.scrollHeight;
}
function hello() {
  const lines = {
    friend: "Hey. No lecture incoming. What's actually going on?",
    coach: "We can make this small. What's the one thing sitting heaviest?",
    therapist: "I'm here, and we can go slowly. What feels closest right now?"
  };
  return lines[state.mode];
}
function replyFor(text) {
  const t = text.toLowerCase();
  const bank = {
    friend: {
      over: "That makes sense. How long has this been sitting on you? You don't have to fix it in this message.",
      start: "Can't start is information, not a character flaw. What's the smallest visible thing — open the file, put the mug down, name the pile?",
      focus: "Focus isn't a moral quality. Want a 10-minute sit with me, or a smaller first step?",
      else: "I hear you. We can stay with this, or shrink it to one next thing. Your call."
    },
    coach: {
      over: "Overwhelm usually means the pile is still one object. Name the pile in five words, then we cut it to a 2-minute start.",
      start: "Start line: set a 5-minute timer and touch the task. Stopping after 5 is a win.",
      focus: "Sprint offer: 25 minutes, body double on, phone face down. I'll hold the clock.",
      else: "Next step only. What can be done in under ten minutes, with the energy you have now?"
    },
    therapist: {
      over: "Overwhelm is a nervous system doing its job loudly. What does your body want before any task — water, stillness, or a person nearby?",
      start: "Starting trouble often protects you from a feeling. What feeling shows up at the edge of this task?",
      focus: "Attention wanders when something unfinished is louder. We can note it, then return. No scolding.",
      else: "Thank you for saying it. What would feel like enough for the next few minutes?"
    }
  };
  const pack = bank[state.mode];
  if (/overwhelm|too much|can't cope|spiral/.test(t)) return pack.over;
  if (/start|avoid|stuck|paralys/.test(t)) return pack.start;
  if (/focus|distract|timer|sprint/.test(t)) return pack.focus;
  return pack.else;
}
function send() {
  const input = $("#say");
  const text = (input.value || "").trim();
  if (!text) return;
  state.chats[state.mode] = state.chats[state.mode] || [];
  state.chats[state.mode].push({ role: "me", text });
  state.chats[state.mode].push({ role: "nova", text: replyFor(text) });
  save();
  render();
}
function renderFocus() {
  const m = String(Math.floor(timer.secs / 60)).padStart(2, "0");
  const s = String(timer.secs % 60).padStart(2, "0");
  const pct = timer.total ? (timer.total - timer.secs) / timer.total : 0;
  const c = 2 * Math.PI * 96;
  const dash = c * (1 - pct);
  $("#focus").innerHTML = `
    <h2 class="display">Focus studio</h2>
    <p class="lede">Short sprints beat heroic marathons. Body doubling welcome.</p>
    <div class="ring-wrap">
      <span class="badge">Focus</span>
      <div class="ring">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="96" stroke="#243049" stroke-width="10" fill="none"/>
          <circle cx="110" cy="110" r="96" stroke="#6d93f6" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${dash.toFixed(1)}"/>
        </svg>
        <div class="time"><b>${m}:${s}</b><span>${timer.running ? "Nova is here" : "Ready when you are"}</span></div>
      </div>
      <div class="actions">
        <button class="primary" id="toggle">${timer.running ? "Pause" : "▶ Start"}</button>
        <button class="ghost" id="reset">↺ Reset</button>
      </div>
      <div class="presence"><span class="dotpulse ${timer.running ? "on" : ""}"></span>${timer.running ? "Body double on. I'm sitting with you. You can stop." : "When you start, I'll stay. No commentary."}</div>
    </div>
    <div class="card">
      <h3>Presets</h3>
      <div class="presets">
        ${[5, 15, 25, 50].map(n => `<button class="chip ${timer.total === n * 60 && !timer.running ? "on" : ""}" data-min="${n}">${n} min</button>`).join("")}
      </div>
    </div>`;
  $("#toggle").onclick = toggleTimer;
  $("#reset").onclick = () => { stopTimer(false); timer.secs = timer.total; render(); };
  document.querySelectorAll("[data-min]").forEach(b => b.onclick = () => {
    if (timer.running) return;
    timer.total = timer.secs = Number(b.dataset.min) * 60;
    render();
  });
}
function toggleTimer() {
  if (timer.running) { stopTimer(false); render(); return; }
  timer.running = true;
  timer.id = setInterval(() => {
    timer.secs -= 1;
    if (timer.secs <= 0) { timer.secs = 0; finishSprint(); }
    if (screen === "focus") renderFocus();
  }, 1000);
  render();
}
function stopTimer(done) {
  timer.running = false;
  if (timer.id) clearInterval(timer.id);
  timer.id = null;
  if (!done && screen === "focus") renderFocus();
}
function finishSprint() {
  stopTimer(true);
  const mins = Math.round(timer.total / 60);
  state.focusMins += mins;
  save();
  toast(mins + " minutes counted. That was enough.");
  timer.secs = timer.total;
  render();
}
function shrink(text, energyLevel) {
  const name = text.replace(/\.$/, "");
  if (energyLevel === "Low") return [
    "Open it. Just the lid, file, or tab. Stop there if you want.",
    "Do two minutes of " + name + ", then you may leave.",
    "Optional: note the next crumb for later-you."
  ];
  if (energyLevel === "High") return [
    "Clear a 25-minute window for " + name + ".",
    "Do the first real chunk, not the whole mountain.",
    "Park leftovers on a list so they stop orbiting.",
    "Close the loop with one sentence: done enough."
  ];
  return [
    "Name the very first physical action for " + name + ".",
    "Do only that action.",
    "If there's juice left, take one more crumb. If not, stop on purpose."
  ];
}
function renderTasks() {
  $("#tasks").innerHTML = `
    <h2 class="display">Tiny steps</h2>
    <p class="lede">Mountains become foothills. Nova auto-breaks anything you add.</p>
    <div class="card">
      <h3>✦ Break a task</h3>
      <input class="field" id="task" placeholder="e.g. File taxes, clean kitchen, finish deck" />
      <div class="chips" style="margin:12px 0">
        ${["Low", "Medium", "High"].map(e => `<button class="chip ${taskEnergy === e ? "on" : ""}" data-en="${e}">${e} energy</button>`).join("")}
      </div>
      <button class="primary block" id="add">+ Add & break down</button>
    </div>
    <div class="card" id="tasklist">
      ${state.tasks.length ? state.tasks.map((t, i) => `
        <div class="task">
          <h4>${esc(t.title)} <span style="color:var(--faint);font-weight:380">· ${t.energy}</span></h4>
          ${t.steps.map((s, j) => `<label class="step ${s.done ? "done" : ""}"><input type="checkbox" data-ti="${i}" data-si="${j}" ${s.done ? "checked" : ""}/><span>${esc(s.text)}</span></label>`).join("")}
        </div>`).join("") : `<div style="text-align:center;padding:18px 8px"><h3>No tasks yet</h3><p class="sub">Add something you've been avoiding — we'll shrink it.</p></div>`}
    </div>`;
  document.querySelectorAll("[data-en]").forEach(b => b.onclick = () => { taskEnergy = b.dataset.en; render(); });
  $("#add").onclick = () => {
    const title = $("#task").value.trim();
    if (!title) return toast("Name the mountain first.");
    const last = state.moods[state.moods.length - 1];
    const level = last && last.energy <= 3 ? "Low" : taskEnergy;
    state.tasks.unshift({ title, energy: level, steps: shrink(title, level).map(text => ({ text, done: false })) });
    save();
    toast(level === "Low" ? "Shrunk for low energy. First step is tiny." : "Broken into foothills.");
    render();
  };
  document.querySelectorAll("[data-ti]").forEach(box => box.onchange = () => {
    const t = state.tasks[box.dataset.ti];
    const step = t.steps[box.dataset.si];
    step.done = box.checked;
    if (step.done) state.stepsDone += 1;
    if (t.steps.every(s => s.done)) state.tasksDone += 1;
    save();
    render();
  });
}
function renderMood() {
  $("#mood").innerHTML = `
    <h2 class="display">Mood check-in</h2>
    <p class="lede">Name it to tame it. Patterns beat perfection.</p>
    <div class="card">
      <h3>How do you feel right now?</h3>
      <div class="moods">
        ${MOODS.map(([n, c]) => `<button class="mood ${moodPick === n ? "on" : ""}" data-mood="${n}"><i style="background:${c}"></i>${n}</button>`).join("")}
      </div>
      <div class="row-between" style="margin-top:16px"><span>Energy</span><span id="enlab">${energy}/10</span></div>
      <input class="slider" id="en" type="range" min="0" max="10" value="${energy}" />
      <div class="row-between"><span>Focus capacity</span><span id="folab">${focusCap}/10</span></div>
      <input class="slider" id="fo" type="range" min="0" max="10" value="${focusCap}" />
      <textarea class="field" id="note" placeholder="Optional note — triggers, wins, context..."></textarea>
      <button class="primary block" id="save-mood" style="margin-top:12px">Save check-in</button>
    </div>`;
  document.querySelectorAll("[data-mood]").forEach(b => b.onclick = () => { moodPick = b.dataset.mood; render(); });
  $("#en").oninput = e => { energy = +e.target.value; $("#enlab").textContent = energy + "/10"; };
  $("#fo").oninput = e => { focusCap = +e.target.value; $("#folab").textContent = focusCap + "/10"; };
  $("#save-mood").onclick = () => {
    state.moods.push({ date: today(), mood: moodPick, energy, focus: focusCap, note: $("#note").value.trim() });
    touchStreak();
    state.last = today();
    save();
    toast("Saved. That's the whole job.");
    go("home");
  };
}
function renderTools() {
  $("#tools").innerHTML = `
    <h2 class="display">Calm tools</h2>
    <p class="lede">Regulation first. The list can wait.</p>
    <div class="grid2">
      <div class="card" style="margin:0"><h3 style="font-size:18px">Name 3 sounds</h3><p class="sub">Interrupt the spiral with audio</p></div>
      <div class="card" style="margin:0"><h3 style="font-size:18px">Feet on floor</h3><p class="sub">Weight, temperature, contact</p></div>
    </div>
    <div class="card" style="text-align:center">
      <div class="breath ${breathOn ? "go" : ""}" id="ball"><div><b id="phase">Inhale</b><div class="sub">4 seconds</div></div></div>
      <button class="primary" id="breath">${breathOn ? "Stop" : "Start breathing"}</button>
      <p class="sub" style="margin-top:10px">Inhale 4 · hold 4 · exhale 4 · hold 4. Stop whenever.</p>
    </div>`;
  $("#breath").onclick = () => {
    breathOn = !breathOn;
    clearInterval(breathId);
    if (breathOn) {
      const phases = ["Inhale", "Hold", "Exhale", "Hold"];
      let i = 0;
      breathId = setInterval(() => { i = (i + 1) % 4; const p = document.getElementById("phase"); if (p) p.textContent = phases[i]; }, 4000);
    }
    render();
  };
}
function renderInsights() {
  const recent = state.moods.slice(-8);
  const w = 320, h = 92;
  const pts = recent.map((m, i) => {
    const x = recent.length === 1 ? w / 2 : (i / (recent.length - 1)) * (w - 16) + 8;
    const y = h - 10 - (m.energy / 10) * (h - 24);
    return [x, y];
  });
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  $("#insights").innerHTML = `
    <h2 class="display">Insights</h2>
    <p class="lede">Patterns over perfection — gentle data for curious brains.</p>
    <div class="metrics">
      <div class="metric"><span>Streak</span><b style="color:var(--coral)">${state.streak}d</b></div>
      <div class="metric"><span>Focus mins</span><b style="color:var(--blue)">${state.focusMins}</b></div>
      <div class="metric"><span>Steps done</span><b style="color:var(--teal)">${state.stepsDone}</b></div>
      <div class="metric"><span>Tasks done</span><b style="color:var(--gold)">${state.tasksDone}</b></div>
    </div>
    <div class="card">
      <h3>Energy & focus</h3>
      ${recent.length ? `<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="#6d93f6" stroke-width="3" stroke-linecap="round"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#e6c07b"/>`).join("")}</svg><p class="sub">Last ${recent.length} check-in${recent.length === 1 ? "" : "s"}. Shields left: ${state.shields}.</p>` : `<p class="sub" style="padding:28px 0">Log a few mood check-ins to see your trend.</p>`}
    </div>
    <p class="disclaimer">On this phone only. Nothing is sent anywhere. Not a diagnosis, not a medical record.</p>`;
}
function rename() {
  const next = prompt("What should Nova call you?", state.name);
  if (next && next.trim()) { state.name = next.trim(); save(); render(); }
}
function bindJumps() {
  document.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => go(b.dataset.jump));
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
