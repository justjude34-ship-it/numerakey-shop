<style>
:root{
  --navy:#040d1e;--navy-deep:#020814;--raised:#0a1a33;
  --gold:#c9a45c;--gold-bright:#e4c57a;--soft:#e8d4a0;
  --display:"Cinzel",Palatino,"Palatino Linotype",Georgia,serif;
  --body:"Cormorant Garamond",Palatino,Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh;background:var(--navy);color:var(--soft)}
body{font-family:var(--body);font-size:1.125rem;line-height:1.55;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
button{cursor:pointer}
img{max-width:100%}
::selection{background:color-mix(in oklab,var(--gold) 40%,transparent);color:var(--navy-deep)}
h1,h2{font-family:var(--display);font-weight:500;text-wrap:balance}
p{text-wrap:pretty}
a{color:var(--gold);text-decoration:none}
.paw{width:1rem;height:1rem;fill:currentColor}
.rule{display:flex;align-items:center;justify-content:center;gap:.75rem;color:var(--gold)}
.rule span{height:1px;width:2.5rem;background:color-mix(in oklab,var(--gold) 50%,transparent)}
.rule .paw{width:.875rem;height:.875rem;opacity:.9}
.kicker{margin:0;text-align:center;font-family:var(--display);font-size:.62rem;letter-spacing:.38em;text-transform:uppercase;color:color-mix(in oklab,var(--gold) 70%,transparent)}
.site-header{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:1.25rem 1.25rem 0}
.brand{display:inline-flex;align-items:center;gap:.6rem;min-height:2.75rem;color:var(--gold);letter-spacing:.28em;text-transform:uppercase;font-family:var(--display);font-size:.68rem}
.brand .paw{width:1rem;height:1rem}
.site-header nav{display:flex;align-items:center;gap:.15rem;font-family:var(--display);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in oklab,var(--gold) 80%,transparent)}
.site-header nav a{display:inline-flex;align-items:center;min-height:2.75rem;padding:0 .4rem}
.site-header nav a:hover{color:var(--gold-bright)}
.dot{color:color-mix(in oklab,var(--gold) 30%,transparent)}
.hero{position:relative;min-height:100dvh;background-color:#040d1e;background-image:var(--hero-image);background-position:center;background-size:contain;background-repeat:no-repeat}
.vignette{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to bottom,#040d1ee6 0%,#040d1e66 18%,transparent 36%,transparent 58%,#040d1ecc 82%,#040d1ef2 100%),
  radial-gradient(ellipse at center,transparent 40%,#040d1eaa 100%)}
.hero-inner{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column}
.hero-copy{padding:2rem 1.5rem 0;text-align:center}
.hero h1{margin:.9rem 0 1.1rem;color:var(--gold);font-size:clamp(1.35rem,5.4vw,3rem);letter-spacing:.22em;text-transform:uppercase;line-height:1.15}
.hero-foot{margin-top:auto;padding:0 1.5rem max(2.5rem,env(safe-area-inset-bottom));text-align:center;max-width:34rem;margin-left:auto;margin-right:auto}
.lede{font-size:1.2rem;line-height:1.35;color:color-mix(in oklab,var(--soft) 95%,transparent)}
.fine{margin:1.15rem 0 0;font-family:var(--display);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in oklab,var(--gold) 55%,transparent)}
body.is-page{background-color:var(--navy);background-image:linear-gradient(#040d1ee8,#040d1ef5),var(--animals-image);background-position:center,center 42%;background-size:auto,auto min(70vh,640px);background-repeat:no-repeat}
.page{min-height:100dvh;display:flex;flex-direction:column}
.page main{flex:1}
.sheet{width:min(40rem,100%);margin:0 auto;padding:2rem 1.25rem 1rem}
.sheet h1{margin:.7rem 0 0;text-align:center;color:var(--gold);font-size:clamp(1.35rem,4vw,1.85rem);letter-spacing:.16em;text-transform:uppercase}
.intro,.meta{text-align:center;color:color-mix(in oklab,var(--soft) 90%,transparent)}
.meta{margin-top:.8rem}
.field{display:block;margin-top:1.6rem}
.field span,legend{display:block;margin-bottom:.45rem;font-family:var(--display);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:color-mix(in oklab,var(--gold) 72%,transparent)}
.field i{font-style:normal;letter-spacing:.08em;color:color-mix(in oklab,var(--gold) 45%,transparent)}
fieldset{border:0;margin:1.7rem 0 0;padding:0}
input,textarea{width:100%;border:1px solid color-mix(in oklab,var(--gold) 28%,transparent);background:color-mix(in oklab,var(--raised) 82%,transparent);color:var(--soft);padding:.7rem .9rem;font-family:var(--body);font-size:1.15rem;outline:none}
textarea{resize:vertical;min-height:6rem}
input:focus,textarea:focus{border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:color-mix(in oklab,var(--gold) 35%,transparent)}
.choice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.choice-row button{min-height:3.25rem;border:1px solid color-mix(in oklab,var(--gold) 22%,transparent);background:color-mix(in oklab,var(--raised) 55%,transparent);color:color-mix(in oklab,var(--gold) 75%,transparent);padding:.55rem .35rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem}
.choice-row button strong{font-family:var(--display);font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.choice-row button em{font-style:normal;font-size:.95rem;color:color-mix(in oklab,var(--gold) 55%,transparent)}
.choice-row button.on{border-color:var(--gold);background:color-mix(in oklab,var(--gold) 12%,transparent);color:var(--gold)}
.alert{text-align:center;color:var(--gold)}
.actions{display:flex;justify-content:center;margin:2rem 0 1rem}
.actions.row{flex-wrap:wrap;gap:.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:3rem;padding:0 1.6rem;border:1px solid transparent;font-family:var(--display);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;transition:background-color .15s,border-color .15s,color .15s,transform .15s}
.btn.solid{background:var(--gold);color:var(--navy)}
.btn.solid:hover{background:var(--gold-bright)}
.btn.line{border-color:color-mix(in oklab,var(--gold) 45%,transparent);color:var(--gold);background:transparent}
.btn.line:hover{border-color:var(--gold);background:color-mix(in oklab,var(--gold) 10%,transparent)}
.btn.ghost,.btn.text{background:transparent;color:color-mix(in oklab,var(--gold) 70%,transparent);padding:0 .7rem}
.btn.text{min-height:2.75rem;font-size:.62rem}
.btn:active{transform:scale(.98)}
.center{text-align:center}
.site-footer{margin-top:auto;padding:1.5rem 1.25rem 2rem;text-align:center}
.site-footer p{margin:.8rem 0 0;font-family:var(--display);font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in oklab,var(--gold) 48%,transparent)}
.seal-hero{display:flex;flex-direction:column;align-items:center;margin-top:2.2rem}
.medallion{width:7rem;height:7rem;border-radius:50%;border:1px solid color-mix(in oklab,var(--gold) 38%,transparent);background:color-mix(in oklab,var(--raised) 80%,transparent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:2.6rem;color:var(--gold)}
.title{margin:.9rem 0 0;font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-size:.85rem}
.essence{max-width:28rem;text-align:center;font-style:italic}
.seals{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:1.6rem}
.seals div{border:1px solid color-mix(in oklab,var(--gold) 22%,transparent);background:color-mix(in oklab,var(--raised) 60%,transparent);padding:1rem .5rem;text-align:center}
.seals b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:500;color:var(--gold)}
.seals span{font-family:var(--display);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in oklab,var(--gold) 62%,transparent)}
.block{margin-top:2.2rem}
.block h2,.panel h2,.letter h2,.bond h2,.label{font-family:var(--display);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:500}
.panel h2,.bond h2,.label{color:color-mix(in oklab,var(--gold) 72%,transparent);font-size:.62rem}
.split{display:grid;gap:1rem;margin-top:1.4rem}
.panel,.bond, .harmony li{border:1px solid color-mix(in oklab,var(--gold) 18%,transparent);background:color-mix(in oklab,var(--raised) 42%,transparent);padding:1.1rem 1.15rem}
.bond{margin-top:1.6rem;background:color-mix(in oklab,var(--gold) 6%,transparent);border-color:color-mix(in oklab,var(--gold) 28%,transparent)}
.subhead{font-family:var(--display);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1.6rem 0}
.facts div{border:1px solid color-mix(in oklab,var(--gold) 16%,transparent);padding:.9rem 1rem}
.facts dt{font-family:var(--display);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in oklab,var(--gold) 55%,transparent)}
.facts dd{margin:.25rem 0 0}
.harmony{list-style:none;margin:1rem 0 0;padding:0;display:grid;gap:.6rem}
.harmony a{font-family:var(--display);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase}
.letter{margin-top:2rem}
.letter h2{text-align:center;margin:1.4rem 0 1rem}
.prose{white-space:pre-wrap}
.method{white-space:normal}
.method h2{margin:1.4rem 0 .3rem}
.circle{list-style:none;margin:1.8rem 0 0;padding:0;display:grid;gap:.65rem}
.circle a{display:flex;align-items:center;gap:.9rem;padding:.85rem .9rem;background:color-mix(in oklab,var(--raised) 62%,transparent);box-shadow:0 0 0 1px color-mix(in oklab,var(--gold) 22%,transparent)}
.circle a:hover{box-shadow:0 0 0 1px color-mix(in oklab,var(--gold) 48%,transparent)}
.circle .num{width:3rem;height:3rem;flex:none;border-radius:50%;border:1px solid color-mix(in oklab,var(--gold) 32%,transparent);display:flex;align-items:center;justify-content:center;font-family:var(--display);color:var(--gold)}
.circle strong{display:block;font-family:var(--display);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem}
.circle em{display:block;margin-top:.15rem;font-style:normal;color:color-mix(in oklab,var(--soft) 75%,transparent)}
.confirm{text-align:center;color:var(--soft)}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
.rise-2{animation-delay:.18s}.rise-3{animation-delay:.3s}.rise-4{animation-delay:.42s}
@media(min-width:640px){
  .site-header{padding:1.6rem 2rem 0}
  .hero h1{letter-spacing:.3em}
  .seals{grid-template-columns:repeat(4,1fr)}
  .split{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:repeat(3,1fr)}
  .sheet{padding-top:2.4rem}
}
@media(max-width:420px){
  .site-header{flex-wrap:wrap}
  .brand{letter-spacing:.18em}
}
@media(prefers-reduced-motion:reduce){
  .rise{animation:none}
  .btn{transition:none}
}
@media print{
  body,.hero,body.is-page{background:#fff!important;color:#1c1408}
  .no-print,.site-header,.site-footer,.vignette{display:none!important}
  .hero{min-height:0;background:none}
  .sheet{width:auto}
  h1,.title,.medallion,.seals b,a{color:#6e5424}
  .panel,.bond,.harmony li,.facts div,.seals div{border-color:#d7c49a;background:#fff}
  .prose,p{color:#1c1408}
}
</style>
</head>

  '<svg viewBox="0 0 32 32" aria-hidden="true" class="paw"><ellipse cx="9.2" cy="11.2" rx="3.1" ry="3.8"/><ellipse cx="14.2" cy="7.4" rx="3.15" ry="3.9"/><ellipse cx="20.4" cy="7.4" rx="3.15" ry="3.9"/><ellipse cx="25.2" cy="11.2" rx="3.1" ry="3.8"/><path d="M10.2 16.8c1.6-2.4 4-3.6 6.8-3.6s5.2 1.2 6.8 3.6c1.4 2.2 1.6 4.8.4 6.6-1.2 1.8-3.6 2.8-7.2 2.8s-6-.9-7.2-2.8c-1.2-1.8-1-4.4.4-6.6Z"/></svg>';

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}

function uid() {
  if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return `p_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

function loadPets() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed.filter((p) => p && typeof p.name === "string" && p.id);
  } catch {
    return [];
  }
}

function savePets(pets) {
  localStorage.setItem(KEY, JSON.stringify(pets));
}

function upsertPet(pet) {
  const pets = loadPets();
  const idx = pets.findIndex((p) => p.id === pet.id);
  const next = idx >= 0 ? pets.map((p) => (p.id === pet.id ? pet : p)) : [pet, ...pets];
  savePets(next);
  return next;
}

function getPet(id) {
  return loadPets().find((p) => p.id === id) ?? null;
}

function removePet(id) {
  savePets(loadPets().filter((p) => p.id !== id));
}

function rule() {
  return `<div class="rule" aria-hidden="true"><span></span>${PAW}<span></span></div>`;
}

function header() {
  return `<header class="site-header">
    <a class="brand" href="#/">
      ${PAW}
      <span>Paws of Destiny</span>
    </a>
    <nav>
      <a href="#/circle">The Circle</a>
      <span class="dot" aria-hidden="true">·</span>
      <a href="#/method">How it is read</a>
    </nav>
  </header>`;
}

function footer() {
  return `<footer class="site-footer">
    ${rule()}
    <p>One file · Private to this browser · Never a subscription</p>
  </footer>`;
}

function parseHash() {
  const raw = (location.hash || "#/").replace(/^#/, "");
  const parts = raw.split("/").filter(Boolean);
  if (parts[0] === "read") return { name: "read" };
  if (parts[0] === "circle") return { name: "circle" };
  if (parts[0] === "method") return { name: "method" };
  if (parts[0] === "reading" && parts[1]) return { name: "reading", id: decodeURIComponent(parts[1]) };
  return { name: "home" };
}

function home() {
  return `<section class="hero">
    <div class="vignette"></div>
    <div class="hero-inner">
      ${header()}
      <div class="hero-copy">
        <p class="kicker rise rise-1">A private reading</p>
        <h1 class="rise rise-1">Paws of Destiny</h1>
        ${rule()}
      </div>
      <div class="hero-foot">
        <p class="lede rise rise-2">A numerology for the animal who shares your life — their name, their date, the nature they were born with.</p>
        <a class="btn solid rise rise-3" href="#/read">Read my pet</a>
        <p class="fine rise rise-4">The whole app is this one file. Readings stay on this device.</p>
      </div>
    </div>
  </section>`;
}

function pageWrap(inner) {
  return `<div class="page">
    ${header()}
    <main>${inner}</main>
    ${footer()}
  </div>`;
}

function readForm() {
  return pageWrap(`<form id="read-form" class="sheet" novalidate>
    <p class="kicker">The reading</p>
    <h1>Name the soul</h1>
    ${rule()}
    <p class="intro">The numbers live in the letters of their name. A date, if you have one, writes the path.</p>
    <label class="field">
      <span>Their name</span>
      <input name="name" maxlength="60" autocomplete="off" placeholder="As you call them" required />
    </label>
    <fieldset>
      <legend>Kind</legend>
      <div class="choice-row" data-choice="species">
        <button type="button" data-value="cat" class="on" aria-pressed="true"><strong>Cat</strong><em>The quiet court</em></button>
        <button type="button" data-value="dog" aria-pressed="false"><strong>Dog</strong><em>The open hall</em></button>
        <button type="button" data-value="other" aria-pressed="false"><strong>Other</strong><em>Every other soul</em></button>
      </div>
      <input type="hidden" name="species" value="cat" />
    </fieldset>
    <label class="field" id="other-kind" hidden>
      <span>What they are</span>
      <input name="otherKind" maxlength="40" placeholder="Rabbit, horse, bird…" />
    </label>
    <fieldset>
      <legend>The date</legend>
      <div class="choice-row" data-choice="dateKind">
        <button type="button" data-value="born" class="on" aria-pressed="true">Born</button>
        <button type="button" data-value="adopted" aria-pressed="false">Came home</button>
        <button type="button" data-value="unknown" aria-pressed="false">I do not know</button>
      </div>
      <input type="hidden" name="dateKind" value="born" />
    </fieldset>
    <label class="field" id="date-field">
      <span id="date-label">Date of birth</span>
      <input type="date" name="date" />
    </label>
    <label class="field">
      <span>Your name <i>(for the bond)</i></span>
      <input name="keeperName" maxlength="40" autocomplete="given-name" placeholder="Optional" />
    </label>
    <label class="field">
      <span>A few words about them <i>(optional)</i></span>
      <textarea name="notes" maxlength="400" rows="3" placeholder="What they are like, in your own words"></textarea>
    </label>
    <p id="form-error" class="alert" role="alert" hidden></p>
    <div class="actions"><button class="btn solid" type="submit">Read my pet</button></div>
  </form>`);
}

function letterFor(pet, reading) {
  if (pet.letter && pet.letter.trim()) return pet.letter.trim();
  const base = composedLetter(pet, reading);
  const extra = [];
  if (pet.notes && pet.notes.trim()) {
    extra.push(
      `You wrote of them: “${pet.notes.trim()}” The chart does not argue with a keeper who has been paying attention. It gives the pattern a name.`,
    );
  }
  if (reading.bond && pet.keeperName) {
    const bond = MEANINGS[reading.bond];
    extra.push(
      `The bond with ${pet.keeperName.trim()} is ${reading.bond}, ${bond.title}. ${bond.essence} Two names reduced together — a climate, not a verdict.`,
    );
  }
  extra.push(ELEMENTS[elementOf(reading)]);
  extra.push(`The days that suit this nature: ${luckyBlend(reading).join(", ")}.`);
  extra.push("Keep this file. The numbers do not change. The understanding does.");
  return `${base}\n\n${extra.join("\n\n")}`;
}

function readingView(id) {
  const pet = getPet(id);
  if (!pet) {
    return pageWrap(`<div class="sheet center">
      <h1>This reading has gone</h1>
      ${rule()}
      <p class="intro">It is not in this browser. Begin a new one, or open the circle.</p>
      <div class="actions"><a class="btn solid" href="#/read">Read my pet</a></div>
    </div>`);
  }
  const reading = computeReading(pet);
  const pathN = reading.lifePath ?? reading.pinnacle;
  const path = MEANINGS[pathN];
  const expression = MEANINGS[reading.expression];
  const soul = MEANINGS[reading.soul];
  const personality = MEANINGS[reading.personality];
  const element = elementOf(reading);
  const days = luckyBlend(reading);
  const kind = speciesLabel(pet);
  const dateLine = formatPetDate(pet);
  const others = loadPets().filter((p) => p.id !== pet.id);
  const letter = letterFor(pet, reading);
  const bond = reading.bond && pet.keeperName
    ? `<section class="bond">
        <h2>The bond with ${esc(pet.keeperName)} · ${reading.bond}</h2>
        <p class="subhead">${esc(MEANINGS[reading.bond].title)}</p>
        <p>${esc(MEANINGS[reading.bond].essence)} Two names reduced together. The current between you is ${esc(MEANINGS[reading.bond].title.toLowerCase())} — treat it as a climate, not a trick.</p>
      </section>`
    : "";
  const circle = others.length
    ? `<section class="block">
        <h2 class="label">The circle</h2>
        <ul class="harmony">
          ${others
            .map((other) => {
              const otherReading = computeReading(other);
              const otherPath = otherReading.lifePath ?? otherReading.pinnacle;
              const h = harmonyOf(pathN, otherPath);
              return `<li>
                <a href="#/reading/${encodeURIComponent(other.id)}">${esc(other.name)}</a>
                <p class="subhead">${esc(h.title)}</p>
                <p>${esc(h.note)}</p>
              </li>`;
            })
            .join("")}
        </ul>
      </section>`
    : "";

  return pageWrap(`<article class="sheet reading" id="reading">
    <p class="kicker">A reading for</p>
    <h1>${esc(pet.name)}</h1>
    ${rule()}
    <p class="meta">${esc(kind)}${dateLine ? ` · ${esc(dateLine)}` : " · date unwritten"}</p>
    <div class="seal-hero">
      <div class="medallion">${pathN}</div>
      <p class="title">${esc(path.title)}</p>
      <p class="essence">${esc(path.essence)}</p>
    </div>
    <div class="seals">
      <div><b>${reading.expression}</b><span>Expression</span></div>
      <div><b>${reading.soul}</b><span>Soul</span></div>
      <div><b>${reading.personality}</b><span>Seen</span></div>
      <div><b>${pathN}</b><span>${reading.lifePath ? "Path" : "Pinnacle"}</span></div>
    </div>
    <section class="block">
      <h2>The path</h2>
      <p>${esc(path.path)}</p>
      <p>${esc(speciesLine(pet, pathN))}</p>
    </section>
    <section class="split">
      <div class="panel">
        <h2>Soul · ${soul.n} · ${esc(soul.title)}</h2>
        <p>${esc(soul.soul)}</p>
      </div>
      <div class="panel">
        <h2>What the world sees · ${personality.n} · ${esc(personality.title)}</h2>
        <p>${esc(personality.personality)}</p>
      </div>
    </section>
    <section class="panel">
      <h2>The name · ${expression.n} · ${esc(expression.title)}</h2>
      <p>${esc(expression.expression)}</p>
    </section>
    <dl class="facts">
      <div><dt>Element</dt><dd>${esc(element)}</dd></div>
      <div><dt>Gift</dt><dd>${esc(path.gift)}</dd></div>
      <div><dt>Lucky days</dt><dd>${esc(days.join(" · "))}</dd></div>
    </dl>
    <p>${esc(ELEMENTS[element])}</p>
    <p>What they need from you: ${esc(path.need)}</p>
    ${bond}
    ${circle}
    <section class="letter">
      ${rule()}
      <h2>A letter</h2>
      <div class="prose">${esc(letter)}</div>
    </section>
    <div class="actions row no-print">
      <a class="btn solid" href="#/read">Read another</a>
      <a class="btn line" href="#/circle">The Circle</a>
      <button type="button" class="btn ghost" id="print-reading">Print this reading</button>
      <button type="button" class="btn text" id="remove-reading" data-id="${esc(pet.id)}">Remove this reading</button>
    </div>
    <p class="confirm no-print" id="remove-confirm" hidden>
      Remove ${esc(pet.name)} from this browser?
      <button type="button" class="btn text" id="remove-yes" data-id="${esc(pet.id)}">Yes, remove it</button>
      <button type="button" class="btn text" id="remove-no">Keep it</button>
    </p>
  </article>`);
}

function circleView() {
  const pets = loadPets();
  const body = pets.length
    ? `<ul class="circle">
        ${pets
          .map((pet) => {
            const reading = computeReading(pet);
            const n = reading.lifePath ?? reading.pinnacle;
            const meaning = MEANINGS[n];
            const dateLine = formatPetDate(pet);
            return `<li><a href="#/reading/${encodeURIComponent(pet.id)}">
              <span class="num">${n}</span>
              <span>
                <strong>${esc(pet.name)}</strong>
                <em>${esc(speciesLabel(pet))} · ${esc(meaning.title)}${dateLine ? ` · ${esc(dateLine)}` : ""}</em>
              </span>
            </a></li>`;
          })
          .join("")}
      </ul>
      <div class="actions"><a class="btn line" href="#/read">Read another</a></div>`
    : `<div class="center">
        <p class="intro">The circle is waiting for a name. The first reading you make becomes the beginning of the house.</p>
        <div class="actions"><a class="btn solid" href="#/read">Read my pet</a></div>
      </div>`;
  return pageWrap(`<div class="sheet">
    <p class="kicker">Saved in this browser</p>
    <h1>The Circle</h1>
    ${rule()}
    ${body}
  </div>`);
}

function methodView() {
  return pageWrap(`<article class="sheet">
    <p class="kicker">The method</p>
    <h1>How it is read</h1>
    ${rule()}
    <div class="prose method">
      <p>Paws of Destiny uses classical Pythagorean numerology. Each letter of a name holds a number from 1 to 9. Those numbers are added, then reduced — except for the master numbers 11, 22 and 33, which are left standing.</p>
      <h2>Expression</h2>
      <p>Every letter of the name. The nature the world meets — the signature of the animal as they move through a house.</p>
      <h2>Soul</h2>
      <p>The vowels. The inner weather: what they came to feel, not what they came to perform.</p>
      <h2>What is seen</h2>
      <p>The consonants. The coat they wear for strangers — comedy, dignity, the stare.</p>
      <h2>Path</h2>
      <p>The date of birth, or the day they came home. Year, month and day reduced to a single current. If the date is unknown, the name still carries a full chart; the path is taken from the pinnacle of the other numbers.</p>
      <h2>The bond</h2>
      <p>Optional. Your name and theirs, added and reduced. A climate between two beings — not a verdict, a weather report.</p>
      <h2>This file</h2>
      <p>This is the whole app. Open the file in any browser. Readings are stored only in that browser, on that device. Nothing is sent anywhere. There is no account and no subscription. To keep a reading on paper, print it from the chart.</p>
      <p>This is a private companion, not a diagnosis.</p>
    </div>
    <div class="actions"><a class="btn solid" href="#/read">Read my pet</a></div>
  </article>`);
}

function render() {
  const path = parseHash();
  document.body.classList.toggle("is-home", path.name === "home");
  document.body.classList.toggle("is-page", path.name !== "home");
  const app = document.getElementById("app");
  if (path.name === "home") app.innerHTML = home();
  else if (path.name === "read") app.innerHTML = readForm();
  else if (path.name === "circle") app.innerHTML = circleView();
  else if (path.name === "method") app.innerHTML = methodView();
  else app.innerHTML = readingView(path.id);
  if (path.name === "read") {
    const name = document.querySelector('input[name="name"]');
    if (name) name.focus();
  }
  window.scrollTo(0, 0);
}

function setChoice(row, value) {
  const name = row.dataset.choice;
  row.querySelectorAll("button").forEach((btn) => {
    const on = btn.dataset.value === value;
    btn.classList.toggle("on", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  });
  const hidden = row.parentElement.querySelector(`input[name="${name}"]`);
  if (hidden) hidden.value = value;
  if (name === "species") {
    document.getElementById("other-kind").hidden = value !== "other";
  }
  if (name === "dateKind") {
    const field = document.getElementById("date-field");
    const label = document.getElementById("date-label");
    field.hidden = value === "unknown";
    label.textContent = value === "adopted" ? "The day they came home" : "Date of birth";
  }
}

function installPreviewBridge() {
  if (window.parent === window) return;
  let parentOrigin = null;
  try {
    const candidate = document.referrer || (location.ancestorOrigins && location.ancestorOrigins[0]) || "";
    if (!candidate) return;
    const url = new URL(candidate.includes("://") ? candidate : `https://${candidate}`);
    const host = url.hostname.toLowerCase();
    const ok =
      host === "grok.com" ||
      host.endsWith(".grok.com") ||
      host === "localhost" ||
      host === "127.0.0.1" ||
      host.endsWith(".grok-sandbox.com");
    if (!ok) return;
    parentOrigin = url.origin;
  } catch {
    return;
  }
  const post = (message) => window.parent.postMessage(message, parentOrigin);
  const report = () => {
    post({
      channel: "grok-preview-bridge",
      version: 1,
      type: "location",
      path: (location.pathname || "/") + (location.hash || ""),
      search: location.search || "",
      hash: location.hash || "",
    });
  };
  window.addEventListener("message", (event) => {
    if (event.source !== window.parent || event.origin !== parentOrigin) return;
    const data = event.data;
    if (!data || data.channel !== "grok-preview-bridge" || data.version !== 1) return;
    if (data.type === "hello") {
      report();
      post({ channel: "grok-preview-bridge", version: 1, type: "ready" });
    }
    if (data.type === "navigate" && typeof data.path === "string") {
      const path = data.path.startsWith("/") ? data.path : `/${data.path}`;
      if (path.startsWith("/paws-of-destiny.html")) {
        location.hash = path.split("#")[1] ? `#${path.split("#")[1]}` : "#/";
      } else {
        location.hash = path === "/" ? "#/" : `#${path}`;
      }
      report();
    }
  });
  window.addEventListener("hashchange", report);
  report();
  post({ channel: "grok-preview-bridge", version: 1, type: "ready" });
}

function boot() {
  installPreviewBridge();
  const app = document.getElementById("app");
  app.addEventListener("click", (event) => {
    const choice = event.target.closest("[data-choice] button");
    if (choice) {
      setChoice(choice.closest("[data-choice]"), choice.dataset.value);
      return;
    }
    if (event.target.id === "print-reading") {
      window.print();
      return;
    }
    if (event.target.id === "remove-reading") {
      document.getElementById("remove-reading").hidden = true;
      document.getElementById("remove-confirm").hidden = false;
      return;
    }
    if (event.target.id === "remove-no") {
      document.getElementById("remove-confirm").hidden = true;
      document.getElementById("remove-reading").hidden = false;
      return;
    }
    if (event.target.id === "remove-yes") {
      removePet(event.target.dataset.id);
      location.hash = "#/circle";
    }
  });

  app.addEventListener("submit", (event) => {
    const form = event.target;
    if (form.id !== "read-form") return;
    event.preventDefault();
    const data = new FormData(form);
    const name = String(data.get("name") || "").trim();
    const species = String(data.get("species") || "cat");
    const dateKind = String(data.get("dateKind") || "born");
    const date = String(data.get("date") || "");
    const error = document.getElementById("form-error");
    if (!name) {
      error.hidden = false;
      error.textContent = "A name is the whole chart. Please enter one.";
      return;
    }
    if (dateKind !== "unknown" && !date) {
      error.hidden = false;
      error.textContent = "Add a date, or choose “I do not know”.";
      return;
    }
    const pet = {
      id: uid(),
      name,
      species,
      otherKind: species === "other" ? String(data.get("otherKind") || "").trim() : undefined,
      dateKind,
      date: dateKind === "unknown" ? undefined : date,
      keeperName: String(data.get("keeperName") || "").trim() || undefined,
      notes: String(data.get("notes") || "").trim() || undefined,
      createdAt: Date.now(),
    };
    upsertPet(pet);
    location.hash = `#/reading/${encodeURIComponent(pet.id)}`;
  });

  window.addEventListener("hashchange", render);
  if (!location.hash) location.hash = "#/";
  render();
}

boot();

</script>
