<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07151d">
<meta name="description" content="SoulSync — a private companion for mood, journal and tiny habits. A self-reflection tool, not therapy.">
<title>SoulSync</title>
<script>(function(){try{var t=localStorage.getItem("soulsync-theme");var d=t==="dark"||(t!=="light"&&t!=="system")||(t==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d)document.documentElement.classList.add("dark")}catch(e){}})();</script>
<style>
:root{
  --bg:#f6efe9;--fg:#1d2f3a;--card:#fffaf5;--muted:#f0e3da;--mfg:#5d6e78;--primary:#b5651d;--pfg:#fff8f0;
  --accent:#7a5fc0;--destructive:#b4505a;--border:rgba(29,47,58,.1);--input:rgba(29,47,58,.16);--ring:#b5651d;
  --help:#b4505a;--hfg:#fff8f0;
  --m1:#6a62b8;--m2:#8c6bbd;--m3:#b9728f;--m4:#cc7f3a;--m5:#b8892a;
  --shadow:0 0 0 1px rgba(29,47,58,.06),0 2px 10px -2px rgba(29,47,58,.08);
  --wash:linear-gradient(180deg,#fbeedd 0%,#f4eaee 45%,#e6eff1 100%);
  --display:Fraunces,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:Outfit,"Segoe UI",ui-sans-serif,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --r:14px;
}
.dark{
  --bg:#07151d;--fg:#f3eee8;--card:#0e2330;--muted:#163244;--mfg:#9db3bd;--primary:#f2b676;--pfg:#2a1a08;
  --accent:#b9a0e8;--destructive:#e28f92;--border:rgba(243,238,232,.1);--input:rgba(243,238,232,.16);--ring:#f2b676;
  --help:#e28f92;--hfg:#2a1214;
  --m1:#7f78c8;--m2:#a98bd3;--m3:#d4a0b8;--m4:#eeb27c;--m5:#f6cf7a;
  --shadow:0 0 0 1px rgba(243,238,232,.08),0 8px 24px -8px rgba(0,0,0,.45);
  --wash:radial-gradient(120% 50% at 50% 0%,rgba(242,182,118,.16),transparent 62%),radial-gradient(80% 45% at 95% 8%,rgba(185,160,232,.15),transparent 60%),linear-gradient(180deg,#0a2230 0%,#071722 55%,#06121a 100%);
}
.dark .card{background:linear-gradient(160deg,rgba(18,44,60,.86),rgba(11,30,42,.86));backdrop-filter:blur(8px)}
.dark .btn{box-shadow:0 6px 18px -6px rgba(242,182,118,.45)}
.dark .btn.out,.dark .btn.ghost,.dark .btn.help{box-shadow:none}
.banner{position:relative;margin:0 0 20px;border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.banner img{display:block;width:100%;height:170px;object-fit:cover;object-position:50% 70%}
.hv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;opacity:0;transition:opacity 1s ease}.hv.on{opacity:1}
@media(prefers-reduced-motion:reduce){.hv{display:none}}
.banner .bt{position:absolute;inset:0;padding:18px 20px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(to top,rgba(5,16,24,.72),rgba(5,16,24,.15) 70%,transparent);color:#f6f1ea}
.banner .bt p{opacity:.85;font-size:.85rem}.banner .bt h1{font-size:1.9rem;color:#fff}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg)}
body{margin:0;min-height:100dvh;background:var(--bg);background-image:var(--wash);background-attachment:fixed;color:var(--fg);font-family:var(--sans);line-height:1.55;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.03em;text-wrap:balance}
p{text-wrap:pretty}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
.mut{color:var(--mfg)}.pri{color:var(--primary)}
.sm{font-size:.875rem}.xs{font-size:.75rem}
.eyebrow{font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mfg)}
h1.t{font-size:2rem;line-height:1.15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stack>*+*{margin-top:20px}
.stack-sm>*+*{margin-top:8px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--primary);color:var(--pfg);font-size:.9rem;font-weight:500;transition:opacity .15s;text-align:center}
.btn:hover{opacity:.9}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.out{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1px var(--input)}
.btn.out:hover{background:var(--muted);opacity:1}
.btn.ghost{background:transparent;color:var(--fg)}.btn.ghost:hover{background:var(--muted);opacity:1}
.btn.help{background:var(--help);color:var(--hfg)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.8rem}
.btn.block{width:100%}.btn.icon{width:44px;padding:0}
.chip{min-height:36px;padding:0 14px;border-radius:999px;background:var(--muted);font-size:.85rem;transition:background .15s}
.chip.on{background:var(--primary);color:var(--pfg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
input.f,textarea.f{width:100%;min-height:44px;padding:10px 16px;border-radius:12px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--input);outline:none}
input.f:focus,textarea.f:focus{box-shadow:inset 0 0 0 2px var(--ring)}
textarea.f{resize:vertical;line-height:1.6}
input.f::placeholder,textarea.f::placeholder{color:var(--mfg)}
label.l{display:block;font-size:.85rem;font-weight:500;margin-bottom:6px}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:20px}
.card.tight{padding:16px}
a.card:hover,button.card:hover{background:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.spread{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

/* shell */
.side{display:none}
.mtop{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px)}
.wm{display:inline-flex;align-items:center;gap:8px}
.wm svg{width:28px;height:28px;color:var(--primary)}
.wm span{font-family:var(--display);font-size:1.1rem;font-weight:500;letter-spacing:-.02em}
.circ{display:grid;place-items:center;width:44px;height:44px;border-radius:50%}
.circ:hover,.circ.on{background:var(--muted)}
.circ svg,.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
main.m{max-width:42rem;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
nav.bn{position:fixed;inset:auto 0 0 0;z-index:20;border-top:1px solid var(--border);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
nav.bn ul{display:grid;grid-template-columns:repeat(5,1fr)}
nav.bn a{display:flex;min-height:56px;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:500;color:var(--mfg)}
nav.bn a.on{color:var(--primary)}
@media(min-width:768px){
  .side{display:flex;position:fixed;inset:0 auto 0 0;width:224px;flex-direction:column;border-right:1px solid var(--border);background:color-mix(in srgb,var(--card) 80%,transparent);z-index:30}
  .side .top{padding:20px}
  .side nav{flex:1;display:flex;flex-direction:column;gap:4px;padding:0 12px}
  .side a.nv{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:16px;font-size:.875rem;font-weight:500;color:var(--mfg)}
  .side a.nv:hover{background:color-mix(in srgb,var(--muted) 60%,transparent);color:var(--fg)}
  .side a.nv.on{background:var(--muted);color:var(--fg)}
  .side .bot{padding:0 16px 20px;display:flex;flex-direction:column;gap:12px}
  .mtop,nav.bn{display:none}
  .shell{padding-left:224px}
  main.m{padding:32px 32px 48px}
}

/* mood */
.face{display:inline-grid;place-items:center;border-radius:50%;color:var(--pfg);width:44px;height:44px;transition:transform .15s}
.face svg{width:70%;height:70%}
.face.l1{background:var(--m1)}.face.l2{background:var(--m2)}.face.l3{background:var(--m3)}.face.l4{background:var(--m4)}.face.l5{background:var(--m5)}
.face.big{width:56px;height:56px}
.face.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ring)}
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.picker button{display:flex;min-height:80px;flex-direction:column;align-items:center;gap:6px;border-radius:16px;padding:8px 4px;font-size:.75rem;font-weight:500}
.picker button:hover,.picker button.on{background:var(--muted)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--muted)}
.tabs button{flex:1;min-height:40px;border-radius:999px;font-size:.875rem;font-weight:500;color:var(--mfg)}
.tabs button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.75rem;color:var(--mfg)}
.cal button{display:flex;min-height:44px;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:.875rem;font-variant-numeric:tabular-nums;color:var(--fg)}
.cal button.on{background:var(--muted)}.cal button[disabled]{opacity:.3;cursor:default}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-top:2px}
.d1{background:var(--m1)}.d2{background:var(--m2)}.d3{background:var(--m3)}.d4{background:var(--m4)}.d5{background:var(--m5)}

/* habits */
.tick{display:grid;place-items:center;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--input);background:var(--card)}
.tick.on{background:var(--primary);border-color:var(--primary)}
.tick i{display:block;width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--mfg) 30%,transparent)}
.tick.on i{background:var(--pfg)}

/* echo */
.msgs{display:flex;flex-direction:column;gap:12px;padding-bottom:16px}
.msg{max-width:92%;padding:12px 16px;border-radius:24px;font-size:.875rem;line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--primary);color:var(--pfg)}
.msg.a{align-self:flex-start;background:var(--card);box-shadow:var(--shadow)}
.echoform{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));z-index:10;display:flex;gap:8px;padding:8px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
@media(min-width:768px){.echoform{bottom:0}}
.echoform input{flex:1;height:48px;border-radius:999px;border:0;background:var(--card);padding:0 20px;box-shadow:var(--shadow);outline:none;font-size:.9rem}
.echoform input:focus{box-shadow:0 0 0 2px var(--ring)}
.alert{background:color-mix(in srgb,var(--help) 12%,transparent);border-radius:24px;padding:16px;display:flex;gap:12px;align-items:flex-start}

/* line card + sheet */
.line{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--muted);box-shadow:var(--shadow)}
.line.urgent{background:var(--help);color:var(--hfg)}
.line .ph{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:color-mix(in srgb,var(--bg) 30%,transparent);flex:none}
.line b{display:block;font-size:.875rem;font-weight:500}.line small{display:block;font-size:.75rem;opacity:.8}
.line .num{margin-left:auto;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(10,9,8,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:32rem;max-height:90dvh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:24px 24px calc(32px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.22,1,.36,1)}
@media(min-width:768px){.sheetbg{align-items:center}.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;max-width:90%;padding:12px 20px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:.85rem;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media(min-width:768px){.toast{bottom:32px}}

/* onboarding */
.ob{max-width:32rem;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:24px 16px}
.bars{display:flex;gap:6px;margin-top:24px}.bars i{flex:1;height:4px;border-radius:999px;background:var(--muted)}.bars i.on{background:var(--primary)}
.ob .card{flex:1;margin-top:24px;display:flex;flex-direction:column;padding:24px 20px}
.hero{position:relative;margin:-24px -20px 0;overflow:hidden;border-radius:24px 24px 0 0}
.hero img{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:64px 20px 16px;background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,.25),transparent);color:#f6f3ed}
.hero .cap b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:500;letter-spacing:-.02em}
.hero .cap span{font-size:.875rem;opacity:.85}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:16px;background:color-mix(in srgb,var(--muted) 70%,transparent);box-shadow:var(--shadow);transition:background .15s}
.opt:hover{background:var(--muted)}
.opt.on{background:var(--primary);color:var(--pfg)}
.opt b{display:block;font-size:.875rem;font-weight:500}.opt span{display:block;font-size:.75rem;opacity:.85}
.accept{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;background:color-mix(in srgb,var(--muted) 70%,transparent);font-size:.875rem;text-align:left;cursor:pointer}
.accept input{margin-top:4px;width:16px;height:16px;accent-color:var(--primary)}
.jtitle{border:0;background:transparent;box-shadow:none!important;font-family:var(--display);font-size:1.5rem;font-weight:500;padding-left:0;padding-right:0}
.jbody{border:0;background:transparent;box-shadow:none!important;min-height:50dvh;padding-left:0;padding-right:0;font-size:1rem;line-height:1.7}

.logo-breathe{animation:br 6s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(.94);opacity:.8}50%{transform:scale(1.04);opacity:1}}
.rise>*{opacity:0;transform:translateY(10px);animation:rs .45s cubic-bezier(.22,1,.36,1) forwards}
.rise>*:nth-child(2){animation-delay:60ms}.rise>*:nth-child(3){animation-delay:120ms}.rise>*:nth-child(4){animation-delay:180ms}.rise>*:nth-child(5){animation-delay:240ms}.rise>*:nth-child(6){animation-delay:300ms}
@keyframes rs{to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.rise>*,.logo-breathe,.sheet{animation:none;opacity:1;transform:none}}
</style>
</head>

function echoReply(text){

}

var DISTRESS_REPLY="I'm really glad you said this out loud. I'm not a person, and I'm not equipped to help in a crisis — you deserve someone who is. Please use the Help button for local numbers, or call emergency services if you are in immediate danger. You do not have to go through this alone.";

/* ---------- utils ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return "id_"+Math.random().toString(36).slice(2)+"_"+Date.now().toString(36)}
function pad(n){return n<10?"0"+n:""+n}
function todayKey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function greeting(h){return h<5?"You're up late":h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Good night"}
function guessCountry(){try{var tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";
  if(tz.indexOf("Australia/")===0||tz.indexOf("Pacific/Auckland")===0||tz.indexOf("Pacific/Chatham")===0)return "AU";
  if(/^America\/(Toronto|Vancouver|Edmonton|Winnipeg|Halifax|St_Johns|Whitehorse|Yellowknife|Iqaluit|Regina|Moncton)/.test(tz))return "CA";
  if(tz==="Europe/London"||tz==="Europe/Belfast")return "UK";
  if(tz.indexOf("America/")===0)return "US"}catch(e){}return "AU"}
function dayLabel(iso){var p=iso.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}
function relWhen(iso){var mins=Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(mins<1)return "just now";if(mins<60)return mins+"m ago";var h=Math.round(mins/60);if(h<24)return h+"h ago";var d=Math.round(h/24);if(d<8)return d+"d ago";return dayLabel(iso.slice(0,10))}
function lastDays(n){var out=[],c=new Date();for(var i=0;i<n;i++){out.unshift(todayKey(c));c.setDate(c.getDate()-1)}return out}

function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);
  ["moods","journals","habits","habitLogs","echo"].forEach(function(k){if(Array.isArray(o[k]))D[k]=o[k]});
  if(o.profile&&typeof o.profile==="object")D.profile=o.profile}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast("Could not save on this device — storage may be full or blocked.")}}
function setTheme(pref){try{localStorage.setItem("soulsync-theme",pref)}catch(e){}
  var dark=pref==="dark"||(pref!=="light"&&pref!=="system")||(pref==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark",dark);

/* ---------- insights ---------- */
function moodOn(date){for(var i=0;i<D.moods.length;i++)if(D.moods[i].date===date)return D.moods[i];return null}
function avgLevel(ms){if(!ms.length)return null;var s=0;ms.forEach(function(m){s+=m.level});return s/ms.length}
function commonLabel(ms){var c={},best=null,n=0;ms.forEach(function(m){m.labels.forEach(function(l){c[l]=(c[l]||0)+1;if(c[l]>n){n=c[l];best=l}})});return best}
function activeHabits(){return D.habits.filter(function(h){return !h.archived})}
function weekPct(){var act=activeHabits();if(!act.length)return 0;var ids=act.map(function(h){return h.id}),keys=lastDays(7),done=0;
  keys.forEach(function(d){D.habitLogs.forEach(function(l){if(l.date===d&&ids.indexOf(l.habitId)>-1)done++})});
  return Math.round(done/(ids.length*keys.length)*100)}
function habitStreak(id){var n=0,c=new Date();for(;;){var k=todayKey(c);var hit=D.habitLogs.some(function(l){return l.habitId===id&&l.date===k});if(!hit)break;n++;c.setDate(c.getDate()-1)}return n}
function anyStreak(){var n=0,c=new Date();for(;;){var k=todayKey(c);if(!D.habitLogs.some(function(l){return l.date===k}))break;n++;c.setDate(c.getDate()-1)}return n}
function reflection(recent,pct){
  var avg=avgLevel(recent),common=commonLabel(recent);
  if(!recent.length&&!D.journals.length)return "There's nothing to analyse yet — just a quiet page, waiting. Check in when you're ready.";
  if(avg!==null&&avg<=2.3)return common?"These days have been tender, with “"+common+"” showing up often. You don't have to lift that alone — a smaller check-in still counts.":"These days have been tender. Showing up here, even briefly, is already a kindness.";
  if(avg!==null&&avg>=4)return "There's a little more light in the recent days. Notice it without needing to hold it still.";
  if(pct>=70)return "The small actions have been stacking. Not a streak to defend — just evidence that you kept a promise to yourself.";
  if(common)return "“"+common+"” has been a frequent visitor. Naming it is already a form of taking care.";
  return "The picture is mixed, which is human. You're allowed to be more than one thing at once."}

  if(s===3)content='<div style="flex:1"><h1 style="font-size:1.9rem">How do you like to check in?</h1><p class="sm mut" style="margin-top:8px">Either is fine. You can switch anytime.</p><div class="stack-sm" style="margin-top:24px">'+
    [["brief","A few taps","Mood, a word or two, done. Built for busy or tired days."],["deep","A little more room","Prompts and notes when you want to sit with something."]].map(function(o){return '<button class="opt'+(OB.style===o[0]?' on':'')+'" data-act="ostyle" data-v="'+o[0]+'" aria-pressed="'+(OB.style===o[0])+'" style="padding:16px"><b style="font-size:1rem">'+o[1]+'</b><span style="font-size:.875rem;margin-top:4px">'+o[2]+'</span></button>'}).join("")+'</div></div>';
  if(s===4)content='<div style="flex:1"><h1 style="font-size:1.9rem">If things get heavy</h1><p class="sm mut" style="margin-top:8px">Help is always one tap away. Choose the numbers closest to you.</p><div class="chips" style="margin-top:24px">'+CRISIS.map(function(c){return '<button class="chip'+(OB.country===c.code?' on':'')+'" data-act="ocountry" data-v="'+c.code+'">'+esc(c.label)+'</button>'}).join("")+'</div><p class="sm mut" style="margin-top:24px;line-height:1.7">Your data never leaves this device unless you export it. You can delete everything in Settings.</p></div>';
  app.innerHTML='<div class="ob"><header class="row between">'+wordmark()+'<button class="btn help sm" data-act="help">'+IC.life+'Help</button></header>'+
    '<div class="bars" aria-hidden="true">'+[0,1,2,3,4].map(function(i){return '<i class="'+(i<=s?'on':'')+'"></i>'}).join("")+'</div>'+
    '<div class="card">'+content+'<div class="row" style="margin-top:32px;gap:8px">'+(s>0?'<button class="btn out" data-act="oback" style="flex:1">Back</button>':'')+
    (s<STEPS-1?'<button class="btn" data-act="onext" style="flex:1"'+(can?'':' disabled')+'>Continue</button>':'<button class="btn" data-act="ofinish" style="flex:1">Enter SoulSync</button>')+'</div></div></div>';
  var acc=document.getElementById("acc");if(acc)acc.onchange=function(){OB.accepted=acc.checked;vOnboarding()};
  var n=document.getElementById("obn");if(n){n.oninput=function(){OB.name=n.value;var b=document.querySelector('[data-act="onext"]');if(b)b.disabled=!OB.name.trim()};n.focus()}
}
function finishOnboarding(){
  var now=new Date().toISOString(),goals=OB.goals.slice(),picked=[];
  for(var i=0;i<DEFAULT_HABITS.length;i++){var def=DEFAULT_HABITS[i];if(picked.length>=4)break;
    var match=def.goals.some(function(g){return goals.indexOf(g)>-1});
    if(!match&&picked.length>=3)continue;
    picked.push({id:uid(),title:def.title,detail:def.detail,archived:false,createdAt:now,order:picked.length})}
  D.profile={displayName:OB.name.trim()||"friend",goals:goals,primaryGoal:goals[0]||"awareness",checkInStyle:OB.style,onboardingComplete:true,crisisCountry:OB.country,theme:(localStorage.getItem("soulsync-theme")||"dark"),createdAt:now,disclaimerAcceptedAt:now};
  D.habits=picked;save();location.hash="#/";
}

/* ---------- actions ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),v=t.getAttribute("data-v");
  switch(a){
   case "help":openHelp();break;
   case "closehelp":closeHelp();break;
   case "region":
     if(D.profile){D.profile.crisisCountry=v;save()}
     var hi=document.getElementById("helpin");if(hi)hi.innerHTML=crisisBody(v);
     if(location.hash==="#/settings")vSettings();else if(location.hash==="#/onboarding"){}
     break;
   case "mview":MS.view=v;vMood();break;
   case "mlevel":MS.level=+v;vMood();break;
   case "mlabel":MS.labels=MS.labels.indexOf(v)>-1?MS.labels.filter(function(x){return x!==v}):MS.labels.concat(v);vMood();break;
   case "mtrig":MS.triggers=MS.triggers.indexOf(v)>-1?MS.triggers.filter(function(x){return x!==v}):MS.triggers.concat(v);vMood();break;
   case "msave":saveMood();break;
   case "mjump":loadMoodDate(todayKey());vMood();break;
   case "mday":loadMoodDate(v);MS.view="checkin";vMood();break;
   case "mprev":MS.cursor=new Date(MS.cursor.getFullYear(),MS.cursor.getMonth()-1,1);vMood();break;
   case "mnext":MS.cursor=new Date(MS.cursor.getFullYear(),MS.cursor.getMonth()+1,1);vMood();break;
   case "htog":
     var today=todayKey(),ex=null;D.habitLogs.forEach(function(l){if(l.habitId===v&&l.date===today)ex=l});
     if(ex)D.habitLogs=D.habitLogs.filter(function(l){return l.id!==ex.id});else D.habitLogs.push({id:uid(),habitId:v,date:today});
     save();vHabits();break;
   case "hhide":D.habits.forEach(function(h){if(h.id===v)h.archived=true});save();vHabits();break;
   case "hnew":HF.open=true;habitDialog();break;
   case "eclear":if(window.confirm("Clear the conversation with Echo?")){D.echo=[];save();vEcho()}break;
   case "sgoal":
     var p=D.profile,next=p.goals.indexOf(v)>-1?p.goals.filter(function(g){return g!==v}):p.goals.concat(v);
     if(next.length){p.goals=next;if(next.indexOf(p.primaryGoal)<0)p.primaryGoal=next[0];save();vSettings()}break;
   case "stheme":if(D.profile)D.profile.theme=v;save();setTheme(v);vSettings();break;
   case "scountry":D.profile.crisisCountry=v;save();vSettings();break;
   case "sexport":exportData();break;
   case "simport":document.getElementById("sfile").click();break;
   case "swipe":
     if(window.confirm("Erase everything on this device? Moods, journal, habits, and Echo history will be removed. Export first if you want a copy.")){
       D={profile:null,moods:[],journals:[],habits:[],habitLogs:[],echo:[]};MS={date:null,level:null,labels:[],triggers:[],note:"",view:"checkin",cursor:null};OB={step:0,accepted:false,name:"",goals:[],style:"brief",country:null};
       try{localStorage.removeItem(KEY)}catch(x){}toast("All local data removed.");location.hash="#/onboarding";route()}break;
   case "ogoal":OB.goals=OB.goals.indexOf(v)>-1?OB.goals.filter(function(g){return g!==v}):OB.goals.concat(v);vOnboarding();break;
   case "ostyle":OB.style=v;vOnboarding();break;
   case "ocountry":OB.country=v;vOnboarding();break;
   case "onext":OB.step++;vOnboarding();window.scrollTo(0,0);break;
   case "oback":OB.step--;vOnboarding();break;
   case "ofinish":finishOnboarding();break;
  }
});

/* ---------- router ---------- */
function route(){
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  var h=(location.hash||"#/").slice(1)||"/";
  if(!D.profile||!D.profile.onboardingComplete){
    if(h!=="/onboarding"){location.hash="#/onboarding";return}
    vOnboarding();return;
  }
  if(h==="/onboarding"){location.hash="#/";return}
  var m;
  if(h==="/")vHome();
  else if(h==="/mood"){MS.date=null;MS.view="checkin";vMood()}
  else if(h==="/journal")vJournalList();
  else if((m=h.match(/^\/journal\/new(?:\/([^/]+))?$/)))vJournalEdit("new",m[1]);
  else if((m=h.match(/^\/journal\/([^/]+)$/)))vJournalEdit(decodeURIComponent(m[1]));
  else if(h==="/habits")vHabits();
  else if(h==="/echo")vEcho();
  else if(h==="/insights")vInsights();
  else if(h==="/settings")vSettings();
  else if(h==="/help"){vHome();openHelp()}
  else vHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",function(){closeHelp();route()});
if(D.profile&&D.profile.theme)setTheme(D.profile.theme);
/* hero video loop: blob URL from the embedded clip, wired to any .hv video as screens render */
var HV_URL=null;
function hvUrl(){if(HV_URL)return HV_URL;try{var bin=atob(HERO_VID),arr=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);HV_URL=URL.createObjectURL(new Blob([arr],{type:"video/mp4"}))}catch(e){HV_URL="data:video/mp4;base64,"+HERO_VID}return HV_URL}
function hvWire(){var vs=document.querySelectorAll("video.hv");for(var i=0;i<vs.length;i++){(function(v){if(v.getAttribute("data-w"))return;v.setAttribute("data-w","1");v.muted=true;v.defaultMuted=true;
  v.addEventListener("playing",function(){v.classList.add("on")});
  v.addEventListener("error",function(){if(v.getAttribute("data-f"))return;v.setAttribute("data-f","1");v.src="data:video/mp4;base64,"+HERO_VID;kick(v)});
  v.src=hvUrl();kick(v)})(vs[i])}}
function kick(v){try{var p=v.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
["pointerdown","touchstart","keydown","scroll"].forEach(function(e){document.addEventListener(e,function(){var vs=document.querySelectorAll("video.hv");for(var i=0;i<vs.length;i++)if(vs[i].paused)kick(vs[i])},{passive:true})});
document.addEventListener("visibilitychange",function(){if(!document.hidden){var vs=document.querySelectorAll("video.hv");for(var i=0;i<vs.length;i++)kick(vs[i])}});
new MutationObserver(hvWire).observe(document.getElementById("app"),{childList:true,subtree:true});
route();
})();
</script>
