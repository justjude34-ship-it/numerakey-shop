<script>
(function () {
  const D = window.HELD_DATA;
  const ART = window.HELD_ART;
  const KEY = "held-sanctuary-v1";

  const empty = () => ({
    name: "",
    onboarded: false,
    detections: [],
    events: [],
    anchors: [],
    exitChecks: {},
    groundings: [],
    blooms: [],
    afterDoor: null,
    afterFeelings: [],
    afterNote: "",
    checkMarks: {},
    shameCards: [],
    permissions: [],
  });

  function uid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      const s = raw && raw.state ? raw.state : raw;
      if (s && typeof s === "object") return Object.assign(empty(), s);
    } catch (e) {}
    return empty();
  }

  let state = load();

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ state: state, version: 0 }));
    } catch (e) {}
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, function (c) {
      return {
        "&": "\u0026amp;",
        "<": "\u0026lt;",
        ">": "\u0026gt;",
        '"': "\u0026quot;",
        "'": "\u0026#39;",
      }[c];
    });
  }

  function paras(text) {
    return String(text || "")
      .split(/\n\n/)
      .filter(Boolean)
      .map(function (p) {
        return "<p>" + esc(p) + "</p>";
      })
      .join("");
  }

  function glowFrom(text, fallback) {
    const clean = String(text || "").replace(/\s+/g, " ").trim();
    if (!clean) return fallback || "";
    const phrase = clean.split(" ").filter(Boolean).slice(0, 5).join(" ");
    return phrase.length > 42 ? phrase.slice(0, 40).trim() + "…" : phrase;
  }

  function addBloom(word, source) {
    const w = glowFrom(word, "").trim();
    if (!w) return;
    if (state.blooms.some(function (b) { return b.word.toLowerCase() === w.toLowerCase(); })) return;
    state.blooms = [{ id: uid(), word: w, source: source, createdAt: Date.now() }].concat(state.blooms).slice(0, 48);
  }

  function hash(input) {
    let h = 0;
    const s = String(input);
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  function night() {
    const h = new Date().getHours();
    return h >= 21 || h < 6;
  }

  function when(ts) {
    try {
      return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    } catch (e) {
      return "";
    }
  }

  function classify(text) {
    const t = String(text || "").toLowerCase();
    const hits = [];
    D.patterns.forEach(function (p) {
      const matched = [];
      p.keywords.forEach(function (k) {
        if (t.indexOf(k) !== -1) matched.push(k);
      });
      if (matched.length) {
        hits.push({
          id: p.id,
          name: p.name,
          score: matched.length,
          whatItIs: p.whatItIs,
          theTruth: p.theTruth,
          matched: matched,
        });
      }
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    return hits.slice(0, 3);
  }

  function fallbackLetter(hits) {
    if (!hits.length) {
      return "I heard you. I will not force a name onto this if the name isn't clean yet. What you wrote already matters. If you want, tell me one more detail — a sentence she said, a look, a silence — and we can look again. You are not too much. I'm here.";
    }
    const first = hits[0];
    return "That has a name. " + first.name + ". " + first.theTruth + " You did not imagine the shape of this. We can put it in the drawer so her version does not get the only key. I'm here.";
  }

  function checkLetter(yes, sometimes, answered) {
    const lit = yes + sometimes;
    if (answered < 6) {
      return {
        title: "Stay as long as you need",
        body: "A handful of ticks is not a verdict. You can stop mid-list. Sometimes is not a no — intermittent is often the hook. If one line landed in the body, that one is enough for tonight.",
      };
    }
    const ratio = lit / Math.max(answered, 1);
    if (ratio < 0.25) {
      return {
        title: "A difficult mother is still a grief",
        body: "This lamp did not light most of the room. That can mean this isn't the narcissistic pattern — or that the boxes are too sharp for a foggy story. Both are allowed. A hard childhood still deserves care. If a few lines rang, we can sit with those in Learn, without forcing a name onto the whole house.",
      };
    }
    if (ratio < 0.5) {
      return {
        title: "There is weather here",
        body: "Enough of this is your kitchen that the question is not silly. It may be this pattern, or a mix, or a house that used some of the moves without using all of them. You do not need a full sheet of yes to deserve a boundary, a witness, or a quieter life. Sometimes counts. Intermittent warmth is not a rebuttal. It is often the bait.",
      };
    }
    if (ratio < 0.75) {
      return {
        title: "This has the shape",
        body: "I will not diagnose her. I cannot. What I can say, as a friend at two in the morning: you are not imagining a climate. The kitchen was the kitchen. The smear, the switch, the fog — those are not you being dramatic. They are a script. You can put the clipboard down. The rest of this place is for living after the name.",
      };
    }
    return {
      title: "You already knew, and you still needed someone to say it",
      body: "Yes. This is that weather. A list cannot make it more true than your body already did, but it can stop the argument you have been having with yourself. You are not the stain. You were describing a house. Shame will try to snatch this moment — let it sit without giving it the wheel. Come sit in Shame, in Learn, in the garden. You don't have to decide your whole life tonight. You only have to stop calling this 'just family' if it never was.",
    };
  }

  function learnById(id) {
    return D.learn.filter(function (e) { return e.id === id; })[0];
  }

  const svg = {

  const ui = {
    view: state.onboarded ? "home" : "welcome",

    left: 90,
    running: false,

  };

  let handTimer = null;
  let recog = null;

  const app = document.getElementById("app");

  function field(name) {
    const el = app.querySelector('[data-field="' + name + '"]');
    if (el) return el.value;
    return ui.fields[name] || "";
  }

  function go(view, arg, replace) {
    if (!replace) ui.stack.push({ view: ui.view, arg: ui.arg });
    ui.view = view;
    ui.arg = arg || null;
    ui.saved = false;
    if (view !== "detect") {
      ui.hits = null;
      stopListen();
    }
    if (view !== "ground") stopHand();
    render();
    window.scrollTo(0, 0);
  }

  function back() {
    const prev = ui.stack.pop();
    ui.saved = false;
    if (!prev) {
      ui.view = state.onboarded ? "home" : "welcome";
      ui.arg = null;
    } else {
      ui.view = prev.view;
      ui.arg = prev.arg;
    }
    render();
    window.scrollTo(0, 0);
  }

  function stopListen() {
    ui.listening = false;
    try { if (recog) recog.stop(); } catch (e) {}
  }

  function stopHand() {
    ui.running = false;
    if (handTimer) {
      clearInterval(handTimer);
      handTimer = null;
    }
  }

  function startHand() {
    if (handTimer) clearInterval(handTimer);
    handTimer = setInterval(function () {
      if (!ui.running) return;
      ui.left -= 1;
      const el = document.getElementById("clock");
      if (ui.left <= 0) {
        ui.left = 0;
        stopHand();
        render();
        return;
      }
      if (el) el.textContent = clockText(ui.left);
    }, 1000);
  }

  function clockText(n) {
    const m = Math.floor(n / 60);
    const s = n % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  function nav() {
    const items = [
      ["home", "Home", svg.home],
      ["detect", "Patterns", svg.lamp],
      ["story", "Story", svg.flower],
      ["anchor", "Truth", svg.anchor],
      ["ground", "Ground", svg.wind],

    return (
      '<nav class="nav" aria-label="Primary">' +
      items
        .map(function (it) {
          const on = ui.view === it[0] || (it[0] === "home" && ui.view === "garden");
          return (
            '<button type="button" data-go="' +
            it[0] +
            '" class="' +
            (on ? "on" : "") +

            it[2] +
            "<span>" +
            it[1] +
            "</span></button>"

        })
        .join("") +
      "</nav>"
    );

  function backBtn() {
    return '<button type="button" class="back" data-back>Back</button>';

  function img(key, alt, cls) {

  function garden(compact) {
    const blooms = state.blooms || [];
    const emptyGarden = blooms.length === 0;
    const shown = blooms.slice(0, compact ? 8 : 18);
    const spots = shown
      .map(function (b, i) {
        const h = hash(b.id);
        const left = 8 + (h % 78);
        const top = 12 + ((h >> 7) % (compact ? 48 : 62));
        return (
          '<span class="bloom" style="left:' +
          left +
          "%;top:" +
          top +
          "%;animation-delay:" +
          (i % 6) * 0.45 +
          's">' +
          esc(b.word) +
          "</span>"
        );
      })
      .join("");
    const cap = emptyGarden
      ? "A seed is already in the soil."
      : blooms.length + " glowing " + (blooms.length === 1 ? "word" : "words") + " — yours.";
    return (
      '<div class="garden' +
      (compact ? "" : " tall") +
      '">' +
      img(emptyGarden ? "seed" : "garden", emptyGarden ? "A seed just breaking the soil" : "A moonlit garden of glowing flowers", "") +
      '<div class="veil"></div>' +
      spots +
      '<p class="cap">' +
      esc(cap) +
      "</p></div>"
    );
  }

    );

  function render() {
    const fn = views[ui.view] || views.home;
    const y = ui._keepScroll ? window.scrollY : null;
    app.innerHTML = fn();
    if (ui.view === "ground" && ui.tool === "hand" && ui.running) startHand();
    if (y != null) window.scrollTo(0, y);
    ui._keepScroll = false;
  }

  function addAnchor(kind, title, body) {
    const t = String(title || "").trim() || "A true thing";
    const b = String(body || "").trim();
    if (!b && !String(title || "").trim()) return;
    state.anchors = [{ id: uid(), kind: kind, title: t, body: b, createdAt: Date.now() }].concat(state.anchors);
    addBloom(t || b, "anchor");
    save();
  }

  const actions = {
    ready: function () {
      state.name = field("name").trim();
      state.onboarded = true;
      save();
      ui.stack = [];
      go("home", null, true);
    },
    skip: function () {
      state.name = "";
      state.onboarded = true;
      save();
      ui.stack = [];
      go("home", null, true);
    },
    reset: function () {
      if (!window.confirm("This empties the garden and the drawer. It cannot be undone.")) return;
      state = empty();
      save();
      ui.stack = [];
      ui.fields = {};
      go("welcome", null, true);
    },
    export: function () {
      const blob = new Blob([JSON.stringify({ held: 1, savedAt: new Date().toISOString(), state: state }, null, 2)], {
        type: "application/json",
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "held-words.json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    },
    mark: function (t) {
      const id = t.dataset.id;
      const mark = t.dataset.mark;
      const prev = state.checkMarks[id];
      if (prev === mark) delete state.checkMarks[id];
      else {
        state.checkMarks[id] = mark;
        if (mark === "yes" && prev !== "yes") addBloom("I named the weather", "check");
      }
      save();
      ui._keepScroll = true;
      render();
    },
    "keep-check": function () {
      const marks = state.checkMarks;
      const ids = Object.keys(marks);
      const yes = ids.filter(function (k) { return marks[k] === "yes"; }).length;
      const sometimes = ids.filter(function (k) { return marks[k] === "sometimes"; }).length;
      const letter = checkLetter(yes, sometimes, ids.length);
      addAnchor("truth", letter.title, yes + " yes, " + sometimes + " sometimes, of " + ids.length + " named.\n\n" + letter.body);
      addBloom("the kitchen was the kitchen", "check");
      save();
      ui.saved = true;
      ui._keepScroll = true;
      render();
    },
    "toggle-read": function (t) {
      ui.open = ui.open === t.dataset.id ? null : t.dataset.id;
      ui._keepScroll = true;
      render();
    },
    shame: function (t) {
      const id = t.dataset.id;
      const has = state.shameCards.indexOf(id) !== -1;
      state.shameCards = has ? state.shameCards.filter(function (x) { return x !== id; }) : state.shameCards.concat(id);
      if (!has) addBloom("not the stain", "shame");
      save();
      ui._keepScroll = true;
      render();
    },
    whose: function (t) {

      ui.whose = t.dataset.id;
      ui.saved = false;
      ui._keepScroll = true;
      render();
    },
    "keep-voice": function () {
      const voice = field("voice").trim();
      if (!voice || !ui.whose) return;
      addAnchor("words", "Whose voice", voice + "\n\nI said: " + ui.whose + ".");
      ui.saved = true;
      ui._keepScroll = true;
      render();
    },
    perm: function (t) {
      const line = t.dataset.line;
      const has = state.permissions.indexOf(line) !== -1;
      state.permissions = has ? state.permissions.filter(function (x) { return x !== line; }) : state.permissions.concat(line);
      if (!has) addBloom(line, "shame");
      save();
      ui._keepScroll = true;
      render();
    },
    listen: function () {
      const w = window;
      const SR = w.SpeechRecognition || w.webkitSpeechRecognition;
      if (!SR) {
        ui.letter = "This phone doesn't want to listen out loud. You can still type. I'm here.";
        ui.hits = ui.hits || [];
        render();
        return;
      }
      if (ui.listening) {
        stopListen();
        render();
        return;
      }
      ui.fields.story = field("story");
      const rec = new SR();
      rec.lang = "en-US";
      rec.interimResults = true;
      rec.continuous = false;
      rec.onresult = function (e) {
        let text = "";
        for (let i = 0; i < e.results.length; i++) text += e.results[i][0].transcript;
        ui.fields.story = text;
        const box = document.getElementById("story");
        if (box) box.value = text;
      };
      rec.onend = function () {
        ui.listening = false;
        const box = app.querySelector(".btn.icon");
        if (box) box.classList.remove("on");
      };
      rec.onerror = function () { ui.listening = false; };
      recog = rec;
      try {
        rec.start();
        ui.listening = true;
      } catch (e) {
        ui.listening = false;
      }
      render();
    },
    name: function () {
      const input = field("story").trim();
      ui.fields.story = input;
      if (!input) return;
      const hits = classify(input);
      const letter = fallbackLetter(hits);
      ui.hits = hits;
      ui.letter = letter;
      ui.saved = false;
      state.detections = [{ id: uid(), input: input, patterns: hits, letter: letter, createdAt: Date.now() }]
        .concat(state.detections)
        .slice(0, 40);
      addBloom((hits[0] && hits[0].name) || "named it", "detect");
      save();
      render();
    },
    "keep-detect": function () {
      const input = (ui.fields.story || "").trim();
      if (!input) return;
      const name = (ui.hits && ui.hits[0] && ui.hits[0].name) || "What happened";
      addAnchor("truth", name, input);
      ui.saved = true;
      ui._keepScroll = true;
      render();
    },
    "learn-all": function () {
      ui.arg = null;
      ui.saved = false;
      render();
      window.scrollTo(0, 0);
    },
    "pin-learn": function () {
      const entry = learnById(ui.arg);
      if (!entry) return;
      addBloom(entry.name, "detect");
      save();
      ui.saved = true;
      ui._keepScroll = true;
      render();
    },
    tool: function (t) {
      stopHand();
      ui.tool = t.dataset.id;
      ui.step = 0;
      ui.left = 90;
      ui.running = false;
      ui.saved = false;
      ui.lines = ["", "", "", "", ""];
      render();
      window.scrollTo(0, 0);
    },
    tools: function () {
      stopHand();
      ui.tool = null;
      ui.saved = false;
      render();
    },
    "here-next": function () {
      ui.step += 1;
      render();
    },
    "room-next": function () {
      ui.step += 1;
      render();
    },
    hand: function () {
      ui.running = !ui.running;
      if (ui.running) startHand();
      else if (handTimer) {
        clearInterval(handTimer);
        handTimer = null;
      }
      render();
    },
    "ground-done": function (t) {
      if (ui.saved) return;
      const tool = t.dataset.tool;
      let word = t.dataset.word || tool;
      if (tool === "true") {
        word = ui.lines.map(function (l) { return String(l).trim(); }).filter(Boolean)[0] || "true";
      }
      state.groundings = [{ id: uid(), tool: tool, at: Date.now() }].concat(state.groundings).slice(0, 60);
      addBloom(word, "ground");
      save();
      ui.saved = true;
      render();
    },
    door: function (t) {
      ui.fields.after = field("after");
      state.afterNote = ui.fields.after;
      state.afterDoor = t.dataset.id;
      save();
      ui._keepScroll = true;
      render();
    },
    feeling: function (t) {
      ui.fields.after = field("after");
      state.afterNote = ui.fields.after;
      const id = t.dataset.id;
      const has = state.afterFeelings.indexOf(id) !== -1;
      state.afterFeelings = has ? state.afterFeelings.filter(function (x) { return x !== id; }) : state.afterFeelings.concat(id);
      if (!has) addBloom("allowed", "after");
      save();
      ui.saved = false;
      ui._keepScroll = true;
      render();
    },
    "keep-after": function () {
      state.afterNote = field("after");
      const body = [state.afterNote.trim(), (state.afterFeelings || []).join(", ")].filter(Boolean).join("\n\n");
      if (!body) return;
      const title =
        state.afterDoor === "gone"
          ? "When she died"
          : state.afterDoor === "alive"
            ? "While she is still alive"
            : "What I feel about her death";
      addAnchor("truth", title, body);
      ui.saved = true;
      ui._keepScroll = true;
      render();
    },
    era: function (t) {
      ui.fields.stitle = field("stitle");
      ui.fields.syear = field("syear");
      ui.fields.sbody = field("sbody");
      ui.era = t.dataset.id;
      ui._keepScroll = true;
      render();
    },
    "add-event": function () {
      const title = field("stitle");
      const body = field("sbody");
      const year = field("syear");
      if (!title.trim() && !body.trim()) return;
      state.events = [
        {
          id: uid(),
          era: ui.era,
          title: title.trim() || "Untitled",
          body: body.trim(),
          year: year.trim(),
          createdAt: Date.now(),
        },
      ].concat(state.events);
      addBloom(title || body || ui.era, "timeline");
      save();
      ui.fields.stitle = "";
      ui.fields.syear = "";
      ui.fields.sbody = "";
      render();
    },
    "drop-event": function (t) {
      state.events = state.events.filter(function (e) { return e.id !== t.dataset.id; });
      save();
      ui._keepScroll = true;
      render();
    },
    kind: function (t) {
      ui.fields.atitle = field("atitle");
      ui.fields.abody = field("abody");
      ui.kind = t.dataset.id;
      ui._keepScroll = true;
      render();
    },
    "add-anchor": function () {
      const title = field("atitle");
      const body = field("abody");
      if (!title.trim() && !body.trim()) return;
      addAnchor(ui.kind, title, body);
      ui.fields.atitle = "";
      ui.fields.abody = "";
      render();
    },
    "drop-anchor": function (t) {
      state.anchors = state.anchors.filter(function (a) { return a.id !== t.dataset.id; });
      save();
      ui._keepScroll = true;
      render();
    },
    exit: function (t) {
      const id = t.dataset.id;
      const next = !state.exitChecks[id];
      state.exitChecks[id] = next;
      if (next) addBloom(id.replace(/-/g, " "), "exit");
      save();
      ui._keepScroll = true;
      render();
    },
  };

  app.addEventListener("click", function (e) {
    const t = e.target.closest("[data-go],[data-act],[data-back]");
    if (!t || !app.contains(t)) return;
    if (t.dataset.back != null) {
      back();
      return;
    }
    if (t.dataset.go) {
      go(t.dataset.go, t.dataset.arg || null);
      return;
    }
    const act = t.dataset.act;
    if (act && actions[act]) actions[act](t, e);
  });

  app.addEventListener("input", function (e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.field) return;
    ui.fields[el.dataset.field] = el.value;
    if (el.dataset.field === "after") {
      state.afterNote = el.value;
      save();
    }
    if (/^t[0-4]$/.test(el.dataset.field)) {
      ui.lines[Number(el.dataset.field.slice(1))] = el.value;
      const n = ui.lines.filter(function (l) { return String(l).trim(); }).length;
      const slot = document.getElementById("true-done");
      const hint = document.getElementById("true-hint");
      if (slot) slot.hidden = n < 3;
      if (hint) hint.hidden = n >= 3;
    }
  });

  app.addEventListener("change", function (e) {
    const el = e.target;
    if (!el.dataset || el.dataset.act !== "import") return;
    const file = el.files && el.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const parsed = JSON.parse(String(reader.result || ""));
        const next = parsed.state || parsed;
        if (!next || typeof next !== "object") throw new Error("empty");
        state = Object.assign(empty(), next);
        state.onboarded = true;
        save();
        ui.stack = [];
        go("home", null, true);
      } catch (err) {
        window.alert("That file isn't a Held drawer. Nothing was changed.");
      }
    };
    reader.readAsText(file);
  });

  render();
})();

</script>
</body>
</html>
