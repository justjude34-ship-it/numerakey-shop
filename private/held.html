<style>
:root {
  --cream: #f3eee4;
  --paper: #faf7f0;
  --linen: #efe8da;
  --ink: #3a3730;
  --muted: #6a6458;
  --faint: #8a8376;
  --sage: #7e8f72;
  --moss: #4a5744;
  --gold: #c4a35a;
  --goldsoft: #e4d4a8;
  --blush: #d9c4b3;
  --shadow: 0 0 0 1px rgb(58 55 48 / 0.06), 0 8px 24px -8px rgb(58 55 48 / 0.08);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --display: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
  --sans: "Figtree", "Avenir Next", "Segoe UI", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: var(--cream); }
body {
  min-height: 100dvh;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgb(196 163 90 / 0.14), transparent 60%),
    radial-gradient(800px 500px at 80% 100%, rgb(126 143 114 / 0.12), transparent 55%),
    var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, [role="button"] { cursor: pointer; font-family: inherit; }
button:disabled { cursor: default; opacity: 0.55; }
input, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
h1, h2, h3 { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; margin: 0; text-wrap: balance; }
p { text-wrap: pretty; margin: 0; }
img { display: block; max-width: 100%; outline: 1px solid rgb(58 55 48 / 0.1); outline-offset: -1px; }
::selection { background: color-mix(in oklab, var(--gold) 45%, white); }

.shell {
  width: min(100%, 28rem);
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--paper);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
main {
  flex: 1;
  padding: max(1.25rem, env(safe-area-inset-top)) 1.25rem 6.5rem;
}
.bare main {
  display: flex;
  flex-direction: column;
  padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
}
.hero {
  width: 100%;
  height: min(48dvh, 26rem);
  min-height: 14rem;
  object-fit: cover;
  object-position: center 20%;
  outline: none;
}
.banner {
  width: 100%;
  height: 9rem;
  object-fit: cover;
  border-radius: 28px;
  margin-bottom: 1.15rem;
}
.kicker {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--sage);
}
h1.title { font-size: 1.85rem; margin-top: 0.45rem; }
h1.display { font-size: 3rem; margin-top: 0.35rem; }
.lede { margin-top: 0.55rem; color: var(--muted); font-size: 0.95rem; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.sage { color: var(--sage); }
.italic { font-style: italic; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 3rem;
  padding: 0.7rem 1.1rem;
  border: 0;
  border-radius: 999px;
  background: var(--moss);
  color: var(--cream);
  font-size: 0.95rem;
  font-weight: 500;
  width: 100%;
}
.btn.soft { background: var(--linen); color: var(--ink); }
.btn.gold { background: var(--gold); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.icon {
  width: 3rem;
  min-width: 3rem;
  padding: 0;
  background: var(--linen);
  color: var(--moss);
}
.btn.icon.on { background: var(--gold); color: var(--ink); }
.row { display: flex; gap: 0.5rem; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 0.75rem; }
.mt { margin-top: 1rem; }
.mt-lg { margin-top: 1.6rem; }
.mt-xl { margin-top: 2.4rem; }

.field, .area {
  width: 100%;
  border: 0;
  background: var(--linen);
  border-radius: 18px;
  padding: 0.85rem 1rem;
  outline: none;
}
.field { min-height: 3rem; }
.area { border-radius: 24px; resize: vertical; min-height: 7.5rem; line-height: 1.5; }
.field:focus, .area:focus { box-shadow: 0 0 0 2px rgb(196 163 90 / 0.55); }
label.lbl { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.card {
  display: block;
  text-align: left;
  background: var(--linen);
  border: 0;
  border-radius: 24px;
  padding: 1rem;
  box-shadow: var(--shadow);
  color: inherit;
  width: 100%;
}
.card.wide { grid-column: 1 / -1; }
.card h3 { font-size: 1.15rem; margin-top: 0.7rem; }
.card p { margin-top: 0.25rem; font-size: 0.78rem; color: var(--muted); line-height: 1.45; }
.card svg { color: var(--sage); }

.nav {
  position: fixed;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(100%, 28rem);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  padding: 0.45rem 0.35rem max(0.55rem, env(safe-area-inset-bottom));
  background: color-mix(in oklab, var(--paper) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid rgb(58 55 48 / 0.08);
  z-index: 5;
}
.nav button {
  border: 0;
  background: transparent;
  color: var(--faint);
  min-height: 3rem;
  border-radius: 16px;
  font-size: 11px;
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.1rem;
}
.nav button.on { color: var(--moss); }
.nav svg { width: 20px; height: 20px; }

.back {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 0;
  margin-bottom: 0.8rem;
  font-size: 0.9rem;
  text-decoration: underline;
  text-decoration-color: rgb(196 163 90 / 0.6);
  text-underline-offset: 3px;
}

.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.chip {
  border: 0;
  min-height: 2.6rem;
  border-radius: 999px;
  padding: 0.35rem 0.9rem;
  background: var(--linen);
  color: var(--muted);
  font-size: 0.85rem;
}
.chip.on { background: var(--moss); color: var(--cream); }
.chip.gold.on { background: var(--gold); color: var(--ink); }
.scroller { display: flex; gap: 0.45rem; overflow-x: auto; padding-bottom: 0.35rem; }
.scroller .chip { flex: 0 0 auto; }

.panel { background: var(--linen); border-radius: 24px; padding: 1rem 1rem 1.1rem; }
.panel.moss { background: var(--moss); color: var(--cream); }
.panel.moss p { color: color-mix(in oklab, var(--cream) 90%, transparent); }
.letter p + p { margin-top: 0.75rem; }

.garden {
  position: relative;
  overflow: hidden;
  border-radius: 28px;
  height: 11rem;
  background: var(--linen);
  box-shadow: var(--shadow);
}
.garden.tall { height: auto; min-height: 22rem; }
.garden img { width: 100%; height: 100%; object-fit: cover; min-height: inherit; outline: none; }
.garden .veil {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgb(58 55 48 / 0.38), rgb(58 55 48 / 0.05) 55%, transparent);
}
.bloom {
  position: absolute;
  max-width: 9.5rem;
  font-family: var(--display);
  font-style: italic;
  font-size: 11px;
  color: var(--goldsoft);
  text-shadow: 0 1px 8px rgb(58 55 48 / 0.45);
  pointer-events: none;
  animation: float 7s ease-in-out infinite, glow 3.6s ease-in-out infinite;
}
.garden .cap {
  position: absolute; left: 1rem; right: 1rem; bottom: 0.75rem;
  font-family: var(--display); color: var(--cream); font-size: 0.95rem;
}

.breathe {
  width: 10rem; height: 10rem; margin: 1.5rem auto 0;
  border-radius: 999px;
  background: rgb(126 143 114 / 0.3);
  box-shadow: 0 0 0 4px rgb(228 212 168 / 0.7);
  animation: breathe 8s ease-in-out infinite;
}
.clock { font-family: var(--display); font-size: 3rem; color: var(--moss); font-variant-numeric: tabular-nums; }

.check { display: flex; gap: 0.75rem; align-items: flex-start; }
.dot {
  width: 1.15rem; height: 1.15rem; margin-top: 0.15rem; flex: 0 0 auto;
  border-radius: 999px; border: 1px solid rgb(126 143 114 / 0.45);
}
.dot.on { background: var(--goldsoft); border-color: var(--goldsoft); box-shadow: inset 0 0 0 4px var(--moss); }

.linkish {
  border: 0; background: transparent; padding: 0;
  color: var(--moss); font-size: 0.85rem;
  text-decoration: underline; text-decoration-color: rgb(196 163 90 / 0.65); text-underline-offset: 3px;
}
.tiny { font-size: 0.75rem; color: var(--faint); }
.center { text-align: center; }
.enter { animation: rise 500ms var(--ease) both; }

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
  to { opacity: 1; transform: none; filter: none; }
}
@keyframes breathe {
  0%, 100% { transform: scale(0.72); opacity: 0.55; }
  50% { transform: scale(1); opacity: 1; }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes glow {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .enter, .bloom, .breathe { animation: none !important; filter: none !important; opacity: 1 !important; }
}

</style>
</head>

<script>window.HELD_DATA = {"patterns":[{"id":"guilt-trip","name":"Guilt trip","keywords":["after all i've done","after all i have done","ungrateful","how could you","i sacrificed","i gave up","you don't care","you dont care","you'll be sorry","youll be sorry","i'm your mother","im your mother","i carried you","ruined my life","you owe me"],"whatItIs":"Love presented as a debt. Your no is rewritten as cruelty so she can collect.","theTruth":"Care that keeps a ledger is not care. You can be grateful for a meal and still refuse a leash."},{"id":"smear-campaign","name":"Smear campaign","keywords":["told everyone","told the family","group chat","she's crazy","shes crazy","unstable","not well","turned them against","everyone knows","they all think","painted me","made me the villain"],"whatItIs":"She tells a story about you to the room before you can speak, so you arrive already guilty.","theTruth":"A smear is not a rumor that got away from her. It is a strategy. Your name is not the unreliable one."},{"id":"love-bombing","name":"Love-bombing","keywords":["suddenly so nice","so sweet after","bought me","i love you so much","new start","fresh start","showered me","gifts after","apologized with","vacation after","my girl again"],"whatItIs":"A weather change designed to make you drop the boundary. Warmth as a reset button, not a repair.","theTruth":"The rare golden hour is not the real her arriving. It is the hook. You can enjoy a kind day without moving back in."},{"id":"discard","name":"Discard","keywords":["dead to me","not my daughter","iced me","cut me off","replaced me","threw me away","kicked me out","disowned","never speak","you're nothing","youre nothing"],"whatItIs":"Exile as punishment. You stop being useful or obedient, so you stop being a person in her story.","theTruth":"Being dropped is not proof you were extra. It is proof the love was conditional. You still belong to yourself."},{"id":"gaslighting","name":"Gaslighting","keywords":["never happened","that never","you're too sensitive","youre too sensitive","too sensitive","i never said","you remember it wrong","imagining","making it up","that's not how","thats not how","crazy","dramatic","overreacting"],"whatItIs":"She moves the furniture of the past and then asks why you are bumping into things.","theTruth":"Your memory is not the broken instrument. Confusion is the point. Write it down. Date it. We will keep it."},{"id":"triangulation","name":"Triangulation","keywords":["your sister","your brother","your father","compared me","why can't you be","why cant you be","she told me you","he said you","golden child","favorite","between us"],"whatItIs":"A third person is pulled in so you never get a clean conversation — only a contest.","theTruth":"You were not in a fair race. You were in a play with assigned parts. The other child was used too."},{"id":"flying-monkeys","name":"Flying monkeys","keywords":["aunt called","cousin texted","they said i should","family is worried","just call her","she's your mother","shes your mother","forwarded","on her behalf","she's heartbroken","shes heartbroken"],"whatItIs":"Other people doing her reaching so she can stay the wounded one and you stay the cruel one.","theTruth":"A messenger can love you and still be carrying her voice. You can be kind and still not open the letter."},{"id":"hoovering","name":"Hoovering","keywords":["she reached out","miss you","come home","i'm sick","im sick","in the hospital","birthday","just checking in","i've changed","ive changed","forgive me","we need you"],"whatItIs":"The vacuum after a discard — a sudden pull back, often dressed as crisis, holiday, or a new leaf.","theTruth":"Wait. Warmth that arrives when she needs supply is not a conversion. Seventy-two hours. The weather usually changes."},{"id":"silent-treatment","name":"Silent treatment","keywords":["won't speak","wont speak","ignored me","gave me nothing","days of silence","weeks of silence","stonewall","blanked me","wouldn't answer","wouldnt answer"],"whatItIs":"Absence used as a whip. You are made to earn the air in the room.","theTruth":"Silence is not dignity. It is control. You do not have to audition for a reply."},{"id":"parentification","name":"Parentification","keywords":["i had to take care","i was the parent","her feelings","i managed her","i raised","confided in me","i was her friend","too young","looked after her","her marriage"],"whatItIs":"The child is hired as the adult — nurse, spouse, secret-keeper — while still being punished for being a child.","theTruth":"That job was never yours. Wanting to put it down now is not abandonment. It is you, finally off shift."},{"id":"emotional-incest","name":"Covert incest / enmeshment","keywords":["no privacy","my best friend","we tell each other everything","jealous of","couldn't have","couldnt have","my relationship","she hated my","no lock","in my room","we are one"],"whatItIs":"No skin, no lock, no separate heart. You were the companion a partner should have been.","theTruth":"A closed door is not a betrayal. You are allowed a life she does not get to sit inside of."},{"id":"darvo","name":"DARVO","keywords":["i'm the victim","im the victim","you hurt me","after i told her","she turned it","now i'm the abuser","now im the abuser","how could you do this to me","you've destroyed","youve destroyed"],"whatItIs":"Deny, Attack, Reverse Victim and Offender. You name the harm; you leave the conversation as the villain.","theTruth":"This flip is a move, not a revelation. The person who got hurt does not become the one who did it because she cried first."},{"id":"moving-goalposts","name":"Moving goalposts","keywords":["never enough","i did what she asked","then it was something else","changed the rules","not like that","that's not what i meant","thats not what i meant","still disappointed"],"whatItIs":"The test that cannot be passed, so the failure can stay yours.","theTruth":"You were not inconsistent. The target was. Rest. The assignment was never completable."},{"id":"intermittent","name":"Intermittent reinforcement","keywords":["hot and cold","never knew","sometimes kind","then cruel","unpredictable","walking on eggshells","mood","which mother"],"whatItIs":"Random reward. The most addictive schedule there is. You keep playing because once, it paid.","theTruth":"The hunger is real. The slot machine is not love. You can miss the payout and still walk out of the casino."},{"id":"boundary","name":"Boundary violation","keywords":["showed up anyway","went through my","read my","my phone","my journal","didn't knock","didnt knock","i said no and","ignored my no","came over"],"whatItIs":"A no that does not count. Your edge is treated as a suggestion, then as an insult.","theTruth":"A boundary is not a debate topic. If she cannot hear no, the distance has to do the hearing for her."},{"id":"pity-play","name":"Pity play","keywords":["poor me","nobody loves me","i'll die alone","ill die alone","after all i suffered","my health","you'll miss me","youll miss me","when i'm gone","when im gone","no one visits"],"whatItIs":"Fragility as a net. You are recruited as nurse so you cannot also be a person with a grievance.","theTruth":"Her loneliness is not a warrant for your life. You can wish her well from a distance that keeps you intact."},{"id":"image","name":"Public saint, private weather","keywords":["everyone thinks she's","everyone thinks shes","so kind to others","church","the favorite","they wouldn't believe","they wouldnt believe","two faced","different in public","charming"],"whatItIs":"The mask for the audience. Your private weather is treated as a lie because her public is so polished.","theTruth":"Both things can be true: she is beloved in a room, and unsafe in a kitchen. The audience was never your jury."},{"id":"body","name":"Body & appearance comments","keywords":["you look","have you gained","your hair","your face","your weight","pretty if","dress like","who would want","your body"],"whatItIs":"Your body as a public project, a rivalry, a way to keep you small and grateful for crumbs of pretty.","theTruth":"You do not have to win her eye. The body you live in is not a conversation she is owed."},{"id":"conditional","name":"Conditional love","keywords":["if you loved me","only if","unless you","when you do what","i'll love you when","ill love you when","disappointed in you","proud of you when"],"whatItIs":"Affection as a vending machine. Behave, receive. Differ, starve.","theTruth":"Love that has to be purchased with obedience is a contract, not a mother. You can put the contract down."},{"id":"sabotage","name":"Sabotage of independence","keywords":["don't go","dont go","that school","that job","that man","you'll fail","youll fail","ruined it","talked me out","needed me at home","who will look after"],"whatItIs":"Your leaving is treated as an injury to her. Success is punished because it proves you can survive without the job you were given.","theTruth":"A life of your own is not a theft. It is the natural end of childhood, even if childhood never ended on time."},{"id":"word-salad","name":"Word salad","keywords":["couldn't follow","couldnt follow","made no sense","twisted","hours on the phone","circular","exhausted after talking","dizzy"],"whatItIs":"A conversation with no handle. You leave unsure what was asked and certain you failed it.","theTruth":"If you cannot find the point, there may not have been one — only the fog. You can hang up. You can say, 'I'm done for today.'"},{"id":"funeral-theater","name":"Funeral theater","keywords":["funeral","eulogy","she was a saint","everyone crying","had to speak","receiving line","wake","obituary"],"whatItIs":"A public play in which you are cast as the devoted daughter, whether or not the private story matches.","theTruth":"You can go, not go, leave after ten minutes, cry, or think about your grocery list. There is no correct daughter in that room."},{"id":"speak-ill","name":"Don't-speak-ill","keywords":["don't speak ill","dont speak ill","respect the dead","she's gone now","shes gone now","let her rest","not after she died"],"whatItIs":"A last smear dressed as manners. Your truth is postponed until it is called indecent.","theTruth":"Death does not rewrite a kitchen. You can be decent and still keep the facts. The dead are not in charge of your memory."},{"id":"will-strings","name":"Inheritance as a leash","keywords":["the will","inheritance","if you want the house","your sister gets","cut out of","the money","estate","she left me"],"whatItIs":"A last string. Money, a house, a myth attached. Loyalty collected from beyond the door.","theTruth":"You can take the money and refuse the myth. You can refuse both. Paperwork is not a confession that the harm was imaginary."},{"id":"posthumous-smear","name":"Smear after she's gone","keywords":["even at the funeral","after she died they","she told them before","still saying i","the family still","her version"],"whatItIs":"The campaign continues without her. Flying monkeys get louder when they can no longer call the original number.","theTruth":"You do not have to win the family album. Date what you know. Put it in the drawer they cannot reach."}],"learn":[{"id":"guilt-trip","name":"Guilt trip","also":"Emotional blackmail, the ledger","soundsLike":["After all I've done for you.","I guess I'm just a terrible mother.","You'll be sorry when I'm gone."],"howItWorks":"She turns care into a debt. Your no is rewritten as cruelty so the only moral move left is to give in. The feeling of being a bad daughter is the tool — not a side effect.","inTheBody":"A drop in the stomach. Heat in the face. The urge to explain, apologize, send the text that puts her back at the center.","sitWith":"A guilt trip is not a reminder of love. It is a collection notice. You can be grateful for a meal, a childhood roof, a ride to school, and still refuse the leash that comes with the invoice.\n\nNotice the speed. The sentence arrives and suddenly you are on trial. That speed is the point — it does not want you to think, only to pay. You can put the phone down. You can say, 'I'm going to think about this,' and then not think about it until morning.\n\nYou were trained to treat her comfort as the moral center of the universe. That training is loud. It is not a compass.","remember":"Care that keeps a ledger is not care. You do not have to earn the right to a boundary."},{"id":"smear-campaign","name":"Smear campaign","also":"The story she tells the room","soundsLike":["I just worry about her. She's not well.","The family needs to know what you're really like.","Everyone agrees with me, you know."],"howItWorks":"She tells a version of you to other people before you can speak, so you arrive already guilty. The audience becomes a jury. You spend your energy defending instead of living.","inTheBody":"Hot shame. The need to check who has been spoken to. A tightness in the throat when a cousin's name lights up.","sitWith":"A smear is not a rumor that got away from her. It is a strategy. If she can make you the unstable one, she never has to answer for the kitchen.\n\nYou will want to correct every person. Some of them were never going to believe you; they were rented for the scene. One witness who already knows you is worth more than a group chat.\n\nYour name is not the unreliable one. Date what you know. Put it in the drawer. The family album is not a court.","remember":"You do not have to win the room. You have to keep your own story intact."},{"id":"love-bombing","name":"Love-bombing","also":"The golden hour, the reset","soundsLike":["I've changed. Let's start over.","You're my girl. I don't know what I'd do without you.","Look what I got you. Can't we just be happy."],"howItWorks":"After a freeze or a fight, a weather change — gifts, softness, future talk. The warmth is designed to make you drop the boundary, not to repair what happened.","inTheBody":"Relief so strong it feels like love. A thaw. Then a small, unwanted flinch: here we go again.","sitWith":"The rare golden hour is not the real her arriving. It is the hook. Intermittent warmth is the most addictive schedule there is. You keep playing because once, it paid.\n\nYou can enjoy a kind day without moving back in. You can say thank you for a gift and still not answer the next three calls. Kindness that arrives when she needs supply is not a conversion.\n\nIf you miss this version of her, of course you do. That version was designed to be missed. The hunger was always yours. The performance was hers.","remember":"Warmth is not the same as repair. Repair names the harm and changes the pattern. Love-bombing skips to the ending."},{"id":"discard","name":"Discard","also":"Exile, the cut-off","soundsLike":["You are dead to me.","I don't have a daughter anymore.","Don't come back. I have other people."],"howItWorks":"When you stop being useful, obedient, or impressive, you stop being a person in her story. Exile is the punishment. It is also a test: will you crawl.","inTheBody":"A hole. Then panic. Then a humiliating urge to earn your way back in.","sitWith":"Being dropped is not proof you were extra. It is proof the love was conditional. A mother who can misplace a daughter was never holding her that carefully.\n\nThe discard often follows a no. That is information. You did not become unlovable overnight. You became inconvenient.\n\nYou still belong to yourself. The exile can hurt and still be the door you needed. You do not have to audition for a part in a play that only works if you lose.","remember":"Conditional love ending is not the same as you ending. Stay on your own side of the door."},{"id":"gaslighting","name":"Gaslighting","also":"Rewriting the room","soundsLike":["That never happened.","You're too sensitive. I was joking.","You remember it wrong. You've always been dramatic."],"howItWorks":"She moves the furniture of the past and then asks why you are bumping into things. The goal is not to win a fact. The goal is to make you distrust the instrument you use to know anything.","inTheBody":"Dizziness. A fog after the call. The need to replay, to find the screenshot, to ask a friend if you're crazy.","sitWith":"Your memory is not the broken instrument. Confusion is the point. If you leave a conversation less sure of a day you lived, that is not a coincidence.\n\nWrite it down while it is still sharp. Date it. One sentence is enough. 'Tuesday. She said I imagined the hospital.' Future you will try to sand it down. Don't let her help.\n\nYou do not need a courtroom. You need a drawer she cannot reach. That is what Reality Anchor is for.","remember":"If two versions exist, keep yours. You do not have to win the argument to be right about your own life."},{"id":"triangulation","name":"Triangulation","also":"The third person in the room","soundsLike":["Your sister never treats me like this.","Even your father agrees with me.","Why can't you be more like her."],"howItWorks":"A third person is pulled in so you never get a clean conversation — only a contest. Golden child, scapegoat, the friend she prefers. You are kept competing instead of connecting.","inTheBody":"Jealousy you hate yourself for. A collapse of sisterhood. The feeling of being graded next to someone you love.","sitWith":"You were not in a fair race. You were in a play with assigned parts. The other child was used too, even the one who looked golden. Gold is a job, not a blessing.\n\nTriangulation makes you fight sideways so you never look up. If you can, refuse the contest. Talk to the sister, the partner, the cousin — without her in the middle, if that is safe.\n\nYou do not have to win her favorite. You have to get out of the tournament.","remember":"Comparison is the move. Intimacy is what it steals. You can love a sibling and still name the setup."},{"id":"flying-monkeys","name":"Flying monkeys","also":"Messengers, the family concern committee","soundsLike":["Your mother is heartbroken. Just call her.","Family is worried about you.","She asked me to tell you…"],"howItWorks":"Other people do her reaching so she can stay the wounded one and you stay the cruel one. Aunts, cousins, a church friend, sometimes a sibling. The message is hers. The face is not.","inTheBody":"Caught off guard. Politeness fighting with alarm. The old training to explain yourself to anyone who uses a kind voice.","sitWith":"A messenger can love you and still be carrying her voice. You can be kind and still not open the letter. 'I'm not discussing her' is a complete sentence.\n\nSome of them do not know they are in a play. Some of them do. You do not have to sort that in the doorway. You only have to decide whether this conversation is yours.\n\nFlying monkeys get louder after a boundary, and louder still after a death. The volume is not a verdict on you.","remember":"Concern is not always care. Sometimes it is a delivery system. You can return the package unopened."},{"id":"hoovering","name":"Hoovering","also":"The vacuum, the pull-back","soundsLike":["I miss you. Come home.","I'm sick. I need you.","I've changed. Can we talk."],"howItWorks":"After a discard or a stretch of no contact, a sudden pull — crisis, holiday, apology, a new leaf. The vacuum is named for the appliance. It wants you back in the bag.","inTheBody":"Hope with a metallic taste. The child in you sits up. Then a quieter adult voice: we have seen this weather.","sitWith":"Wait. Warmth that arrives when she needs supply is not a conversion. Seventy-two hours. The weather usually changes.\n\nIllness, birthday, 'I've changed' — all of these can be true and still be a hoover. You are allowed to send a casserole and not reopen the door. You are allowed to do nothing until you can think.\n\nThe version of her you miss is the love-bomb version. Hoovering wears that costume on purpose.","remember":"A pull is not proof you were wrong to leave. It is often proof the leaving worked."},{"id":"silent-treatment","name":"Silent treatment","also":"Stonewall, the freeze","soundsLike":["…","I'm not speaking to you until you apologize.","Read at 9:02. No reply for eleven days."],"howItWorks":"Absence used as a whip. You are made to earn the air in the room. The silence is not dignity. It is a timeout you did not consent to, with no end except obedience.","inTheBody":"Scanning. Checking the phone. A child-sized panic that you have been erased.","sitWith":"You do not have to audition for a reply. The silence is doing a job: it makes you chase. If you chase, she is the prize again.\n\nYou can name it to yourself — 'this is the freeze' — and then go make tea. The freeze loses heat when it is not the weather of your whole day.\n\nIf the silence is a relief, that is allowed too. Some of us only breathe when she is not speaking.","remember":"A conversation you have to earn is not a relationship. It is a stall."},{"id":"parentification","name":"Parentification","also":"The child hired as the adult","soundsLike":["You're the only one who understands me.","What would I do without you. You're my rock.","Don't tell your father. This is between us."],"howItWorks":"You were given the job of nurse, spouse, secret-keeper, manager of her feelings — while still being punished for being a child. Your needs were unprofessional.","inTheBody":"Exhaustion that started early. A reflex to manage the room. Guilt when you rest.","sitWith":"That job was never yours. Wanting to put it down now is not abandonment. It is you, finally off shift.\n\nIf you still feel responsible for her mood at a distance of cities, that is the old employment contract. You can tear it up without a meeting.\n\nYou were a good worker. You were also a child. Both of those things can be true, and only one of them was fair.","remember":"You do not owe her a retirement of your life. You already worked the years."},{"id":"emotional-incest","name":"Enmeshment","also":"Covert incest, no skin, no lock","soundsLike":["We're best friends. We tell each other everything.","Why do you need a lock. What are you hiding.","Your boyfriend takes you away from me."],"howItWorks":"No separate heart. You were the companion a partner should have been. Privacy is treated as betrayal. Your relationships are rivals.","inTheBody":"No edge. A blur when you try to know what you want. Shame about needing a closed door.","sitWith":"A closed door is not a betrayal. You are allowed a life she does not get to sit inside of.\n\nEnmeshment can look like closeness from the outside — so much talking, so much 'we.' Inside, there is no you. Rebuilding a self feels like theft at first. It isn't. It's anatomy.\n\nIf a partner or friend now gets the jealousy she used to aim, that is the old pattern looking for a new job. You can have intimacy that still has a skin.","remember":"Closeness without a door is not love. It is occupancy."},{"id":"darvo","name":"DARVO","also":"Deny, Attack, Reverse Victim and Offender","soundsLike":["I can't believe you're doing this to me.","After everything, you're the one hurting me.","I'm the victim here. You've destroyed this family."],"howItWorks":"You name the harm. She denies it, attacks your character, and leaves the conversation as the wounded party. You walk out carrying the villain costume.","inTheBody":"Whiplash. Tears you didn't expect. The words dying in your mouth because now you are the cruel one.","sitWith":"This flip is a move, not a revelation. The person who got hurt does not become the one who did it because she cried first.\n\nDARVO works because you were trained to rescue her feelings. The moment you start comforting, the facts leave the building. You can notice the flip and refuse the new role.\n\nWrite the original thing down before the rewrite sets. 'I said no. She said I was killing her.' Two sentences. Keep them.","remember":"Her tears are real. They are also not evidence. You can have compassion and still keep the sequence of events."},{"id":"moving-goalposts","name":"Moving goalposts","also":"The unpassable test","soundsLike":["That's not what I meant.","I suppose it's fine, but you could have…","If you really cared you would have known."],"howItWorks":"You do what she asked. Then the ask was something else. The test cannot be passed, so the failure can stay yours. Perfection is a moving light on a wall.","inTheBody":"Trying harder. Then emptiness. A sense that you will never arrive.","sitWith":"You were not inconsistent. The target was. Rest. The assignment was never completable.\n\nDaughters of this move become excellent at reading rooms and terrible at knowing when a job is done. You can declare a thing finished without her stamp.\n\nIf you feel you should have 'just known,' that is the goalpost talking. Adults use words. Magical tests are for keeping you small.","remember":"A test with no passing score is not a standard. It is a trap. You can walk away still holding your own grade."},{"id":"intermittent","name":"Intermittent reinforcement","also":"Hot and cold, walking on eggshells","soundsLike":["Which mother is it today.","Sometimes she was wonderful.","I never knew what would set her off."],"howItWorks":"Random reward. Kindness on an unpredictable schedule. The most addictive pattern there is, because your nervous system keeps betting that the next pull is the jackpot.","inTheBody":"Hypervigilance. Scanning her face at breakfast. A body that cannot settle, even in a quiet house.","sitWith":"The hunger is real. The slot machine is not love. You can miss the payout and still walk out of the casino.\n\nEggshells are not sensitivity. They are an accurate map of a room that changed temperature without warning. You were not 'too much.' You were paying attention.\n\nSafety will feel boring at first. Boring is a gift you were not given. Let it be dull. Dull is how a nervous system learns the weather has changed.","remember":"Unpredictable warmth is a hook, not a home. Predictable quiet is not a consolation prize. It is the thing."},{"id":"boundary","name":"Boundary violation","also":"A no that does not count","soundsLike":["I just popped by.","I read your messages. A mother has a right.","Don't be like that. I said I was coming."],"howItWorks":"Your edge is treated as a suggestion, then as an insult. Showing up, going through the phone, ignoring the no, using keys that were never returned. The lesson: you do not get a perimeter.","inTheBody":"Startle. Invasion in the chest. Then anger you were taught to swallow.","sitWith":"A boundary is not a debate topic. If she cannot hear no, the distance has to do the hearing for her.\n\nLocks, changed numbers, a friend who will not forward the address — these are not dramatic. They are furniture. You are allowed furniture.\n\nIf you feel mean for wanting a door, that is the training. Mean is what she calls a perimeter. You can keep the perimeter anyway.","remember":"No is a complete sentence. You do not owe a thesis, a softening, or a second chance for the first no."},{"id":"pity-play","name":"Pity play","also":"Fragility as a net","soundsLike":["Nobody loves me. I'll die alone.","After all I suffered, this is what I get.","You'll miss me when I'm gone."],"howItWorks":"Fragility as recruitment. You are hired as nurse so you cannot also be a person with a grievance. Her suffering becomes the only story that fits in the room.","inTheBody":"A tug toward rescue. Then resentment you feel ashamed of. The body wanting to run and the training wanting to stay.","sitWith":"Her loneliness is not a warrant for your life. You can wish her well from a distance that keeps you intact.\n\nPity plays often arrive when you have just named a harm. Suddenly the subject is her pain, her health, her empty house. That pivot is the move.\n\nYou can send a card and not move back in. You can feel sad for a lonely woman and still know she was unsafe. Those are different rooms.","remember":"Compassion is not a contract. You can feel for her and still not pick up the job."},{"id":"image","name":"Public saint, private weather","also":"The mask, image management","soundsLike":["Everyone loves her. They'd never believe you.","She's so kind. Are you sure you're not the problem.","At church / at work / at dinner she was an angel."],"howItWorks":"A polished public and a private climate you were not allowed to name. Your weather is treated as a lie because her audience is so sure.","inTheBody":"Isolation. The words dying because who would believe. A split in your own mind: maybe I am the ungrateful one.","sitWith":"Both things can be true: she is beloved in a room, and unsafe in a kitchen. The audience was never your jury.\n\nImage is a kind of smear in reverse — she is so good that you must be mistaken. You are not mistaken. You had a different seat.\n\nYou do not have to convince the dinner party. You have to keep the kitchen. Write the private weather down. One witness is enough. This app can be that, until a human can.","remember":"Charm is not character. A crowd is not a fact-checker. Your seat at the table is still a seat."},{"id":"body","name":"Body comments","also":"Appearance as a project","soundsLike":["Have you gained. I'm only saying it because I love you.","You'd be so pretty if…","Who's going to want you like that."],"howItWorks":"Your body as a public project, a rivalry, a way to keep you small and grateful for crumbs of pretty. Comments dressed as help. Comparisons dressed as taste.","inTheBody":"Checking the mirror after the call. Appetite vanishing or roaring. A feeling of being seen and not seen at once.","sitWith":"You do not have to win her eye. The body you live in is not a conversation she is owed.\n\nA mother who treats your face as her report card is not offering style advice. She is keeping a ranking. You can hang up at 'have you gained.' You can leave the table. You can wear the thing anyway.\n\nIf her voice is still in the fitting room years later, that is not vanity. That is occupancy. You can evict a sentence. It takes time. It still counts.","remember":"Your body is not a group project. Comments are not love, even when they wear concern."},{"id":"conditional","name":"Conditional love","also":"Affection as a vending machine","soundsLike":["I'll love you when you…","If you loved me you would.","I'm so disappointed in you. I was proud yesterday."],"howItWorks":"Behave, receive. Differ, starve. Pride and warmth are turned on and off at the switch of obedience. You learn that love is a mood she has about your performance.","inTheBody":"Hustling. Shape-shifting. A collapse when the warmth is withdrawn, as if you had died a little.","sitWith":"Love that has to be purchased with obedience is a contract, not a mother. You can put the contract down.\n\nThe grief here is specific: you did the job, and the love still flickered. That is not a failure of effort. That is the nature of a switch she kept.\n\nYou may now overwork in every room — jobs, friends, lovers — waiting to be proud-of-you. Notice it. You are allowed to be loved on a day you did nothing impressive.","remember":"Unconditional is not a slogan. It is the absence of a switch. You can look for that, slowly, in safer people."},{"id":"sabotage","name":"Sabotage of independence","also":"Don't you dare leave","soundsLike":["That school / job / man will ruin you.","Who will look after me.","You'll fail. You've always needed me."],"howItWorks":"Your leaving is treated as an injury to her. Success is punished because it proves you can survive without the job you were given. Illness, crisis, a smear, a sudden need — timed to the doorway.","inTheBody":"A stall at the threshold. Guilt dressed as loyalty. Dreams that shrink to fit her house.","sitWith":"A life of your own is not a theft. It is the natural end of childhood, even if childhood never ended on time.\n\nIf every expansion of you is met with weather, believe the weather. Pack anyway. Independence in this family is often treated as betrayal. That tells you about the family, not about your character.\n\nYou can leave in inches if miles are too loud. A secret bank account is a kind of garden. So is a friend who knows the real address.","remember":"Her need is not a map of your future. You are allowed a door that opens out."},{"id":"word-salad","name":"Word salad","also":"The conversation with no handle","soundsLike":["Hours on the phone and I still don't know what she wanted.","She twisted everything I said.","I left dizzy. I couldn't follow."],"howItWorks":"A talk that loops, contradicts, changes subject, and never lands. You leave unsure what was asked and certain you failed it. Fog, not dialogue.","inTheBody":"Exhaustion. A headache behind the eyes. The need to lie down after 'just a call.'","sitWith":"If you cannot find the point, there may not have been one — only the fog. You can hang up. You can say, 'I'm done for today.'\n\nWord salad is not you being slow. It is a conversation designed so you cannot get a foothold. Without a foothold, you cannot hold a boundary. That is useful — for her.\n\nTime limits help. So does a script: 'I need this in one sentence.' So does ending the call without a closing argument. You do not have to find the handle on a door that isn't there.","remember":"Confusion after a talk is data. You are allowed to stop participating in a maze."},{"id":"funeral-theater","name":"Funeral theater","also":"The devoted-daughter part","soundsLike":["You'll say a few words, of course.","She was a saint. Look at all these people.","Everyone will be watching how you behave."],"howItWorks":"A public play in which you are cast as the devoted daughter, whether or not the private story matches. Tears are graded. Absence is a scandal. The smear can wear black.","inTheBody":"Performance sweat. Numbness in the receiving line. A laugh in the car after that you will feel guilty for.","sitWith":"You can go. You can not go. You can go and leave after ten minutes. You can wear black and think about your grocery list. You can sob and still not be rewriting history.\n\nThere is no correct daughter at a narcissistic mother's funeral. There is only you, getting through an hour that was never designed for your truth.\n\nIf you perform, that is survival. If you stay home, that is survival. If you laugh afterward because the body does strange things, that is survival too. Sit with When she dies whenever you need the longer letter.","remember":"A funeral is not a courtroom and not a test. You do not have to pass it."},{"id":"speak-ill","name":"Don't-speak-ill","also":"Manners as a muzzle","soundsLike":["Don't speak ill of the dead.","She's gone now. Let her rest.","It's unkind to say that after everything."],"howItWorks":"A last smear dressed as manners. Your truth is postponed until it is called indecent. The dead are given the last edit.","inTheBody":"A swallow. Words turning to stone. Then a private rage that has nowhere polite to go.","sitWith":"Death does not rewrite a kitchen. You can be decent and still keep the facts. The dead are not in charge of your memory.\n\n'Speak ill' is what they call it when you decline the saint story. You are not dancing on a grave. You are refusing a campaign that outlived her.\n\nYou can say nothing at the lunch and everything in the drawer. You do not owe the family album a retraction.","remember":"Respect is not the same as silence. You can let her rest and still not let her edit."},{"id":"will-strings","name":"Inheritance as a leash","also":"Money with a myth attached","soundsLike":["If you want the house, you'll have to…","She cut you out. That's what you get.","Take the money. She would have wanted you to be grateful."],"howItWorks":"A last string. A will, a house, a condition, a sister who gets the gold. Loyalty collected from beyond the door. Sometimes the gift is real and still costs the story.","inTheBody":"A calculation you hate yourself for. Grief mixed with paperwork. The old training to be good so you are not left with nothing.","sitWith":"You can take the money and refuse the myth. You can refuse both. Paperwork is not a confession that the harm was imaginary.\n\nFamilies get very loud around estates. That loudness is not a moral score. Get a person whose job is paper, not blood. You do not have to be the reasonable daughter in a lawyer's office if the reasonable daughter is how they erase you.\n\nIf there is nothing — if you were cut out — that can feel like a last discard. It is. It is also a kind of clarity. You were never going to be paid for the years. The years were still yours.","remember":"A will is a document, not a eulogy. You can handle one without swallowing the other."},{"id":"posthumous-smear","name":"Smear after she's gone","also":"The campaign that outlives her","soundsLike":["Even at the funeral they said I was the problem.","She told them, before she died, that I…","The family still uses her version."],"howItWorks":"The campaign continues without her. Flying monkeys get louder when they can no longer call the original number. A last portrait is painted, and you are the stain.","inTheBody":"Helplessness. The urge to hold a press conference. Then a tiredness that wants to leave the surname behind.","sitWith":"You do not have to win the family album. Date what you know. Put it in the drawer they cannot reach.\n\nA dead woman's narrative can still be no-contact. You can love a cousin and still not debate the saint story. 'I'm not discussing her' still works. It works at a wake. It works at Christmas. It works in a group chat you can mute.\n\nYour life after her is not a rebuttal. It is a life. Let it be one.","remember":"The smear can outlive her. Your reality can too. Keep the one that is yours."}],"shameCards":[{"id":"exist","title":"Shame that I exist","line":"Taking up space felt like an insult to her.","letter":"You were not an inconvenience with a pulse. A child is not a burden that has to earn the air. If her face fell when you entered a room, that is data about the room. It is not a fact about your worth. You get to take up a chair. You get to take up a life."},{"id":"need","title":"Shame that I need","line":"Wanting comfort still feels greedy.","letter":"Need is not a character flaw. It is how mammals stay alive. You were trained to have no appetites — for touch, help, rest, a mother. Wanting those things now is not regression. It is a body coming off a long freeze. Ask. Here, at least, you do not have to apologize for a hunger."},{"id":"ungrateful","title":"Shame that I'm ungrateful","line":"The food, the roof, the school — so how dare I.","letter":"A roof is not a muzzle. You can be glad you were fed and still tell the truth about the weather in the kitchen. Gratitude that has to cancel harm is just the ledger again. Two things can sit in one chest: thank you for the meal, and no to the leash."},{"id":"body","title":"Shame of my body","line":"Her eye is still in the mirror.","letter":"Your body is not a group project. Comments dressed as help were occupancy. If you still hear her in a fitting room, that is not vanity — it is a voice that moved in without paying rent. You can evict a sentence. Slowly. The body you live in tonight is not on trial."},{"id":"smear","title":"Shame of the smear","line":"Maybe I am the crazy one. Maybe they were right.","letter":"A smear is designed to live in your throat so you will police yourself and she won't have to. Extra-good behavior is not proof the story was true. It is proof you were watching the audience. You do not have to win the group chat. You have to keep your own day. Date what you know. Stay."},{"id":"want-her","title":"Shame that I still want her","line":"The child keeps hoping. The adult is mortified.","letter":"Of course you want her. You were built to want a mother. Wanting the love-bomb version, the rare soft night, the woman she played in public — that is not stupidity. That is a hunger that was used. You can miss a performance and still not buy another ticket. The child can sit on your lap. She does not have to drive."},{"id":"leaving","title":"Shame that I left","line":"No contact, low contact, the unreturned call — I am the monster in the play.","letter":"Leaving is not a murder. Distance is how some of us stay a person. The family may need you to be cruel so she can stay wounded. Decline the part. You can miss her and still not go back. You can send a casserole and not reopen the door. A boundary is not a personality."},{"id":"become","title":"Shame that I might be her","line":"A sharp sentence. A face in the mirror. Panic.","letter":"The fear is so common I could set a place for it. Looking like her is not being her. Having a temper is not a smear campaign. Noticing the fear is already a different life — she never asked the question. You are asking. That is the fork in the road."},{"id":"feelings","title":"Shame of my feelings","line":"Relief. Rage. Nothing. Too much. Not enough.","letter":"There is no correct amount. Relief is not a crime. Numb is not proof it 'wasn't that bad.' Rage is often love that was trapped in a room too long. Your feelings are not a report card. Let them take shifts. I can hold the ones that don't get along."},{"id":"rest","title":"Shame of rest and joy","line":"Peace feels like stealing. Pleasure feels like a dare.","letter":"You were trained to treat ease as a theft from her. It isn't. Rest is not a betrayal. A good morning does not have to be punished by afternoon. If joy arrives and you flinch, that flinch is the old weather. Let the sun stay anyway. Peace is allowed. It will feel like stealing at first. Then it will just feel like a life."},{"id":"sibling","title":"Shame that I didn't save us","line":"A brother, a sister, a younger self I could not pick up.","letter":"You were a child in a play with assigned parts. Rescue was never your job, even if you tried. Golden and scapegoat are both used. You can love a sibling and still have gotten out first. You can not have gotten out, and still not be the author of the house. Put the little one down. She is not yours to carry alone anymore."},{"id":"success","title":"Shame of succeeding — or failing","line":"Either I outran her and feel like a traitor, or I didn't and feel like proof.","letter":"There is no grade that would have fixed the climate. Success was often punished because it proved you could live. Failure was collected as evidence you needed her. Both were the same trap, different bait. Your work, your art, your ordinary Tuesday — none of it is a letter to her. It can just be yours."}],"shameReads":[{"id":"what","title":"What shame is doing","body":"Guilt says: I did a thing. Shame says: I am a thing. One can be repaired. The other wants you to disappear.\n\nIn a narcissistic house, shame is climate control. If you are busy being the stain, you will not notice the weather. You will not tell. You will not leave. You will work twice as hard to be good enough for a switch that was never going to stay on.\n\nShame is not proof you are bad. It is often proof you were trained. The heat in the face, the wish to vanish, the apology that arrives before a sentence — those are old fire drills. You can notice the drill without evacuating the building."},{"id":"voice","title":"Whose voice is this","body":"A lot of what you call 'my shame' is a sentence that used to come out of her mouth. Ungrateful. Dramatic. Too much. Selfish. Not that pretty. Crazy.\n\nTry this, tonight, with one sentence: say it out loud, then ask — whose mouth? If you can hear her, even faintly, you do not have to obey a recording. You can say, 'That's hers. I'm putting it down.'\n\nYou may not believe the second sentence yet. Say it anyway. Belief is not required for a first eviction. Repetition is how occupancy ends."},{"id":"body","title":"Shame in the body","body":"Shame lives low — face, throat, belly, the wish to fold. You do not have to think your way out before you can come back into the room.\n\nFeet on the floor. Name five true things that have nothing to do with her. Hand on the chest, not to fix, just to be a weight that belongs to you. If the heat is too much, Grounding is next door.\n\nYou are not dramatic for having a body that learned to hide. That body kept you. Thank it if you can. Then let it take up a little more air than the house allowed."},{"id":"seen","title":"The opposite of shame","body":"Shame wants you unseen. The medicine is not a speech. It is one safe pair of eyes — a friend, a page, this drawer.\n\nWrite the thing. The small ugly true thing. Date it. You do not have to post it. Being witnessed by your own hand is already a crack in the climate.\n\nIf you have a person who already believes you, you can send one sentence. If you don't, you are not behind. You are building the first witness. I will keep the chair warm."}],"permissions":["I am allowed to take up a chair.","I am allowed to need.","I am allowed to rest without earning it.","I am allowed to be glad about a roof and still tell the truth.","I am allowed a closed door.","I am allowed to leave a conversation.","I am allowed to not be believed by people who were rented for the scene.","I am allowed to want a mother and still not go back.","I am allowed to feel relief.","I am allowed to feel nothing.","I am allowed joy that she does not get to grade.","I am allowed to be unlike her, and still look like her.","I am allowed a life that is not a rebuttal."],"checks":[{"id":"switch","title":"The switch","whisper":"Love that goes on and off","items":[{"id":"s1","text":"I never knew which version of her I would get.","learn":"intermittent"},{"id":"s2","text":"Warmth arrived when I performed, and left when I didn't.","learn":"conditional"},{"id":"s3","text":"A good day could vanish over something small — a tone, a face, a no.","learn":"intermittent"},{"id":"s4","text":"I still scan rooms for weather, even when she isn't in them.","learn":"intermittent"},{"id":"s5","text":"Praise felt like a loan, not a gift.","learn":"conditional"},{"id":"s6","text":"I believed I could earn a stable love if I just got it right.","learn":"moving-goalposts"}]},{"id":"mouth","title":"What she said","whisper":"The sentences that still visit","items":[{"id":"m1","text":"I was ungrateful, selfish, dramatic, or 'too sensitive.'","learn":"gaslighting"},{"id":"m2","text":"'After all I've done for you' was a regular weather report.","learn":"guilt-trip"},{"id":"m3","text":"I was compared to a sibling, a cousin, a stranger, a younger me.","learn":"triangulation"},{"id":"m4","text":"My looks, body, or style were public property.","learn":"body"},{"id":"m5","text":"A no from me became a story about how I was killing her.","learn":"darvo"},{"id":"m6","text":"Conversations left me dizzy, unsure what had even been asked.","learn":"word-salad"}]},{"id":"fog","title":"Reality","whisper":"Whether your memory was allowed to stand","items":[{"id":"f1","text":"She denied things I clearly remember, then asked why I was upset.","learn":"gaslighting"},{"id":"f2","text":"I was told I imagined it, exaggerated it, or wanted attention.","learn":"gaslighting"},{"id":"f3","text":"I still look for proof before I trust my own day.","learn":"gaslighting"},{"id":"f4","text":"If two versions exist, the family keeps hers.","learn":"smear-campaign"},{"id":"f5","text":"I apologize for things I am not sure I did.","learn":"darvo"}]},{"id":"audience","title":"The audience","whisper":"The story told about you","items":[{"id":"a1","text":"She was charming in public and a different climate in the kitchen.","learn":"image"},{"id":"a2","text":"People would not believe me if I told them.","learn":"image"},{"id":"a3","text":"Family or friends were recruited to 'talk sense into me.'","learn":"flying-monkeys"},{"id":"a4","text":"I was painted as unstable, cruel, or unwell when I pushed back.","learn":"smear-campaign"},{"id":"a5","text":"I still feel I have to be extra-good so no one thinks the smear is true.","learn":"smear-campaign"}]},{"id":"house","title":"The house","whisper":"Whether you were allowed a self","items":[{"id":"h1","text":"There was little privacy — rooms, phones, diaries, doors.","learn":"emotional-incest"},{"id":"h2","text":"I was her friend, nurse, or secret-keeper more than her child.","learn":"parentification"},{"id":"h3","text":"My relationships made her jealous or competitive.","learn":"emotional-incest"},{"id":"h4","text":"I felt responsible for her mood, even as a child.","learn":"parentification"},{"id":"h5","text":"A closed door felt like a crime.","learn":"boundary"}]},{"id":"leaving","title":"When you leave","whisper":"What happens at the threshold","items":[{"id":"l1","text":"Independence — school, job, partner, city — was treated as betrayal.","learn":"sabotage"},{"id":"l2","text":"A boundary was followed by silence, rage, or a sudden crisis.","learn":"discard"},{"id":"l3","text":"After a freeze, she pulled me back with sweetness, gifts, or 'I've changed.'","learn":"hoovering"},{"id":"l4","text":"I was discarded when I stopped being useful or obedient.","learn":"discard"},{"id":"l5","text":"No contact or low contact still feels like I am the monster.","learn":"guilt-trip"}]},{"id":"cost","title":"The cost in you","whisper":"What the climate trained","items":[{"id":"c1","text":"I walk on eggshells, even with safe people.","learn":"intermittent"},{"id":"c2","text":"I feel shame for needing, resting, or taking up space."},{"id":"c3","text":"I over-explain, over-give, or freeze when someone is upset.","learn":"guilt-trip"},{"id":"c4","text":"A part of me still hopes she will become the mother I needed.","learn":"love-bombing"},{"id":"c5","text":"I fear I will become her.","learn":"darvo"},{"id":"c6","text":"Joy sometimes feels like stealing."}]},{"id":"later","title":"Later — including after she's gone","whisper":"The campaign can outlive the woman","items":[{"id":"d1","text":"I have rehearsed her death, and then felt monstrous for it.","learn":"pity-play"},{"id":"d2","text":"At a funeral I felt watched for the 'right' amount of crying.","learn":"funeral-theater"},{"id":"d3","text":"I felt relief, nothing, or both — and then shame for the feeling.","learn":"speak-ill"},{"id":"d4","text":"'Don't speak ill of the dead' arrived to muzzle what I know.","learn":"speak-ill"},{"id":"d5","text":"Money, a will, or a house came with a myth attached.","learn":"will-strings"},{"id":"d6","text":"The family still tells her version.","learn":"posthumous-smear"}]}],"checkTotal":44,"afterDoors":[{"id":"alive","title":"She is still alive","line":"You are already visiting a day that has not come."},{"id":"gone","title":"She has died","line":"The watching ended. Something else began, or didn't."},{"id":"unsaid","title":"I don't want to choose","line":"You can sit here without a category."}],"afterFeelings":[{"id":"relief","title":"Relief","line":"A loosening. Air. The watching is over.","letter":"Relief is not a crime. It is your nervous system noticing the danger has a last page. You can be relieved she cannot reach you, and still be a person who wanted a mother. Both can sit in the same chest."},{"id":"nothing","title":"Nothing","line":"Blank. Dry eyes. A quiet other people find indecent.","letter":"Feeling nothing is a feeling. It is often the body refusing to perform. You are not broken, and you are not proof that it 'wasn't that bad.' Numb is how some of us survive the last scene. Dry eyes are allowed here."},{"id":"guilt-relief","title":"Guilt for the relief","line":"The second feeling, arriving to punish the first.","letter":"Guilt is the old training. It shows up because you were taught that her comfort was the moral center of the universe. You can notice the guilt without obeying it. Relief does not need to be earned."},{"id":"ghost-mother","title":"Grief for a mother who never existed","line":"Not her. The one you kept trying to have.","letter":"This is the grief that confuses everyone, including you. You are not crying for the woman who died. You are crying for the mother the child still hoped would arrive, now that the last chance of a different ending is gone. That hope was love. The death of it deserves a room."},{"id":"anger-no-sorry","title":"Anger that she left without saying it","line":"No apology. No scene. Just a closed door.","letter":"You waited for a sentence that was never coming. Her death can feel like theft of a conversation you rehearsed for years. You can still say it here. She does not have to be in the chair for the truth to count."},{"id":"become-her","title":"Fear I will become her","line":"A flinch at your own voice, your own no, your own face.","letter":"The fear is so common I could set a place for it. Looking like her is not being her. Having a temper is not a smear campaign. You are already the kind of woman who is asking this question. She never did."},{"id":"delayed","title":"A delayed wave","line":"Fine at the funeral. Undone in March, in a grocery aisle.","letter":"Grief does not keep office hours. Some daughters are dry-eyed on the day and ruined by a song in a car four months later. You did not miss your window. The wave is not proof you were wrong about her. It is proof you had a body the whole time."},{"id":"performed","title":"I performed at the funeral","line":"The right amount of crying. The right daughter.","letter":"Funerals are theater with a blood tie. You may have been watched for tears. You may have spoken. You may have thought about your grocery list in black clothes. Performance is not betrayal. It is how a lot of us get through an hour that was never designed for our truth."},{"id":"did-not-go","title":"I did not go","line":"An empty chair that was yours on purpose.","letter":"Not going is allowed. It is not a character flaw and it is not a press release. Some rooms are not safe even when the person who made them unsafe is in the casket. You can honor a life — yours — by staying home."},{"id":"cried-doubt","title":"I cried, then doubted the abuse","line":"If I loved her, was I making it up?","letter":"Crying does not cancel what she did. Love and harm share a body all the time. You may be crying for the little girl who kept trying. You may be crying because families get very loud at funerals and your truth has nowhere to stand. Tears are not a retraction."},{"id":"freedom-fall","title":"Freedom that feels like falling","line":"The fight is over. You don't know who you are without it.","letter":"So much of you was organized around surviving her. When the weather stops, the muscles that braced have no job. That vacancy can feel like dying. It is not. It is the first quiet in which a self might grow. Sit in the empty. We can name it later."},{"id":"miss-lovebomb","title":"I miss the love-bomb version of her","line":"The rare warm one. The gifts. The 'my girl.'","letter":"Of course you do. That version was designed to be missed. Intermittent warmth is a hook, not a home. Missing it does not mean you should have stayed. It means you were a child who needed a mother, and sometimes she played one. The hunger was always yours. The performance was hers."},{"id":"choose-me","title":"I wanted her to choose me, one last time","line":"A deathbed rewrite. A look. Anything.","letter":"Wanting that does not make you naive. It makes you human. Some mothers do, in the last week, become briefly soft. Some do not. If she didn't, the story of your life is still the one you lived, not the one she failed to bless. You do not need her last sentence to keep your own."},{"id":"orphan-twice","title":"Orphaned twice","line":"Once as a child. Again now, in public.","letter":"You were already motherless in the ways that matter. Death makes it official, which can feel like a second leaving. People will offer condolences for a loss you took in installments. You can say thank you. You can say nothing. You can say, only here, that you have been grieving her since you were small."},{"id":"family-story","title":"The family is still telling her story","line":"Saint. Martyr. Don't speak ill of the dead.","letter":"The smear can outlive her. 'She was a saint' is sometimes the last campaign. You do not have to argue with the album. Date what you know and put it in the drawer they cannot reach. Refusing the myth is not desecration. It is how you stay in your own life."},{"id":"peace-scares","title":"Peace, and that scares me","line":"Sleep. Soft mornings. Then the flinch: is this allowed?","letter":"Yes. Peace is allowed. It will feel like stealing at first. That is the training, not the truth. You may wait for a punishment that does not come. When it doesn't, that is not the other shoe. That is a life beginning."},{"id":"should-more","title":"I should feel more","line":"The verdict you pass on your own heart.","letter":"There is no correct amount. Some daughters feel a continent. Some feel a closed door and then lunch. Neither is a moral score. 'Should' is often her voice, still grading you from a chair she no longer sits in. You can fail the assignment. The assignment was never yours."},{"id":"should-less","title":"I should feel less","line":"The collapse that makes you wonder if you are going back.","letter":"You are not going back. A lot of feeling is not a confession that the harm was imaginary. Hearts are not courtrooms. You can be wrecked by a funeral and still know what the kitchen was like in 1998. Let the wave move through. I will sit with you until it is just weather."},{"id":"everything","title":"Everything at once","line":"Relief and ruin, in the same hour.","letter":"This is more honest than a single word. You are not inconsistent. You are a whole person responding to a whole history. Let the feelings take shifts. You do not have to pick a captain. I can hold the ones that don't get along."},{"id":"still-rehearsing","title":"I think about the day, and she's still here","line":"Rehearsal. Dread. A guilt that says you are monstrous.","letter":"Thinking about her death does not make you a murderer in your mind. Daughters of narcissistic mothers often visit this day early, because we have been waiting for the watching to end since we were small. Rehearsal is how a trapped animal studies the fence. You can want her to live and still want your life to begin."}],"afterReads":[{"id":"nothing","title":"If you feel nothing","body":"Some daughters expect a collapse and meet a blank wall instead. The world has a script for orphans. It does not have a script for women who were orphaned in childhood and then asked to cry on schedule.\n\nFeeling nothing can mean your body already spent the grief in years of bracing. It can mean shock. It can mean you are protecting yourself from a performance. It can mean you are free, and free is quiet.\n\nYou do not have to manufacture a tear to prove the harm. Dry eyes are allowed here. Numb is not a verdict on what happened, and it is not a verdict on whether you are a good person. It is a nervous system choosing a low flame.\n\nIf a wave comes later — in a grocery aisle, in March, in a song you did not pick — that is allowed too. Nothing now and everything later is still a coherent heart."},{"id":"relief","title":"If you feel relief","body":"Relief is the most forbidden one. People will hear it as cruelty. I will not.\n\nIf she was the weather in every room, her death is a change in climate. Your shoulders drop. You sleep. You say something out loud and nobody reports it back to her. That ease can feel like dancing on a grave. It is not. It is a nervous system exiting a long winter.\n\nYou can be relieved and still lay a flower down for the mother you needed. Those are different women. One lived in your house. One lived in your hope. You may bury the second for the rest of your life, quietly, without a program.\n\nIf guilt arrives to punish the relief, let it sit without giving it the wheel. You were trained to treat her comfort as the moral center of the universe. That training does not get the last word."},{"id":"crying","title":"If you cannot stop crying","body":"Crying does not cancel what she did. Love and harm can share a body.\n\nYou may be crying for the little girl who kept trying. You may be crying because the last tiny chance of a different ending is gone. You may be crying because families become very loud at funerals and your truth has nowhere to stand. You may have loved pieces of her — the perfume, the rare soft night, the woman she was when other people were watching.\n\nNone of that is a retraction. Hearts are not courtrooms. You can be wrecked and still know what the kitchen was like. You can miss her and still not go back, even in memory, to the version of you that absorbed it all.\n\nCry. You are not 'going back.' You are not weak. You are not confused about what happened. The heart is allowed to break for a person who also broke it."},{"id":"alive","title":"If she is still alive","body":"Thinking about her death does not make you monstrous. Daughters of narcissistic mothers often visit this day early, because we have been waiting for the watching to end since we were small.\n\nYou might feel guilty for the thought. Let me hold that with you. Rehearsal is how a trapped animal studies the fence. You can want her to live and still want your life to begin. You can dread the funeral and still not be ready to call. You can plan the day and then feel sick at your own mind. That sickness is loyalty training, not a compass.\n\nYou do not have to decide your grief in advance. You will feel what you feel on the day, and then a different thing the week after, and then something else in a grocery aisle in March. We will name it then. Tonight you only have to be a woman who is telling the truth about a shadow that is already in the room."},{"id":"funeral","title":"The funeral","body":"Funerals are theater with a blood tie. You may be watched for the 'right' amount of crying. You may be asked to speak. You may be smeared in the receiving line. You may look at the body and feel a stranger. You may look and feel four years old.\n\nYou can go. You can not go. You can go and leave after ten minutes. You can wear black and think about your grocery list. You can sob and still not be rewriting history.\n\nThere is no correct daughter at a narcissistic mother's funeral. There is only you, getting through an hour that was never designed for your truth. If you perform, that is survival. If you stay home, that is survival. If you laugh in the car afterward because the body does strange things, that is survival too.\n\nThe family album is not a court. Your reality drawer is."},{"id":"after","title":"After the funeral","body":"The smear can outlive her. 'She was a saint.' 'Don't speak ill of the dead.' Flying monkeys get louder when they can no longer call the original number. Wills can be a last leash — money with a myth attached, a house that costs you the story.\n\nYou can refuse the story without refusing the paperwork. You can take the money and still not take the myth. You can refuse both. You can go no contact with a dead woman's narrative and still send a card to a cousin you actually love.\n\nDate what you know. Write it while it is still sharp. The years will try to sand it down; families will help. Your version is the one we are keeping.\n\nAnd if, months later, you are fine — really fine — that is not disrespect. That is a life. Peace can feel like stealing at first. It isn't. It's yours."}],"eras":[{"id":"golden","title":"Golden child years","whisper":"When you were the sun in the room","prompt":"What did it cost to be the good one? You can write a single afternoon. You can write a feeling with no plot."},{"id":"shift","title":"The shift","whisper":"When the warmth changed temperature","prompt":"The day, or the slow season, when you stopped being golden. You do not need the exact year."},{"id":"scapegoat","title":"Scapegoat","whisper":"When you became the problem that kept the story neat","prompt":"What were you blamed for. What did you start believing about yourself."},{"id":"smear","title":"The smear","whisper":"The story they told about you","prompt":"What they said to family, to friends, to you. The version that still visits at night."},{"id":"awakening","title":"Seeing it","whisper":"The first time the pattern had a name","prompt":"A book, a friend, a sentence that landed. Even if you put it down and picked it up again years later."},{"id":"leaving","title":"Leaving the script","whisper":"Grey rock, low contact, no contact, the first no","prompt":"Not a victory speech. Just what you did, and what it took."},{"id":"after","title":"After she's gone","whisper":"Or the grief that arrived while she was still alive","prompt":"If she has died — what you felt, and what you didn't. If she hasn't — the day you already visit in your mind."},{"id":"beyond","title":"A life of your own","whisper":"Not a triumph. Just what is yours now","prompt":"A kitchen. A friend. A quiet that belongs to you. Anything that is not her script."}],"exit":[{"id":"see","title":"See the script","lede":"Leaving starts in the mind, often years before the door. You are not late.","steps":[{"id":"see-name","title":"Give the move a name","body":"Guilt trip, smear, love-bomb, discard. Naming is not dramatic. It is how the fog thins."},{"id":"see-not-crazy","title":"Stop arguing with your memory","body":"If two versions exist, keep yours here. You do not have to win the argument to be right about your own life."},{"id":"see-body","title":"Notice what your body already knows","body":"The tight jaw before her name appears. The headache after the call. That is information, not weakness."},{"id":"see-one-person","title":"Tell one person who already believes you","body":"Not a jury. One witness. If you do not have one yet, this app will hold the words until a human can."}]},{"id":"grey","title":"Grey rock & low contact","lede":"You do not owe her a debate. Boring is a boundary with the lights off.","steps":[{"id":"grey-short","title":"Short answers, no new stories","body":"Fine. Busy. Thanks. You are not cold. You are uninteresting to the part of her that feeds on heat."},{"id":"grey-jade","title":"Do not JADE","body":"Justify, Argue, Defend, Explain — that is the old dance. You can hang up mid-sentence. You can answer tomorrow. You can not answer."},{"id":"grey-info","title":"Starve the information","body":"New job, new love, new address, new joy — she does not need the map. Joy is often punished. Keep it off the table."},{"id":"grey-time","title":"Shrink the time","body":"Calls with an end. Visits with an exit. A friend who will text you at 7 so you can leave. Low contact is a dimmer, not a failure of no contact."}]},{"id":"none","title":"No contact","lede":"No contact is not cruelty. It is the door you close so you can hear your own voice.","steps":[{"id":"none-safety","title":"If you are not safe, leave first, explain never","body":"A bag. Papers. A ride. A night somewhere she will not look. You do not need a speech. You need air."},{"id":"none-block","title":"Block the obvious doors","body":"Phone, email, social, the cousin who forwards everything. Flying monkeys are still her voice. You can be kind to them and still not open the letter."},{"id":"none-hoover","title":"Expect the hoover","body":"Illness, apology, birthday, a crisis that only you can fix. The warmth will feel like the mother you wanted. Name it. Wait 72 hours. The weather usually changes."},{"id":"none-grief","title":"Let the grief be ugly","body":"You can miss her and still not go back. You can feel like a bad daughter. You can feel free and then terrified of the free. Stay."}]},{"id":"rebuild","title":"A life beyond her script","lede":"This is the slow part. No one claps. The garden still counts it.","steps":[{"id":"rebuild-body","title":"Give the body a quieter job","body":"Sleep, food, a walk, a room that does not listen. Healing is often boring. Boring is a gift you were not given."},{"id":"rebuild-chosen","title":"Collect chosen family slowly","body":"One safe person is a continent. You do not have to throw a banquet. You have to practice being believed."},{"id":"rebuild-self","title":"Find out who you are when no one is grading you","body":"Taste, work, rest, a no that does not come with a thesis. You were a role. You are allowed to be a person."},{"id":"rebuild-after","title":"If she dies, you still get to be complicated","body":"Relief, nothing, a collapse in the grocery aisle — none of it is a verdict. There is a whole room in this app for that day."}]}]}; window.HELD_ART = {"welcome":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDABMNDhEODBMRDxEVFBMXHTAfHRoaHToqLCMwRT1JR0Q9Q0FMVm1dTFFoUkFDX4JgaHF1e3x7SlyGkIV3j214e3b/2wBDARQVFR0ZHTgfHzh2T0NPdnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnb/wAARCAOEAqMDASIAAhEBAxEB/8QAGgAAAgMBAQAAAAAAAAAAAAAAAgMAAQQFBv/EADsQAAICAQMDAwIEBQQDAAIBBQECABEDEiExBEFREyJhcYEFMpGhFCNCscFS0eHwM2LxJHIVQzSCkqL/xAAYAQEBAQEBAAAAAAAAAAAAAAAAAQIDBP/EACERAQEBAAMBAQEBAAMBAAAAAAABEQIhMUESYVEDInGB/9oADAMBAAIRAxEAPwDuWZWm9+JekSUOeJ53UP5TueZbVf8AeWeKsfSUBvxKimJrbmUCfEskESCh9YFlQYs2CN4ZN8Hf4lZCK8NAFmC8cxY3bXfPaQgi9UjbLtKgv2k1hRfI8XKG4sRbE8fvAcKIJuQAXvx8RdlfpLZrAva4BE0JYAHPAgUSRvtL1f0jn/EC9WgkQW3J/wBpTErdfvAZzo2O/wARgZrK7bH7S2yVsTzxELd738bwxTdt5cDdYO2/1l6AdhsfMEAkC41edt/rICF1QAFS1bseYJcLt+0i+4AirkxV5AwO0G9rHMM3VHc1zE0fcRt9IB6r3+ZK3H+JENgEceJCSYE7UZFJF1Je3aUdqEgO+54Mi781Urk95a/EKM0RUr8pu/tLHO8hIHI2gUN7N1L55NSgtbjiWbrttAhthR/WXyN/tKs3xW0h3HgyCD5q5OO37y1r63KIAPO0C/ntKrfaX9JdUORAEDftCo995ABJuLECm5G1CVxx2hablNsfiBd7SCiJQo96l8bVZgCbvaq8SzkHcVAd6IF1clbC5RPVs0V5+ZP2lMoq5Esim33gESa2H0nPUX+YUb3E6QXfyIjPhRgW1nGeLPEIxuQm/Av9JMLL64DH/wBvMHLjxoug5HyMdqUUP1g4S+IFQ50k+LIkHTGRGUHUu/naZ8mAFdCsL7C9x9JMPTo9tlY5Dxv2hnpMCjbEo8VCuY2PI9ZEILg+4XwR4mzG4yKSAR2IbmU/SFF09PZH/wC28EY8dqXfJjYdz/2oRrQaRqNbiBlxlnDLsQOOxizkyrRtXx9/JjE6jDl2DgHwTCg1qLHDDeorIgyWR+Yito7rK9BqF8AVMJZl92rfgQlA6Mj210TQPzIzErp8b3K1OyaGZt/m5b4XAVltiBvQuVHU6YnJhR2Y7gGYmUJlZGP5Tt9O01dCf/xsa3vpsq3MHr20YAbA91UR5hWbJnVGC2SxHAgJ1IZQXUqPJmd9hRJLHvIBezGz5HeE1tJVkJRrHxAyEN04obrW17xOIsuUBbIY0R/mbsKrkDptR3kVy22ZtW0Cid1BH+Zo6jp2VXRgdr93+qZx7VpfHJlZq1cuNJqTKxVLHbmKb2tZAvz4hb
