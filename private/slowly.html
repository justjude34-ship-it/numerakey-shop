<style>
  :root{
    --bg:#000;
    --panel:#0d0b12;
    --panel-2:#16121e;
    --line:rgba(255,255,255,.11);
    --line-soft:rgba(255,255,255,.06);
    --ink:#f1edf5;
    --dim:#a99fb6;
    --dimmer:#786f85;
    --teal:#7fd6c9;
    --violet:#9d8bdf;
    --rose:#e07aa5;
    --gold:#e3ba82;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;
    -webkit-text-size-adjust:100%;overflow-wrap:break-word}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
  a{color:var(--teal)}

  header.bar{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
  .bar-in{max-width:760px;margin:0 auto;padding:12px 18px 4px;display:flex;align-items:center}
  .mark{font-family:var(--serif);font-size:23px;letter-spacing:.03em;
    background:linear-gradient(100deg,var(--teal),var(--violet) 55%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
  nav.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:760px;margin:0 auto;padding:0 12px 8px}
  nav.rail::-webkit-scrollbar{display:none}
  nav.rail button{flex:0 0 auto;background:none;border:none;color:var(--dimmer);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:14px;white-space:nowrap}
  nav.rail button.on{color:#0a0710;background:linear-gradient(100deg,var(--teal),var(--violet))}
  nav.rail button:hover:not(.on){color:var(--ink)}

  .wrap{max-width:760px;margin:0 auto;padding:0 18px 140px}
  h1.t{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.2;margin:24px 0 6px;
    background:linear-gradient(100deg,var(--teal),var(--violet) 50%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
  h2.s{font-family:var(--serif);font-weight:400;font-size:20px;margin:30px 0 10px}
  .lede{color:var(--dim);margin:0 0 20px;max-width:60ch}
  .muted{color:var(--dim);font-size:14.5px}
  .tiny{color:var(--dimmer);font-size:12.5px}
  p{margin:0 0 12px}

  .scene{display:block;width:100%;height:auto;border-radius:16px;margin:16px 0 0;border:1px solid var(--line-soft)}

  .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:16px;margin:0 0 12px}
  .card.glow{border-color:rgba(157,139,223,.4);background:linear-gradient(160deg,rgba(127,214,201,.07),rgba(157,139,223,.07) 55%,rgba(224,122,165,.07))}
  .card h3{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:18px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.two{grid-template-columns:1fr}}

  .btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:14px}
  .btn:hover{border-color:var(--teal)}
  .btn.primary{background:linear-gradient(100deg,#7c69d6,#d1568a);color:#fff;border:none;font-weight:600}
  .btn.quiet{background:none;color:var(--dim);border-color:var(--line-soft)}
  .btn.danger{color:#ef8fa3;border-color:rgba(239,143,163,.35)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.sm{padding:6px 11px;font-size:13px}

  label.f{display:block;margin:0 0 14px}
  label.f>span{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
  input[type=text],input[type=date],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:var(--ink)}
  textarea{resize:vertical;min-height:84px;line-height:1.6}
  input::placeholder,textarea::placeholder{color:var(--dimmer)}

  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px}
  .chip.on{color:#0a0710;background:linear-gradient(100deg,var(--teal),var(--violet));border-color:transparent;font-weight:600}

  .list{list-style:none;margin:0;padding:0}
  .list li{border-bottom:1px solid var(--line-soft)}
  .li-btn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:14px 2px;cursor:pointer}
  .li-n{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--dim);border:1px solid var(--line)}
  .li-n.done{background:linear-gradient(100deg,var(--teal),var(--violet));color:#0a0710;border-color:transparent}
  .li-t{font-family:var(--serif);font-size:17px}
  .li-s{display:block;font-family:var(--sans);font-size:13px;color:var(--dimmer)}

  .bar-track{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(100deg,var(--teal),var(--violet))}
  .area-row{margin:0 0 14px}
  .area-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}

  .quote{border-left:3px solid var(--violet);padding:4px 0 4px 14px;margin:14px 0;font-family:var(--serif);font-size:18px;line-height:1.6}
  .try{border:1px solid rgba(127,214,201,.35);background:rgba(127,214,201,.06);border-radius:14px;padding:14px 16px;margin:18px 0}
  .try b{color:var(--teal);font-weight:600;display:block;margin-bottom:4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .tag{display:inline-block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 9px;margin:0 6px 6px 0}
  .tag.red{color:#ef8fa3;border-color:rgba(239,143,163,.4)}
  .tag.green{color:var(--teal);border-color:rgba(127,214,201,.4)}
  .back{background:none;border:none;color:var(--dim);cursor:pointer;padding:6px 0;font-size:14px}
  .back:hover{color:var(--teal)}
  .empty{border:1px dashed var(--line);border-radius:16px;padding:24px 18px;text-align:center;color:var(--dim)}
  .x{background:none;border:none;color:var(--dimmer);cursor:pointer;font-size:16px;padding:4px 8px}
  .x:hover{color:#ef8fa3}
  .script{margin:0 0 10px;padding:12px 14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--panel)}
  .script .who{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);margin-bottom:4px}
  .script q{display:block;quotes:none;font-family:var(--serif);font-size:17px;line-height:1.55}

  /* hold on */
  .holdfab{position:fixed;right:16px;bottom:18px;z-index:30;border:none;cursor:pointer;color:#fff;font-weight:600;font-size:14px;
    padding:12px 18px;border-radius:999px;background:linear-gradient(100deg,#7c69d6,#d1568a);box-shadow:0 8px 30px rgba(124,105,214,.45)}
  .breath{width:150px;height:150px;border-radius:50%;margin:22px auto;display:grid;place-items:center;text-align:center;font-size:14px;color:#0a0710;font-weight:600;
    background:radial-gradient(circle at 35% 30%,var(--teal),var(--violet) 70%);animation:br 10s ease-in-out infinite}
  @keyframes br{0%{transform:scale(.62)}40%{transform:scale(1)}100%{transform:scale(.62)}}
  .big{font-family:var(--serif);font-size:40px;text-align:center;margin:6px 0}

  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line);
    border-radius:999px;padding:9px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><span class="mark">Slowly</span></div><nav class="rail" id="rail"></nav></header>

<script>
"use strict";
/* Slowly — the first dates and early months, at your own pace.
   Single file. Everything stays on this device. No account, no API key. */
const KEY = "slowly.v1";

const PACE_ITEMS = [
  ["excl", "Exclusivity talk or labels", 12],
  ["fr", "Meeting their friends", 6],
  ["mine", "Them meeting my friends", 6],
  ["addr", "Sharing my home address", 8],
  ["stay", "Staying over", 8],
  ["social", "Connecting on social media", 12],
  ["fam", "Meeting my kids or close family", 24],
  ["story", "Telling them my story, in person, in small pieces", 16],
  ["move", "Moving in or merging finances", 52]
];
const STAGES = [
  { to: 2, n: "Weeks 1 to 2: getting curious",
    ok: ["Short, public meet-ups.", "Chatting at a pace that suits you both.", "Noticing how they treat you and other people."],
    hold: ["Your address, workplace and your story.", "Labels or exclusivity.", "Any money talk."],
    watch: ["Flooding you with messages or compliments.", "“I’ve never felt like this.”", "Pressure to move to another app, or to meet fast."] },
  { to: 6, n: "Weeks 2 to 6: the speed-up",
    ok: ["A few relaxed dates a week at most.", "Keeping your own friends, plans and routines.", "Taking a day to reply sometimes."],
    hold: ["Exclusivity, meeting kids or family, holidays together.", "Staying over before you feel safe.", "Big feelings said out loud, from either of you."],
    watch: ["Plans for the future already.", "Wanting all your time.", "Sulking when you’re busy."] },
  { to: 12, n: "Weeks 6 to 12: the first cracks",
    ok: ["Meeting each other’s friends, if you both want to.", "Disagreeing about something small and seeing how it goes."],
    hold: ["Moving in, shared money or big purchases.", "Giving up plans or people for them."],
    watch: ["A sharp comment passed off as a joke.", "Blaming you or an ex when things go wrong.", "Going cold after a no."] },
  { to: 26, n: "Months 3 to 6: who they really are",
    ok: ["Talking about what you each want.", "Saying a mild no and seeing it respected.", "Starting to share more of yourself, slowly."],
    hold: ["Moving in or joint finances before about a year."],
    watch: ["You explaining or apologising for things that weren’t wrong.", "Hot and cold swings.", "Your friends worrying."] },
  { to: 9999, n: "Six months on",
    ok: ["A steady rhythm that includes your own life.", "Honest conversations that end calmly."],
    hold: ["Decisions you’d feel pressured into."],
    watch: ["You walking on eggshells.", "Anyone controlling your time, money or friends."] }
];
const TAGS = [
  ["g1", "Respected a small no", "g"], ["g2", "Asked about me and listened", "g"], ["g3", "Did what they said they would", "g"],
  ["g4", "Stayed kind when I was busy", "g"], ["g5", "Happy to go slowly", "g"], ["g6", "Apologised well", "g"], ["g7", "Kind to others, like staff and friends", "g"],
  ["r1", "Sulked or went cold after a no", "r"], ["r2", "Pushed the pace: labels, trips, “I love you”", "r"], ["r3", "Flooded me with messages", "r"],
  ["r4", "Blamed an ex or someone else", "r"], ["r5", "Got sharp, or put me down", "r"], ["r6", "Pressured me to meet, share or stay on a call", "r"],
  ["r7", "Changed their story", "r"], ["r8", "Made me feel guilty", "r"], ["r9", "Huge attention, then withdrew", "r"]
];
const TAGMAP = Object.fromEntries(TAGS.map(t => [t[0], t]));
const EXITS = [
  "I’ve had a lovely time, but I need to head off now.",
  "Thanks for tonight. I’m going to call it here. Talk soon.",
  "I’m feeling tired and I’d like to go. I’ll message you tomorrow.",
  "This isn’t quite right for me, so I’m going to head off. I wish you well."
];
const NOTICE = [
  "How they treat staff, waiters and strangers.",
  "Whether they listen, or wait for their turn to talk.",
  "How they talk about exes and past friends.",
  "How they react if you change something small, like the table or the time.",
  "Whether they check their phone, or give you their attention.",
  "How you feel: calm, or on edge and trying hard?"
];
const FEELS = ["Calm", "Warm", "Buzzing", "Anxious", "Drained", "Confused"];
const DQ = [
  ["I feel calm after we talk.", "g"], ["They’ve respected a no.", "g"], ["I’d happily introduce them to my friends.", "g"],
  ["I can be myself with them.", "g"], ["They do what they say they’ll do.", "g"], ["I’m sleeping and eating normally.", "g"],
  ["I feel anxious waiting for their reply.", "r"], ["I keep changing my plans to suit them.", "r"], ["I’m keeping things from my friends about them.", "r"],
  ["I explain or apologise for things that weren’t wrong.", "r"], ["I feel I have to earn their approval.", "r"]
];
const GOODBYE = [
  ["Kind", "I’ve enjoyed getting to know you, but I don’t think we’re a match. I wish you well."],
  ["Firm", "I’ve decided to stop seeing each other. I won’t be changing my mind."],
  ["Final", "I won’t be continuing this. Please don’t contact me again."]
];
const TRIGGERS = [
  ["reply", "I want to reply right now", ["Put the phone down for ten minutes.", "Ask: would I answer this quickly if I weren’t anxious?", "Reply later, short and kind. A slow reply is a healthy reply."]],
  ["love", "They want a label, or to say “I love you”, already", ["Name it: “This is moving fast.” That’s information, not an insult.", "You don’t have to answer tonight. “I’m enjoying this, and I’m taking my time.”", "Notice how they react to slow. That’s the real answer."]],
  ["cancel", "I’m about to cancel my own plans for them", ["Ask: would I do this for a friend, or only because I’m afraid of upsetting them?", "Keep your plan. Offer them another time.", "A good person makes room for your life."]],
  ["tell", "I’m about to tell them everything about my past", ["Stop. Not yet. Your story is precious, and it’s earned over months, in person.", "Write it down here or tell a friend instead.", "If they’re right for you, they’ll still be there when you’re ready."]],
  ["gut", "Something felt off, and I’m talking myself out of it", ["Write down exactly what happened, in one line.", "Tell a friend and ask what they see.", "Pause contact for a couple of days. Your gut is data."]]
];

const LESSONS = [
  { id: "s1", t: "Why slow works", s: "Time shows what charm can hide",
    body: ["Narcissistic charm is fast and hard to keep up. It works best when you rush, because the early version of someone is the best version. Time is the strongest filter you have.",
      "Slow doesn’t mean cold. It means giving someone enough weeks to show you who they are when they’re tired, disappointed or told no. Someone who’s genuinely interested in you is happy to wait."],
    q: "Time is the filter.", tr: "Decide your own timeline in My pace. Pick one thing you’ll wait for." },
  { id: "s2", t: "Love-bombing looks like love", s: "Why intensity isn’t proof",
    body: ["Love-bombing is a flood of attention, compliments, plans and “I’ve never felt like this”. It feels like being truly seen. After abuse it can feel like exactly what you missed.",
      "The giveaway isn’t the kindness. It’s the speed, and what happens when you slow it down. Real affection grows. Love-bombing arrives all at once, and often stops all at once."],
    list: ["Constant messages in the first week.", "Talk of soulmates, forever or a future in the first month.", "Gifts, trips or big gestures very early.", "Disappointment or sulking when you take your time."],
    tr: "If someone is moving fast, say “I’d like to go slower.” Notice what they do next." },
  { id: "s3", t: "Judge the pattern, not the moment", s: "One good day proves nothing",
    body: ["Everyone has a bad day. You’re not looking for perfect. You’re looking for a pattern over weeks: how do they handle disappointment, a no, a mistake, a busy week?",
      "Keep a short note of what you notice in the People tab. A pattern becomes clear in your own words long before you’ll admit it to yourself."],
    tr: "After each date, add one thing you noticed to their page. Don’t judge it yet." },
  { id: "s4", t: "The small no test", s: "How they take a mild no",
    body: ["A small no is the safest test there is. Reschedule once. Say “I’d rather not talk about that.” Take a day to reply. Decline a small favour.",
      "Someone safe says “no problem”. Someone concerning sulks, argues, guilt-trips or goes cold. It’s not that one reaction means everything. It’s whether you get the same response again and again."],
    cmp: [["“No problem, another time.”", "Stays warm and in touch", "Asks if everything’s okay"], ["Sulks, goes quiet or gets sharp", "“After everything I’ve done for you”", "Pushes until you give in"]],
    tr: "Say one small no this week. Log how they respond." },
  { id: "s5", t: "The first cracks", s: "Weeks six to twelve",
    body: ["After the speed-up, the first cracks often appear: a “joke” that cuts, blame passed on to an ex, irritation when you’re busy. It’s easy to explain away because the early weeks were so good.",
      "You’re not being unfair. You’re noticing. The question to ask is: am I explaining or apologising for things that weren’t wrong?"],
    list: ["You start rehearsing what to say so they won’t get upset.", "You feel relieved when they’re in a good mood.", "Your friends say something and you defend them."],
    tr: "Write down the first thing that felt off. Show it to a friend." },
  { id: "s6", t: "Safe can feel boring", s: "Calm isn’t flat",
    body: ["If you’re used to chaos, calm can feel like something’s missing. There’s no rush, no highs and lows. That’s not a lack of chemistry. It may be what safety feels like.",
      "Give calm a few more dates before you decide. Notice whether you feel relaxed, and whether you can be yourself. That matters more than butterflies."],
    q: "Buzzing isn’t the same as safe.", tr: "After your next date, rate how calm you felt, not how excited." },
  { id: "s7", t: "Let your friends in", s: "They can see what you can’t",
    body: ["Tell a friend about everyone you date, and introduce them when it feels right. Friends see patterns you’re too close to see.",
      "Be wary of anyone who wants to keep things secret, criticises your friends or makes you choose between them and the relationship."],
    tr: "Tell a trusted friend about the person you’re seeing, and ask what they notice." },
  { id: "s8", t: "Intimacy and pressure", s: "Your pace, your call",
    body: ["Intimacy is for when you want it, not as a test of commitment or something you owe. Anyone who sulks, pressures or makes you feel guilty about your pace is showing you something important.",
      "Staying over, sex and exclusivity can wait until you feel safe, which for many survivors is later than other people. There’s no right date for it."],
    tr: "Write down when you’d like to feel ready for each step. Keep that in My pace." },
  { id: "s9", t: "Ending it", s: "You don’t need their agreement",
    body: ["You can end it at any point, by message, and you don’t need to explain. If they get angry, that’s a reason to end it, not a reason to stay.",
      "Keep it short, kind and final. Block if you need to. If you ever feel unsafe, tell a friend and call a support line."],
    tr: "Copy a goodbye line in Decide and keep it for the day you need it." },
  { id: "s10", t: "Keeping your own life", s: "The most protective thing you can do",
    body: ["Keep your friends, hobbies, work and routines. People who are right for you fit in around a full life. People who aren’t will ask you to clear space for them.",
      "If your week has shrunk around one person, take that as information."],
    tr: "Check your calendar. Is everything you love still on it?" }
];

const blank = () => ({ v: 1, people: [], pace: Object.fromEntries(PACE_ITEMS.map(p => [p[0], p[2]])), plans: [], read: {}, decide: {}, hideInstall: false });
let S = load();
let view = "home", lessonOpen = null, personOpen = null, trigger = null;
function load() { try { const r = localStorage.getItem(KEY); return r ? Object.assign(blank(), JSON.parse(r)) : blank(); } catch (e) { return blank(); } }
let saveT = null;
function save(now) {
  clearTimeout(saveT);
  const w = () => { try { localStorage.setItem(KEY, JSON.stringify(S, (k, v) => k[0] === "_" ? undefined : v)); } catch (e) { toast("Storage is full. Download a backup."); } };
  now ? w() : saveT = setTimeout(w, 350);
}
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200); }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const keepScroll = fn => { const y = window.scrollY; fn(); window.scrollTo(0, y); };
const weeksIn = p => Math.max(0, Math.floor((Date.now() - new Date(p.start + "T00:00:00").getTime()) / 604800000));
const stageOf = w => STAGES.find(s => w < s.to);

/* ---------- illustrations ---------- */
function scene(kind) {
  const stars = [[40,40],[120,70],[210,30],[300,60],[380,25],[470,55],[560,35],[650,70],[730,30],[90,120],[690,130],[520,110],[260,100]]
    .map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 1.3 : 1.9}" fill="#fff" opacity="${i % 2 ? .5 : .85}"/>`).join("");
  const stones = [0, 1, 2, 3, 4].map(i => `<ellipse cx="${300 + i * 50}" cy="${232 - i * 24}" rx="${26 - i * 3}" ry="${7 - i * .8}" fill="#1c1430" stroke="#9d8bdf" stroke-width="2" opacity="${1 - i * .12}"/>`).join("");

const NAV = [["home","Home"],["people","People"],["pace","My pace"],["dates","First dates"],["learn","Learn"],["decide","Decide"],["install","Add to phone"],["settings","Settings"]];
function renderRail() {
  document.getElementById("rail").innerHTML = NAV.map(([k, l]) => `<button data-act="go" data-v="${k}" class="${view === k ? "on" : ""}">${l}</button>`).join("");
  const on = document.querySelector("#rail .on"); if (on && on.scrollIntoView) on.scrollIntoView({ inline: "center", block: "nearest" });
}
function go(v) { view = v; lessonOpen = null; personOpen = null; trigger = null; renderRail(); render(); window.scrollTo(0, 0); }
function render() {
  const f = { home: vHome, people: vPeople, pace: vPace, dates: vDates, learn: vLearn, decide: vDecide, calm: vCalm, install: vInstall, settings: vSettings }[view] || vHome;
  document.getElementById("view").innerHTML = f();
  document.getElementById("holdfab").style.display = view === "calm" ? "none" : "";
  bindInputs();
}
function supportBlock() {
  return `<p class="tiny" style="margin-top:28px;line-height:1.7">Need to talk to someone? Australia: 1800RESPECT 1800 737 732 · Lifeline 13 11 14. US: 1-800-799-7233 (text START to 88788). UK: 0808 2000 247. International: findahelpline.com.</p>`;
}

/* ---------- pattern ---------- */
function counts(p) {
  let g = 0, r = 0, rAfterNo = 0, afterNo = 0;
  p.moments.forEach(m => {
    const mg = m.tags.filter(t => TAGMAP[t][2] === "g").length, mr = m.tags.filter(t => TAGMAP[t][2] === "r").length;
    g += mg; r += mr; if (m.afterNo) { afterNo++; if (mr) rAfterNo++; }
  });
  return { g, r, rAfterNo, afterNo };
}
function pattern(p) {
  const c = counts(p);
  if (!p.moments.length) return ["", "Add what you notice after each date or chat. Patterns show up over weeks, not days."];
  if ((c.r >= 3 && c.r > c.g) || c.rAfterNo >= 2) return ["red", "A pattern to take seriously." + (c.rAfterNo ? ` ${c.rAfterNo} of your concerns came right after a no or a change of plan, and that’s the most important pattern to watch.` : "") + " Slow contact right down, talk to a friend, and think about ending it."];
  if (c.rAfterNo >= 1) return ["amber", "One thing to watch: how they reacted when you said no. See whether it repeats before you go further."];
  if (c.r >= 1) return ["amber", "A couple of things to watch. Keep the pace slow and see whether they repeat."];
  if (c.g >= 3) return ["green", "Good signs so far. Keep going slowly and keep your own life going."];
  return ["", "Early days. Keep noting what you see."];
}

/* ---------- People ---------- */
function vPeople() {
  if (personOpen) return vPerson();
  return `
    ${scene("moons")}
    <h1 class="t">People</h1>
    <p class="lede">Add someone you’re seeing and note what you notice. Over weeks, you’ll see the pattern in your own words.</p>
    <div class="card"><label class="f"><span>Name or nickname</span><input type="text" id="pname" placeholder="e.g. Sam from the app"></label>
      <label class="f"><span>When did you first meet or start talking?</span><input type="date" id="pstart" value="${todayStr()}"></label>
      <button class="btn primary" data-act="addperson">Add</button></div>
    ${S.people.map(p => { const w = weeksIn(p), pt = pattern(p);
