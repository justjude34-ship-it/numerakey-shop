<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<title>Aureole</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#f4f1ea;font-family:"Segoe UI",system-ui,sans-serif}
body{overflow:hidden}
button,input{font:inherit}
#splash{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
#splash .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.72) 100%)}
#splash .copy{position:relative;z-index:2;text-align:center;padding:0 22px 28px;padding-bottom:max(28px,env(safe-area-inset-bottom))}
#splash h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:52px;letter-spacing:-.03em}
#splash p{margin-top:4px;color:rgba(244,241,234,.78);font-size:15px}
#enter{margin-top:18px;min-height:48px;min-width:180px;border:0;border-radius:999px;background:rgba(244,241,234,.92);color:#111;font-weight:600;letter-spacing:.04em;cursor:pointer}
#stage{position:fixed;inset:0;background:#000}
#mandala{position:absolute;left:50%;top:28%;width:min(92vw,520px);height:min(92vw,520px);transform:translate(-50%,-50%);pointer-events:none}
#hero{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;transform-origin:50% 42%}
.guide{position:absolute;left:0;right:0;top:max(16px,env(safe-area-inset-top));text-align:center;pointer-events:none;z-index:3;text-shadow:0 2px 16px #000}
.guide b{display:block;font-family:Georgia,serif;font-size:40px;font-weight:500}
.guide span{display:block;margin-top:4px;font-size:13px;color:rgba(244,241,234,.72)}
#dock{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 12px max(12px,env(safe-area-inset-bottom));max-height:58dvh;overflow:auto}
.glass{background:rgba(8,8,10,.42);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px;margin-bottom:8px;backdrop-filter:blur(10px)}
.glass h2{font-size:13px;font-weight:600;letter-spacing:.04em}
.sub{font-size:11px;color:rgba(244,241,234,.55);margin:2px 0 8px}
.row{display:flex;gap:6px;overflow:auto}
.row::-webkit-scrollbar{display:none}
button.chip{flex:0 0 auto;min-height:44px;border:0;border-radius:12px;padding:8px 12px;background:transparent;color:rgba(244,241,234,.86);cursor:pointer}
button.chip.on{background:rgba(244,241,234,.82);color:#111}
button.chip small{display:block;font-size:10px;opacity:.7}
.vol{font-size:11px;color:rgba(244,241,234,.62);margin-top:8px}
input[type=range]{width:100%;accent-color:#d7c39a}
.clock{text-align:center;font-variant-numeric:tabular-nums;font-size:13px;color:rgba(244,241,234,.7);margin-top:6px}
.hide #dock,.hide .guide{opacity:0;pointer-events:none}
#dock,#splash{transition:opacity .2s}
</style>
</head>

  <div class="guide" id="guide" hidden>
    <b id="phase">Inhale</b>
    <span id="count"></span>
  </div>
  <div id="dock">
    <section class="glass">
      <h2>Colours</h2>
      <p class="sub">Same mandala. Tap the picture to hide controls.</p>
      <div class="row" id="palettes"></div>
    </section>
    <section class="glass">
      <h2>Breath</h2>
      <p class="sub">Connected, heart, calm, and sleep rhythms.</p>
      <div class="row" id="breaths"></div>
    </section>
    <section class="glass">
      <h2>Sounds</h2>
      <p class="sub">Heartbeat, ocean, and breath. Headphones for beats.</p>
      <div class="row" id="sounds"></div>
      <div class="row" id="tones" style="margin-top:6px"></div>
      <div class="row" id="timers" style="margin-top:6px"></div>
      <div class="clock" id="clock">Timer off</div>
      <label class="vol">Volume <input id="vol" type="range" min="20" max="180" value="110"></label>
    </section>
    <section class="glass">
      <h2>Your music</h2>
      <p class="sub">Add a track from this phone. It stays on this device.</p>
      <input id="music" type="file" accept="audio/*"/>
    </section>
  </div>
</div>
<script>
const COVER_SRC = document.querySelector("#splash img").src;
const palettes = {
  original: ["#1aa6a6","#e6c36a","#7fd0c8","#f3e6c4"],
  fuchsia: ["#d46ad4","#f0b7e4","#8fd0e8","#f7e7f4"],
  purple: ["#8b6cff","#c9b6ff","#6ec8e0","#efe8ff"],
  hypnotic: ["#7ee0ff","#e7c56a","#d07cff","#f4f1ea"]
};
const breaths = [
  {id:"connected",name:"20 Connected",hint:"No pause",rounds:20,steps:[{p:"in",ms:3000,l:"Inhale"},{p:"out",ms:3000,l:"Exhale"}],fifth:[{p:"in",ms:5000,l:"Big inhale"},{p:"out",ms:6000,l:"Sigh"}]},
  {id:"heart",name:"Heart",hint:"5 and 5",rounds:12,steps:[{p:"in",ms:5000,l:"Inhale"},{p:"out",ms:5000,l:"Exhale"}]},
  {id:"circular",name:"Circular",hint:"One wheel",rounds:30,steps:[{p:"in",ms:3500,l:"Inhale"},{p:"out",ms:3500,l:"Exhale"}]},
  {id:"slow",name:"Low & Slow",hint:"Soft",rounds:10,steps:[{p:"in",ms:6000,l:"Inhale"},{p:"out",ms:6000,l:"Exhale"}]},
  {id:"box",name:"Box",hint:"4-4-4-4",rounds:8,steps:[{p:"in",ms:4000,l:"Inhale"},{p:"hold",ms:4000,l:"Hold"},{p:"out",ms:4000,l:"Exhale"},{p:"rest",ms:4000,l:"Hold"}]},
  {id:"f478",name:"4-7-8",hint:"Calm",rounds:8,steps:[{p:"in",ms:4000,l:"Inhale"},{p:"hold",ms:7000,l:"Hold"},{p:"out",ms:8000,l:"Exhale"}]},
  {id:"sigh",name:"Sigh",hint:"Relief",rounds:10,steps:[{p:"in",ms:2500,l:"Inhale"},{p:"out",ms:5500,l:"Sigh"}]},
  {id:"open",name:"Open",hint:"Expand",rounds:12,steps:[{p:"in",ms:4000,l:"Open"},{p:"out",ms:4000,l:"Let go"}]}
];
const tones = [
  {id:"relax",name:"Relax",hz:10},
  {id:"sleep",name:"Sleep",hz:2},
  {id:"meditate",name:"Meditate",hz:6},
  {id:"deep",name:"Deep",hz:4}
];
const beds = [
  {id:"heart",name:"Heartbeat"},
  {id:"ocean",name:"Ocean"},
  {id:"breath",name:"Breath"}
];
let palette = "original", trance = false, breathId = null, toneId = null;
let timerMin = 0, endsAt = 0, session = 0, fill = 0, hiding = false;
const cnv = document.getElementById("mandala"), ctx2 = cnv.getContext("2d");
const hero = document.getElementById("hero");
const guide = document.getElementById("guide"), phaseEl = document.getElementById("phase"), countEl = document.getElementById("count");
const clock = document.getElementById("clock");
let ac, master, toneGain, bedGain, musicGain, musicEl, leftO, rightO, bedNodes = [], breathNode, lfo;

function chip(parent, label, hint, on){
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip" + (on ? " on" : "");
  b.innerHTML = label + (hint ? "<small>" + hint + "</small>" : "");
  parent.appendChild(b);
  return b;
}
function clearOn(parent){ parent.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); }
Object.keys(palettes).forEach((id,i) => {
  const b = chip(document.getElementById("palettes"), id[0].toUpperCase()+id.slice(1), "", i===0);
  b.onclick = () => { palette = id; trance = id==="hypnotic"; clearOn(b.parentNode); b.classList.add("on"); };
});
breaths.forEach(item => {
  const b = chip(document.getElementById("breaths"), item.name, item.hint, false);
  b.onclick = () => {
    if (breathId === item.id) { breathId = null; b.classList.remove("on"); stopBreath(); return; }
    breathId = item.id; session++; clearOn(b.parentNode); b.classList.add("on");
    ensure().then(() => startBreath(item));
  };
});
beds.forEach(item => {
  const b = chip(document.getElementById("sounds"), item.name, "", false);
  b.onclick = () => {
    b.classList.toggle("on");
    ensure().then(() => syncBeds());
  };
});
tones.forEach(item => {
  const b = chip(document.getElementById("tones"), item.name, item.hz + " Hz", false);
  b.onclick = () => {
    if (toneId === item.id) { toneId = null; b.classList.remove("on"); stopTone(); return; }
    toneId = item.id; clearOn(b.parentNode); b.classList.add("on");
    ensure().then(() => startTone(item.hz));
  };
});
[0,15,30,60].forEach(m => {
  const b = chip(document.getElementById("timers"), m ? m + " min" : "Timer off", "", m===0);
  b.onclick = () => {
    timerMin = m; clearOn(b.parentNode); b.classList.add("on");
    endsAt = m && (toneId || bedOn()) ? Date.now() + m*60000 : 0;
    tick();
  };
});
document.getElementById("enter").onclick = () => {
  document.getElementById("splash").style.display = "none";
  ensure();
};
document.getElementById("stage").onclick = (e) => {
  if (e.target.closest("#dock,button,input")) return;
  hiding = !hiding;
  document.body.classList.toggle("hide", hiding);
};
document.getElementById("vol").oninput = (e) => { if (master) master.gain.value = e.target.value/100; };
document.getElementById("music").onchange = (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  ensure().then(() => {
    if (!musicEl) {
      musicEl = new Audio();
      musicEl.loop = true;
      const src = ac.createMediaElementSource(musicEl);
      musicGain = ac.createGain();
      musicGain.gain.value = 0.45;
      src.connect(musicGain).connect(master);
    }
    musicEl.src = URL.createObjectURL(file);
    musicEl.play();
  });
};

function bedOn(){ return !!document.querySelector("#sounds .chip.on"); }
function ensure(){
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 1.1;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 3;
    master.connect(comp).connect(ac.destination);
    toneGain = ac.createGain(); toneGain.gain.value = 0.55; toneGain.connect(master);
    bedGain = ac.createGain(); bedGain.gain.value = 0.7; bedGain.connect(master);
  }
  return ac.state === "suspended" ? ac.resume() : Promise.resolve();
}
function stopTone(){ try{ leftO && leftO.stop(); rightO && rightO.stop(); }catch(e){} leftO = rightO = null; }
function startTone(hz){
  stopTone();
  leftO = ac.createOscillator(); rightO = ac.createOscillator();
  leftO.type = rightO.type = "sine";
  leftO.frequency.value = 136; rightO.frequency.value = 136 + hz;
  const lp = ac.createStereoPanner(), rp = ac.createStereoPanner();
  lp.pan.value = -1; rp.pan.value = 1;
  leftO.connect(lp).connect(toneGain); rightO.connect(rp).connect(toneGain);
  leftO.start(); rightO.start();
  if (timerMin) endsAt = Date.now() + timerMin*60000;
}
function noiseBuf(){
  const buf = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
  const d = buf.getChannelData(0);
  let b = 0;
  for (let i=0;i<d.length;i++){ const w = Math.random()*2-1; b = (b + 0.02*w)/1.02; d[i] = b*3.5; }
  return buf;
}
function syncBeds(){
  bedNodes.forEach(n => { try{ n.stop && n.stop(); n.disconnect(); }catch(e){} });
  bedNodes = [];
  const want = [...document.querySelectorAll("#sounds .chip.on")].map(b => b.textContent.trim());
  if (want.includes("Ocean")) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380;
    const g = ac.createGain(); g.gain.value = 0.55;
    const o = ac.createOscillator(); o.frequency.value = 0.08;
    const og = ac.createGain(); og.gain.value = 180;
    o.connect(og).connect(f.frequency);
    s.connect(f).connect(g).connect(bedGain); s.start(); o.start();
    bedNodes.push(s,f,g,o,og);
  }
  if (want.includes("Heartbeat")) startHeart();
  if (want.includes("Breath") && !breathNode) startBreathAir();
  if (!want.includes("Breath") && breathNode && !breathId) stopBreathAir();
  if (timerMin && want.length) endsAt = endsAt || Date.now() + timerMin*60000;
}
function startHeart(){
  const g = ac.createGain(); g.gain.value = 0; g.connect(bedGain);
  const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = 55; o.connect(g); o.start();
  bedNodes.push(o,g);
  const beat = () => {
    if (!document.querySelector("#sounds .chip.on") || !ac) return;
    const now = ac.currentTime;
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.9, now+0.03);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.18);
    g.gain.setValueAtTime(0.001, now+0.22);
    g.gain.linearRampToValueAtTime(0.55, now+0.26);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.46);
    setTimeout(beat, 1000);
  };
  beat();
}
function startBreathAir(){
  if (breathNode) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf(); s.loop = true;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 700;
  breathNode = ac.createGain(); breathNode.gain.value = 0.02;
  s.connect(f).connect(breathNode).connect(bedGain); s.start();
  bedNodes.push(s,f);
}
function stopBreathAir(){ try{ breathNode && breathNode.disconnect(); }catch(e){} breathNode = null; }
function stopBreath(){ guide.hidden = true; fill = 0; hero.style.transform = "scale(1)"; if (breathNode && !document.querySelector("#sounds .chip.on")) stopBreathAir(); }
function startBreath(item){
  startBreathAir();
  const steps = [];
  for (let r=1;r<=item.rounds;r++){
    const set = item.fifth && r%5===0 ? item.fifth : item.steps;
    set.forEach(s => steps.push({...s, r}));
  }
  const t0 = performance.now();
  const total = steps.reduce((a,s)=>a+s.ms,0);
  const loop = (now) => {
    if (breathId !== item.id) return;
    const elapsed = now - t0;
    if (elapsed >= total) { phaseEl.textContent = "Rest"; countEl.textContent = item.name; fill = 0; paintHero(); return; }
    let acc = 0, i = 0;
    while (i < steps.length && elapsed >= acc + steps[i].ms) { acc += steps[i].ms; i++; }
    const s = steps[i];
    const local = (elapsed - acc) / s.ms;
    if (s.p === "in") fill = local;
    else if (s.p === "out") fill = 1-local;
    else if (s.p === "hold") fill = 1;
    else fill = 0;
    phaseEl.textContent = s.l;
    countEl.textContent = s.r + " / " + item.rounds;
    guide.hidden = false;
    paintHero();
    if (breathNode) breathNode.gain.setTargetAtTime(0.04 + fill*0.55, ac.currentTime, 0.08);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function paintHero(){ hero.style.transform = "scale(" + (1 + fill*0.035) + ")"; }
function tick(){
  if (!endsAt) { clock.textContent = timerMin ? timerMin + " min ready" : "Timer off"; return; }
  const left = Math.max(0, endsAt - Date.now());
  const s = Math.ceil(left/1000);
  clock.textContent = String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
  if (left < 15000 && master) master.gain.setTargetAtTime(0.001, ac.currentTime, 3);
  if (left <= 0) {
    stopTone(); stopBreath(); bedNodes.forEach(n => { try{n.stop&&n.stop()}catch(e){} });
    bedNodes = []; breathNode = null; endsAt = 0;
    if (musicEl) musicEl.pause();
    clock.textContent = "Session complete";
  }
}
setInterval(tick, 500);
function draw(t){
  const w = cnv.width, g = ctx2, cols = palettes[palette];
  g.clearRect(0,0,w,w);
  g.save(); g.translate(w/2,w/2);
  const spin = trance ? t*0.00035 : t*0.00008;
  g.rotate(spin);
  for (let ring=8; ring>=1; ring--){
    g.strokeStyle = cols[ring%cols.length];
    g.globalAlpha = 0.18 + ring*0.07;
    g.lineWidth = ring===1 ? 2.2 : 1.1;
    g.beginPath();
    const petals = 6 + ring*2;
    for (let i=0;i<=petals;i++){
      const a = (i/petals)*Math.PI*2;
      const rad = 28*ring + Math.sin(a*3 + t*0.001)*6;
      const x = Math.cos(a)*rad, y = Math.sin(a)*rad;
      i ? g.lineTo(x,y) : g.moveTo(x,y);
    }
    g.closePath(); g.stroke();
    for (let i=0;i<petals;i++){
      const a = (i/petals)*Math.PI*2 + (ring%2?spin:-spin);
      g.beginPath();
      g.ellipse(Math.cos(a)*ring*26, Math.sin(a)*ring*26, 10+ring, 22+ring, a, 0, Math.PI*2);
      g.stroke();
    }
  }
  g.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
