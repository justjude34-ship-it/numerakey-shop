<style>
  :root{
    --bg:#000;
    --panel:#0d0b12;
    --panel-2:#16121e;
    --line:rgba(255,255,255,.11);
    --line-soft:rgba(255,255,255,.06);
    --ink:#f1edf5;
    --dim:#a99fb6;
    --dimmer:#786f85;
    --teal:#7fd6c9;
    --violet:#9d8bdf;
    --rose:#e07aa5;
    --gold:#e3ba82;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;

  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:4px}
  a{color:var(--teal)}

  header.bar{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
  .bar-in{max-width:760px;margin:0 auto;padding:12px 18px 4px;display:flex;align-items:center}
  .mark{font-family:var(--serif);font-size:23px;letter-spacing:.03em;
    background:linear-gradient(100deg,var(--teal),var(--violet) 55%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
  nav.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:760px;margin:0 auto;padding:0 12px 8px}
  nav.rail::-webkit-scrollbar{display:none}
  nav.rail button{flex:0 0 auto;background:none;border:none;color:var(--dimmer);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:14px;white-space:nowrap}
  nav.rail button.on{color:#0a0710;background:linear-gradient(100deg,var(--teal),var(--violet))}
  nav.rail button:hover:not(.on){color:var(--ink)}

  .wrap{max-width:760px;margin:0 auto;padding:0 18px 140px}
  h1.t{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.2;margin:24px 0 6px;

  h2.s{font-family:var(--serif);font-weight:400;font-size:20px;margin:30px 0 10px}
  .lede{color:var(--dim);margin:0 0 20px;max-width:60ch}
  .muted{color:var(--dim);font-size:14.5px}
  .tiny{color:var(--dimmer);font-size:12.5px}
  p{margin:0 0 12px}

  .scene{display:block;width:100%;height:auto;border-radius:16px;margin:16px 0 0;border:1px solid var(--line-soft)}

  .card{background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:16px;margin:0 0 12px}
  .card.glow{border-color:rgba(157,139,223,.4);background:linear-gradient(160deg,rgba(127,214,201,.07),rgba(157,139,223,.07) 55%,rgba(224,122,165,.07))}
  .card h3{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:18px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .btn{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:9px 15px;border-radius:999px;cursor:pointer;font-size:14px}

  .btn.quiet{background:none;color:var(--dim);border-color:var(--line-soft)}
  .btn.danger{color:#ef8fa3;border-color:rgba(239,143,163,.35)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.sm{padding:6px 11px;font-size:13px}

  label.f{display:block;margin:0 0 14px}

  input[type=text],input[type=date],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;color:var(--ink)}
  textarea{resize:vertical;min-height:84px;line-height:1.6}

  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px}
  .chip.on{color:#0a0710;background:linear-gradient(100deg,var(--teal),var(--violet));border-color:transparent;font-weight:600}

  .list{list-style:none;margin:0;padding:0}
  .list li{border-bottom:1px solid var(--line-soft)}
  .li-btn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:14px 2px;cursor:pointer}
  .li-n{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--dim);border:1px solid var(--line)}

  .li-t{font-family:var(--serif);font-size:17px}
  .li-s{display:block;font-family:var(--sans);font-size:13px;color:var(--dimmer)}

  .bar-track{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
  .bar-fill{height:100%;border-radius:99px;background:linear-gradient(100deg,var(--teal),var(--violet))}
  .area-row{margin:0 0 14px}
  .area-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}

  .quote{border-left:3px solid var(--violet);padding:4px 0 4px 14px;margin:14px 0;font-family:var(--serif);font-size:18px;line-height:1.6}
  .try{border:1px solid rgba(127,214,201,.35);background:rgba(127,214,201,.06);border-radius:14px;padding:14px 16px;margin:18px 0}
  .try b{color:var(--teal);font-weight:600;display:block;margin-bottom:4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
  .tag{display:inline-block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 9px;margin:0 6px 6px 0}
  .tag.red{color:#ef8fa3;border-color:rgba(239,143,163,.4)}
  .tag.green{color:var(--teal);border-color:rgba(127,214,201,.4)}
  .back{background:none;border:none;color:var(--dim);cursor:pointer;padding:6px 0;font-size:14px}
  .back:hover{color:var(--teal)}
  .empty{border:1px dashed var(--line);border-radius:16px;padding:24px 18px;text-align:center;color:var(--dim)}
  .x{background:none;border:none;color:var(--dimmer);cursor:pointer;font-size:16px;padding:4px 8px}
  .x:hover{color:#ef8fa3}
  .script{margin:0 0 10px;padding:12px 14px;border:1px solid var(--line-soft);border-radius:14px;background:var(--panel)}
  .script .who{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);margin-bottom:4px}
  .script q{display:block;quotes:none;font-family:var(--serif);font-size:17px;line-height:1.55}

  /* hold on */
  .holdfab{position:fixed;right:16px;bottom:18px;z-index:30;border:none;cursor:pointer;color:#fff;font-weight:600;font-size:14px;
    padding:12px 18px;border-radius:999px;background:linear-gradient(100deg,#7c69d6,#d1568a);box-shadow:0 8px 30px rgba(124,105,214,.45)}
  .breath{width:150px;height:150px;border-radius:50%;margin:22px auto;display:grid;place-items:center;text-align:center;font-size:14px;color:#0a0710;font-weight:600;
    background:radial-gradient(circle at 35% 30%,var(--teal),var(--violet) 70%);animation:br 10s ease-in-out infinite}
  @keyframes br{0%{transform:scale(.62)}40%{transform:scale(1)}100%{transform:scale(.62)}}
  .big{font-family:var(--serif);font-size:40px;text-align:center;margin:6px 0}

  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--line);
    border-radius:999px;padding:9px 18px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const LESSONS = [
  { id: "l1", t: "A boundary is what you do", s: "Not a demand. A decision.",

    q: "Where you resent, a line is missing.",
    tr: "List three things or people you resent. Next to each, write what you wish you’d said." },

  { id: "l6", t: "Six places boundaries live", s: "Time, energy, money, body, digital, emotional.",

    tr: "Pick the one area that’s costing you the most right now. The Start page will help you check." },

  { id: "l7", t: "Say it once, then follow through", s: "A limit, a consequence you control, and action.",
    body: [
      "A working boundary has three parts. <b>The limit:</b> what you won’t do or accept. <b>The consequence:</b> what you will do if it’s crossed. <b>The follow-through:</b> actually doing it.",
      "Only choose consequences you’ll genuinely carry out, and that you control. “I’ll leave” works. “I’ll make you sorry” doesn’t. A threat you don’t follow through teaches people your no is negotiable.",

  { id: "l9", t: "If you still have to deal with them", s: "Co-parenting, shared work, shared family.",

  { id: "l11", t: "How to spot the next one", s: "Watch how they handle a small no.",
    body: [
      "The surest filter isn’t how someone treats you when things go well. It’s how they react when you disagree, say no, or change your mind.",

  { id: "l15", t: "Dating again: why you’re a target", s: "Keep the kindness. Add a filter.",
    body: [

    tr: "Open Dating again and choose three pace rules you’ll follow when you date. Write them down before you meet anyone." },

  { id: "l12", t: "Trusting yourself again", s: "Keep small promises to you.",
    body: [
      "After years of being told your perception was wrong, you may not trust your gut. That’s a normal result, not a flaw.",

    ],
    q: "Self-trust is built in tiny kept promises.",
    tr: "Make one tiny promise to yourself today and keep it. Make it small enough to be easy." },

  { id: "l13", t: "Boundaries with yourself", s: "The ones nobody sees.",
    body: [
      "Some of the hardest boundaries are internal: not checking their social media, not drafting the text you won’t send, not replaying the argument at 3 a.m.",

    tr: "Pick one habit that keeps you tied to them. Add one bit of friction today." },

    body: [

function supportBlock() {
  return `<p class="tiny" style="margin-top:28px;line-height:1.7">Need to talk to someone? Australia: 1800RESPECT 1800 737 732 · Lifeline 13 11 14. US: 1-800-799-7233 (text START to 88788). UK: 0808 2000 247. International: findahelpline.com.</p>`;
}

/* ---------------- Learn ---------------- */

function vLearn() {
  if (lessonOpen) return vLesson();
  const done = LESSONS.filter(l => S.read[l.id]).length;
  return `
    ${scene("book")}
    <h1 class="t">Learn</h1>
    <p class="lede">${LESSONS.length} short reads. Each ends with one small thing to try. ${done} of ${LESSONS.length} read.</p>
    <ul class="list">${LESSONS.map((l, i) => `<li><button class="li-btn" data-act="lesson" data-id="${l.id}">
      <span class="li-n ${S.read[l.id] ? "done" : ""}">${S.read[l.id] ? "✓" : i + 1}</span>
      <span><span class="li-t">${esc(l.t)}</span><span class="li-s">${esc(l.s)}</span></span></button></li>`).join("")}</ul>`;
}
function vLesson() {
  const i = LESSONS.findIndex(l => l.id === lessonOpen);
  const l = LESSONS[i];
  return `
    <button class="back" data-act="go" data-v="learn">Back to Learn</button>
    <span class="tag">Read ${i + 1} of ${LESSONS.length}</span>
    <h1 class="t" style="margin-top:6px">${esc(l.t)}</h1>
    <p class="lede">${esc(l.s)}</p>
    ${l.body.map(p => `<p>${p}</p>`).join("")}
    <div class="quote">${esc(l.q)}</div>
    <div class="try"><b>Try this</b>${esc(l.tr)}</div>
    <div class="row">
      <button class="btn primary" data-act="markread" data-id="${l.id}">${S.read[l.id] ? "Read ✓" : "Mark as read"}</button>
      ${LESSONS[i + 1] ? `<button class="btn" data-act="lesson" data-id="${LESSONS[i + 1].id}">Next</button>` : ""}
      ${LESSONS[i - 1] ? `<button class="btn quiet" data-act="lesson" data-id="${LESSONS[i - 1].id}">Previous</button>` : ""}
    </div>`;
}

/* ---------------- Start here ---------------- */

function rankAreas() {
  const by = {};
  QUESTIONS.forEach(([a], i) => {
    const v = S.assess.answers[i];
    if (v === undefined) return;
    (by[a] = by[a] || []).push(v);
  });
  return AREAS.filter(a => by[a.k]).map(a => ({ ...a, score: by[a.k].reduce((x, y) => x + y, 0) / by[a.k].length / 3 }))
    .sort((x, y) => x.score - y.score);
}
const ANS = ["Rarely", "Sometimes", "Often", "Almost always"];

function vStart() {
  if (S.assess.done) {
    const r = rankAreas();
    return `
      ${scene("compass")}
      <h1 class="t">Where to start</h1>
      <p class="lede">Lower means harder right now. Begin with the top three. You don’t need to fix them all.</p>
      ${r.map((a, i) => `<div class="area-row"><div class="top"><span>${i < 3 ? "<b>" : ""}${esc(a.label)}${i < 3 ? "</b>" : ""}</span><span class="muted">${i < 3 ? "Start here" : ""}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(6, Math.round(a.score * 100))}%"></div></div></div>`).join("")}
      <div class="row" style="margin-top:20px"><button class="btn primary" data-act="go" data-v="lines">Build my first boundary</button>
        <button class="btn quiet" data-act="retake">Retake</button></div>`;
  }
  return `
    ${scene("compass")}
    <h1 class="t">Find your starting point</h1>
    <p class="lede">How true is each of these for you right now? There’s no right answer. Be honest, not hopeful.</p>
    ${QUESTIONS.map(([a, q], i) => `<div style="margin:0 0 18px"><p style="margin:0 0 8px">${esc(q)}</p>
      <div class="chips">${ANS.map((l, v) => `<button class="chip ${S.assess.answers[i] === v ? "on" : ""}" data-act="ans" data-i="${i}" data-v="${v}">${l}</button>`).join("")}</div></div>`).join("")}
    <button class="btn primary" data-act="finish" ${Object.keys(S.assess.answers).length < QUESTIONS.length ? "" : ""}>Show me where to start</button>
    <p class="tiny" style="margin-top:8px">${Object.keys(S.assess.answers).length} of ${QUESTIONS.length} answered</p>`;
}

/* ---------------- My lines (builder + list) ---------------- */

function vLines() {
  if (builder) return vBuilder();
  const list = S.lines.length ? S.lines.map(l => {
    const a = AREAS.find(x => x.k === l.area);
    return `<div class="card">

function verdict(p) {
  const n = p.tests.length;
  if (n < 2) return { short: "Log a couple more tests to see a pattern", msg: "Two or three tests give a real picture. Keep going." };
  const avg = p.tests.reduce((s, t) => s + (RESP.find(r => r[0] === t.resp) || [0, 0, 0])[2], 0) / n;
  if (avg <= -0.7) return { short: "Pattern: pushback when you say no", msg: "They tend to push, sulk, or punish when you say no. That’s a pattern, not a mood. Take it seriously, and slow things down." };
  if (avg >= 0.5) return { short: "Pattern: respects your no", msg: "They’re mostly accepting your no. Keep testing small things and keep watching over time." };
  return { short: "Mixed so far", msg: "It’s mixed. Keep logging. Watch what happens when the no is about something that matters to you." };
}

function dateRead(d) {
  const has = k => !!(d.checks && d.checks[k]);
  const feel = d.feel || [];
  const good = ["asked", "respected", "myself"].filter(has).length + feel.filter(f => f === "Calm" || f === "Warm").length;
  const bad = ["rushed", "blamed", "overgave"].filter(has).length + feel.filter(f => ["Anxious", "Drained", "Confused"].includes(f)).length;
  let msg;
  if (bad >= 3) msg = "Several warning signs. Slow right down, tell your friend, and watch how they take a small no.";
  else if (good >= 3 && bad <= 1) msg = "Good signs. If it felt a bit flat, remember that safe can feel boring after chaos. Keep the pace slow.";
  else msg = "Mixed. Notice how you felt in your body and how they handled the small things. Keep going slowly.";
  if (feel.includes("Buzzing")) msg += " Buzzing isn’t the same as safe. After narcissistic abuse, butterflies are often anxiety.";
  return msg;
}

    const el = document.getElementById("clock");
    if (!el) { clearInterval(holdTimer); return; }
    el.textContent = String(Math.floor(left / 60000)).padStart(2, "0") + ":" + String(Math.floor(left / 1000) % 60).padStart(2, "0");
    if (left <= 0) { clearInterval(holdTimer); el.textContent = "Done."; toast("Ten minutes passed. How do you feel now?"); }
  };
  tick(); holdTimer = setInterval(tick, 500);
}
function stopHold() { clearInterval(holdTimer); holdTimer = null; holdEnd = 0; }

/* ---------------- Settings ---------------- */

function vSettings() {
  return `
    ${scene("gate")}
    <h1 class="t">Settings</h1>
    <h2 class="s">Backup</h2>
    <p class="muted">Everything is stored in this browser on this device. Clearing site data would remove it. Export a copy now and then and keep it somewhere safe.</p>
    <div class="row"><button class="btn primary" data-act="export">Export a backup</button><button class="btn" data-act="importpick">Restore a backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none"></div>
    <h2 class="s">Start again</h2>
    <p class="muted">Deletes your boundaries, notes, tests and wins from this device. No undo, so export first if you might want them.</p>
    <button class="btn danger" data-act="wipe">Delete everything</button>
    <p class="tiny" style="margin-top:34px">Enough is a place to learn and practise. It isn’t therapy or legal advice. If you’re in danger, contact local emergency services.</p>
    ${supportBlock()}`;
}

/* ---------------- events ---------------- */

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (el.tagName === "A") e.preventDefault();
  const id = el.dataset.id;
  switch (act) {
    case "go": go(el.dataset.v); break;
    case "practice": S.practice[todayStr()] = !S.practice[todayStr()]; save(true); render(); break;
    case "lesson": lessonOpen = id; view = "learn"; renderRail(); render(); window.scrollTo(0, 0); break;
    case "markread": S.read[id] = !S.read[id]; save(true); render(); if (S.read[id]) toast("Marked as read."); break;
    case "ans": S.assess.answers[el.dataset.i] = +el.dataset.v; save(); { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "finish":
      if (Object.keys(S.assess.answers).length < QUESTIONS.length) { toast("Please answer all the questions."); break; }
      S.assess.done = true; save(true); render(); window.scrollTo(0, 0); break;
    case "retake": S.assess = { answers: {}, done: false }; save(true); render(); window.scrollTo(0, 0); break;
    case "newline": builder = { area: "", notOk: "", need: "", statement: "", consequence: "", script: "" }; render(); window.scrollTo(0, 0); break;
    case "editline": { const l = S.lines.find(x => x.id === id); builder = { ...l }; render(); window.scrollTo(0, 0); } break;
    case "cancelbuild": builder = null; render(); break;
    case "bpick": builder.area = el.dataset.k; { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "savebuild":
      if (!builder.area) return toast("Pick where this is first.");
      if (!builder.statement.trim()) return toast("Write your boundary in step 4.");
      if (builder.id) { const i = S.lines.findIndex(x => x.id === builder.id); S.lines[i] = { ...S.lines[i], ...builder }; }
      else S.lines.push({ ...builder, id: uid(), holds: 0, slips: 0, ts: Date.now() });
      builder = null; save(true); render(); toast("Saved."); window.scrollTo(0, 0); break;
    case "held": { const l = S.lines.find(x => x.id === id); l.holds = (l.holds || 0) + 1; save(true); render(); toast("Held it. That counts."); } break;
    case "slipped": { const l = S.lines.find(x => x.id === id); l.slips = (l.slips || 0) + 1; save(true); render(); toast("It happens. You’re back at your line now."); } break;
    case "delline": if (confirm("Delete this boundary?")) { S.lines = S.lines.filter(x => x.id !== id); save(true); render(); } break;
    case "copy": { const l = S.lines.find(x => x.id === id); copy(l.script || l.statement); } break;
    case "copytext": copy(el.dataset.t); break;
    case "addperson": { const i = document.getElementById("newPerson"); if (!i.value.trim()) return toast("Add a name or nickname."); S.people.push({ id: uid(), name: i.value.trim(), tests: [] }); save(true); render(); } break;
    case "person": personOpen = id; render(); window.scrollTo(0, 0); break;
    case "delperson": if (confirm("Remove this person and their log?")) { S.people = S.people.filter(x => x.id !== id); save(true); render(); } break;
    case "presp": { const p = S.people.find(x => x.id === personOpen); p._draft = p._draft || { ask: "", resp: "" }; p._draft.resp = el.dataset.k; render(); } break;
    case "logtest": {
      const p = S.people.find(x => x.id === personOpen); const d = p._draft || {};
      if (!d.resp) return toast("Pick how they responded.");
      p.tests.push({ id: uid(), ts: Date.now(), ask: d.ask || "", resp: d.resp }); p._draft = { ask: "", resp: "" };
      save(true); render(); toast("Logged.");
    } break;
    case "deltest": { const p = S.people.find(x => x.id === personOpen); p.tests = p.tests.filter(t => t.id !== id); save(true); render(); } break;
    case "doinstall": if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); }); } break;
    case "hideinstall": S.hideInstall = true; save(true); render(); break;
    case "dready": S.dating.ready[el.dataset.i] = !S.dating.ready[el.dataset.i]; save(true); { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "drule": S.dating.rules[el.dataset.i] = !S.dating.rules[el.dataset.i]; save(true); { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "addrule": { const i = document.getElementById("newRule"); if (!i.value.trim()) return toast("Write the rule first."); S.dating.custom.push(i.value.trim()); save(true); const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "delcustom": S.dating.custom.splice(+el.dataset.i, 1); save(true); { const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "dfeel": { const d = S._dateDraft, k = el.dataset.k; d.feel = d.feel.includes(k) ? d.feel.filter(x => x !== k) : d.feel.concat(k); const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "dcheck": { const d = S._dateDraft, k = el.dataset.k; d.checks[k] = !d.checks[k]; const y = window.scrollY; render(); window.scrollTo(0, y); } break;
    case "savedate": {
      const d = S._dateDraft;
      if (!d.feel.length && !Object.values(d.checks).some(Boolean)) return toast("Pick how you felt or what was true.");
      S.dating.dates.push({ id: uid(), ts: Date.now(), who: d.who, feel: d.feel, checks: d.checks, note: d.note });
      S._dateDraft = { who: "", feel: [], checks: {}, note: "" }; save(true); render(); toast("Saved.");
    } break;
    case "deldate": S.dating.dates = S.dating.dates.filter(x => x.id !== id); save(true); render(); break;
    case "wkind": S._winDraft.kind = el.dataset.k; render(); break;
    case "addwin": {
      const d = S._winDraft;
      if (!d.what.trim() && !d.did.trim()) return toast("Write something about what happened.");
      S.wins.push({ id: uid(), ts: Date.now(), kind: d.kind, what: d.what, did: d.did, felt: d.felt, after: d.after });
      S._winDraft = { kind: "held", what: "", did: "", felt: "", after: "" }; save(true); render(); toast("Saved. Well done.");
    } break;
    case "delwin": S.wins = S.wins.filter(w => w.id !== id); save(true); render(); break;
    case "hold": holdKind = el.dataset.k; stopHold(); render(); break;
    case "holdstart": startHold(); break;
    case "export": download(JSON.stringify(S, null, 2), "enough-backup.json", "application/json"); break;
    case "importpick": document.getElementById("importFile").click(); break;
    case "wipe":
      if (!confirm("Delete everything from this device? This can’t be undone.")) return;
      if (!confirm("Really delete everything?")) return;
      localStorage.removeItem(KEY); S = blank(); go("home"); toast("Deleted."); break;
  }
});

function bindInputs() {
  document.querySelectorAll("[data-b]").forEach(t => t.addEventListener("input", () => { builder[t.dataset.b] = t.value; }));
  document.querySelectorAll("[data-w]").forEach(t => t.addEventListener("input", () => { S._winDraft[t.dataset.w] = t.value; }));
  document.querySelectorAll("[data-p]").forEach(t => t.addEventListener("input", () => {
    const p = S.people.find(x => x.id === personOpen); p._draft = p._draft || { ask: "", resp: "" }; p._draft[t.dataset.p] = t.value;
  }));
  document.querySelectorAll("[data-nonneg]").forEach(t => t.addEventListener("input", () => { S.dating.nonneg = t.value; save(); }));
  document.querySelectorAll("[data-d]").forEach(t => t.addEventListener("input", () => { S._dateDraft[t.dataset.d] = t.value; }));
  document.querySelectorAll("[data-reasons]").forEach(t => t.addEventListener("input", () => { S.reasons = t.value; save(); }));
  const f = document.getElementById("importFile");
  if (f) f.addEventListener("change", e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.lines)) throw 0;
        if (!confirm("Replace what’s on this device with the backup?")) return;
        S = Object.assign(blank(), d); save(true); go("home"); toast("Backup restored.");
      } catch (x) { toast("That isn’t an Enough backup."); }
    };
    r.readAsText(file);
  });
}

function copy(t) {
  const done = () => toast("Copied.");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback);
  else fallback();
  function fallback() {
    const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Couldn’t copy. Select it and copy by hand."); }
    a.remove();
  }
}
function download(text, name, type) {
  const b = new Blob([text], { type: type + ";charset=utf-8" });
  const u = URL.createObjectURL(b); const a = document.createElement("a");
  a.href = u; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(u), 2000);
  toast("Downloaded " + name);
}

/* ---------------- installable ---------------- */

(function manifest() {
  const m = {
    name: "Enough", short_name: "Enough", start_url: ".", display: "standalone",
    background_color: "#000000", theme_color: "#000000",
    description: "Build healthy boundaries after narcissistic abuse.",
    icons: [{ src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" fill="#000"/><path d="M80 432V240a176 176 0 0 1 352 0v192z" fill="none" stroke="#9d8bdf" stroke-width="30"/><path d="M176 432V256a80 80 0 0 1 160 0v176z" fill="#7fd6c9"/></svg>`), sizes: "512x512", type: "image/svg+xml", purpose: "any" }]
  };
  const l = document.createElement("link"); l.rel = "manifest";
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
  document.head.appendChild(l);
})();

/* ---------------- boot ---------------- */

renderRail();
render();
window.addEventListener("beforeunload", () => save(true));
</script>
