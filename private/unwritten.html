    :root {
      color-scheme: dark;
      --cream: #141210;
      --paper: #221e1a;
      --ink: #f4efe6;
      --soft: #b7ab9e;
      --sage: #a3b89a;
      --gold: #d4b483;
      --gold-ink: #1c1712;
      --line: #3a332c;
      --display: "Cormorant Garamond", "Iowan Old Style", Palatino, Georgia, serif;
      --sans: Nunito, "Avenir Next", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: var(--cream);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, [role="button"] { cursor: pointer; font: inherit; color: inherit; }
    button { border: 0; background: none; }
    h1, h2, h3 { font-family: var(--display); font-weight: 500; text-wrap: balance; margin: 0; }
    p { text-wrap: pretty; margin: 0; }
    a { color: inherit; }
    .shell {
      width: min(440px, 100%);
      margin: 0 auto;
      padding: max(1.4rem, calc(env(safe-area-inset-top) + 0.8rem)) 1.25rem 1.5rem;
    }
    .shell.with-nav { padding-bottom: calc(5.4rem + env(safe-area-inset-bottom)); }
    .display { font-family: var(--display); }

    function home() {
      const doors = [
        ["detect", "Detect", "What just happened?"],
        ["thread", "Thread", "Map the story"],
        ["beads", "Beads", "Reality Anchor"],
        ["exit", "Way out", "Exit Map"],
        ["garden", "Garden", "What is growing"],
        ["breathe", "Breathe", "Thirty seconds"],
        ["help", "Help", "Helplines you can tap"]
      ];
      const wrap = el("section", { class: "stack" });
      const head = el("header", { class: "home" }, [
        el("p", { class: "kicker", text: "Unwritten" }),
        el("p", { class: "name display", text: "Still being written." }),
        el("p", { class: "soft", text: "Name what happened. Keep the truth. Choose the next door." })
      ]);
      wrap.append(head);
      doors.forEach(([id, title, sub]) => {
        const b = el("button", { type: "button", class: "door", "data-go": id });
        const words = el("span", { class: "door-words" });
        words.append(el("b", { text: title }), el("span", { text: sub }));
        b.append(words, el("i", { class: "pip" }));
        wrap.append(b);
      });
      const keep = el("div", { class: "keep" }, [
        el("p", { text: "Your words stay in this browser. Save a copy if you want them on another device." }),
        btn("btn-line", "Save a copy", "export"),
        btn("btn-line", "Bring a copy back", "import")
      ]);
      if (state.pending) {
        keep.append(el("p", { class: "note", text: "Replace the words on this device with that copy?" }));
        keep.append(btn("btn-gold", "Replace", "confirm-restore"));
        keep.append(btn("btn-line", "Cancel", "cancel-restore"));
      }
      if (state.keepError) keep.append(el("p", { class: "err", text: state.keepError }));
      wrap.append(keep);
      return wrap;
    }

    function detect() {
      const wrap = el("section");
      wrap.append(
        el("h2", { class: "screen", text: "Detect" }),
        el("p", { class: "lead screen-lead", text: "Tell me what she just did. I will name the move — not you." })
      );
      const area = el("textarea", { class: "field", placeholder: "She said…" });
      area.value = state.what;
      area.addEventListener("input", () => { state.what = area.value; });
      wrap.append(area);
      const row = el("div", { class: "row" });
      row.append(btn("btn-line", "Speak", "listen", "mic"), btn("btn-gold", "Name it", "name", "scan"));
      wrap.append(row);
      if (state.listenError) wrap.append(el("p", { class: "err", text: state.listenError }));
      const list = el("div", { class: "stack", style: "margin-top:1rem" });
      if (state.named && state.hits.length === 0) {
        list.append(el("div", { class: "card" }, [
          el("p", { class: "lead", text: "I hear you. If the name is not here yet, save it as a bead anyway. The feeling still counts." })
        ]));
        list.append(btn("btn-line", "Save as a bead", "save-plain"));
      }
      state.hits.forEach((p, i) => {
        const card = el("div", { class: "card hit" }, [
          el("h3", { text: p.name }),
          el("p", { text: p.is }),
          el("p", { class: "note", text: p.not })
        ]);
        const actions = el("div", { class: "row" });
        actions.append(btn("btn-line", "Save this bead", "save:" + i), btn("btn-line", "I need to breathe", "breathe"));
        card.append(actions);
        list.append(card);
      });
      wrap.append(list);
      return wrap;
    }

    function thread() {
      const wrap = el("section");
      wrap.append(
        el("h2", { class: "screen", text: "Thread" }),
        el("p", { class: "lead screen-lead", text: "Knots on your thread. The script, in your words." })
      );
      const input = el("input", { class: "field", placeholder: "A year, a shift, a first time you saw it" });
      input.value = state.knot;
      input.addEventListener("input", () => { state.knot = input.value; });
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addKnot(); } });
      wrap.append(input, btn("btn-gold", "Add a knot", "add-knot"));
      const list = el("div", { class: "stack", style: "margin-top:1rem" });
      if (!state.knots.length) {
        list.append(el("p", { class: "lead", text: "Golden child years. Scapegoat shift. The first time you saw the script." }));
      }
      state.knots.forEach((k) => {
        list.append(el("div", { class: "card item" }, [
          el("p", { text: k.txt }),
          el("span", { class: "when", text: day(k.t) })
        ]));
      });
      wrap.append(list);
      return wrap;
    }

    function beads() {
      const wrap = el("section");
      wrap.append(
        el("h2", { class: "screen", text: "Reality Anchor" }),
        el("p", { class: "lead screen-lead", text: "Your words. Your date. Proof against rewritten history." })
      );
      const area = el("textarea", { class: "field", placeholder: "What is true" });
      area.value = state.bead;
      area.addEventListener("input", () => { state.bead = area.value; });
      wrap.append(area, btn("btn-gold", "String this bead", "add-bead"));
      const list = el("div", { class: "stack", style: "margin-top:1rem" });
      if (!state.beads.length) {
        list.append(el("p", { class: "lead", text: "Nothing here yet. Your first bead can be one true sentence." }));
      }
      state.beads.forEach((b) => {
        list.append(el("div", { class: "card item" }, [
          el("b", { text: b.n || "Truth" }),
          el("p", { text: b.txt }),
          el("span", { class: "when", text: day(b.t) })
        ]));
      });
      wrap.append(list);
      return wrap;
    }

    function exitMap() {
      const wrap = el("section", { class: "stack" });
      wrap.append(
        el("h2", { class: "screen", text: "Exit Map" }),
        el("p", { class: "lead screen-lead", text: "Optional paths. You choose. Never all at once." })
      );
      EXIT_PATHS.forEach((p) => {
        const card = el("div", { class: "card path" }, [
          el("h3", { text: p.title }),
          el("p", { class: "note", text: p.body })
        ]);
        const done = state.steps.includes(p.id);
        card.append(btn("btn-line", done ? "On your thread" : p.cta, "step:" + p.id));
        wrap.append(card);
      });
      return wrap;
    }

    function garden() {
      const growth = state.detects.length + state.beads.length + state.knots.length + state.steps.length;
      const shown = growth === 0 ? 0 : Math.min(18, Math.max(1, growth));
      const wrap = el("section");
      wrap.append(
        el("h2", { class: "screen", text: "Garden" }),
        el("p", { class: "lead screen-lead", text: "It grows when you name a pattern, save a truth, or take a step." })
      );
      const bed = el("div", { class: "garden" });
      if (!shown) bed.append(el("p", { class: "lead", text: "The first leaf arrives when you name something." }));
      for (let i = 0; i < shown; i++) {
        const span = el("span", { class: "sprout" });
        span.style.animationDelay = (i * 40) + "ms";
        span.append(svg(ICONS[PLANTS[i % PLANTS.length]], 28));
        bed.append(span);
      }
      wrap.append(bed);
      state.beads.slice(0, 6).forEach((b) => {
        const line = el("p", { class: "word" });
        line.append(el("span", { class: "dot" }), document.createTextNode(b.txt.split(" ").slice(0, 5).join(" ")));
        wrap.append(line);
      });
      return wrap;
    }

    function breathe() {
      const last = state.beads[0];
      const wrap = el("section", { class: "stack" });
      wrap.append(el("h2", { class: "screen", text: "Breathe" }), el("div", { class: "orb" }), el("p", { class: "center", text: "In for four. Hold. Out for six." }));
      wrap.append(el("div", { class: "card panel" }, [
        el("h3", { text: "Five things" }),
        el("p", { class: "note", text: "See five. Touch four. Hear three. Soften two. Name one true thing from your Anchor." })
      ]));
      wrap.append(el("div", { class: "card panel" }, [
        el("h3", { text: "Reality check" }),
        el("p", { class: "note", text: last ? last.txt : "Your last bead will appear here when you have one." })
      ]));
      const danger = el("div", { class: "card panel" }, [
        el("h3", { text: "If you are in danger" }),
        el("p", { class: "note", text: "AU 000 · 1800RESPECT 1800 737 732" }),
        el("p", { class: "note", text: "US 911 · 1-800-799-7233" }),
        el("p", { class: "note", text: "UK 999 · 0808 2000 247" })
      ]);
      danger.append(btn("btn-line", "All helplines", "help"));
      wrap.append(danger, el("p", { class: "fine", text: "Unwritten is a companion, not therapy and not a diagnosis." }));
      return wrap;
    }

    function help() {
      const wrap = el("section", { class: "stack" });
      wrap.append(
        el("h2", { class: "screen", text: "Help" }),
        el("p", { class: "lead screen-lead", text: "If you are in immediate danger, call your local emergency number." })
      );
      HELP.forEach((c) => {
        const card = el("div", { class: "card" }, [el("h3", { text: c.name })]);
        c.lines.forEach(([label, display, href]) => card.append(link(label, display, href)));
        wrap.append(card);
      });
      const other = el("div", { class: "card" }, [el("h3", { text: "Other countries" })]);
      other.append(link("Find A Helpline", "findahelpline.com", "https://findahelpline.com"));
      wrap.append(other, el("p", { class: "fine", text: "Unwritten is a companion, not therapy and not a diagnosis." }));
      return wrap;
    }

    function link(label, display, href) {
      const a = el("a", { class: "help-link", href });
      if (href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
      a.append(el("b", { text: label }), el("span", { text: display }));
      return a;
    }

    function nav() {
      const bar = el("nav", { class: "bar", "aria-label": "Sections" });
      NAV.forEach(([id, label]) => {
        const on = state.screen === id || (["beads", "exit"].includes(state.screen) && id === "home");
        const b = el("button", { type: "button", class: on ? "on" : "", "data-go": id, text: label });
        if (on) b.setAttribute("aria-current", "page");
        bar.append(b);
      });
      return bar;
    }

    function addKnot() {
      const v = state.knot.trim();
      if (!v) return;
      state.knots = [{ t: new Date().toISOString(), txt: v }, ...state.knots];
      store.write("knots", state.knots);
      state.knot = "";
      render(false);
    }

    function addBead(name, txt) {
      const v = (txt || "").trim();
      if (!v) return;
      state.beads = [{ t: new Date().toISOString(), n: name || "Truth", txt: v }, ...state.beads];
      store.write("beads", state.beads);
      if (name && name !== "Truth") {
        state.detects = [...state.detects, name];
        store.write("detects", state.detects);
      }
      state.bead = "";
      state.screen = "beads";
      render(true);
    }

    function exportCopy() {
      const blob = new Blob([JSON.stringify({
        unwritten: 1,
        knots: state.knots,
        beads: state.beads,
        steps: state.steps,
        detects: state.detects
      }, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "unwritten-words.json";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function onFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result || ""));
          if (!data || data.unwritten !== 1 || !Array.isArray(data.beads) || !Array.isArray(data.knots)) {
            throw new Error("shape");
          }
          state.pending = data;
          state.keepError = "";
        } catch {
          state.pending = null;
          state.keepError = "That file is not an Unwritten copy.";
        }
        render(false);
      };
      reader.readAsText(file);
    }

    document.getElementById("app").addEventListener("click", (e) => {
      const goBtn = e.target.closest("[data-go]");
      if (goBtn) { go(goBtn.getAttribute("data-go")); return; }
      const actBtn = e.target.closest("[data-act]");
      if (!actBtn) return;
      const act = actBtn.getAttribute("data-act");
      if (act === "enter") { try { store.setSeen(); } catch {} go("home"); }
      else if (act === "listen") listen();
      else if (act === "name") { const src = state.what.trim(); if (!src) return; state.hits = score(src); state.named = true; render(false); }
      else if (act === "save-plain") addBead("Truth", state.what);
      else if (act.startsWith("save:")) addBead(state.hits[Number(act.slice(5))].name, state.what);
      else if (act === "breathe") go("breathe");
      else if (act === "help") go("help");
      else if (act === "add-knot") addKnot();
      else if (act === "add-bead") addBead("Truth", state.bead);
      else if (act.startsWith("step:")) {
        const id = act.slice(5);
        if (!state.steps.includes(id)) {
          state.steps = [...state.steps, id];
          store.write("steps", state.steps);
          render(false);
        }
      }
      else if (act === "export") exportCopy();
      else if (act === "import") pick();
      else if (act === "cancel-restore") { state.pending = null; render(false); }
      else if (act === "confirm-restore" && state.pending) {
        state.knots = state.pending.knots;
        state.beads = state.pending.beads;
        state.steps = Array.isArray(state.pending.steps) ? state.pending.steps : [];
        state.detects = Array.isArray(state.pending.detects) ? state.pending.detects : [];
        store.write("knots", state.knots);
        store.write("beads", state.beads);
        store.write("steps", state.steps);
        store.write("detects", state.detects);
        state.pending = null;
        state.keepError = "";
        render(false);
      }
    });

    function pick() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "application/json,.json";
      input.addEventListener("change", () => { if (input.files && input.files[0]) onFile(input.files[0]); });
      input.click();
    }

    function listen() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { state.listenError = "Speak works in Chrome."; render(false); return; }
      state.listenError = "";
      const rec = new SR();
      rec.lang = "en-AU";
      rec.onresult = (e) => {
        const said = (e.results[0] && e.results[0][0] && e.results[0][0].transcript) || "";
        state.what = state.what ? state.what + " " + said : said;
        render(false);
      };
      rec.onerror = () => { state.listenError = "I could not hear that. You can type it."; render(false); };
      try { rec.start(); } catch { state.listenError = "Speak is busy. Try again in a moment."; render(false); }
    }

    render(false);
  </script>
</body>
</html>
