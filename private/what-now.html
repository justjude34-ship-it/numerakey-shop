<style>
:root{--bg:#07040f;--card:#130d24;--card2:#1b1233;--line:#32255a;--tx:#efeafc;--mu:#aaa2c8;--teal:#4fe3c8;--vio:#b398ff;--red:#f87171;--amb:#fbbf24;--grn:#4ade80;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(130% 45% at 50% 0,#1d1245 0,rgba(29,18,69,0) 70%) fixed,var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(7,4,15,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 0}
.hd .t{flex:1;line-height:1.2}.hd .t b{display:block;font-size:17px;color:var(--teal)}.hd .t span{font-size:12.5px;color:var(--mu)}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--tx);padding:9px 14px;border-radius:12px;font:600 14px inherit;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(90deg,var(--teal),var(--vio));color:#04141a;border:0}
.btn.red{background:#2a1010;border-color:#5a2222;color:#fecaca}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%;display:block;margin-top:10px;padding:13px}
.danger{margin:10px 0;border:1px solid #6b2424;background:#1f0b0b;color:#fecaca;border-radius:12px;padding:10px 12px;font-size:14px}
.danger a{color:#fff;font-weight:700}
h1,h2{margin:.2em 0 .3em;line-height:1.2;background:linear-gradient(90deg,var(--teal),var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:26px}h2{font-size:21px}
h3{margin:1em 0 .3em;font-size:16px;color:var(--teal)}
p{margin:.5em 0}
.mu{color:var(--mu)}.sm{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.hero{text-align:center;background:radial-gradient(120% 90% at 50% 0,#231550 0,#0a0a10 60%);padding:22px 16px}
.card.warn{border-color:#5a4420;background:#17120a}
.card.bad{border-color:#5a2222;background:#170b0b}
.card.good{border-color:#1f4a3a;background:#09140f}
.list{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.item{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:13px 14px;font:inherit;cursor:pointer}
.item:active{background:var(--card2)}
.item .ic{flex:0 0 38px;height:38px;border-radius:12px;background:#21164a;display:grid;place-items:center}
.item b{display:block;font-size:15.5px}.item span.s{font-size:13px;color:var(--mu)}
.item .ch{margin-left:auto;color:var(--mu)}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;overflow:hidden}
summary{padding:13px 14px;font-weight:650;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--teal);font-size:20px}
details[open] summary::after{content:"–"}
details .in{padding:0 14px 14px}
.k{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--teal);margin-top:10px}
.k.r{color:var(--red)}.k.a{color:var(--amb)}.k.g{color:var(--grn)}
ul.b{margin:.3em 0;padding-left:20px}ul.b li{margin:.25em 0}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.pill{border:1px solid var(--line);background:var(--card);color:var(--mu);padding:7px 12px;border-radius:99px;font:600 13px inherit;cursor:pointer}
.pill.on{background:linear-gradient(90deg,var(--teal),var(--vio));color:#04141a;border:0}
input,textarea,select{width:100%;background:#0d0819;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #2a1e4d;cursor:pointer}
.chk:last-child{border:0}
.chk input{width:22px;height:22px;flex:0 0 22px;margin:2px 0 0;accent-color:var(--teal)}
.chk.r input{accent-color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,4,15,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:720px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 2px 7px;font:600 11px inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button.on{color:var(--teal)}
nav svg{width:22px;height:22px}

.herobg h1{background:none;color:#fff;-webkit-text-fill-color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.herobg p{color:#e4e4ee;text-shadow:0 1px 8px rgba(0,0,0,.8)}
.herobg svg{filter:drop-shadow(0 4px 18px rgba(0,0,0,.6))}
.back{background:none;border:0;color:var(--teal);font:600 15px inherit;padding:10px 0;cursor:pointer}
.moods{display:flex;gap:8px;margin:10px 0}
.moods button{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:22px;cursor:pointer}
.moods button.on{border-color:var(--teal);background:#1e1a48}
.entry{border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;background:var(--card2)}
.entry .m{font-size:12.5px;color:var(--mu);display:flex;gap:8px;align-items:center}
.entry .m button{margin-left:auto}
.tag{background:#241b4d;color:#a5b4fc;border-radius:99px;padding:2px 9px;font-size:12px}
.bar{height:10px;border-radius:99px;background:#241a42;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--vio));width:0;transition:width .3s}
.breath{width:170px;height:170px;margin:18px auto;border-radius:50%;background:radial-gradient(circle,#5eead4 0,#a78bfa 70%,#1e1b4b 100%);display:grid;place-items:center;color:#04141a;font-weight:700;transform:scale(.6);transition:transform 4s ease-in-out}
.lock{position:fixed;inset:0;z-index:100;background:#07040f;display:flex;align-items:center;justify-content:center;padding:24px}
.lock .box{max-width:340px;width:100%;text-align:center}
.pinin{letter-spacing:.5em;text-align:center;font-size:24px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:8px}
.say{border-left:3px solid var(--vio);padding:6px 12px;margin:8px 0;background:#150f2e;border-radius:0 10px 10px 0;font-style:italic}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c1840;border:1px solid #2c4a5a;padding:10px 16px;border-radius:12px;z-index:200;font-size:14px}
svg text{font-family:inherit}
@media (prefers-reduced-motion:reduce){.breath{transition:none}}

/* ============ state + storage (optional PIN encryption) ============ */
let S=null, KEYOBJ=null, META=null, view={tab:"home",sub:null}, idleT=null;
const blank=()=>({journal:[],log:[],contact:[],checks:{},plan:{},danger:{},checkins:[],settings:{}});
const b64=u=>btoa(String.fromCharCode(...u)), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pin,salt){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
function readRaw(){try{return JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){return null}}
async function save(){
 if(!S)return;

const MIND=[
 {ic:"🧠",n:"Your brain under abuse",html:`<p>Long-term psychological abuse can produce real nervous-system changes: a hyper-reactive alarm system (amygdala), stress effects on memory (hippocampus), and a tired decision-making brain (prefrontal cortex). That's why 'just leave' can feel impossible, and why thinking clearly feels hard.</p><p><b>It is not weakness. It is what happens to nervous systems under chronic threat.</b> It improves with safety, time and trauma-informed support.</p><span class="k">Common effects</span><ul class="b"><li>Brain fog, forgetting things, losing words</li><li>Startle response, jumpiness, constant scanning for their mood</li><li>Freeze or fawn: going quiet or pleasing to stay safe</li><li>Flat, numb, or flooded in alternating waves</li><li>Second-guessing every decision</li></ul>`},
 {ic:"💔",n:"You were scammed, not stupid",html:`<p>Think of it as a long con. The person you met was a performance designed to mirror your wishes. You fell in love with someone who was never real. That is a legitimate loss, and the grief is real.</p><span class="k">Why you were targeted</span><ul class="b"><li>You're empathic and give people the benefit of the doubt</li><li>You're loyal and work at relationships</li><li>You're capable, which makes you useful</li><li>You believe people can change</li></ul><p>Con artists don't pick fools. They pick people with something to give.</p>`},
 {ic:"🔗",n:"Trauma bonds: why you can't just stop",html:`<p>A trauma bond is attachment built by intermittent reinforcement plus a power imbalance. Highs and lows, cruelty and relief, create a chemical loop that behaves like addiction. The pull is real, and strong.</p><span class="k">What helps</span><ul class="b"><li>Name it. Say 'this is the bond, not the love'.</li><li>Interrupt contact where you can. Every contact resets the loop.</li><li>Rebuild with safe people and small routines.</li><li>Grieve the fantasy: the person you thought they were.</li><li>Going back more than once is common. It's data, not failure.</li></ul>`},
 {ic:"🪨",n:"Gray Rock and Yellow Rock",html:`<p><b>Gray Rock:</b> short, dull, factual answers. No emotion, no extra information, no debate. You become unrewarding to manipulate.</p><p><b>Yellow Rock:</b> the same protection with polite, warm wording when children, work or logistics require contact.</p><span class="k">Rules</span><ul class="b"><li>One-word and one-line answers. 'Okay.' 'Thanks.' 'I'll think about it.'</li><li>Don't share plans, feelings, wins, or anything they could use.</li><li>Don't defend, justify, argue or explain (JADE).</li><li>Delay your reply. Time reduces mistakes.</li><li>Keep your real life, feelings and plans elsewhere with other people.</li></ul><p class="mu sm">Gray Rock is a temporary survival tool, not a life plan. It also can provoke a backlash in some people. If it increases danger, stop and get advice.</p>`},
 {ic:"🗓️",n:"Stuck for now: how to stay sane",html:`<p>You may not be able to leave today. Money, kids, housing, health, safety or simply not being ready are all real reasons. Staying while you prepare is a valid strategy, as long as you are safe enough to do it.</p><span class="k g">Daily anchors</span><ul class="b"><li><b>Write it down.</b> One line in the Reality Log whenever something happens. Facts only.</li><li><b>Keep one thing that is yours.</b> A walk, a pet, a friend, a class, a podcast. A small private life matters.</li><li><b>Regulate your body.</b> Breathing and grounding in Toolkit. Sleep, food, water.</li><li><b>Make one tiny exit move per week.</b> A document copied. A dollar saved. A number memorised.</li><li><b>Have one safe person.</b> Someone who knows the truth.</li></ul><span class="k a">Don't</span><ul class="b"><li>Try to be understood by them. It won't happen.</li><li>Test, bait or provoke to see if they've changed.</li><li>Make big decisions in a crisis or a honeymoon phase.</li><li>Tell them your plans or your timeline.</li></ul><p>Decide by a timeline, not a feeling. 'In six months I will know X, have Y saved, and talk to Z' is more reliable than waiting until you feel ready.</p>`},
 {ic:"🧩",n:"Rebuilding your reality",html:`<ul class="b"><li>Reread your Reality Log when you doubt yourself. It was written when you were clear.</li><li>Use 'I remember it differently' rather than arguing.</li><li>Find one counsellor or support worker who understands coercive control and narcissistic abuse. Many don't, so ask.</li><li>Limit time with people who minimise it ('but they seem so nice').</li><li>Grounding questions: <i>What do I know for certain? What have I seen? What does my body say?</i></li><li>Trust the pattern, not the apology.</li></ul>`}

 do:["Stay consistent, calm, warm and available. Every contact is a chance to show who you are.","Keep sending cards, texts and gifts, even unanswered. Keep copies. Keep it light, no guilt, no pressure.","Say aloud: 'I love you. You never have to choose. I'm here.'","Do not badmouth the other parent to the kids. Even when it's true and tempting.","Never interrogate. Ask about their day, not the other house.","Comply with all orders and agreements, even when they don't. Compliance is your strongest asset.","Keep every communication brief, informative, friendly, firm (BIFF). Assume a judge reads it.","Use one channel only: a co-parenting app or email, not text arguments.","Keep your life steady: housing, work, health. Stability is protective.","Get support for yourself. This is grief and injustice together."],
 dont:["Retaliate, withhold support or break orders","Question or pressure the child about the other parent","Share court details or adult issues with the kids","Post about it on social media","Lose your temper in front of the kids or at handover","Give up. Children often reconnect later, sometimes years later, when they find that you stayed steady."],
 devalue:`<p>Children are not neutral in a narcissistic household. Often the narcissistic parent runs the same cycle on the child that they ran on you: praise and closeness when the child agrees, coldness and punishment when the child is warm to you. Over time the child learns that safety means siding with them, and may begin to treat you with the same contempt.</p>
 <span class="k a">How it's done</span><ul class="b"><li><b>Modelled contempt:</b> eye-rolls, mocking you, laughing at you with the kids, imitating you.</li><li><b>Labels:</b> you're crazy, lazy, stupid, dramatic, dangerous, or the reason things went wrong.</li><li><b>Reward and punish:</b> treats, attention and 'golden child' status for agreeing; silence, guilt and withdrawal for warmth towards you.</li><li><b>Undermining you:</b> "You don't have to listen to her." Rules relaxed at their house, yours made to look cruel.</li><li><b>Making the child a confidant or spy:</b> adult secrets, 'our little team', reports back on you.</li><li><b>Emotional responsibility:</b> "You're hurting me when you go to Mum's."</li><li><b>Sabotaging your moments:</b> birthdays, handovers, school events.</li></ul>
 <span class="k">Why children go along</span><p>It's survival, not betrayal. Children adapt to the parent whose love feels conditional and whose anger is frightening. Some children are made the golden child, others the scapegoat. Both are being harmed.</p>
 <span class="k g">What helps</span><ul class="b"><li><b>Don't take it personally.</b> You're hearing someone else's script in your child's voice. Stay curious: where did that phrase come from?</li><li><b>Boundary without punishment:</b> "I won't be spoken to like that. I love you. Let's try again." Short, calm, kind, then move on.</li><li><b>Don't hit back</b> with criticism of the other parent. It confirms the story that you are the problem.</li><li><b>Validate feelings, not the narrative:</b> "It sounds like you're angry with me. I'm listening."</li><li><b>Two-truths language:</b> "Dad and I see some things differently. You can love us both."</li><li><b>Show a different model:</b> respect, calm, apology and repair after conflict. Children learn what healthy relationships feel like by living one with you.</li><li><b>Small, regular connection:</b> one-on-one time, shared routines and jokes, a kind note, food they like. Low pressure, no guilt.</li><li><b>Correct facts only when concrete</b> ("I did come to the concert; here's the photo"), never the other parent's character.</li><li><b>Consistent rules and follow-through.</b> Predictability is what the narcissistic home doesn't offer.</li><li><b>Get the child a therapist or school counsellor</b> who understands family violence and coercive control, not someone chosen by the other parent.</li><li><b>Record exact words</b> the child says unprompted ("Dad says you…"), with dates. Facts, no commentary.</li></ul>
 <p>Children often see through it, usually as they get older, when what they were told no longer matches what they lived. What they remember is who stayed steady. That can take years, and it isn't guaranteed, which is why your own support matters too.</p>`,
 law:`<ul class="b"><li>Speak to a <b>family-violence-informed family lawyer</b> early. Many community legal centres and Legal Aid offices offer free first advice.</li><li>In Australia, parenting matters turn on the child's best interests, including protection from harm and family violence, and a meaningful relationship with both parents. Family Dispute Resolution and Family Consultants are usually involved. (Exemptions exist where there's family violence.)</li><li>Ask your lawyer about child-related orders, parenting plans, handover arrangements (public, neutral places or supervised exchange), and whether a family report or Independent Children's Lawyer would help.</li><li>Ask about the <b>Family Law Watchlist (AFP)</b> and passport measures if you fear a child may be taken out of the country, and what to do if the child is withheld.</li><li>If a child is in immediate danger, call 000. If you fear for the child's wellbeing, contact child protection services.</li><li>Keep records. Calm, factual and consistent records beat emotional ones.</li></ul>`,
 protective:`<p><b>If you are the protective parent:</b> abusers sometimes accuse the safe parent of 'alienating' when that parent is limiting contact to keep the child safe, or when the child is afraid. If your child has said they feel unsafe, or you have evidence of abuse, tell your lawyer straight away, and be factual about the reasons and the evidence. Don't coach or script the child. Seek professional guidance from someone who understands both family violence and alienation dynamics.</p>`,
 parallel:`<p><b>Parallel parenting</b> is the best-fit approach with a high-conflict ex: minimal contact, clear written rules (schedules, handovers, holidays), separate decisions in separate households, communication only through one tool about the child only. It reduces the chances for conflict to happen.</p>`
};

}

function render(){
 if(!S)return;
 const v={home:vHome,pat:vPat,mind:vMind,leave:vLeave,kids:vKids,tool:vTool}[view.tab]();
 const sy=window.scrollY;
 app.innerHTML=shell(v);
 const pq=$("#pq");if(pq){pq.addEventListener("input",e=>{view.pq=e.target.value;const pos=e.target.selectionStart;render();const n=$("#pq");n.focus();n.setSelectionRange(pos,pos)})}
 if(view._keep){window.scrollTo(0,sy);view._keep=false}else window.scrollTo(0,0);
}

/* ============ events ============ */
const ltagSel=new Set();let breathT=null;
function exportText(name,txt){
 const b=new Blob([txt],{type:"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
document.addEventListener("click",async e=>{
 const t=e.target.closest("[data-tab],[data-sc],[data-a],[data-pf],[data-mood],[data-del],[data-ltag],[data-bt]");
 if(!t)return;
 const d=t.dataset;
 if(d.bt){const b=d.bt;
  if(b==="stop"){stopBreath();return}
  if(b==="session"){runSession(0);return}
  if(b.startsWith("snext:")){runSession(+b.split(":")[1]);return}
  if(TECH[b]){stopBreath();runBreath(b,TECH[b].rounds)}
  return}
 if(d.tab){stopBreath();view.tab=d.tab;view.sub=d.sub||null;if(d.pf)view.pf=d.pf;view.pq="";render();return}
 if(d.pf){view.pf=d.pf;render();return}
 if(d.sc){view.sub=d.sc;render();return}
 if(d.mood!==undefined){const day=new Date().toISOString().slice(0,10);S.checkins=S.checkins.filter(c=>c.d!==day);S.checkins.push({d:day,m:+d.mood});await save();view._keep=true;render();return}
 if(d.ltag){const g=d.ltag;ltagSel.has(g)?ltagSel.delete(g):ltagSel.add(g);t.classList.toggle("on");return}
 if(d.del){const[k,i]=d.del.split(":");if(confirm("Delete this entry?")){S[k].splice(+i,1);await save();view._keep=true;render()}return}
 const a=d.a;
 if(a==="back"){view.sub=null;render()}
 else if(a==="lock")lockNow();
 else if(a==="exit")quickExit();
 else if(a==="addLog"){const x=$("#ltxt").value.trim();if(!x)return;S.log.push({t:Date.now(),x,g:[...ltagSel]});ltagSel.clear();await save();toast("Saved");render()}
 else if(a==="addJ"){const x=$("#jx").value.trim();if(!x)return;S.journal.push({t:Date.now(),ti:$("#jt").value.trim(),x});await save();toast("Saved");render()}
 else if(a==="addContact"){S.contact.push({d:$("#cdate").value,s:$("#csched").value.trim(),o:$("#cout").value,n:$("#cnote").value.trim()});await save();toast("Saved");view._keep=true;render()}
 else if(a==="expLog")exportText("reality-log.txt",S.log.map(e=>new Date(e.t).toLocaleString()+(e.g&&e.g.length?" ["+e.g.join(", ")+"]":"")+"\n"+e.x).join("\n\n"));
 else if(a==="expContact")exportText("contact-log.txt",S.contact.map(e=>e.d+" | "+e.o+" | "+e.s+"\n"+e.n).join("\n\n"));
 else if(a==="setPin"){
  const p1=$("#pin1").value,p2=$("#pin2").value,er=$("#perr");
  if(!/^\d{4,8}$/.test(p1)){er.textContent="PIN must be 4–8 digits.";return}
  if(p1!==p2){er.textContent="PINs don't match.";return}
  const salt=crypto.getRandomValues(new Uint8Array(16));KEYOBJ=await derive(p1,salt);
  META={v:2,enc:true,salt:b64(salt)};await save();bump();toast("PIN set");render();
 }
 else if(a==="rmPin"){if(confirm("Remove the PIN? Your data will be stored unencrypted on this device.")){META={v:2,enc:false};KEYOBJ=null;await save();toast("PIN removed");render()}}
 else if(a==="erase"){if(confirm("Erase everything this app has saved on this device? This cannot be undone.")){localStorage.removeItem(KEY);S=blank();META=null;KEYOBJ=null;await save();toast("Erased");render()}}
});
document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.dataset.ck!==undefined){S.checks[t.dataset.ck]=t.checked;await save();const all=Object.values(CHECKS).flat().length,done=Object.keys(S.checks).filter(k=>S.checks[k]).length;const p=Math.round(done/all*100);const bar=$(".bar i");if(bar)bar.style.width=p+"%";const hh=$("h2 .mu");if(hh)hh.textContent=p+"%"}
 if(t.dataset.dg!==undefined){S.danger[t.dataset.dg]=t.checked;await save();view._keep=true;render()}
});
document.addEventListener("input",e=>{
 const t=e.target;
 if(t.dataset.plan){S.plan[t.dataset.plan]=t.value;clearTimeout(window._pt);window._pt=setTimeout(save,400)}
});
/* guided breathing engine. phase = [label, seconds, kind] kind: in | hold | out */
const TECH={
 sigh:{n:"Physiological sigh",rounds:5,ph:[["Breathe in",2,"in"],["A little more in",1,"in2"],["Long, slow out",6,"out"]],tip:"Through the nose, then a long sigh out through the mouth."},
 exhale:{n:"Long out-breath",rounds:10,ph:[["Breathe in",4,"in"],["Slowly out",6,"out"]],tip:"Let the out-breath be longer than the in-breath."},
 gentle:{n:"Gentle 3–5",rounds:12,ph:[["Breathe in",3,"in"],["Easy out",5,"out"]],tip:"No holding. Soft belly."},
 box:{n:"Box breathing",rounds:6,ph:[["Breathe in",4,"in"],["Hold",4,"hold"],["Breathe out",4,"out"],["Hold",4,"hold"]],tip:"Skip the holds if they feel uncomfortable."},
 sleep:{n:"4-7-8",rounds:5,ph:[["Breathe in",4,"in"],["Hold gently",7,"hold"],["Slowly out",8,"out"]],tip:"If 7 is too long, shorten every number equally."}
};
const SESSION=[
 {t:"1. Orient",x:"Look slowly around the room. Name five things you can see. Feel your feet on the floor and your weight in the chair. You are here, now, and this moment is not that conversation."},
 {t:"2. Three big sighs",b:"sigh",rounds:3,x:"Double inhale through the nose, then a long sigh out. This is the quickest way to bring the alarm level down."},
 {t:"3. Long out-breaths",b:"exhale",rounds:8,x:"Now settle into a slow rhythm. Longer out than in."},
 {t:"4. Release your body",x:"Unclench your jaw. Drop your shoulders. Open your hands. Press your palms together hard for five seconds, then let go completely. Shake out your arms if that feels good."},
 {t:"5. Say it to yourself",x:"“That was designed to get a reaction. I don't have to respond tonight. I get to be calm.”<br><br>Don't reply to anything yet. If you're not safe, open the Leave tab or call 000 / 1800 737 732."}
];
let BR={timer:null,run:0};
function stopBreath(){BR.run++;clearTimeout(BR.timer);const p=$("#player");if(p)p.style.display="none"}
function buzz(ms){if(S&&S.settings&&S.settings.noBuzz)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function showPlayer(){const p=$("#player");p.style.display="block";p.scrollIntoView({behavior:"smooth",block:"center"})}
function runBreath(key,rounds,onDone,stepLabel){
 const T=TECH[key],id=++BR.run;clearTimeout(BR.timer);showPlayer();
 const br=$("#br"),bl=$("#bl"),bc=$("#bc"),bn=$("#bn"),bx=$("#bx");
 $("#pstep").textContent=stepLabel||T.n;bx.innerHTML="";
 let r=0,p=0,left=0,reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
 function phase(){
  if(id!==BR.run)return;
  const ph=T.ph[p];left=ph[1];bl.textContent=ph[0];
  const sec=ph[1];br.style.transitionDuration=reduce?"0s":sec+"s";
  if(ph[2]==="in")br.style.transform="scale(.95)";
  else if(ph[2]==="in2")br.style.transform="scale(1.1)";
  else if(ph[2]==="out")br.style.transform="scale(.55)";
  buzz(ph[2]==="hold"?0:25);
  bn.textContent="Round "+(r+1)+" of "+rounds+" · "+T.tip;
  tick();
 }
 function tick(){
  if(id!==BR.run)return;
  bc.textContent=left;
  if(left<=0){p++;if(p>=T.ph.length){p=0;r++}
   if(r>=rounds){finish();return}
   phase();return}
  left--;BR.timer=setTimeout(tick,1000);
 }
 function finish(){
  bc.textContent="";bl.textContent="Done";br.style.transitionDuration="2s";br.style.transform="scale(.8)";
  bn.textContent="Notice how your body feels now. Even a little calmer is a win.";
  if(onDone)onDone();else bx.innerHTML='<button class="btn pri full" data-bt="'+key+'">Go again</button>';
 }
 br.style.transitionDuration="0s";br.style.transform="scale(.55)";
 bl.textContent="Get ready";bc.textContent="";bn.textContent="Sit or lean back. Let your shoulders drop.";
 BR.timer=setTimeout(()=>{if(id===BR.run)phase()},2000);
}
function runSession(i){
 i=i||0;const s=SESSION[i];stopBreath();showPlayer();const id=BR.run;
 const bx=$("#bx"),bl=$("#bl"),bc=$("#bc"),bn=$("#bn"),br=$("#br");
 const next=()=>{bx.innerHTML=i<SESSION.length-1?'<button class="btn pri full" data-bt="snext:'+(i+1)+'">Next</button>':'<button class="btn pri full" data-bt="stop">Finish</button>'};
 if(s.b){
  $("#pstep").innerHTML="<b style='color:var(--teal)'>"+s.t+"</b><br>"+s.x;
  runBreath(s.b,s.rounds,()=>{BR.run=id+1000000;$("#bl").textContent="Done";next()},s.t);
  $("#pstep").innerHTML="<b style='color:var(--teal)'>"+s.t+"</b><br><span style='color:var(--tx)'>"+s.x+"</span>";
 }else{
  br.style.transitionDuration="2s";br.style.transform="scale(.8)";bl.textContent=i===SESSION.length-1?"You did it":"…";bc.textContent="";bn.textContent="";
  $("#pstep").innerHTML="<b style='color:var(--teal)'>"+s.t+"</b><br><span style='color:var(--tx);font-size:15px'>"+s.x+"</span>";next();
 }
}

/* ============ boot ============ */
async function boot(){
 META=readRaw();
 if(META&&META.enc){
  app.innerHTML=`<div class="lock"><div class="box">${art("shield")}<h1>What Now?</h1><p class="mu">Enter your PIN</p>
  <input id="lp" class="pinin" type="password" inputmode="numeric" maxlength="8" autofocus><div class="err" id="le"></div>
  <button class="btn pri full" id="lb">Unlock</button>
  <button class="btn red full" id="lx">Exit</button>
  <button class="btn full" id="le2" style="margin-top:18px;font-weight:400;color:#9b9bab">Forgot PIN? Erase and start over</button></div></div>`;
  const go=async()=>{try{await unlock($("#lp").value);bump();view={tab:"home",sub:null};render()}catch(e){$("#le").textContent="Wrong PIN.";$("#lp").value=""}};
  $("#lb").onclick=go;$("#lp").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  $("#lx").onclick=quickExit;
  $("#le2").onclick=()=>{if(confirm("This permanently erases your saved data. Continue?")){localStorage.removeItem(KEY);boot()}};
  return;
 }
 try{S=Object.assign(blank(),META&&META.data?JSON.parse(META.data):{})}catch(e){S=blank()}
 if(!META)META={v:2,enc:false};
 render();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&META&&META.enc)window._hid=Date.now();else if(window._hid&&Date.now()-window._hid>60000&&META&&META.enc){window._hid=0;lockNow()}});
if("serviceWorker"in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
boot();
</script>
