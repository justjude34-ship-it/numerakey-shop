:[`scroll-mt`,`scroll-mb`],"scroll-p":[`scroll-px`,`scroll-py`,`scroll-ps`,`scroll-pe`,`scroll-pbs`,`scroll-pbe`,`scroll-pt`,`scroll-pr`,`scroll-pb`,`scroll-pl`],"scroll-px":[`scroll-pr`,`scroll-pl`],"scroll-py":[`scroll-pt`,`scroll-pb`],touch:[`touch-x`,`touch-y`,`touch-pz`],"touch-x":[`touch`],"touch-y":[`touch`],"touch-pz":[`touch`]},conflictingClassGroupModifiers:{"font-size":[`leading`]},postfixLookupClassGroups:[`container-type`],orderSensitiveModifiers:[`*`,`**`,`after`,`backdrop`,`before`,`details-content`,`file`,`first-letter`,`first-line`,`marker`,`placeholder`,`selection`]}});function Ut(...e){return Ht(ve(e))}var Wt=[{cat:`Name it`,t:`You are not crazy`,k:`crazy real grief unnamed permission casserole`,b:`The pain has a name even when the world will not use it. Your child is alive. The relationship you had with them is gone, or frozen, or replaced with a hostile stranger wearing their face. That is not ordinary missing. That is ambiguous loss.

People bring casseroles when someone dies. They do not bring casseroles when a child has been taught that loving you is betrayal. So you learn to shrink the grief to fit other people’s comfort. You do not have to do that in here.

Targeted parents describe serious harm across emotion, body, work, thinking, and friendships. Distress here is a sane response to an insane situation — not proof that you are unstable.`},{cat:`Name it`,t:`Ambiguous loss`,k:`ambiguous boss alive gone funeral closure door ajar`,b:`Pauline Boss named this: a loss without finality. The person is physically present in the world and psychologically absent from you — or psychologically present in your mind and physically unreachable.

There is no funeral. No certificate. No moment when the culture says “now you may stop hoping.” The door stays ajar. That is the territory, not a personal failure to “move on.”

Traditional grief stages do not fit. You can feel acceptance at breakfast and raw panic at 4pm because you saw a school backpack. That is the cycle of ambiguous loss. It is not regression.`},{cat:`Name it`,t:`Disenfranchised grief`,k:`disenfranchised permission mourn shame too much`,b:`Disenfranchised grief is grief the community refuses to recognise. Friends say “give them space.” Relatives say “kids always come back.” A new partner says “focus on the children you still have,” as if love were a pie.

When grief is disenfranchised you add a second injury: shame that you are still bleeding. You start policing your own face at barbecues.

You are allowed to mourn a living child. You are allowed to say their name. You are allowed to find this unbearable on a Tuesday in September.`},{cat:`Name it`,t:`Alienation is not the same as estrangement`,k:`estrangement justified five factor harm accountability vs`,b:`People use “estrangement” for every cutoff. Some cutoffs are a grown person’s boundary after real harm. Some are the end of a relationship that was never safe. That is not what this app is for.

Parental alienation, as researchers such as Amy J. L. Baker describe it, is a pattern: a child rejects a parent they previously had a real bond with, in the absence of abuse by that parent, after sustained alienating behaviours by the other parent, and with a cluster of tell-tale signs in the child.

Honesty note, said plainly: if you harmed your child, this app will not rebrand accountability as “they were brainwashed.” Protective cutoff after abuse is not alienation. Narcissistic brainwashing that erases a good-enough parent is.`},{cat:`Name it`,t:`Mild, moderate, severe — and gone`,k:`mild moderate severe complete cutoff levels`,b:`Practitioners often speak in levels, not because your pain needs a grade, but because the child’s situation is different in each.

Mild: reluctance, echoing complaints, but contact still happens.
Moderate: persistent refusal, opposition during time, loyalty tests.
Severe / complete cutoff: the child is gone from your life. No calls. No birthdays. Sometimes no legal lever left — especially once they are an adult.

This app is built for the last rooms on that list. Coping here is not “parenting time strategies.” Coping here is living with a missing person who is still alive.`},{cat:`How it works`,t:`Why a narcissist uses a child`,k:`narcissist supply revenge possession control triangulation`,b:`A child is the perfect supply and the perfect weapon. They cannot leave. They want both parents. They will do almost anything to keep the more frightening parent stable.

Common motives, often mixed:
• Control — the child as territory.
• Revenge — after separation, the child becomes the punishment.
• Image — the “perfect parent” story needs a villain.
• Avoiding accountability — if the child hates you, no one asks what the other parent did.
• Possession — love is not shared in a narcissistic system. It is owned.

This is coercive control aimed through a child. The child is not the enemy. The child is in the blast zone.`},{cat:`How it works`,t:`Why a child aligns with the narcissist`,k:`align loyalty bind fear love withdrawal survival squeaky`,b:`Children are not free political actors. They attach to safety.

They align because:
• The alienating parent withdraws love when the child shows warmth toward you.
• The alienating parent rages, collapses, or victimises themselves until the child manages that parent’s feelings.
• The child is told you are dangerous, selfish, or never wanted them.
• Contact with you is made so stressful that refusal feels like relief.
• Everyone around the favoured parent repeats the story, so it starts to feel like reality.

This is a loyalty bind. Loving you costs them the parent they live with. Many children choose the louder threat and call it “my own opinion.”`},{cat:`How it works`,t:`Splitting: all-good and all-bad`,k:`splitting black white idealise devalue ambivalence`,b:`Healthy children can hold two true things: Mum is loving and sometimes annoying. Dad is fun and sometimes late. That is ambivalence. It is a sign of a real relationship.

Alienation trains splitting. One parent becomes all-good, all-safe, all-truthful. The other becomes all-bad, all-dangerous, all-fake. There is no “I was hurt and I still love you.” There is only campaign.

When you hear no mixed feeling at all — no warmth leftover, no curiosity, no “I miss the old days” — you are often hearing the split, not the whole child.`},{cat:`How it works`,t:`Baker’s 17 strategies — the campaign`,k:`baker 17 strategies tactics badmouth spy secrets first name`,b:`Amy J. L. Baker asked adult children what was done to them. They described a campaign, not a bad week. One incident is deniable. The pattern is the abuse.

Poisonous messaging
1. Badmouthing you as a person.
2. Saying you do not love the child.
3. Saying you are dangerous.

Limiting contact
4. Eroding time until there is none.
5. Blocking calls, messages, social contact.
6. Destroying or intercepting photos, gifts, symbols of you.

Forcing betrayal
7. Withdrawing love when the child shows loyalty to you.
8. Forcing the child to choose.
9. Forcing the child to reject you out loud.
10. Asking the child to spy.
11. Asking the child to keep secrets from you.

Erasing and replacing
12. Calling you by your first name.
13. Calling a new partner Mum or Dad.
14. Confiding adult dirt so the child becomes a little spouse.
15. Changing the child’s name to cut the link.

Undermining
16. Overriding your rules and authority.
17. Withholding school, medical, and life information.

What not to do with this list: do not copy it. Do not lecture the child with it. Use it to stop calling yourself “too sensitive.”`},{cat:`How it works`,t:`What you may see in the child`,k:`eight signs denigration borrowed independent thinker guilt`,b:`Researchers describe a cluster of signs. Education, not a home diagnosis.

• A campaign of denigration — not one complaint, a programme.
• Weak or absurd reasons (“you packed the wrong sandwich”).
• No ambivalence — you are only bad.
• “I thought of this myself” — the independent-thinker claim, often in the other parent’s phrases.
• Reflexive support of the favoured parent.
• Little or no guilt about cruelty toward you.
• Borrowed scenarios — stories they could not have lived, told in an adult register.
• Hatred spread to your parents, siblings, new partner, even the dog.

Underneath, many later say they still loved the rejected parent and were terrified to show it.`},{cat:`How it works`,t:`False memories and rewritten history`,k:`false memory rewrite never loved me gaslight history`,b:`A campaign does not only block contact. It rewrites the file.

Birthday parties become “you never came.” Comfort becomes “you were performing.” Discipline becomes “abuse.” Photos disappear. Mutual friends are briefed. The child is interviewed until their own memories feel unreliable.

Then they say “you never loved me,” and part of you wonders if it is true.

Your reality anchors exist for this exact moment. One specific Tuesday. One specific laugh. The weight of their head. Facts with dates beat a slogan.`},{cat:`How it works`,t:`Grandparents, siblings, your people`,k:`grandparents siblings extended family erasure flying monkeys`,b:`Alienation rarely stops at you. Grandparents lose birthdays. Siblings become “the enemy’s children.” Your new partner is framed as a predator or a replacement.

Sometimes relatives become messengers — flying monkeys — passing the favoured parent’s lines as concern. “They just need space.” “If you stop reaching out they will come.” “Have you thought about what you did?”

You can love your extended family and still refuse to let them run the campaign into your kitchen.`},{cat:`Adult children`,t:`When the child is grown`,k:`adult child independent cutoff court partner in-laws`,b:`No court can order an adult to love you. That fact is used as a weapon: “See? They chose this.”

Often they did not start choosing as an adult. The story was installed across years — loyalty tests, smears, withheld visits, a house where your name was dirt. At eighteen the programming simply becomes legally bulletproof.

The smear then travels through partners and in-laws. A new girlfriend is handed a villain monologue before she meets you. Family events become loyalty theatres.

Reaching out every week can confirm the story they were told: you are obsessive, you cannot respect a boundary. Leaving a light on is not the same as chasing.`},{cat:`Adult children`,t:`If an adult child wakes up later`,k:`reunite wake up years later first contact long horizon`,b:`Some adult children do come back. Sometimes after a breakup, a baby, therapy, or the favoured parent turning the same tactics on them. There is no timeline. There is no guarantee. Building your life as a waiting room will hollow you out.

If a door opens:
• Be objective, persistent, compassionate — not forensic.
• Do not make them confess that they were brainwashed in week one.
• Do not require them to hate the other parent as the price of loving you.
• Expect them to defend the alienating parent for a long time. That defence kept them safe.
• Keep your life sturdy so their return is not the only oxygen in the room.

A first message is not a trial. It is a porch light.`},{cat:`What it does to you`,t:`The emptiness`,k:`emptiness panic shame identity collapse too quiet house`,b:`The house is too quiet. Their birthday arrives like a weather event. You reach for the phone and remember there is no number that will be answered.

People call this depression. Sometimes it is. Often it is grief with nowhere to go. You are still a parent in your bones and unemployed from the job.

Identity collapses: “If I am not their mum / dad in practice, what am I?” You are still their parent. You are also a person who needs a life that is not only the missing child. Both sentences can sit in the same room.`},{cat:`What it does to you`,t:`Self-blame scripts`,k:`self blame if i had been better what did you do shame`,b:`The mind looks for a lever. If the loss was your fault, then in theory you could fix it. That is why self-blame feels like responsibility and is actually a trap.

Common scripts:
• If I had been a better parent they would have stayed.
• If I had fought harder in court.
• If I had not left the marriage.
• If I had stayed silent / spoken up / paid more / paid less.

Answer the script with the actual mechanism: a child was put in a loyalty bind by a parent who needed them as a weapon or as a spouse-substitute. Your ordinary imperfections are not this.

You can take responsibility for your real mistakes without adopting the whole rewritten novel.`},{cat:`What it does to you`,t:`The body keeps the date`,k:`body sleep appetite chest anniversary somatic collapse`,b:`Sleep goes. Food turns to cardboard. The chest tightens in the supermarket when you see their year-level uniform. After a “small” date — last day of term, a song, a street — you collapse and call yourself dramatic.

You are not dramatic. The nervous system marks anniversaries whether you put them in a calendar or not. That is why Hard Days exists in Hold.

Move the body when you can. Eat something plain. Tell one safe person “this is a marked day.” Do not add a lecture to the pain.`},{cat:`Live`,t:`Boss’s six practices — not stages`,k:`boss six meaning mastery identity ambivalence attachment hope`,b:`Boss does not offer closure. She offers practices you return to.

1. Find meaning — shift “I am a failed parent” to “I am a targeted parent in a campaign I did not invent.”
2. Adjust mastery — stop spending your life-force on the outcome you cannot run. Spend it on sleep, work, pets, one friendship, dignity.
3. Reconstruct identity — parent, and also not only parent.
4. Normalise ambivalence — hope and hopelessness can share a day.
5. Revise attachment — love them without requiring daily contact as proof that the love is real.
6. Discover new hope — hope that is not only reunion. Hope that you will not disappear as a person.

The door stays ajar. Resilience is learning to live with that click.`},{cat:`Live`,t:`What you can control`,k:`control cannot two hands mastery serenity dignity`,b:`You cannot control:
the campaign, the child’s current script, the other parent’s story, most courts, most relatives, time.

You can control:
whether you send the 2am message, whether you keep one friend who believes you, whether you eat, whether you speak to them with dignity if they ever arrive, whether you become the villain the story needs.

Mastery here looks small and unglamorous. That is the point.`},{cat:`Live`,t:`What not to do`,k:`what not to do social media gifts stalking triangulation jade`,b:`These almost always feed the story they were given:

• Public posts aimed at them, even “I miss you” on a tagged photo.
• Gifts as proof of love sent into a hostile house.
• Asking relatives to “just tell them the truth.”
• Showing up unannounced.
• Debating the installed narrative point by point.
• JADE — justify, argue, defend, explain — until you look frantic.
• Copying alienating tactics so they will “see how it feels.”
• Making any new partner or remaining child carry this grief.

None of this means you stop being their parent. It means you stop auditioning for a judge who is not in the room.`},{cat:`Live`,t:`Holidays and the empty chair`,k:`holiday christmas birthday mother's father's day wedding school`,b:`The calendar is not neutral. Christmas, Eid, Hanukkah, Mother’s Day, Father’s Day, first day of school, the wedding you were not told about — these are tripwires.

Plan the day before it arrives. Decide in advance: who you will be with, whether you will look at photos, whether you will light a candle, whether you will volunteer so the hours have a shape. Adler’s old homework still holds: do two kind things for someone else if the grief is eating the room.

You may cry. You may also laugh at a stupid joke the same afternoon. That is not betrayal. That is a nervous system trying to live.`},{cat:`Live`,t:`The urge to reach out`,k:`urge message 2am chase socials pause`,b:`The urge is attachment plus panic plus hope. It is not proof that sending the message is wise.

Ninety seconds. Drink water. Read one reality anchor. Ask: will this land as love, or as confirmation that I cannot respect a closed door?

Sometimes a yearly letter to a last known address is love. Sometimes the tenth text in a week is fuel for an affidavit. You already know which one you are about to send. Pause long enough to admit it.`},{cat:`Live`,t:`If they reach out`,k:`reach out first message contact door open don't flood`,b:`If a message comes, the instinct is to pour the last five years through the phone. Don’t.

Do:
• Answer. Warmth first.
• Keep it short.
• Let them set pace.
• Stay a parent, not a lawyer.

Don’t:
• Litigate the past in message one.
• Make them choose you against the other parent.
• Send a dossier of “what really happened.”
• Demand an apology as the ticket in.
• Flood with photos, essays, voice notes.

You can be overjoyed and still be boundaried. Those are adult skills. They are also how some doors stay open.`},{cat:`Live`,t:`Building a life that is not a waiting room`,k:`identity life waiting room pets work friends meaning`,b:`You can leave a light on and still plant a garden.

A life beside the missing child is not disloyalty. It is how you remain someone they could return to — a person, not a shrine.

Work that uses your mind. Friends who do not flinch. Animals who stay. A body that gets walked. A room that is allowed to be beautiful. If you have other children, they do not need to become memorial candles.

You are still their parent. You are also still here.`},{cat:`Myths`,t:`“What did you do?”`,k:`what did you do myth blame`,b:`This question assumes the child’s rejection is a clean verdict on your character. In alienation the child’s story is often the favoured parent’s story, recited with feeling.

You can examine yourself without accepting a show trial. Real parents make real mistakes. Campaigns turn mistakes into a myth of monstrosity.

A useful reply to the outsider: “That is a long story, and I am not putting my child on trial in this conversation.”`},{cat:`Myths`,t:`“Kids go through phases.”`,k:`phase they will come back always`,b:`Some conflict after separation is a phase. A multi-year campaign with borrowed language, no guilt, and a total cutoff is not a sulk.

“They’ll come back” is a lullaby adults sing so they do not have to sit with you. Some do come back. Some do not. You cannot budget your nervous system on a proverb.`},{cat:`Myths`,t:`“At least they’re alive.”`,k:`at least alive dead worse`,b:`Yes. And. Ambiguous loss can be crueler than a death in one specific way: the culture will not let you mourn, and the hope will not let you rest.

You can be grateful they are alive and still find this unbearable. Anyone who needs you to pick one is asking you to lie.`},{cat:`Myths`,t:`“If you were a good parent they’d come back.”`,k:`good parent come back love enough`,b:`Good parents lose children to this. The research interviews are full of them. Love is not a force-field against a loyalty bind.

This myth is especially vicious because it turns your love into evidence against you: the more you miss them, the more you must have failed. That is not logic. That is cruelty wearing common sense.`},{cat:`Myths`,t:`“Just give it time and stay silent forever.”`,k:`silent forever no contact wait`,b:`Strategic quiet can be wise. Erasing yourself can become another kind of death.
