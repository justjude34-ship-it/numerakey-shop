<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>NumeraKey Learn — Be Your Own Numerologist</title>
<style>
  :root {
    --bg: #12141a;
    --bg-2: #181b22;
    --surface: #1e222b;
    --surface-2: #262b36;
    --line: rgba(244, 239, 230, 0.08);
    --text: #f4efe6;
    --muted: #b3a89a;
    --faint: #7d756b;
    --terra: #c46b4a;
    --terra-deep: #a35336;
    --gold: #d4b483;
    --sage: #7f9a86;
    --ink: #12141a;
    --shadow: 0 12px 40px rgba(0,0,0,.35);
    --radius: 18px;
    --nav-h: 72px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    min-height: 100dvh;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3 { font-family: Georgia, "Iowan Old Style", Palatino, serif; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; }
  .app { max-width: 760px; margin: 0 auto; padding: 18px 16px calc(var(--nav-h) + var(--safe-b) + 28px); }
  .top {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
  }
  .mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(160deg, #2a241c, #1a1714);
    border: 1px solid rgba(212,180,131,.45);
    display: grid; place-items: center;
    color: var(--gold); font-family: Georgia, serif; font-size: 16px;
  }
  .brand { display: flex; flex-direction: column; }
  .brand small { color: var(--gold); letter-spacing: .16em; text-transform: uppercase; font-size: 11px; }
  .brand strong { font-family: Georgia, serif; font-weight: 500; font-size: 18px; }

  .cover-hero {
    margin: 0 0 16px;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid rgba(212,180,131,.35);
    box-shadow: 0 16px 40px rgba(0,0,0,.45);
    background: #0b1a3a;
  }
  .cover-hero img {
    display: block;
    width: 100%;
    height: auto;
  }
  .hero {
    background:
      radial-gradient(1200px 280px at 10% -10%, rgba(196,107,74,.22), transparent 50%),
      radial-gradient(800px 240px at 100% 0%, rgba(212,180,131,.14), transparent 46%),
      var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 22px 20px 18px;
    box-shadow: var(--shadow);
  }
  .kicker { color: var(--gold); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; margin: 0 0 8px; }
  h1 { font-size: 34px; margin: 0 0 8px; }
  .lede { color: var(--muted); margin: 0 0 16px; }
  .progress-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .bar { height: 8px; background: #11141a; border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--terra), var(--gold)); border-radius: 99px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .chip { border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--muted); border-radius: 999px; padding: 6px 10px; font-size: 13px; }
  .section-title { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 4px 10px; }
  .section-title h2 { margin: 0; font-size: 22px; }
  .section-title span { color: var(--faint); font-size: 13px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
  }
  .lesson-btn, .level-card {
    width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 14px; margin-bottom: 10px; color: var(--text);
  }
  .lesson-btn { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; }
  .lesson-btn:active, .level-card:active { transform: translateY(1px); }
  .num {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: #171a21; color: var(--gold); font-family: Georgia, serif; font-size: 18px;
    border: 1px solid var(--line);
  }
  .lesson-btn.done .num { background: rgba(127,154,134,.18); color: #cfe0d3; border-color: rgba(127,154,134,.35); }
  .ltitle { font-size: 16.5px; margin: 0 0 2px; }
  .lmeta { color: var(--faint); font-size: 13px; margin: 0; }
  .pill { font-size: 12px; color: var(--gold); border: 1px solid rgba(212,180,131,.3); border-radius: 999px; padding: 4px 8px; }
  .back {
    background: transparent; border: 0; color: var(--gold); padding: 0 0 12px; font-size: 15px;
  }
  .lesson h2 { font-size: 30px; margin: 0 0 6px; }
  .objective { color: var(--muted); margin-top: 0; }
  .teach p { margin: 0 0 12px; }
  .example {
    background: #171a21; border-left: 3px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin: 8px 0 16px;
  }
  .example strong { color: var(--gold); }
  .q { margin: 0 0 14px; }
  .q p { margin: 0 0 8px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    text-align: left; background: #171a21; border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px;
  }
  .opt.picked { border-color: var(--gold); }
  .opt.good { border-color: var(--sage); background: rgba(127,154,134,.12); }
  .opt.bad { border-color: var(--terra); background: rgba(196,107,74,.12); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn {
    border: 0; border-radius: 12px; padding: 12px 14px; background: var(--terra); color: #fff8f4; font-weight: 600;
  }
  .btn.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); font-weight: 500; }
  .btn.sage { background: #2c3a32; color: #e7f0ea; }
  .note { color: var(--muted); font-size: 14px; }
  .feedback { min-height: 1.4em; margin: 8px 0 0; color: var(--gold); }
  label { display: block; color: var(--muted); font-size: 14px; margin: 10px 0 6px; }
  input, select {
    width: 100%; background: #12151b; border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  }
  .result {
    margin-top: 14px; background: #171a21; border-radius: 14px; padding: 14px; border: 1px solid rgba(212,180,131,.25);
  }
  .result .big { font-family: Georgia, serif; font-size: 42px; color: var(--gold); margin: 0; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mean-card h3 { margin: 0 0 4px; font-size: 22px; }
  .mean-card p { margin: 0; color: var(--muted); }
  .nav {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(18,20,26,.92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 8px 10px calc(8px + var(--safe-b));
    display: flex; justify-content: center; gap: 8px;
  }
  .nav button {
    flex: 1; max-width: 220px; background: transparent; border: 0; color: var(--faint);
    border-radius: 12px; padding: 8px 6px 6px;
  }
  .nav button.on { color: var(--text); background: #222733; }
  .nav small { display: block; font-size: 12px; }
  .hidden { display: none !important; }
  .src { color: var(--faint); font-size: 13px; margin-top: 18px; }
  @media (min-width: 800px) {
    h1 { font-size: 42px; }
    .app { padding-top: 28px; }
  }
</style>
</head>

<script>
const LETTERS = {a:1,b:2,c:3,d:4,e:5,f:6,g:7,h:8,i:9,j:1,k:2,l:3,m:4,n:5,o:6,p:7,q:8,r:9,s:1,t:2,u:3,v:4,w:5,x:6,y:7,z:8};
const VOWELS = new Set(["a","e","i","o","u","y"]);
const MEANINGS = {
  1: ["The starter", "Initiative, independence, a clear spine. Shadow: lone-wolf stubbornness."],
  2: ["The partner", "Diplomacy, timing, listening. Shadow: over-pleasing, delay."],
  3: ["The voice", "Expression, warmth, making things vivid. Shadow: scattered talk."],
  4: ["The builder", "Order, craft, showing up. Shadow: rigidity, overwork."],
  5: ["The mover", "Change, curiosity, freedom. Shadow: restlessness, unfinished things."],
  6: ["The keeper", "Care, home, responsibility, beauty. Shadow: worry, control dressed as help."],
  7: ["The seeker", "Study, solitude, pattern-finding. Shadow: withdrawal, suspicion."],
  8: ["The steward", "Power, money, results, leadership. Shadow: status hunger, hardness."],
  9: ["The closer", "Compassion, the wide view, letting go. Shadow: martyrdom, unfinished grief."],
  11: ["The intuitive", "A master of 2. Insight, sensitivity, a charge in the room. Held, not flattened, when it appears."],
  22: ["The master builder", "A master of 4. Big practical vision. Rare, and only kept when the method preserves it."]
};

const lessons = [
  {id:1, level:1, title:"What this system is", mins:6, objective:"See Pythagorean numerology as a language for self-knowledge, not a fortune.",
    teach:["This course teaches the Pythagorean system used in most English-language numerology: birth date plus the name you were given. The numbers are a map of tendencies, not a verdict and not a prediction of events.","NumeraKey’s own tools follow the same family of method as David A. Phillips and Matthew Oliver Goodwin. Hans Decoz’s published school is a useful public cross-check for the calculation rules. The words in these lessons are original — they are a teaching script, not a copy of any book.","What you will be able to do: reduce a number correctly, keep master numbers 11 and 22, and build a five-number core chart you can explain in plain language."],
    example:"A promise that fits this course: “Your Life Path describes the kind of road you keep walking.” A promise that does not: “You will meet someone in March.”",
    quiz:[{q:"Which claim fits this course?", opts:["Numbers predict exact events.","Numbers are a language for tendencies, not a verdict.","Only a professional can calculate a Life Path."], a:1}]},
  {id:2, level:1, title:"The nine numbers", mins:8, objective:"Hold one strength and one shadow for each digit 1 to 9.",
    teach:["Every larger number in this system reduces toward 1–9, unless it is a master we choose to keep. So the nine digits are the alphabet. Learn them before the formulas.","A useful memory trick: 1 starts, 2 joins, 3 speaks, 4 builds, 5 moves, 6 keeps, 7 studies, 8 stewards, 9 completes. Each also has a shadow — the same gift turned up too loud.","You do not need poetic paragraphs yet. One honest sentence per number is enough to teach someone else."],
    example:"4 is the builder: craft, routine, showing up. Its shadow is rigidity — the plan becoming more important than the person.",
    quiz:[{q:"Which number is the builder?", opts:["3","4","5"], a:1},{q:"Which shadow fits 6, the keeper?", opts:["Restlessness","Worry and control dressed as help","Status hunger"], a:1}]},
  {id:3, level:1, title:"How to reduce", mins:7, objective:"Reduce any total to a single digit, and keep 11 and 22.",
    teach:["Add the digits. If the result is 10 or more, add again, until you have a single digit. That is ordinary reduction.","Exception: if a total is 11 or 22, keep it. You may also note the digit underneath (11/2, 22/4) so you can still talk about the base. 33 is a rare advanced master. This course names it, but does not require it.","In a Life Path, reduce the month, the day, and the year on their own first. That is how an 11 or 22 survives. Adding every digit of the date in one pile can flatten a master."],
    example:"29 → 2+9 = 11, kept. 38 → 3+8 = 11, kept. 47 → 4+7 = 11, kept. 19 → 1+9 = 10 → 1. 22 stays 22.",
    quiz:[{q:"What is 29 reduced, with masters kept?", opts:["11","2","9"], a:0},{q:"What is 19 reduced?", opts:["19","10","1"], a:2},{q:"Why reduce month, day, and year separately?", opts:["To make the math harder","So an 11 or 22 is not flattened","Because only months matter"], a:1}]},
  {id:4, level:1, title:"Life Path", mins:8, objective:"Calculate a Life Path by reducing month, day, and year separately.",
    teach:["The Life Path is the long road: the themes you keep meeting. It comes from the full birth date.","Steps: reduce the month, reduce the day, reduce the year. Keep 11 or 22 if one of those three is a master. Add the three results. Reduce again, unless the sum itself is 11 or 22.","Write the chain, not just the answer. A chain is how you catch your own mistakes, and how you teach someone else."],
    example:"15 March 1984. Month 3. Day 15 → 6. Year 1+9+8+4 = 22, kept. 3+6+22 = 31 → 4. Life Path 4, with a 22 in the year.",
    quiz:[{q:"In 15 March 1984, what is the year total before the final add?", opts:["22","4","31"], a:0},{q:"What is the Life Path in that example?", opts:["22","4","6"], a:1}]},
  {id:5, level:1, title:"Birthday number", mins:6, objective:"Read the day of birth as a gift inside the Life Path.",
    teach:["The birthday number is the day of the month. Days 1–9 stay as they are. 10 becomes 1, 12 becomes 3, and so on. Keep 11 and 22 if the day is the 11th or 22nd.","It is not a second Life Path. It is a talent modifier: a tool you reach for easily, sitting inside the longer road.","Some teachers also mention the unreduced day (the 29th is both 11 and a 2). For this course, calculate the reduced form, and note 11 or 22 when the day itself is one."],
    example:"Born on the 29th: 2+9 = 11. Birthday number 11/2. Born on the 14th: 1+4 = 5.",
    quiz:[{q:"Birthday number for the 22nd?", opts:["4","22","2"], a:1},{q:"Birthday number for the 14th?", opts:["14","5","11"], a:1}]},
  {id:6, level:1, title:"Expression number", mins:8, objective:"Total the full birth name with the Pythagorean letter chart.",
    teach:["Expression (sometimes called Destiny) comes from the full birth name, not a nickname and not a married name. It describes talents and the way you are equipped to meet the Life Path.","Pythagorean chart: A J S = 1, B K T = 2, C L U = 3, D M V = 4, E N W = 5, F O X = 6, G P Y = 7, H Q Z = 8, I R = 9. Ignore spaces and hyphens.","Add each name, reduce each name (keep 11/22), then add the name totals and reduce once more. Writing each name on its own line stops most errors."],
    example:"ANN LEE. A1 N5 N5 = 11. L3 E5 E5 = 13 → 4. 11+4 = 15 → 6. Expression 6, with an 11 in the first name.",
    quiz:[{q:"Which letters equal 1?", opts:["A, J, S","E, N, W","I, R"], a:0},{q:"Expression uses which name?", opts:["The name you use on social media","The full birth name","Only the surname"], a:1}]},
  {id:7, level:1, title:"How the three talk", mins:7, objective:"Say what Life Path, Birthday, and Expression each answer.",
    teach:["Life Path is the road. Birthday is a natural tool you carry on that road. Expression is the wider set of talents in the birth name.","A reading starts to sound like a person when you link them, not when you list three dictionary paragraphs. Ask: does the name support the road, or ask for a stretch?","Keep the tone descriptive. “Tends to” and “is equipped for” are honest. “Will always” is not."],
    example:"Life Path 4, Birthday 5, Expression 6: a builder’s road, a freedom-loving daily gift, and a talent for care and craft. The stretch is keeping the 5 from undoing the 4’s follow-through.",
    quiz:[{q:"Which number is the road?", opts:["Expression","Birthday","Life Path"], a:2},{q:"A fair phrase in a reading is:", opts:["You will always fail at money.","You tend to build through steady craft.","March will bring a contract."], a:1}]},
  {id:8, level:1, title:"Your first mini-chart", mins:8, objective:"Complete Life Path, Birthday, and Expression with the workings shown.",
    teach:["This is the Level 1 capstone. Use the Lab for the arithmetic, but write the chain yourself so you own the method.","Do your own chart, or a willing friend’s. Birth name, full date. Then one short paragraph: road, tool, talents, and one stretch.","Check the result against the Lab. If they disagree, the chain is wrong — not the person."],
    example:"Blank chart: Date → month / day / year / Life Path. Day → Birthday. Birth name → Expression. Four lines of working. One paragraph.",
    quiz:[{q:"If the Lab and your chain disagree, what failed?", opts:["The person","The working chain","The alphabet"], a:1}]},
  {id:9, level:2, title:"Soul Urge", mins:7, objective:"Calculate the vowel-only number: what the heart keeps wanting.",
    teach:["Soul Urge, also called Heart’s Desire, uses only the vowels of the birth name. In this course Y is treated as a vowel, which is the simple teaching rule. Some readers only count Y when it sounds like a vowel — say which rule you used.","It is the private motive: what feels like home on the inside, whether or not other people see it.","Same reduction rules. Keep 11 and 22."],
    example:"ANN LEE vowels: A, E, E = 1+5+5 = 11. Soul Urge 11.",
    quiz:[{q:"Soul Urge uses:", opts:["All letters","Vowels only","Consonants only"], a:1},{q:"In this course, Y is:", opts:["Ignored","Treated as a vowel","Always a consonant"], a:1}]},
  {id:10, level:2, title:"Personality number", mins:7, objective:"Calculate the consonant-only number: the first impression.",
    teach:["Personality uses the consonants of the birth name. It is the coat people meet before they know the Soul Urge.","Expression is the whole name. Soul Urge plus Personality should add back toward the Expression, allowing for how you reduced along the way. That is a useful error check.","A quiet Soul Urge with a bright Personality is not a contradiction. It is a person who meets the room one way and rests another."],
    example:"ANN LEE consonants: N N L = 5+5+3 = 13 → 4. Personality 4. Vowels were 11. 11+4 = 15 → 6, which matched the Expression.",
    quiz:[{q:"Personality uses:", opts:["Vowels","Consonants","The birthday only"], a:1},{q:"A useful error check is:", opts:["Soul Urge and Personality relating back to Expression","Ignoring the surname","Only using nicknames"], a:0}]},
  {id:11, level:2, title:"The five cores together", mins:8, objective:"Write a short portrait from Life Path, Birthday, Expression, Soul Urge, and Personality.",
    teach:["Five numbers, five jobs. Road, daily gift, talents, private motive, first impression.","A portrait is five or six sentences. Lead with the Life Path, then say how the name supports or stretches it. Mention the Soul Urge only as an inner want, not as a secret the person must perform.","If two numbers clash, name the stretch. Do not pick a winner."],
    example:"Life Path 4, Birthday 5, Expression 6, Soul Urge 11, Personality 4: builds in public, wants freedom day to day, cares through craft, privately intuitive, meets people as steady.",
    quiz:[{q:"A clash between numbers should be described as:", opts:["A flaw","A stretch, with no winner","Proof the chart is wrong"], a:1}]},
  {id:12, level:2, title:"Maturity number", mins:6, objective:"Add Life Path and Expression for the later-life tone.",
    teach:["Maturity (sometimes called Reality or Power) is Life Path plus Expression, reduced, keeping 11 or 22. It is often read as a tone that strengthens in the second half of life.","It is not a replacement Life Path. Mention it lightly until the five cores feel easy.","If either input is a master, add the masters, then reduce the sum unless the sum is itself 11 or 22."],
    example:"Life Path 4 + Expression 6 = 10 → 1. Maturity 1: the builder’s road later asks for more self-direction.",
    quiz:[{q:"Maturity is:", opts:["Life Path + Expression","Vowels only","The current year"], a:0}]},
  {id:13, level:2, title:"Name changes", mins:7, objective:"See what a current name shifts, and what it cannot replace.",
    teach:["The birth name remains the Expression, Soul Urge, and Personality of record. A married name, pen name, or nickname is an overlay: it can change what people meet, not the original chart.","Calculate both if someone asks. Say clearly which is birth and which is current. Do not tell anyone they must change a name.","This is also why the course keeps saying “birth name” in every name lesson."],
    example:"Birth Expression 6, current married-name Expression 5: the original talent is care and craft; the name in daily use adds a more changeable first impression. Both can be true.",
    quiz:[{q:"A married name:", opts:["Erases the birth chart","Is an overlay, not a replacement","Must be used for the Life Path"], a:1}]},
  {id:14, level:2, title:"Karmic debt, lightly", mins:6, objective:"Recognise 13/4, 14/5, 16/7, and 19/1 without turning them into a curse.",
    teach:["Some Pythagorean teachers, including Decoz, flag four totals before the final reduction: 13, 14, 16, and 19. They are read as extra homework on the digit underneath — 13/4, 14/5, 16/7, 19/1.","This course treats them as optional colour, not a diagnosis. If you mention one, pair it with the ordinary meaning of the final digit. Never use “karmic” as a threat.","You will see them in a chain: 29 is 11, not a karmic debt. 19 is 19/1. 13 is 13/4."],
    example:"A day total of 19 → note 19/1, then continue. The reading still centres on 1, with a remark that independence may have been hard-won.",
    quiz:[{q:"13 reduces as:", opts:["13/4","13/3","A master number"], a:0},{q:"How should karmic debt be used here?", opts:["As a curse","As optional colour, never a threat","As the main reading"], a:1}]},
  {id:15, level:3, title:"Personal Year", mins:7, objective:"Calculate the current Personal Year from birth month, birth day, and the calendar year.",
    teach:["A Personal Year is a seasonal weather report, not a fate. Add the reduced birth month, reduced birth day, and the reduced calendar year. Keep 11 or 22.","It runs, in this teaching, from birthday to birthday for a personal feel, though many books use the calendar year. Say which window you mean.","Numbers cycle 1 through 9. A 1 year starts, a 9 year finishes. Do not promise events inside the year."],
    example:"Birthday 15 March, calendar year 2026. Month 3, day 6, year 2+0+2+6 = 10 → 1. 3+6+1 = 10 → 1. Personal Year 1.",
    quiz:[{q:"Personal Year uses:", opts:["Birth month, birth day, calendar year","The full birth year only","Vowels of the name"], a:0}]},
  {id:16, level:3, title:"Personal Month", mins:6, objective:"Add the calendar month to the Personal Year for a finer window.",
    teach:["Personal Month is Personal Year plus the calendar month, reduced. It is a light touch — useful once Personal Year feels solid, easy to over-read.","Use it as timing colour: “this month leans toward finishing” rather than “do not travel.”","Same master rule. If you are unsure, stay at the Personal Year."],
    example:"Personal Year 1, October = 10 → 1. 1+1 = 2. Personal Month 2: a starting year, a cooperative month.",
    quiz:[{q:"Personal Month is:", opts:["Personal Year + calendar month","Life Path + age","Expression only"], a:0}]},
  {id:17, level:3, title:"Compatibility, without ranking", mins:8, objective:"Compare two Life Paths for ease and friction, without scoring people.",
    teach:["Compatibility here is a conversation about two roads, mostly Life Path to Life Path. Same numbers often share a pace. Neighbouring numbers can stretch each other.","There is no pass mark. A 4 and a 5 can be a good pair if both can name the stretch: stability meeting motion.","Do not rank a couple, and do not use a chart to tell someone to leave or stay. Describe the weather. They decide."],
    example:"Life Path 2 with Life Path 8: one paces by harmony, one by results. The useful sentence is about how decisions get made, not about who is better.",
    quiz:[{q:"A fair compatibility line is:", opts:["You should leave.","Your roads ask for different decision speeds.","This pair scores 40%."], a:1}]},
  {id:18, level:3, title:"What a reading is not", mins:6, objective:"Rewrite a claim so it is descriptive, not predictive or medical.",
    teach:["You are not diagnosing illness, predicting death, or giving legal or financial advice. If someone is in crisis, the chart is the wrong tool.","Swap “you will” for “this number tends to.” Swap “bad number” for “the shadow of this gift.”","A reading can be kind and still be clear. Clarity is not a scare."],
    example:"Weak: “Your 16/7 means a crash.” Better: “16/7 is a study-number with a reputation for sudden insight. I would not forecast an event from it.”",
    quiz:[{q:"Which line is in bounds?", opts:["This number means you are ill.","This number tends to need quiet to think.","You will lose money in a 5 year."], a:1}]},
  {id:19, level:3, title:"A short reading structure", mins:8, objective:"Deliver a five-line reading from a mini-chart.",
    teach:["Line 1: Life Path, the road, in one sentence. Line 2: Birthday as the easy tool. Line 3: Expression as the talent set. Line 4: Soul Urge and Personality, inner want and first impression. Line 5: one stretch, and a stop.","Stop before you invent. If you do not know, say you are staying with the five cores.","Read it aloud. If it sounds like a horoscope column, shorten it."],
    example:"“Your road is a builder’s road. The day you were born hands you a mover’s spark. The birth name equips you to care through craft. People meet steadiness; privately you want meaning. The stretch is letting the spark move without dropping the work.”",
    quiz:[{q:"How many lines in this structure?", opts:["Two","Five","Twenty"], a:1}]},
  {id:20, level:3, title:"Teach it back", mins:7, objective:"Explain a Life Path calculation out loud, chain included.",
    teach:["Teaching is the test. Pick a sample date and say the month, the day, the year, the add, and the final reduce. Then say what the Life Path is for, in one sentence.","If you skip the chain, you are reciting, not calculating. If you cannot say what the number is for, go back to lesson 2 and lesson 4.","This is also the lesson to film if you are making the course videos: a worked date on screen, then the meaning in your own words."],
    example:"“March is 3. The 15th is 6. 1984 is 22, so I keep it. 3+6+22 is 31, which is 4. Life Path 4 is the builder’s road.”",
    quiz:[{q:"A teach-back must include:", opts:["Only the final digit","The chain and what the number is for","A prediction"], a:1}]},
  {id:21, level:3, title:"Where to go next", mins:6, objective:"Choose one further study, and know what this course deliberately left out.",
    teach:["Left for a later level: Pinnacles, Challenges, Period Cycles, Transits, Essence, and the planes of expression. They are real parts of the Phillips, Goodwin, and Decoz maps. They are not required to read a core chart honestly.","Your next step inside NumeraKey is to run the same chart through the Pythagorean calculator and see that the lesson and the tool agree.","Pick one number you want to study further. That is enough homework."],
    example:"A good next study: Personal Year across a full 1-to-9 cycle, written as weather, not events. A later study: Pinnacles and Challenges.",
    quiz:[{q:"This course left Pinnacles for later because:", opts:["They are not real","A core chart can be honest without them","Only software can do them"], a:1}]}
];

const state = {
  done: JSON.parse(localStorage.getItem("nk-learn-done") || "{}"),
  tab: "home",
  lesson: null,
  picks: {}
};

function save() { localStorage.setItem("nk-learn-done", JSON.stringify(state.done)); }
function reduceNum(n) {
  if (n === 11 || n === 22) return n;
  while (n > 9) {
    n = String(n).split("").reduce((s,d)=>s+Number(d),0);
    if (n === 11 || n === 22) return n;
  }
  return n;
}
function letterSum(str) {
  const clean = str.toLowerCase().replace(/[^a-z]/g,"");
  let vowels = 0, cons = 0, all = 0, vCount = 0, cCount = 0;
  for (const ch of clean) {
    const v = LETTERS[ch];
    all += v;
    if (VOWELS.has(ch)) { vowels += v; vCount++; }
    else { cons += v; cCount++; }
  }
  return {all, vowels, cons, clean, vCount, cCount};
}
function lifePath(day, month, year) {
  const m = reduceNum(month);
  const d = reduceNum(day);
  const y = reduceNum(String(year).split("").reduce((s,c)=>s+Number(c),0));
  const sum = m + d + y;
  return {m, d, y, sum, final: reduceNum(sum)};
}

function show(tab) {
  state.tab = tab;
  document.getElementById("view-home").classList.toggle("hidden", tab !== "home");
  document.getElementById("view-lesson").classList.toggle("hidden", tab !== "lesson");
  document.getElementById("view-lab").classList.toggle("hidden", tab !== "lab");
  document.getElementById("view-numbers").classList.toggle("hidden", tab !== "numbers");
  document.querySelectorAll(".nav button").forEach(b => b.classList.remove("on"));
  if (tab === "home" || tab === "lesson") document.getElementById("tab-home").classList.add("on");
  if (tab === "lab") document.getElementById("tab-lab").classList.add("on");
  if (tab === "numbers") document.getElementById("tab-numbers").classList.add("on");
  if (tab === "home") renderHome();
  if (tab === "lab") renderLab();
  if (tab === "numbers") renderNumbers();
  window.scrollTo(0,0);
}

        <div class="num">${state.done[l.id] ? "✓" : l.id}</div>

function openLesson(id) {
  const l = lessons.find(x => x.id === id);
  state.lesson = id;
  state.picks[id] = state.picks[id] || {};
  const qs = l.quiz.map((q, qi) => `
    <div class="q" data-qi="${qi}">
      <p><strong>${qi+1}.</strong> ${q.q}</p>
      <div class="opts">
        ${q.opts.map((o, oi) => `<button class="opt" type="button" data-qi="${qi}" data-oi="${oi}">${o}</button>`).join("")}
      </div>
    </div>`).join("");
  document.getElementById("view-lesson").innerHTML = `
    <button class="back" type="button" id="back">← Course</button>
    <div class="lesson">
      <p class="kicker">Level ${l.level} · Lesson ${l.id} · ${l.mins} min</p>
      <h2>${l.title}</h2>
      <p class="objective">${l.objective}</p>
      <div class="card teach">${l.teach.map(p => `<p>${p}</p>`).join("")}</div>
      <div class="example"><strong>Worked example. </strong>${l.example}</div>
      <div class="card">
        <p class="kicker">Practice</p>
        ${qs}
        <div class="actions">
          <button class="btn" id="check" type="button">Check answers</button>
          <button class="btn secondary" id="labjump" type="button">Open the Lab</button>
        </div>
        <p class="feedback" id="feedback"></p>
      </div>
      <div class="actions">
        <button class="btn sage" id="complete" type="button">${state.done[l.id] ? "Completed" : "Mark lesson complete"}</button>
      </div>
    </div>`;
  show("lesson");
  document.getElementById("back").onclick = () => show("home");
  document.getElementById("labjump").onclick = () => show("lab");
  document.querySelectorAll(".opt").forEach(btn => btn.onclick = () => {
    const qi = btn.dataset.qi, oi = btn.dataset.oi;
    state.picks[id][qi] = Number(oi);
    btn.parentElement.querySelectorAll(".opt").forEach(o => o.classList.remove("picked"));
    btn.classList.add("picked");
  });
  document.getElementById("check").onclick = () => {
    let right = 0;
    l.quiz.forEach((q, qi) => {
      const picked = state.picks[id][qi];
      document.querySelectorAll(`.opt[data-qi="${qi}"]`).forEach(o => {
        o.classList.remove("good","bad");
        if (Number(o.dataset.oi) === q.a) o.classList.add("good");
        else if (Number(o.dataset.oi) === picked) o.classList.add("bad");
      });
      if (picked === q.a) right++;
    });
    document.getElementById("feedback").textContent = right === l.quiz.length
      ? "All correct. The chain matters more than the score."
      : `${right} of ${l.quiz.length}. The gold-marked line is the intended answer.`;
  };
  document.getElementById("complete").onclick = () => {
    state.done[l.id] = true; save();
    document.getElementById("complete").textContent = "Completed";
  };
}

function renderLab() {
  document.getElementById("view-lab").innerHTML = `
    <p class="kicker">Practice calculator</p>
    <h2 style="margin-top:0">Chart lab</h2>
    <p class="lede">Same rules as the lessons. Month, day, and year reduce separately. 11 and 22 are kept. Y counts as a vowel.</p>
    <div class="card">
      <label>Birth day</label><input id="day" inputmode="numeric" placeholder="15">
      <label>Birth month</label><input id="month" inputmode="numeric" placeholder="3">
      <label>Birth year</label><input id="year" inputmode="numeric" placeholder="1984">
      <label>Full birth name</label><input id="name" placeholder="Ann Lee">
      <label>Calendar year, for Personal Year</label><input id="cy" inputmode="numeric" placeholder="2026">
      <div class="actions"><button class="btn" id="calc" type="button">Calculate</button></div>
      <div id="out"></div>
    </div>
    <div class="card">
      <p class="kicker">Letter chart</p>
      <p class="note">1 A J S · 2 B K T · 3 C L U · 4 D M V · 5 E N W · 6 F O X · 7 G P Y · 8 H Q Z · 9 I R</p>
    </div>`;
  document.getElementById("calc").onclick = () => {
    const day = Number(document.getElementById("day").value);
    const month = Number(document.getElementById("month").value);
    const year = Number(document.getElementById("year").value);
    const name = document.getElementById("name").value.trim();
    const cy = Number(document.getElementById("cy").value);
    const bits = [];
    if (day && month && year) {
      const lp = lifePath(day, month, year);
      bits.push(`<p>Life Path chain: month ${lp.m} + day ${lp.d} + year ${lp.y} = ${lp.sum} → <strong>${lp.final}</strong></p>`);
      bits.push(`<p>Birthday number: <strong>${reduceNum(day)}</strong></p>`);
      if (cy) {
        const pyr = reduceNum(String(cy).split("").reduce((s,c)=>s+Number(c),0));
        const py = reduceNum(lp.m + lp.d + pyr);
        bits.push(`<p>Personal Year ${cy}: month ${lp.m} + day ${lp.d} + year ${pyr} → <strong>${py}</strong></p>`);
      }
    }
    if (name) {
      const s = letterSum(name);
      const exp = reduceNum(s.all);
      const soul = reduceNum(s.vowels);
      const per = reduceNum(s.cons);
      bits.push(`<p>Expression (all letters ${s.all}) → <strong>${exp}</strong></p>`);
      bits.push(`<p>Soul Urge (vowels ${s.vowels}) → <strong>${soul}</strong></p>`);
      bits.push(`<p>Personality (consonants ${s.cons}) → <strong>${per}</strong></p>`);
      if (day && month && year) {
        const lp = lifePath(day, month, year);
        bits.push(`<p>Maturity (Life Path + Expression) → <strong>${reduceNum(lp.final + exp)}</strong></p>`);
      }
    }
    const headline = bits.length ? "Chart" : "Add a date or a name";
    document.getElementById("out").innerHTML = `<div class="result"><p class="big">${headline}</p>${bits.join("") || "<p class='note'>Nothing to calculate yet.</p>"}</div>`;
  };
}

function renderNumbers() {
  const cards = Object.entries(MEANINGS).map(([n, [t, d]]) => `
    <div class="card mean-card"><h3>${n} · ${t}</h3><p>${d}</p></div>`).join("");
  document.getElementById("view-numbers").innerHTML = `
    <p class="kicker">Reference</p>
    <h2 style="margin-top:0">The alphabet</h2>
    <p class="lede">One strength, one shadow. 33 is named in the lessons as rare and not required.</p>
    ${cards}`;
}

document.getElementById("tab-home").onclick = () => show("home");
document.getElementById("tab-lab").onclick = () => show("lab");
document.getElementById("tab-numbers").onclick = () => show("numbers");
show("home");
</script>
