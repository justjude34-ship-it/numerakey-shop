      '<div style="position:absolute;right:1rem;top:max(1rem,env(safe-area-inset-top));z-index:2"><button class="exit" type="button" data-act="exit">' + ICON.exit + ' Exit</button></div>' +

  function topbar(title, sub) {
    return '<header class="top"><div class="wrap" style="display:flex;align-items:center;justify-content:space-between;gap:.75rem"><div><p class="display" style="margin:0;font-size:1.35rem;line-height:1">' + esc(title) + '</p>' +
      (sub ? '<p class="kicker" style="margin:.28rem 0 0;color:var(--mute)">' + sub + '</p>' : '') +
      '</div><button class="exit" type="button" data-act="exit">' + ICON.exit + ' Exit</button></div></header>';
  }
  function nav() {
    var items = [["home", "Home", "home"], ["aria", "Aria", "chat"], ["journal", "Journal", "pen"], ["toolkit", "Tools", "flower"], ["more", "More", "more"]];
    var moreOn = ["more", "learn", "help", "children", "esteem", "sleep"].indexOf(ui.screen) >= 0;
    return '<nav class="nav" aria-label="Primary"><ul>' + items.map(function (it) {
      var on = it[0] === "more" ? moreOn : ui.screen === it[0];
      return '<li style="flex:1;display:flex"><button type="button" data-act="go" data-screen="' + it[0] + '" class="' + (on ? "on-" + it[0] : "") + '">' + ICON[it[2]] + it[1] + '</button></li>';
    }).join("") + "</ul></nav>";
  }
  function shell(inner) { return topbar(titleFor(), ui.screen === "home" ? "Private · local only" : "") + '<main class="main"><div class="wrap stack">' + inner + '</div></main>' + nav(); }
  function titleFor() {
    return { aria: "Aria", journal: "Journal", toolkit: "Toolkit", learn: "Learn", help: "Help", more: "More", children: "Children", esteem: "Self-esteem", sleep: "Sleep & Calm" }[ui.screen] || "My Sanctuary";
  }
  function home() {
    var mood = todayMood();
    var latest = !S.pinHash || S.sessionPin ? S.journal[0] : null;
    var moods = '<div class="grid-3">' + MOODS.map(function (m) {
      return '<button type="button" class="mood ' + m[3] + (mood === m[0] ? " on" : "") + '" data-act="mood" data-id="' + m[0] + '"><span style="display:block;width:10px;height:10px;border-radius:50%;background:var(--ink);opacity:.55;margin-bottom:.35rem"></span><strong style="display:block;font-size:.9rem">' + m[1] + '</strong><span class="note">' + m[2] + '</span></button>';
    }).join("") + "</div>";
    return '<section class="card" style="padding:1rem;position:relative;overflow:hidden"><div style="display:flex;gap:.8rem"><span class="orb live"></span><div><p class="kicker" style="color:var(--teal-deep);margin:0">Aria is here</p><p class="display" style="margin:.25rem 0 0;font-size:1.35rem;line-height:1.2">You do not have to tidy the story first.</p><p style="margin:.4rem 0 0;color:var(--soft)">A private companion for the days you cannot leave. Short, steady, and only in this file.</p></div></div><div class="grid-2" style="margin-top:.9rem"><button class="btn" type="button" data-act="go" data-screen="aria">Talk with Aria</button><button class="btn peach" type="button" data-act="tool" data-id="box">' + ICON.wind + ' Box breathe</button></div></section>' +
      '<section class="card" style="padding:1rem"><h2 class="display" style="margin:0;font-size:1.2rem">How are you landing?</h2><p class="note" style="margin:.15rem 0 .7rem">A private check-in. Nothing is sent.</p>' + moods + '</section>' +
      '<section class="grid-3"><button class="row" style="display:block;background:#d5f3ef" data-act="go" data-screen="children">' + ICON.baby + '<strong style="display:block;margin-top:.45rem">Children</strong><span class="note">Stay steady</span></button><button class="row" style="display:block;background:#f8d4e0" data-act="go" data-screen="esteem">' + ICON.heart + '<strong style="display:block;margin-top:.45rem">Esteem</strong><span class="note">Rebuild</span></button><button class="row" style="display:block;background:#eadcf6" data-act="go" data-screen="sleep">' + ICON.moon + '<strong style="display:block;margin-top:.45rem">Sleep</strong><span class="note">Calm sound</span></button></section>' +
      '<section class="card" style="display:grid;grid-template-columns:1fr 5.6rem;overflow:hidden;padding:0"><div style="padding:1rem"><p class="kicker" style="color:var(--peach-deep);margin:0">From the room</p><p class="display" style="margin:.3rem 0 0;font-size:1.15rem">You are welcome exactly as you are.</p><p class="note" style="margin:.35rem 0 0">Light, colour, and a door that stays open — even when the one behind you cannot.</p></div><div class="sunpane"></div></section>' +
      (latest ? '<button class="row card" type="button" data-act="go" data-screen="journal" style="background:var(--paper)"><span style="width:10px;height:10px;border-radius:50%;background:var(--blush);flex:none"></span><span><span class="note">' + esc(stamp(latest.createdAt)) + '</span><span style="display:block">' + esc(latest.body.slice(0, 140)) + '</span></span></button>'
        : '<button class="row card" type="button" data-act="go" data-screen="journal" style="background:var(--paper)">' + ICON.pen + '<span><strong class="display" style="display:block;font-size:1.15rem">Write what happened</strong><span class="note">A private record. Optional PIN.</span></span></button>');
  }
  function aria() {
    var empty = S.messages.length === 0 && !ui.pending;
    var thread = empty
      ? '<div style="text-align:center;padding:1.2rem .4rem 0"><div class="orb lg live" style="margin:0 auto"></div><h2 class="display" style="margin:.8rem 0 0">This room is only yours.</h2><p style="color:var(--soft)">Say what is true, even if it is messy. I will not push you toward a door you cannot use. Aria answers from this file — not from a server.</p><div class="stack" style="margin-top:1rem">' + STARTERS.map(function (s) {
          return '<button type="button" class="row ' + s[1] + '" data-act="starter" data-text="' + esc(s[0]) + '" style="font-weight:650">' + esc(s[0]) + '</button>';
        }).join("") + '</div></div>'
      : S.messages.map(function (m) {
          return '<div class="bubble ' + (m.role === "you" ? "you" : "aria") + '">' + esc(m.text) + '</div>';
        }).join("") + (ui.pending ? '<div class="bubble aria" style="color:var(--mute)">Aria is with you…</div>' : '');
    return '<div style="display:flex;flex-direction:column;gap:.7rem;min-height:calc(100dvh - 11.5rem)">' +
      '<div class="card" style="display:flex;gap:.7rem;align-items:center;padding:.7rem .85rem"><span class="orb sm live"></span><div><strong class="display">Aria</strong><div class="note">Private companion · stays in this file</div></div></div>' +
      '<div id="thread" style="display:flex;flex-direction:column;gap:.6rem;flex:1">' + thread + '</div>' +
      '<form class="card composer" data-act="send"><button class="iconbtn' + (ui.listening ? " hot" : "") + '" type="button" data-act="mic" aria-label="Speak">' + (ui.listening ? ICON.stop : ICON.mic) + '</button>' +
      '<textarea id="cdraft" rows="1" placeholder="Write to Aria" style="min-height:44px;padding:.55rem 0"></textarea>' +
      '<button class="iconbtn go" type="submit" aria-label="Send">' + ICON.send + '</button></form></div>';
  }
  function pinPad() {
    var keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "⌫", "0", "OK"];
    var dots = "";
    for (var i = 0; i < 4; i++) dots += '<i class="' + (i < ui.pinBuf.length ? "on" : "") + '"></i>';
    return '<div class="dots" aria-hidden="true">' + dots + '</div><p class="err">' + (ui.pinError ? "That PIN does not match." : ui.busy ? "One moment…" : "") + '</p><div class="pad">' +
      keys.map(function (k) { return '<button type="button" data-act="digit" data-key="' + esc(k) + '">' + esc(k) + '</button>'; }).join("") + '</div>';
  }
  function journal() {
    if (S.pinHash && !S.sessionPin) {
      ui.pinMode = "unlock";
      return '<section class="card" style="padding:1.1rem;text-align:center">' + ICON.lock + '<h2 class="display">Journal is locked</h2><p class="note">Enter your PIN. Entries stay encrypted in this browser.</p>' + pinPad() + '</section>';
    }
    var tags = TAGS.map(function (t) {
      var on = ui.jTags.indexOf(t[0]) >= 0;
      return '<button type="button" class="tag' + (on ? " on" : "") + '" data-act="tag" data-id="' + t[0] + '">' + t[1] + '</button>';
    }).join("");
    var list = S.journal.length ? S.journal.map(function (e) {
      return '<article class="card" style="padding:.9rem 1rem"><div style="display:flex;justify-content:space-between;gap:.5rem"><span class="note">' + esc(stamp(e.createdAt)) + '</span><button type="button" class="back" data-act="del" data-id="' + esc(e.id) + '" aria-label="Delete">' + ICON.trash + '</button></div><p style="margin:.35rem 0">' + esc(e.body) + '</p><div style="display:flex;flex-wrap:wrap;gap:.3rem">' + (e.tags || []).map(function (id) { return '<span class="chip">' + esc(tagName(id)) + '</span>'; }).join("") + '</div></article>';
    }).join("") : '<p class="note">Nothing written yet. A fact is enough. You do not have to decide what it means.</p>';
    return '<section class="card" style="padding:.9rem"><p class="note" style="margin:0 0 .4rem">What happened, in plain words.</p><textarea id="jbody" placeholder="They said it never happened. I remember the cup on the table.">' + esc(ui.jDraft || "") + '</textarea><div style="display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 .7rem">' + tags + '</div><button class="btn wide" type="button" data-act="save-journal">' + (ui.busy ? "Saving…" : "Keep this entry") + '</button></section>' +
      (S.pinHash ? '<button class="btn line wide" type="button" data-act="lock">' + ICON.lock + ' Lock journal</button>' : '') + list;
  }
  function toolBody(tool) {
    if (tool[0] === "box") {
      return '<p style="color:var(--soft)">Use when they have pushed you to the edge. You are not trying to feel peaceful. You are giving your body a pattern so the next minute does not run away.</p><div class="breath"><span id="breath-label" class="display" style="font-size:1.8rem">In</span></div><p id="breath-round" class="note" style="text-align:center">Four seconds each side. Round 1 of 4.</p>';
    }
    if (STEPS[tool[0]]) {
      var pack = STEPS[tool[0]];
      return '<p style="color:var(--soft)">' + esc(pack[0]) + '</p><ol class="list" style="padding:0;margin:0;list-style:none">' + pack[1].map(function (s, i) {
        return '<li class="step"><strong>' + (i + 1) + '.</strong> ' + esc(s) + '</li>';
      }).join("") + '</ol>';
    }

        ui.taps = 0;
        if (S.pinHash && !S.sessionPin) { ui.pinMode = "decoy"; ui.pinBuf = ""; render(); }
        else { ui.decoy = false; ui.pinMode = null; render(); }
      }
    }
    else if (act === "leave") {
      try { window.top.location.replace("https://www.bbc.com/weather"); }
      catch (err) { window.location.href = "https://www.bbc.com/weather"; }
    }
  });
  document.addEventListener("submit", function (e) {
    var form = e.target;
    if (!form || form.dataset.act !== "send") return;
    e.preventDefault();
    var area = document.getElementById("cdraft");
    send(area ? area.value : "");
  });
  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "vol") {
      ui.volume = Number(e.target.value);
      if (sleepHandle) {
        var now = sleepHandle.ctx.currentTime;
        sleepHandle.master.gain.cancelScheduledValues(now);
        sleepHandle.master.gain.linearRampToValueAtTime(ui.volume, now + 0.1);
      }
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "cdraft" && !e.shiftKey) {
      e.preventDefault();
      send(e.target.value);
    }
  });
  async function saveJournal() {
    snapshot();
    var body = (ui.jDraft || "").trim();
    if (!body) return;
    ui.busy = true; render();
    S.journal.unshift({ id: uid(), createdAt: Date.now(), body: body, tags: ui.jTags.slice() });
    ui.jDraft = ""; ui.jTags = [];
    await seal();
    ui.busy = false;
    persist();
    render();
  }
  async function saveLedger() {
    snapshot();
    var left = (ui.ledL || "").trim();
    var right = (ui.ledR || "").trim();
    if (!left && !right) return;
    if (S.pinHash && !S.sessionPin) { ui.screen = "journal"; ui.notice = ""; render(); return; }
    var body = "What happened: " + (left || "—") + "\nWhat was said: " + (right || "—");
    S.journal.unshift({ id: uid(), createdAt: Date.now(), body: body, tags: ["other"] });
    ui.ledL = ""; ui.ledR = "";
    await seal();
    persist();
    ui.screen = "journal";
    ui.tool = null;
    render();
  }
  function toggleMic() {
    var Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Ctor) { ui.notice = "Voice typing is not available in this browser. You can still write."; ui.screen = ui.screen; render(); return; }
    if (ui.listening && rec) { rec.stop(); ui.listening = false; render(); return; }
    rec = new Ctor();
    rec.lang = "en-AU";
    rec.continuous = false;
    rec.interimResults = false;
    rec.onresult = function (ev) {
      var said = ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : "";
      var area = document.getElementById("cdraft");
      if (area && said) area.value = area.value ? area.value + " " + said : said;
    };
    rec.onend = function () { ui.listening = false; render(); };
    rec.onerror = function () { ui.listening = false; };
    ui.listening = true;
    try { rec.start(); } catch (err) { ui.listening = false; }
    render();
  }
  render();
})();
</script>
</body>
</html>
