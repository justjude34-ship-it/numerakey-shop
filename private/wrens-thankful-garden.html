<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wren’s Thankful Garden</title>
<meta name="description" content="A storybook gratitude journal for children. Tap a thank-you, plant a flower, and watch your garden grow.">
<meta name="theme-color" content="#ffe3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thankful Garden">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffe3ee'/%3E%3Cpath d='M32 52V30' stroke='%235fbf88' stroke-width='4'/%3E%3Cg fill='%23ff7fa8'%3E%3Ccircle cx='32' cy='18' r='8'/%3E%3Ccircle cx='22' cy='25' r='8'/%3E%3Ccircle cx='42' cy='25' r='8'/%3E%3Ccircle cx='26' cy='34' r='8'/%3E%3Ccircle cx='38' cy='34' r='8'/%3E%3C/g%3E%3Ccircle cx='32' cy='27' r='6' fill='%23ffe27a'/%3E%3C/svg%3E">
<style>
:root{--ink:#4b2e5e;--muted:#7a6488;--rose:#ff7fa8;--rose2:#ffd9e6;--lilac:#b79cf5;--lilac2:#ece4ff;--mint:#7fd4b8;--mint2:#dcf6ec;--peach:#ffb88a;--peach2:#ffe8d6;--sun:#ffd36b;--line:#f4c6d8;--serif:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;--sans:'Avenir Next','Nunito','Trebuchet MS',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background:#fff3f6 linear-gradient(180deg,#ffe3ee 0,#fff3f6 280px,#fff8ee 100%) fixed;font:18px/1.55 var(--sans);min-height:100vh}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .4em;color:var(--ink)}
h1{font-size:1.8rem}h2{font-size:1.4rem}h3{font-size:1.1rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.wrap{max-width:620px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
#main{outline:none}
.view>*+*{margin-top:14px}
.card{background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 6px 18px rgba(255,127,168,.12)}
.btn{min-height:54px;padding:12px 24px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--ink);font:700 1.05rem var(--sans);cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ff9fbf,var(--rose));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(255,127,168,.4)}
.btn.lilac{background:linear-gradient(180deg,#cdb9ff,var(--lilac));border-color:transparent;color:#fff}
.btn.mint{background:linear-gradient(180deg,#a5ebd3,var(--mint));border-color:transparent;color:#124a39}
.btn.wide{width:100%}
.btn.small{min-height:46px;padding:8px 18px;font-size:.95rem}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;color:#8b5fd6;font:600 1rem var(--sans);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 6px}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:#f0dbe5}
.dot.done{background:var(--mint)}.dot.cur{background:var(--rose);transform:scale(1.35)}
.kick{margin:0 0 4px;color:#8b5fd6;font:700 .82rem var(--sans);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.kick::before,.kick::after{content:" ✿ ";color:var(--rose)}
.pic{margin:0;position:relative;border-radius:24px;overflow:hidden;border:3px solid #fff;box-shadow:0 0 0 2px var(--line),0 10px 26px rgba(255,127,168,.22);background:#cfe9ff;user-select:none;-webkit-user-select:none}
.sc{display:block;width:100%;height:auto;transition:filter .7s}
.sc.m0{filter:grayscale(.95) brightness(.84)}
.sc.m1{filter:none}.sc.m2{filter:saturate(1.15)}
.sc .bud,.sc .cloudg,.sc .extra,.sc .raind{transition:opacity .7s}
.sc .bud{opacity:0}.sc.m0 .bud{opacity:1}.sc.m0 .open{opacity:0}.sc .open{transition:opacity .7s}
.sc .cloudg{opacity:0}.sc.m0 .cloudg{opacity:1}
.sc .raind{opacity:0}.sc.m0 .raind{opacity:1}
.sc .extra{opacity:0}.sc.m2 .extra{opacity:1}
.sc .wrenG{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s}
.sc.m0 .wrenG{transform:translateY(8px) rotate(-7deg) scale(.96)}
.sc.m2 .wrenG{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.float{animation:flt 3.4s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.words{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:2px 0}
.wd{padding:5px 14px;border-radius:999px;font-weight:700;font-size:.95rem;background:var(--lilac2);color:#5a3f9a}
.wd.good{background:var(--mint2);color:#17604a}
.wd.low{background:#e8e5ee;color:#5d566a}
.page{background:#fff;border:2px solid var(--line);border-radius:12px 24px 24px 12px;padding:16px 18px 16px 22px;font:1.12rem/1.65 var(--serif);position:relative;box-shadow:0 6px 18px rgba(255,127,168,.12)}
.page::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:5px;border-radius:3px;background:linear-gradient(180deg,var(--rose),var(--lilac))}
.page .w{border-radius:6px;padding:0 1px;cursor:pointer;transition:background .15s}
.page .w.on{background:var(--rose2)}
.sp{position:absolute;pointer-events:none;line-height:1;z-index:6;animation:spk 1.1s ease-out forwards}
@keyframes spk{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(120deg)}}
.say{position:absolute;z-index:7;pointer-events:none;background:#fff;color:var(--ink);font:700 .92rem/1.25 var(--sans);padding:7px 13px;border-radius:16px;transform:translate(-50%,-125%);max-width:75%;text-align:center;animation:sayin 2.6s ease forwards;box-shadow:0 4px 14px rgba(75,46,94,.25)}
@keyframes sayin{0%{opacity:0;transform:translate(-50%,-85%) scale(.6)}10%{opacity:1;transform:translate(-50%,-125%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%)}}
.big{width:100%;min-height:84px;border-radius:999px;border:0;background:linear-gradient(180deg,#ff9fbf,var(--rose));color:#fff;font:700 1.35rem var(--serif);cursor:pointer;touch-action:manipulation;box-shadow:0 8px 20px rgba(255,127,168,.45);display:flex;align-items:center;justify-content:center;gap:10px}
.big:active{transform:scale(.97)}
.counter{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.jar{display:flex;gap:10px;justify-content:center}
.jar i{font-style:normal;font-size:2.2rem;filter:grayscale(1) opacity(.35);transition:.4s}
.jar i.on{filter:none;transform:scale(1.15) rotate(10deg)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{border:2px solid var(--line);background:#fff;border-radius:18px;padding:8px 2px;font:700 .72rem var(--sans);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:72px;touch-action:manipulation}
.face span{font-size:1.9rem;line-height:1}
.face.on{border-color:var(--rose);background:var(--rose2)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:0 0 auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:700 .9rem var(--sans);color:var(--ink);cursor:pointer;min-height:44px}
.tab.on{background:var(--lilac);border-color:var(--lilac);color:#fff}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:18px;padding:8px 12px;font:700 .95rem/1.2 var(--sans);color:var(--ink);cursor:pointer;min-height:58px;touch-action:manipulation}
.chip:active{transform:scale(.97);background:var(--rose2)}
.chip b{font-size:1.7rem;line-height:1;font-weight:400}
.field{width:100%;min-height:52px;padding:12px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);font:inherit}
.lab{display:block;font-weight:700;margin:10px 0 6px}
.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fr{border:2px solid var(--line);border-radius:18px;background:#fff;text-align:center;padding:10px 4px 8px;min-height:104px}
.fr b{display:block;font-size:2.2rem;line-height:1.1;font-weight:400}
.fr span{font:700 .78rem/1.2 var(--sans);display:block}
.fr.lock{background:#f7f2f5;color:#a99bb3}
.fr.lock b{filter:grayscale(1) opacity(.45)}
.fr.new{border-color:var(--rose);animation:pop .8s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.5) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font:700 1.7rem var(--serif);color:var(--rose)}
.stats span{font-size:.82rem;color:var(--muted)}
.day{border:2px solid var(--line);border-radius:20px;background:#fff;padding:12px 14px}
.day h3{margin:0 0 6px;font-size:1rem}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--rose2);border-radius:999px;padding:3px 12px 3px 8px;margin:0 6px 6px 0;font-weight:700;font-size:.9rem}
.day img{width:100%;border-radius:14px;border:2px solid var(--line);display:block;margin-top:6px}
details{border:2px solid var(--line);border-radius:16px;background:#fff;padding:0 14px}
details+details{margin-top:8px}
summary{min-height:50px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details ul{margin:0 0 12px;padding-left:20px}
details li{margin-bottom:6px}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:48px;background:none;border:0;font:600 1rem var(--sans);color:var(--ink);cursor:pointer;padding:0}
.switch i{width:50px;height:30px;border-radius:999px;background:#e1d3df;position:relative;transition:background .2s;flex:0 0 auto}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-pressed=true] i{background:var(--mint)}
.switch[aria-pressed=true] i::after{transform:translateX(20px)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:#fff;border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbtn{flex:1;max-width:130px;white-space:nowrap;padding:0 2px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;color:var(--muted);font:700 .66rem var(--sans);cursor:pointer;touch-action:manipulation}
.tabbtn span{font-size:1.35rem;line-height:1}
.tabbtn[aria-current=page]{color:#8b5fd6;background:var(--lilac2)}
.sheetbg{position:fixed;inset:0;background:rgba(75,46,94,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff8fb;border:2px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;max-width:620px;width:100%;max-height:92vh;overflow:auto;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.sheet>*+*{margin-top:12px}
@media(min-width:640px){.sheetbg{align-items:center}.sheet{border-radius:26px;border-bottom:2px solid var(--line)}}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 12px 10px 18px;border-radius:999px;font-weight:600;font-size:.95rem;z-index:60;display:none;max-width:92vw;align-items:center;gap:10px}
#toast button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:6px 14px;font:700 .9rem var(--sans);cursor:pointer;min-height:36px}
canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:none;background:#fffdf8;border-radius:16px;border:2px solid var(--line);cursor:crosshair}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.credit{text-align:center;color:var(--muted);font-size:.85rem;margin-top:22px}
.credit svg{vertical-align:-2px;margin-left:4px}
.fall{position:absolute;top:-30px;z-index:8;pointer-events:none;animation:fall 2.8s linear forwards;font-size:22px}
@keyframes fall{to{transform:translateY(520px) rotate(360deg);opacity:0}}
.newfl{animation:grow .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes grow{0%{opacity:0}100%{opacity:1}}
.flipc{border:2px solid var(--line);border-radius:20px;background:#fff;min-height:112px;padding:12px;text-align:center;cursor:pointer;font:inherit;color:inherit;width:100%;touch-action:manipulation;transition:background .3s}
.flipc b{display:block;font-size:2.2rem;line-height:1.1;font-weight:400}
.flipc.on{background:var(--mint2);border-color:var(--mint)}
.flipc span{font:700 .95rem/1.3 var(--sans);display:block}
.flipc small{display:block;font:600 .88rem/1.35 var(--sans);color:#17604a;margin-top:2px}
.hbar{height:26px;border-radius:999px;background:#f0e4ea;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ff9fbf,var(--rose));transition:width .7s ease,background .7s}
.hbar.low i{background:linear-gradient(90deg,#c9c3d3,#a9a2b8)}
.look{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;font:700 1rem var(--sans);color:var(--ink);cursor:pointer;min-height:52px;margin-top:8px}
.look.on{background:var(--mint2);border-color:var(--mint)}
.look b{font-weight:400;font-size:1.5rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.view>.pic{margin-left:-14px;margin-right:-14px;border-radius:0;border-left:0;border-right:0}
.sc .r1,.sc .r2,.sc .r3,.sc .x{opacity:0;transition:opacity .8s}
.sc.p1 .r1,.sc.p2 .r1,.sc.p2 .r2,.sc.p3 .r1,.sc.p3 .r2,.sc.p3 .r3{opacity:1}
.sc .brightsky{opacity:0;transition:opacity 1s}.sc.p3 .brightsky{opacity:1}
.sc .drift{animation:drf 14s ease-in-out infinite alternate}@keyframes drf{from{transform:translateX(-12px)}to{transform:translateX(14px)}}
.sc .tw{animation:twk 2.4s ease-in-out infinite}@keyframes twk{0%,100%{opacity:.35}50%{opacity:1}}
.sc .ff{animation:twk 2s ease-in-out infinite}
.sc .dr{animation:rn 1s linear infinite}@keyframes rn{from{transform:translateY(-30px);opacity:0}30%{opacity:1}to{transform:translateY(500px);opacity:.2}}
.sc.p3 .rainl{opacity:0}.sc .rainl{transition:opacity 1.2s}
.sc .rip{animation:rp 2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes rp{from{transform:scale(.4);opacity:1}to{transform:scale(1.3);opacity:0}}
.sc .smoke{animation:smk 4s ease-in-out infinite}@keyframes smk{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.sc.p3 .moonwrap{filter:drop-shadow(0 0 16px #fff3d6)}
.scard{display:block;width:100%;text-align:left;padding:0;border:2px solid var(--line);background:#fff;border-radius:24px;overflow:hidden;cursor:pointer;box-shadow:0 6px 18px rgba(255,127,168,.14);font:inherit;color:inherit;touch-action:manipulation}
.scard:active{transform:scale(.985)}
.scard .thumb{height:170px;overflow:hidden;position:relative;pointer-events:none}.scard .thumb .sc{margin-top:-215px;filter:none}
.scard .sbody{padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px}.scard .sbody b{font:700 1.15rem var(--serif);color:var(--ink)}
.scard .tag{font-weight:700;font-size:.82rem;color:#8b5fd6}.scard .tag.ok{color:#17604a}
.scard.lock .thumb{filter:grayscale(.6) brightness(.95)}
.chip.on{background:#dcf6ec;border-color:#7fd4b8}
.art{display:block;width:100%;height:auto}
.pic.stick{position:sticky;top:0;z-index:6;box-shadow:0 8px 22px rgba(75,46,94,.18)}.pic.stick .sc,.pic.stick .art{height:min(38vh,310px);width:100%;object-fit:cover;object-position:50% 100%}
</style>
</head>

{id:'grey',e:'🌫️',t:'Wren and the Grey Day',b:'Wren wishes for a bigger garden… until she tries the thank-you glasses.',sc:'garden',

 {k:'Chapter 1',t:'Wren woke up in her little garden. The sun was shining, but Wren had a funny little thought. “Other gardens are bigger,” she sighed. “Other gardens are fancier. Mine is just small.”',m:1},
 {k:'Looking over the hedge',t:'So Wren peeked over the hedge at all the things she didn’t have. “I wish I had that. And that. And THAT!” The more she looked at what she didn’t have, the smaller and greyer her garden seemed. Her flowers closed up tight, and her tummy felt heavy.',m:1,act:'lack'},
 {k:'A buzzy visitor',t:'Then Bee came buzzing by. “Wren, try my thank-you glasses! Look for things you DO have.” Wren put them on. Can you help her find three?',m:0,act:'tap3',head:'Tap three things Wren has 👇',items:[['☀️','Warm sun on my feathers','Oh, I do have sunshine!'],['🐌','A slow, silly snail friend','And a snail friend!'],['🌼','My very own flowers','And my own flowers!']]},
 {k:'Thank-you glasses',t:'Wren found the warm sunshine. She found a slow, silly snail. She found her very own flowers. And the more she noticed, the MORE she saw! Her garden felt big, and warm, and full.',m:2,act:'lens'},
 {k:'A little secret',t:'Here is a secret. Wren’s garden never changed. Only the way Wren looked at it. And you can do it too, every day. Ready to plant your own thank-yous?',m:2}]},

 end:'Little thank-yous add up to something sweet.',
 pages:[
 {k:'Chapter 1',t:'Bee lived in a hive by the old apple tree, and Bee had a very important job. Every morning she made thank-you honey. “Oh, it only works with REAL thank-yous,” she told Wren. “Each one makes a golden drop.”',m:1},
 {k:'Three empty jars',t:'Wren looked at the shelf. Three little jars, all empty. “Then let’s fill them!” she said. “What is there to be thankful for in a meadow?” Help Wren fill the jars.',m:1,act:'tap3',head:'Tap a thank-you for each jar 👇',items:[['🌼','The flowers that give us nectar','Drip! One golden drop.'],['☀️','The warm, sunny morning','Drip, drip! A little more.'],['🤝','Friends who help each other','Glug! The jar is full!']]},
 {k:'Sticky and golden',t:'Soon every jar glowed like sunshine. Bee did a wiggly dance. “See? When you look for good things, there are always more to find. My honey never runs out!”',m:2},
 {k:'A sweet idea',t:'“Neither do thank-yous,” said Wren. “You can make them anywhere. Even without a hive.” And Bee gave her one tiny jar to take home, for her own thank-yous.',m:2}]},
{id:'snail',e:'🐌',t:'The Snail Who Felt Slow',b:'Everyone is zooming past. Is slow really so bad?',sc:'path',
 end:'Slow is not a problem. Slow is a way to notice more.',
 pages:[
 {k:'Chapter 1',t:'Snail was the slowest creature on the garden path. Butterflies zoomed. Ladybirds zipped. Even the worms wriggled past. “I am so slow,” Snail sighed. “I wish I was fast like everyone else.”',m:1},
 {k:'The slow things',t:'Wren sat down next to Snail. “Slow can be wonderful. Let’s look for what slow gives you.” Snail thought hard. Can you help Snail find three good things about going slowly?',m:1,act:'tap3',head:'Tap three good things about slow 👇',items:[['🔍','I notice tiny things nobody else sees','Ooh! Tiny things are everywhere!'],['🏠','I carry my cosy home everywhere','And I am never lost!'],['✨','I leave a sparkly trail behind me','Look how it shines!']]},
 {k:'Sunrise on the path',t:'And do you know what Snail saw, because she was slow? She saw the sunrise paint the whole sky pink. The fast ones had missed it. “Oh,” said Snail. “I wouldn’t swap this for anything.”',m:2},
 {k:'The best view',t:'Snail smiled all the way to the flag. It took a very long time, and it was the best trip she ever had. Sometimes the thing we wish was different is the thing we can be thankful for.',m:2}]},
{id:'rain',e:'🌧️',t:'The Rainy Day Rainbow',b:'Duck is grumpy about the rain. Wren knows a trick for that.',sc:'rain',
 end:'The rain wasn’t the problem. Only looking for the bad was.',
 pages:[
 {k:'Chapter 1',t:'Pitter patter, pitter patter. It was raining again, and Duck was grumpy. “Rain, rain, rain. I wanted to play outside. This is the WORST day.” Wren held a big leaf over their heads and smiled.',m:1},
 {k:'Wren’s trick',t:'“Duck, can you find three good things about rainy days?” “None,” said Duck. “Not a one.” “Let’s look anyway,” said Wren. “Maybe the good things are hiding.” Help them find some.',m:1,act:'tap3',head:'Tap three good things about rain 👇',items:[['💦','Splashy, splashy puddles','Splash! Duck laughed.'],['🌱','The rain feeds the flowers','Oh! That is why they grow!'],['🧣','Cosy blankets and hot chocolate','Mmm, cosy!']]},
 {k:'Splash!',t:'Duck jumped in a puddle. SPLASH! Then another. Wren laughed so hard her leaf nearly blew away. “You know,” quacked Duck, “this isn’t the worst day at all.”',m:2},
 {k:'Look up!',t:'Then the clouds went soft and the sun peeped out. And there, over the whole garden, was a great big rainbow. “We would have missed it,” said Wren, “if we had stayed grumpy about the rain.”',m:2}]},

 {k:'Get close!',t:'They crouched down low in the long grass. Everything looked different up close. Ladybird whispered, “Look carefully. Tap what you find!”',m:1,act:'tap3',head:'Tap three tiny wonders 👇',items:[['🕸️','A spider web covered in dew','WOW! Like tiny diamonds!'],['🐞','A ladybird with seven spots','WOW! Seven exactly!'],['🌸','A teeny blue flower','WOW! So small and so perfect!']]},
 {k:'Wow, wow, wow',t:'“Wow!” said Wren, and Wow was catching. The more she looked, the more there was! A snail trail. A shiny pebble. A tiny green caterpillar. “I was bored,” said Wren, “and the whole time, this was right here.”',m:2},
 {k:'Eyes wide open',t:'“That is what gratitude does,” said Ladybird. “It makes you notice. And when you notice, you feel rich, even with an empty pocket.” Wren took Ladybird’s tip home: say WOW at one tiny thing every day.',m:2}]},
