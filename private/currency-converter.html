<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Currency Converter</title>
<link rel="manifest" id="manifest">
<style>
:root{
  --bg:#000;--card:#0b0b12;--card2:#12121c;--line:#23233a;
  --text:#eceaf5;--muted:#8d8aa6;
  --teal:#14d3c0;--purple:#8b5cf6;--magenta:#e63cb4;
  --grad:linear-gradient(90deg,var(--teal),var(--purple),var(--magenta));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{padding:16px 0 18px}
.hero{display:block;width:100%;height:auto;border-radius:18px;border:1px solid var(--line);box-shadow:0 10px 40px rgba(139,92,246,.18)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{margin:0;font-size:2rem;letter-spacing:.5px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:.92rem;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 40px rgba(139,92,246,.07)}
label{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:0 0 8px}
.row{display:flex;gap:10px}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:14px;font-size:1.05rem;outline:none;transition:border-color .2s,box-shadow .2s;appearance:none;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.amount{font-size:1.6rem;font-weight:600}
.field{margin-bottom:16px}
.swapwrap{display:flex;align-items:center;gap:10px;margin:2px 0 16px}
.swapwrap hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.swap{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;background:var(--grad);display:grid;place-items:center;transition:transform .35s}
.swap:active{transform:rotate(180deg) scale(.94)}
.swap svg{width:22px;height:22px}
.result{margin-top:6px;padding:20px;border-radius:14px;background:linear-gradient(135deg,rgba(20,211,192,.08),rgba(139,92,246,.1),rgba(230,60,180,.08));border:1px solid var(--line);text-align:center}
.result .from{color:var(--muted);font-size:.95rem}
.result .to{font-size:2.3rem;font-weight:700;margin:6px 0;word-break:break-all;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.result .rate{color:var(--muted);font-size:.85rem}
.status{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.78rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--teal)}
.dot.off{background:var(--magenta)}
.refresh{background:none;border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:20px;cursor:pointer;font-size:.78rem}
.refresh:active{border-color:var(--purple)}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:26px 0 10px;font-weight:600}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;font-size:.92rem;cursor:pointer}
.q span:last-child{color:var(--teal);font-variant-numeric:tabular-nums}
.q:active{border-color:var(--purple)}
footer{text-align:center;color:var(--muted);font-size:.72rem;margin-top:26px;line-height:1.5}
</style>
</head>

  function render(){
    var f=fromSel.value,t=toSel.value,a=parse(amt.value);
    $("rFrom").textContent=fmt(a,f)+" "+f+" =";
    $("rTo").textContent=fmt(conv(a,f,t),t)+" "+t;
    $("rRate").textContent="1 "+f+" = "+rateStr(conv(1,f,t))+" "+t;
    $("qbase").textContent=f;
    var q=$("quick");q.innerHTML="";
    ["USD","EUR","GBP","NZD","JPY","SGD","CAD","CNY"].filter(function(c){return c!==f}).slice(0,8).forEach(function(c){
      var d=document.createElement("div");d.className="q";
      d.innerHTML="<span>"+c+"</span><span>"+fmt(conv(a||1,f,c),c)+"</span>";
      d.onclick=function(){toSel.value=c;render();save();};
      q.appendChild(d);
    });
    var st=$("stat"),dot=$("dot");
    if(live){dot.className="dot";st.textContent="Live · "+(updated?new Date(updated).toLocaleString():"");}
    else if(updated){dot.className="dot off";st.textContent="Offline · last updated "+new Date(updated).toLocaleString();}
    else{dot.className="dot off";st.textContent="Offline · approximate rates";}
  }

  function load(){
    $("stat").textContent="Updating rates…";
    var ctrl=("AbortController" in window)?new AbortController():null;
    var to=setTimeout(function(){ctrl&&ctrl.abort();},8000);
    fetch("https://open.er-api.com/v6/latest/USD",ctrl?{signal:ctrl.signal}:{})
      .then(function(r){return r.json();})
      .then(function(j){
        clearTimeout(to);
        if(j&&j.rates){ rates=j.rates; updated=j.time_last_update_unix?j.time_last_update_unix*1000:Date.now(); live=true; save(); }
        else throw 0;
        render();
      })
      .catch(function(){clearTimeout(to);live=false;render();});
  }

  amt.addEventListener("input",function(){render();save();});
  amt.addEventListener("focus",function(){amt.select();});
  fromSel.addEventListener("change",function(){render();save();});
  toSel.addEventListener("change",function(){render();save();});
  $("swap").onclick=function(){var t=fromSel.value;fromSel.value=toSel.value;toSel.value=t;render();save();};
  $("refresh").onclick=load;

  // inline manifest (installable PWA, no external files)
  try{
    var icon="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14d3c0"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#e63cb4"/></linearGradient></defs><rect width="512" height="512" fill="#000"/><circle cx="256" cy="256" r="170" fill="none" stroke="url(#g)" stroke-width="24"/><text x="256" y="320" text-anchor="middle" font-size="200" font-weight="700" fill="url(#g)" font-family="system-ui">$</text></svg>');
    var man={name:"Currency Converter",short_name:"Converter",display:"standalone",background_color:"#000000",theme_color:"#000000",start_url:".",icons:[{src:icon,sizes:"512x512",type:"image/svg+xml",purpose:"any"}]};
    $("manifest").href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));
  }catch(e){}

  render();
  load();
})();
</script>
</body>
</html>
