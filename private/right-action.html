<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}

.wrap{max-width:820px;margin:0 auto;padding:1rem 1rem 6.8rem}
header.app{text-align:center;padding:.55rem 0 .9rem}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.22rem .7rem;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#d7d0c4;margin-bottom:.4rem}
.wordmark{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(2.35rem,10vw,3.5rem);margin:0;letter-spacing:.02em;
  background:linear-gradient(120deg,var(--teal),var(--gold),var(--violet),var(--teal));background-size:220% 220%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 9s ease-in-out infinite}
.tag{color:var(--muted);margin:.3rem 0 0;font-size:.92rem}
@keyframes shimmer{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:1rem 1.05rem 1.15rem;margin:0 0 1rem}
.kicker{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 .3rem}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.7rem;margin:.1rem 0 .5rem;font-weight:600}
h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.28rem;margin:.15rem 0 .35rem;font-weight:600}
label{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:.65rem 0 .28rem}
input,select,textarea{width:100%;background:#0b0a10;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.72rem .8rem;font:inherit}
input:focus,select:focus,textarea:focus{outline:1px solid var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
@media(max-width:620px){.row2{grid-template-columns:1fr}}
.hint{color:var(--muted);font-size:.8rem;margin:.4rem 0 0}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.85rem}
button{font:inherit;border:0;border-radius:999px;padding:.68rem 1.1rem;cursor:pointer}
.primary{background:linear-gradient(120deg,var(--teal),var(--gold));color:#102019;font-weight:600}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tiny{background:rgba(8,10,20,.55);color:var(--ink);border:1px solid var(--line);padding:.42rem .78rem;font-size:.82rem}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin:.2rem 0 .8rem}
.num{background:#0b0a10;border:1px solid var(--line);border-radius:16px;padding:.7rem .4rem .75rem;text-align:center}
.num b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:2.15rem;line-height:1;color:var(--teal)}
.num span{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.25rem}
.num.is-year b{color:var(--gold)}
.num.is-day b{color:var(--violet)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:.18rem .55rem;font-size:.72rem;color:var(--muted);margin:.15rem .2rem 0 0}
.list{margin:.2rem 0 0;padding:0 0 0 1.1rem}
.list li{margin:.28rem 0}
.month{border:1px solid var(--line);border-radius:16px;padding:.8rem .9rem;margin:.55rem 0 0;background:#0b0a10}
.month.now{border-color:rgba(232,200,114,.55);box-shadow:0 0 0 1px rgba(232,200,114,.18)}
.month .top{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem}
.month .pm{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.45rem;color:var(--gold)}
.cycle{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.cy{background:#0b0a10;border:1px solid var(--line);border-radius:14px;padding:.7rem .55rem .75rem;text-align:center;cursor:pointer}
.cy b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.55rem;color:var(--teal)}
.cy.now{border-color:rgba(232,200,114,.6)}
.cy.now b{color:var(--gold)}
.cy.past{opacity:.62}
.people{display:flex;flex-direction:column;gap:.45rem}
.person{display:flex;justify-content:space-between;align-items:center;gap:.6rem;background:#0b0a10;border:1px solid var(--line);border-radius:14px;padding:.7rem .85rem}
.person.active{border-color:rgba(94,234,212,.45)}
.muted{color:var(--muted)}
.fine{font-size:.78rem;color:var(--muted);line-height:1.5}
hr.soft{border:0;border-top:1px solid var(--line);margin:1rem 0}
.cover-hero{text-align:center;padding:1.4rem .4rem 1.2rem}
.cover-hero p.lead{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.35rem;margin:.4rem 0 1.1rem}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;gap:.15rem;
  background:rgba(8,7,11,.86);backdrop-filter:blur(14px);border-top:1px solid var(--line);

.tabs button{flex:1;background:transparent;color:var(--muted);border:0;border-radius:12px;padding:.45rem .2rem .4rem;font-size:.72rem;letter-spacing:.04em}
.tabs button.on{color:var(--gold)}
.hidden{display:none !important}
.note{width:100%;min-height:4.2rem;resize:vertical}
.do{color:var(--teal)}
.dont{color:var(--warn)}
</style>
</head>

function reduce(n){
  n = Math.abs(Number(n)||0);
  while(n > 9) n = String(n).split("").reduce((a,d)=>a+Number(d),0);
  return n || 9;
}
function digitSum(n){
  return String(n).split("").reduce((a,d)=>a+Number(d),0);
}
function personalYear(month, day, year){
  return reduce(digitSum(month) + digitSum(day) + digitSum(year));
}
function personalMonth(py, calMonth){ return reduce(py + calMonth); }
function personalDay(pm, calDay){ return reduce(pm + calDay); }

function load(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || {people:[], active:null, notes:{}}; }
  catch(e){ return {people:[], active:null, notes:{}}; }
}
function save(s){ localStorage.setItem(STORE, JSON.stringify(s)); }

let state = load();
let view = state.active ? "today" : "cover";
let cycleFocus = null;
let lookYear = new Date().getFullYear();

function activePerson(){
  return (state.people||[]).find(p=>p.id===state.active) || null;
}
function uid(){ return "p"+Math.random().toString(36).slice(2,9); }

function nowNumbers(person, date){
  const d = date || new Date();
  const y = d.getFullYear();
  const m = d.getMonth()+1;
  const day = d.getDate();
  const py = personalYear(person.month, person.day, y);
  const pm = personalMonth(py, m);
  const pd = personalDay(pm, day);
  return {y,m,day,py,pm,pd};
}

function esc(s){
  return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function render(){
  const el = document.getElementById("app");
  const tabs = document.getElementById("tabs");
  const person = activePerson();
  if(view==="cover" || !person){
    tabs.classList.add("hidden");
    el.innerHTML = coverHTML();
    bindCover();
    return;
  }
  tabs.classList.remove("hidden");
  [...tabs.querySelectorAll("button")].forEach(b=>b.classList.toggle("on", b.dataset.go===view));
  if(view==="today") el.innerHTML = todayHTML(person);
  if(view==="year") el.innerHTML = yearHTML(person);
  if(view==="months") el.innerHTML = monthsHTML(person);
  if(view==="cycle") el.innerHTML = cycleHTML(person);
  if(view==="people") el.innerHTML = peopleHTML(person);
  if(view==="solve") el.innerHTML = solveHTML(person);
  if(view==="about") el.innerHTML = aboutHTML();
  bindApp();
}

    const cal = i+1;
    const pm = personalMonth(py, cal);
    const M = MONTH_LAYER[pm];
    const now = (cal===n.m && y===n.y) ? " now" : "";
    return `<article class="month${now}">
      <div class="top">
        <div>

function cycleHTML(p){
  const n = nowNumbers(p);
  const focus = cycleFocus || n.py;
  const Y = YEARS[focus];
  const cells = [1,2,3,4,5,6,7,8,9].map(num=>{
    const cls = num===n.py ? "cy now" : (num<n.py ? "cy past" : "cy");
    return `<button class="${cls}" data-cy="${num}"><b>${num}</b>${YEARS[num].name}</button>`;
  }).join("");
  const yearsOf = (num)=>{
    const out=[];
    for(let y=n.y-12;y<=n.y+8;y++){
      if(personalYear(p.month,p.day,y)===num) out.push(y);
    }
    return out;
  };
  const list = yearsOf(focus);
  return `
  <header class="app">
    <div class="pill">Nine-year map</div>
    <h1 class="wordmark">Cycle</h1>
    <p class="tag">You are in year ${n.py} now. Tap any number.</p>

}

function bindCover(){
  document.getElementById("about").onclick = ()=>{ view="about"; render(); };
  document.getElementById("go").onclick = ()=>{
    const name = document.getElementById("nm").value.trim() || "Me";
    const month = Number(document.getElementById("mo").value);
    const day = Math.min(31, Math.max(1, Number(document.getElementById("dy").value)||1));
    const person = {id:uid(), name, month, day};
    state.people = state.people||[];
    state.people.unshift(person);
    state.active = person.id;
    save(state);
    view="today";
    render();
  };
}

function bindApp(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ view=b.dataset.go; render(); window.scrollTo(0,0); });
  const note = document.getElementById("note");
  const savenote = document.getElementById("savenote");
  if(note && savenote){
    savenote.onclick = ()=>{
      const p = activePerson();
      const n = nowNumbers(p);
      const key = `${p.id}-${n.y}-${n.m}-${n.day}`;
      state.notes = state.notes||{};
      state.notes[key] = note.value;
      save(state);
      savenote.textContent = "Kept";
    };
  }
  const setyear = document.getElementById("setyear");
  if(setyear){
    setyear.onclick = ()=>{
      lookYear = Number(document.getElementById("looky").value)||new Date().getFullYear();
      render();
    };
  }
  document.querySelectorAll("[data-cy]").forEach(b=>b.onclick=()=>{ cycleFocus=Number(b.dataset.cy); render(); });
  const add = document.getElementById("add");
  if(add){
    add.onclick = ()=>{
      const name = document.getElementById("nm").value.trim() || "Unnamed";
      const month = Number(document.getElementById("mo").value);
      const day = Math.min(31, Math.max(1, Number(document.getElementById("dy").value)||1));
      const person = {id:uid(), name, month, day};
      state.people.unshift(person);
      state.active = person.id;
      save(state);
      view="today";
      render();
    };
  }
  const askgo = document.getElementById("askgo");
  if(askgo){
    askgo.onclick = ()=>{
      const p = activePerson();
      const n = nowNumbers(p);
      const Y = YEARS[n.py];
      const txt = (document.getElementById("prob").value||"").toLowerCase();
      let area = "work";
      if(/money|bill|pay|debt|price|bank/.test(txt)) area = "money";
      else if(/love|partner|friend|son|daughter|family|people|him|her|them/.test(txt)) area = "love";
      else if(/home|house|room|clutter|kitchen|garage/.test(txt)) area = "home";
      else if(/body|health|sleep|pain|tired/.test(txt)) area = "body";
      else if(/travel|trip|move|leave/.test(txt)) area = "travel";
      const out = document.getElementById("askout");
      out.innerHTML = `<hr class="soft"><p class="kicker">Right action</p>
        <p>Hold the problem inside a <strong>${n.py} ${Y.name}</strong> year and a <strong>${n.pm} ${MONTH_LAYER[n.pm].name}</strong> month.</p>
        <p>${esc(Y[area])}</p>
        <p>${esc(BLEND[n.py][n.m])}</p>
        <p>${esc(DAYS[n.pd].use)}</p>
        <p class="hint">If the urge is to start something this year should not carry: ${esc(Y.avoidStart)}</p>`;
    };
  }
  document.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{ state.active=b.dataset.use; save(state); view="today"; render(); });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;
    state.people = state.people.filter(x=>x.id!==id);
    if(state.active===id) state.active = state.people[0]?state.people[0].id:null;
    save(state);
    if(!state.active) view="cover";
    render();
  });
}

document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button[data-go]");
  if(!b) return;
  view = b.dataset.go;
  render();
  window.scrollTo(0,0);
});

  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}

render();
