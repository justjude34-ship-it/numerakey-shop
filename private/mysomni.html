<style>
  :root {
    --ink: #07080b;
    --ink-2: #101216;
    --cream: #ebe6dc;
    --mist: #9a9488;
    --ash: #6b665e;
    --tide: #7ea0b8;
    --copper: #c9a27a;
    --ember: #c48678;
    --line: rgb(235 230 220 / 0.12);
    --display: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--cream); }
  body {
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.55; }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--display); font-weight: 500; text-wrap: balance; }
  p { text-wrap: pretty; }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 3px; }
  ::selection { background: rgb(197 205 214 / 0.35); color: var(--cream); }
  .mark { font-family: var(--display); font-size: 1.7rem; color: var(--copper); text-decoration: none; line-height: 1; }
  .eyebrow {
    margin: 0;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .tide { color: var(--tide); }
  .copper { color: var(--copper); }
  .ember { color: var(--ember); }
  .mist { color: var(--mist); }
  .ash { color: var(--ash); }
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: env(safe-area-inset-top) 1.15rem 0;
    height: calc(4.1rem + env(safe-area-inset-top));
    z-index: 5;
  }
  .home .top { position: absolute; left: 0; right: 0; top: 0; }
  .sub .top {
    position: sticky;
    top: 0;
    background: rgb(7 8 11 / 0.82);
    backdrop-filter: blur(16px);
  }
  .desk-nav { display: none; gap: 0.15rem; }
  .desk-nav a, .tabs a {
    text-decoration: none;
    color: var(--mist);
    padding: 0.45rem 0.75rem;
    font-size: 0.92rem;
  }
  .desk-nav a.on, .tabs a.on { color: var(--cream); }
  .poster { position: relative; min-height: 100dvh; }
  .tall {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 68%;
  }
  .wide { display: none; width: min(1080px, 100%); height: auto; border-radius: 18px; }
  .poster::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg, rgb(7 8 11 / 0.55) 0%, rgb(7 8 11 / 0.08) 46%, rgb(7 8 11 / 0.35) 100%);
  }
  .poster-copy {
    position: absolute;
    z-index: 2;
    left: 0;
    right: 0;
    top: max(5.6rem, 14vh);
    padding: 0 1.35rem;
    max-width: 38rem;
  }
  .poster-copy h1 {
    font-size: clamp(4.6rem, 18vw, 7.5rem);
    line-height: 0.86;
    margin: 0.3rem 0 0;
    letter-spacing: -0.03em;
  }
  .lede { margin: 1rem 0 0; max-width: 26rem; color: var(--mist); font-size: 1.05rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.35rem; }
  .owned {
    margin: 0.9rem 0 0;
    color: var(--ash);
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 3rem;
    padding: 0 1.15rem;
    border-radius: 16px;
    border: 0;
    text-decoration: none;
    font-size: 0.95rem;
  }
  .btn.solid { background: var(--cream); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--cream); box-shadow: 0 0 0 1px rgb(235 230 220 / 0.18); }
  .btn.grow { flex: 1; }
  .band { max-width: 1080px; margin: 0 auto; padding: 3.4rem 1.25rem 0; }
  .band h2 { font-size: clamp(2.3rem, 6vw, 3.4rem); line-height: 0.95; margin: 0.4rem 0 0; }
  .modes, .journeys { display: grid; gap: 0.75rem; margin-top: 1.3rem; }
  .modes { grid-template-columns: 1fr; }
  .journeys { grid-template-columns: 1fr 1fr; }
  .mode {
    display: block;
    text-decoration: none;
    background: var(--ink-2);
    border-radius: 18px;
    padding: 1.15rem 1.15rem 1.25rem;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .mode h3 { margin: 0.35rem 0; font-size: 2.05rem; line-height: 1; }
  .mode p { margin: 0; color: var(--mist); font-size: 0.95rem; }
  .jcard {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 172px;
    padding: 0.95rem;
    border-radius: 16px;
    text-decoration: none;
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .jcard.tide { background: linear-gradient(180deg, #151b22, #0c1014); }
  .jcard.copper { background: linear-gradient(180deg, #1b1611, #100e0c); }
  .jcard.ember { background: linear-gradient(180deg, #1c1413, #110e0d); }
  .jcard h3 { margin: 0.4rem 0 0; font-size: 1.7rem; line-height: 0.95; color: var(--cream); }
  .jcard p { margin: 0.4rem 0 0; color: var(--mist); font-size: 0.84rem; }
  .jcard em { margin-top: 0.65rem; font-style: normal; color: var(--ash); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .jcard .eyebrow { font-size: 0.62rem; }
  .sheet { max-width: 42rem; margin: 0 auto; padding: 0.4rem 1.25rem 2rem; }
  .sheet.broad { max-width: 1080px; }
  .back { color: var(--mist); text-decoration: none; font-size: 0.92rem; }
  .listen h1, .guide h1, .journey-page h1 { font-size: clamp(3rem, 9vw, 4.6rem); line-height: 0.92; margin: 0.35rem 0 0; }
  .detail { color: var(--mist); font-size: 1.02rem; }
  .block { margin-top: 1.7rem; }
  .block .eyebrow { margin-bottom: 0.7rem; }
  .pills { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .pill, .style {
    border: 0;
    background: transparent;
    color: var(--cream);
    box-shadow: 0 0 0 1px rgb(235 230 220 / 0.16);
  }
  .pill { border-radius: 999px; padding: 0.55rem 0.9rem; }
  .pill.on, .style.on { background: var(--cream); color: var(--ink); box-shadow: none; }
  .styles { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .style { text-align: left; border-radius: 16px; padding: 0.9rem; }
  .style strong { display: block; font-family: var(--display); font-size: 1.55rem; font-weight: 500; }
  .style span { display: block; margin-top: 0.3rem; font-size: 0.8rem; color: var(--mist); }
  .style.on span { color: #4a463f; }
  .hint { margin: 0.7rem 0 0; color: var(--ash); font-size: 0.92rem; }
  .note { color: var(--cream); font-size: 0.92rem; }
  .go {
    display: flex;
    gap: 0.55rem;
    align-items: center;
    padding: 1.15rem 0 0.2rem;
  }
  .heart {
    width: 3rem;
    height: 3rem;
    border: 0;
    border-radius: 16px;
    background: transparent;
    color: var(--copper);
    box-shadow: 0 0 0 1px rgb(235 230 220 / 0.16);
  }
  .heart.on { background: var(--copper); color: var(--ink); }
  .guide h2 { font-size: 2.1rem; margin: 0; }
  .guide section { margin-top: 2.4rem; }
  .guide p, .guide li { color: var(--mist); }
  .guide strong { color: var(--cream); font-weight: 600; }
  .foot {
    max-width: 1080px;
    margin: 3rem auto 0;
    padding: 1.4rem 1.25rem 0.4rem;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem 1.5rem;
    justify-content: space-between;
    align-items: end;
  }
  .foot p { margin: 0.3rem 0 0; max-width: 26rem; color: var(--mist); font-size: 0.92rem; }
  .save { color: var(--copper); }
  .tabs {
    position: fixed;
    z-index: 30;
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding: 0.25rem 0.4rem calc(0.35rem + env(safe-area-inset-bottom));
    background: rgb(7 8 11 / 0.92);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  .tabs a { text-align: center; padding: 0.7rem 0.2rem; }
  .home, .sub { padding-bottom: calc(5rem + env(safe-area-inset-bottom)); }
  .docked.home, .docked.sub { padding-bottom: calc(9rem + env(safe-area-inset-bottom)); }
  .mini {
    position: fixed;
    z-index: 28;
    left: 0.7rem;
    right: 0.7rem;
    bottom: calc(4.35rem + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.55rem 0.6rem 0.55rem 0.9rem;
    border-radius: 18px;
    background: rgb(16 18 22 / 0.94);
    box-shadow: 0 12px 40px rgb(0 0 0 / 0.35), 0 0 0 1px rgb(235 230 220 / 0.1);
    backdrop-filter: blur(16px);
  }
  .mini-main { flex: 1; min-width: 0; text-decoration: none; display: flex; flex-direction: column; }
  .mini-main strong { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-main span { color: var(--mist); font-size: 0.78rem; }
  .mini button {
    border: 0;
    background: transparent;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 12px;
  }
  .mini .texty { width: auto; padding: 0 0.7rem; color: var(--mist); }
  .session {
    position: relative;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: max(0.75rem, env(safe-area-inset-top)) 1.2rem max(1.15rem, env(safe-area-inset-bottom));
    overflow: hidden;
  }
  .session-bg, #stage, .session-veil { position: absolute; inset: 0; width: 100%; height: 100%; }
  .session-bg { object-fit: cover; object-position: center 70%; }
  #stage { z-index: 1; pointer-events: none; }
  .session-veil {
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(180deg, rgb(7 8 11 / 0.62), rgb(7 8 11 / 0.12) 38%, rgb(7 8 11 / 0.88));
  }
  .session-top, .session-ui { position: relative; z-index: 3; }
  .session-top { display: flex; align-items: center; justify-content: space-between; }
  .texty {
    border: 0;
    background: transparent;
    color: var(--mist);
    min-height: 2.75rem;
    padding: 0 0.2rem;
  }
  .session-ui h1 { font-size: clamp(2.7rem, 9vw, 4.2rem); line-height: 0.92; margin: 0.25rem 0 0; }
  .clock {
    font-family: var(--display);
    font-size: clamp(4.4rem, 20vw, 7rem);
    line-height: 0.85;
    margin: 0.85rem 0 0;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .clocksub { margin: 0.35rem 0 0; color: var(--mist); letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.72rem; }
  .play {
    margin-top: 1.1rem;
    width: 4.6rem;
    height: 4.6rem;
    border: 0;
    border-radius: 50%;
    background: var(--cream);
    color: var(--ink);
    display: grid;
    place-items: center;
  }
  .vol { display: grid; grid-template-columns: auto 1fr auto; gap: 0.7rem; align-items: center; margin-top: 1.15rem; color: var(--mist); font-size: 0.85rem; }
  input[type="range"] { width: 100%; accent-color: var(--copper); }
  .links { margin-top: 1.4rem; }
  .links a { color: var(--mist); margin-right: 1rem; }
  @media (min-width: 800px) {
    .modes { grid-template-columns: repeat(3, 1fr); }
    .journeys { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 900px) {
    .desk-nav { display: flex; }
    .tabs { display: none; }
    .home, .sub, .docked.home, .docked.sub { padding-bottom: 2.5rem; }
    .docked.home, .docked.sub { padding-bottom: 6.5rem; }
    .poster { min-height: 0; padding: calc(5.4rem + env(safe-area-inset-top)) 1.5rem 0; }
    .poster::after { display: none; }
    .tall { display: none; }
    .wide { display: block; margin: 0 auto; }
    .poster-copy { position: relative; top: auto; max-width: 1080px; margin: 0 auto; padding: 1.2rem 0 0; }
    .poster-copy .kicker, .poster-copy h1, .poster-copy .lede {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .poster-copy .actions, .poster-copy .owned { justify-content: center; text-align: center; }
    .poster-copy .owned { display: block; }
    .mini { left: 50%; right: auto; transform: translateX(-50%); width: min(34rem, calc(100% - 2rem)); bottom: 1.1rem; }
    .sheet { padding-top: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

  { ratio: 1.006, gain: 0.82 },
  { ratio: 2.76, gain: 0.4 },
  { ratio: 2.772, gain: 0.3 },
  { ratio: 5.4, gain: 0.15 },

const FORMANT_A = [730, 1090, 2440];

function createNoiseBuffer(ctx, seconds) {

const engine = {
  ctx: null,
  master: null,
  fade: null,
  stopVoice: null,
  gen: 0,
  async ensure() {
    if (!this.ctx || this.ctx.state === "closed") {
      const ctx = new AudioContext();
      const master = ctx.createGain();
      const fade = ctx.createGain();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18;
      comp.knee.value = 10;
      comp.ratio.value = 2.6;
      comp.attack.value = 0.01;
      comp.release.value = 0.28;
      fade.connect(comp);
      comp.connect(master);
      master.connect(ctx.destination);
      this.ctx = ctx;
      this.master = master;
      this.fade = fade;
    }
    if (this.ctx.state === "suspended") await this.ctx.resume();
    return this.ctx;
  },
  isActive() {
    return this.stopVoice !== null && this.ctx !== null && this.ctx.state !== "closed";
  },
  hardStop() {
    if (this.stopVoice) this.stopVoice();
    this.stopVoice = null;
  },
  async start(config) {
    this.gen += 1;
    const ctx = await this.ensure();
    this.hardStop();
    this.master.gain.setTargetAtTime(config.volume, ctx.currentTime, 0.03);
    this.fade.gain.cancelScheduledValues(ctx.currentTime);
    this.fade.gain.setValueAtTime(0.0001, ctx.currentTime);
    this.fade.gain.linearRampToValueAtTime(1, ctx.currentTime + 0.9);
    if (config.mode === "binaural") this.stopVoice = startBinaural(ctx, this.fade, config.carrier, config.beat);
    else if (config.mode === "bowls") this.stopVoice = startBowls(ctx, this.fade, config.hz, config.style);
    else this.stopVoice = startChant(ctx, this.fade, config.fundamental, config.cycleSec);
  },
  setVolume(volume) {
    if (!this.master || !this.ctx) return;
    this.master.gain.setTargetAtTime(volume, this.ctx.currentTime, 0.04);
  },
  async pause() {
    if (this.ctx && this.ctx.state === "running") await this.ctx.suspend();
  },
  async resume() {
    if (this.ctx && this.ctx.state === "suspended") await this.ctx.resume();
  },
  async fadeOut(seconds) {
    const gen = this.gen;
    if (!this.ctx || !this.fade) { this.hardStop(); return; }
    const now = this.ctx.currentTime;
    this.fade.gain.cancelScheduledValues(now);
    this.fade.gain.setValueAtTime(Math.max(this.fade.gain.value, 0.0001), now);
    this.fade.gain.linearRampToValueAtTime(0.0001, now + seconds);
    await new Promise((resolve) => window.setTimeout(resolve, seconds * 1000));
    if (this.gen !== gen) return;
    this.hardStop();
  },
};

function toEngine(config) {
  if (config.mode === "binaural") {
    const preset = byId(BINAURAL, config.binauralId);
    return { mode: "binaural", carrier: preset.carrier, beat: preset.beat, volume: config.volume };
  }
  if (config.mode === "bowls") {
    const tone = byId(BOWLS, config.bowlToneId);
    return { mode: "bowls", hz: tone.hz, style: config.bowlStyle, volume: config.volume };
  }
  const chant = byId(CHANT, config.chantId);
  return { mode: "chant", fundamental: chant.fundamental, cycleSec: chant.cycleSec, volume: config.volume };
}

  active = snapshot;
  void syncWake();
  if ((location.hash || "") !== "#/session") location.hash = "#/session";
  else paint();
}

async function toggle() {
  if (player.status === "fading") return;
  if (player.status === "playing") {
    await engine.pause();
    if (player.startedAt) player.elapsedBeforePause += Date.now() - player.startedAt;
    player.startedAt = null;
    player.status = "paused";
    void syncWake();
    paint();
    return;
  }
  if (!engine.isActive()) {
    await beginSession();
    return;
  }
  await engine.resume();
  player.startedAt = Date.now();
  player.status = "playing";
  void syncWake();
  paint();
}

async function endSession(seconds) {
  if (ending) return;
  ending = true;
  player.status = "fading";
  paint();
  await engine.fadeOut(seconds || 4);
  player.status = "idle";
  player.startedAt = null;
  player.elapsedBeforePause = 0;
  active = null;
  ending = false;
  if (location.hash && location.hash !== "#/" && location.hash !== "#") location.hash = "#/";
  else paint();
}

function maybeEnd() {
  const cfg = nowConfig();
  if (player.status !== "playing" || cfg.durationMin == null || ending) return;
  if (elapsedMs() >= cfg.durationMin * 60000) void endSession(8);
}

function iconPlay() {
  return '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
}
function iconPause() {
  return '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
}
function iconHeart(on) {
  return '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z" fill="' + (on ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.6"/></svg>';
}

function navLinks(cls) {
  const v = view();
  const item = (href, label, id) => '<a href="' + href + '" class="' + (v === id ? "on" : "") + '">' + label + "</a>";
  return '<nav class="' + cls + '">' + item("#/", "Tonight", "home") + item("#/journeys", "Journeys", "journeys") + item("#/guide", "Guide", "guide") + "</nav>";
}
function topbar() {
  return '<header class="top"><a class="mark" href="#/">MySomni</a>' + navLinks("desk-nav") + "</header>";
}
function tabs() {
  return navLinks("tabs");
}
function footer() {
  return '<footer class="foot"><div><p class="mark">MySomni</p><p>One sound at a time. Made on this device. Nothing to install, nothing that expires.</p></div><a class="save" download="MySomni.html">Save your copy</a></footer>';
}
function mini() {
  if (player.status !== "playing" && player.status !== "paused") return "";
  const cfg = nowConfig();
  const label = player.status === "playing" ? "Playing" : "Paused";
  return '<div class="mini"><a class="mini-main" href="#/session"><strong>' + sessionTitle(cfg) + "</strong><span>" + label + '</span></a><button type="button" data-act="toggle" aria-label="' + (player.status === "playing" ? "Pause" : "Play") + '">' + (player.status === "playing" ? iconPause() : iconPlay()) + '</button><button type="button" class="texty" data-act="end">End</button></div>';
}
function frame(inner) {
  const v = view();
  const dock = player.status === "playing" || player.status === "paused";
  return '<div class="' + (v === "home" ? "home" : "sub") + (dock ? " docked" : "") + '">' + topbar() + inner + footer() + mini() + tabs() + "</div>";
}
function journeyCard(j) {
  const accent = MODES[j.mode].accent;
  return '<a class="jcard ' + accent + '" href="' + journeyHref(j) + '"><span class="eyebrow ' + accent + '">' + MODES[j.mode].name + "</span><h3>" + j.title + "</h3><p>" + j.line + "</p><em>" + (j.minutes ? j.minutes + " min" : "Open") + "</em></a>";
}
function homeView() {
  const modes = ["binaural", "bowls", "chant"].map((id) => {
    const mode = MODES[id];
    return '<a class="mode" href="#/listen/' + id + '"><p class="eyebrow ' + mode.accent + '">' + mode.kicker + "</p><h3 class=\"" + mode.accent + "\">" + mode.name + "</h3><p>" + mode.line + "</p></a>";
  }).join("");
  const loved = state.favorites.length
    ? '<section class="band"><p class="eyebrow copper">Kept</p><h2 class="copper">The ones you return to.</h2><div class="pills" style="margin-top:1rem">' + state.favorites.map((key) => {
        const cfg = configFromKey(key);
        if (!cfg) return "";
        return '<a class="pill" href="' + configHref(cfg) + '">' + sessionTitle(cfg) + "</a>";
      }).join("") + "</div></section>"
    : "";
  return '<section class="poster"><img class="wide" src="' + WIDE + '" alt="MySomni. A quieter night. A bronze singing bowl beneath a crescent moon."><img class="tall" src="' + HERO + '" alt=""><div class="poster-copy"><p class="eyebrow tide kicker">' + hello() + '</p><h1>MySomni</h1><p class="lede">A quieter night. One sound only — binaural beats, a Tibetan bronze bowl, or a deep male OM.</p><div class="actions"><a class="btn solid" href="#/listen/bowls">Begin with a bowl</a><a class="btn ghost" href="#/guide">How it works</a></div><p class="owned">One file. Yours to keep.</p></div></section><section class="band"><p class="eyebrow copper">Three exclusive modes</p><h2 class="copper">Choose one. The others stay silent.</h2><div class="modes">' + modes + '</div></section><section class="band"><p class="eyebrow ember">Journeys</p><h2 class="ember">Evenings, already set.</h2><div class="journeys">' + JOURNEYS.slice(0, 4).map(journeyCard).join("") + '</div><p class="links"><a href="#/journeys">All journeys</a></p></section>' + loved;
}
function configFromKey(key) {
  const bits = String(key).split(":");
  const cfg = { ...state.config };
  if (bits[0] === "binaural" && BINAURAL.some((p) => p.id === bits[1])) {
    cfg.mode = "binaural";
    cfg.binauralId = bits[1];
    return cfg;
  }
  if (bits[0] === "chant" && CHANT.some((p) => p.id === bits[1])) {
    cfg.mode = "chant";
    cfg.chantId = bits[1];
    return cfg;
  }
  if (bits[0] === "bowls" && BOWLS.some((p) => p.id === bits[1])) {
    cfg.mode = "bowls";
    cfg.bowlToneId = bits[1];
    cfg.bowlStyle = bits[2] === "circle" ? "circle" : "strike";
    return cfg;
  }
  return null;
}
function pill(on, act, id, label) {
  return '<button type="button" class="pill' + (on ? " on" : "") + '" data-act="' + act + '" data-id="' + id + '" aria-pressed="' + (on ? "true" : "false") + '">' + label + "</button>";
}
function listenView() {
  const mode = state.config.mode;
  const data = MODES[mode];
  const loved = state.favorites.includes(favKey(state.config));
  let controls = "";
  if (mode === "binaural") {
    const preset = byId(BINAURAL, state.config.binauralId);
    controls = '<section class="block"><p class="eyebrow">Pulse</p><div class="pills">' + BINAURAL.map((item) => pill(item.id === state.config.binauralId, "preset", item.id, item.name)).join("") + "</div><p class=\"hint\">" + preset.line + " · " + preset.band + " · " + preset.beat + " Hz</p></section>";
  } else if (mode === "bowls") {
    const tone = byId(BOWLS, state.config.bowlToneId);
    const styleBtn = (id, title, line) => '<button type="button" class="style' + (state.config.bowlStyle === id ? " on" : "") + '" data-act="style" data-id="' + id + '"><strong>' + title + "</strong><span>" + line + "</span></button>";
    controls = '<section class="block"><p class="eyebrow">Style</p><div class="styles">' + styleBtn("strike", "Strike", "Soft mallet. Long decay. Sparse repeats.") + styleBtn("circle", "Circle rim", "The mallet sings the rim and holds.") + "</div></section>" +
      '<section class="block"><p class="eyebrow">Solfeggio</p><div class="pills">' + BOWLS.filter((t) => t.group === "solfeggio").map((t) => pill(t.id === state.config.bowlToneId, "preset", t.id, formatHz(t.hz))).join("") + "</div></section>" +
      '<section class="block"><p class="eyebrow">Deep</p><div class="pills">' + BOWLS.filter((t) => t.group === "deep").map((t) => pill(t.id === state.config.bowlToneId, "preset", t.id, formatHz(t.hz))).join("") + "</div><p class=\"hint\">" + tone.name + " · " + formatHz(tone.hz) + "</p></section>";
  } else {
    const preset = byId(CHANT, state.config.chantId);
    controls = '<section class="block"><p class="eyebrow">Voice</p><div class="pills">' + CHANT.map((item) => pill(item.id === state.config.chantId, "preset", item.id, item.name)).join("") + "</div><p class=\"hint\">" + preset.line + "</p></section>";
  }
  const durations = DURATIONS.map((d) => pill(state.config.durationMin === d.minutes, "duration", d.id, d.label)).join("");
  const phones = mode === "binaural" ? '<p class="note">Headphones required. Speakers fold the two tones into one, and the pulse disappears.</p>' : "";
  return '<article class="sheet listen"><a class="back" href="#/">Back</a><p class="eyebrow ' + data.accent + '" style="margin-top:1.6rem">' + data.kicker + '</p><h1 class="' + data.accent + '">' + data.name + "</h1><p class=\"detail\">" + data.detail + "</p>" + phones + '<div class="go"><button type="button" class="btn solid grow" data-act="begin">Begin this evening</button><button type="button" class="heart' + (loved ? " on" : "") + '" data-act="fav" aria-pressed="' + (loved ? "true" : "false") + '" aria-label="Keep this sound">' + iconHeart(loved) + "</button></div>" + controls + '<section class="block"><p class="eyebrow">Length</p><div class="pills">' + durations + "</div></section>" + (state.error ? '<p class="hint">' + state.error + "</p>" : "") + "</article>";
}
function journeysView() {
  return '<article class="sheet broad journey-page"><p class="eyebrow ember">Journeys</p><h1 class="ember">Evenings, already set.</h1><p class="detail">A length, a voice, and nothing else. Open one when you do not want to choose.</p><div class="journeys">' + JOURNEYS.map(journeyCard).join("") + "</div></article>";
}
function guideView() {
  return '<article class="sheet guide"><p class="eyebrow tide">Guide</p><h1 class="copper">One sound. Then night.</h1><p>MySomni plays a single voice at a time. There is no mix, no stack, no undercurrent. Choose binaural beats, a Tibetan singing bowl, or a deep male chant — then stay with that one thing until the session ends.</p><section><h2 class="tide">Binaural beats</h2><p>Two sine tones, one in each ear, a few hertz apart. The difference is the pulse you perceive. Headphones are required; speakers fold the stereo image into one tone and the beat disappears. Nothing is layered underneath.</p><p>Tide and Drift sit in delta, for sleep. Ember and Dusk are theta, for sitting still. Haze is alpha. Clear is a soft beta for unclenching work without leaving the day.</p></section><section><h2 class="copper">Singing bowls</h2><p>Only a Tibetan-style bronze bowl. Pick a frequency from the Solfeggio set or the Deep set, then a play style. The tone is made here, on this device — it is not a recording streamed from anywhere.</p><p><strong>Strike</strong> — a soft mallet hit and a long decaying sustain. The next strike waits eight to fourteen seconds. Sparse on purpose.</p><p><strong>Circle rim</strong> — the mallet moves around the rim. The tone builds and then holds a long singing frequency.</p></section><section><h2 class="ember">Deep chant</h2><p>A low male temple voice on a single OM. The syllable opens, rounds, and closes into the hum, then takes a breath. No choir, no bowl, no beat behind it. Temple OM is the classic low voice. Low drone sits even deeper. Night mantra walks a little closer. Still voice is almost spoken.</p></section><section><h2 class="copper">Yours to keep</h2><p>This copy is one file. Save it anywhere you like. Open it in a browser, tonight or years from now. There is no account, no subscription, and no server the sound depends on. Dim the room. Keep the volume below conversation. Open duration runs until you end it. Timed evenings fade themselves out.</p><div class="actions"><a class="btn solid save" download="MySomni.html">Save your copy</a><a class="btn ghost" href="#/listen/bowls">Open singing bowls</a></div></section></article>';
}
function sessionView() {
  const cfg = nowConfig();
  const data = MODES[cfg.mode];
  const playing = player.status === "playing";
  const fading = player.status === "fading";
  const label = fading ? "Fading" : playing ? "Pause" : "Play";
  const phones = cfg.mode === "binaural" ? '<p class="note">Headphones on. The pulse lives between the ears.</p>' : "";
  return '<main class="session"><img class="session-bg" src="' + HERO + '" alt=""><canvas id="stage"></canvas><div class="session-veil"></div><header class="session-top"><a class="mark" href="#/">MySomni</a><button type="button" class="texty" data-act="end">End</button></header><div class="session-ui"><p class="eyebrow ' + data.accent + '">' + data.kicker + '</p><h1 class="' + data.accent + '">' + sessionTitle(cfg) + '</h1><p class="clock" id="clock" aria-live="polite">' + clockText() + '</p><p class="clocksub" id="clocksub">' + clockSub() + '</p><button type="button" class="play" data-act="toggle" aria-label="' + label + '"' + (fading ? " disabled" : "") + ">" + (playing || fading ? iconPause() : iconPlay()) + '</button><label class="vol"><span>Volume</span><input id="vol" type="range" min="0" max="1" step="0.01" value="' + state.config.volume + '"><span id="vollab">' + Math.round(state.config.volume * 100) + '%</span></label>' + phones + (state.error ? '<p class="hint">' + state.error + "</p>" : "") + "</div></main>";
}

function paint(opts) {
  stopStage();
  stopStage = function () {};
  const y = opts && opts.keep ? window.scrollY : 0;
  const v = view();
  const titles = { home: "MySomni", listen: MODES[state.config.mode].name + " · MySomni", journeys: "Journeys · MySomni", guide: "Guide · MySomni", session: sessionTitle(nowConfig()) + " · MySomni" };
  document.title = titles[v];
  const root = document.getElementById("app");
  if (v === "session") root.innerHTML = sessionView();
  else if (v === "listen") root.innerHTML = frame(listenView());
  else if (v === "journeys") root.innerHTML = frame(journeysView());
  else if (v === "guide") root.innerHTML = frame(guideView());
  else root.innerHTML = frame(homeView());
  if (v === "session") {
    const canvas = document.getElementById("stage");
    if (canvas) stopStage = mountStage(canvas);
  }
  const href = location.href.split("#")[0];
  document.querySelectorAll("a.save").forEach((a) => { a.href = href; a.setAttribute("download", "MySomni.html"); });
  if (opts && opts.keep) window.scrollTo(0, y);
  else window.scrollTo(0, 0);
}

function mountStage(canvas) {
  const ctx = canvas.getContext("2d");
  if (!ctx) return function () {};
  let running = true;
  let raf = 0;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let hold = 0;
  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  const drawBowl = (w, h, t) => {
    const cx = w * 0.5;
    const cy = h * 0.36;
    const rx = Math.min(w, h) * 0.22;
    const ry = rx * 0.62;
    if (visual.style === "strike" && visual.pulse) {
      const age = (t - visual.pulse) / 1000;
      if (age > 0 && age < 8) {
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx * (1 + age * 0.18), ry * (1 + age * 0.18), 0, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(232,196,150," + Math.max(0, 0.45 - age * 0.05) + ")";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
    if (visual.style === "circle") {
      const a = t / 900;
      const px = cx + Math.cos(a) * rx;
      const py = cy + Math.sin(a) * ry;
      ctx.beginPath();
      ctx.arc(px, py, 5, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,236,214,0.95)";
      ctx.fill();
    }
  };
  const drawBreath = (w, h, t) => {
    const breath = player.status === "playing" ? (visual.phase > 0.86 ? Math.max(0.35, 1 - (visual.phase - 0.86) / 0.14) : visual.phase < 0.05 ? 0.35 + visual.phase / 0.05 * 0.65 : 1) : 0.72;
    const r = Math.min(w, h) * (0.16 + breath * 0.12);
    const g = ctx.createRadialGradient(w / 2, h * 0.46, r * 0.1, w / 2, h * 0.46, r);
    g.addColorStop(0, "rgba(232,176,160,0.55)");
    g.addColorStop(0.6, "rgba(160,80,70,0.18)");
    g.addColorStop(1, "rgba(160,80,70,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(w / 2, h * 0.46, r, 0, Math.PI * 2);
    ctx.fill();
    if (reduce) return;
    ctx.strokeStyle = "rgba(235,230,220,0.16)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(w / 2, h * 0.46, r * 1.25 + Math.sin(t / 1400) * 6, 0, Math.PI * 2);
    ctx.stroke();
  };
  const drawBinaural = (w, h, t) => {
    const beat = byId(BINAURAL, nowConfig().binauralId).beat;
    const wobble = reduce || player.status !== "playing" ? 0 : Math.sin(t / (6000 / Math.max(beat, 1))) * 10;
    const y = h * 0.44;
    const r = Math.min(w, h) * 0.16;
    [[w * 0.38 - wobble, "rgba(126,160,184,0.28)"], [w * 0.62 + wobble, "rgba(197,205,214,0.2)"]].forEach((orb) => {
      const g = ctx.createRadialGradient(orb[0], y, r * 0.1, orb[0], y, r);
      g.addColorStop(0, orb[1]);
      g.addColorStop(1, "rgba(126,160,184,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(orb[0], y, r, 0, Math.PI * 2);
      ctx.fill();
    });
  };
  const frame = (now) => {
    if (!running) return;
    if (player.status !== "playing") {
      if (!hold) hold = now;
    } else hold = 0;
    const t = hold || now;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const mode = nowConfig().mode;
    if (mode === "bowls") drawBowl(w, h, t);
    else if (mode === "chant") drawBreath(w, h, t);
    else drawBinaural(w, h, t);
    if (!reduce) raf = requestAnimationFrame(frame);
  };
  resize();
  window.addEventListener("resize", resize);
  raf = requestAnimationFrame(frame);
  return function stop() {
    running = false;
    cancelAnimationFrame(raf);
    window.removeEventListener("resize", resize);
  };
}

document.getElementById("app").addEventListener("click", (event) => {
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "preset") {
    const id = el.dataset.id;
    if (state.config.mode === "binaural") state.config.binauralId = id;
    else if (state.config.mode === "chant") state.config.chantId = id;
    else state.config.bowlToneId = id;
    save();
    paint({ keep: true });
  } else if (act === "style") {
    state.config.bowlStyle = el.dataset.id === "circle" ? "circle" : "strike";
    save();
    paint({ keep: true });
  } else if (act === "duration") {
    const found = DURATIONS.find((item) => item.id === el.dataset.id);
    if (!found) return;
    state.config.durationMin = found.minutes;
    save();
    paint({ keep: true });
  } else if (act === "fav") {
    const key = favKey(state.config);
    state.favorites = state.favorites.includes(key) ? state.favorites.filter((item) => item !== key) : state.favorites.concat(key);
    save();
    paint({ keep: true });
  } else if (act === "begin") void beginSession();
  else if (act === "toggle") void toggle();
  else if (act === "end") void endSession(4);
});

document.getElementById("app").addEventListener("input", (event) => {
  if (event.target.id !== "vol") return;
  state.config.volume = Number(event.target.value);
  if (active) active.volume = state.config.volume;
  engine.setVolume(state.config.volume);
  save();
  const lab = document.getElementById("vollab");
  if (lab) lab.textContent = Math.round(state.config.volume * 100) + "%";
});

window.addEventListener("hashchange", () => { readRoute(); paint(); });
window.addEventListener("keydown", (event) => {
  if (event.code !== "Space") return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === "BUTTON" || tag === "A" || tag === "INPUT") return;
  if (view() !== "session" && player.status === "idle") return;
  event.preventDefault();
  void toggle();
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && player.status === "playing") void syncWake();
});
window.setInterval(() => {
  const clock = document.getElementById("clock");
  if (clock) clock.textContent = clockText();
  const sub = document.getElementById("clocksub");
  if (sub) sub.textContent = clockSub();
  maybeEnd();
}, 250);

readRoute();
paint();
</script>
</body>
</html>
