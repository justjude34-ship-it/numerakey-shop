<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Budget Buddy</title>
<style>
:root{--bg:#000;--card:#0d1112;--card2:#12181a;--fg:#f3f6f6;--muted:#93a0a3;--teal:#1aa6a0;--purple:#a77bff;--good:#4fd1a5;--warn:#ff5a5f;--line:#243033;--ink:#041412;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%}
body{min-height:100dvh}
.frame{max-width:520px;margin:0 auto;padding:0 0 calc(2rem + env(safe-area-inset-bottom))}
.hero{display:block;width:100%;height:auto}
.pad{padding:1rem 1.15rem}
h1{font-size:2.4rem;line-height:1.05;margin:.2rem 0 .3rem;font-weight:700;letter-spacing:-.03em}
h2{font-size:1.5rem;line-height:1.2;margin:.2rem 0 .5rem}
.grad{background-image:linear-gradient(100deg,var(--teal),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:3.6rem;margin:.8rem 0 0;padding:.8rem 1.1rem;border:0;border-radius:999px;font:inherit;font-size:1.15rem;font-weight:700;color:var(--ink);background-image:linear-gradient(100deg,var(--teal),var(--purple));cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.small{min-height:2.8rem;font-size:1rem}
.quiet{background:none;border:0;color:var(--teal);font:inherit;font-weight:700;font-size:1rem;padding:.5rem .2rem;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.15rem 0}
.steps{display:flex;gap:5px;padding:.5rem 1.15rem 0}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background-image:linear-gradient(100deg,var(--teal),var(--purple))}
.bubble{display:flex;gap:.7rem;align-items:flex-start;margin:.9rem 0}
.av{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background-image:linear-gradient(135deg,var(--teal),var(--purple));display:grid;place-items:center;font-weight:800;color:var(--ink);font-size:1.15rem}
.say{background:var(--card);border:1px solid var(--line);border-radius:1.2rem;border-top-left-radius:.3rem;padding:.8rem 1rem;font-size:1.08rem;flex:1}
.say p{margin:.2rem 0 .5rem}
.say p:last-child{margin-bottom:.1rem}
.say b{color:#fff}
.why{margin:.7rem 0 0;padding:.7rem .9rem;border-radius:1rem;background:var(--card2);color:var(--muted);font-size:.98rem;border-left:3px solid var(--teal)}
.picture{margin:.6rem 0;padding:.8rem 1rem;border:1px solid var(--line);border-radius:1.2rem;background:var(--card)}
.bar{display:flex;height:1.1rem;border-radius:9px;overflow:hidden;background:var(--line);margin:.5rem 0 .3rem}
.bar span{display:block;height:100%;min-width:2px}
.pline{display:flex;justify-content:space-between;gap:.5rem;font-size:.98rem}
.pline b{font-variant-numeric:tabular-nums}
.line{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:.8rem;margin:.6rem 0}
.line label{display:block;font-size:.85rem;color:var(--muted);margin:.5rem 0 .2rem}
.line input[type=text],.line input[type=number],.line select,input.big{width:100%;min-height:3rem;padding:.55rem .8rem;border-radius:.8rem;border:1px solid var(--line);background:#000;color:var(--fg);font:inherit;font-size:1.15rem}
.line .row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.line .tools{display:flex;justify-content:space-between;align-items:center;margin-top:.55rem}
.chk{display:flex;gap:.5rem;align-items:center;font-size:.98rem;color:var(--muted)}
.chk input{width:1.3rem;height:1.3rem;accent-color:var(--teal)}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:.7rem;padding:.35rem .7rem;font:inherit;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:.55rem .95rem;font:inherit;font-size:1rem;cursor:pointer}
.chip:active{background:#123e3c}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:.8rem .2rem .2rem;font-size:1.1rem}
.total b{font-size:1.5rem;color:var(--teal);font-variant-numeric:tabular-nums}
.help{margin:.5rem 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:1rem;padding:.8rem 1rem;font:inherit;font-size:1.05rem;margin:.5rem 0;cursor:pointer}
.opt small{display:block;color:var(--muted);font-size:.9rem}
.cat{margin:.7rem 0}
.cat .pline{margin-bottom:.15rem}
.catbar{height:.7rem;border-radius:9px;background:var(--line);overflow:hidden}
.catbar span{display:block;height:100%}
.left{padding:1rem;border-radius:1.3rem;border:1px solid var(--line);background:var(--card);text-align:center;margin:.8rem 0}
.left .n{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:.6rem 0}
.seg button{flex:1;padding:.6rem;background:none;border:0;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.seg button.on{background:var(--card2);color:#fff}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#123e3c;color:#fff;padding:.7rem 1.1rem;border-radius:999px;z-index:9}
.tag{display:inline-block;font-size:.8rem;padding:.1rem .55rem;border-radius:999px;background:#2b2140;color:var(--purple);margin-left:.4rem;vertical-align:middle}
.more{margin:.5rem 0;color:var(--muted)}
.more summary{cursor:pointer;color:var(--teal);font-weight:700;padding:.5rem 0;min-height:2.6rem;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more p{margin:.3rem 0 .5rem;padding:.7rem .9rem;border-radius:1rem;background:var(--card2);border-left:3px solid var(--purple);font-size:.98rem}
.foot{font-size:.88rem;color:var(--muted);text-align:center;margin:1.2rem 0 0}

/* warm friendly theme */
:root{--teal:#ff8a1f;--purple:#ff3d94;--ink:#1d1405;--card:#14100c;--card2:#1c160f;--line:#42260f;--sans:ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(120% 60% at 50% 0%,#2a1204 0%,#000 55%) fixed,#000}
.btn{background-image:linear-gradient(100deg,#ff8a1f,#ff5a5f 60%,#ff3d94);border-radius:1.6rem;box-shadow:0 6px 22px rgba(255,138,31,.28)}
.say{border-radius:1.6rem;border-top-left-radius:.4rem;background:#171109;border-color:#4d2c12}
.av{background-image:linear-gradient(135deg,#ff8a1f,#ff5a5f);font-size:1.2rem}
.chip{border-radius:1.2rem;background:#171109;border-color:#4d2c12}
.chip:active{background:#2a2112}
.opt{border-radius:1.3rem;background:#171109;border-color:#4d2c12}
.line,.picture,.left{border-radius:1.5rem;background:#14100c;border-color:#42260f}
.why{border-left-color:#ff8a1f;background:#1c160f}
.more summary{color:#ff8a1f}
.steps i.on{background-image:linear-gradient(100deg,#ff8a1f,#ff5a5f)}
.toast{background:#2a2112}
.quiet{color:#ff8a1f}
h1,h2{letter-spacing:-.01em}
.total b{color:#ff8a1f}
.line input[type=text],.line input[type=number],.line select{border-radius:1rem;background:#0a0805}

</style>
</head>

let mem=null;
function lsGet(){try{return localStorage.getItem(KEY)}catch(e){return mem}}
function lsSet(v){try{localStorage.setItem(KEY,v)}catch(e){mem=v}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const $=id=>document.getElementById(id);
function uid(){return Math.random().toString(36).slice(2,9)}
function money(n){n=Math.round(n);return(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-AU")}
const FREQ={week:{n:"every week",m:52/12},fortnight:{n:"every fortnight",m:26/12},month:{n:"every month",m:1},quarter:{n:"every 3 months",m:1/3},year:{n:"once a year",m:1/12}};
const PER={week:52/12,fortnight:26/12,month:1};

let S=load();
function blank(){return{page:"cover",last:null,step:0,lines:{},none:{},react:"",pace:"fortnight"}}
function load(){try{const r=lsGet();if(r){const o=JSON.parse(r);if(o&&o.lines)return Object.assign(blank(),o)}}catch(e){}return blank()}
function save(){lsSet(JSON.stringify(S))}
function linesOf(id){return S.lines[id]||(S.lines[id]=[])}
function monthly(l){const a=parseFloat(l.amt);return isNaN(a)?0:a*(FREQ[l.freq]||FREQ.month).m}
function total(id){return linesOf(id).reduce((t,l)=>t+monthly(l),0)}
function income(){return total("income")}
function spent(){return Q.filter(q=>q.id!=="income").reduce((t,q)=>t+total(q.id),0)}
function newLine(q,label,amt,freq){return{id:uid(),label:label||"",amt:amt==null?"":amt,freq:freq||q.def,guess:false}}

/* ---------- screens ---------- */
function steps(n){let h='<div class="steps">';for(let i=0;i<Q.length;i++)h+='<i class="'+(i<=n?"on":"")+'"></i>';return h+"</div>"}
function bubble(html){return'<div class="bubble"><div class="av">B</div><div class="say">'+html+"</div></div>"}

function cover(){
  return'<main class="frame"><img class="hero" src="'+HERO+'" alt="">'+
  '<div class="pad">'+
  bubble("<p>Hi, I'm Buddy. I'll ask you <b>seven small questions</b>, one at a time, and at the end you'll have a real budget.</p><p>No jargon. No lectures. And you're allowed to guess.</p>")+
  '<button class="btn" data-act="begin">Let\'s start</button>'+
  (S.last?'<button class="btn ghost small" data-act="resume">Carry on where I was</button>':"")+
  '<p class="foot">Everything you type stays on this phone. Nothing is sent anywhere.</p></div></main>'
}

function intro(){
  return'<main class="frame"><div class="top"><button class="quiet" data-act="cover">&larr; Back</button><span class="muted">Before we start</span></div><div class="pad">'+
  bubble("<p>A budget is just <b>a plan for where your money goes</b>, made before it goes.</p>")+
  bubble("<p>Your money has three jobs: <b>keep life running</b>, <b>look after future you</b>, and <b>have some fun</b>.</p><p>That's all this is. About 5 minutes. Stop whenever you like, and I'll keep your place.</p>")+
  '<button class="btn" data-act="startq">Ask me the first question</button></div></main>'
}

function pictureBox(){
  const inc=income(),sp=spent();
  if(inc<=0)return"";
  let segs="",used=0;
  Q.forEach(q=>{if(q.id==="income")return;const t=total(q.id);if(t>0){segs+='<span style="width:'+Math.min(100,t/inc*100)+'%;background:'+q.colour+'"></span>';used+=t}});
  const left=inc-sp;
  return'<div class="picture"><div class="pline"><span class="muted">Coming in each month</span><b>'+money(inc)+'</b></div><div class="bar">'+segs+'</div><div class="pline"><span class="muted">Left so far</span><b style="color:'+(left<0?"var(--warn)":"var(--good)")+'">'+money(left)+"</b></div></div>"
}

function question(){
  const q=Q[S.step],ls=linesOf(q.id);
  let h='<main class="frame"><div class="top"><button class="quiet" data-act="prev">&larr; Back</button><span class="muted">Question '+(S.step+1)+" of "+Q.length+"</span></div>"+steps(S.step)+'<div class="pad">';
  if(S.react)h+=bubble("<p>"+S.react+"</p>");
  h+=bubble("<p><b>"+esc(q.ask)+"</b></p>");
  const cut=q.why.indexOf(". "),first=cut>0?q.why.slice(0,cut+1):q.why,rest=cut>0?q.why.slice(cut+2):"";
  h+='<div class="why">'+esc(first)+"</div>";
  h+='<details class="more"><summary>Tell me more / where to find it</summary>'+(rest?"<p>"+esc(rest)+"</p>":"")+'<p><b style="color:#fff">Where to find it:</b> '+esc(q.find)+"</p></details>";
  h+='<div id="pic">'+pictureBox()+"</div>";
  if(S.none[q.id]){
    h+='<div class="line"><p style="margin:.2rem 0"><b>'+esc(q.none)+'.</b> That\'s fine, we\'ll count it as $0.</p><button class="quiet" data-act="unnone">Actually, I do</button></div>'
  }else{
    h+='<div id="lines">'+ls.map(lineHtml).join("")+"</div>";
    h+='<p class="muted" style="margin:.8rem 0 .2rem">Tap to add'+(q.id==="bills"?" each bill you have":"")+":</p><div class=\"chips\">"+q.chips.filter(c=>!ls.some(l=>l.label===c)).map(c=>'<button class="chip" data-act="addchip" data-v="'+esc(c)+'">+ '+esc(c)+"</button>").join("")+'<button class="chip" data-act="addblank">+ Something else</button></div>';
    if(q.extra)h+='<p class="muted" style="font-size:.95rem">'+esc(q.extra)+"</p>";
    if(q.ballpark&&!ls.length){
      h+='<p class="muted" style="margin:1rem 0 .2rem"><b style="color:#fff">Not sure? Pick the closest, as a starting guess:</b></p>';
      h+=q.ballpark.map((b,i)=>'<button class="opt" data-act="ball" data-i="'+i+'">'+esc(b[0])+"<small>"+esc(b[1])+" · you can change it</small></button>").join("")
    }
    h+='<div class="total"><span class="muted">That makes about</span><span><b id="tot">'+money(total(q.id))+'</b> <span class="muted">a month</span></span></div>';
    if(q.none)h+='<button class="quiet" data-act="none">'+esc(q.none)+"</button>"
  }
  h+='<button class="btn" data-act="next">'+(S.step===Q.length-1?"Show me my budget":"Next question")+"</button>";
  h+='<button class="btn ghost small" data-act="skip">Skip this one for now</button>';
  h+='<button class="quiet" style="display:block;margin:.6rem auto 0" data-act="cover">Take a break. I\'ll keep your place</button>';
  h+="</div></main>";
  return h
}

function lineHtml(l){
  return'<div class="line" data-id="'+l.id+'"><label>What is it?</label><input type="text" data-f="label" value="'+esc(l.label)+'" placeholder="e.g. Power">'+
  '<div class="row"><div><label>How much ($)</label><input type="number" inputmode="decimal" data-f="amt" value="'+esc(l.amt)+'" placeholder="0"></div>'+
  '<div><label>How often</label><select data-f="freq">'+Object.keys(FREQ).map(k=>'<option value="'+k+'"'+(l.freq===k?" selected":"")+">"+FREQ[k].n+"</option>").join("")+"</select></div></div>"+
  '<div class="tools"><label class="chk" style="margin:0"><input type="checkbox" data-f="guess"'+(l.guess?" checked":"")+"> This is a guess</label><button class=\"x\" data-act=\"del\">Remove</button></div></div>"
}

function react(qid){
  const t=total(qid),inc=income(),sh=inc>0?Math.round(t/inc*100):0;
  if(qid==="income")return t>0?"Lovely, about <b>"+money(t)+"</b> a month coming in. Everything else gets measured against that.":"No problem. We can still go through the rest, and you can fill this in later.";
  if(t<=0)return qid==="save"?"That's very common. We'll see what's left at the end and find a small start together.":qid==="fun"?"Okay. I'll nudge you about this at the end.":"No problem, we'll count that as nothing for now.";
  if(qid==="rent")return sh<=33?"That's about <b>"+sh+"%</b> of what comes in. Comfortable. A common guide is around a third.":sh<=45?"That's about <b>"+sh+"%</b> of what comes in, a little over the usual third. Lots of people are right there. It just leaves less room elsewhere, and we'll see how the rest fits.":"That's about <b>"+sh+"%</b> of what comes in, which is heavy. It's the biggest bite for a lot of people. Let's see how everything else fits around it.";
  if(qid==="bills")return"Bills come to about <b>"+money(t)+"</b> a month, or about <b>"+sh+"%</b> of what comes in. Good, now we know.";
  if(qid==="food")return"About <b>"+money(t)+"</b> a month on food. That's one of the few things you can steer, so it's useful to know.";
  if(qid==="move")return"Getting around costs about <b>"+money(t)+"</b> a month. Noted.";
  if(qid==="save")return"<b>"+money(t)+"</b> a month for future you, which is "+sh+"% of what comes in. That's the part that protects you from surprises.";
  return"Good. <b>"+money(t)+"</b> a month for fun, on purpose. A plan with fun in it is one you'll actually keep."
}

function results(){
  const inc=income(),sp=spent(),left=inc-sp,per=PER[S.pace]||1;
  const unit=S.pace==="week"?"a week":S.pace==="fortnight"?"a fortnight":"a month";
  let h='<main class="frame"><div class="top"><button class="quiet" data-act="back2q">&larr; Change an answer</button></div><div class="pad">';
  h+='<h1 class="grad">Your budget</h1>';
  h+=bubble(left>=0?"<p>You did it. Here's the whole picture. Tap any line to change it.</p>":"<p>Here's the whole picture. Tap any line to change it. It's a first draft, and first drafts are meant to be edited.</p>");
  h+='<div class="seg">'+[["week","Per week"],["fortnight","Per fortnight"],["month","Per month"]].map(b=>'<button data-act="pace" data-v="'+b[0]+'" class="'+(S.pace===b[0]?"on":"")+'">'+b[1]+"</button>").join("")+"</div>";
  h+='<div class="picture"><div class="pline"><span class="muted">Comes in</span><b>'+money(inc/per)+" "+unit+"</b></div>"+
     '<div class="pline"><span class="muted">Goes out</span><b>'+money(sp/per)+" "+unit+"</b></div></div>";
  h+='<div class="left"><div class="muted">'+(left>=0?"Left over":"Short by")+" "+unit+'</div><div class="n" style="color:'+(left>=0?"var(--good)":"var(--warn)")+'">'+money(Math.abs(left)/per)+"</div></div>";
  Q.forEach((q,i)=>{if(q.id==="income")return;const t=total(q.id),pc=inc>0?t/inc*100:0,g=linesOf(q.id).some(l=>l.guess);
    h+='<div class="cat" data-act="edit" data-i="'+i+'" style="cursor:pointer"><div class="pline"><span>'+esc(q.short)+(g?'<span class="tag">guess</span>':"")+"</span><b>"+money(t/per)+'</b></div><div class="catbar"><span style="width:'+Math.min(100,pc)+"%;background:"+q.colour+'"></span></div><div class="muted" style="font-size:.85rem">'+Math.round(pc)+"% of what comes in</div></div>"});
  h+=bubble(finalNote(inc,sp,left));
  h+='<button class="btn" data-act="copy">Copy my budget</button><button class="btn ghost small" data-act="restart">Start again</button>';
  h+='<p class="foot">Once your budget exists and you want to run it month by month, that\'s what Comet is for.</p>';
  return h+"</div></main>"
}
function finalNote(inc,sp,left){
  const guesses=Q.reduce((n,q)=>n+linesOf(q.id).filter(l=>l.guess).length,0);
  let t="";
  if(inc<=0)return"<p>I couldn't see any income. Go back to question one and add what comes in, and I'll work it all out.</p>";
  if(left>0){
    t="<p>You have <b>"+money(left)+"</b> a month that hasn't been given a job. Good news. Decide now what it's for, or it quietly disappears.</p><p>A kind first job: build a <b>buffer</b> worth about one fortnight of bills, so a surprise doesn't hurt. After that, more for future you, or more for fun.</p>"
  }else if(left===0){
    t="<p>Every dollar has a job, and it balances exactly. That's the whole idea of a budget.</p>"
  }else{
    t="<p>Your guesses add up to <b>"+money(-left)+"</b> a month more than comes in. That's common on a first go, and it isn't a failure. It just tells us something has to give, or a number is a little off.</p><p>Start with the lines marked <b>guess</b> and see if they're really that high. Then look at the biggest bar. Small changes there help most.</p>"
  }
  if(guesses)t+="<p>You marked <b>"+guesses+"</b> line"+(guesses>1?"s":"")+" as a guess. Over the next month, check your bank app and swap in the real numbers.</p>";
  return t
}

function copyText(){
  const per=PER[S.pace]||1,unit=S.pace==="week"?"week":S.pace==="fortnight"?"fortnight":"month";
  let t="My budget (per "+unit+")\n\nComes in: "+money(income()/per)+"\n";
  Q.forEach(q=>{if(q.id==="income")return;t+=q.short+": "+money(total(q.id)/per)+"\n"});
  t+="\nLeft over: "+money((income()-spent())/per)+"\n\nMade with Budget Buddy by NumeraKey";
  return t
}

/* ---------- render + events ---------- */
function render(){
  const a=$("app");
  a.innerHTML=S.page==="cover"?cover():S.page==="intro"?intro():S.page==="q"?question():results();
  window.scrollTo(0,0)
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function refreshLive(){
  const q=Q[S.step];
  if($("tot"))$("tot").textContent=money(total(q.id));
  if($("pic"))$("pic").innerHTML=pictureBox()
}
function go(p){S.page=p;if(p!=="cover")S.last=p;save();render()}

const ACT={
  begin(){S.step=0;S.lines={};S.none={};S.react="";go("intro")},
  resume(){go(S.last||"q")},
  cover(){go("cover")},
  startq(){S.step=0;S.react="";go("q")},
  prev(){if(S.step===0){go("intro")}else{S.step--;S.react="";go("q")}},
  next(){
    const q=Q[S.step];
    linesOf(q.id);S.lines[q.id]=S.lines[q.id].filter(l=>l.label.trim()||parseFloat(l.amt)>0);
    S.lines[q.id].forEach(l=>{if(!l.label.trim())l.label=q.short});
    S.react=react(q.id)+" <b>"+(S.step+1)+" of "+Q.length+" done.</b>";
    if(S.step>=Q.length-1){S.react="";go("results")}else{S.step++;go("q")}
  },
  skip(){S.react="";if(S.step>=Q.length-1)go("results");else{S.step++;go("q")}},
  addchip(el){const q=Q[S.step];linesOf(q.id).push(newLine(q,el.dataset.v));save();render()},
  addblank(){const q=Q[S.step];linesOf(q.id).push(newLine(q,""));save();render()},
  ball(el){const q=Q[S.step],b=q.ballpark[+el.dataset.i];const l=newLine(q,q.chips[0],b[2],b[3]);l.guess=true;linesOf(q.id).push(l);save();render()},
  del(el){const q=Q[S.step],id=el.closest(".line").dataset.id;S.lines[q.id]=linesOf(q.id).filter(l=>l.id!==id);save();render()},
  none(){const q=Q[S.step];S.none[q.id]=true;S.lines[q.id]=[];save();render()},
  unnone(){const q=Q[S.step];delete S.none[q.id];save();render()},
  pace(el){S.pace=el.dataset.v;save();render()},
  edit(el){S.step=+el.dataset.i;S.react="";go("q")},
  back2q(){S.step=Q.length-1;S.react="";go("q")},
  copy(){const t=copyText();try{navigator.clipboard.writeText(t).then(()=>toast("Copied")).catch(()=>fb(t))}catch(e){fb(t)}},
  restart(){if(confirm("Start again? Your answers will be cleared.")){S=blank();save();go("cover")}}
};
function fb(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied")}catch(e){toast("Couldn't copy")}ta.remove()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e)});
function onField(e){
  const el=e.target,f=el.dataset&&el.dataset.f;if(!f)return;
  const lineEl=el.closest(".line");if(!lineEl)return;
  const q=Q[S.step],l=linesOf(q.id).find(x=>x.id===lineEl.dataset.id);if(!l)return;
  if(f==="guess")l[f]=el.checked;else l[f]=el.value;
  if(f==="amt"&&el.value!==""&&parseFloat(el.value)<0){l.amt="";el.value=""}
  save();refreshLive()
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);
render();
</script>
</body>
</html>
