<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030708">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Write My Resume">
<title>Write My Resume</title>
<style>
:root{--bg:#030708;--card:#0a1316;--card2:#0f1b1f;--line:#1c2f34;--tx:#eef8fa;--mu:#9ab3b8;--p:#1fb6c9;--k:#0e8fa0;--ok:#86efac;--bad:#fb7185;--grad:linear-gradient(90deg,#0e8fa0,#1fb6c9)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh}
#app{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;line-height:1.2}
h1.g,h2.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
h1.g{font-size:2rem}
h2.g{font-size:1.5rem}
a{color:var(--p)}
p{margin:.4em 0}
.mu{color:var(--mu)}
.sm{font-size:.88rem}
.top{display:flex;align-items:center;gap:10px;padding:18px 0 10px}
.top .back{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:8px 12px;text-decoration:none;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card.link{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--tx)}
.card.link:active{background:var(--card2)}
.card .t{font-weight:700}
.dot{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--mu);font-weight:700;font-size:.9rem}
.dot.on{background:var(--grad);border-color:transparent;color:#061014}
.grow{flex:1;min-width:0}
.chev{color:var(--mu);font-size:1.3rem}
label.f{display:block;margin:12px 0}
label.f>span{display:block;font-size:.85rem;color:var(--mu);margin-bottom:5px}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea,select{width:100%;background:#061014;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--p)}
textarea{resize:vertical;min-height:110px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 18px;font:inherit;font-weight:700;color:#061014;background:var(--grad);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:9px 13px;font-size:.9rem;border-radius:12px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #4a1f2b}
.btn.block{display:block;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:#061014;color:var(--tx);border-radius:999px;padding:8px 13px;font:inherit;font-size:.92rem;cursor:pointer}
.chip.on{background:var(--grad);color:#061014;border-color:transparent;font-weight:700}
.chip.add{border-style:dashed;color:var(--mu)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 0 6px}
.hero svg{width:min(260px,70vw);height:auto}
.note{background:#0a1719;border:1px solid #1d3c42;border-radius:14px;padding:12px 14px;color:#bfe4ea;font-size:.92rem;margin:12px 0}
.warn{background:#1c1016;border:1px solid #44212f;color:#f6c6d3}
.pill{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--mu);margin-right:6px}
.bul{margin:8px 0 0;padding-left:20px}
.bul li{margin:3px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.chk input{margin-top:5px;width:18px;height:18px;accent-color:#1fb6c9;flex:0 0 auto}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tpl{border:2px solid var(--line);background:#061014;border-radius:14px;padding:8px;color:var(--tx);font:inherit;cursor:pointer;text-align:center}
.tpl.on{border-color:var(--p)}
.tpl svg{width:100%;height:auto;display:block;margin-bottom:4px}
details.card>summary{cursor:pointer;font-weight:700;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";float:right;color:var(--mu)}
details.card[open]>summary::after{content:"－"}
#nav{position:fixed;left:0;right:0;bottom:0;background:rgba(3,7,8,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
#nav a{flex:1;max-width:160px;text-align:center;text-decoration:none;color:var(--mu);font-size:.72rem;padding:4px 0}
#nav a svg{width:24px;height:24px;display:block;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#nav a.on{color:var(--p)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#122125;border:1px solid #2a4a52;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:88vw;text-align:center}
#toast.show{opacity:1}
#modal:empty{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:60;padding:20px}
#modal .box{background:#0a1316;border:1px solid var(--line);border-radius:18px;padding:20px;max-width:420px;width:100%}
.gap{border:1px dashed #2a4a52;background:#081316;border-radius:14px;padding:12px 14px;margin:10px 0}
.ring{display:flex;align-items:center;gap:10px;margin:6px 0 0}
.bar{height:8px;background:#132125;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--grad)}
#printzone{display:none}
.pvbar{position:sticky;top:0;background:rgba(3,7,8,.95);padding:10px 0;z-index:10;border-bottom:1px solid var(--line)}
#pvwrap{margin:14px 0;overflow:hidden;border-radius:6px;background:#fff}

/* ===== paper (CV and letter) ===== */
.paper{width:210mm;background:#fff;color:#1c1c24;font:10.5pt/1.45 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;transform-origin:top left}
.paper table.sheet{width:100%;border-collapse:collapse}
.paper .sp{height:13mm}
.paper td.body{padding:0 16mm;vertical-align:top}
.paper h1{font-size:25pt;margin:0;letter-spacing:.2px;color:#14141c}
.paper .ttl{font-size:12pt;color:var(--ac);margin-top:2px;font-weight:600}
.paper .ct{font-size:9.5pt;color:#4b4b58;margin-top:6px}
.paper h2{font-size:10pt;text-transform:uppercase;letter-spacing:1.4px;color:var(--ac);margin:17px 0 6px;break-after:avoid}
.paper p{margin:0 0 6px}
.paper .role{margin:0 0 11px;break-inside:avoid}
.paper .rh{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.paper .rt{font-weight:700;font-size:11pt}
.paper .rd{font-size:9.5pt;color:#555563;white-space:nowrap}
.paper .ro{color:#3f3f4c;font-size:10pt}
.paper ul{margin:4px 0 0;padding-left:17px}
.paper li{margin:1.5px 0}
.paper .sk{margin:0}
.paper .rf{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.paper .rf div{break-inside:avoid;font-size:10pt}
/* classic */
.t-classic h1{font-family:Georgia,"Times New Roman",serif;text-align:center;font-weight:700}
.t-classic .ttl,.t-classic .ct{text-align:center}
.t-classic h2{border-bottom:1.4px solid var(--ac);padding-bottom:3px;letter-spacing:1.2px}
.t-classic .sk{display:block}
/* modern */
.t-modern .band{background:var(--ac);color:#fff;padding:15mm 16mm 9mm}
.t-modern .band h1{color:#fff}
.t-modern .band .ttl{color:#ffffffdd}
.t-modern .band .ct{color:#ffffffe6}
.t-modern .sp{height:7mm}
.t-modern h2{margin-top:15px}
.t-modern .pillz{display:flex;flex-wrap:wrap;gap:6px}
.t-modern .pillz span{border:1.2px solid var(--ac);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:9.5pt;font-weight:600}
/* minimal */
.t-minimal h1{font-weight:300;font-size:28pt}
.t-minimal .ttl{color:#555563;font-weight:400}
.t-minimal h2{font-weight:600;color:#14141c;letter-spacing:2px;border-top:1px solid #d9d9e2;padding-top:9px}
.t-minimal h2:first-of-type{margin-top:15px}
.t-minimal .rd{color:var(--ac);font-weight:600}
/* letter */
.t-letter p{margin:0 0 11px;white-space:pre-wrap}
.t-letter .ldate{margin:20px 0 14px;color:#3f3f4c}
.t-letter .lhead{border-bottom:2px solid var(--ac);padding-bottom:9px;margin-bottom:8px}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important}
  body>*:not(#printzone){display:none!important}
  #printzone{display:block!important}
  #printzone .paper{transform:none!important;width:210mm}
}
</style>
</head>
<body>
<div id="app"><main id="main"></main></div>
<nav id="nav"></nav>
<div id="printzone"></div>
<div id="toast"></div>
<div id="modal"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const KEY='hireme.v1';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ACCENTS=[['#0e8fa0','Teal'],['#0891b2','Blue-teal'],['#047857','Green'],['#1e40af','Navy'],['#27272a','Charcoal']];
const TYPES=[['job','Paid job'],['self','Self-employed'],['vol','Volunteer work'],['care','Caring or family'],['study','Study or project'],['break','Career break']];
const SKILLSETS=[
 ['People',['Customer service','Teamwork','Communication','Conflict resolution','Phone manner','Sales','Training others','Leadership']],
 ['Practical',['Cash handling','Time management','Problem solving','Stock control','Cleaning','Cooking','Manual handling','Driving','Gardening']],
 ['Office & tech',['Data entry','Microsoft Office','Email and calendar','Social media','Bookkeeping','Typing','Customer records','Scheduling']],
 ['Care',['Personal care','Medication prompting','Patience','Child care','Aged care','Disability support','First aid']],
 ['Tickets & licences',["Current driver's licence",'Own car','White Card','RSA','RCG','First Aid (HLTAID011)','Working With Children Check','National Police Check','Forklift licence']]
];
const STR=['reliable','organised','calm under pressure','detail-focused','friendly','hardworking','adaptable','self-motivated','caring','patient','positive','punctual'];
const VERBS=('answer,answering,answered;serve,serving,served;clean,cleaning,cleaned;pack,packing,packed;prepare,preparing,prepared;train*,training,trained;look,looking,looked;deal,dealing,dealt;work*,working,worked;make,making,made;organise,organising,organised;organize,organizing,organized;manage,managing,managed;handle,handling,handled;process*,processing,processed;help,helping,helped;care*,caring,cared;drive,driving,drove;take,taking,took;write,writing,wrote;run,running,ran;lead*,leading,led;sell,selling,sold;check*,checking,checked;order*,ordering,ordered;stock*,stocking,stocked;restock,restocking,restocked;supervise,supervising,supervised;coordinate,coordinating,coordinated;plan*,planning,planned;deliver,delivering,delivered;greet,greeting,greeted;assist,assisting,assisted;operate,operating,operated;maintain,maintaining,maintained;monitor,monitoring,monitored;resolve,resolving,resolved;respond,responding,responded;support*,supporting,supported;teach,teaching,taught;tutor,tutoring,tutored;cook,cooking,cooked;bake,baking,baked;create,creating,created;build,building,built;repair,repairing,repaired;install,installing,installed;inspect,inspecting,inspected;unload,unloading,unloaded;load,loading,loaded;count,counting,counted;balance,balancing,balanced;reconcile,reconciling,reconciled;enter,entering,entered;schedule,scheduling,scheduled;book,booking,booked;arrange,arranging,arranged;liaise,liaising,liaised;communicate,communicating,communicated;negotiate,negotiating,negotiated;recruit,recruiting,recruited;mentor,mentoring,mentored;coach,coaching,coached;volunteer*,volunteering,volunteered;fundraise,fundraising,fundraised;raise,raising,raised;cover,covering,covered;open,opening,opened;close*,closing,closed;lock,locking,locked;wash,washing,washed;sort,sorting,sorted;label,labelling,labelled;wrap,wrapping,wrapped;dispatch,dispatching,dispatched;receive,receiving,received;record*,recording,recorded;report*,reporting,reported;review,reviewing,reviewed;develop,developing,developed;improve,improving,improved;reduce,reducing,reduced;increase,increasing,increased;achieve,achieving,achieved;complete,completing,completed;ensure,ensuring,ensured;keep,keeping,kept;follow,following,followed;use,using,used;perform,performing,performed;attend,attending,attended;participate,participating,participated;welcome,welcoming,welcomed;advise,advising,advised;paint,painting,painted;mow,mowing,mowed;garden,gardening,gardened;feed,feeding,fed;walk,walking,walked;transport,transporting,transported;lift,lifting,lifted').split(';');
const VMAP={};
VERBS.forEach(v=>{const p=v.split(',');let b=p[0],amb=false;if(b.slice(-1)==='*'){amb=true;b=b.slice(0,-1)}const e={base:b,past:p[2]};if(!amb)VMAP[b]=e;VMAP[p[1]]=e;VMAP[p[2]]=e;});
const STOP=new Set('the and for with that this from have your will you our are was were been they them their what when where which who whom while also able more than such into about over under other some any can may must should would could including include includes etc experience required skills work working role team ability strong looking join company business position candidate successful responsible days years year good great well need needs make high level across within using use new help'.split(' '));

/* ---------- state ---------- */
let S;
function uid(){return Math.random().toString(36).slice(2,9)}
function newVersion(name){return {id:uid(),name:name||'My CV',ad:'',tpl:'modern',accent:'#0e8fa0',showSummary:true,rolesOff:[],linesOff:{},skillsOff:[],letter:{company:'',person:'',role:'',found:'',why:'',text:''}}}
function blank(){return {profile:{name:'',title:'',phone:'',email:'',place:'',link:'',summary:''},roles:[],skills:[],edu:[],refs:{onRequest:true,list:[]},versions:[],sum:{role:'',years:'1-3',str:[],ret:false,v:0},polish:true}}
function load(){
  try{const r=localStorage.getItem(KEY);S=r?Object.assign(blank(),JSON.parse(r)):blank()}catch(e){S=blank()}
  if(!S.versions||!S.versions.length)S.versions=[newVersion('My CV')];
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(flush,200)}
function flush(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function lcf(s){return s?s.charAt(0).toLowerCase()+s.slice(1):s}
function resolve(path,create){
  const parts=path.split('.');let cur=S;
  for(let i=0;i<parts.length-1;i++){
    const k=parts[i];
    cur=Array.isArray(cur)?cur.find(x=>x.id===k):cur[k];
    if(cur==null)return null;
  }
  return {o:cur,k:parts[parts.length-1]};
}
function get(path){const r=resolve(path);if(!r)return '';const o=r.o;const v=Array.isArray(o)?(o.find(x=>x.id===r.k)):o[r.k];return v==null?'':v}
function set(path,val){const r=resolve(path);if(r)r.o[r.k]=val}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function ask(msg,yesLabel,fn){
  const m=$('#modal');
  m.innerHTML='<div class="box"><p>'+esc(msg)+'</p><div class="btns"><button class="btn danger" id="mY">'+esc(yesLabel)+'</button><button class="btn ghost" id="mN">Cancel</button></div></div>';
  $('#mN').onclick=()=>{m.innerHTML=''};
  $('#mY').onclick=()=>{m.innerHTML='';fn()};
}
function joinList(a){return a.length<=1?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1]}

/* ---------- dates ---------- */
function parseYM(s){if(!s)return null;const p=String(s).split('-');return {y:+p[0],m:p[1]?+p[1]:0}}
function fmtYM(s){const d=parseYM(s);if(!d||!d.y)return '';return d.m?MON[d.m-1]+' '+d.y:String(d.y)}
function months(s,endish){const d=parseYM(s);if(!d||!d.y)return 0;return d.y*12+(d.m||(endish?12:1))}
function roleDates(r){
  const a=fmtYM(r.start);if(!a&&!r.current&&!r.end)return '';
  const b=r.current?'Present':fmtYM(r.end);
  return (a||'')+(a&&b?' – ':(b?'Until ':''))+(b||'');
}
function sortedRoles(){
  return S.roles.slice().sort((a,b)=>{
    const ea=a.current?1e9:months(a.end,true),eb=b.current?1e9:months(b.end,true);
    if(ea!==eb)return eb-ea;
    return months(b.start)-months(a.start);
  });
}
function findGaps(){
  const r=sortedRoles(),out=[];
  for(let i=1;i<r.length;i++){
    const n=r[i-1],o=r[i];
    if(!o.end||o.current||!n.start)continue;
    const g=months(n.start)-months(o.end,true)-1;
    if(g>=6)out.push({from:o.end,to:n.start,n:g});
  }
  return out;
}
function dur(n){const y=Math.floor(n/12),m=n%12;return (y?y+' yr'+(y>1?'s':''):'')+(y&&m?' ':'')+(m?m+' mth'+(m>1?'s':''):'')}

/* ---------- wording tidy-up (runs on this device, invents nothing) ---------- */
function polish(raw,current){
  let s=String(raw).trim().replace(/^[-•*–·\d.)\s]+/,'');
  if(!s)return '';
  s=s.replace(/^i\s+(also\s+)?/i,'');
  s=s.replace(/^my\s+(job|role|duties?)\s+(was|were|is|are)\s+(to\s+)?/i,'');
  s=s.replace(/^(was|am|were)\s+in charge of\s+/i,'take charge of ');
  s=s.replace(/^in charge of\s+/i,'take charge of ');
  s=s.replace(/^(was|am|were)\s+(responsible for)\s+/i,'responsible for ');
  s=s.replace(/\s+/g,' ').replace(/[.\s]+$/,'');
  const m=s.match(/^([A-Za-z']+)(.*)$/);
  if(m){
    const e=VMAP[m[1].toLowerCase()];
    if(e&&m[2].trim()){s=cap(current?e.base:e.past)+m[2]}
  }
  return cap(s);
}
function rawLines(r){return (String(r.duties||'')+'\n'+String(r.wins||'')).split('\n').map(x=>x.trim()).filter(Boolean)}
function bulletsFor(r){
  return rawLines(r).map(raw=>({raw,text:S.polish?polish(raw,r.current):cap(raw.replace(/^[-•*–·\s]+/,''))}));
}
function leadsWithVerb(t){const m=String(t).match(/^([A-Za-z']+)/);return !!(m&&VMAP[m[1].toLowerCase()])}

/* ---------- CV data ---------- */
function cvData(v){
  const roles=sortedRoles().filter(r=>!v.rolesOff.includes(r.id)).map(r=>({
    title:r.title||'(untitled)',org:[r.org,r.place].filter(Boolean).join(', '),orgOnly:r.org,dates:roleDates(r),current:!!r.current,
    bullets:bulletsFor(r).filter(b=>!((v.linesOff[r.id]||[]).includes(b.raw))).map(b=>b.text)
  }));
  const skills=S.skills.filter(s=>!v.skillsOff.includes(s));
  return {p:S.profile,summary:v.showSummary?S.profile.summary.trim():'',roles,skills,edu:S.edu,refs:S.refs};
}
function contactLine(p){return [p.phone,p.email,p.place,p.link].filter(Boolean).map(esc).join('  ·  ')}
function cvHTML(v){
  const d=cvData(v),p=d.p,t=v.tpl;
  const head='<h1>'+esc(p.name||'Your Name')+'</h1>'+(p.title?'<div class="ttl">'+esc(p.title)+'</div>':'')+'<div class="ct">'+contactLine(p)+'</div>';
  let b='';
  if(t!=='modern')b+=head;
  if(d.summary)b+='<h2>Profile</h2><p>'+esc(d.summary)+'</p>';
  if(d.roles.length){
    b+='<h2>Experience</h2>';
    d.roles.forEach(r=>{
      b+='<div class="role"><div class="rh"><span class="rt">'+esc(r.title)+'</span><span class="rd">'+esc(r.dates)+'</span></div>'+(r.org?'<div class="ro">'+esc(r.org)+'</div>':'')+(r.bullets.length?'<ul>'+r.bullets.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'</div>';
    });
  }
  if(d.skills.length){
    b+='<h2>Skills</h2>';
    b+=t==='modern'?'<div class="pillz">'+d.skills.map(s=>'<span>'+esc(s)+'</span>').join('')+'</div>':'<p class="sk">'+d.skills.map(esc).join('  ·  ')+'</p>';
  }
  if(d.edu.length){
    b+='<h2>Education &amp; training</h2>';

/* ---------- job-ad matching ---------- */
function stem(w){return w.length>5?w.replace(/(ing|ed|es|s)$/,''):w}
function kw(text){
  const m=new Map(),words=String(text).toLowerCase().match(/[a-z][a-z'-]{2,}/g)||[];
  words.forEach(w=>{if(w.length<4||STOP.has(w))return;const s=stem(w);const e=m.get(s)||{n:0,w:w};e.n++;m.set(s,e)});
  return m;
}
function score(text,ad){let n=0;const seen=new Set();kw(text).forEach((e,s)=>{if(!seen.has(s)&&ad.has(s)){n+=ad.get(s).n;seen.add(s)}});return n}
function matchAd(v){
  const ad=kw(v.ad);
  if(!ad.size){toast('Paste the job ad first');return}
  const roles=sortedRoles();v.rolesOff=[];v.linesOff={};v.skillsOff=[];
  roles.forEach((r,i)=>{
    const bl=bulletsFor(r),sc=bl.map(b=>({raw:b.raw,s:score(b.raw,ad)}));
    const total=sc.reduce((a,x)=>a+x.s,0)+score(r.title,ad);
    if(i>=4&&total===0){v.rolesOff.push(r.id);return}
    if(bl.length>6){
      const keep=new Set(sc.map((x,j)=>({x,j})).sort((a,b)=>b.x.s-a.x.s||a.j-b.j).slice(0,6).map(o=>o.x.raw));
      v.linesOff[r.id]=sc.map(x=>x.raw).filter(x=>!keep.has(x));
    }
  });
  const sk=S.skills.map((s,i)=>({s,i,n:score(s,ad)})).sort((a,b)=>b.n-a.n||a.i-b.i);
  const keep=new Set(sk.filter((x,j)=>x.n>0||j<8).slice(0,12).map(x=>x.s));
  v.skillsOff=S.skills.filter(s=>!keep.has(s));
  save();
}
function missingKeywords(v){
  const ad=kw(v.ad);if(!ad.size)return [];
  let own=S.profile.summary+' '+S.profile.title+' '+S.skills.join(' ');
  S.roles.forEach(r=>{own+=' '+r.title+' '+r.duties+' '+r.wins});
  const have=new Set(kw(own).keys());
  return Array.from(ad.entries()).filter(([s,e])=>!have.has(s)).sort((a,b)=>b[1].n-a[1].n).slice(0,10).map(x=>x[1].w);
}

function genSummary(){
  const q=S.sum,role=(q.role||'professional').trim().toLowerCase();
  const yrs={'new':'a fresh perspective and a strong willingness to learn','1-3':'a few years of hands-on experience','3-10':'several years of hands-on experience','10+':'over ten years of experience'}[q.years];
  const st=q.str.length?q.str:['reliable','hardworking'];
  const adj=joinList(st.slice(0,3));
  const variants=[
    cap(adj)+' '+role+' with '+yrs+'. Takes pride in doing the job properly and being someone the team can count on.',
    cap(role)+' with '+yrs+', bringing a '+joinList(st.slice(0,2))+' approach to every task. Looking for a role where I can keep learning and contribute from day one.',
    cap(joinList(st.slice(0,2)))+' '+role+'. '+cap(yrs)+'. Keen to bring these strengths to a new team.'
  ];
  let t=variants[q.v%3];
  if(q.ret)t+=' Returning to work after a break, and ready to bring renewed energy.';
  S.profile.summary=t;save();
}
function clause(b){
  if(/^responsible/i.test(b))return 'I was '+lcf(b);
  if(leadsWithVerb(b))return 'I '+lcf(b);
  return 'my duties included '+lcf(b);
}
function genLetter(v){
  const L=v.letter,P=S.profile,d=cvData(v);
  const co=L.company||'your organisation',role=L.role||P.title||'advertised';
  const out=[];
  out.push(L.person?'Dear '+L.person+',':'Dear Hiring Manager,');
  out.push('I am writing to apply for the '+role+' position at '+co+(L.found?', which I saw '+L.found:'')+'.');
  const r=d.roles[0];
  if(r&&r.bullets.length){
    let s=(r.current?'Currently':'Most recently')+', in my role as '+r.title+(r.orgOnly?' at '+r.orgOnly:'')+', '+clause(r.bullets[0])+'.';
    if(r.bullets[1]&&leadsWithVerb(r.bullets[1]))s+=' I also '+lcf(r.bullets[1])+'.';
    out.push(s);
  }
  if(d.skills.length>=2){
    const sk=d.skills.slice(0,4).map(x=>x.slice(1)===x.slice(1).toLowerCase()?lcf(x):x);
    out.push('My strengths include '+joinList(sk)+'.');
  }
  out.push(L.why&&L.why.trim()?L.why.trim():'I am keen to bring my experience to '+co+' and would welcome the chance to contribute to your team.');
  const reach=[P.phone,P.email].filter(Boolean);
  out.push('Thank you for considering my application. I would welcome the opportunity to discuss it further'+(reach.length?' and can be reached on '+reach.join(' or ')+'.':'.'));
  out.push('Kind regards,\n'+(P.name||''));
  L.text=out.join('\n\n');save();
}

  S.edu.forEach(e=>{const p='edu.'+e.id;h+='<div class="card">'+inp('Qualification or course',p+'.name',{ph:'e.g. Certificate III in Individual Support'})+inp('School or provider',p+'.org')+inp('Year finished',p+'.year',{ph:'e.g. 2022'})+inp('Note (optional)',p+'.note',{ph:'e.g. Completed with distinction'})+'<button class="btn sm danger" data-act="deledu" data-id="'+e.id+'">Remove</button></div>'});
  h+='<div class="btns"><button class="btn block" data-act="addedu">+ Add education or training</button></div>';
  return h;
}
function vRefs(){
  let h=top('Referees','#/home');
  h+='<div class="note">Always ask people before you list them. Two referees from recent jobs is usual.</div><div class="card">'+chk('refs.onRequest','Just say “Available on request”',{render:1})+'</div>';
  if(!S.refs.onRequest){
    S.refs.list.forEach(r=>{const p='refs.list.'+r.id;h+='<div class="card">'+inp('Name',p+'.name')+inp('Position',p+'.pos')+inp('Business',p+'.org')+inp('Phone',p+'.phone',{type:'tel'})+inp('Email',p+'.email',{type:'email'})+inp('How they know your work',p+'.rel',{ph:'e.g. My manager at Corner Café, 2021–2023'})+'<button class="btn sm danger" data-act="delref" data-id="'+r.id+'">Remove</button></div>'});
    h+='<div class="btns"><button class="btn block" data-act="addref">+ Add a referee</button></div>';
  }
  return h;
}
function vCvs(){
  let h=top('My CVs',null)+'<p class="mu">Make a different version for each job. Same record, different focus.</p>';
  S.versions.forEach(v=>{
    h+='<div class="card"><div class="t">'+esc(v.name)+'</div><div class="mu sm">'+cap(v.tpl)+' · '+ACCENTS.find(a=>a[0]===v.accent)?.[1]+'</div><div class="btns"><a class="btn sm" href="#/preview/'+v.id+'">Preview and print</a><a class="btn sm ghost" href="#/cv/'+v.id+'">Tailor</a><button class="btn sm ghost" data-act="dupcv" data-id="'+v.id+'">Copy</button>'+(S.versions.length>1?'<button class="btn sm danger" data-act="delcv" data-id="'+v.id+'">Delete</button>':'')+'</div></div>';
  });
  h+='<div class="btns"><button class="btn block" data-act="newcv">+ New CV for a job</button></div>';
  if(!S.roles.length)h+='<div class="note warn">Your CV is empty so far. <a href="#/work">Add your work history</a> first.</div>';
  return h;
}
function vCv(id){
  const v=S.versions.find(x=>x.id===id);if(!v)return '<p>Not found. <a href="#/cvs">Back</a></p>';
  const p='versions.'+id;
  let h=top('Tailor this CV','#/cvs');
  h+='<div class="card">'+inp('Name this CV',p+'.name',{ph:'e.g. Aged care – Sunrise Village'})+'<span class="mu sm">Look</span><div class="tpls" style="margin:6px 0">'+['classic','modern','minimal'].map(t=>'<button class="tpl'+(v.tpl===t?' on':'')+'" data-act="tpl" data-id="'+id+'" data-v="'+t+'">'+TPLSVG[t]+cap(t)+'</button>').join('')+'</div><span class="mu sm">Colour</span><div class="sw">'+ACCENTS.map(a=>'<button class="'+(v.accent===a[0]?'on':'')+'" style="background:'+a[0]+'" aria-label="'+a[1]+'" data-act="accent" data-id="'+id+'" data-v="'+a[0]+'"></button>').join('')+'</div>'+chk(p+'.showSummary','Show my profile')+'</div>';
  h+='<div class="card"><h3>Match it to a job</h3><p class="mu sm">Paste the job ad. The app picks your most relevant roles, lines and skills. You can change any of them below.</p>'+area('',p+'.ad',{rows:5,ph:'Paste the job ad here'})+'<button class="btn sm" data-act="match" data-id="'+id+'">Match to this job</button><div id="miss"></div></div>';
  h+='<h3 style="margin-top:20px">What goes on this CV</h3>';
  const rs=sortedRoles();
  if(!rs.length)h+='<p class="mu">No roles yet.</p>';
  rs.forEach(r=>{
    const off=v.rolesOff.includes(r.id),lo=v.linesOff[r.id]||[];
    h+='<div class="card"><label class="chk"><input type="checkbox" data-chg="role" data-id="'+v.id+'" data-r="'+r.id+'"'+(off?'':' checked')+'><span><b>'+esc(r.title||'(untitled)')+'</b><br><span class="mu sm">'+esc([r.org,roleDates(r)].filter(Boolean).join(' · '))+'</span></span></label>';
    if(!off)bulletsFor(r).forEach((b,i)=>{h+='<label class="chk" style="margin-left:26px"><input type="checkbox" data-chg="line" data-id="'+v.id+'" data-r="'+r.id+'" data-i="'+i+'"'+(lo.includes(b.raw)?'':' checked')+'><span class="sm">'+esc(b.text)+'</span></label>'});
    h+='</div>';
  });
  if(S.skills.length){h+='<div class="card"><b>Skills</b><div class="chips">'+S.skills.map(s=>'<button class="chip'+(v.skillsOff.includes(s)?'':' on')+'" data-act="skoff" data-id="'+id+'" data-v="'+esc(s)+'">'+esc(s)+'</button>').join('')+'</div></div>'}
  h+='<div class="btns"><a class="btn" href="#/preview/'+id+'">Preview and print</a></div>';
  return h;
}
function showMissing(id){
  const v=S.versions.find(x=>x.id===id),el=$('#miss');if(!el||!v)return;
  const m=missingKeywords(v);
  el.innerHTML=m.length?'<div class="note" style="margin-top:12px"><b>Words in the ad that are not in your record:</b><br>'+m.map(esc).join(', ')+'<br><span class="sm">Only add them if they are true for you.</span></div>':'';
}
function vPreview(id,kind){
  const v=S.versions.find(x=>x.id===id);if(!v)return '<p>Not found.</p>';
  const isL=kind==='letter';
  let h='<div class="pvbar"><div class="row" style="align-items:center"><a class="btn sm ghost" style="flex:0 0 auto" href="'+(isL?'#/letter':'#/cv/'+id)+'">‹ Back</a><button class="btn sm" data-act="print" data-id="'+id+'" data-k="'+(isL?'l':'c')+'">Print / Save PDF</button></div><div class="btns" style="margin:8px 0 0"><button class="btn sm ghost" data-act="copy" data-id="'+id+'" data-k="'+(isL?'l':'c')+'">Copy text</button><button class="btn sm ghost" data-act="txt" data-id="'+id+'" data-k="'+(isL?'l':'c')+'">Download .txt</button></div></div>';
  h+='<p class="mu sm" id="pages"></p><div id="pvwrap">'+(isL?letterHTML(v):cvHTML(v))+'</div>';
  h+='<div class="note">To save a PDF, choose Print, then pick “Save as PDF” as the printer. If you see headers and footers, turn them off.</div>';
  return h;
}
function fitPaper(){
  const w=$('#pvwrap');if(!w)return;
  const p=w.querySelector('.paper');if(!p)return;
  p.style.transform='none';
  const full=p.offsetWidth,s=Math.min(1,w.clientWidth/full);
  p.style.transform='scale('+s+')';
  w.style.height=(p.offsetHeight*s)+'px';
  const pg=Math.max(1,Math.round(p.offsetHeight/1122));
  const el=$('#pages');
  if(el)el.textContent=(w.querySelector('.t-letter')?'':'About '+pg+' page'+(pg>1?'s. ':'. ')+(pg>2?'Most employers like one or two pages. Untick older roles or lines in Tailor.':''));
}
function vLetter(){
  if(!S.lv||!S.versions.find(x=>x.id===S.lv))S.lv=S.versions[0].id;
  const v=S.versions.find(x=>x.id===S.lv),p='versions.'+v.id+'.letter';
  let h=top('Cover letter',null);
  h+='<div class="card"><label class="f"><span>Use the details from this CV</span><select id="lvSel">'+S.versions.map(x=>'<option value="'+x.id+'"'+(x.id===v.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label>'+inp('Job you are applying for',p+'.role',{ph:S.profile.title||'e.g. Receptionist'})+inp('Business name',p+'.company')+inp('Who is it to? (optional)',p+'.person',{ph:'e.g. Ms Nguyen'})+inp('Where did you see it? (optional)',p+'.found',{ph:'e.g. on Seek'})+area('Why this job or business? A sentence or two in your own words.',p+'.why',{rows:3})+'<button class="btn" data-act="genletter">Write my letter</button></div>';
  h+='<div class="card"><h3>Your letter</h3><p class="mu sm">Edit anything. Read it through before you send it.</p><textarea data-bind="'+p+'.text" rows="16" placeholder="Press “Write my letter” to start.">'+esc(v.letter.text)+'</textarea><div class="btns"><a class="btn sm" href="#/lpreview/'+v.id+'">Preview and print</a></div></div>';
  return h;
}
function vBackup(){
  let h=top('Backup',null);
  h+='<div class="card"><h3>Keep a copy</h3><p class="mu sm">Your details live only in this browser. Save a backup file now and then, especially before clearing your browser data or changing phones.</p><div class="btns"><button class="btn" data-act="export">Save a backup file</button><button class="btn ghost" data-act="import">Restore from a file</button></div><input type="file" id="impFile" accept=".json,application/json" hidden></div>';
  h+='<div class="card"><h3>Add to your home screen</h3><p class="mu sm">In your browser menu, choose “Add to Home screen” or “Install app” and it opens like any other app.</p></div>';
  h+='<div class="card"><h3>Clear everything</h3><p class="mu sm">Removes all your details from this device.</p><button class="btn danger sm" data-act="wipe">Clear everything</button></div>';
  return h;
}

/* ---------- router ---------- */
let lastRoute='';
function leaveCleanup(){
  const m=lastRoute.match(/^#\/role\/(.+)$/);
  if(m){const r=S.roles.find(x=>x.id===m[1]);if(r&&!r.title&&!r.org&&!rawLines(r).length){S.roles=S.roles.filter(x=>x!==r);save()}}
}
function render(){
  const hash=location.hash||'#/home';
  if(hash!==lastRoute)leaveCleanup();
  const parts=hash.replace('#/','').split('/'),route=parts[0]||'home',id=parts[1];
  let h='';
  switch(route){
    case 'about':h=vAbout();break;
    case 'work':h=vWork();break;
    case 'role':h=vRole(id);break;
    case 'skills':h=vSkills();break;
    case 'edu':h=vEdu();break;
    case 'refs':h=vRefs();break;
    case 'cvs':h=vCvs();break;
    case 'cv':h=vCv(id);break;
    case 'preview':h=vPreview(id,'cv');break;
    case 'letter':h=vLetter();break;
    case 'lpreview':h=vPreview(id,'letter');break;
    case 'backup':h=vBackup();break;
    default:h=vHome();
  }
  $('#main').innerHTML=h;
  $('#nav').innerHTML=navHTML(route);
  if(hash!==lastRoute)window.scrollTo(0,0);
  lastRoute=hash;
  if(route==='role')updateRolePrev();
  if(route==='preview'||route==='lpreview')requestAnimationFrame(fitPaper);
}
window.addEventListener('hashchange',render);
window.addEventListener('resize',()=>{if($('#pvwrap'))fitPaper()});

/* ---------- events ---------- */
function onField(e){
  const t=e.target;
  if(t.dataset.bind){
    set(t.dataset.bind,t.type==='checkbox'?t.checked:t.value);save();
    if(t.dataset.after==='rolePrev')updateRolePrev();
    if(t.dataset.render&&e.type==='change')render();
  }else if(t.dataset.part){
    const box=t.closest('[data-ym]'),m=box.querySelector('[data-part=m]').value,y=box.querySelector('[data-part=y]').value;
    set(box.dataset.ym,y?(m?y+'-'+String(m).padStart(2,'0'):y):'');save();
  }else if(t.id==='lvSel'&&e.type==='change'){S.lv=t.value;save();render()}
  else if(t.dataset.chg&&e.type==='change'){
    const v=S.versions.find(x=>x.id===t.dataset.id);if(!v)return;
    if(t.dataset.chg==='role'){
      v.rolesOff=v.rolesOff.filter(x=>x!==t.dataset.r);if(!t.checked)v.rolesOff.push(t.dataset.r);save();render();
    }else{
      const r=S.roles.find(x=>x.id===t.dataset.r),b=bulletsFor(r)[+t.dataset.i];if(!b)return;
      const lo=(v.linesOff[r.id]||[]).filter(x=>x!==b.raw);if(!t.checked)lo.push(b.raw);v.linesOff[r.id]=lo;save();
    }
  }
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);

function download(name,type,text){
  const b=new Blob([text],{type:type}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>fallbackCopy(t))}else fallbackCopy(t);
}
function fallbackCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Could not copy')}a.remove()}
function textFor(v,k){return k==='l'?[S.profile.name,[S.profile.phone,S.profile.email].filter(Boolean).join(' | '),'',longDate(),'',v.letter.company,'',v.letter.text].join('\n'):cvText(v)}
function fileName(v,k){return ((S.profile.name||'my').replace(/[^A-Za-z0-9]+/g,'-')+'-'+(k==='l'?'cover-letter':'CV')).replace(/^-|-$/g,'')}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const id=a.dataset.id,v=S.versions.find(x=>x.id===id);
  switch(a.dataset.act){
    case 'str':{const q=S.sum.str,i=q.indexOf(a.dataset.v);if(i>-1)q.splice(i,1);else if(q.length<3)q.push(a.dataset.v);else toast('Three is plenty');save();render();const dd=document.querySelector('details.card');if(dd)dd.open=true;break}
    case 'gensum':genSummary();render();toast('Profile written. Edit it to sound like you.');break;
    case 'nextsum':S.sum.v++;genSummary();render();break;
    case 'addrole':{const r={id:uid(),type:'job',title:'',org:'',place:'',start:'',end:'',current:!S.roles.length,duties:'',wins:''};S.roles.push(r);save();location.hash='#/role/'+r.id;break}
    case 'gapadd':{const r={id:uid(),type:'break',title:'Career break',org:'',place:'',start:a.dataset.from,end:a.dataset.to,current:false,duties:'',wins:''};S.roles.push(r);save();location.hash='#/role/'+r.id;break}
    case 'delrole':ask('Delete this role?','Delete',()=>{S.roles=S.roles.filter(x=>x.id!==id);S.versions.forEach(x=>{x.rolesOff=x.rolesOff.filter(y=>y!==id);delete x.linesOff[id]});save();location.hash='#/work'});break;
    case 'skill':{const s=a.dataset.v,i=S.skills.indexOf(s);if(i>-1)S.skills.splice(i,1);else S.skills.push(s);save();const y=window.scrollY;render();window.scrollTo(0,y);break}
    case 'skadd':{const i=$('#skNew'),s=i.value.trim();if(s&&!S.skills.includes(s)){S.skills.push(s);save();render()}break}
    case 'addedu':S.edu.push({id:uid(),name:'',org:'',year:'',note:''});save();render();break;
    case 'deledu':S.edu=S.edu.filter(x=>x.id!==id);save();render();break;
    case 'addref':if(S.refs.list.length>=3){toast('Three is plenty');break}S.refs.list.push({id:uid(),name:'',pos:'',org:'',phone:'',email:'',rel:''});save();render();break;
    case 'delref':S.refs.list=S.refs.list.filter(x=>x.id!==id);save();render();break;
    case 'newcv':{const n=newVersion('CV for a new job');S.versions.push(n);save();location.hash='#/cv/'+n.id;break}
    case 'dupcv':{const n=JSON.parse(JSON.stringify(v));n.id=uid();n.name=v.name+' (copy)';S.versions.push(n);save();render();break}
    case 'delcv':ask('Delete this CV? Your work history stays.','Delete',()=>{S.versions=S.versions.filter(x=>x.id!==id);save();render()});break;
    case 'tpl':v.tpl=a.dataset.v;save();render();break;
    case 'accent':v.accent=a.dataset.v;save();render();break;
    case 'skoff':{const s=a.dataset.v,i=v.skillsOff.indexOf(s);if(i>-1)v.skillsOff.splice(i,1);else v.skillsOff.push(s);save();a.classList.toggle('on');break}
    case 'match':matchAd(v);render();showMissing(id);toast('Matched. Have a look and adjust.');break;
    case 'print':{const w=$('#printzone');w.innerHTML=a.dataset.k==='l'?letterHTML(v):cvHTML(v);const old=document.title;document.title=fileName(v,a.dataset.k);setTimeout(()=>{window.print();document.title=old},60);break}
    case 'copy':copyText(textFor(v,a.dataset.k));break;
    case 'txt':download(fileName(v,a.dataset.k)+'.txt','text/plain',textFor(v,a.dataset.k));break;
    case 'genletter':{const lv=S.versions.find(x=>x.id===S.lv);if(!lv)break;if(lv.letter.text&&lv.letter.text.trim()){ask('Replace the letter you have with a fresh one?','Replace',()=>{genLetter(lv);render()})}else{genLetter(lv);render()}break}
    case 'export':download('write-my-resume-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(S));toast('Backup saved');break;
    case 'import':$('#impFile').click();break;
    case 'wipe':ask('Remove all your details from this device? This cannot be undone.','Clear everything',()=>{try{localStorage.removeItem(KEY)}catch(e){}S=blank();S.versions=[newVersion('My CV')];save();location.hash='#/home';render()});break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='impFile'&&e.target.files[0]){
    const f=e.target.files[0],rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!Array.isArray(d.roles)||!d.profile)throw 0;ask('Replace what is on this device with the backup?','Restore',()=>{S=Object.assign(blank(),d);if(!S.versions.length)S.versions=[newVersion('My CV')];save();render();toast('Restored')})}catch(x){toast('That does not look like a Write My Resume backup')}};
    rd.readAsText(f);e.target.value='';
  }
});
window.addEventListener('afterprint',()=>{$('#printzone').innerHTML=''});

/* ---------- PWA bits ---------- */
try{
  const icon='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#1fb6c9"/><stop offset="1" stop-color="#0e8fa0"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#030708"/><rect x="146" y="90" width="220" height="300" rx="22" fill="url(#g)"/><rect x="180" y="140" width="110" height="18" rx="9" fill="#030708"/><rect x="180" y="184" width="150" height="12" rx="6" fill="#030708" opacity=".6"/><rect x="180" y="214" width="130" height="12" rx="6" fill="#030708" opacity=".6"/><circle cx="360" cy="372" r="64" fill="#030708"/><circle cx="360" cy="372" r="52" fill="url(#g)"/><path d="M336 372l18 18 32-38" stroke="#030708" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const uri='data:image/svg+xml,'+encodeURIComponent(icon);
  const l=document.createElement('link');l.rel='icon';l.href=uri;document.head.appendChild(l);
  const a=document.createElement('link');a.rel='apple-touch-icon';a.href=uri;document.head.appendChild(a);
  const m={name:'Write My Resume',short_name:'My Resume',display:'standalone',background_color:'#030708',theme_color:'#030708',icons:[{src:uri,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
  if(/^https?:/.test(location.protocol))m.start_url=location.href.split('#')[0];
  const k=document.createElement('link');k.rel='manifest';k.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(k);
}catch(e){}

load();
render();
})();
</script>
