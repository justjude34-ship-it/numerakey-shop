<style>
:root{--bg:#000;--card:#0b0e12;--card2:#11151b;--line:#1b232b;--tx:#eef3f4;--mu:#8b98a3;--a:#7ee8dc;--b:#6cb8f0;--c:#f0d3a0;--warm:#f4b978;--g:linear-gradient(120deg,#7ee8dc,#6cb8f0 55%,#f0d3a0)}

body{min-height:100vh;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}

.sub{color:var(--mu);margin:0 0 18px}
.mu{color:var(--mu)}
.date{color:var(--mu);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.lbl{margin:22px 0 10px;color:var(--mu);font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:0 0 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:16px;font-weight:700;font-size:17px;color:#031417;background:var(--g)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.sm{min-height:44px;font-size:15px;width:auto;padding:0 18px;border-radius:14px}
.btn:active{transform:scale(.985)}
.two{display:flex;gap:10px}.two>*{flex:1}
.foot{display:flex;gap:10px;margin-top:24px}
.foot .back{flex:0 0 30%}
.prog{display:flex;gap:6px;margin:4px 0 16px}.prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}.prog i.on{background:var(--g)}
.hero{position:relative;border-radius:26px;overflow:hidden;margin:4px 0 18px;aspect-ratio:6/5;background:#8fd2cf}
.hero.short{aspect-ratio:3/2}.hero img{object-position:50% 56%}.hero.short img{object-position:50% 80%}.hero.tall{aspect-ratio:4/5}
.hero.night{background:linear-gradient(#0c1b2b,#02060b);border:1px solid var(--line)}
.hero svg{display:block;width:100%;height:100%}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;width:100%;text-align:left}
.ri{flex:0 0 46px;height:46px;border-radius:14px;background:radial-gradient(circle at 50% 35%,rgba(126,232,220,.18),rgba(126,232,220,.03));display:grid;place-items:center}
.rl{flex:1;min-width:0}.rl b{display:block;font-weight:650}.rl small{display:block;color:var(--mu);font-size:13px;line-height:1.3}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:22px;line-height:1}
.stp output{min-width:26px;text-align:center;font-weight:700;font-size:18px}
.nm input{flex:1;min-width:0;height:46px;border:0;background:transparent;font-size:17px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.chip.on{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,var(--g) border-box;border:1px solid transparent;box-shadow:0 0 18px rgba(126,232,220,.12)}
.sw .knob{flex:0 0 50px;height:30px;border-radius:30px;background:var(--line);position:relative;transition:background .2s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#7d8993;transition:transform .2s,background .2s}

.it.done .ck{border-color:transparent;background:var(--g)}
.it .tx b{display:block;font-weight:650;font-size:17px;line-height:1.3}
.it .tx small{display:block;color:var(--mu);font-size:14px;margin-top:3px}
.it .tx small.pt{color:var(--warm)}

.center{text-align:center}
.note{color:var(--mu);font-size:14px;text-align:center;margin:8px 4px 0}

.rc b{font-size:16px;line-height:1.2}.rc small{color:var(--mu);font-size:13px}

.tk{padding:12px 0;border-top:1px solid var(--line)}
.tk .tt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tk .tt b{font-weight:650}.tk small{display:block;color:var(--mu);font-size:13px}
.tk .ta{display:flex;gap:8px;margin-top:10px}

.nav div{max-width:540px;margin:0 auto;display:flex}

.nav button.on{color:var(--a)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.setup .nav{display:none}
.spark{animation:tw 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.spark:nth-of-type(2n){animation-delay:.8s}.spark:nth-of-type(3n){animation-delay:1.5s}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.pop{animation:pop .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
a{color:var(--a)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const fresh=()=>({v:1,setupDone:false,editing:false,step:0,tab:'today',counts:Object.assign({},DEF),names:{},rooms:[],floors:'mix',dishwasher:false,dryer:false,pets:[],condition:'behind',budget:10,restDays:[],basics:true,last:{},seeded:{},prog:{},log:[],mission:null,skip:{d:0,keys:[]},restToday:0,forceToday:0,timer:null,bd:{d:0,list:[]},remind:'18:00',created:today()});
let S=(()=>{try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===1)return Object.assign(fresh(),j);}catch(e){}return fresh();})();

function save(){try{if(S.log.length>3000)S.log=S.log.slice(-3000);localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const defName=(type,i,n)=>n>1?TYPES[type].label+' '+i:TYPES[type].label;
function rebuildRooms(){
 const rooms=[];
 for(const type of ORDER){const n=S.counts[type]||0;for(let i=1;i<=n;i++){const id=type+'-'+i;rooms.push({id,type,name:S.names[id]||defName(type,i,n)});}}

 S.rooms=rooms;
}

/* ================= engine ================= */
/* Big jobs (oven, fridge, windows...) are kept out of the daily plan and live in their own list. */
const BIG={kitchen:['fridge','hood','oven','win'],living:['win','skirt'],dining:['win'],bedroom:['matt','pill','duv','win','skirt'],kids:['soft','box','win'],bathroom:['head','prod'],office:['win'],spare:['dump','win'],garage:['sweep','shelf','rec','webs'],outdoor:['glass'],home:['wheel'],pets:['odeep']};
const BIGNAME={fridge:'Fridge',hood:'Rangehood',oven:'Oven',win:'Windows',skirt:'Skirting boards',matt:'Mattress',pill:'Pillows',duv:'Duvet',soft:'Soft toys',box:'Toy box',head:'Showerhead',prod:'Bathroom products',dump:'Dumping ground',sweep:'Garage floor',shelf:'Garage shelves',rec:'Recycling run',webs:'Cobwebs',glass:'Outside glass',wheel:'Wheelie bin',odeep:'Pet enclosure'};
const isBig=(type,id)=>!!(BIG[type]&&BIG[type].includes(id));
function gather(big){
 const out=[],pets=S.pets,hair=pets.includes('dog')||pets.includes('cat');
 for(const r of S.rooms){
  const def=TYPES[r.type];if(!def)continue;
  for(const k of def.tasks){
   const n=k.need;
   if(isBig(r.type,k.id)!==big)continue;
   if(n==='dishwasher'&&!S.dishwasher)continue;
   if(n==='dryer'&&!S.dryer)continue;
   if(n==='hard'&&S.floors==='carpet')continue;
   if((n==='dog'||n==='cat'||n==='other')&&!pets.includes(n))continue;
   let every=k.every;if(k.hair&&hair)every=Math.max(2,Math.round(every*.7));
   out.push({key:r.id+':'+k.id,room:r,text:k.text,tip:k.tip,mins:k.mins,every,win:!!k.win,hy:!!k.hy,once:false});
  }
  if(!big&&S.condition!=='ok'&&def.reset)def.reset.forEach((k,i)=>{
   if(k.lvl===2&&S.condition!=='over')return;
   out.push({key:r.id+':'+k.id,room:r,text:k.text,tip:k.tip,mins:k.mins,every:Infinity,win:true,once:true,order:def.order,idx:i});
  });
 }
 return out;
}
const buildTasks=()=>gather(false);
const buildBig=()=>gather(true);
const allTasks=()=>gather(false).concat(gather(true));
function ensureInit(){
 const d=today();let ch=false;
 for(const k of allTasks()){
  if(k.once||S.last[k.key]!=null)continue;
  S.last[k.key]=d-Math.round(k.every*(.25+.7*hash(k.key)));S.seeded[k.key]=1;ch=true;
 }
 if(ch)save();
}
function ratio(k,c){
 if(k.once){if(c.last[k.key]!=null)return -1;return 5+(30-k.order*2)/100-k.idx*.001;}
 const last=c.last[k.key];
 let r=(c.today-(last==null?c.today:last))/k.every;
 if((c.prog[k.key]||0)>0)r+=.5;
 return Math.max(0,r);
}
const rem=(k,c)=>k.mins-(c.prog[k.key]||0);
function chunkFor(r,b){if(r<=b*1.5)return r;return(r-b<3)?r:b;}
/* Under a tight time budget the everyday jobs get first call (weight), and one day in eight is a
   "deep day" reserved for the slow jobs (oven, windows, mattress) so they never get starved. */
const isDeep=k=>!k.once&&k.every>=60;
const wt=k=>k.once?1:k.hy?6:k.every<=7?4:isDeep(k)?.5:1;
const deepDay=d=>d%8===2;
/* Safety net: no job is ever left waiting longer than this many times its normal gap. */
const maxWait=k=>k.hy?4:k.every<=7?6:k.every<=21?7:isDeep(k)?3.5:5;
function pickMission(tasks,c){
 const rat=new Map(),cands=[];
 for(const k of tasks){
  if(c.skip.has(k.key)||rem(k,c)<=0.01)continue;
  const r=ratio(k,c);if(r<=-1)continue;
  rat.set(k,r);cands.push(k);
 }
 if(!cands.length)return null;
 let pool=cands;
 const resetDay=c.today%2===0&&cands.some(k=>k.once);
 const late=cands.filter(k=>!k.once&&rat.get(k)>=maxWait(k));
 if(c.first){const w=pool.filter(k=>k.win);if(w.length)pool=w;}
 else if(resetDay)pool=cands.filter(k=>k.once);
 else if(late.length)pool=late.sort((a,b)=>rat.get(b)/maxWait(b)-rat.get(a)/maxWait(a)).slice(0,1);
 else if(deepDay(c.today)&&cands.some(k=>isDeep(k)&&rat.get(k)>=.5)){pool=cands.filter(k=>isDeep(k)&&rat.get(k)>=.5);}
 else if(cands.some(k=>k.once)){pool=cands.filter(k=>!k.once);}
 const sc=k=>{const r=rat.get(k);return k.once?r:r*wt(k)+.05*r*r;};
 let p=null,best=-1;
 for(const k of pool){
  let s=sc(k);
  if(!k.once&&k.room.id===c.prevRoom)s*=.85;
  if(s>best){best=s;p=k;}
 }
 const items=[{t:p,chunk:chunkFor(rem(p,c),c.budget)}];
 let left=c.budget-items[0].chunk;
 if(!c.first){
  /* same-room extras only when they are genuinely due too, so the room stays the day's theme */
  const same=cands.filter(k=>k!==p&&k.room.id===p.room.id&&rat.get(k)>=(k.once?0:.6)&&rem(k,c)<=left).sort((a,b)=>sc(b)-sc(a));
  for(const k of same){if(items.length>=6)break;const r=rem(k,c);if(r<=left){items.push({t:k,chunk:r});left-=r;}}
 }
 return{items};
}
function ctxNow(){
 const d=today(),e=S.log[S.log.length-1];
 return{today:d,last:S.last,prog:S.prog,skip:new Set(S.skip.d===d?S.skip.keys:[]),prevRoom:e?e.k.split(':')[0]:null,budget:S.budget,first:S.log.length===0};
}
function isRest(d,live){
 if(live){if(S.forceToday===d)return false;if(S.restToday===d)return true;}
 return S.restDays.includes(wdOf(d));
}
function newMission(){
 const tasks=buildTasks(),c=ctxNow();
 const doneToday=new Set(S.log.filter(e=>e.d===c.today).map(e=>e.k));
 c.skip=new Set([...c.skip,...doneToday]);
 let m=pickMission(tasks,c);
 if(!m){S.skip={d:c.today,keys:[]};c.skip=doneToday;m=pickMission(tasks,c);}
 S.mission=m?{date:c.today,items:m.items.map(x=>({key:x.t.key,chunk:x.chunk,done:false}))}:{date:c.today,items:[]};
 save();
}
function ensureMission(){
 const d=today();
 if(isRest(d,true))return;
 const keys=new Set(buildTasks().map(k=>k.key));
 if(S.mission&&S.mission.date===d){
  S.mission.items=S.mission.items.filter(i=>keys.has(i.key));
  if(S.mission.items.length)return;
 }
 newMission();
}
function completeItem(key,chunk){
 const k=allTasks().find(x=>x.key===key);if(!k)return;
 const d=today(),pl=S.last[key],pp=S.prog[key]||0,ws=!!S.seeded[key];
 const np=pp+chunk,fin=np>=k.mins-.01;
 if(fin){S.last[key]=d;delete S.seeded[key];S.prog[key]=0;}else S.prog[key]=np;
 S.log.push({d,k:key,m:chunk,pl:pl==null?null:pl,pp,ws,f:fin});
}
function undoItem(key){
 const d=today();
 for(let i=S.log.length-1;i>=0;i--){
  const e=S.log[i];
  if(e.k===key&&e.d===d){
   if(e.pl==null)delete S.last[key];else S.last[key]=e.pl;
   S.prog[key]=e.pp;if(e.ws)S.seeded[key]=1;
   S.log.splice(i,1);return;
  }
 }
}
function simCore(o){
 const {tasks,last,prog,days,budget,t0,live}=o,by=Object.fromEntries(tasks.map(k=>[k.key,k]));
 const res=[],done={};let prevRoom=o.prevRoom||null;
 const apply=(k,ch,i,d)=>{const np=(prog[k.key]||0)+ch;if(np>=k.mins-.01){last[k.key]=d;prog[k.key]=0;(done[k.key]=done[k.key]||[]).push(i);}else prog[k.key]=np;};
 for(let i=0;i<days;i++){
  const d=t0+i;
  if(isRest(d,live&&i===0)){res.push({d,rest:true});continue;}
  let items;
  if(live&&i===0&&S.mission&&S.mission.date===d){
   items=S.mission.items.filter(x=>by[x.key]).map(x=>({t:by[x.key],chunk:x.chunk,done:x.done}));
   items.forEach(x=>{if(!x.done)apply(x.t,x.chunk,i,d);});
  }else{
   const m=pickMission(tasks,{today:d,last,prog,skip:new Set(),prevRoom,budget,first:false});
   if(!m){res.push({d,rest:true});continue;}
   items=m.items;items.forEach(x=>apply(x.t,x.chunk,i,d));
  }
  if(items.length)prevRoom=items[0].t.room.id;
  res.push({d,items});
 }
 return{res,done};
}
function simulate(days){
 const tasks=buildTasks();
 const prevRoom=(S.log[S.log.length-1]||{k:':'}).k.split(':')[0]||null;
 return simCore({tasks,last:Object.assign({},S.last),prog:Object.assign({},S.prog),days,budget:S.budget,t0:today(),prevRoom,live:true}).res;
}
function lap(){
 const ts=buildTasks().filter(k=>!k.once);
 const active=Math.max(1/7,(7-S.restDays.length)/7);
 const ideal=Math.max(1,Math.ceil(ts.reduce((a,k)=>a+k.mins/k.every,0)/active));
 return{ideal,jobs:ts.length};
}
/* What a given time budget really delivers: run the plan forward 300 days from a neutral start
   and measure how often the marker jobs come round. Cached per home + budget. */
const FC={},FCD=300,FCS=60;
function forecast(budget){
 const sig=JSON.stringify([S.counts,S.pets,S.floors,S.dishwasher,S.dryer,S.restDays,budget]);
 if(FC[sig])return FC[sig];
 const tasks=buildTasks().filter(k=>!k.once),d0=today(),last={};
 tasks.forEach(k=>{last[k.key]=d0-Math.round(k.every*(.25+.7*hash(k.key)));});
 const {done}=simCore({tasks,last,prog:{},days:FCD,budget,t0:d0,live:false});
 const win=FCD-FCS,iv=k=>{const n=(done[k.key]||[]).filter(i=>i>=FCS).length;return n?win/n:win;};
 const med=a=>{if(!a.length)return null;a=a.slice().sort((x,y)=>x-y);return a[a.length>>1];};
 const grp=(fn)=>med(tasks.filter(fn).map(iv));
 const rows=[];
 const add=(label,v,every)=>{if(v!=null)rows.push({label,days:v});};
 add('Toilets',grp(k=>/:toilet$/.test(k.key)));
 add('Kitchen benches',grp(k=>/^kitchen-\d+:bench$/.test(k.key)));
 add('Bed sheets',grp(k=>/:sheets$/.test(k.key)));
 add('Vacuuming the living room',grp(k=>/^living-\d+:vac$/.test(k.key)));
 const hy=tasks.filter(k=>k.every<=10).map(k=>iv(k)/k.every);
 return FC[sig]={rows,hyg:med(hy)||1};
}
const CHIPS=[5,10,15,20,30];
function recommend(){
 for(const m of CHIPS){if(forecast(m).hyg<=2.5)return m;}
 return 0;
}
const humanDays=d=>d<1.5?'every day':d<12?'every '+Math.max(2,Math.round(d))+' days':d<60?'every '+Math.round(d/7)+' weeks':d<300?'every '+Math.round(d/30)+' months':'rarely';
function planText(){
 const rec=recommend();
 if(!rec)return`${S.budget} minutes a day works. Your home has a lot in it, so jobs come round slowly at any pace. Everything still gets its turn.`;
 if(S.budget>=rec)return`${S.budget} minutes a day is a comfortable pace for your home. Everyday jobs stay on schedule.`;
 return`${S.budget} minutes a day works. Everything still gets its turn, just more slowly. About ${rec} minutes suits a home like yours if you ever want to speed things up.`;
}
function vForecast(){
 const f=forecast(S.budget);
 return`<div class="card"><b>What ${S.budget} min a day gets you</b><div style="margin-top:10px">${f.rows.map(r=>`<div class="tt fr"><span>${r.label}</span><span class="pill">${humanDays(r.days)}</span></div>`).join('')}</div><p class="note" style="text-align:left;margin:10px 0 0">Based on your home. Some days off? That's built in.</p></div>`;
}
function roomStat(r,tasks,c){
 let pend=0,sum=0,n=0;
 for(const k of tasks){
  if(k.room.id!==r.id)continue;
  const q=ratio(k,c);
  if(k.once){if(q>-1)pend++;continue;}
  sum+=clamp(1-q,0,1);n++;
 }
 const f=n?sum/n:1;
 return{f:pend?Math.min(f,.2):f,pend,label:pend?'Needs a reset':f>=.66?'Fresh':f>=.4?'Okay':'Due'};
}
function stats(){

}

/* ================= timer ================= */
let AC=null,tint=null,wl=null;
function chime(){
 try{
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const n=AC.currentTime;
  [523.25,659.25,783.99].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,n+i*.18);g.gain.linearRampToValueAtTime(.18,n+i*.18+.03);g.gain.exponentialRampToValueAtTime(.001,n+i*.18+.9);o.connect(g);g.connect(AC.destination);o.start(n+i*.18);o.stop(n+i*.18+1);});
  if(navigator.vibrate)navigator.vibrate([120,80,120]);
 }catch(e){}
}
function lock(on){
 try{
  if(on&&navigator.wakeLock){navigator.wakeLock.request('screen').then(l=>{wl=l;}).catch(()=>{});}
  else if(wl){wl.release();wl=null;}
 }catch(e){}
}
function startTick(){
 clearInterval(tint);tint=null;
 if(!S.timer||S.timer.end<=Date.now())return;
 tint=setInterval(()=>{
  if(!S.timer){clearInterval(tint);return;}
  const left=Math.ceil((S.timer.end-Date.now())/1000);
  if(left<=0){clearInterval(tint);tint=null;lock(false);if(!S.timer.rang){S.timer.rang=1;save();chime();}render();return;}
  const el=$('#tm');if(el)el.textContent=mmss(left);
  const rg=$('#rg');if(rg)rg.style.strokeDashoffset=(339.3*(1-left/S.timer.total)).toFixed(1);
 },500);
}

 document.body.classList.toggle('setup',setup);
 if(setup){app.innerHTML=vSetup();nav.innerHTML='';}
 else{

 const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tend//EN','BEGIN:VEVENT','UID:tend-daily-nudge@tend','DTSTAMP:'+ds,'DTSTART:'+ds,'DURATION:PT10M','RRULE:FREQ=DAILY','SUMMARY:Your little bit of tidying','DESCRIPTION:Open Tend and do today\'s little bit.','BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Tend','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');

/* ================= events ================= */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.classList.contains('sheet')&&e.target!==el)return;
 const a=el.dataset.act,D=el.dataset,d=today();
 const by=()=>Object.fromEntries(buildTasks().map(k=>[k.key,k]));
 switch(a){
  case'next':if(S.step>=7){finish();}else S.step++;break;
  case'back':S.step=Math.max(S.editing?1:0,S.step-1);break;
  case'cancel':S.editing=false;S.step=0;S.tab='me';break;
  case'inc':S.counts[D.t]=clamp((S.counts[D.t]||0)+1,0,MAXC[D.t]);break;
  case'dec':S.counts[D.t]=clamp((S.counts[D.t]||0)-1,0,MAXC[D.t]);break;
  case'set':S[D.k]=D.k==='budget'?+D.v:D.v;if(S.setupDone&&!S.editing){ensureInit();resetMissionIfClean();}break;
  case'tog':S[D.k]=!S[D.k];if(S.setupDone&&!S.editing){ensureInit();resetMissionIfClean();}break;
  case'pet':{const i=S.pets.indexOf(D.v);if(i<0)S.pets.push(D.v);else S.pets.splice(i,1);rebuildRooms();if(S.setupDone&&!S.editing){ensureInit();resetMissionIfClean();}break;}
  case'rd':{const v=+D.v,i=S.restDays.indexOf(v);if(i<0)S.restDays.push(v);else S.restDays.splice(i,1);break;}
  case'tab':S.tab=D.v;sheetRoom=null;window.scrollTo(0,0);break;
  case'edit':S.editing=true;S.step=1;window.scrollTo(0,0);break;
  case'bigdone':{const k=allTasks().find(x=>x.key===D.k);if(!k)return;completeItem(k.key,k.mins);break;}
  case'bigundo':undoItem(D.k);break;
  case'tick':{const it=S.mission&&S.mission.items[+D.i];if(!it)return;if(!it.done){completeItem(it.key,it.chunk);it.done=true;}else{undoItem(it.key);it.done=false;}break;}
  case'basic':{if(S.bd.d!==d)S.bd={d,list:[]};const i=+D.i,j=S.bd.list.indexOf(i);if(j<0)S.bd.list.push(i);else S.bd.list.splice(j,1);break;}
  case'swap':{if(S.mission){const s=S.skip.d===d?S.skip.keys:[];S.skip={d,keys:s.concat(S.mission.items.map(i=>i.key))};newMission();}break;}
  case'more':S.timer=null;newMission();window.scrollTo(0,0);break;
  case'rest':S.restToday=d;S.forceToday=0;S.timer=null;break;
  case'force':S.forceToday=d;S.restToday=0;break;
  case'tstart':{const m=+D.m;S.timer={end:Date.now()+m*60000,total:m*60};lock(true);try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();}catch(x){}break;}
  case'tmore':S.timer={end:Date.now()+300000,total:300};lock(true);break;
  case'tstop':S.timer=null;lock(false);break;
  case'room':sheetRoom=D.id;break;
  case'closesheet':sheetRoom=null;break;
  case'donow':{const k=by()[D.k];if(!k)return;const r=k.mins-(S.prog[k.key]||0);S.mission={date:d,items:[{key:k.key,chunk:chunkFor(r,S.budget),done:false}]};S.forceToday=d;S.restToday=0;S.tab='today';sheetRoom=null;S.timer=null;window.scrollTo(0,0);break;}
  case'did':{const k=by()[D.k];if(!k)return;const r=k.mins-(S.prog[k.key]||0);completeItem(k.key,r);if(S.mission){const it=S.mission.items.find(i=>i.key===k.key);if(it)it.done=true;}break;}
  case'ics':{const v=$('#remindTime');if(v&&v.value)S.remind=v.value;save();ics();return;}
  case'export':download('tend-backup.json',JSON.stringify(S),'application/json');return;
  case'import':$('#imp').click();return;
  case'reset':if(confirm('Erase everything and start again?')){S=fresh();sheetRoom=null;}else return;break;
  default:return;
 }
 save();render();
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.nm){
  const id=el.dataset.nm,v=el.value.trim(),r=S.rooms.find(x=>x.id===id);
  if(!r)return;
  const type=r.type,n=S.counts[type]||0,i=+id.split('-').pop();
  if(v&&v!==defName(type,i,n))S.names[id]=v;else delete S.names[id];
  save();
 }
});
$('#imp').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{try{const j=JSON.parse(rd.result);if(j&&j.v===1&&j.counts){S=Object.assign(fresh(),j);rebuildRooms();save();sheetRoom=null;render();}else alert('That file does not look like a Tend backup.');}catch(x){alert('That file could not be read.');}e.target.value='';};
 rd.readAsText(f);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render();});

/* ================= install bits ================= */
function icon(size){
 try{
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');if(!x)return null;
  x.fillStyle='#000';x.fillRect(0,0,size,size);
  const g=x.createLinearGradient(0,0,size,size);g.addColorStop(0,'#7ee8dc');g.addColorStop(.55,'#6cb8f0');g.addColorStop(1,'#f0d3a0');
  x.strokeStyle=g;x.lineWidth=size*.07;x.lineJoin='round';x.lineCap='round';
  const s=size/64;x.beginPath();x.moveTo(14*s,33*s);x.lineTo(32*s,17*s);x.lineTo(50*s,33*s);x.moveTo(19*s,30*s);x.lineTo(19*s,48*s);x.lineTo(45*s,48*s);x.lineTo(45*s,30*s);x.stroke();
  x.fillStyle=g;x.beginPath();x.arc(32*s,38*s,3.6*s,0,7);x.fill();
  return c.toDataURL('image/png');
 }catch(e){return null;}
}
function installBits(){
 try{
  const i192=icon(192),i512=icon(512);
  if(i192){const l=document.createElement('link');l.rel='apple-touch-icon';l.href=i192;document.head.appendChild(l);}
  if(location.protocol.indexOf('http')===0){
   const m={name:'Tend',short_name:'Tend',description:'A little bit of cleaning each day.',start_url:location.href.split('#')[0],scope:location.href.split('#')[0].replace(/[^/]*$/,''),display:'standalone',background_color:'#000000',theme_color:'#000000',icons:i192&&i512?[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]:[]};
   const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(l);
   if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
 }catch(e){}
}

/* ================= boot ================= */
if(S.setupDone){rebuildRooms();ensureInit();}
render();
installBits();
window.__tend={S:()=>S,buildTasks,buildBig,allTasks,pickMission,simulate,simCore,forecast,recommend,lap,ctxNow,render};
})();
