<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060711">
<link rel="icon" href="data:,">
<title>Pocket Story Weaver</title>
<style>
:root{--bg:#060711;--mid:#0e1124;--card:#151934;--cy:#00f5d4;--pk:#ff4d8d;--gd:#ffd166;--pu:#9b5de5;--mt:#06d6a0;--tx:#f3f1ff;--dim:#b9b6d6;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 700px at 15% -10%,#2a1850 0,transparent 60%),radial-gradient(900px 600px at 100% 10%,#0b3b45 0,transparent 55%),var(--bg);color:var(--tx);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding-bottom:84px;transition:filter .4s}
body.amber{filter:sepia(.85) saturate(1.2) brightness(.78) hue-rotate(-12deg)}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:14px 16px}
h1,h2,h3{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
header h1{font-size:22px;letter-spacing:.2px;background:linear-gradient(90deg,var(--cy),var(--pk),var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0;color:var(--dim);font-size:13px}
.ic{width:20px;height:20px;vertical-align:-4px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:16px;font-weight:700;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);min-height:44px;transition:transform .12s,border-color .2s}
.btn:active{transform:scale(.96)}
.btn:hover{border-color:var(--cy)}
.btn.main{background:linear-gradient(90deg,var(--pk),var(--pu));border-color:transparent;color:#fff}
.btn.gold{background:linear-gradient(90deg,#ffb347,var(--gd));color:#2b1d3c;border-color:transparent}
.btn.sm{padding:7px 12px;min-height:38px;font-size:13px;border-radius:13px}
.glass{background:rgba(21,25,52,.72);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(8px)}
/* cards */
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.slot{display:flex;flex-direction:column;gap:8px}
.flip{perspective:900px;aspect-ratio:3/4.3;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column}
.back{background:repeating-linear-gradient(45deg,#1b1650 0 10px,#241a66 10px 20px);border:2px solid var(--gd);align-items:center;justify-content:center}
.back svg{width:56%;opacity:.9}
.front{transform:rotateY(180deg);background:linear-gradient(170deg,#1c2150,#12163a);border:2px solid var(--c)}
.front .pic{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 8px 0;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.14),transparent 68%)}
.front .pic svg,.front .pic img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.front .pic img{border-radius:12px;object-fit:cover}
.front .txt{padding:6px 8px 9px;text-align:center}
.front .tag{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--c);font-weight:700}
.front .nm{font-size:12.5px;font-weight:700;line-height:1.2;margin-top:2px}
.slot .lbl{text-align:center;font-weight:700;font-size:12px;color:var(--c);letter-spacing:.6px;text-transform:uppercase}
.slot .acts{display:flex;gap:6px;justify-content:center}
.slot .acts button{width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center}
.slot .acts button.lk{border-color:var(--c);color:var(--c);background:rgba(255,255,255,.12)}
.trait{font-size:12px;color:var(--dim);text-align:center;min-height:2.6em}
.c-who{--c:var(--cy)}.c-what{--c:var(--pk)}.c-where{--c:var(--gd)}
/* story */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.seg button{padding:10px 16px;font-weight:700;font-size:14px;min-height:44px}
.seg button.on{background:linear-gradient(90deg,var(--cy),var(--mt));color:#06202a}
.story{padding:18px;margin-top:14px}
.title-in{width:100%;text-overflow:ellipsis;font:700 17px "Trebuchet MS",system-ui,sans-serif;color:var(--gd);background:transparent;border:0;border-bottom:1px dashed var(--line);padding:6px 0;margin-bottom:10px}
.title-in:focus{outline:none;border-color:var(--gd)}
.paras p{font:18px/1.7 Georgia,"Times New Roman",serif;margin:0 0 14px}
.paras p.add{padding:12px 14px;border-radius:16px;background:rgba(255,77,141,.12);border:1px solid rgba(255,77,141,.35);color:var(--gd)}
.paras p:first-child::first-letter{font-size:2.3em;float:left;line-height:.9;margin:4px 8px 0 0;color:var(--pk);font-weight:700}
.choices{display:grid;gap:10px;margin-top:6px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:13px 15px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:700;font-size:14px}
.choice span.p{flex:none;padding:5px 10px;border-radius:12px;background:rgba(255,77,141,.2);color:var(--pk);font-size:12px}
.choice:hover{border-color:var(--pk)}
.sec-h{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:20px 0 8px;font-weight:700}
.note{font-size:13px;color:var(--dim)}
/* doodle */
.doodle canvas{width:100%;height:auto;border-radius:18px;border:2px solid var(--line);touch-action:none;background:#060711;display:block}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;flex:none}
.sw.on{border-color:#fff;transform:scale(1.15)}
.stk{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);padding:5px}
.stk svg{width:100%;height:100%}
input[type=range]{accent-color:var(--pk);width:120px}
/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.book{overflow:hidden;display:flex;flex-direction:column}
.book img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:pointer}
.book .bd{padding:12px 14px}
.book h3{font-size:16px;color:var(--cy)}
.book p{font:13px/1.5 Georgia,serif;color:var(--dim);margin:6px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .ft{display:flex;justify-content:space-between;padding:8px 14px 12px;border-top:1px solid var(--line)}
.empty{text-align:center;padding:36px 20px}
.empty svg{width:90px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(6,7,17,.92);border-top:1px solid var(--line)}
nav button{flex:1;max-width:200px;padding:10px;border-radius:16px;font-weight:700;font-size:14px;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
nav button.on{background:rgba(0,245,212,.14);color:var(--cy)}
/* modals */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,4,12,.8);display:none;align-items:flex-end;justify-content:center;padding:0}
.ov.on{display:flex}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#12163a;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px 26px}
@media(min-width:640px){.ov{align-items:center;padding:20px}.sheet{border-radius:26px}}
.sheet h2{font-size:22px;color:var(--gd);margin-bottom:6px}
.field{display:block;margin:12px 0 4px;font-size:13px;font-weight:700;color:var(--dim)}
.txt-in{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--tx);font:inherit}
.txt-in:focus{outline:2px solid var(--cy);outline-offset:1px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--c);color:var(--c);background:rgba(255,255,255,.06);margin:3px 3px 3px 0}
.pill svg{width:24px;height:24px}
.reader img.cv{width:100%;border-radius:16px;margin-bottom:12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;z-index:70;background:#241a66;border:1px solid var(--gd);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.demo-pill{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;background:rgba(255,209,102,.18);color:var(--gd);font-size:11px;font-weight:700;vertical-align:2px;-webkit-text-fill-color:var(--gd)}
.hide{display:none!important}
@media(min-width:760px){.deck{gap:18px;max-width:760px;margin-left:auto;margin-right:auto}.front .nm{font-size:15px}.front .tag{font-size:11px}.trait{font-size:13px}.wrap{padding:22px}header h1{font-size:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
 <header>
  <div><h1>Pocket Story Weaver</h1><p>Flip three cards. Weave a bedtime story.</p></div>
  <button class="btn sm" id="dim" aria-label="Bedtime dimmer"></button>
 </header>

 <section id="v-weave">
  <div class="row"><button class="btn main" id="shufAll"></button><span class="note" id="demoNote"></span></div>
  <div class="deck" id="deck"></div>

  <div class="glass story">
   <div class="row" style="justify-content:space-between">
    <div class="seg" role="tablist"><button id="m-spark" class="on">Quick Spark</button><button id="m-full">Full Tale</button></div>
    <button class="btn sm" id="spin"></button>
   </div>
   <div style="margin-top:14px"><input class="title-in" id="title" maxlength="80" aria-label="Story title"></div>
   <div class="paras" id="paras"></div>
   <div id="chWrap"><div class="sec-h">What happens next?</div><div class="choices" id="choices"></div></div>
  </div>

  <div class="glass story doodle">
   <h3 style="color:var(--cy)">Doodle the cover</h3>
   <p class="note" style="margin:4px 0 10px">Draw with your finger, add stickers, then save the story to your bookshelf.</p>
   <canvas id="cv" width="600" height="450"></canvas>
   <div class="row" style="margin-top:12px" id="sw"></div>
   <div class="row" style="margin-top:10px"><label class="note" for="bs">Brush</label><input type="range" id="bs" min="3" max="20" value="8"><button class="btn sm" id="cvReset"></button></div>
   <div class="sec-h" style="margin-top:14px">Stickers</div>
   <div class="row" id="stk"></div>
   <div class="row" style="margin-top:18px">
    <button class="btn gold" id="save"></button>
    <button class="btn" id="read"></button>
    <button class="btn" id="custom"></button>
   </div>
  </div>
 </section>

 <section id="v-shelf" class="hide">
  <h2 style="margin:6px 0 12px;color:var(--cy)">Keepsake Bookshelf <span class="note" id="shelfN"></span></h2>
  <div class="shelf" id="shelf"></div>
 </section>
</div>

<nav>
 <button id="n-weave" class="on"></button>
 <button id="n-shelf"></button>
</nav>

<div class="ov" id="o-read"><div class="sheet reader" id="readBox"></div></div>
<div class="ov" id="o-custom"><div class="sheet" id="customBox"></div></div>
<div class="ov" id="o-more"><div class="sheet" id="moreBox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- illustrations: 36 cards, 8 stickers, UI icons (all inline SVG, no emoji) ---------- */
var INK='#2b1d3c';
function eyes(a,b,y,r){r=r||4.2;return '<circle cx="'+a+'" cy="'+y+'" r="'+r+'" fill="'+INK+'"/><circle cx="'+b+'" cy="'+y+'" r="'+r+'" fill="'+INK+'"/><circle cx="'+(a+1.4)+'" cy="'+(y-1.5)+'" r="'+(r*.38)+'" fill="#fff"/><circle cx="'+(b+1.4)+'" cy="'+(y-1.5)+'" r="'+(r*.38)+'" fill="#fff"/>'}
function cheeks(a,b,y){return '<ellipse cx="'+a+'" cy="'+y+'" rx="4.5" ry="3" fill="#ff8fb0" opacity=".6"/><ellipse cx="'+b+'" cy="'+y+'" rx="4.5" ry="3" fill="#ff8fb0" opacity=".6"/>'}
function smile(x,y,w){w=w||6;return '<path d="M'+(x-w)+' '+y+'q'+w+' '+(w*.95)+' '+(w*2)+' 0" fill="none" stroke="'+INK+'" stroke-width="2.2" stroke-linecap="round"/>'}
function star(x,y,s,c){return '<path transform="translate('+x+' '+y+') scale('+s+')" d="M0-6 1.8-1.9 6-1.5 2.8 1.3 3.7 5.6 0 3.3-3.7 5.6-2.8 1.3-6-1.5-1.8-1.9z" fill="'+(c||'#ffd166')+'"/>'}
var SH='<ellipse cx="60" cy="109" rx="30" ry="5" fill="#000" opacity=".28"/>';
function wrap(s){return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+s+'</svg>'}
function heartP(x,y,s,c){return '<path transform="translate('+x+' '+y+') scale('+s+')" d="M0 7C-12-2-9-10-3-9 0-8.5 0-6 0-6S0-8.5 3-9C9-10 12-2 0 7z" fill="'+c+'"/>'}
function note(x,y,c){return '<g fill="'+c+'"><circle cx="'+x+'" cy="'+y+'" r="3"/><path d="M'+(x+2.4)+' '+y+'V'+(y-11)+'l5 2" stroke="'+c+'" stroke-width="1.8" fill="none"/></g>'}
function cloud(x,y,s,c){return '<g transform="translate('+x+' '+y+') scale('+s+')" fill="'+(c||'#fff')+'"><circle cx="-14" cy="2" r="10"/><circle cx="0" cy="-4" r="13"/><circle cx="14" cy="2" r="10"/><rect x="-24" y="2" width="48" height="10" rx="5"/></g>'}

var ART={};
/* ===== WHO ===== */
ART.wombat=wrap(SH+'<ellipse cx="60" cy="82" rx="30" ry="26" fill="#a47c5b"/><ellipse cx="60" cy="90" rx="17" ry="15" fill="#ead3b3"/><circle cx="37" cy="40" r="8" fill="#a47c5b"/><circle cx="83" cy="40" r="8" fill="#a47c5b"/><circle cx="37" cy="40" r="4" fill="#d9a98a"/><circle cx="83" cy="40" r="4" fill="#d9a98a"/><ellipse cx="60" cy="56" rx="29" ry="25" fill="#b88d6a"/><ellipse cx="60" cy="63" rx="12" ry="8.5" fill="#ead3b3"/><ellipse cx="60" cy="60" rx="7" ry="4.6" fill="#4a3228"/>'+eyes(48,72,49)+cheeks(40,80,62)+'<g transform="rotate(-38 88 62)"><rect x="76" y="56" width="32" height="11" rx="3" fill="#e0a93b"/><rect x="102" y="53" width="9" height="17" rx="3" fill="#c98b1f"/><rect x="73" y="58" width="6" height="7" rx="2" fill="#f7d36e"/></g><ellipse cx="76" cy="82" rx="6" ry="5" fill="#a47c5b"/>'+star(100,24,1.2)+star(18,26,.8,'#9be7ff'));
ART.knight=wrap(SH+'<ellipse cx="62" cy="94" rx="22" ry="13" fill="#ffd166"/><path d="M54 83v22M66 83v22" stroke="#3a2a14" stroke-width="5"/><ellipse cx="50" cy="80" rx="13" ry="7" fill="#bfe6ff" opacity=".8" transform="rotate(-20 50 80)"/><ellipse cx="72" cy="80" rx="13" ry="7" fill="#bfe6ff" opacity=".8" transform="rotate(20 72 80)"/><circle cx="36" cy="94" r="10" fill="#ffd166"/><circle cx="32" cy="92" r="2" fill="'+INK+'"/><circle cx="40" cy="92" r="2" fill="'+INK+'"/><path d="M84 94l9-3-3 7z" fill="#3a2a14"/><rect x="52" y="54" width="18" height="24" rx="8" fill="#7aa7ff"/><circle cx="61" cy="44" r="12" fill="#ffd6b3"/>'+eyes(56,66,45,2.6)+smile(61,50,3.5)+'<path d="M49 43a12 12 0 0 1 24 0z" fill="#cfd8e6"/><path d="M49 43h24" stroke="#9aa8c0" stroke-width="2.4"/><circle cx="55" cy="37" r="1.2" fill="#9aa8c0"/><circle cx="62" cy="34" r="1.2" fill="#9aa8c0"/><circle cx="67" cy="38" r="1.2" fill="#9aa8c0"/><ellipse cx="61" cy="29" rx="3" ry="7" fill="#ff5d8f"/><circle cx="48" cy="66" r="8" fill="#ff8fb0"/>'+star(48,66,.9,'#fff')+'<path d="M76 62l15-20" stroke="#dfe6f2" stroke-width="3.2" stroke-linecap="round"/><path d="M72 62l8 4" stroke="#e0a93b" stroke-width="3" stroke-linecap="round"/>');
ART.owl=wrap(SH+'<ellipse cx="60" cy="70" rx="33" ry="35" fill="#d9a43e"/><ellipse cx="29" cy="74" rx="9" ry="22" fill="#b98524" transform="rotate(8 29 74)"/><ellipse cx="91" cy="74" rx="9" ry="22" fill="#b98524" transform="rotate(-8 91 74)"/><path d="M47 80q4 6 8 0q4 6 8 0q4 6 8 0M47 90q4 6 8 0q4 6 8 0q4 6 8 0" stroke="#f3d37a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M36 38l6-14 9 12zM84 38l-6-14-9 12z" fill="#b98524"/><circle cx="47" cy="52" r="15" fill="#fff3d6"/><circle cx="73" cy="52" r="15" fill="#fff3d6"/><circle cx="47" cy="52" r="9" fill="#2f6bff"/><circle cx="73" cy="52" r="9" fill="#2f6bff"/><circle cx="47" cy="52" r="4.5" fill="#101a4a"/><circle cx="73" cy="52" r="4.5" fill="#101a4a"/><circle cx="50" cy="48" r="2.6" fill="#fff"/><circle cx="76" cy="48" r="2.6" fill="#fff"/><path d="M55 58h10l-5 9z" fill="#ff9a3c"/><circle cx="60" cy="98" r="7" fill="none" stroke="#fff3d6" stroke-width="4" stroke-dasharray="3 2.2"/><circle cx="60" cy="98" r="3" fill="#fff3d6"/>'+star(100,26,1,'#9be7ff'));

 $('o-read').classList.add('on');
}
function preview(){showReader({title:$('title').value.trim()||"Tonight's Bedtime Story",date:'Cosy storybook view',who:active.who,what:active.what,where:active.where,paragraphs:plainParas(),coverImg:cv.toDataURL('image/jpeg',.85)})}
/* ---------- custom cards ---------- */
function openCustom(){
 if(DEMO){more('Your own family cards','In the full app you can add cards for your own family, pets and favourite places, with a photo if you like.');return}
 photo=null;selDeck='who';customIcon='star';
 $('customBox').innerHTML='<div class="row" style="justify-content:space-between"><h2>Make a family card</h2><button class="btn sm" data-x="o-custom" aria-label="Close">'+ic('close')+'</button></div>'+
 '<label class="field">Which deck?</label><div class="seg" id="cdeck">'+TYPES.map(function(t){return '<button data-d="'+t+'"'+(t==='who'?' class="on"':'')+'>'+LBL[t]+'</button>'}).join('')+'</div>'+
 '<label class="field" for="cn">Name</label><input class="txt-in" id="cn" maxlength="40" placeholder="Grandpa Joe the Gardener">'+
 '<label class="field" for="ct">What are they like?</label><input class="txt-in" id="ct" maxlength="90" placeholder="Hums while he waters the tomatoes">'+
 '<label class="field">Picture</label><div class="row" id="cicons">'+Object.keys(STICK).map(function(k){return '<button class="stk'+(k==='star'?'" style="border-color:var(--gd)':'')+'" data-i="'+k+'" aria-label="'+STICK_NAMES[k]+'">'+stickSVG(k)+'</button>'}).join('')+'</div>'+
 '<div class="row" style="margin-top:10px"><label class="btn sm" for="cph">'+ic('photo')+' <span id="cphs">Use a photo instead</span></label><input type="file" id="cph" accept="image/*" class="hide"></div>'+
 '<div class="row" style="margin-top:18px"><button class="btn main" id="csave">Add to my deck</button></div>';
 $('o-custom').classList.add('on');
}
function saveCustom(){
 var name=$('cn').value.trim();if(!name){toast('Please give your card a name');return}
 var c={val:name,trait:$('ct').value.trim()||'A beloved family favourite full of magic',icon:customIcon,tag:'Family Card',photo:photo||null};
 decks[selDeck].unshift(c);
 try{var r=lsGet(KEY.cards),s=r?JSON.parse(r):{who:[],what:[],where:[]};s[selDeck]=s[selDeck]||[];s[selDeck].unshift(c);lsSet(KEY.cards,JSON.stringify(s))}catch(e){}
 active[selDeck]=c;paintCard(selDeck,c);$('f-'+selDeck).classList.add('on');added=[];weave();paintCover();
 $('o-custom').classList.remove('on');toast('Added '+name+' to your '+LBL[selDeck]+' deck');
}
function loadCustom(){
 try{var r=lsGet(KEY.cards);if(!r)return;var s=JSON.parse(r);TYPES.forEach(function(t){if(Array.isArray(s[t]))decks[t]=s[t].concat(decks[t])})}catch(e){}
}
/* ---------- misc ---------- */
function more(h,t){$('moreBox').innerHTML='<h2>'+esc(h)+'</h2><p>'+esc(t)+'</p><div class="row" style="margin-top:16px"><a class="btn gold" href="'+SHOP+'" target="_blank" rel="noopener">See the full app</a><button class="btn" data-x="o-more">Keep playing the demo</button></div>';$('o-more').classList.add('on')}
function view(v){['weave','shelf'].forEach(function(k){$('v-'+k).classList.toggle('hide',k!==v);$('n-'+k).classList.toggle('on',k===v)});if(v==='shelf')renderShelf();window.scrollTo(0,0)}
function setAmber(on){document.body.classList.toggle('amber',on);$('dim').innerHTML=ic(on?'sun':'moon')+' <span>'+(on?'Normal':'Bedtime')+'</span>';lsSet(KEY.amber,on?'1':'0')}
function stars(){
 var c=$('stars'),g=c.getContext('2d'),S=[],w,h;
 function size(){w=c.width=innerWidth;h=c.height=innerHeight;S=[];for(var i=0;i<70;i++)S.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.6+.4,p:Math.random()*6.28,c:i%5===0?'#FFD166':(i%7===0?'#00F5D4':'#fff')})}
 size();addEventListener('resize',size);
 var still=matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
 function loop(t){g.clearRect(0,0,w,h);S.forEach(function(s){g.globalAlpha=.25+.55*Math.abs(Math.sin(t/1400+s.p));g.fillStyle=s.c;g.beginPath();g.arc(s.x,s.y,s.r,0,6.283);g.fill()});g.globalAlpha=1;if(!still)requestAnimationFrame(loop)}
 requestAnimationFrame(loop);
}
function manifest(){try{var m={name:'Pocket Story Weaver',short_name:'Story Weaver',start_url:'.',display:'standalone',background_color:'#060711',theme_color:'#060711',icons:[]};var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(l)}catch(e){}}
/* ---------- wire up ---------- */
document.addEventListener('DOMContentLoaded',function(){
 $('shufAll').innerHTML=ic('shuffle')+' Shuffle all three';$('spin').innerHTML=ic('wand')+' New plot';
 $('cvReset').innerHTML=ic('undo')+' Clear';$('save').innerHTML=ic('book')+' Save to Bookshelf';$('read').innerHTML=ic('book')+' Read together';$('custom').innerHTML=ic('plus')+' Family card';
 $('n-weave').innerHTML=ic('spark')+' Weave';$('n-shelf').innerHTML=ic('book')+' Bookshelf';
 loadCustom();buildDeck();initDoodle();stars();manifest();demoLeft();
 setAmber(lsGet(KEY.amber)==='1');
 initialDraw();
 document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a],[data-ch],[data-c],[data-k],[data-open],[data-del],[data-x],[data-d],[data-i]');
  if(b){
   if(b.dataset.a==='spin')spinOne(b.dataset.t);
   else if(b.dataset.a==='lock')toggleLock(b.dataset.t);
   else if(b.dataset.ch!=null){var c=CH[+b.dataset.ch];if(added.indexOf(c[1])<0){added.push(c[1]);weave();toast('Chapter added')}else toast('That chapter is already in your story')}
   else if(b.dataset.c){cvColor=b.dataset.c;document.querySelectorAll('#sw .sw').forEach(function(s){s.classList.toggle('on',s===b)})}
   else if(b.dataset.k)stamp(b.dataset.k);
   else if(b.dataset.open){var bk=shelfList().filter(function(x){return x.id===b.dataset.open})[0];if(bk)showReader(bk)}
   else if(b.dataset.del){lsSet(KEY.shelf,JSON.stringify(shelfList().filter(function(x){return x.id!==b.dataset.del})));renderShelf();toast('Removed')}
   else if(b.dataset.x)$(b.dataset.x).classList.remove('on');
   else if(b.dataset.d){selDeck=b.dataset.d;document.querySelectorAll('#cdeck button').forEach(function(s){s.classList.toggle('on',s===b)})}
   else if(b.dataset.i){customIcon=b.dataset.i;document.querySelectorAll('#cicons .stk').forEach(function(s){s.style.borderColor=s===b?'var(--gd)':''})}
   return}
  var f=e.target.closest('.flip');if(f){var t=f.id.slice(2);if(f.classList.contains('on'))spinOne(t);else{active[t]=active[t]||pick(t);f.classList.add('on')}}
  if(e.target.classList&&e.target.classList.contains('ov'))e.target.classList.remove('on');
 });
 document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('flip')){e.preventDefault();e.target.click()}if(e.key==='Escape')document.querySelectorAll('.ov.on').forEach(function(o){o.classList.remove('on')})});
 $('shufAll').onclick=shuffleAll;$('spin').onclick=function(){seed=(seed+1)%3;added=[];weave.keep=false;weave();toast('Fresh story plot')};
 $('m-spark').onclick=function(){setMode('spark')};$('m-full').onclick=function(){setMode('full')};
 $('title').addEventListener('input',function(){weave.keep=true});
 $('cvReset').onclick=function(){paintCover()};$('save').onclick=saveBook;$('read').onclick=preview;$('custom').onclick=openCustom;
 $('n-weave').onclick=function(){view('weave')};$('n-shelf').onclick=function(){if(DEMO){more('The Keepsake Bookshelf','The full app saves every story you weave, with its doodled cover, so you can read it together again whenever you like.');return}view('shelf')};
 $('dim').onclick=function(){setAmber(!document.body.classList.contains('amber'))};
 document.addEventListener('change',function(e){
  if(e.target.id!=='cph')return;var file=e.target.files[0];if(!file)return;
  var r=new FileReader();r.onload=function(ev){var im=new Image();im.onload=function(){var k=document.createElement('canvas');k.width=k.height=240;var s=Math.min(im.width,im.height);k.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,240,240);photo=k.toDataURL('image/jpeg',.82);$('cphs').textContent='Photo ready'};im.src=ev.target.result};r.readAsDataURL(file);
 });
 document.addEventListener('click',function(e){
  if(e.target.id==='csave'||e.target.closest&&e.target.closest('#csave'))saveCustom();
  if(e.target.closest&&e.target.closest('#saveCv')){var a=document.createElement('a');a.href=$('readBox').dataset.cover;a.download=($('readBox').dataset.title||'story').replace(/[^\w]+/g,'-')+'.jpg';document.body.appendChild(a);a.click();a.remove()}
 });
});

</script>
</body>
