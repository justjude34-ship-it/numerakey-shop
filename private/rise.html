tting.`,howItFeels:`You go on trial for their behaviour. You over-explain and still cannot clear your name.`,counter:`Grey-rock the bait. Do not over-confess. Document who did what. One calm fact beats a long defence.`,motion:`project`},{id:`double-standards`,title:`Double standards`,expect:`Rules bind you and never them. Goalposts move after you have already run the race.`,howItFeels:`You always feel one step behind. Ordinary work becomes walking on eggshells.`,counter:`Confirm instructions in writing. Keep a trail of what was asked when. Patterns beat single “bad days.”`,motion:`double`},{id:`intermittent`,title:`Hot–cold reward`,expect:`Kindness, praise, or “you’re my best” after harm — without lasting change.`,howItFeels:`Hope floods back. You stay for the warm version. The cycle resets. The detour pretends to be the highway again.`,counter:`Treat the warm phase as data, not rescue. Ask: did behaviour change, or only tone? Keep the exit plan alive quietly.`,motion:`hotcold`},{id:`isolation`,title:`Isolate & discredit`,expect:`Peers, mentors, or outside life get criticised. Your reputation is managed behind closed doors.`,howItFeels:`You stop checking reality with safe people. Shame grows in private. The detour feels like the whole map.`,counter:`One trusted ally outside their influence. Job-search and venting on personal devices. You are allowed witnesses — and a road past this.`,motion:`isolate`}],ul=[{title:`Cognitive dissonance`,body:`Holding two conflicting truths — what you experienced versus what they insist is real — is agonising. That pain often means your perception is still intact. The playbook is predictable; your distress is a normal response to a hard detour.`},{title:`Hypervigilance`,body:`Chronic scanning, second-guessing, bracing for the next shift. Naming the playbook can slowly lower the false-alarm volume — while you still plan for safety and the road beyond.`}],dl=[{title:`Facts only, same day`,body:`Date, time, who was there, what was said or emailed, what was decided. Stick to what a camera would have seen. Same-day notes protect you when the predictable rewrite arrives.`},{title:`Tag the playbook move`,body:`In your private log, add a short label: gaslight / split / project / double standard / hot-cold / isolate. Over weeks, the map becomes undeniable — and proof that this stretch has a pattern, not a destiny.`},{title:`Keep a private trail`,body:`Store notes outside systems they control — personal email, notebook at home, phone note behind a PIN. Assume work chat and devices may not be safe.`},{title:`Save originals`,body:`Key emails, goal changes, public praise, sudden criticism — with timestamps. The cycle (praise → attack → deny) is the professional record the “one bad day” story tries to erase.`},{title:`Confirm in writing`,body:`After verbal instructions that rewrite earlier ones: “Just to confirm, you asked me to X by Friday instead of Y.” Their reply — or silence — is part of the record.`},{title:`When you are ready for support`,body:`Trusted HR, union rep, employment lawyer, or labour advisory (e.g. Fair Work in Australia) can help you use a pattern log safely. You do not have to win the argument in the moment.`}],fl=[{title:`Detour, not destiny`,body:`When you can say “this is the split / the rewrite / the projection,” you spend less energy on “what is wrong with me?” Predictability is a tool for distance. This chapter is a hard detour — not the final destination.`},{title:`Grey rock when baited`,body:`Short, factual, unemotional replies. Do not over-explain, confess, or chase the warm version mid-storm. Starve the drama; keep energy for documentation and the path past them.`},{title:`One reality log for you`,body:`Write your version privately once when they rewrite history — then stop re-litigating out loud. Let the log hold the truth so your body does not argue all day.`},{title:`Regulate before you respond`,body:`Box breathing or 5-4-3-2-1 before send or walk-in. Anticipating the playbook helps; a settled nervous system helps more in the moment.`},{title:`Bounded empathy`,body:`You can understand that insecurity may drive the playbook without absorbing responsibility for their feelings or covering for their behaviour.`}],pl=[{title:`The detour ends somewhere`,body:`You do not have to love this job, fix this boss, or turn the detour into a scenic route. Quiet planning is how many people reach the next stretch of road.`},{title:`Quiet exit planning`,body:`CV with evidence of wins, peers outside their influence, job-search on a personal device. No dramatic speech required. Strategy can be silent — and still point past them.`},{title:`Financial & practical runway`,body:`Small buffer if you can, leave balances, notice periods, non-competes. Practical clarity reduces panic when the next playbook crisis hits.`},{title:`References & narrative`,body:`People who can speak to your work. Brief, calm story focused on growth and fit — not a full trauma dump in interviews. The detour does not get the last word on who you are.`},{title:`If you must stay for now`,body:`Staying while you plan is strategy, not failure — and not proof this is forever. Use the playbook map, document, detach where you can, Ground when flooded, hotline if panic or hopelessness spikes.`}],ml=[{id:`gaslighting`,label:`Gaslight / rewrite`},{id:`splitting`,label:`Golden ↔ scapegoat`},{id:`projection`,label:`Projection`},{id:`double-standards`,label:`Double standard`},{id:`intermittent`,label:`Hot–cold reward`},{id:`isolation`,label:`Isolate / discredit`}],hl=ti(`/help/workplace`)({component:_l}),gl=[{id:`playbook`,label:`Playbook`},{id:`document`,label:`Document`},{id:`detach`,label:`Detach`},{id:`exit`,label:`Past it`}];function _l(){let[e,t]=(0,_.useState)(`playbook`),[n,r]=(0,_.useState)(ll[0]?.id??null),[i,a]=(0,_.useState)({});(0,_.useEffect)(()=>{a(as(`playbookSpots`,{}))},[]);let o=e=>{a(t=>{let n={...t,[e]:(t[e]??0)+1};return os(`playbookSpots`,n),n})};return(0,j.jsxs)(ws,{title:`Pla
