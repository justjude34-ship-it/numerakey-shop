<title>Room to Breathe</title>

<style>
  :root {
    --bg: #0a0a0b;
    --surface: #141416;
    --elevated: #1b1b1f;
    --fg: #f4f4f5;
    --muted: #a1a1aa;
    --subtle: #71717a;
    --border: #2a2a30;
    --teal: #14b8a6;
    --teal-dark: #0f766e;
    --fuchsia: #c026d3;
    --purple: #7c3aed;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button, a { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  img { max-width: 100%; }
  .wordmark {
    background: linear-gradient(135deg, #7c3aed 0%, #c026d3 48%, #db2777 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .shell { max-width: 430px; margin: 0 auto; min-height: 100dvh; position: relative; }

  /* Welcome */
  .welcome { position: relative; min-height: 100dvh; overflow: hidden; background: #f6efe6; }
  .welcome .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; pointer-events: none; }
  .welcome .veil { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(255,255,255,.2), rgba(255,255,255,.4) 45%, rgba(255,255,255,.88)); }
  .welcome-hit {
    position: relative; z-index: 2;
    display: flex; min-height: 100dvh; width: 100%;
    align-items: center; justify-content: center;
    padding: 32px 24px calc(112px + env(safe-area-inset-bottom));
    border: 0; background: transparent; text-align: center;
  }
  .welcome-card { width: min(320px, 100%); display: flex; flex-direction: column; align-items: center; }
  .avatar { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; object-position: center;
    border: 2px solid #fff; box-shadow: 0 12px 40px rgba(0,0,0,.18); }
  .kicker { margin: 16px 0 6px; letter-spacing: .18em; font-size: 12px; font-weight: 700; color: var(--teal-dark); }
  .welcome h1 { margin: 0 0 10px; font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
  .welcome p { margin: 0 0 22px; color: #3f3f46; font-size: 16px; line-height: 1.5; }
  .cta {
    display: flex; align-items: center; justify-content: center;
    min-height: 52px; width: 100%; border-radius: var(--radius);
    background: var(--teal); color: #06221e; font-weight: 650; font-size: 15px;
    box-shadow: 0 8px 24px rgba(20,184,166,.28);
  }
  .own { margin-top: 14px !important; font-size: 12px !important; color: #71717a !important; }

  /* App */
  .app { display: none; min-height: 100dvh; padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
  .app.on { display: block; }
  .welcome.off { display: none; }
  .pad { padding: 20px 20px 8px; }
  h1.page { margin: 0; font-size: 26px; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }

  .hero { position: relative; height: 280px; overflow: hidden; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .fade { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, var(--bg)); }
  .hero .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 20px 18px; }
  .hero h1 { margin: 0 0 4px; font-size: 30px; }
  .hero p { margin: 0; max-width: 280px; color: #e4e4e7; font-size: 14px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
  .glow { box-shadow: 0 0 40px rgba(124,58,237,.18); }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .mini { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(192,38,211,.45); flex: none; }
  .label { margin: 0 0 4px; font-size: 11px; letter-spacing: .08em; font-weight: 700; color: var(--teal); }
  .body { margin: 0; font-size: 14px; line-height: 1.5; color: #e4e4e7; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 48px; margin-top: 12px; padding: 0 16px;
    border-radius: var(--radius); border: 0; background: var(--teal); color: #06221e;
    font-weight: 650; font-size: 15px;
  }
  .btn.secondary { background: var(--surface); color: var(--fg); border: 1px solid var(--border); }
  .btn:active { transform: scale(.98); }

  .grid2 { display: grid; grid-cols: 2; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .tile { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .tile:active { border-color: var(--purple); }
  .tile strong { display: block; font-size: 14px; }
  .tile span { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .ico { width: 22px; height: 22px; margin-bottom: 8px; display: block; }

  .zone {
    position: relative; height: 208px; width: 100%; margin-bottom: 12px;
    border-radius: 16px; border: 1px dashed var(--border); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted);
    overflow: hidden;
  }
  .zone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hint { text-align: center; font-size: 12px; color: var(--subtle); margin: 0 0 8px; }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .pane { overflow: hidden; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
  .pane p { margin: 0; padding: 8px 12px 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .pane .shot { height: 96px; position: relative; }
  .pane .shot img { width: 100%; height: 100%; object-fit: cover; }
  .cleared { height: 96px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f172a, #0f766e); color: var(--teal); font-size: 14px; }

  .sec {
    display: flex; gap: 12px; align-items: center; width: 100%; text-align: left;
    margin-bottom: 8px; padding: 14px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
  }
  .sec.on { border-color: var(--teal); background: #0f1a1a; }
  .num { width: 32px; height: 32px; border-radius: 50%; background: var(--teal); color: #06221e;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex: none; }
  .sec strong { display: block; font-size: 14px; }
  .sec em { display: block; font-style: normal; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .start { margin-left: auto; font-size: 12px; color: var(--teal); font-weight: 650; }

  .decisions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dec {
    min-height: 76px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600;
  }
  .dec:active { border-color: var(--purple); }
  .dec svg { width: 20px; height: 20px; stroke: var(--fuchsia); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
  .stat b { display: block; font-size: 28px; color: var(--teal); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .win { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; font-size: 14px; }
  .win time { display: block; margin-top: 4px; font-size: 12px; color: var(--subtle); }

  .mira-head { display: flex; gap: 12px; align-items: center; margin: 16px 0; }
  .mira-head img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(192,38,211,.45); }
  .line { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 10px; }

  .nav {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; z-index: 20;
    width: min(430px, 100%); display: flex;
    background: rgba(10,10,11,.94); border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(8px);
  }
  .nav button {
    flex: 1; min-height: 56px; border: 0; background: transparent; color: var(--subtle);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; font-weight: 600;
  }
  .nav button.on { color: var(--fg); }
  .nav svg { width: 20px; height: 20px; }
  .nav button.on svg { stroke: var(--fuchsia); }

  .toast {
    position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%); z-index: 30;
    background: var(--elevated); color: var(--fg); border-radius: 999px; padding: 8px 16px;
    font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); white-space: nowrap;
  }
  .hidden { display: none !important; }
</style>
</head>

const DECISIONS = [
  ["donate", "Donate", "gift", "Beautiful. Someone else will be so glad to have that. One less thing weighing on you."],
  ["sell", "Sell", "tag", "Nice. Setting it aside to sell later is still progress. You’re clearing space today."],
  ["give", "Give away", "heart", "That’s a kind choice. The right person will appreciate it, and your space gets lighter."],
  ["discard", "Discard", "trash", "Sometimes the kindest thing is to let it go completely. Well done."],
  ["skip", "Skip for now", "clock", "Totally okay. “Not sure yet” is a real answer. Put it in a maybe box and keep the momentum."]
];
const LINES = [
  "I’ll sit with you while you do one small thing. No rush. No judgment. Just company.",
  "Task paralysis is real. Your brain isn’t broken — it’s just protecting you from a mountain that feels too big. We can shrink it to one pebble.",
  "Some days the hardest part is just opening the app. You did that. That’s enough for now if you need it to be.",
  "You don’t have to earn rest. Closing this and doing nothing is still progress. I’m proud of every time you show up.",
  "If your mind is racing, try naming one surface that feels the least bad. We start there. I’m not going anywhere.",
  "The freeze is protective. We don’t fight it. We wait beside it until one tiny thing feels possible.",
  "Shopping more to soothe the mess is a loop, not a flaw. Noticing it is already a kind of clearing."
];
const KEY = "room-to-breathe-wins";

const svg = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6h14v9H8l-3 3z"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></svg>',
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 11h16v9H4zM3 7h18v4H3zM12 7v13"/><path d="M12 7c-2-4-6-2-4 0M12 7c2-4 6-2 4 0"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="8" cy="8" r="1.2" fill="currentColor"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 7h14M9 7V5h6v2M8 7l1 13h6l1-13"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>'
};

let S = {
  tab: "home",
  step: "photo",
  photo: null,
  section: SECTIONS[0][0],
  buddy: "One item at a time. You’re doing great.",
  wins: []
};

function esc(s) {
  return String(s)
    .replace(/&/g, "\u0026amp;")
    .replace(/</g, "\u0026lt;")
    .replace(/>/g, "\u0026gt;")
    .replace(/"/g, "\u0026quot;")
    .replace(/'/g, "\u0026#39;");
}
function loadWins() {
  try { const r = JSON.parse(localStorage.getItem(KEY) || "[]"); S.wins = Array.isArray(r) ? r : []; }
  catch { S.wins = []; }
}
function saveWins() {
  try { localStorage.setItem(KEY, JSON.stringify(S.wins.slice(0, 40))); } catch {}
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add("hidden"), 2200);
}

function enter() {
  document.getElementById("welcome").classList.add("off");
  document.getElementById("app").classList.add("on");
  document.getElementById("nav").classList.remove("hidden");
  render();
}

function setTab(tab) { S.tab = tab; render(); }
function setStep(step) { S.step = step; S.tab = "declutter"; render(); }

function renderNav() {
  const items = [
    ["home", "Home", "home"],
    ["declutter", "Declutter", "camera"],
    ["progress", "Progress", "heart"],
    ["mira", "Mira", "chat"]
  ];
  document.getElementById("nav").innerHTML = items.map(([id, label, icon]) =>
    `<button type="button" class="${S.tab === id ? "on" : ""}" data-tab="${id}">${svg[icon]}<span>${label}</span></button>`
  ).join("");
}

function homeHTML() {
  return `
    <div class="hero"><img alt="" src="${HERO}" /><div class="fade"></div>
      <div class="cap"><h1 class="wordmark">Room to Breathe</h1>
      <p>For when the mess feels too big and you don’t know where to start.</p></div>
    </div>
    <div class="pad">
      <div class="card glow"><div class="row">
        <img class="mini" alt="Mira" src="${MIRA}" />
        <div><p class="label">MIRA</p><p class="body">I’ll sit with you while you do one small thing. We don’t have to clear the whole room. Just one tiny space, together.</p></div>
      </div></div>
      <button type="button" class="btn" data-go="photo">${svg.camera} Start decluttering</button>
      <button type="button" class="btn secondary" data-tab="mira">Just sit with Mira first</button>
      <div class="grid2">
        <button type="button" class="tile" data-go="photo">${svg.camera.replace('stroke="currentColor"','stroke="#c026d3"')}<strong>Snap a space</strong><span>See the clear version</span></button>
        <button type="button" class="tile" data-tab="progress">${svg.spark.replace('stroke="currentColor"','stroke="#14b8a6"')}<strong>Your wins</strong><span>Tiny progress log</span></button>
      </div>
    </div>`;
}

function photoHTML() {
  const shot = S.photo ? `<img alt="Your space" src="${S.photo}" />` : `${svg.camera}<span>Tap to take a photo of your space</span>`;
  return `
    <div class="pad"><h1 class="page wordmark">Declutter</h1><p class="sub">Snap a space or jump straight to sections.</p></div>
    <div class="pad">
      <button type="button" class="zone" id="pick">${shot}</button>
      <input id="file" class="hidden" type="file" accept="image/*" capture="environment" />
      <button type="button" class="btn secondary" id="sample">Use a sample photo instead</button>
      <p class="hint">Camera can be blocked on some phones. The sample works every time.</p>
      ${S.photo ? `<button type="button" class="btn" data-step="vision">Show me the clear version</button>` : ""}
      <button type="button" class="btn secondary" data-step="vision">Skip photo — start with sections</button>
    </div>`;
}

function visionHTML() {
  const now = S.photo
    ? `<img alt="Now" src="${S.photo}" />`
    : `<div class="cleared" style="background:#141416;color:#a1a1aa">Cluttered</div>`;
  const secs = SECTIONS.map((s, i) => `
    <button type="button" class="sec ${S.section === s[0] ? "on" : ""}" data-sec="${esc(s[0])}">
      <span class="num">${i + 1}</span>
      <span><strong>${esc(s[0])}</strong><em>${esc(s[1])}</em></span>
      ${S.section === s[0] ? `<span class="start">Start here</span>` : ""}
    </button>`).join("");
  return `
    <div class="pad"><h1 class="page wordmark">Declutter</h1><p class="sub">Here’s what’s possible.</p>
      <div class="compare" style="margin-top:16px">
        <div class="pane"><p>Now</p><div class="shot">${now}</div></div>
        <div class="pane"><p>Cleared</p><div class="shot"><img alt="Cleared" src="${HERO}" /></div></div>
      </div>
      <p class="sub" style="margin-bottom:12px">Mira suggests starting with the easiest win.</p>
      ${secs}
      <button type="button" class="btn" data-step="session">Begin with this section</button>
      <button type="button" class="btn secondary" data-step="photo">Back</button>
    </div>`;
}

function sessionHTML() {
  const cards = DECISIONS.map(d => `
    <button type="button" class="dec" data-dec="${d[0]}">${svg[d[2]]}<span>${esc(d[1])}</span></button>`).join("");
  return `
    <div class="pad">
      <h1 class="page wordmark">${esc(S.section)}</h1>
      <p class="sub">One item at a time. You’re doing great.</p>
      <div class="card" style="margin-top:16px"><p class="label">MIRA</p><p class="body">${esc(S.buddy)}</p></div>
      <h2 style="font-size:15px;margin:18px 0 4px">Found something you’re unsure about?</h2>
      <p class="sub">That’s completely normal. Pick whatever feels right — or skip it for now.</p>
      <div class="decisions" style="margin-top:12px">${cards}</div>
      <button type="button" class="btn" data-tab="progress">That’s enough for today</button>
    </div>`;
}

function progressHTML() {
  const sections = new Set(S.wins.map(w => String(w.text).split(":")[0])).size;
  const list = S.wins.length
    ? S.wins.map(w => `<div class="win"><strong>${esc(w.text)}</strong><time>${esc(new Date(w.at).toLocaleString())}</time></div>`).join("")
    : `<p class="card body">Nothing logged yet — and that’s okay. The first win is opening this.</p>`;
  return `
    <div class="pad">
      <h1 class="page wordmark">Progress</h1>
      <p class="sub">Tiny wins count. Showing up counts.</p>
      <div class="stats">
        <div class="stat"><b>${S.wins.length}</b><span>Decisions logged</span></div>
        <div class="stat"><b>${sections}</b><span>Sections touched</span></div>
      </div>
      ${list}
    </div>`;
}

function miraHTML() {
  const lines = LINES.map(line => `<div class="line"><p class="label">MIRA</p><p class="body">${esc(line)}</p></div>`).join("");
  return `
    <div class="pad">
      <h1 class="page wordmark">Mira</h1>
      <p class="sub">Your calm companion for clearing space — physical and mental.</p>
      <div class="mira-head">
        <img alt="Mira" src="${MIRA}" />
        <div><p class="label">MIRA</p><p class="sub" style="margin:0">Sitting with you. No rush.</p></div>
      </div>
      ${lines}
      <button type="button" class="btn" data-go="photo">I’m ready to start a section</button>
      <button type="button" class="btn secondary" data-tab="home">Back to home</button>
      <p class="hint" style="margin-top:18px">Room to Breathe is one file. No account. No subscription. This copy is yours.</p>
    </div>`;
}

function render() {
  const root = document.getElementById("app");
  if (S.tab === "home") root.innerHTML = homeHTML();
  else if (S.tab === "declutter" && S.step === "photo") root.innerHTML = photoHTML();
  else if (S.tab === "declutter" && S.step === "vision") root.innerHTML = visionHTML();
  else if (S.tab === "declutter") root.innerHTML = sessionHTML();
  else if (S.tab === "progress") root.innerHTML = progressHTML();
  else root.innerHTML = miraHTML();
  renderNav();
  window.scrollTo(0, 0);
}

document.getElementById("ready").addEventListener("click", enter);

document.body.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-go],[data-step],[data-sec],[data-dec],#pick,#sample");
  if (!t) return;
  if (t.dataset.tab) setTab(t.dataset.tab);
  if (t.dataset.go === "photo") { S.step = "photo"; setTab("declutter"); }
  if (t.dataset.step) setStep(t.dataset.step);
  if (t.dataset.sec) { S.section = t.dataset.sec; render(); }
  if (t.id === "pick") document.getElementById("file").click();
  if (t.id === "sample") { S.photo = SAMPLE; render(); }
  if (t.dataset.dec) {
    const d = DECISIONS.find(x => x[0] === t.dataset.dec);
    S.buddy = d[3];
    S.wins.unshift({ id: Date.now() + "-" + S.wins.length, text: S.section + ": " + d[0], at: Date.now() });
    saveWins();
    toast(d[0] === "skip" ? "Left for later — good call" : "Logged · keep going");
    render();
  }
});

document.body.addEventListener("change", (e) => {
  if (e.target.id !== "file" || !e.target.files || !e.target.files[0]) return;
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = () => { S.photo = reader.result; render(); };
  reader.readAsDataURL(file);
  e.target.value = "";
});

loadWins();
S.tab = "mira";
enter();
</script>
</body>
</html>
