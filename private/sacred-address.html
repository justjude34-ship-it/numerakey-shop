<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacred Address</title>
<meta name="description" content="Discover the vibration of the place that has chosen you — house and apartment number numerology after Thomas Muldoon.">
<meta name="color-scheme" content="only dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-title" content="Sacred Address">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Georgia,serif' font-size='18' fill='%23e8c57a'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:only dark;
  --bg:#000;
  --fg:#f3ebe0;
  --muted:#b7aa98;
  --subtle:#7a7166;
  --gold:#e8c57a;
  --rose:#e392a8;
  --card:#141210;
  --line:rgba(243,235,224,.1);
  --display:"Cormorant Garamond",ui-serif,Georgia,"Times New Roman",serif;
  --sans:"Figtree",ui-sans-serif,system-ui,sans-serif;
  --glow:0 0 40px rgba(232,197,122,.22),0 10px 40px rgba(167,139,219,.12);
}
html,body{margin:0;min-height:100dvh;background:#000!important;color:var(--fg);color-scheme:only dark;font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:not(:disabled){cursor:pointer}
h1,h2{text-wrap:balance;margin:0}
p{text-wrap:pretty}
input,textarea,select,button{color-scheme:dark}
input{background:rgba(0,0,0,.6);color:var(--fg);caret-color:var(--gold)}
input::placeholder{color:var(--subtle)}
input:-webkit-autofill{ -webkit-text-fill-color:#f3ebe0;box-shadow:0 0 0 1000px #141210 inset }
@media (prefers-color-scheme:light){
  html,body{background:#000;color:#f3ebe0;color-scheme:only dark}
}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;background:#000}
.orb{position:absolute;border-radius:9999px;filter:blur(80px);opacity:.34}
.orb-gold{width:42vw;height:42vw;min-width:280px;min-height:280px;top:-12vw;right:-10vw;background:radial-gradient(circle,rgba(232,197,122,.55),transparent 68%)}
.orb-violet{width:48vw;height:48vw;min-width:300px;min-height:300px;bottom:-16vw;left:-14vw;background:radial-gradient(circle,rgba(167,139,219,.5),transparent 70%)}
.orb-blue{width:36vw;height:36vw;min-width:240px;min-height:240px;top:38%;left:42%;background:radial-gradient(circle,rgba(90,140,210,.38),transparent 70%)}
.grain{position:absolute;inset:0;opacity:.11;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px 180px}
.shell{position:relative;z-index:1;display:flex;min-height:100dvh;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 0}
.brand{background:none;border:0;padding:0;font-family:var(--display);font-size:1.25rem;letter-spacing:.02em}
.main{flex:1;padding:24px 16px 64px}
.foot{padding:0 16px max(1.5rem,env(safe-area-inset-bottom));text-align:center}
.foot p{margin:0 auto;max-width:28rem;font-size:.72rem;line-height:1.5;color:var(--subtle)}
.wrap{margin:0 auto;display:flex;width:100%;max-width:36rem;flex-direction:column;gap:2rem}
.wrap-wide{max-width:48rem}
.center{text-align:center}
.eyebrow{margin:0;font-size:.7rem;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:rgba(232,197,122,.85)}
.gradient-text{background-image:linear-gradient(115deg,#e8c57a 0%,#e392a8 32%,#a78bdb 66%,#7ed4d9 100%);background-size:180% 180%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 10s ease-in-out infinite}
.hero-title{margin-top:12px;font-family:var(--display);font-weight:500;font-size:clamp(3rem,12vw,5.4rem);line-height:.9}
.tagline{margin:16px auto 0;max-width:28rem;font-family:var(--display);font-style:italic;font-size:1.15rem;line-height:1.3;color:var(--muted)}
.glass{background:color-mix(in oklab,#141210 78%,transparent);backdrop-filter:blur(22px) saturate(1.15);-webkit-backdrop-filter:blur(22px) saturate(1.15);border:1px solid transparent;background-image:linear-gradient(color-mix(in oklab,#141210 78%,transparent),color-mix(in oklab,#141210 78%,transparent)),linear-gradient(135deg,rgba(232,197,122,.5),rgba(227,146,168,.28),rgba(167,139,219,.42),rgba(126,212,217,.32));background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 20px 60px rgba(0,0,0,.45);border-radius:28px}
.card-pad{padding:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-size:.9rem;font-weight:500}
.field input{height:48px;border:0;border-radius:14px;padding:0 16px;font-size:1rem;box-shadow:0 0 0 1px rgba(243,235,224,.16);outline:none}
.field input:focus{box-shadow:0 0 0 1px rgba(232,197,122,.55)}
.note{margin:16px 0 0;font-size:.9rem;color:var(--subtle)}
.err{margin:16px 0 0;font-size:.9rem;color:var(--rose)}
.btn-primary{margin-top:24px;display:flex;height:48px;width:100%;align-items:center;justify-content:center;border:0;border-radius:999px;padding:0 24px;font-size:.9rem;font-weight:600;letter-spacing:.02em;color:#140f0a;background-image:linear-gradient(115deg,#e8c57a 0%,#e392a8 34%,#a78bdb 68%,#7ed4d9 100%);background-size:160% 160%;box-shadow:var(--glow)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:active{transform:scale(.98)}
.examples{margin-top:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.btn-ghost{background:transparent;color:var(--fg);box-shadow:0 0 0 1px rgba(243,235,224,.22);border:0;border-radius:999px;min-height:44px;padding:0 16px;font-size:.85rem}
.btn-ghost:hover{background:rgba(243,235,224,.05)}
.btn-ghost.sm{font-size:.75rem;letter-spacing:.02em;height:40px;min-height:40px}
.method-toggle{display:flex;min-height:48px;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:none;border:0;text-align:left;font-family:var(--display);font-size:1.25rem}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .2s}
.chev.open{transform:rotate(180deg)}
.method-body{border-top:1px solid var(--line);padding:16px 20px 20px;font-size:.9rem;line-height:1.6;color:var(--muted)}
.method-body p{margin:0 0 16px}
.method-body ul{margin:0 0 16px;padding:0;list-style:none}
.method-body li{margin:8px 0}
.em{color:var(--fg)}
.gold{color:var(--gold)}
.section-label{margin:0 0 12px;font-size:.68rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--subtle)}
.history{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.history button{display:flex;min-height:48px;width:100%;align-items:center;justify-content:space-between;padding:12px 16px;background:inherit;border:0;text-align:left;border-radius:22px}
.history .label{font-family:var(--display);font-size:1.15rem}
.history .open{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--subtle)}
.linkish{background:none;border:0;color:var(--muted);font-size:.9rem;text-underline-offset:4px}
.linkish:hover{color:var(--fg);text-decoration:underline}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.result-title{margin-top:12px;font-family:var(--display);font-size:clamp(1.8rem,5vw,2.4rem);color:var(--fg)}
.lede{margin:12px auto 0;max-width:32rem;font-size:.9rem;line-height:1.6;color:var(--muted)}
.layers{display:flex;flex-direction:column;gap:48px}
.rule{margin:0;text-align:center;font-size:.72rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(232,197,122,.7)}
.role{margin:0;font-size:.68rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--subtle)}
.numeral-wrap{position:relative;display:inline-flex;flex-direction:column;align-items:center;margin-top:8px}
.halo{position:absolute;top:50%;left:50%;width:11rem;height:11rem;transform:translate(-50%,-50%);border-radius:999px;background:radial-gradient(circle,rgba(232,197,122,.2),transparent 68%);pointer-events:none}
.numeral{position:relative;font-family:var(--display);font-weight:500;font-size:clamp(5.5rem,22vw,8.5rem);line-height:1;filter:drop-shadow(0 0 28px rgba(232,197,122,.32)) drop-shadow(0 0 64px rgba(167,139,219,.18))}
.reduce-note{margin:8px 0 0;font-family:var(--display);font-style:italic;font-size:1.25rem;color:var(--muted)}
.role-note{margin:12px auto 0;max-width:28rem;font-size:.9rem;color:var(--muted)}
.steps{margin:0;padding:20px 24px;list-style:none}
.steps li,.solo{font-size:.9rem;color:rgba(243,235,224,.9);margin:8px 0}
.steps .muted,.solo{color:var(--muted)}
.meaning{padding:20px 24px}
.kicker{margin:0;font-size:.68rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--subtle)}
.meaning-head{margin-top:12px;display:flex;align-items:flex-end;gap:16px}
.meaning-n{font-family:var(--display);font-weight:500;font-size:clamp(3rem,8vw,3.6rem);line-height:1}
.meaning-title{padding-bottom:4px;font-family:var(--display);font-size:clamp(1.4rem,4vw,1.7rem);line-height:1.15;font-weight:500}
.meaning p{margin:16px 0 0;font-size:.975rem;line-height:1.65;color:var(--muted)}
.watch{font-size:.9rem;color:var(--subtle)}
.watch span{color:rgba(232,197,122,.8)}
.keywords{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.keywords li{border-radius:999px;padding:4px 12px;font-size:.7rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:rgba(232,197,122,.9);box-shadow:0 0 0 1px rgba(232,197,122,.28)}
.attracts{margin:16px 0 0;font-size:.9rem;line-height:1.6;color:rgba(243,235,224,.85)}
.attracts span{color:var(--subtle)}
.grid-gap{display:grid;gap:16px}
.lib-head{font-family:var(--display);font-size:clamp(2.2rem,6vw,3rem);font-weight:500}
.nums{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;padding:12px}
.nums button{height:40px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-family:var(--display);font-size:.9rem}
.nums button.on{background:var(--gold);color:#000}
.nums button:hover:not(.on){background:rgba(243,235,224,.1);color:var(--fg)}
.rise{animation:rise .52s cubic-bezier(.22,1,.36,1) both}
.step-in{animation:step .42s cubic-bezier(.22,1,.36,1) both}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes rise{from{opacity:0;transform:translateY(16px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes step{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (min-width:640px){
  .top,.main{padding-left:24px;padding-right:24px}
  .card-pad{padding:28px}
  .tagline{font-size:1.25rem}
  .nums{grid-template-columns:repeat(12,1fr);padding:16px}
}
@media (prefers-reduced-motion:reduce){
  .gradient-text,.rise,.step-in,.orb{animation:none!important}
  .rise,.step-in{opacity:1;transform:none;filter:none}
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <div class="orb orb-gold"></div>
  <div class="orb orb-violet"></div>
  <div class="orb orb-blue"></div>
  <div class="grain"></div>
</div>
<div class="shell">
  <header class="top">
    <button type="button" class="brand" id="brand"><span class="gradient-text">Sacred Address</span></button>
  </header>
  <main class="main" id="app"></main>
  <footer class="foot">
    <p>Interpretations drawn from the teachings of Australian numerologist Thomas Muldoon. A contemplative reading of place — not legal, financial or real-estate advice. © <span id="year"></span> Sacred Address</p>
  </footer>
</div>
<script type="application/json" id="meanings">[{"n":1,"title":"The Sovereign Flame","text":"A number One address is a house of beginnings. It favours a single clear will, independent work, and the courage to start again on your own terms. The rooms want a leader — not a committee. Life here often feels like a first chapter: bright, self-directed, occasionally lonely at the top.","keywords":["initiative","independence","leadership","new chapters"],"shadow":"Pride, isolation, or the need to win every conversation under this roof.","attracts":["Leo"]},{"n":2,"title":"The Quiet Pair","text":"A number Two address is a house of partnership and tact. It softens hard edges, asks for listening, and gathers people two by two. Moods move like tides. It is a fine place for a couple, a collaborator, or anyone who does their best work beside another person.","keywords":["partnership","sensitivity","diplomacy","receptivity"],"shadow":"Over-adaptation, indecision, or absorbing the household’s feelings as your own.","attracts":["Cancer"]},{"n":3,"title":"The Open Voice","text":"A number Three address is a house of speech, colour and company. Visitors come easily. Ideas want to be said aloud, written, sung or hung on the wall. It is a social, creative current — restless if the rooms stay silent, generous when they are used as a small stage.","keywords":["expression","sociability","creativity","visitors"],"shadow":"Scattered projects, gossip, or a home that never quite settles.","attracts":["Sagittarius"]},{"n":4,"title":"The Foundation Stone","text":"A number Four address is a house of work, order and the long build. Walls here remember effort. It rewards honesty, routine and things made to last — and it will expose shortcuts. A practical, square, enduring current. Good for craft, study with a timetable, and anyone prepared to put the bones of a life in place.","keywords":["structure","work","endurance","honesty"],"shadow":"Rigidity, overwork, or a home that feels like a task list.","attracts":["Aquarius","those born to the number Four"]},{"n":5,"title":"The Open Gate","text":"A number Five address is a house of movement. Doors open, plans change, people come and go. It loves travel, variety and the unexpected guest. Freedom is the gift; restlessness is the rent. Roots here have to be chosen — they will not grow by habit alone.","keywords":["change","freedom","travel","variety"],"shadow":"Restlessness, excess, or a household that cannot keep a promise to itself.","attracts":["Gemini","Virgo"]},{"n":6,"title":"The Hearth","text":"A number Six address is a house of care, beauty and duty. Family — chosen or blood — gathers here. The rooms ask to be made lovely and to be of use. Love is practical under this roof: meals, mending, the quiet labour of looking after people. Harmony is the aim; obligation is the shadow that walks beside it.","keywords":["home","responsibility","beauty","care"],"shadow":"Martyrdom, interference, or becoming the house’s servant rather than its inhabitant.","attracts":["Taurus","Libra"]},{"n":7,"title":"The Inner Room","text":"A number Seven address is a house of retreat. It favours study, analysis, prayer, research — any work that needs a closed door. The street can feel far away. Silence is a resource here, not an absence. People who need to think, or to be with the unseen, recognise this vibration at once.","keywords":["retreat","study","insight","privacy"],"shadow":"Isolation, suspicion, or a home that forgets how to receive a friend.","attracts":["Pisces"]},{"n":8,"title":"The Threshold of Means","text":"A number Eight address is a house of resource, authority and worldly current. Reputation matters here. Money, organisation and the management of power move through the rooms. It can be a substantial, ambitious address — a place from which things are run. Integrity is not optional; the house notices how you handle what you hold.","keywords":["authority","resource","ambition","stewardship"],"shadow":"Status-seeking, control, or confusing the house with a balance sheet.","attracts":["Capricorn"]},{"n":9,"title":"The Wide Door","text":"A number Nine address is a house of completion and the wider world. People pass through. Old stories end. Compassion, art and a public-facing life belong here. It is a generous, dramatic current — a place that asks you to give something back, and to let go of what has finished. Endings under this roof are part of its work.","keywords":["compassion","completion","the world","release"],"shadow":"Emotional drain, unfinished farewells, or saving everyone except yourself.","attracts":["Aries","Scorpio"]},{"n":10,"title":"The Returning One","text":"Ten is a full cycle that immediately begins again. A 10 house carries independence after experience — a beginner’s courage with an old soul’s memory. New chapters start here, but they are never quite naïve.","keywords":["cycle","independence","renewal"],"attracts":["Leo"]},{"n":11,"title":"The Twin Light","text":"Eleven is a high, dual current — inspiration beside tension. A 11 house can feel charged, intuitive, a little sleepless. It asks for honesty between two poles: the public self and the private one, the couple, the calling and the cost.","keywords":["inspiration","tension","vision"],"attracts":["Cancer"]},{"n":12,"title":"The Creative Order","text":"Twelve gathers expression into a usable shape. A 12 house wants art with a timetable — words, music or guests that still leave the rooms in order. The voice is strong; the frame must be stronger.","keywords":["craft","voice","shape"],"attracts":["Sagittarius"]},{"n":13,"title":"The Rebuilder","text":"Thirteen is not a curse in this teaching — it is demolition in service of a truer structure. A 13 house asks you to take something apart and lay it again, honestly. Change here is structural, not cosmetic.","keywords":["rebuild","honesty","transformation"],"attracts":["Aquarius","those born to the number Four"]},{"n":14,"title":"The Working Freedom","text":"Fourteen wants movement with a backbone. A 14 house is a good base for travel, trade or changing work — provided someone keeps the keys and the bills. Freedom that refuses all form becomes noise.","keywords":["movement","trade","discipline"],"attracts":["Gemini","Virgo"]},{"n":15,"title":"The Changing Hearth","text":"Fifteen is a family current that will not sit still. A 15 house often sees people arrive, leave, return. Care is real here, but so is restlessness. Beauty helps; clinging does not.","keywords":["family","flux","charm"],"attracts":["Taurus","Libra"]},{"n":16,"title":"The Tested Tower","text":"Sixteen is the sudden correction — a tower that must be true or it will not stand. A 16 house can bring abrupt clarity: what is false in the household becomes obvious. Rebuild on bedrock, not on appearance.","keywords":["awakening","humility","truth"],"attracts":["Pisces"]},{"n":17,"title":"The Secluded Star","text":"Seventeen is a private light. A 17 house favours the person who works alone toward something visible later — research, art, a long skill. The world may not understand the hours kept here. That is part of the design.","keywords":["vocation","solitude","hope"],"attracts":["Capricorn"]},{"n":18,"title":"The Material Harvest","text":"Eighteen draws the wide world into matters of means. A 18 house can be prosperous, public, and emotionally expensive. Handle money and influence as a trust. What you gather here is meant to circulate.","keywords":["means","public life","circulation"],"attracts":["Aries","Scorpio"]},{"n":19,"title":"The Completed Self","text":"Nineteen is independence after a long road. A 19 house often marks a chapter in which you stand on your own — wiser, less willing to pretend. Endings here make room for a cleaner beginning.","keywords":["self-reliance","closure","dignity"],"attracts":["Leo"]},{"n":20,"title":"The Cooperative Field","text":"Twenty is partnership raised to a principle. A 20 house wants two (or a small circle) working in concert. Decisions made alone can feel wrong here. Diplomacy is not weakness — it is the native language.","keywords":["alliance","patience","diplomacy"],"attracts":["Cancer"]},{"n":21,"title":"The Social Crown","text":"Twenty-one is a sociable success. A 21 house likes to be seen: dinners, conversation, a little theatre. Recognition comes more easily when the household is generous with its voice.","keywords":["recognition","company","ease"],"attracts":["Sagittarius"]},{"n":22,"title":"The Master Builder","text":"Twenty-two is a large practical vision. A 22 house can carry more than a private life — a project, a practice, a structure meant to outlast the occupants. Dream in stone, not in slogans.","keywords":["vision","foundation","scale"],"attracts":["Aquarius","those born to the number Four"]},{"n":23,"title":"The Talking Traveller","text":"Twenty-three is wit in motion. A 23 house collects stories, guests and sudden plans. It is a poor place for a closed routine and a fine one for anyone whose work is language, sales, teaching or the road.","keywords":["wit","travel","exchange"],"attracts":["Gemini","Virgo"]},{"n":24,"title":"The Steady Partnership","text":"Twenty-four is two people (or two roles) building something that lasts. A 24 house rewards shared labour and a fair division of the practical. Romance here is shown in what gets fixed, paid and kept.","keywords":["loyalty","labour","home craft"],"attracts":["Taurus","Libra"]},{"n":25,"title":"The Curious Pair","text":"Twenty-five is companionship with a passport. A 25 house wants conversation and change in the same week. Study, short trips, and a refusal to ossify keep this address kind.","keywords":["curiosity","companionship","change"],"attracts":["Pisces"]},{"n":26,"title":"The Responsible Bond","text":"Twenty-six ties partnership to duty. A 26 house often holds family business, care of relatives, or a reputation two people share. Love and labour are hard to separate here — name the load, or it will name you.","keywords":["duty","kin","shared name"],"attracts":["Capricorn"]},{"n":27,"title":"The Quiet Counsel","text":"Twenty-seven is a listening house. A 27 address favours advice given carefully, study shared with one other, and a contemplative pair. Noise is a guest, not a resident.","keywords":["counsel","study","depth"],"attracts":["Aries","Scorpio"]},{"n":28,"title":"The Allied Enterprise","text":"Twenty-eight is partnership in the world of means. A 28 house can launch a practice, a firm, or a household that handles other people’s affairs. Contracts matter. So does the mood after the meeting.","keywords":["enterprise","contracts","alliance"],"attracts":["Leo"]},{"n":29,"title":"The Sensitive Horizon","text":"Twenty-nine is a fine-strung, compassionate current. A 29 house feels the neighbourhood. Idealism lives here; so does disappointment when the world is not gentle. Guard the nervous system as you would the door.","keywords":["empathy","ideal","thin skin"],"attracts":["Cancer"]},{"n":30,"title":"The Spoken Path","text":"Thirty is creative life given a direction. A 30 house wants the work of the voice — writing, teaching, performance — to go somewhere, not merely to decorate the week. Finish things. Then speak again.","keywords":["voice","direction","finish"],"attracts":["Sagittarius"]},{"n":31,"title":"The Original Speaker","text":"Thirty-one is self-expression with a spine. A 31 house favours the person who will say the unpopular true thing. It is a poor address for hiding, and a good one for a signature style.","keywords":["originality","speech","signature"],"attracts":["Aquarius","those born to the number Four"]},{"n":32,"title":"The Gracious Exchange","text":"Thirty-two is charm in conversation. A 32 house eases introductions and softens conflict. Use the gift to tell the truth, not to paper it. Guests remember how they felt here.","keywords":["charm","tact","welcome"],"attracts":["Gemini","Virgo"]},{"n":33,"title":"The Teaching Hearth","text":"Thirty-three is a high s     var layers = [];
    if (parsed.kind === "apartment" && parsed.buildingDigits) {
      layers.push({ role: "dwelling", roleLabel: "Your dwelling", roleNote: "This number moves you and anyone who lives with you.", reduction: reduceDigits(parsed.unitDigits) });
      layers.push({ role: "building", roleLabel: "The building", roleNote: "This number moves everyone who lives in the block — including you.", reduction: reduceDigits(parsed.buildingDigits) });
    } else {
      layers.push({ role: "house", roleLabel: "This address", roleNote: "A single house or unit number — read its own vibration, nothing added from the street or suburb.", reduction: reduceDigits(parsed.unitDigits) });
    }
    return { parsed: parsed, layers: layers, createdAt: Date.now() };
  }
  function formatStep(step) { return step.parts.join(" + ") + " = " + step.sum; }
  function formatReadingText(reading) {
    var lines = ["Sacred Address", reading.parsed.label, ""];
    reading.layers.forEach(function (layer) {
      var r = layer.reduction;
      lines.push(layer.roleLabel.toUpperCase());
      lines.push(layer.roleNote);
      lines.push("Number: " + r.display);
      if (r.compound) lines.push("Compound vibration: " + r.compound);
      lines.push("Single vibration: " + r.single);
      if (r.steps.length) lines.push("Reduction: " + r.steps.map(function (s) { return s.parts.join("+") + "=" + s.sum; }).join(" → "));
      lines.push("");
    });
    lines.push("Interpretations drawn from the teachings of Australian numerologist Thomas Muldoon.");
    return lines.join("\n");
  }
  function loadHistory() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed.slice(0, MAX) : [];
    } catch (e) { return []; }
  }
  function pushHistory(reading) {
    var entry = { label: reading.parsed.label, unit: reading.parsed.unitInput, building: reading.parsed.buildingInput || "", createdAt: reading.createdAt };
    var prev = loadHistory().filter(function (h) { return !(h.unit === entry.unit && h.building === entry.building); });
    var next = [entry].concat(prev).slice(0, MAX);
    try { localStorage.setItem(KEY, JSON.stringify(next)); } catch (e) {}
    return next;
  }
  function meaningCard(n, kind, delay) {
    var m = BY_N[n];
    if (!m) return "";
    var keywords = (m.keywords || []).map(function (k) { return "<li>" + esc(k) + "</li>"; }).join("");
    var attracts = kind === "single" && m.attracts && m.attracts.length
      ? '<p class="attracts"><span>Attracts </span>' + esc(m.attracts.join(" · ")) + "</p>"
      : "";
    var shadow = m.shadow ? '<p class="watch"><span>Watch: </span>' + esc(m.shadow) + "</p>" : "";
    return '<article class="glass meaning rise" style="animation-delay:' + delay + 'ms">' +
      '<p class="kicker">' + (kind === "compound" ? "Double-digit vibration" : "Single-digit vibration") + "</p>" +
      '<div class="meaning-head"><span class="numeral-glow gradient-text meaning-n">' + n + "</span>" +
      '<h3 class="meaning-title">' + esc(m.title) + "</h3></div>" +
      "<p>" + esc(m.text) + "</p>" + shadow +
      (keywords ? '<ul class="keywords">' + keywords + "</ul>" : "") +
      attracts + "</article>";
  }
  function reductionHtml(reduction) {
    if (reduction.display.length === 1) {
      return '<p class="solo">A single-digit address — read number ' + reduction.single + " as it stands.</p>";
    }
    var items = '<li class="step-in muted" style="animation-delay:40ms">Posted number <span class="em">' + esc(reduction.display) + "</span>" +
      (reduction.compound && reduction.display.length === 2 ? " — read the double digit <span class=\"gold\">" + reduction.compound + "</span>" : "") +
      "</li>";
    reduction.steps.forEach(function (step, i) {
      var extra = "";
      if (step.sum === reduction.compound && reduction.display.length > 2) extra = '<span class="muted"> — read the double digit</span>';
      if (step.sum === reduction.single) extra = '<span class="muted"> — read the single digit</span>';
      items += '<li class="step-in" style="animation-delay:' + (120 + i * 90) + 'ms"><span style="color:var(--subtle)">' + (i + 1) + ".</span> " + esc(formatStep(step)) + extra + "</li>";
    });
    return '<ol class="steps">' + items + "</ol>";
  }
  function runRead(unit, building) {
    var parsed = parseAddress(unit, building);
    if (parsed.error) {
      state.error = parsed.error;
      state.reading = null;
      state.screen = "home";
      render();
      return;
    }
    var next = buildReading(parsed);
    state.error = null;
    state.reading = next;
    state.history = pushHistory(next);
    state.screen = "result";
    state.copied = false;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function homeHtml() {
    var examples = EXAMPLES.map(function (ex, i) {
      return '<button type="button" class="btn-ghost sm" data-ex="' + i + '">' + esc(ex.label) + "</button>";
    }).join("");
    var history = "";
    if (state.history.length) {
      history = '<section class="rise" style="animation-delay:160ms"><h2 class="section-label">Recent readings</h2><ul class="history">' +
        state.history.map(function (h, i) {
          return '<li><button type="button" class="glass" data-hist="' + i + '"><span class="label">' + esc(h.label) + '</span><span class="open">Open</span></button></li>';
        }).join("") + "</ul></section>";
    }
    var msg = state.error && state.touched
      ? '<p class="err" role="alert">' + esc(state.error) + "</p>"
      : '<p class="note">Letters fall away. Only the numerals are read — and a unit is never added to its building.</p>';
    var method = state.methodOpen
      ? '<div class="method-body"><p>This tool follows Thomas Muldoon’s house and apartment method only. It does not read a birth date, a birth name, a ruling number, or a personal year.</p><ul><li><span class="em">One digit</span> — read numbers 1 to 9 as they stand.</li><li><span class="em">Two digits</span> — read the double digit (10–99), then reduce to a single digit and read that too.</li><li><span class="em">Three or more digits</span> — add the numerals to a double digit, read it, then reduce to a single digit. Example: 129 → 1+2+9 = <span class="gold">12</span>, then 1+2 = <span class="gold">3</span>.</li></ul><p><span class="em">Apartments.</span> If the address is written in the Australian form <span class="em">13/4329</span>, the unit (13) moves you and anyone who lives with you. The building (4329) moves <span class="em">everyone</span> in the block. Read them separately. Never add 1+3+4+3+2+9 as one sum.</p><p>Letters and punctuation are set aside. <span class="em">12B</span> is read as 12; <span class="em">Unit 8</span> is read as 8.</p></div>'
      : "";
    return '<div class="wrap"><header class="rise center"><p class="eyebrow">After Thomas Muldoon</p><h1 class="gradient-text hero-title">Sacred Address</h1><p class="tagline">Discover the vibration of the place that has chosen you — after Thomas Muldoon</p></header>' +
      '<form class="glass card-pad rise" id="form" style="animation-delay:80ms"><div class="stack">' +
      '<div class="field"><label for="unit">House or unit number</label><input id="unit" autocomplete="street-address" placeholder="47, 12B, 3/156, Unit 8, 8A" value="' + esc(state.unit) + '"></div>' +
      '<div class="field"><label for="building">Building or block</label><input id="building" placeholder="Optional. Leave empty if you typed a slash address." value="' + esc(state.building) + '"></div>' +
      "</div>" + msg +
      '<button type="submit" class="btn-primary">Read the vibration</button><div class="examples">' + examples + "</div></form>" +
      '<div class="glass"><button type="button" class="method-toggle" id="method" aria-expanded="' + (state.methodOpen ? "true" : "false") + '"><span>How Muldoon reads an address</span><svg class="chev' + (state.methodOpen ? " open" : "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>' + method + "</div>" +
      history +
      '<div class="center"><button type="button" class="linkish" id="open-lib">Browse numbers 1–99</button></div></div>';
  }
  function resultHtml() {
    var reading = state.reading;
    var layers = reading.layers.map(function (layer, i) {
      var r = layer.reduction;
      var hero = r.compound != null ? r.compound : r.single;
      var rule = reading.parsed.kind === "apartment" && i === 1
        ? '<p class="rule">Building current — not added to the unit</p>' : "";
      var cards = "";
      if (r.compound != null) cards += meaningCard(r.compound, "compound", 180);
      cards += meaningCard(r.single, "single", 260);
      return '<section class="grid-gap">' + rule +
        '<div class="rise center" style="animation-delay:' + (i * 60) + 'ms"><p class="role">' + esc(layer.roleLabel) + '</p><div class="numeral-wrap"><div class="halo"></div><span class="numeral gradient-text">' + hero + "</span>" +
        (r.compound != null ? '<p class="reduce-note">reducing to ' + r.single + "</p>" : "") +
        '</div><p class="role-note">' + esc(layer.roleNote) + "</p></div>" +
        '<div class="glass">' + reductionHtml(r) + "</div>" +
        '<div class="grid-gap">' + cards + "</div></section>";
    }).join("");
    var lede = reading.parsed.kind === "apartment"
      ? "Two currents, never added together. The unit moves the household. The building moves everyone who lives in the block."
      : "A house or unit standing on its own number. Read the double digit if there is one, then the single digit it becomes.";
    return '<div class="wrap wrap-wide"><div class="row"><button type="button" class="btn-ghost" id="back">← Another address</button><div class="row-actions"><button type="button" class="btn-ghost" id="copy">' + (state.copied ? "Copied" : "Copy reading") + '</button><button type="button" class="btn-ghost" id="lib">Library</button></div></div>' +
      '<header class="rise center"><p class="eyebrow">After Thomas Muldoon</p><h1 class="result-title">' + esc(reading.parsed.label) + '</h1><p class="lede">' + lede + "</p></header><div class=\"layers\">" + layers + "</div></div>";
  }
  function libraryHtml() {
    var buttons = "";
    for (var n = 1; n <= 99; n++) {
      buttons += '<button type="button" data-n="' + n + '" class="' + (state.selected === n ? "on" : "") + '" aria-pressed="' + (state.selected === n ? "true" : "false") + '">' + n + "</button>";
    }
    var kind = state.selected <= 9 ? "single" : "compound";
    return '<div class="wrap wrap-wide"><div class="row"><button type="button" class="btn-ghost" id="lib-back">← Back</button><p class="section-label" style="margin:0">Numbers 1–99</p></div>' +
      '<header class="rise"><h1 class="lib-head">The library</h1><p class="lede" style="margin-left:0">Single digits 1–9 are the root vibrations of a place. Double digits 10–99 are read as themselves, then reduced. Choose a number.</p></header>' +
      '<div class="glass nums">' + buttons + "</div>" + meaningCard(state.selected, kind, 0) + "</div>";
  }
  function render() {
    var app = document.getElementById("app");
    if (state.screen === "result" && state.reading) app.innerHTML = resultHtml();
    else if (state.screen === "library") app.innerHTML = libraryHtml();
    else app.innerHTML = homeHtml();
    bind();
  }
  function bind() {
    var form = document.getElementById("form");
    if (form) {
      var unit = document.getElementById("unit");
      var building = document.getElementById("building");
      unit.addEventListener("input", function () { state.unit = unit.value; });
      building.addEventListener("input", function () { state.building = building.value; });
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        state.touched = true;
        state.unit = unit.value;
        state.building = building.value;
        runRead(state.unit, state.building);
      });
      form.querySelectorAll("[data-ex]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var ex = EXAMPLES[Number(btn.getAttribute("data-ex"))];
          state.touched = true;
          state.unit = ex.unit;
          state.building = ex.building;
          runRead(ex.unit, ex.building);
        });
      });
    }
    var method = document.getElementById("method");
    if (method) method.addEventListener("click", function () {
      state.methodOpen = !state.methodOpen;
      var unitEl = document.getElementById("unit");
      var bldEl = document.getElementById("building");
      if (unitEl) state.unit = unitEl.value;
      if (bldEl) state.building = bldEl.value;
      render();
    });
    document.querySelectorAll("[data-hist]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var h = state.history[Number(btn.getAttribute("data-hist"))];
        state.unit = h.unit;
        state.building = h.building;
        state.touched = true;
        runRead(h.unit, h.building);
      });
    });
    var openLib = document.getElementById("open-lib");
    if (openLib) openLib.addEventListener("click", function () {
      state.libraryReturn = "home";
      state.screen = "library";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    var back = document.getElementById("back");
    if (back) back.addEventListener("click", function () {
      state.screen = "home";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    var copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", function () {
      var text = formatReadingText(state.reading);
      var done = function () { state.copied = true; render(); setTimeout(function () { state.copied = false; if (state.screen === "result") render(); }, 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
      } else fallbackCopy(text, done);
    });
    var lib = document.getElementById("lib");
    if (lib) lib.addEventListener("click", function () {
      state.libraryReturn = "result";
      state.screen = "library";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    var libBack = document.getElementById("lib-back");
    if (libBack) libBack.addEventListener("click", function () {
      state.screen = state.libraryReturn === "result" && state.reading ? "result" : "home";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    document.querySelectorAll("[data-n]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.selected = Number(btn.getAttribute("data-n"));
        render();
      });
    });
  }
  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    done();
  }
  render();
})();
</script>
</body>
</html>
