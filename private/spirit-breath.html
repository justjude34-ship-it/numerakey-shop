:root{
  --bg:#000;--surface:#0c0c0c;--surface-2:#161616;--fg:#f3ece3;--muted:#a39a90;--subtle:#6e675f;
  --line:#2a2622;--champagne:#d4b483;--champagne-fg:#1a140c;--rose:#c98990;--sage:#7eb8ae;
  --display:"Fraunces",Georgia,serif;--sans:"Outfit","Avenir Next","Segoe UI",sans-serif;
  --nav:4.6rem;--safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:var(--fg);font-family:var(--sans);font-weight:400;line-height:1.5}
body{min-height:100dvh}
button,a,[role="button"]{cursor:pointer}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--champagne);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.02em;line-height:1.12;margin:0;color:var(--fg)}
p{margin:0}

.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,40,.5) 0%,rgba(6,18,40,.12) 34%,rgba(6,14,32,.2) 68%,rgba(0,0,0,.82) 100%)}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:1.4rem 1.25rem 1.35rem;text-align:center}
.kicker{font-size:.68rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#fff;text-shadow:0 2px 16px rgba(6,16,36,.85)}
.hero h1{margin-top:.4rem;font-size:clamp(2.7rem,10vw,3.6rem);color:#f3ece3;text-shadow:0 6px 28px rgba(6,16,36,.85)}
.rule{height:1px;width:6rem;margin:.7rem auto 0;background:linear-gradient(90deg,transparent,var(--champagne),transparent)}
.lede{margin-top:.75rem;color:rgba(255,255,255,.92);font-size:.95rem;text-shadow:0 2px 12px rgba(6,16,36,.7)}
.pad{padding:1rem 1rem 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1.25rem;padding:1.05rem 1.1rem}
.edition{margin-top:1rem}
.eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--champagne)}
.edition h2{margin-top:.25rem;font-size:1.55rem}
.muted{color:var(--muted);font-size:.92rem}
.subtle{color:var(--subtle);font-size:.75rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:2.75rem;padding:.65rem 1.15rem;border-radius:.9rem;border:0;background:var(--champagne);color:var(--champagne-fg);font-weight:600;font-size:.95rem;text-decoration:none}
.btn.block{width:100%;margin-top:.9rem}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.soft{background:#1a1816;color:var(--fg);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}
.stat{text-align:center;padding:.75rem .4rem}
.stat b{display:block;font-family:var(--display);font-size:1.45rem;font-weight:500}
.row{display:flex;align-items:flex-end;justify-content:space-between;gap:.5rem;margin:1.4rem 0 .6rem}
.row a,button.link{background:none;border:0;padding:0;color:var(--champagne);font-size:.78rem;font-weight:600;text-decoration:none}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{display:inline-flex;align-items:center;gap:.4rem;min-height:2.4rem;padding:.35rem .75rem;border-radius:999px;border:1px solid var(--line);background:#0a0a0a;color:var(--fg);text-decoration:none;font-size:.82rem}
.dot{width:.5rem;height:.5rem;border-radius:99px;flex:none}
.journey-next{display:flex;gap:.85rem;text-decoration:none;color:inherit}
.num{width:3rem;height:3rem;border-radius:.85rem;display:grid;place-items:center;font-family:var(--display);font-size:1.15rem;flex:none}
.feature{display:block;text-decoration:none;color:inherit;margin-top:.2rem}
.feature h3{font-size:1.35rem;margin-top:.15rem}
.foot{margin:1.4rem 0 .4rem;text-align:center;color:var(--subtle);font-size:.68rem;line-height:1.45}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(0,0,0,.94);border-top:1px solid var(--line);padding:.3rem .25rem var(--safe);backdrop-filter:blur(12px)}
nav ul{list-style:none;display:flex;max-width:40rem;margin:0 auto;padding:0}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:2.75rem;color:var(--subtle);text-decoration:none;font-size:.62rem;font-weight:600;letter-spacing:.04em}
nav a.on{color:var(--champagne)}
nav svg{width:1.25rem;height:1.25rem}
.head{padding:1rem 1rem .25rem}
.head h1{font-size:1.85rem}
.search{position:relative;margin:.75rem 0 .55rem}
.search input{width:100%;height:2.75rem;border-radius:.85rem;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 .85rem 0 2.4rem;font:inherit;font-size:.92rem}
.search svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;color:var(--subtle)}
.filters{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;min-height:2.15rem;border-radius:999px;border:1px solid var(--line);background:#0a0a0a;color:var(--muted);padding:.3rem .8rem;font:inherit;font-size:.78rem;font-weight:600}
.filters button.on{border-color:#d4b48366;background:#d4b48322;color:var(--champagne)}
.grid{display:grid;gap:.65rem;margin-top:.85rem}
@media(min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}
.tcard{display:block;text-decoration:none;color:inherit;padding:1rem}
.tcard h3{font-size:1.12rem}
.meta{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem}
.pill{font-size:.68rem;letter-spacing:.04em;border:1px solid var(--line);border-radius:999px;padding:.15rem .5rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:.55rem}
.mod{display:flex;gap:.8rem;text-decoration:none;color:inherit;align-items:flex-start}
.bubble{width:2.75rem;height:2.75rem;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:#000;font-family:var(--display)}
.bubble.done{border-color:#d4b48366;background:#d4b48322;color:var(--champagne)}
.bar{height:.4rem;border-radius:99px;background:#1c1c1c;overflow:hidden;margin-top:.65rem}
.bar i{display:block;height:100%;background:var(--champagne);width:0}
.back{display:inline-flex;align-items:center;gap:.3rem;color:var(--muted);text-decoration:none;font-size:.85rem;min-height:2.4rem;background:none;border:0;padding:0;font-family:inherit}
.hero-card{border-radius:1.4rem;padding:1.3rem 1.2rem;border:1px solid var(--line);background:#0c0c0c}
.quote{font-family:var(--display);font-size:1.15rem;font-style:italic;line-height:1.35}
ol.steps,ul.clean{margin:.4rem 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.45rem}
ol.steps li,ul.clean li{display:flex;gap:.6rem;font-size:.92rem;color:#efe7dc}
.n{width:1.5rem;height:1.5rem;border-radius:99px;display:grid;place-items:center;font-size:.72rem;flex:none}
.session-top{display:flex;align-items:center;gap:.4rem;padding:.75rem 1rem 0}
.session-top .mid{flex:1;text-align:center;min-width:0}
.iconbtn{width:2.5rem;height:2.5rem;border-radius:.75rem;border:1px solid var(--line);background:#111;color:var(--fg);display:grid;place-items:center}
.stage{min-height:calc(100dvh - 9rem);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1rem 1.25rem 1.5rem}
.orb-wrap{position:relative;width:min(18.5rem,78vw);aspect-ratio:1;display:grid;place-items:center}
.orb-bed{position:absolute;inset:-4%;border-radius:50%;filter:blur(16px);pointer-events:none}
.orb{width:58%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1}
.orb .pl{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase}
.orb .count{font-family:var(--display);font-size:2.7rem;font-weight:500;font-variant-numeric:tabular-nums;margin-top:.1rem}
.ring{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
.instr{max-width:34ch;margin:1.2rem 0 0;font-size:1.05rem;line-height:1.45}
.controls{display:flex;gap:.6rem;justify-content:center;align-items:center;padding:0 1rem 1.25rem}
.checks{display:flex;align-items:center;gap:.55rem;margin-top:.8rem;font-size:.85rem;color:var(--muted)}
.checks input{width:1.05rem;height:1.05rem;accent-color:var(--champagne)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe) + .6rem);transform:translateX(-50%);background:#1a1814;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:.55rem .9rem;font-size:.82rem;z-index:30;max-width:90vw;text-align:center}
.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:.75rem;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.85rem 1rem;color:var(--fg);font:inherit;text-align:left}
.switch{width:2.4rem;height:1.4rem;border-radius:99px;background:#2a2622;position:relative;flex:none}
.switch i{position:absolute;top:.15rem;left:.15rem;width:1.1rem;height:1.1rem;border-radius:50%;background:#888;transition:transform .15s}
.switch.on{background:#d4b48355}
.switch.on i{transform:translateX(1rem);background:var(--champagne)}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){
  .orb,.orb-bed{animation:none !important}
}
@keyframes orb-inhale{from{transform:scale(.72)}to{transform:scale(1)}}
@keyframes orb-exhale{from{transform:scale(1)}to{transform:scale(.72)}}
@keyframes orb-hold{from,to{transform:scale(1)}}
@keyframes orb-pause{from,to{transform:scale(.72)}}
@keyframes orb-rest{0%,100%{transform:scale(.82)}50%{transform:scale(.88)}}
@keyframes orb-guide{0%,100%{transform:scale(.85)}50%{transform:scale(.9)}}
@keyframes bed{0%,100%{transform:scale(.9);opacity:.35}50%{transform:scale(1.05);opacity:.7}}
</style>
</head>

<script type="application/json" id="sb-data">{"categories":{"foundations":{"label":"Foundations","description":"Awareness, presence, and the basics of conscious breathing","color":"#2dd4bf"},"rhythms":{"label":"Rhythms","description":"Timed patterns that train the nervous system","color":"#38bdf8"},"energy":{"label":"Energy & Power","description":"Vitality, grounding, and fire in the belly","color":"#fb923c"},"heart":{"label":"Heart Center","description":"Openness, compassion, and emotional intelligence","color":"#fb7185"},"spiritual":{"label":"Spiritual Breathing","description":"Connected breath, presence, and expanded awareness","color":"#a78bfa"}},"techniques":[{"id":"breath-awareness","name":"Breath Awareness","shortName":"Awareness","tagline":"Wake up to the breath that is already breathing you","description":"The yin of breathwork. Simply notice the breath without controlling it — the foundation of all Spiritual Breathing practice.","why":"Dan Brulé teaches that Breath Awareness is half of the practice. Before you change the breath, you learn to witness it. Awareness itself is transformative — it brings you into the present moment and expands consciousness.","howTo":["Sit or lie comfortably with a straight spine.","Close your eyes or soften your gaze.","Notice the breath exactly as it is — fast or slow, deep or shallow.","Feel where the breath moves: nostrils, chest, belly, back.","When the mind wanders, gently return to sensation.","Do not force, count, or fix anything. Just observe."],"tips":["Practice for 1–2 minutes several times a day, especially under stress.","Ask: Is it high or low? Smooth or jagged? Through nose or mouth?","Awareness of breath leads to more awareness of life."],"category":"foundations","level":"beginner","durationMin":5,"cycles":1,"pattern":[{"phase":"guide","durationSec":20,"label":"Settle","instruction":"Find a comfortable position. Soften the face and jaw."},{"phase":"rest","durationSec":45,"label":"Observe","instruction":"Notice the natural breath. No control — only awareness."},{"phase":"rest","durationSec":45,"label":"Sensations","instruction":"Where do you feel the breath most clearly right now?"},{"phase":"rest","durationSec":45,"label":"Rhythm","instruction":"Is it fast or slow? Deep or shallow? Smooth or irregular?"},{"phase":"rest","durationSec":45,"label":"Presence","instruction":"Rest in pure observation. You are being breathed."},{"phase":"guide","durationSec":15,"label":"Close","instruction":"Gently open your eyes. Carry this awareness with you."}],"benefits":["Presence","Calm","Mindfulness","Self-knowledge"],"color":"#2dd4bf","icon":"eye","danNote":"Whatever breathing exercise makes you more conscious — that is the best one."},{"id":"low-and-slow","name":"Low & Slow","shortName":"Low & Slow","tagline":"Enter the therapeutic zone of 4–8 breaths per minute","description":"Diaphragmatic breathing at a relaxed pace. The body softens; the mind steadies; the nervous system shifts toward rest-and-digest.","why":"Brulé calls 4–8 breaths per minute the therapeutic zone. Breathing low into the belly and slowing the rate is one of the fastest ways to reduce stress chemistry and restore balance.","howTo":["Place one hand on the belly, one on the chest.","Inhale gently through the nose so the belly rises first.","Exhale slowly through pursed lips or with a soft shhh sound.","Aim for roughly 6 breaths per minute (about 5s in, 5s out).","Keep the chest relatively quiet; let the diaphragm do the work."],"tips":["Start with 5 minutes; build toward longer sessions.","If lightheaded, shorten the count and soften the effort.","Shushing on the exhale helps lengthen and calm."],"category":"foundations","level":"beginner","durationMin":5,"cycles":15,"pattern":[{"phase":"inhale","durationSec":5,"label":"Inhale","instruction":"Nose inhale — belly rises, low and soft.","cue":"In"},{"phase":"exhale","durationSec":5,"label":"Exhale","instruction":"Slow exhale — shhh. Belly falls.","cue":"Out"}],"intro":[{"phase":"guide","durationSec":12,"label":"Prepare","instruction":"Hand on belly. Soft shoulders. We breathe low and slow."}],"benefits":["Stress relief","Nervous system balance","Focus","Sleep prep"],"color":"#38bdf8","icon":"wave","danNote":"Learn to breathe low and slow — then live from that place."},{"id":"exhale-comfort","name":"Exhale Comfort Zone","shortName":"Exhale Zone","tagline":"Lengthen the out-breath and rest in the quiet after","description":"Gentle inhale, longer exhale, then linger in the natural pause. Turn the space after the out-breath into a comfort zone.","why":"Brulé emphasizes leaning into the exhale and befriending the pause after it. This trains the parasympathetic response and teaches the body that stillness is safe.","howTo":["Inhale gently through the nose (shorter).","Exhale slowly and fully, without strain.","Rest in the quiet pause after the exhale — no rush to inhale.","When the body wants air, inhale softly again.","Practice at least 5 minutes, three times a day if possible."],"tips":["Never force the pause — comfort is the goal.","If anxiety rises, shorten the hold and return to low & slow.","The pause is not emptiness; it is presence."],"category":"foundations","level":"beginner","durationMin":6,"cycles":12,"pattern":[{"phase":"inhale","durationSec":4,"label":"Inhale","instruction":"Soft nasal inhale. Fill gently.","cue":"In"},{"phase":"exhale","durationSec":6,"label":"Exhale","instruction":"Lengthen the out-breath. Soften everything.","cue":"Out"},{"phase":"pause","durationSec":4,"label":"Rest","instruction":"Linger in the quiet. No rush. Comfort zone.","cue":"Still"}],"intro":[{"phase":"guide","durationSec":12,"label":"Prepare","instruction":"We will lean into the exhale and rest in the pause after."}],"benefits":["Deep calm","Anxiety relief","Emotional regulation","Presence"],"color":"#fb7185","icon":"wind"},{"id":"yawn-and-sigh","name":"Yawn & Sigh","shortName":"Yawn & Sigh","tagline":"Shake loose, yawn big, sigh with relief","description":"A playful reset: conscious yawning, big sighs of relief, and gentle movement to discharge tension and blocked energy.","why":"When stress locks the body, Brulé recommends yawning and sighing while shaking and wiggling. It is not frivolous — it reboots the nervous system and restores pleasure to the breath.","howTo":["Stand or sit with room to move.","Induce a full yawn — open the jaw, stretch the face.","Sigh out with a sound of relief: ahhh.","Shake arms, legs, and torso loosely while breathing.","Continue for 1–2 minutes until you feel looser and lighter."],"tips":["Fake yawns often become real ones.","Make pleasurable sounds — they amplify release.","Great before meetings, after hard news, or first thing morning."],"category":"energy","level":"beginner","durationMin":3,"cycles":6,"pattern":[{"phase":"inhale","durationSec":4,"label":"Yawn In","instruction":"Big yawn-inhale. Stretch the face and jaw.","cue":"Yawn"},{"phase":"exhale","durationSec":5,"label":"Sigh Out","instruction":"Sigh of relief — ahhh. Shake and loosen.","cue":"Sigh"},{"phase":"rest","durationSec":3,"label":"Wiggle","instruction":"Wiggle joints. Soften. Feel the release."}],"intro":[{"phase":"guide","durationSec":10,"label":"Prepare","instruction":"Stand if you can. This is playful — let the body shake free."}],"benefits":["Tension release","Energy reset","Mood lift","Embodiment"],"color":"#fbbf24","icon":"yawn","danNote":"Yawn and sigh of relief — loosen the muscles and free the energy."},{"id":"triangle-breath","name":"Triangle Breath","shortName":"Triangle","tagline":"Three equal sides: inhale, exhale, pause","description":"A three-part rhythm that balances activation and rest. Equal counts create a steady, meditative geometry of breath.","why":"Triangle breath is one of Brulé’s go-to patterns for coming into balance. The equal sides train evenness of mind while the pause after exhale cultivates comfort with stillness.","howTo":["Choose a count of 3, 4, or 5 seconds per side.","Inhale for the count.","Exhale for the same count.","Pause (empty) for the same count.","Repeat smoothly for several minutes."],"tips":["Beginners: start with 3 seconds per side.","Keep the transitions smooth — no gasping.","Visualize drawing a triangle with each cycle."],"category":"rhythms","level":"beginner","durationMin":5,"cycles":12,"pattern":[{"phase":"inhale","durationSec":4,"label":"Inhale","instruction":"Even inhale — side one of the triangle.","cue":"In"},{"phase":"exhale","durationSec":4,"label":"Exhale","instruction":"Even exhale — side two.","cue":"Out"},{"phase":"pause","durationSec":4,"label":"Pause","instruction":"Empty pause — side three. Rest.","cue":"Hold"}],"intro":[{"phase":"guide","durationSec":10,"label":"Prepare","instruction":"Equal sides: inhale, exhale, pause. Find the triangle."}],"benefits":["Balance","Focus","Meditation","Emotional steadiness"],"color":"#a78bfa","icon":"triangle"},{"id":"box-breathing","name":"Box Breathing","shortName":"Box","tagline":"Four equal sides for calm control under pressure","description":"Inhale, hold, exhale, hold — each equal. Used by elite performers and first responders to stay clear and composed.","why":"Brulé includes box breathing among the essential tools of Spiritual Breathing. Equal four-part timing builds nervous-system resilience and deliberate control without force.","howTo":["Inhale through the nose for 4 seconds.","Hold full for 4 seconds (soft, not strained).","Exhale for 4 seconds.","Hold empty for 4 seconds.","Repeat for 4–8 minutes."],"tips":["Soften the throat during holds — never clamp.","If 4 is hard, use 3; if easy, try 5.","Eyes soft or closed; jaw relaxed."],"category":"rhythms","level":"beginner","durationMin":5,"cycles":10,"pattern":[{"phase":"inhale","durationSec":4,"label":"Inhale","instruction":"Fill evenly. Side one of the box.","cue":"In"},{"phase":"hold","durationSec":4,"label":"Hold Full","instruction":"Soft hold. Stay open and easy.","cue":"Hold"},{"phase":"exhale","durationSec":4,"label":"Exhale","instruction":"Empty evenly. Side three.","cue":"Out"},{"phase":"pause","durationSec":4,"label":"Hold Empty","instruction":"Soft empty hold. Complete the box.","cue":"Hold"}],"intro":[{"phase":"guide","durationSec":10,"label":"Prepare","instruction":"Four equal sides. Breathe with calm precision."}],"benefits":["Performance calm","Focus","Emotional control","Resilience"],"color":"#38bdf8","icon":"box"},{"id":"full-yogic","name":"Full Yogic Breath","shortName":"Full Yogic","tagline":"Fill from the earth up — belly, ribs, chest","description":"The complete three-part breath: pelvis and belly first, then mid-ribs, then upper chest. Connection to body and ground.","why":"In Brulé’s first essential, full yogic breath connects you to Mother Earth — security, safety, survival. Filling from the bottom up gets you out of the head and into the body.","howTo":["Inhale into the lower belly and pelvic floor.","Continue into the mid-ribs, expanding sideways.","Finish into the upper chest, collarbones soft.","Exhale from top to bottom — reverse order, unforced.","Keep the whole wave smooth and continuous."],"tips":["Imagine pouring water into a glass from the bottom up.","No strain at the top — leave a little room.","Excellent grounding practice before spiritual work."],"category":"energy","level":"intermediate","durationMin":6,"cycles":10,"pattern":[{"phase":"inhale","durationSec":6,"label":"Fill Up","instruction":"Belly → ribs → chest. Bottom to top.","cue":"In"},{"phase":"hold","durationSec":2,"label":"Settle","instruction":"Soft pause at the top. Feel fullness."},{"phase":"exhale","durationSec":6,"label":"Empty Down","instruction":"Chest → ribs → belly. Soft release.","cue":"Out"},{"phase":"pause","durationSec":2,"label":"Ground","instruction":"Rest empty. Feel the earth."}],"intro":[{"phase":"guide","durationSec":12,"label":"Prepare","instruction":"Connect to the body. We fill from the ground up."}],"benefits":["Grounding","Vital capacity","Embodiment","Calm power"],"color":"#34d399","icon":"layers"},{"id":"circular-breath","name":"Circular Breathing","shortName":"Circular","tagline":"Connected breath — no pause, continuous wave","description":"The core of Spiritual Breathing: active inhale, relaxed exhale, no gaps. A continuous circular wave that opens energy and awareness.","why":"Connected circular breathing is central to Brulé’s lineage (from rebirthing and modern breathwork). Inhale is intentional; exhale is passive and free. No pause — one continuous stream of life force.","howTo":["Breathe in actively through the mouth or nose.","Let the exhale fall out relaxed — no push.","Connect inhale to exhale with no pause between.","Keep a steady, moderate rhythm — not forced hyperventilation.","Stay soft in the body; ride the wave of sensation."],"tips":["If intensity rises, slow down and soften — never force.","Hands can rest on belly to feel the circular motion.","This is conscious breathing with passion and awareness.","Stop if dizzy; return to normal breath."],"category":"spiritual","level":"intermediate","durationMin":8,"cycles":40,"pattern":[{"phase":"inhale","durationSec":3,"label":"Active In","instruction":"Active inhale. Fill with intention.","cue":"In"},{"phase":"exhale","durationSec":3,"label":"Passive Out","instruction":"Let go. Exhale falls free — no pause.","cue":"Out"}],"intro":[{"phase":"guide","durationSec":15,"label":"Prepare","instruction":"Connected circular breath. No gaps. Soft body, continuous wave. Go gently."}],"benefits":["Energy flow","Emotional release","Expanded awareness","Aliveness"],"color":"#a78bfa","icon":"circle","danNote":"Conscious connected circular breathing — inhale active, exhale passive, continuous."},{"id":"heart-breath","name":"Heart-Centered Breath","shortName":"Heart","tagline":"Breathe into the heart as the new root","description":"Direct the breath into and around the heart. Cultivate love, acceptance, compassion — and live from emotional intelligence.","why":"Brulé teaches that the lungs wrap the heart, and the heart can become the new root chakra. Heart breathing awakens emotional intelligence and a heart-centered life.","howTo":["Place a hand over the heart center.","Inhale as if breathing into the heart space.","Exhale with a feeling of warmth or gratitude.","Optionally add a word: love, peace, thank you.","Smile gently; soften the chest."],"tips":["If emotions arise, stay with the breath — no fixing.","Practice before difficult conversations.","Sound (soft hum) can open the heart further."],"category":"heart","level":"beginner","durationMin":6,"cycles":12,"pattern":[{"phase":"inhale","durationSec":5,"label":"Into Heart","instruction":"Breathe into the heart space. Soft chest.","cue":"In"},{"phase":"hold","durationSec":2,"label":"Feel","instruction":"Rest in warmth. Love and acceptance."},{"phase":"exhale","durationSec":6,"label":"Radiate","instruction":"Exhale kindness outward. Soft smile.","cue":"Out"}],"intro":[{"phase":"guide","durationSec":12,"label":"Prepare","instruction":"Hand on heart. We breathe as if the heart is home."}],"benefits":["Compassion","Connection","Emotional healing","Warmth"],"color":"#fb7185","icon":"heart"},{"id":"fire-belly","name":"Fire in the Belly","shortName":"Fire Belly","tagline":"Awaken power in the dantien — grace under pressure","description":"Diaphragmatic power breathing centered in the lower belly (hara / dantien). Generate life-force energy without adrenalized stress.","why":"Module three of Brulé’s essentials: access personal power through the belly battery. Breath builds genuine chi instead of stress hormones — balance and grace under pressure.","howTo":["Sit tall or stand with knees soft.","Inhale firmly into the lower belly.","Exhale with a short, decisive release (optional soft ha).","Keep the upper body relatively still.","Build rhythm for 1–3 minutes, then rest and feel."],"tips":["Power without tension — soft face, strong center.","Stop if dizzy; rest in low & slow.","Use before challenges that need presence and courage."],"category":"energy","level":"intermediate","durationMin":4,"cycles":20,"pattern":[{"phase":"inhale","durationSec":2,"label":"Charge","instruction":"Firm belly inhale. Fire the center.","cue":"In"},{"phase":"exhale","durationSec":2,"label":"Release","instruction":"Decisive exhale. Stay soft in the face.","cue":"Out"}],"intro":[{"phase":"guide","durationSec":10,"label":"Prepare","instruction":"Find the lower belly. We charge the battery with breath."}],"outro":[{"phase":"rest","durationSec":20,"label":"Integrate","instruction":"Rest. Feel warmth and power in the center."}],"benefits":["Vitality","Courage","Focus under pressure","Embodied power"],"color":"#fb923c","icon":"flame"},{"id":"breath-hold-soft","name":"Soft Breath Hold","shortName":"Soft Hold","tagline":"Gentle retention to expand capacity and calm","description":"Comfortable breath holds after inhale or exhale. Train CO₂ tolerance and mental ease without struggle.","why":"Breath holding appears in Brulé’s essentials toolkit. Soft retention builds capacity and teaches non-reactivity — holding life gently rather than gripping it.","howTo":["Inhale fully but comfortably.","Hold softly with an open throat (or hold empty after exhale).","When urge to breathe is moderate, release smoothly.","Never strain, gasp, or push past dizziness.","Recover with 2–3 easy breaths between holds."],"tips":["Comfort is mastery — struggle is not the goal.","Never practice breath holds in water or while driving.","If anxious, switch to low & slow."],"category":"rhythms","level":"intermediate","durationMin":6,"cycles":6,"pattern":[{"phase":"inhale","durationSec":4,"label":"Inhale","instruction":"Comfortable full inhale.","cue":"In"},{"phase":"hold","durationSec":8,"label":"Soft Hold","instruction":"Open throat. Soft eyes. Rest in fullness.","cue":"Hold"},{"phase":"exhale","durationSec":5,"label":"Release","instruction":"Smooth release. No gasp.","cue":"Out"},{"phase":"rest","durationSec":6,"label":"Recover","instruction":"Easy natural breaths. Recover."}],"intro":[{"phase":"guide","durationSec":12,"label":"Prepare","instruction":"Soft holds only. Comfort over duration. You are safe."}],"benefits":["Capacity","Mental calm","Non-reactivity","Focus"],"color":"#38bdf8","icon":"spark"},{"id":"spiritual-breathing","name":"Spiritual Breathing Session","shortName":"Spiritual","tagline":"Awareness + conscious breathing for transformation","description":"A complete practice uniting Breath Awareness and Conscious Breathing — the two wings of Spiritual Breathing as taught by Dan Brulé.","why":"Breathwork, in Brulé’s words, is Breath Awareness and Conscious Breathing for healing, growth, and spiritual awakening. This session weaves both: witness, then shape, then rest in presence.","howTo":["Begin with pure observation of the natural breath.","Move into low, slow diaphragmatic breathing.","Open into gentle connected circular breathing.","Close with heart-centered breath and silence.","Approach the breath as sacred, intelligent, alive."],"tips":["Quality over intensity. Consciousness is the measure.","Emotions may surface — meet them with breath, not judgment.","End with gratitude for the breath that never leaves you."],"category":"spiritual","level":"advanced","durationMin":12,"cycles":1,"pattern":[{"phase":"guide","durationSec":15,"label":"Arrive","instruction":"Sit tall. Soften. The breath is already here."},{"phase":"rest","durationSec":40,"label":"Awareness","instruction":"Watch the natural breath. Being, not doing."},{"phase":"inhale","durationSec":5,"label":"Low In","instruction":"Begin low & slow. Belly rises.","cue":"In"},{"phase":"exhale","durationSec":5,"label":"Slow Out","instruction":"Lengthen the exhale. Soften.","cue":"Out"},{"phase":"inhale","durationSec":5,"label":"Low In","instruction":"Continue. Steady and low.","cue":"In"},{"phase":"exhale","durationSec":5,"label":"Slow Out","instruction":"Exhale longer if it feels good.","cue":"Out"},{"phase":"inhale","durationSec":5,"label":"Low In","instruction":"Belly soft. Mind quiet.","cue":"In"},{"phase":"exhale","durationSec":6,"label":"Slow Out","instruction":"Release completely.","cue":"Out"},{"phase":"guide","durationSec":10,"label":"Open","instruction":"Now circular connected breath. Continuous wave."},{"phase":"inhale","durationSec":3,"label":"Active In","instruction":"Active inhale. No pause after.","cue":"In"},{"phase":"exhale","durationSec":3,"label":"Passive Out","instruction":"Passive exhale. Connected.","cue":"Out"},{"phase":"inhale","durationSec":3,"label":"Active In","instruction":"Keep the circle flowing.","cue":"In"},{"phase":"exhale","durationSec":3,"label":"Passive Out","instruction":"Let go. Soft body.","cue":"Out"},{"phase":"inhale","durationSec":3,"label":"Active In","instruction":"Energy rising with awareness.","cue":"In"},{"phase":"exhale","durationSec":3,"label":"Passive Out","instruction":"Release. Stay present.","cue":"Out"},{"phase":"inhale","durationSec":3,"label":"Active In","instruction":"Continue the wave.","cue":"In"},{"phase":"exhale","durationSec":3,"label":"Passive Out","instruction":"Smooth connection.","cue":"Out"},{"phase":"inhale","durationSec":4,"label":"Slow Down","instruction":"Gradually slow the circle.","cue":"In"},{"phase":"exhale","durationSec":5,"label":"Ease Out","instruction":"Softer, slower.","cue":"Out"},{"phase":"guide","durationSec":8,"label":"Heart","instruction":"Bring the breath to the heart."},{"phase":"inhale","durationSec":5,"label":"Heart In","instruction":"Breathe into the heart center.","cue":"In"},{"phase":"exhale","durationSec":6,"label":"Heart Out","instruction":"Exhale warmth and gratitude.","cue":"Out"},{"phase":"inhale","durationSec":5,"label":"Heart In","instruction":"Love, acceptance, presence.","cue":"In"},{"phase":"exhale","durationSec":6,"label":"Heart Out","instruction":"Radiate peace.","cue":"Out"},{"phase":"rest","durationSec":45,"label":"Silence","instruction":"Rest. Let the breath be natural. Simply be."},{"phase":"guide","durationSec":12,"label":"Close","instruction":"Thank the breath. Open eyes when ready."}],"benefits":["Transformation","Spiritual clarity","Emotional release","Deep presence"],"color":"#2dd4bf","icon":"spark","danNote":"All the benefits of breathwork depend on consciousness + breathing. Wake up."}],"modules":[{"id":"earth","number":1,"title":"Connect to Mother Earth","subtitle":"Security, safety & survival","theme":"Grounding","description":"Practice the full yogic breath — filling from the bottom up into the floor of the pelvis. Get out of the head and into the body. Center, ground, and embody the spirit of the Higher Self.","practices":["Full yogic breath from the base up","Elemental awareness (earth, air, water, fire)","Body-first presence before spiritual flight"],"techniqueIds":["full-yogic","low-and-slow","breath-awareness"],"reflection":"Where in my body do I feel most supported by the earth right now?","color":"#34d399"},{"id":"ecstatic","number":2,"title":"Ecstatic Breath Energy","subtitle":"Pleasure, vitality & life force","theme":"Aliveness","description":"Explore the ecstatic and transformative nature of breath energy. Awaken comfort and pleasure. Access life force within and around you — and pack chi into the fascia to recharge spiritual batteries.","practices":["Yawn & sigh for pleasure and release","Gentle circular breathing for energy flow","Relax into intensity without bracing"],"techniqueIds":["yawn-and-sigh","circular-breath","exhale-comfort"],"reflection":"Can I allow more pleasure and ease in my breath today?","color":"#fbbf24"},{"id":"power","number":3,"title":"Fire in the Belly","subtitle":"Personal power & grace under pressure","theme":"Power","description":"Awaken the dantien / hara. Recharge your battery to meet life’s challenges with genuine life-force energy — not adrenalized stress. Direct energy toward purpose with balance.","practices":["Diaphragmatic power breathing","Belly-centered focus under pre function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({
      "&": "\u0026amp;",
      "<": "\u0026lt;",
      ">": "\u0026gt;",
      '"': "\u0026quot;",
      "'": "\u0026#39;"
    })[c];
  });
}
function svg(name, size){
  const d = ICONS[name] || ICONS.spark;
  return `<svg viewBox="0 0 24 24" width="${size||20}" height="${size||20}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
}
function tech(id){return DATA.techniques.find(t=>t.id===id);}
function mod(id){return DATA.modules.find(m=>m.id===id);}
function secondsOf(t){
  const intro=(t.intro||[]).reduce((a,p)=>a+p.durationSec,0);
  const outro=(t.outro||[]).reduce((a,p)=>a+p.durationSec,0);
  const cycle=t.pattern.reduce((a,p)=>a+p.durationSec,0);
  return intro + cycle*t.cycles + outro;
}
function timelineOf(t){
  const steps=[];
  (t.intro||[]).forEach(s=>steps.push(s));
  for(let c=0;c<t.cycles;c++) t.pattern.forEach(s=>steps.push(s));
  (t.outro||[]).forEach(s=>steps.push(s));
  return steps;
}
function todayKey(d=new Date()){
  const z=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}
function streakFrom(last, prev, now){
  if(!last) return 1;
  if(last===now) return Math.max(prev,1);
  const a=new Date(last+"T12:00:00"), b=new Date(now+"T12:00:00");
  const diff=Math.round((b-a)/86400000);
  if(diff===1) return prev+1;
  if(diff===0) return prev;
  return 1;
}
const KEY="spirit-breath-edition-v1";
function fresh(){return {sessions:[],completedModules:[],favorites:[],totalBreathSeconds:0,streak:0,lastPracticeDate:null,sound:true,haptics:true,skipIntro:false};}
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY)||"null");
    return Object.assign(fresh(), raw&&typeof raw==="object"?raw:{});
  }catch{return fresh();}
}
let state=load();
function persist(){try{localStorage.setItem(KEY, JSON.stringify(state));}catch(e){}}
function sessionsToday(){const k=todayKey();return state.sessions.filter(s=>String(s.completedAt).slice(0,10)===k).length;}
function minutesWeek(){
  const cut=Date.now()-7*86400000;
  const secs=state.sessions.filter(s=>new Date(s.completedAt).getTime()>=cut).reduce((a,s)=>a+s.durationSec,0);
  return Math.round(secs/60);
}
function fmtMin(sec){const m=Math.round((sec||0)/60);return m+" min";}
function when(iso){try{return new Date(iso).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});}catch{return "";}}

let ui={q:"",filter:"all"};
let player=null;
let loopOn=false;
let audioCtx=null;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function ctx(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch{return null;}}
  if(audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
let air=null;
function makePink(a){
  const n=a.sampleRate*2;
  const buf=a.createBuffer(1, n, a.sampleRate);
  const d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){
    const w=Math.random()*2-1;
    b0=0.99886*b0+w*0.0555179;
    b1=0.99332*b1+w*0.0750759;
    b2=0.96900*b2+w*0.1538520;
    b3=0.86650*b3+w*0.3104856;
    b4=0.55000*b4+w*0.5329522;
    b5=-0.7616*b5-w*0.0168980;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
    b6=w*0.115926;
  }
  const fade=Math.floor(a.sampleRate*0.03);
  for(let i=0;i<fade;i++){
    const k=i/fade;
    d[i]*=k; d[n-1-i]*=k;
  }
  return buf;
}
function ensureAir(){
  const a=ctx(); if(!a) return null;
  if(air) return air;
  const src=a.createBufferSource();
  src.buffer=makePink(a); src.loop=true;
  const bp=a.createBiquadFilter();
  bp.type="bandpass"; bp.frequency.value=640; bp.Q.value=0.65;
  const lp=a.createBiquadFilter();
  lp.type="lowpass"; lp.frequency.value=380; lp.Q.value=0.5;
  const gAir=a.createGain(); const gBody=a.createGain();
  gAir.gain.value=0.0001; gBody.gain.value=0.0001;
  const master=a.createGain(); master.gain.value=0.72;
  src.connect(bp); bp.connect(gAir); gAir.connect(master);
  src.connect(lp); lp.connect(gBody); gBody.connect(master);
  master.connect(a.destination);
  src.start();
  air={bp,lp,gAir,gBody};
  return air;
}
function breathShape(phase, p){
  const e=Math.min(1, Math.max(0, p));
  if(phase==="inhale"){
    const s=Math.sin(e*Math.PI*0.5);
    return {g:0.004+0.175*Math.pow(s, 0.8), f:380*Math.pow(2300/380, e), body:0.012+0.07*s};
  }
  if(phase==="exhale"){
    const s=Math.cos(e*Math.PI*0.5);
    return {g:0.003+0.19*Math.pow(s, 0.65), f:2000*Math.pow(260/2000, Math.pow(e, 0.85)), body:0.01+0.085*Math.pow(s, 0.7)};
  }
  return {g:0.0001, f:480, body:0.0001};
}
function voice(phase, elapsed, dur){
  if(!state.sound){ hush(); return; }
  const node=ensureAir(); if(!node || !audioCtx) return;
  const now=audioCtx.currentTime;
  const safeDur=Math.max(0.2, dur);
  const remain=Math.max(0.05, safeDur-elapsed);
  const p0=Math.min(0.985, Math.max(0, elapsed/safeDur));
  const steps=12;
  const g=node.gAir.gain, b=node.gBody.gain, f=node.bp.frequency, lf=node.lp.frequency;
  g.cancelScheduledValues(now); b.cancelScheduledValues(now);
  f.cancelScheduledValues(now); lf.cancelScheduledValues(now);
  const c0=breathShape(phase, p0);
  g.setValueAtTime(c0.g, now);
  b.setValueAtTime(c0.body, now);
  f.setValueAtTime(c0.f, now);
  lf.setValueAtTime(Math.max(160, c0.f*0.42), now);
  for(let i=1;i<=steps;i++){
    const p=p0+(1-p0)*(i/steps);
    const t=now+remain*(i/steps);
    const c=breathShape(phase, p);
    g.linearRampToValueAtTime(c.g, t);
    b.linearRampToValueAtTime(c.body, t);
    f.linearRampToValueAtTime(c.f, t);
    lf.linearRampToValueAtTime(Math.max(160, c.f*0.42), t);
  }
}
function hush(){
  if(!air || !audioCtx) return;
  const now=audioCtx.currentTime;
  [air.gAir.gain, air.gBody.gain].forEach((p)=>{
    p.cancelScheduledValues(now);
    const v=Math.max(0.0001, p.value||0.0001);
    p.setValueAtTime(v, now);
    p.linearRampToValueAtTime(0.0001, now+0.06);
  });
}
function clockNow(){
  if(player && player.audioClock && audioCtx && audioCtx.state==="running") return audioCtx.currentTime;
  return performance.now()/1000;
}
function anchorClock(){
  const a=state.sound ? ctx() : null;
  player.audioClock=!!(a && a.state==="running");
  player.t0=clockNow();
  player.e0=player.elapsedTotal||0;
}
function elapsedNow(){
  if(!player) return 0;
  const live=!!(state.sound && audioCtx && audioCtx.state==="running");
  if(live!==!!player.audioClock){
    player.elapsedTotal=(player.e0||0)+Math.max(0, clockNow()-(player.t0||0));
    anchorClock();
    player.breathMark=-1;
  }
  return (player.e0||0)+Math.max(0, clockNow()-(player.t0||0));
}
function applyElapsed(elapsed){
  let t=Math.max(0, elapsed);
  const tl=player.timeline;
  let i=0;
  while(i<tl.length && t>=tl[i].durationSec){
    t-=tl[i].durationSec;
    i++;
  }
  player.elapsedTotal=Math.min(elapsed, player.totalSec);
  if(i>=tl.length){ player.index=tl.length; player.phaseElapsed=0; return; }
  player.index=i;
  player.phaseElapsed=t;
}
function chime(){
  if(!state.sound) return;
  const a=ctx(); if(!a) return;
  [523.25,659.25,783.99].forEach((freq,i)=>{
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.type="sine"; o.frequency.value=freq;
    const t=a.currentTime+i*0.14;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.07,t+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.45);
    o.start(t); o.stop(t+0.5);
  });
}
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.hidden=false;
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{el.hidden=true;},3200);
}

function route(){
  const parts=(location.hash||"#home").replace(/^#/,"").split("/").filter(Boolean);
  const name=parts[0]||"home";
  if(name==="t" && parts[1]) return {name:"session", id:decodeURIComponent(parts[1]), moduleId:parts[2]?decodeURIComponent(parts[2]):""};
  if(name==="m" && parts[1]) return {name:"module", id:decodeURIComponent(parts[1])};
  if(["home","practice","journey","learn","progress"].includes(name)) return {name};
  return {name:"home"};
}
function go(hash){ if(location.hash.replace(/^#/,"")===hash) render(); else location.hash=hash; }

function stopLoop(){
  loopOn=false;
  if(player && player.raf) cancelAnimationFrame(player.raf);
  if(player) player.raf=0;
}
function ensurePlayer(r){
  const t=tech(r.id);
  if(!t){ player=null; return null; }
  if(player && player.id===t.id && player.moduleId===(r.moduleId||"")) return t;
  const steps=timelineOf(t);
  const auto=state.skipIntro || t.id==="breath-awareness";
  player={
    id:t.id, moduleId:r.moduleId||"", technique:t, timeline:steps,
    totalSec:steps.reduce((a,s)=>a+s.durationSec,0),
    index:0, phaseElapsed:0, elapsedTotal:0,
    running:auto, done:false, showIntro:!auto, saved:false, lastTs:null, raf:0,
    breathMark:-1, audioClock:false, t0:0, e0:0
  };
  return t;
}
function currentStep(){ return player.timeline[player.index]; }
function finish(){
  if(player.saved) { player.done=true; player.running=false; return; }
  player.saved=true; player.done=true; player.running=false;
  const now=todayKey();
  state.sessions.unshift({
    id:Date.now().toString(36),
    techniqueId:player.id,
    techniqueName:player.technique.name,
    durationSec:player.totalSec,
    completedAt:new Date().toISOString(),
    moduleId:player.moduleId||undefined
  });
  state.sessions=state.sessions.slice(0,200);
  state.totalBreathSeconds+=player.totalSec;
  state.streak=streakFrom(state.lastPracticeDate, state.streak, now);
  state.lastPracticeDate=now;
  if(player.moduleId && !state.completedModules.includes(player.moduleId)) state.completedModules.push(player.moduleId);
  persist();
  hush();
  chime();
}
function startLoop(){
  if(loopOn || !player || !player.running || player.done || player.showIntro) return;
  loopOn=true;
  anchorClock();
  const step=()=>{
    if(!player || !player.running || player.done || player.showIntro){ loopOn=false; return; }
    const prev=player.index;
    applyElapsed(elapsedNow());
    if(player.index>=player.timeline.length){
      finish();
      loopOn=false;
      render();
      return;
    }
    const cur=currentStep();
    if(player.breathMark!==player.index){
      voice(cur.phase, player.phaseElapsed, cur.durationSec);
      player.breathMark=player.index;
      if(prev!==player.index && state.haptics && navigator.vibrate && cur.phase!=="guide" && cur.phase!=="rest"){
        navigator.vibrate(cur.phase==="hold" || cur.phase==="pause" ? 8 : 14);
      }
      if(prev!==player.index){
        loopOn=false;
        render();
        return;
      }
    }
    paintHud();
    player.raf=requestAnimationFrame(step);
  };
  player.raf=requestAnimationFrame(step);
}
function paintHud(){
  const cur=currentStep(); if(!cur) return;
  const left=Math.max(0, cur.durationSec-player.phaseElapsed);
  const count=document.getElementById("count");
  if(count) count.textContent=String(Math.max(0, Math.ceil(left)));
  const ring=document.getElementById("ring");
  if(ring){
    const p=Math.min(1, player.phaseElapsed/cur.durationSec);
    ring.style.strokeDasharray=(p*295.3)+" 295.3";
  }
  const bar=document.getElementById("overall");
  if(bar) bar.style.width=Math.min(100,(player.elapsedTotal/player.totalSec)*100)+"%";
}

}

  const life=fmtMin(state.totalBreathSeconds).replace(" min","m");
  return `

      </div>

      <section class="card edition">

function render(){
  stopLoop();
  const r=route();
  const app=document.getElementById("app");
  const nav=document.getElementById("nav");
  let html="", active=r.name, sessionMode=false;
  if(r.name==="home") html=homeHtml();
  else if(r.name==="practice") html=practiceHtml();
  else if(r.name==="journey") html=journeyHtml();
  else if(r.name==="module") html=moduleHtml(r.id);
  else if(r.name==="learn") html=learnHtml();
  else if(r.name==="progress") html=progressHtml();
  else if(r.name==="session"){
    const t=ensurePlayer(r);
    if(!t) html=`<div class="empty"><p>Technique not found.</p><a class="btn" href="#practice" data-go="practice">Library</a></div>`;
    else { html=sessionHtml(); sessionMode=!player.showIntro && !player.done; active="practice"; }
  }
  app.innerHTML=html;
  app.classList.toggle("session", sessionMode);
  nav.hidden=sessionMode;
  document.getElementById("nav-list").innerHTML=navHtml(active==="module"?"journey":active==="session"?"practice":r.name);
  if(player && r.name==="session" && player.running && !player.showIntro && !player.done){
    startLoop();
  }
}

async function saveCopy(){
  if(location.protocol==="file:"){
    toast("This file is already yours. Keep Spirit-Breath.html. Shared copies start fresh.");
    return;
  }
  try{
    const res=await fetch(location.pathname,{cache:"no-store"});
    if(!res.ok) throw new Error("fetch");
    const blob=await res.blob();
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([blob],{type:"text/html"}));
    a.download="Spirit-Breath.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast("Saved Spirit-Breath.html — that file is the product.");
  }catch(e){
    toast("Couldn’t save automatically. Use the browser’s save page instead.");
  }
}

function onAct(act, el){
  if(act==="save"){ saveCopy(); return; }
  if(act==="filter"){ ui.filter=el.getAttribute("data-id"); render(); return; }
  if(act==="clear"){ ui.filter="all"; ui.q=""; render(); return; }
  if(act==="fav"){
    const id=el.getAttribute("data-id")|| (player&&player.id);
    if(!id) return;
    state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):state.favorites.concat(id);
    persist(); render(); return;
  }
  if(act==="complete"){
    const id=el.getAttribute("data-id");
    if(id && !state.completedModules.includes(id)){ state.completedModules.push(id); persist(); }
    render(); return;
  }
  if(act==="sound"){
    if(player && player.running && !player.showIntro && !player.done) player.elapsedTotal=elapsedNow();
    state.sound=!state.sound;
    persist();
    if(!state.sound) hush();
    else if(player) player.breathMark=-1;
    render();
    return;
  }
  if(act==="haptics"){ state.haptics=!state.haptics; persist(); render(); return; }
  if(act==="skip"){ state.skipIntro=!state.skipIntro; persist(); render(); return; }
  if(!player) return;
  if(act==="begin"){
    const box=document.getElementById("skipbox");
    state.skipIntro=!!(box && box.checked);
    persist();
    ctx();
    player.showIntro=false; player.running=true; player.lastTs=null;
    player.breathMark=-1;
    render();
    return;
  }
  if(act==="toggle"){
    if(player.running){
      player.elapsedTotal=elapsedNow();
      applyElapsed(player.elapsedTotal);
      player.running=false;
      hush();
      player.breathMark=-1;
      stopLoop();
    } else {
      player.running=true;
      player.breathMark=-1;
      ctx();
    }
    player.lastTs=null;
    const orb=document.getElementById("orb");
    const bed=document.querySelector(".orb-bed");
    const btn=document.getElementById("toggle");
    const play=player.running?"running":"paused";
    if(orb) orb.style.animationPlayState=play;
    if(bed) bed.style.animationPlayState=play;
    if(btn) btn.textContent=player.running?"Pause":"Resume";
    if(player.running) startLoop();
    return;
  }
  if(act==="reset"){
    player.index=0; player.phaseElapsed=0; player.elapsedTotal=0;
    player.running=true; player.done=false; player.showIntro=false; player.saved=false; player.lastTs=null;
    player.breathMark=-1;
    ctx();
    render();
  }
}

document.addEventListener("click", (e)=>{
  const goEl=e.target.closest("[data-go]");
  if(goEl){ e.preventDefault(); go(goEl.getAttribute("data-go")); return; }
  const actEl=e.target.closest("[data-act]");
  if(actEl){ e.preventDefault(); onAct(actEl.getAttribute("data-act"), actEl); }
});
document.addEventListener("input", (e)=>{
  if(!e.target || e.target.id!=="q") return;
  ui.q=e.target.value;
  const box=document.getElementById("list");
  if(!box) return;
  const fake=document.createElement("div");
  fake.innerHTML=practiceHtml();
  const next=fake.querySelector("#list");
  if(next) box.replaceWith(next);
});
window.addEventListener("hashchange", ()=>{ hush(); player=null; render(); });
window.addEventListener("keydown", (e)=>{
  if(e.code!=="Space") return;
  const tag=(e.target && e.target.tagName)||"";
  if(tag==="INPUT" || tag==="TEXTAREA") return;
  if(player && !player.showIntro && !player.done && route().name==="session"){
    e.preventDefault(); onAct("toggle");
  }
});
document.addEventListener("pointerdown", ()=>{ if(state.sound) ctx(); }, {passive:true});
if(!location.hash) history.replaceState(null,"","#home");
render();
</script>
</body>
</html>
