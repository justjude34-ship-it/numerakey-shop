<html lang="en">

<meta charset="utf-8">

<title>Habit Swap</title>
<meta name="description" content="You cannot simply delete a behaviour — you replace it. A calm phone app for building and swapping habits.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #000000;
  --fg: #f3efe6;
  --muted: #9c978c;
  --card: #121214;
  --line: rgba(243, 239, 230, 0.1);
  --teal: #2ec4b6;
  --purple: #b57cff;
  --amber: #f0a03c;
  --emerald: #3ecf8e;
  --ink: #041614;
  --sans: "Outfit", "Avenir Next", "Segoe UI", sans-serif;
  --display: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: #050506;
  color: var(--fg);
}
body {
  font-family: var(--sans);
  font-weight: 400;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
svg { width: 22px; height: 22px; flex: none; }
button:disabled { opacity: 0.45; cursor: default; }
img { max-width: 100%; display: block; }
p { overflow-wrap: break-word; }
h1, h2, h3 { overflow-wrap: anywhere; text-wrap: balance; }

#app {
  width: 100%;
  max-width: 430px;
  height: 100%;
  height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
@media (min-width: 480px) {
  #app {
    border-inline: 1px solid rgba(243, 239, 230, 0.08);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
  }
}

.top {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 52px;
  padding: calc(4px + var(--safe-t)) 8px 4px 14px;
  border-bottom: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.9);
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: 0;
  padding: 0;
  min-height: 44px;
  color: var(--teal);
}
.brand span {
  font-family: var(--display);
  font-size: 1.15rem;
  letter-spacing: -0.03em;
}
.brand svg { width: 18px; height: 18px; }
.top-actions { display: flex; align-items: center; }
.icon-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: none;
  border: 0;
  color: var(--muted);
  border-radius: 12px;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.on, .icon-btn:active { color: var(--emerald); }

#view {
  flex: 1 1 auto;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 16px 16px 24px;
  -webkit-overflow-scrolling: touch;
}

.tabs {
  flex: none;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  border-top: 1px solid var(--line);
  background: rgba(0, 0, 0, 0.94);
  padding-bottom: var(--safe-b);
}
.tabs button {
  min-width: 0;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: none;
  border: 0;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.tabs button svg { width: 22px; height: 22px; }
.tabs button.on { color: var(--teal); }

.kicker {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
h1 {
  font-family: var(--display);
  font-weight: 560;
  font-size: 1.85rem;
  letter-spacing: -0.03em;
  line-height: 1.12;
  margin: 6px 0 0;
}
h2 {
  font-family: var(--display);
  font-weight: 560;
  font-size: 1.45rem;
  letter-spacing: -0.03em;
  line-height: 1.15;
  margin: 0;
}
h3 {
  font-family: var(--display);
  font-weight: 560;
  font-size: 1.2rem;
  letter-spacing: -0.02em;
  margin: 0;
}
.lead { margin: 10px 0 0; color: var(--muted); font-size: 0.95rem; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 22px; }

.teal { color: var(--teal); }
.purple { color: var(--purple); }
.amber { color: var(--amber); }
.emerald { color: var(--emerald); }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; color: var(--muted); margin: 6px 0 0; }

.hero, .frame {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
}
.hero img { width: 100%; height: 170px; object-fit: cover; object-position: center 22%; }
.hero .cap {
  position: absolute;
  inset: auto 0 0 0;
  padding: 28px 16px 16px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.92), rgba(0, 0, 0, 0.2) 70%, transparent);
}
.hero .cap h1 { font-size: 1.4rem; }
.hero .cap p { margin: 4px 0 0; font-size: 0.82rem; color: rgba(243, 239, 230, 0.82); }

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 0 0 1px rgba(243, 239, 230, 0.08);
}
.card h3 { margin-top: 2px; }
.link-card {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--card);
  border: 0;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 0 0 1px rgba(243, 239, 230, 0.08);
}
.link-card .go {
  display: inline-flex;
  margin-top: 10px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.loop { display: flex; flex-direction: column; gap: 8px; }
.loop article {
  border-radius: 16px;
  padding: 14px 16px;
  background: var(--card);
}
.loop .n {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--muted);
}

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px;
  max-width: 100%;
  padding: 8px 14px;
  border-radius: 999px;
  border: 0;
  background: var(--card);
  box-shadow: 0 0 0 1px rgba(243, 239, 230, 0.1);
  font-size: 14px;
  text-align: left;
}
.chip.on-amber { background: var(--amber); color: #1a1004; box-shadow: none; }
.chip.on-teal { background: var(--teal); color: var(--ink); box-shadow: none; }

.field, textarea, select {
  width: 100%;
  min-height: 48px;
  border-radius: 12px;
  border: 0;
  background: #1a1a1d;
  box-shadow: 0 0 0 1px rgba(243, 239, 230, 0.1);
  padding: 12px 14px;
  font-size: 16px;
}
textarea { min-height: 88px; resize: vertical; }
label.lbl { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

.btn {
  min-height: 48px;
  padding: 0 16px;
  border-radius: 12px;
  border: 0;
  background: transparent;
  box-shadow: 0 0 0 1px rgba(243, 239, 230, 0.14);
  font-size: 15px;
}
.btn.primary { background: var(--teal); color: var(--ink); box-shadow: none; font-weight: 600; }
.btn.amber { background: var(--amber); color: #1a1004; box-shadow: none; font-weight: 600; }
.btn.block { width: 100%; }
.btn.slim { min-height: 44px; }
.row-btns { display: flex; flex-direction: column; gap: 8px; }

.habit {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
}
.habit .grow { min-width: 0; flex: 1; }
.habit h3 { font-size: 1.05rem; }
.dots { display: flex; gap: 4px; margin-top: 6px; }
.dots i {
  width: 7px;
  height: 7px;
  border-radius: 99px;
  background: #2a2a2e;
  display: block;
}
.dots i.on { background: var(--teal); }
.check {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: 999px;
  border: 0;
  background: #1a1a1d;
  box-shadow: 0 0 0 1px rgba(243, 239, 230, 0.12);
  color: var(--muted);
  display: grid;
  place-items: center;
}
.check svg { width: 18px; height: 18px; }
.check.on { background: var(--emerald); color: #062116; box-shadow: none; }

.stat {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.stat b {
  font-family: var(--display);
  font-size: 2.4rem;
  font-weight: 560;
  letter-spacing: -0.04em;
  line-height: 1;
}

.bar { height: 3px; background: #1c1c20; border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--teal); }

.back {
  background: none;
  border: 0;
  color: var(--muted);
  padding: 0;
  min-height: 44px;
  font-size: 14px;
}

.pose img { width: 100%; height: 240px; object-fit: cover; border-radius: 16px; }
.time {
  font-family: var(--display);
  font-size: 3rem;
  letter-spacing: -0.04em;
  line-height: 1;
  margin: 8px 0 0;
}
.player-actions { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }

.breath-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 6px; }
.breath {
  width: 148px;
  height: 148px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(46, 196, 182, 0.16);
  box-shadow: 0 0 0 18px rgba(46, 196, 182, 0.06);
  animation: breathe 16s ease-in-out infinite;
}
.breath b { font-family: var(--display); font-size: 1.6rem; color: var(--teal); font-weight: 560; }
.breath.pause { animation-play-state: paused; }
@keyframes breathe {
  0% { transform: scale(0.62); }
  25% { transform: scale(1); }
  50% { transform: scale(1); }
  75% { transform: scale(0.62); }
  100% { transform: scale(0.62); }
}

.toast {
  position: absolute;
  left: 50%;
  bottom: calc(72px + var(--safe-b));
  transform: translateX(-50%) translateY(8px);
  max-width: calc(100% - 32px);
  background: #161618;
  color: var(--fg);
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 14px;
  box-shadow: 0 0 0 1px rgba(243, 239, 230, 0.12);
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms ease, transform 160ms ease;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.banner {
  border-radius: 14px;
  padding: 12px 14px;
  background: #14120c;
  box-shadow: 0 0 0 1px rgba(240, 160, 60, 0.35);
  color: var(--amber);
  font-size: 0.92rem;
}

hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

</style>
</head>

function esc(s) {
  const map = { "&": "amp", "<": "lt", ">": "gt", '"': "quot", "'": "#39" };
  return String(s ?? "").replace(/[&<>"']/g, (c) => "&" + map[c] + ";");
}
function uid() {
  return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
}
function todayISO(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function addDaysISO(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + days);
  return todayISO(dt);
}
function niceDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}
function greeting(hour) {
  if (hour < 5) return "You're up late";
  if (hour < 12) return "Good morning";
  if (hour < 17) return "Good afternoon";
  if (hour < 21) return "Good evening";
  return "Winding down";
}
function activeHabits() {
  return state.habits.filter((h) => !h.archived);
}
function isChecked(id, iso = todayISO()) {
  return !!(state.checks[iso] && state.checks[iso][id]);
}
function completedSet() {
  const set = new Set();
  for (const [iso, map] of Object.entries(state.checks || {})) {
    if (map && Object.keys(map).length) set.add(iso);
  }
  return set;
}
function flexibleStreak(today = todayISO()) {
  const days = completedSet();
  let streak = 0;
  let flexed = false;
  let cursor = today;
  for (let i = 0; i < 120; i++) {
    if (days.has(cursor)) {
      streak += 1;
      cursor = addDaysISO(cursor, -1);
      continue;
    }
    const prev = addDaysISO(cursor, -1);
    if (!flexed && days.has(prev)) {
      flexed = true;
      cursor = prev;
      continue;
    }
    break;
  }
  return { streak, flexed };
}
function lastN(n, today = todayISO()) {
  return Array.from({ length: n }, (_, i) => addDaysISO(today, -(n - 1 - i)));
}
function fmtTime(sec) {
  const s = Math.max(0, sec);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function addHabit(partial, quiet) {
  const title = (partial.title || "").trim();
  if (!title) return false;
  if (activeHabits().some((h) => h.title.toLowerCase() === title.toLowerCase())) {
    if (!quiet) toastText = "Already on your list";
    return false;
  }
  state.habits.unshift({
    id: uid(),
    title,
    note: partial.note || "",
    color: partial.color || "teal",
    from: partial.from || "",
    archived: false,
  });
  save();
  return true;
}

function addStarters() {
  let n = 0;
  for (const s of STARTERS) if (addHabit(s, true)) n += 1;
  save();

}

  if (det.body) bits.push(`Your body often reports: ${det.body.toLowerCase()}.`);
  const emo = det.emotion.toLowerCase();
  const loc = det.location.toLowerCase();
  let swap = "Pick a replacement that gives you a similar pause, without the cost. Same cue, new routine, honest reward.";
  let action = "Two slow breaths, then one glass of water";
  if (emo.includes("stress") || emo.includes("anxious") || emo.includes("wired")) {

    action = "Box breathing for two minutes";
  } else if (emo.includes("bored") || emo.includes("restless")) {
    swap = "This looks like a stimulation habit. You need a short, complete action with a finish line: a yoga flow, two pages of a book, a walk around the block.";
    action = "A 5-minute yoga flow";
  } else if (emo.includes("tired") || emo.includes("lonely") || emo.includes("avoid")) {
    swap = "This looks like a comfort habit. Warmth, company, or actual rest will land better than the stand-in. Tea, three lines in a notebook, or a body-based wind-down.";

    ["Change one object in the scene", "Mat where the phone sits. Gum where the lighter was. Water where the snack was.", "emerald"],
  ];
  const rows = hit ? hit.items : generic.slice(0, 3);
  return rows.map(([title, why, color]) => ({ title, why, color }));
}

function reminderDue() {
  if (!state.reminder) return false;
  const [hh, mm] = state.reminder.split(":").map(Number);
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const target = hh * 60 + mm;
  return mins >= target && mins < target + 90 && state.remindedOn !== todayISO();
}

function maybeRemind() {
  remindTick += 1;
  if (remindTick % 30 !== 0) return;
  if (!state.notify || !reminderDue()) return;
  const pending = activeHabits().filter((h) => !isChecked(h.id));
  if (!pending.length) return;
  state.remindedOn = todayISO();
  save();
  const body = pending.slice(0, 3).map((h) => h.title).join(", ");
  try {
    if (Notification.permission === "granted") {
      new Notification("Habit Swap", { body: `A small check-in: ${body}` });
    }
  } catch { /* in-app banner still covers it */ }
  if (route.name === "home") render();
}

const VIEWS = {
  home: viewHome,
  lab: viewLab,
  article: viewArticle,
  swap: viewSwap,
  detective: viewDetective,
  track: viewTrack,
  yoga: viewYoga,
  flow: viewFlow,
  settings: viewSettings,
};

const TABS = [
  ["home", "Home", "home"],
  ["lab", "Lab", "book"],
  ["swap", "Swap", "swap"],
  ["detective", "Cues", "search"],
  ["track", "Track", "check"],
];

function tabOn(name) {
  if (route.name === "article") return name === "lab";
  return route.name === name;
}

function shell(viewHtml) {
  const tabs = TABS.map(([name, label, ic]) => `<button type="button" data-go="${name}" class="${tabOn(name) ? "on" : ""}" aria-current="${tabOn(name) ? "page" : "false"}">${icon(ic)}<span>${label}</span></button>`).join("");
  return `<header class="top">
      <button type="button" class="brand" data-go="home">${icon("spark")}<span>Habit Swap</span></button>
      <div class="top-actions">
        <button type="button" class="icon-btn ${route.name === "yoga" || route.name === "flow" ? "on" : ""}" data-go="yoga" aria-label="Yoga">${icon("yoga")}</button>
        <button type="button" class="icon-btn ${route.name === "settings" ? "on" : ""}" data-go="settings" aria-label="Settings">${icon("gear")}</button>
      </div>
    </header>
    <main id="view">${viewHtml}</main>
    <nav class="tabs" aria-label="Primary">${tabs}</nav>
    <div id="toast" class="toast ${toastText ? "show" : ""}" role="status">${esc(toastText)}</div>`;
}

function render() {
  const fn = VIEWS[route.name] || viewHome;
  const app = document.getElementById("app");
  const prev = document.getElementById("view");
  const y = keepScroll && prev ? prev.scrollTop : 0;
  app.innerHTML = shell(fn());
  const next = document.getElementById("view");
  if (next) next.scrollTop = y;
  keepScroll = false;
  if (toastText) {
    const text = toastText;
    toastText = "";
    setTimeout(() => {
      const el = document.getElementById("toast");
      if (el && el.textContent === text) el.classList.remove("show");
    }, 2200);
  }
  ensureClock();
}

function paintPose() {
  const f = YOGA.find((x) => x.id === flow.id);
  if (!f) return;
  const pose = f.poses[flow.i];
  const time = document.getElementById("pose-time");
  const bar = document.getElementById("pose-bar");
  if (time) time.textContent = fmtTime(flow.left);
  if (bar) bar.style.width = `${Math.max(0, Math.min(100, (1 - flow.left / pose.seconds) * 100))}%`;
}

function ensureClock() {
  if (clock) return;
  clock = setInterval(() => {
    const phases = ["In", "Hold", "Out", "Hold"];
    if (document.getElementById("breath-label")) {
      const sec = Math.floor(Date.now() / 1000) % 16;
      const label = phases[Math.floor(sec / 4)];
      const el = document.getElementById("breath-label");
      if (el && el.textContent !== label) el.textContent = label;
      breathLabel = label;
    }
    if (route.name === "flow" && flow.playing && !flow.done) {
      flow.left -= 1;
      if (flow.left <= 0) {
        const f = YOGA.find((x) => x.id === flow.id);
        if (f && flow.i < f.poses.length - 1) {
          flow.i += 1;
          flow.left = f.poses[flow.i].seconds;
          render();
        } else {
          flow.left = 0;
          flow.playing = false;
          flow.done = true;
          render();
        }
        return;
      }
      paintPose();
    }
    maybeRemind();
  }, 1000);
}

function syncDetHabit() {
  const el = document.getElementById("det-habit");
  if (el) det.habit = el.value;
}

function onClick(e) {
  const t = e.target.closest("[data-go],[data-act]");
  if (!t || !document.getElementById("app").contains(t)) return;
  if (t.dataset.go) {
    go(t.dataset.go);
    return;
  }
  const act = t.dataset.act;
  if (act === "check") {
    const id = t.dataset.id;
    const iso = todayISO();
    state.checks[iso] = state.checks[iso] || {};
    if (state.checks[iso][id]) delete state.checks[iso][id];
    else state.checks[iso][id] = 1;
    save();
    keepScroll = true;
    render();
    return;
  }
  if (act === "starters") {
    const n = addStarters();
    toastText = n ? `Added ${n} starter${n === 1 ? "" : "s"}` : "Starters are already on your list";
    go("track");
    return;
  }
  if (act === "pick") {
    pickedId = t.dataset.id === pickedId ? "" : t.dataset.id;
    draft.ideas = [];
    render();
    return;
  }
  if (act === "use" || act === "track-action") {
    const title = t.dataset.title;
    const ok = addHabit({ title, note: t.dataset.why || "", color: t.dataset.color || "teal", from: t.dataset.from || "" });
    toastText = ok ? `Swapped in: ${title}` : "Already on your list";
    keepScroll = true;
    render();
    return;
  }
  if (act === "ideas") {
    const picked = UNWANTED.find((h) => h.id === pickedId);
    const habit = (picked && picked.title) || draft.custom.trim();
    if (!habit) {
      toastText = "Name the habit first.";
      render();
      return;
    }
    draft.ideas = moreIdeas(habit, (picked && picked.need) || draft.need);
    toastText = "A few more swaps";
    render();
    return;
  }
  if (act === "article") {
    route = { name: "article", id: t.dataset.id };
    render();
    return;
  }
  if (act === "dchip") {
    det[t.dataset.key] = det[t.dataset.key] === t.dataset.val ? "" : t.dataset.val;
    keepScroll = true;
    render();
    return;
  }
  if (act === "dhabit") {
    det.habit = t.dataset.val;
    keepScroll = true;
    render();
    return;
  }
  if (act === "dnext") {
    syncDetHabit();
    if (det.step === 0 && !det.habit.trim()) {
      toastText = "Name the habit first.";
      render();
      return;
    }
    det.step = Math.min(DET_STEPS.length - 1, det.step + 1);
    render();
    return;
  }
  if (act === "dback") {
    syncDetHabit();
    det.step = Math.max(0, det.step - 1);
    render();
    return;
  }
  if (act === "dreset") {
    det.step = 0;
    det.habit = det.time = det.emotion = det.location = det.people = det.body = "";
    render();
    return;
  }
  if (act === "save-note") {
    const insight = buildInsight();
    state.notes = state.notes || [];
    state.notes.unshift({ iso: todayISO(), habit: det.habit.trim() || "Untitled", text: insight.text });
    state.notes = state.notes.slice(0, 30);
    save();
    toastText = "Note kept on this device";
    render();
    return;
  }
  if (act === "add-custom") {
    const ok = addHabit({ title: draft.newTitle, note: draft.newNote, color: "teal" });
    if (ok) {
      draft.newTitle = "";
      draft.newNote = "";
      toastText = "Added";
    } else toastText = draft.newTitle.trim() ? "Already on your list" : "Name the habit first.";
    render();
    return;
  }
  if (act === "archive") {
    const h = state.habits.find((x) => x.id === t.dataset.id);
    if (h) h.archived = true;
    save();
    keepScroll = true;
    toastText = "Removed";
    render();
    return;
  }
  if (act === "open-flow") {
    const f = YOGA.find((x) => x.id === t.dataset.id) || YOGA[0];
    flow.id = f.id;
    flow.i = 0;
    flow.left = f.poses[0].seconds;
    flow.playing = false;
    flow.done = false;
    go("flow");
    return;
  }
  if (act === "pose-toggle") {
    const f = YOGA.find((x) => x.id === flow.id);
    if (flow.done) {
      flow.i = 0;
      flow.left = f.poses[0].seconds;
      flow.done = false;
      flow.playing = true;
    } else flow.playing = !flow.playing;
    render();
    return;
  }
  if (act === "pose-next" || act === "pose-prev") {
    const f = YOGA.find((x) => x.id === flow.id);
    const dir = act === "pose-next" ? 1 : -1;
    const ni = Math.max(0, Math.min(f.poses.length - 1, flow.i + dir));
    flow.i = ni;
    flow.left = f.poses[ni].seconds;
    flow.done = false;
    render();
    return;
  }
  if (act === "notify") {
    if (state.notify) {
      state.notify = false;
      save();
      toastText = "Reminders off";
      render();
      return;
    }
    const enable = () => {
      state.notify = true;
      save();
      toastText = "Reminders on while this page is open";
      render();
    };
    try {
      if (!("Notification" in window)) {
        enable();
        return;
      }
      Notification.requestPermission().then((p) => {
        if (p === "granted") enable();
        else {
          toastText = "Notifications blocked. The in-app reminder still works.";
          state.notify = true;
          save();
          render();
        }
      });
    } catch {
      enable();
    }
    return;
  }
  if (act === "export") {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "habit-swap.json";
    a.click();
    URL.revokeObjectURL(a.href);
    return;
  }
  if (act === "reset") {
    if (!draft.confirmReset) {
      draft.confirmReset = true;
      render();
      return;
    }
    localStorage.removeItem(KEY);
    state = defaultState();
    draft.confirmReset = false;
    toastText = "Cleared on this device";
    render();
  }
}

function onInput(e) {
  const el = e.target;
  if (!(el instanceof HTMLElement)) return;
  if (el.dataset.draft) draft[el.dataset.draft] = el.value;
  if (el.id === "det-habit") det.habit = el.value;
  if (el.dataset.save) {
    state[el.dataset.save] = el.value;
    if (el.dataset.save === "reminder") state.remindedOn = "";
    save();
  }
}

function onChange(e) {
  const el = e.target;
  if (!el || el.id !== "import-file" || !el.files || !el.files[0]) return;
  const file = el.files[0];
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result || ""));
      if (!data || !Array.isArray(data.habits)) throw new Error("bad");
      state = Object.assign(defaultState(), data);
      save();
      toastText = "Restored";
      render();
    } catch {
      toastText = "That file isn’t a Habit Swap backup";
      render();
    }
  };
  reader.readAsText(file);
}

document.getElementById("app").addEventListener("click", onClick);
document.getElementById("app").addEventListener("input", onInput);
document.getElementById("app").addEventListener("change", onChange);
render();

</script>
</body>
</html>
