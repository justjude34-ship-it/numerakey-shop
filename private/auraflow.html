    const max = Math.max(1, ...days.map((d) => d.mins));
    const kept = TONES.filter((t) => S.stars.indexOf(t.hz) >= 0);
    let streak = 0; const set = new Set(S.journal.map((e) => dayKey(e.at)));
    const cursor = new Date(); cursor.setHours(12, 0, 0, 0);
    if (!set.has(dayKey(cursor.getTime()))) cursor.setDate(cursor.getDate() - 1);
    while (set.has(dayKey(cursor.getTime()))) { streak += 1; cursor.setDate(cursor.getDate() - 1); }
    const note = streak <= 0 ? "Finish a sitting and this page will remember it, only on this phone." : streak === 1 ? "One day kept. That is a beginning." : "A " + streak + "-day return.";
    body = '<p class="kicker">This week</p><p class="stat">' + week + '</p><p class="muted" style="margin-top:-4px">minutes sat</p><div class="days">' + days.map((d) => '<div class="day' + (d.today ? " today" : "") + '"><div class="bar"><i style="height:' + (d.mins ? Math.max(8, (d.mins / max) * 100) : 0) + '%"></i></div>' + esc(d.label) + "</div>").join("") + '</div><p class="muted">' + esc(note) + '</p><h2 style="font-size:1.45rem;margin-top:24px">Recent</h2>';
    body += S.journal.length ? '<div class="cards">' + S.journal.slice(0, 12).map((e) => '<div class="card"><span class="top"><b style="font-family:var(--sans);font-size:1rem">' + esc(e.title) + "</b><small>" + e.minutes + ' min</small></span><span class="muted" style="display:block;margin-top:4px;font-size:.82rem">' + esc(e.detail || "") + '</span><span class="muted" style="display:block;margin-top:4px;font-size:.78rem">' + esc(when(e.at)) + "</span></div>").join("") + "</div>" : '<p class="muted">Nothing saved yet. Finish a breath, a tone, or a journey and it will land here.</p>';
    if (kept.length) body += '<h2 style="font-size:1.45rem;margin-top:24px">Kept tones</h2><div class="chips" style="justify-content:flex-start">' + kept.map((t) => chip(false, "kept", hzText(t.hz) + " " + esc(t.name), ' data-hz="' + t.hz + '"')).join("") + "</div>";
    body += '<div class="own"><h2 style="font-size:1.45rem">Yours, in this file</h2><p class="muted">Breath, tones, and journeys live in this one file. No account. No subscription. Keep it, or sell it as it is.</p></div>';
    if (S.journal.length) body += '<button class="linkish" data-act="clear" style="width:100%">' + (S.confirm ? "Yes, clear this phone’s history" : "Clear history") + "</button>";
  }
  let sheet = "";
  if (S.sheet === "timer") {
    sheet = '<div class="sheet" data-act="close-sheet"><div class="panel" data-act="stop"><h2>Timer</h2><div class="chips" style="justify-content:flex-start">' + [5, 10, 15, 20, 30].map((n) => chip(S.minutes === n, "minutes", n + " min", ' data-n="' + n + '"')).join("") + '</div><button class="begin" style="max-width:none;margin-top:12px" data-act="set-timer">Set timer</button></div></div>';
  } else if (S.sheet === "bed") {
    sheet = '<div class="sheet" data-act="close-sheet"><div class="panel" data-act="stop"><h2>Bed</h2><div class="chips" style="justify-content:flex-start">' + BEDS.map((b) => chip(S.bed === b.id, "bed", esc(b.name), ' data-id="' + b.id + '"')).join("") + '</div><div class="row" style="margin-top:12px"><span>Volume</span><b id="volLabel" style="color:var(--gold2)">' + Math.round(S.vol * 100) + '%</b></div><input id="vol" type="range" min="20" max="100" value="' + Math.round(S.vol * 100) + '" aria-label="Volume"><p class="muted">The bed sits under the breath. Air follows the ring. The phone can also tap each phase.</p><button class="begin" style="max-width:none" data-act="close-sheet">Done</button></div></div>';
  }
  const strip = (S.toneOn && S.room !== "tones") ? '<div class="strip"><div><button data-act="go" data-id="tones"><b style="color:var(--gold2)">' + esc(toneOf(S.toneHz).name) + "</b> · " + hzText(S.toneHz) + ' Hz</button><button class="linkish" data-act="rest">Rest</button></div></div>' : "";
  const nav = "<nav>" + ROOMS.map((r) => '<button data-act="go" data-id="' + r.id + '"' + (r.id === S.room ? ' class="on"' : "") + ">" + ICONS[r.id] + r.label + "</button>").join("") + "</nav>";
  root.innerHTML = '<header class="head"><div><p class="kicker">Aura Flow</p><h1 class="room">' + room.label + '</h1></div><button class="ghost" data-act="close">Close</button></header><main class="page' + pad + '">' + body + "</main>" + strip + nav + sheet;
  const page = root.querySelector(".page");
  if (page) page.scrollTop = top;
}
document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.dataset.act === "stop") { if (el && el.dataset.act === "stop") e.stopPropagation(); return; }
  const act = el.dataset.act;
  if (act === "enter") { S.screen = "app"; render(); return; }
  if (act === "close") { stopSession(false); stopTone(false); S.sheet = null; S.screen = "gate"; render(); return; }
  if (act === "go") { S.room = el.dataset.id; S.sheet = null; render(); return; }
  if (act === "mood") { S.mood = el.dataset.id; if (!run.on) S.guide = COPY[moodOf(S.mood).tech]; render(); return; }
  if (act === "breathe") {
    if (!run.on) startBreath();
    else if (!run.paused) pauseBreath();
    else resumeBreath();
    return;
  }
  if (act === "end-sit") { stopSession(false); render(); return; }
  if (act === "sheet-timer") { S.sheet = "timer"; render(); return; }
  if (act === "sheet-bed") { S.sheet = "bed"; render(); return; }
  if (act === "close-sheet") { S.sheet = null; render(); return; }
  if (act === "minutes") { S.minutes = Number(el.dataset.n); if (!run.on) S.clock = clock(S.minutes * 60000); render(); return; }
  if (act === "set-timer") {
    S.clock = clock(S.minutes * 60000);
    if (run.on && !run.paused) { run.total = S.minutes * 60000; run.left = run.total; run.start = Date.now(); }
    S.sheet = null; render(); return;
  }
  if (act === "bed") {
    S.bed = el.dataset.id;
    if (run.on && !run.paused) { unlock().then(() => { if (run.on && !run.paused) startBed(); }); }
    render(); return;
  }
  if (act === "soft") { S.soft = S.soft > 1 ? 1 : 1.25; render(); return; }
  if (act === "rain") {
    S.rain = !S.rain;
    if (run.on && !run.paused) { if (S.rain) rainOn(); else rainOff(); }
    render(); return;
  }
  if (act === "mode") {
    S.mode = el.dataset.id; saveTone();
    if (toneRun.on && !toneRun.held) beginTone(false);
    render(); return;
  }
  if (act === "tone") {
    S.toneHz = Number(el.dataset.hz); saveTone();
    if (toneRun.on && !toneRun.held) beginTone(false);
    render(); return;
  }
  if (act === "beat") {
    S.beat = Number(el.dataset.hz); saveTone();
    if (toneRun.on && !toneRun.held) beginTone(false);
    render(); return;
  }
  if (act === "tmin") {
    S.toneMin = Number(el.dataset.n); saveTone();
    if (!toneRun.on) S.toneClock = S.toneMin ? clock(S.toneMin * 60000) : "Open";
    render(); return;
  }
  if (act === "star") {
    const hz = toneOf(S.toneHz).hz;
    S.stars = S.stars.indexOf(hz) >= 0 ? S.stars.filter((n) => n !== hz) : S.stars.concat(hz);
    write("af-stars", S.stars); render(); return;
  }
  if (act === "play-tone") {
    if (toneRun.on) stopTone(false);
    else { if (!run.on) journey = null; beginTone(false); }
    render(); return;
  }
  if (act === "rest") { stopTone(false); render(); return; }
  if (act === "journey") {
    const j = JOURNEYS.find((item) => item.id === el.dataset.id);
    if (!j) return;
    S.mood = j.moodId; S.bed = j.bedId; S.minutes = j.minutes; S.soft = j.soft || 1; S.rain = !!j.rain;
    S.toneHz = j.toneHz; S.mode = j.mode; if (j.beatHz) S.beat = j.beatHz;
    S.room = "breathe"; S.screen = "app"; S.clock = clock(j.minutes * 60000);
    if (run.on || run.paused) stopSession(false);
    stopTone(false);
    journey = j; saveTone();
    beginTone(true); startBreath();
    return;
  }
  if (act === "kept") { S.toneHz = Number(el.dataset.hz); S.room = "tones"; saveTone(); render(); return; }
  if (act === "clear") {
    if (!S.confirm) { S.confirm = true; render(); return; }
    S.journal = []; S.confirm = false; write("af-journal", []); render();
  }
});
document.getElementById("app").addEventListener("input", (e) => {
  if (e.target.id !== "vol") return;
  S.vol = Number(e.target.value) / 100;
  localStorage.setItem("af-vol", String(S.vol));
  const label = document.getElementById("volLabel");
  if (label) label.textContent = Math.round(S.vol * 100) + "%";
  swellBed(true); setToneVol(); setAirVol();
});
render();
</script>
