<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Here's What I Want for Them</title>
<style>
  :root {
    --aqua: #a8d8d8;
    --aqua-deep: #5a9a9a;
    --aqua-soft: #d4f0f0;
    --aqua-mid: #7bc4c4;
    --charcoal: #2c3e3e;
    --cream: #f7f1e3;
    --muted: #6a8a8a;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--aqua-soft);
    color: var(--charcoal);
    min-height: 100vh;
  }
  .screen { display: none; min-height: 100vh; padding: 24px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .hero {
    background: linear-gradient(160deg, #e0f5f3 0%, #c5ebe6 50%, #a8d8d8 100%);
    color: var(--charcoal);
    position: relative;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.25) 0%, transparent 55%);
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 1; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 {
    font-size: clamp(32px, 8vw, 52px);
    font-weight: normal;
    letter-spacing: 1px;
    margin-bottom: 8px;
    color: var(--charcoal);
    text-shadow: none;
  }
  .tagline {
    font-style: italic;
    font-size: clamp(16px, 4vw, 20px);
    color: var(--charcoal);
    margin-bottom: 12px;
  }
  .subtitle {
    font-size: clamp(13px, 3.2vw, 15px);
    color: var(--charcoal);
    max-width: 400px;
    line-height: 1.6;
    margin: 0 auto 28px;
  }
  .btn {
    display: inline-block;
    background: var(--charcoal);
    color: #ffffff;
    border: none;
    border-radius: 30px;
    padding: 14px 36px;
    font-size: 16px;
    font-family: Georgia, serif;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
  }
  .btn:hover { transform: scale(1.04); background: #3a7a7a; }
  .btn.secondary {
    background: transparent;
    color: var(--aqua-deep);
    border: 2px solid var(--aqua-deep);
  }
  .phase-label {
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--aqua-deep);
    margin-bottom: 16px;
  }
  .question {
    font-size: clamp(18px, 5vw, 24px);
    line-height: 1.45;
    max-width: 480px;
    margin-bottom: 32px;
    color: var(--charcoal);
  }
  .mic-btn {
    width: 84px; height: 84px; border-radius: 50%;
    background: var(--aqua-deep); border: 3px solid var(--aqua);
    color: var(--charcoal); font-size: 32px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px; transition: transform 0.15s;
  }
  .mic-btn.listening { background: var(--aqua); color: var(--charcoal); animation: pulse 1.3s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
  .transcript {
    font-size: 15px; color: var(--muted); max-width: 440px;
    line-height: 1.55; min-height: 40px; margin-bottom: 14px; font-style: italic;
  }
  .skip-link {
    background: none; border: none; color: var(--muted);
    font-family: Georgia, serif; font-size: 13px; text-decoration: underline; cursor: pointer;
  }
  .progress {
    position: fixed; top: 0; left: 0; right: 0; height: 3px;
    background: rgba(90,154,154,0.15);
  }
  .progress-bar { height: 100%; background: var(--aqua-deep); width: 0%; transition: width 0.4s; }
  .name-input {
    background: transparent; border: none; border-bottom: 2px solid var(--aqua-deep);
    color: var(--charcoal); font-family: Georgia, serif; font-size: 20px;
    text-align: center; padding: 8px; width: min(280px, 80vw); outline: none; margin-bottom: 22px;
  }
  .name-input::placeholder { color: var(--muted); }
  .draft-box {
    background: var(--white); border: 1px solid rgba(90,154,154,0.2);
    border-radius: 12px; padding: 20px; max-width: 520px; width: 100%;
    text-align: left; margin-bottom: 20px; max-height: 45vh; overflow-y: auto;
  }
  .draft-box .section { color: var(--aqua-deep); font-weight: bold; margin: 12px 0 4px; font-size: 13px; letter-spacing: 1px; }
  .draft-box .q { color: var(--charcoal); font-style: italic; margin-bottom: 2px; font-size: 14px; }
  .draft-box .a { color: var(--muted); margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
  .note { font-size: 11px; color: var(--muted); max-width: 420px; line-height: 1.5; margin-top: 14px; }
  .resume-banner {
    background: var(--aqua); color: var(--charcoal); padding: 12px 20px;
    border-radius: 8px; margin-bottom: 20px; font-size: 14px; max-width: 400px;
  }
  .review-item {
    background: var(--white); border: 1px solid rgba(90,154,154,0.2);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; width: 100%; max-width: 440px;
    text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  }
  .review-item:hover { border-color: var(--aqua-deep); }
  .review-item .sec-name { font-weight: bold; color: var(--charcoal); }
  .review-item .sec-count { font-size: 12px; color: var(--muted); }
  .type-box { width: min(480px, 100%); margin-bottom: 14px; }
  .type-box textarea {
    width: 100%; min-height: 90px; padding: 12px; border-radius: 10px;
    border: 1px solid rgba(90,154,154,0.4); background: var(--white);
    font-family: Georgia, serif; font-size: 15px; color: var(--charcoal); resize: vertical;
  }
  .type-box .btn { margin-top: 10px; padding: 10px 26px; font-size: 15px; }
.edit-link { color: var(--aqua-deep); font-size: 12px; margin-left: 6px; text-decoration: underline; }
  .hero-art { display: block; width: min(420px, 100%); height: auto; margin: 0 auto 24px; border-radius: 22px; box-shadow: 0 10px 30px rgba(44,62,62,0.14); }
  .sun-glow { animation: glow 6s ease-in-out infinite; transform-origin: 290px 96px; }
  @keyframes glow { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sun-glow { animation: none; } }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  /* Deeper blue inside the app */
  body { background: #0e3b4a; }
  .screen:not(#landing) {
    --muted: #cfe6e3;
    background: linear-gradient(165deg, #0b3342 0%, #14525f 55%, #1d6a77 100%);
    color: #f7f1e3;
  }
  .screen:not(#landing) h2, .screen:not(#landing) .question { color: #f7f1e3; }
  .screen:not(#landing) .phase-label { color: #e3c377; }
  .screen:not(#landing) .btn { background: #e3c377; color: #14323a; }
  .screen:not(#landing) .btn:hover { background: #f0d48c; }
  .screen:not(#landing) .name-input { color: #f7f1e3; border-bottom-color: #e3c377; }
  .screen:not(#landing) .name-input::placeholder { color: #a9cbc8; }
  .screen:not(#landing) .transcript { color: #cfe6e3; }
  .screen:not(#landing) .skip-link { color: #cfe6e3; }
  .screen:not(#landing) .note { color: #a9cbc8; }
  .screen:not(#landing) .mic-btn { background: #e3c377; border-color: rgba(247,241,227,0.55); color: #14323a; }
  .screen:not(#landing) .mic-btn.listening { background: #f7f1e3; }
  .screen:not(#landing) .type-box textarea { border-color: rgba(227,195,119,0.6); }
  .screen:not(#landing) .resume-banner { background: #f7f1e3; color: #14323a; }
  .progress { background: rgba(247,241,227,0.18); }
  .progress-bar { background: #e3c377; }
  .draft-box { color: #2c3e3e; }
  .draft-box .section { color: #2f7a85; }
  .review-item { color: #2c3e3e; gap: 12px; }
  .draft-box .q { color: var(--charcoal); }
  .draft-box .a { color: #4a6a6a; }
  .draft-box .edit-link { color: #2f7a85; }
  .review-item .sec-count { color: #4a6a6a; }
  .review-item:hover { border-color: #e3c377; }
  /* Landing hero: picture scales like "cover"; Begin is pinned to the picture so it never covers the words */
  #landing.hero { background: #f7f1e3; padding: 0; overflow: hidden; position: relative; height: 100vh; height: 100dvh; }
  #landing.hero.active { display: block; }
  #landing.hero:not(.active) { display: none; }
  #landing.hero::before { content: ""; position: absolute; inset: -40px; background: var(--hero-img) center / cover no-repeat; filter: blur(26px) saturate(1.1); opacity: 0.9; }

    --w: max(100vw, 44.79vh);

<body>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<div class="screen hero active" id="landing">
  <h1 class="sr-only">Here's What I Want for Them</h1>
  <div class="hero-frame" role="img" aria-label="Here's What I Want for Them: an open book with a glowing golden heart, among watercolour flowers">
    <button class="btn" id="startBtn">Begin</button>
  </div>
</div>

<div class="screen" id="welcome">
  <p class="phase-label">Welcome</p>
  <h2 style="font-size:clamp(20px,5.5vw,26px);margin-bottom:8px;font-weight:normal;">Hello. I'm glad you're here.</h2>
  <p style="color:var(--muted);margin-bottom:20px;">What should I call you?</p>
  <input class="name-input" id="nameInput" placeholder="Your name" autocomplete="off">
  <button class="btn" id="continueBtn">Continue</button>
  <button class="skip-link" id="skipNameBtn" style="margin-top:12px;">Prefer not to say</button>
  <div class="resume-banner" id="resumeBanner" style="display:none;margin-top:20px;">
    You have progress saved. <button class="btn" style="padding:8px 18px;font-size:14px;margin-left:8px;" id="resumeBtn">Resume</button>
  </div>
</div>

<div class="screen" id="question">
  <p class="phase-label" id="phaseLabel">Section</p>
  <p class="question" id="questionText"></p>
  <button class="mic-btn" id="micBtn">🎤</button>
  <p class="transcript" id="transcript"></p>
  <div class="type-box">
    <textarea id="typeInput" placeholder="Type here, or use your keyboard microphone"></textarea>
    <button class="btn" id="saveTypedBtn">Save answer</button>
  </div>
  <button class="skip-link" id="skipQBtn">Skip for now</button>
  <button class="skip-link" id="toReviewBtn" style="margin-top:10px;">See your progress</button>
</div>

<div class="screen" id="review">
  <p class="phase-label">Review</p>
  <h2 style="font-size:clamp(20px,5.5vw,26px);margin-bottom:16px;font-weight:normal;">Your progress</h2>
  <div id="reviewList"></div>
  <button class="btn" id="toDraftBtn" style="margin-top:20px;">See your draft</button>
  <button class="skip-link" id="startOverBtn" style="margin-top:16px;">Delete my answers and start over</button>
</div>

<div class="screen" id="draft">
  <p class="phase-label">Your Draft</p>
  <div class="draft-box" id="draftBox"></div>
  <button class="btn" id="downloadBtn">Download your draft</button>
  <button class="skip-link" id="backReviewBtn" style="margin-top:14px;">Back to your progress</button>
  <p class="note">This is a preparation tool, not legal advice. A will still needs proper witnessing and professional review by a lawyer.</p>
</div>

<script>
const SECTIONS = [
  {
    name: "Who you are and who you care about",
    questions: [
      "What's your full name, and what name do you like to go by?",
      "Where do you live, and how long have you been there?",
      "Who's in your immediate family — partner, children, parents, siblings?",
      "Are there any children or dependents who rely on you, and what ages are they?",
      "Who are the people closest to you outside your family — friends, chosen family, anyone who matters?",
      "Is there anyone you'd want remembered in your will even if they're not family?",
      "Are there any organisations or causes you care about deeply?",
      "If you could leave one message to the people you love, what would it say?"
    ]
  },
  {
    name: "What you own",
    questions: [
      "Do you own your home, or rent?",
      "Do you have superannuation, and roughly how much is in it?",
      "Do you have savings or investments — bank accounts, shares, term deposits?",
      "Do you own a car or other vehicles?",
      "Are there any valuable items — jewellery, art, collectibles, furniture — you'd want to go to someone specific?",
      "Do you have digital accounts that matter — photos, email, social media, online businesses?",
      "Are there any debts or loans that would need to be settled?",
      "Is there anything you own that has sentimental value beyond its price — something you'd want kept in the family?"
    ]
  },
  {
    name: "Who receives what",
    questions: [
      "Who should receive your home, if you own one?",
      "Who should receive your superannuation?",
      "Who should receive your savings and investments?",
      "Do you want to leave specific gifts to specific people — jewellery, a car, a piece of furniture?",
      "Who should receive everything that's left over after those gifts?",
      "If your first choice can't receive something, who takes their place?",
      "Are there any charities or causes you'd like to leave something to?",
      "Is there anyone you specifically don't want to inherit, and why?"
    ]
  },
  {
    name: "Care of people and animals",
    questions: [
      "Do you have any children under eighteen who would need a guardian?",
      "If so, who would you choose, and have you talked to them about it?",
      "Who would be the backup guardian if your first choice can't serve?",
      "Do you have pets, and who should take them?",
      "Should money go with your pets for their care?",
      "Are there any other dependents — elderly parents, a sibling, anyone who relies on you?",
      "Who should make decisions for them if you can't?",
      "Is there anything you'd want those people to know about how you want them cared for?"
    ]
  },
  {
    name: "Healthcare and end-of-life wishes",
    questions: [
      "Who should make medical decisions for you if you can't speak for yourself?",
      "Have you talked to that person about what you'd want?",
      "Are there any treatments you'd refuse, no matter what — life support, resuscitation, anything else?",
      "Are there treatments you'd want, even if they prolong things?",
      "Where would you prefer to be cared for at the end — at home, in a hospital, in a hospice?",
      "Is there anything that would make your final days more comfortable or meaningful — music, people, a place?",
      "Do you have any religious or spiritual wishes for your care?",
      "Is there anything you'd want your family to know about how you want to be treated?"
    ]
  },
  {
    name: "Funeral and memorial wishes",
    questions: [
      "Burial or cremation?",
      "Do you have a cemetery or memorial garden in mind, or should that be left to your family?",
      "Do you want a service, and what kind — religious, secular, or something in between?",
      "Is there music you'd want played?",
      "Are there readings, poems, or words you'd want spoken?",
      "Who would you want to speak at the service?",
      "Do you want flowers, or would you prefer donations to a cause instead?",
      "Is there anything you'd want people to remember about you when they gather?"
    ]
  },
  {
    name: "Personal messages",
    questions: [
      "Is there anyone you'd want to write a message to — a partner, a child, a friend, someone you lost?",
      "What would you want them to know that you never quite said?",
      "Is there an apology you owe someone?",
      "Is there a thank-you you've never said out loud?",
      "Is there a memory you'd want them to keep?",
      "Is there advice you'd want to pass on?",
      "Is there anything you'd want them to do — or not do — in your memory?",
      "Is there anyone you'd want to forgive, or ask forgiveness from?"
    ]
  },
  {
    name: "Practical details",
    questions: [
      "Who should be your executor — the person who carries out your wishes?",
      "Have you talked to them about it, and would they say yes?",
      "Who's the backup executor if your first choice can't serve?",
      "Where are your important documents kept — birth certificate, property papers, super statements?",
      "Do you have a lawyer or accountant who should be contacted?",
      "Are there any debts or obligations that need settling first?",
      "Is there anything you'd want done quickly after you die — bills paid, accounts closed, a pet fed?",
      "Is there anything else you want your executor to know that isn't covered anywhere else?"
    ]
  }
];

let state = { name: '', section: 0, question: 0, answers: {} };
let micOn = false;
let recognition = null;
const STORAGE_KEY = 'heres-what-i-want-for-them-progress';

function save() {
  try{localStorage.setItem(STORAGE_KEY, JSON.stringify(state));}catch(e){}
}
function load() {
  let raw=null;try{raw=localStorage.getItem(STORAGE_KEY);}catch(e){}
  if (raw) {
    try { state = JSON.parse(raw); delete state.listening; micOn = false; return true; } catch(e) {}
  }
  return false;
}
function clear() {
  try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  state = { name: '', section: 0, question: 0, answers: {} };
}

function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  updateProgress();
}
function updateProgress() {
  let total = 0, done = 0;
  SECTIONS.forEach((sec, si) => {
    sec.questions.forEach((_, qi) => {
      total++;
      const key = si + '-' + qi;
      if (state.answers[key]) done++;
    });
  });
  document.getElementById('progressBar').style.width = (done / total * 100) + '%';
}
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function keyFor(s, q) { return s + '-' + q; }

function showQuestion() {
  const sec = SECTIONS[state.section];
  document.getElementById('phaseLabel').textContent = sec.name;
  document.getElementById('questionText').textContent = sec.questions[state.question];
  document.getElementById('transcript').textContent = '';
  document.getElementById('typeInput').value = state.answers[keyFor(state.section, state.question)] || '';
  go('question');
}
function nextQuestion() {
  if (state.editOne) { state.editOne = false; save(); showDraft(); return; }
  state.question++;
  if (state.question >= SECTIONS[state.section].questions.length) {
    state.question = 0;
    if (state.revisit) { state.revisit = false; save(); showReview(); return; }
    state.section++;
    if (state.section >= SECTIONS.length) {
      showReview();
      return;
    }
  }
  save();
  showQuestion();
}
function skipQuestion() {
  stopMic();
  if (state.editOne) { state.editOne = false; save(); showDraft(); return; }
  state.answers[keyFor(state.section, state.question)] = null;
  nextQuestion();
}
function acceptAnswer(text) {
  const cleaned = text.replace(/\b(um|uh|er|like|you know)\b/gi, '').replace(/\s+/g, ' ').trim();
  state.answers[keyFor(state.section, state.question)] = cleaned;
  nextQuestion();
}

function stopMic() {
  if (recognition && micOn) { recognition.onend = null; try { recognition.stop(); } catch(e) {} }
  micOn = false;
  document.getElementById('micBtn').classList.remove('listening');
}
function toggleMic() {
  const box = document.getElementById('typeInput');
  const hint = document.getElementById('transcript');
  if (micOn) { stopMic(); hint.textContent = 'Check the words below, fix anything, then tap Save answer.'; return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { hint.textContent = "Voice isn't available in this viewer. Tap the microphone on your keyboard to speak into the box below, or open this app in Chrome."; return; }
  recognition = new SR();
  recognition.lang = 'en-AU';
  recognition.interimResults = true;
  recognition.continuous = false;
  const base = box.value.trim() ? box.value.trim() + ' ' : '';
  let heard = '';
  recognition.onresult = e => {
    // Rebuild from this session's results each time (avoids repeated text on Android)
    let t = '';
    for (let i = 0; i < e.results.length; i++) {
      const piece = e.results[i][0].transcript.trim();
      const prev = t.trim();
      if (prev && piece.toLowerCase().startsWith(prev.toLowerCase())) t = piece + ' ';   // cumulative repeat: replace
      else if (prev && prev.toLowerCase().endsWith(piece.toLowerCase())) { /* repeat: ignore */ }
      else t += piece + ' ';
    }
    heard = t;
    box.value = (base + heard).replace(/\s+/g, ' ').trimStart();
  };
  recognition.onerror = e => {
    stopMic();
    const err = e && e.error;
    if (err === 'not-allowed' || err === 'service-not-allowed') hint.textContent = "The microphone is blocked here. Tap the microphone on your keyboard to speak into the box below, or open this app in Chrome and allow the microphone.";
    else if (err === 'no-speech') hint.textContent = "I didn't hear anything. Tap the microphone and try again, or type below.";
    else if (err === 'network') hint.textContent = "Voice needs an internet connection. You can type, or use your keyboard's microphone.";
    else hint.textContent = "Voice didn't work. Tap the microphone on your keyboard to speak into the box below, or type.";
  };
  recognition.onend = () => {
    micOn = false;
    document.getElementById('micBtn').classList.remove('listening');
    if (heard.trim()) box.value = (base + heard).replace(/\s+/g, ' ').trim();
    hint.textContent = heard.trim() ? 'Check the words below and fix anything. Tap the microphone to add more, or tap Save answer.' : "I didn't catch anything. In Chrome, tap the padlock next to the web address, make sure Microphone is allowed, then try again.";
  };
  try { recognition.start(); } catch (err) { hint.textContent = "Voice didn't start. Tap the microphone on your keyboard to speak into the box below."; return; }
  micOn = true;
  document.getElementById('micBtn').classList.add('listening');
  hint.textContent = 'Listening… speak now.';
}

function showReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  SECTIONS.forEach((sec, si) => {
    let answered = 0;
    sec.questions.forEach((_, qi) => {
      if (state.answers[keyFor(si, qi)]) answered++;
    });
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = '<span class="sec-name">' + sec.name + '</span><span class="sec-count">' + answered + '/' + sec.questions.length + '</span>';
    div.onclick = () => {
      state.section = si;
      state.question = 0;
      state.revisit = true;
      showQuestion();
    };
    list.appendChild(div);
  });
  go('review');
}

function showDraft() {
  let html = '';
  if (state.name) html += '<p style="margin-bottom:12px;"><strong>Prepared for:</strong> ' + esc(state.name) + '</p>';
  SECTIONS.forEach((sec, si) => {
    html += '<div class="section">' + sec.name + '</div>';
    sec.questions.forEach((q, qi) => {
      const a = state.answers[keyFor(si, qi)];
      if (a) {
        html += '<div class="q">' + q + '</div><div class="a">' + esc(a) + ' <a href="#" class="edit-link" data-s="' + si + '" data-q="' + qi + '">Edit</a></div>';
      }
    });
  });
  document.getElementById('draftBox').innerHTML = html || '<p>No answers yet.</p>';
  go('draft');
}

function downloadDraft() {
  let text = "YOUR WISHES\nA preparation draft for your will\n\n";
  if (state.name) text += "Prepared for: " + state.name + "\n\n";
  SECTIONS.forEach((sec, si) => {
    text += sec.name.toUpperCase() + "\n\n";
    sec.questions.forEach((q, qi) => {
      const a = state.answers[keyFor(si, qi)];
      if (a) text += q + "\n" + a + "\n\n";
    });
  });
  text += "---\nThis is a preparation tool, not legal advice. A will still needs proper witnessing and professional review by a lawyer.\n";
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type:'text/plain'}));
  a.download = 'your-wishes.txt';
  a.click();
}

function startFresh() {
  state = { name: '', section: 0, question: 0, answers: {} };
  save();
  document.getElementById('resumeBanner').style.display = 'none';
  go('welcome');
  document.getElementById('nameInput').value = '';
}

document.getElementById('startBtn').addEventListener('click', () => {
  if (load()) {
    document.getElementById('resumeBanner').style.display = 'block';
  }
  go('welcome');
});
document.getElementById('continueBtn').addEventListener('click', () => {
  const typed = document.getElementById('nameInput').value.trim();
  if (typed) state.name = typed;
  if (Object.keys(state.answers).length === 0) { state.section = 0; state.question = 0; }
  save();
  showQuestion();
});
document.getElementById('skipNameBtn').addEventListener('click', () => {
  if (Object.keys(state.answers).length === 0) { state.section = 0; state.question = 0; }
  save();
  showQuestion();
});
document.getElementById('resumeBtn').addEventListener('click', () => {
  state.revisit = false; state.editOne = false;
  outer: for (let si = 0; si < SECTIONS.length; si++) {
    for (let qi = 0; qi < SECTIONS[si].questions.length; qi++) {
      if (!(keyFor(si, qi) in state.answers)) { state.section = si; state.question = qi; break outer; }
    }
    if (si === SECTIONS.length - 1) { showReview(); return; }
  }
  showQuestion();
});
document.getElementById('micBtn').addEventListener('click', toggleMic);
document.getElementById('skipQBtn').addEventListener('click', skipQuestion);
document.getElementById('saveTypedBtn').addEventListener('click', () => {
  const t = document.getElementById('typeInput').value.trim();
  if (!t) { document.getElementById('transcript').textContent = 'Type or speak your answer first, or choose Skip.'; return; }
  stopMic();
  acceptAnswer(t);
});
document.getElementById('toDraftBtn').addEventListener('click', showDraft);
document.getElementById('draftBox').addEventListener('click', e => {
  const a = e.target.closest('.edit-link');
  if (!a) return;
  e.preventDefault();
  state.section = +a.dataset.s; state.question = +a.dataset.q;
  state.editOne = true; state.revisit = false;
  save(); showQuestion();
});
document.getElementById('backReviewBtn').addEventListener('click', showReview);
document.getElementById('toReviewBtn').addEventListener('click', () => {
  stopMic();
  state.revisit = false; state.editOne = false; save(); showReview();
});
document.getElementById('startOverBtn').addEventListener('click', () => {
  if (confirm('This will permanently delete all your saved answers on this device. Continue?')) { clear(); startFresh(); }
});
document.getElementById('downloadBtn').addEventListener('click', downloadDraft);
document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('continueBtn').click();
});

if (load()) {
  document.getElementById('resumeBanner').style.display = 'block';
}
</script>
</body>
</html>
