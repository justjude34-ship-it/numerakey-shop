<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Here's What I Want for Them</title>
<style>
  :root {
    --peacock: #0d3b4c;
    --peacock-deep: #082f3d;
    --peacock-light: #1a5f73;
    --cream: #f7f1e3;
    --gold: #d4a84b;
    --gold-soft: #e8c97a;
    --text: #f7f1e3;
    --muted: #b8c9d0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--peacock-deep);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .screen { display: none; min-height: 100vh; padding: 24px; }
  .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .hero {
    background: linear-gradient(160deg, var(--peacock) 0%, var(--peacock-deep) 60%, #061f2a 100%);
    position: relative;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(26,95,115,0.4) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 80%, rgba(13,59,76,0.5) 0%, transparent 60%);
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 1; }
  .icon { font-size: 64px; margin-bottom: 16px; line-height: 1; }
  .title {
    font-size: clamp(32px, 8vw, 52px);
    font-weight: normal;
    letter-spacing: 1px;
    margin-bottom: 12px;
    color: var(--cream);
  }
  .tagline {
    font-size: clamp(16px, 4vw, 22px);
    font-style: italic;
    color: var(--gold-soft);
    margin-bottom: 32px;
  }
  .subtitle {
    font-size: clamp(13px, 3.5vw, 16px);
    color: var(--muted);
    max-width: 420px;
    line-height: 1.6;
    margin-bottom: 40px;
  }
  .btn {
    background: var(--peacock-light);
    color: var(--cream);
    border: none;
    border-radius: 30px;
    padding: 16px 40px;
    font-size: 18px;
    font-family: Georgia, serif;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
  }
  .btn:hover { background: var(--gold); color: var(--peacock-deep); }
  .btn:active { transform: scale(0.97); }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--muted);
    border-radius: 30px;
    padding: 12px 28px;
    font-size: 15px;
    font-family: Georgia, serif;
    cursor: pointer;
    margin-top: 16px;
  }
  .btn-secondary:hover { color: var(--cream); border-color: var(--cream); }
  .phase-label {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 24px;
  }
  .question {
    font-size: clamp(20px, 5.5vw, 28px);
    line-height: 1.5;
    max-width: 560px;
    margin-bottom: 40px;
    color: var(--cream);
  }
  .mic-btn {
    width: 96px; height: 96px;
    border-radius: 50%;
    background: var(--peacock-light);
    border: 3px solid var(--gold);
    color: var(--cream);
    font-size: 40px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
    margin-bottom: 24px;
  }
  .mic-btn:hover { background: var(--gold); color: var(--peacock-deep); }
  .mic-btn.listening {
    background: var(--gold);
    color: var(--peacock-deep);
    animation: pulse 1.5s infinite;
    box-shadow: 0 0 30px rgba(212,168,75,0.5);
  }
  @keyframes pulse { 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.08); } }
  .skip-link {
    color: var(--muted);
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
    background: none; border: none;
    font-family: Georgia, serif;
  }
  .skip-link:hover { color: var(--cream); }
  .transcript {
    max-width: 560px;
    min-height: 60px;
    margin-bottom: 24px;
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    font-style: italic;
  }
  .progress {
    position: fixed; top: 0; left: 0; right: 0; height: 4px;
    background: rgba(247,241,227,0.1);
  }
  .progress-bar {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.4s;
  }
  .name-input {
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--gold);
    color: var(--cream);
    font-size: 22px;
    font-family: Georgia, serif;
    text-align: center;
    padding: 8px 0;
    width: min(320px, 80vw);
    outline: none;
    margin-bottom: 24px;
  }
  .name-input::placeholder { color: var(--muted); }
  .voice-list { max-width: 480px; width: 100%; margin-bottom: 24px; }
  .voice-item {
    background: rgba(247,241,227,0.06);
    border: 1px solid rgba(247,241,227,0.15);
    border-radius: 12px;
    padding: 14px 18px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    color: var(--cream);
    font-size: 15px;
    transition: background 0.2s;
  }
  .voice-item:hover { background: rgba(247,241,227,0.12); }
  .voice-item.selected { border-color: var(--gold); background: rgba(212,168,75,0.15); }
  .voice-item .sample { color: var(--muted); font-size: 13px; }
  .closing-line {
    font-size: clamp(18px, 4.5vw, 26px);
    font-style: italic;
    color: var(--gold-soft);
    max-width: 480px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .draft-box {
    background: rgba(247,241,227,0.06);
    border: 1px solid rgba(247,241,227,0.15);
    border-radius: 12px;
    padding: 24px;
    max-width: 560px;
    width: 100%;
    text-align: left;
    margin-bottom: 24px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .draft-box h3 { color: var(--gold); margin-bottom: 12px; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; }
  .draft-box p { margin-bottom: 14px; line-height: 1.6; color: var(--cream); font-size: 15px; }
  .draft-box .q { color: var(--muted); font-size: 13px; font-style: italic; margin-bottom: 4px; }
  .nudge {
    color: var(--muted);
    font-size: 14px;
    font-style: italic;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<!-- LANDING -->
<div class="screen hero active" id="screen-landing">
  <div class="hero-content">
    <div class="icon">📖🐾</div>
    <h1 class="title">Here's What I Want for Them</h1>
    <p class="tagline">Your wishes, in your words.</p>
    <p class="subtitle">A gentle guide to putting your wishes into words — for your pets, your family, and your future.</p>
    <button class="btn" onclick="go('screen-name')">Begin</button>
  </div>
</div>

<!-- NAME -->
<div class="screen" id="screen-name">
  <div class="phase-label">Welcome</div>
  <h2 class="question">Hello. I'm glad you're here.<br>What should I call you?</h2>
  <input class="name-input" id="nameInput" placeholder="Your name" autocomplete="off">
  <button class="btn" onclick="saveName()">Continue</button>
  <button class="btn-secondary" onclick="skipName()">Prefer not to say</button>
</div>

<!-- QUESTION -->
<div class="screen" id="screen-question">
  <div class="phase-label" id="phaseLabel">Pet Care</div>
  <h2 class="question" id="questionText"></h2>
  <div class="transcript" id="transcript"></div>
  <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
  <button class="skip-link" onclick="skipQuestion()">Skip for now</button>
  <p class="nudge" id="nudge"></p>
</div>

<!-- CLOSING -->
<div class="screen" id="screen-closing">
  <div class="phase-label">Complete</div>
  <p class="closing-line" id="closingLine"></p>
  <div class="draft-box" id="draftBox"></div>
  <button class="btn" onclick="downloadDraft()">Download your draft</button>
  <button class="btn-secondary" onclick="go('screen-landing')">Start again</button>
</div>

<script>
const _ls=(()=>{try{const s=window.localStorage;s.getItem('x');return s}catch(e){const m={};return{getItem:k=>(k in m?m[k]:null),setItem:(k,v)=>{m[k]=String(v)},removeItem:k=>{delete m[k]}}}})();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
</script>
<script>
const QUESTIONS = [
  { phase: 'Pet Care', text: "What's your pet's name, and what kind of animal are they?" },
  { phase: 'Pet Care', text: "How old are they, and do they have any health needs or quirks I should know about?" },
  { phase: 'Pet Care', text: "What does a day in their life look like — what do they love, what do they need?" },
  { phase: 'Pet Care', text: "Who in your life already loves them, or has offered to take them?" },
  { phase: 'Pet Care', text: "If that person couldn't take them, who would be your backup?" },
  { phase: 'Pet Care', text: "Should money go with them — for food, vet bills, care — and roughly how much?" },
  { phase: 'Pet Care', text: "If no one you know can take them, would you want a rescue or rehoming charity to care for them?" },
  { phase: 'Pet Care', text: "If you could say one thing to whoever ends up caring for them, what would it be?" }
];

let currentQ = 0;
let answers = {};
let userName = '';
let voices = [];
let selectedVoice = null;
let recognition = null;
let listening = false;
let silenceTimer = null;

function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'screen-question') showQuestion();
  if (id === 'screen-closing') showClosing();
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-AU';
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

function saveName() {
  const v = document.getElementById('nameInput').value.trim();
  if (v) { userName = v; _ls.setItem('hwift-name', v); }
  go('screen-question');
}
function skipName() { go('screen-question'); }

function showQuestion() {
  const q = QUESTIONS[currentQ];
  document.getElementById('phaseLabel').textContent = q.phase;
  document.getElementById('questionText').textContent = q.text;
  document.getElementById('transcript').textContent = '';
  document.getElementById('nudge').textContent = '';
  document.getElementById('progressBar').style.width = ((currentQ / QUESTIONS.length) * 100) + '%';
  speak(q.text);
  setTimeout(() => startListening(), 800);
}

function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  if (recognition) { try { recognition.stop(); } catch(e){} }
  recognition = new SR();
  recognition.lang = 'en-AU';
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.onresult = (e) => {
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    document.getElementById('transcript').textContent = t;
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      if (t.trim()) finishAnswer(t.trim());
    }, 2500);
  };
  recognition.onerror = () => {};
  try { recognition.start(); listening = true; document.getElementById('micBtn').classList.add('listening'); } catch(e){}
}

function toggleMic() {
  if (listening) {
    try { recognition.stop(); } catch(e){}
    listening = false;
    document.getElementById('micBtn').classList.remove('listening');
    const t = document.getElementById('transcript').textContent.trim();
    if (t) finishAnswer(t);
  } else startListening();
}

function finishAnswer(text) {
  if (recognition) { try { recognition.stop(); } catch(e){} }
  listening = false;
  document.getElementById('micBtn').classList.remove('listening');
  answers[currentQ] = text;
  _ls.setItem('hwift-answers', JSON.stringify(answers));
  nextQuestion();
}

function skipQuestion() {
  if (recognition) { try { recognition.stop(); } catch(e){} }
  listening = false;
  document.getElementById('micBtn').classList.remove('listening');
  nextQuestion();
}

function nextQuestion() {
  currentQ++;
  if (currentQ >= QUESTIONS.length) go('screen-closing');
  else showQuestion();
}

function showClosing() {
  const name = userName || _ls.getItem('hwift-name') || '';
  const greet = name ? name + ', ' : '';
  document.getElementById('closingLine').textContent = greet + "you've put into words what matters most. Your pets are lucky to have someone who cares this much.";
  const box = document.getElementById('draftBox');
  let html = '<h3>Your draft</h3>';
  QUESTIONS.forEach((q, i) => {
    if (answers[i]) html += '<p class="q">' + esc(q.text) + '</p><p>' + esc(answers[i]) + '</p>';
  });
  if (Object.keys(answers).length === 0) html += '<p>No answers yet — you can come back anytime.</p>';
  box.innerHTML = html;
}

function downloadDraft() {
  let text = "HERE'S WHAT I WANT FOR THEM\nA draft of wishes for my pets\n\n";
  QUESTIONS.forEach((q, i) => {
    if (answers[i]) text += q.text + '\n' + answers[i] + '\n\n';
  });
  text += '\nThis is a preparation draft, not a legal document.\n';
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'heres-what-i-want-for-them.txt';
  a.click();
}

// restore saved name
const savedName = _ls.getItem('hwift-name');
if (savedName) document.getElementById('nameInput').value = savedName;
const savedAnswers = _ls.getItem('hwift-answers');
if (savedAnswers) { try { answers = JSON.parse(savedAnswers); } catch(e){} }
</script>
</body>
</html>
