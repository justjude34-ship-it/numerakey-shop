.veil{position:absolute;inset:0;background:var(--veil);pointer-events:none}

.home-copy{
  position:absolute;left:0;right:0;bottom:0;text-align:center;
  padding:0 1.5rem calc(2.1rem + env(safe-area-inset-bottom));
}
.kicker{
  font-family:system-ui,-apple-system,sans-serif;
  font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-bottom:.55rem
}
h1{font-weight:400;font-size:clamp(3.6rem,16vw,5.2rem);letter-spacing:.08em;line-height:.86}
.tag{margin:.75rem 0 1.45rem;color:var(--muted);font-family:system-ui,sans-serif;font-weight:300;letter-spacing:.02em}
.row{display:flex;gap:.55rem;justify-content:center;flex-wrap:wrap}
.btn{
  font-family:system-ui,-apple-system,sans-serif;font-size:.92rem;letter-spacing:.04em;
  border-radius:999px;padding:.88rem 1.55rem;min-height:48px
}
.btn.fill{background:linear-gradient(180deg,#f0b27a,#c45c6a);color:#1a1210}
.btn.line{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px)}
.ghost{
  font-family:system-ui,-apple-system,sans-serif;font-size:.74rem;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);min-height:44px;padding:.4rem
}

.studio{display:flex;flex-direction:column;
  padding:calc(.85rem + env(safe-area-inset-top)) 1.15rem calc(1.15rem + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.word{letter-spacing:.18em;font-size:1.25rem}

.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55rem;position:relative;z-index:2}
.pair{
  font-family:system-ui,sans-serif;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)
}
.orb-wrap{position:relative;width:min(46vmin,230px);height:min(46vmin,230px)}
.halo,.glass,.spec{position:absolute;border-radius:50%}
.halo{inset:-22%;background:radial-gradient(circle,var(--orb-glow),rgba(201,123,154,.18) 42%,transparent 70%);filter:blur(10px)}
.glass{
  inset:0;
  background:radial-gradient(circle at 36% 30%,#fff6e8,var(--orb-mid) 34%,var(--splash) 68%,#3a1c22 100%);
  box-shadow:0 0 55px var(--orb-glow), inset -14px -18px 36px rgba(0,0,0,.35), inset 10px 12px 22px rgba(255,250,235,.22);
  transform:scale(.78);transition:transform linear
}
.spec{inset:14% 28% auto auto;width:28%;height:18%;background:rgba(255,255,255,.28);filter:blur(2px);transform:rotate(-18deg);pointer-events:none}
.phase{font-family:system-ui,sans-serif;letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}
.count{font-size:3.1rem;font-weight:400;line-height:1;min-height:3.1rem}
.hint{font-family:system-ui,sans-serif;font-weight:300;color:var(--muted);text-align:center;max-width:18.5rem;min-height:2.6rem;line-height:1.45}

.actions{position:relative;z-index:2;display:flex;flex-direction:column;gap:.5rem}
.actions .row .btn{flex:1}

.list-wrap{position:relative;z-index:2;overflow:auto;display:flex;flex-direction:column;gap:.42rem;padding:.2rem 0 .6rem}
.item{
  text-align:left;border:1px solid var(--line);border-radius:1rem;padding:1.05rem 1.1rem;
  font-family:system-ui,sans-serif;background:var(--panel);backdrop-filter:blur(12px)
}
.item b{display:block;font-weight:500;margin-bottom:.18rem}
.item span{color:var(--muted);font-size:.8rem;font-weight:300}
.item.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(240,178,122,.28),rgba(196,92,106,.18))}
.note{font-family:system-ui,sans-serif;font-size:.74rem;color:var(--muted);text-align:center;position:relative;z-index:2}
.vol{position:relative;z-index:2;display:flex;align-items:center;gap:.7rem;padding:.15rem .2rem .4rem;font-family:system-ui,sans-serif}
.vol label{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);min-width:4.2rem}
.vol input{flex:1;height:28px;accent-color:#c45c6a}
.vol span{font-size:.8rem;color:var(--muted);min-width:2.6rem;text-align:right}
</style>
</head>
<body data-theme="night">

<div class="scene" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<section id="home" class="screen">
  <div class="home-copy">
    <p class="kicker" id="kicker">Night studio</p>
    <h1>Omni</h1>
    <p class="tag">Still water. Soft light. One file. Yours to keep.</p>
    <div class="row">
      <button class="btn fill" id="begin">Begin</button>
      <button class="btn line" id="themeHome">Day look</button>
    </div>
  </div>
</section>

<section id="studio" class="screen studio hidden">
  <header class="top">
    <button class="ghost" id="back">Home</button>
    <p class="word">Omni</p>
    <button class="ghost" id="themeStudio">Day</button>
  </header>
  <div class="stage">
    <p class="pair" id="pair">Prayer Breath</p>
    <div class="orb-wrap">
      <div class="halo"></div>
      <div class="glass" id="orb"></div>
      <div class="spec"></div>
    </div>
    <p class="phase" id="phase">Ready</p>
    <p class="count" id="count"></p>
    <p class="hint" id="hint">The orb grows as you breathe in, rests on the hold, and softens as you breathe out.</p>
  </div>
  <div class="actions">
    <button class="btn fill" id="start">Start</button>
    <div class="row">
      <button class="btn line" id="openList">Practices</button>
      <button class="btn line" id="stop">Stop</button>
    </div>
    <div class="vol">
      <label for="vol">Sound</label>
      <input id="vol" type="range" min="1" max="10" value="10">
      <span id="volRead">10</span>
    </div>
  </div>
</section>

<section id="list" class="screen studio hidden">
  <header class="top">
    <button class="ghost" id="listBack">Home</button>
    <p class="word">Breath</p>
    <button class="ghost" id="themeList">Day</button>
  </header>
  <div class="list-wrap" id="items"></div>
  <p class="note">Sit if you feel dizzy. Stop anytime.</p>
</section>

<script>
const PRACTICES = [
  {n:"Prayer Breath", about:"Inhale. Hold. Exhale.",
    steps:[
      {p:"Inhale",s:5,h:"Breathe in with the wave.",k:"in"},
      {p:"Hold",s:4,h:"Stay. Soft face. The water stills.",k:"hold"},
      {p:"Exhale",s:5,h:"Let the wave roll out.",k:"out"}
    ]},
  {n:"Triangle Breath", about:"Inhale, hold, exhale. Equal sides.",
    steps:[{p:"Inhale",s:4,h:"Draw the breath in.",k:"in"},{p:"Hold",s:4,h:"Stay. Soft face.",k:"hold"},{p:"Exhale",s:4,h:"Let it leave.",k:"out"}]},
  {n:"Box Breath", about:"Four equal sides.",
    steps:[{p:"Inhale",s:4,h:"Fill without strain.",k:"in"},{p:"Hold",s:4,h:"The pause is the work.",k:"hold"},{p:"Exhale",s:4,h:"Empty slowly.",k:"out"},{p:"Hold",s:4,h:"Empty pause. Quiet.",k:"hold"}]},
  {n:"Five-Second Rhythm", about:"Five in, five out.",
    steps:[{p:"Inhale",s:5,h:"Soft nose. Five counts.",k:"in"},{p:"Exhale",s:5,h:"Same length out.",k:"out"}]},
  {n:"Sigh of Relief", about:"Two sips in. One long out.",
    steps:[{p:"Inhale",s:2,h:"First sip in.",k:"in"},{p:"Top up",s:2,h:"Second sip on top.",k:"in"},{p:"Exhale",s:6,h:"Long sigh. Shoulders drop.",k:"out"}]},
  {n:"Letting Go Breath", about:"Easy in. Audible out.",
    steps:[{p:"Inhale",s:4,h:"Easy through the nose.",k:"in"},{p:"Let go",s:6,h:"Sigh out. Drop the jaw.",k:"out"}]},
  {n:"Sip Sip Sip Poof", about:"Three sips in. One poof out.",
    steps:[{p:"Sip",s:1,h:"Small sip.",k:"in"},{p:"Sip",s:1,h:"Second sip.",k:"in"},{p:"Sip",s:1,h:"Third sip.",k:"in"},{p:"Poof",s:2,h:"Quick complete out.",k:"out"}]},
  {n:"Connected Circular", about:"No pauses. A wheel.",
    steps:[{p:"Inhale",s:4,h:"Pull the breath in.",k:"in"},{p:"Exhale",s:4,h:"Let it fall out. No gap.",k:"out"}]},
  {n:"Four and One", about:"Four small breaths, then one sigh.",
    steps:[
      {p:"Small in",s:2,h:"Small connected inhale.",k:"in"},{p:"Small out",s:2,h:"Small connected exhale.",k:"out"},
      {p:"Small in",s:2,h:"Again.",k:"in"},{p:"Small out",s:2,h:"Keep the wheel turning.",k:"out"},
      {p:"Small in",s:2,h:"Third small.",k:"in"},{p:"Small out",s:2,h:"No pause.",k:"out"},
      {p:"Small in",s:2,h:"Fourth small.",k:"in"},{p:"Small out",s:2,h:"Then the big one.",k:"out"},
      {p:"Big in",s:3,h:"Twice as big.",k:"in"},{p:"Sigh",s:5,h:"Sigh of relief.",k:"out"}
    ]},
  {n:"Three Spaces", about:"Lower, middle, upper. Then all three.",
    steps:[{p:"Lower",s:6,h:"Belly rises.",k:"in"},{p:"Middle",s:6,h:"Sides widen.",k:"in"},{p:"Upper",s:6,h:"Up to the collarbones.",k:"in"},{p:"All three",s:8,h:"One wave from base to throat.",k:"out"}]},
  {n:"Charge the Heart", about:"Breathe into the heart space.",
    steps:[{p:"Inhale",s:5,h:"Draw the breath into the chest centre.",k:"in"},{p:"Exhale",s:5,h:"Leave warmth there.",k:"out"}]},
  {n:"Cleansing Breath", about:"Full in. Complete out.",
    steps:[{p:"Inhale",s:4,h:"Fill the three spaces.",k:"in"},{p:"Exhale",s:6,h:"Empty all the way.",k:"out"}]},
  {n:"Coming Home", about:"Return to a natural breath.",
    steps:[{p:"Inhale",s:4,h:"No effort. Arrive.",k:"in"},{p:"Exhale",s:6,h:"Come home. Stay here.",k:"out"}]}
];

let cur=0, running=false, step=0, tick=null, ctx=null, vol=10;
let noiseSrc=null, filter=null, rumble=null, waveGain=null;
let osc432=null, osc648=null, osc864=null, toneGain=null, fifthGain=null, highGain=null, lfo=null;
const $=id=>document.getElementById(id);
const orb=$("orb");

function setTheme(t){
  document.body.setAttribute("data-theme", t);
  try{localStorage.setItem("omni-theme", t);}catch(e){}
  const day=t==="day";
  $("themeHome").textContent=day?"Night look":"Day look";
  $("themeStudio").textContent=day?"Night":"Day";
  if($("themeList")) $("themeList").textContent=day?"Night":"Day";
  $("kicker").textContent=day?"Morning studio":"Night studio";
  document.querySelector('meta[name="theme-color"]').setAttribute("content", day?"#efe8dc":"#0b0c10");
}
try{setTheme(localStorage.getItem("omni-theme")||"night");}catch(e){setTheme("night");}

function show(id){
  ["home","studio","list"].forEach(s=>$(s).classList.toggle("hidden", s!==id));
}
function load(i){
  cur=i; const p=PRACTICES[i];
  $("pair").textContent=p.n;
  $("phase").textContent="Ready"; $("count").textContent="";
  $("hint").textContent=p.about; $("start").textContent="Start";
  setOrb("ready");
}
function setOrb(k, seconds){
  if(k==="hold"){ orb.style.transitionDuration="0s"; return; }
  const map={in:1.24, out:.58, ready:.86};
  orb.style.transitionDuration=(seconds?Math.max(.4, seconds):.5)+"s";
  orb.style.transform="scale("+(map[k]||.86)+")";
}

function waveLevel(){ return 0.22 + (vol/10)*0.55; }
function toneLevel(){ return 0.28 + (vol/10)*0.62; }

function armAudio(){
  try{
    if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended") ctx.resume();
    if(!waveGain){
      const sr=ctx.sampleRate;
      const seconds=8;
      const buf=ctx.createBuffer(2, sr*seconds, sr);
      for(let ch=0; ch<2; ch++){
        const d=buf.getChannelData(ch);
        let b1=0,b2=0;
        for(let i=0;i<d.length;i++){
          const white=Math.random()*2-1;
          b1=0.997*b1+0.003*white;
          b2=0.985*b2+0.015*white;
          const swell=0.6+0.4*Math.sin(i/sr*0.28 + ch*1.3);
          d[i]=(b1*3.2 + b2*0.8)*swell*0.65;
        }
      }
      noiseSrc=ctx.createBufferSource();
      noiseSrc.buffer=buf;
      noiseSrc.loop=true;

      filter=ctx.createBiquadFilter();
      filter.type="bandpass";
      filter.frequency.value=380;
      filter.Q.value=0.65;

      rumble=ctx.createBiquadFilter();
      rumble.type="lowpass";
      rumble.frequency.value=320;

      waveGain=ctx.createGain();
      waveGain.gain.value=0.0001;

      noiseSrc.connect(filter);
      filter.connect(rumble);
      rumble.connect(waveGain);
      const master=ctx.createDynamicsCompressor();
      master.threshold.value=-18;
      master.knee.value=12;
      master.ratio.value=3;
      master.attack.value=0.01;
      master.release.value=0.18;
      waveGain.connect(master);
      master.connect(ctx.destination);
      noiseSrc.start();

      const delay=ctx.createDelay();
      delay.delayTime.value=0.24;
      const delayFilt=ctx.createBiquadFilter();
      delayFilt.type="lowpass";
      delayFilt.frequency.value=1600;
      const fb=ctx.createGain();
      fb.gain.value=0.32;
      const wet=ctx.createGain();
      wet.gain.value=0.22;

      toneGain=ctx.createGain();
      toneGain.gain.value=0.0001;
      fifthGain=ctx.createGain();
      fifthGain.gain.value=0.0001;
      highGain=ctx.createGain();
      highGain.gain.value=0.0001;

      osc432=ctx.createOscillator();
      osc432.type="sine";
      osc432.frequency.value=432;
      osc648=ctx.createOscillator();
      osc648.type="sine";
      osc648.frequency.value=648;
      osc864=ctx.createOscillator();
      osc864.type="triangle";
      osc864.frequency.value=864;

      lfo=ctx.createOscillator();
      lfo.type="sine";
      lfo.frequency.value=0.16;
      const lfoAmt=ctx.createGain();
      lfoAmt.gain.value=1.8;
      const lfoAmt2=ctx.createGain();
      lfoAmt2.gain.value=1.2;
      const lfoAmt3=ctx.createGain();
      lfoAmt3.gain.value=2.4;
      lfo.connect(lfoAmt);
      lfo.connect(lfoAmt2);
      lfo.connect(lfoAmt3);
      lfoAmt.connect(osc432.frequency);
      lfoAmt2.connect(osc648.frequency);
      lfoAmt3.connect(osc864.frequency);

      osc432.connect(toneGain);
      osc648.connect(fifthGain);
      osc864.connect(highGain);
      toneGain.connect(master);
      fifthGain.connect(master);
      highGain.connect(master);
      toneGain.connect(delay);
      fifthGain.connect(delay);
      highGain.connect(delay);
      delay.connect(delayFilt);
      delayFilt.connect(fb);
      fb.connect(delay);
      delayFilt.connect(wet);
      wet.connect(master);

      osc432.start();
      osc648.start();
      osc864.start();
      lfo.start();
    }
  }catch(e){}
}

function setTone(on){
  if(!toneGain||!ctx) return;
  const now=ctx.currentTime;
  const t=on?toneLevel():0.0001;
  [toneGain, fifthGain, highGain].forEach((g,i)=>{
    const mul=i===0?0.7:i===1?0.35:1.15;
    g.gain.cancelScheduledValues(now);
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.linearRampToValueAtTime(on?t*mul:0.0001, now+(on?0.7:0.45));
  });
}

function wave(on, kind){
  try{
    armAudio();
    if(!waveGain||!ctx) return;
    const now=ctx.currentTime;
    waveGain.gain.cancelScheduledValues(now);
    waveGain.gain.setValueAtTime(waveGain.gain.value, now);
    const bed=waveLevel()*0.28;
    if(on){
      waveGain.gain.linearRampToValueAtTime(waveLevel(), now+0.42);
      if(filter){
        filter.frequency.cancelScheduledValues(now);
        filter.frequency.setValueAtTime(filter.frequency.value, now);
        if(kind==="in") filter.frequency.linearRampToValueAtTime(640, now+0.5);
        else filter.frequency.linearRampToValueAtTime(260, now+0.55);
      }
    } else {
      waveGain.gain.linearRampToValueAtTime(running?bed:0.0001, now+0.32);
    }
  }catch(e){}
}

function runStep(){
  if(!running) return;
  const p=PRACTICES[cur], st=p.steps[step%p.steps.length];
  $("phase").textContent=st.p; $("hint").textContent=st.h; $("count").textContent=st.s;
  setOrb(st.k, st.s);
  if(st.k==="in" || st.k==="out") wave(true, st.k);
  else wave(false);
  let left=st.s; clearInterval(tick);
  tick=setInterval(()=>{
    left-=1; $("count").textContent=left>0?left:"";
    if(left<=0){ clearInterval(tick); step+=1; runStep(); }
  },1000);
}
function start(){ running=true; step=0; $("start").textContent="Pause"; armAudio(); setTone(true); runStep(); }
function stop(){
  running=false; clearInterval(tick); $("start").textContent="Start";
  $("phase").textContent="Ready"; $("count").textContent="";
  $("hint").textContent=PRACTICES[cur].about; setOrb("ready"); wave(false); setTone(false);
}
function renderList(){
  $("items").innerHTML=PRACTICES.map((p,i)=>
    `<button class="item${i===cur?' on':''}" data-i="${i}"><b>${p.n}</b><span>${p.about}</span></button>`
  ).join("");
  $("items").querySelectorAll(".item").forEach(btn=>{
    btn.onclick=()=>{ stop(); load(+btn.dataset.i); show("studio"); };
  });
}

$("begin").onclick=function(){ armAudio(); setTone(true); wave(true,"in"); renderList(); show("list"); };
$("back").onclick=function(){ stop(); renderList(); show("list"); };
$("openList").onclick=function(){ stop(); renderList(); show("list"); };
$("listBack").onclick=function(){ stop(); show("home"); };
$("start").onclick=function(){ if(ctx&&ctx.state==="suspended") ctx.resume(); running?stop():start(); };
$("themeList").onclick=()=>setTheme(document.body.getAttribute("data-theme")==="day"?"night":"day");
$("stop").onclick=stop;
$("themeHome").onclick=()=>setTheme(document.body.getAttribute("data-theme")==="day"?"night":"day");
$("themeStudio").onclick=()=>setTheme(document.body.getAttribute("data-theme")==="day"?"night":"day");

try{vol = Number(localStorage.getItem("omni-vol")||10); if(vol<10) vol=10;}catch(e){vol=10;}
$("vol").value = vol; $("volRead").textContent = vol;
$("vol").oninput = ()=>{
  vol = Number($("vol").value);
  $("volRead").textContent = vol;
  try{localStorage.setItem("omni-vol", vol);}catch(e){}
  if(!running||!ctx) return;
  const st=PRACTICES[cur].steps[step%PRACTICES[cur].steps.length];
  if(waveGain) waveGain.gain.setTargetAtTime(st.k==="hold"?waveLevel()*0.28:waveLevel(), ctx.currentTime, .08);
  if(toneGain) setTone(true);
};
renderList(); load(0);
</script>
</body>
</html>
