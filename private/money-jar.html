<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money Jar">
<title>Money Jar</title>
<style>
:root{--bg:#000;--card:#0e1015;--card2:#161a22;--line:#262b36;--gold:#f7c948;--gold2:#ff9f1c;--text:#f6f1e4;--muted:#9b968a;--spend:#5ec8ff;--save:#7be08f;--give:#ff8fb8;--danger:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:var(--text);font-family:'Trebuchet MS',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);background:#0a0c10;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{display:block;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
#app{max-width:640px;margin:0 auto;padding:16px 16px 80px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 8px;margin-bottom:16px}
.logo{max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:26px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ffe9a3,#f7c948 45%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.toprow{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
.ibtn{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:18px;display:flex;align-items:center;justify-content:center}
.pbtn{height:36px;padding:0 12px;border-radius:999px;background:var(--card2);border:1px solid var(--gold);font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap}
.pbtn.on{background:linear-gradient(135deg,#f7c948,#ff9f1c);color:#1a1200;border-color:transparent}
.hero{border-radius:20px;overflow:hidden;margin-bottom:14px;border:1px solid var(--line);background:#000;box-shadow:0 0 28px rgba(247,201,72,.12)}.hero{position:relative}.hero video{display:block;width:100%;height:auto}
.herosnd{position:absolute;right:10px;bottom:10px;padding:8px 13px;border-radius:999px;background:rgba(0,0,0,.62);border:1px solid rgba(247,201,72,.6);color:#ffe9a3;font-size:13px;font-weight:700;backdrop-filter:blur(4px)}
.famtotal{text-align:center;margin-bottom:12px}.famtotal span{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.famtotal b{font-size:34px;font-weight:900}
.shelfwrap{overflow-x:auto;padding:6px 0 4px}
.jarrow{display:grid;gap:6px;align-items:end}
.fjar{position:relative;padding:0 4px;display:block}.fjar svg.jar{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
.fjar.sparkling{animation:glowloop 1.1s ease-in-out 2}
.board{height:16px;border-radius:8px;margin:-4px 0 8px;background:linear-gradient(180deg,#9a6a22,#5a3a0e);box-shadow:0 8px 18px rgba(247,201,72,.16),inset 0 2px 0 rgba(255,220,150,.35)}
.flab{text-align:center;padding:4px 2px;display:block}.fnm{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.famt{font-size:18px;font-weight:800}.fgoal{font-size:11px;color:var(--muted)}.mile{margin-top:4px;font-size:12px;font-weight:800;color:#ffe08a}
.spark{position:absolute;pointer-events:none;z-index:3;font-style:normal;line-height:1}
.tip{background:rgba(247,201,72,.08);border:1px solid rgba(247,201,72,.35);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.5}
.ibtn.on{background:linear-gradient(135deg,#f7c948,#ff9f1c);color:#1a1200;border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:15px}
.btn.gold{background:linear-gradient(135deg,#ffe08a,#f7c948 50%,#ff9f1c);color:#1a1200;border:none;box-shadow:0 4px 18px rgba(247,201,72,.25)}
.btn.danger{color:var(--danger);border-color:rgba(255,107,107,.4)}
.btn.small{padding:8px 14px;font-size:13px}
.btn.block{display:flex;width:100%}
.btn:active{transform:scale(.97)}
h2{font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:14px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h3{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:700}
.gold-text{background:linear-gradient(90deg,#ffe9a3,#f7c948 50%,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent}
/* home */
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kidcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 10px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.kidcard svg.jar{width:92px;height:auto}
.kidcard .nm{font-weight:800;font-size:18px}
.kidcard .amt{font-size:20px;font-weight:800}
.kidcard .meta{font-size:12px;color:var(--muted)}
.addcard{border:2px dashed var(--line);border-radius:22px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-weight:700}
.alert{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.4);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.empty{text-align:center;padding:20px 6px}
.empty svg.jar{width:170px;margin:6px auto 14px;display:block;filter:drop-shadow(0 0 24px rgba(247,201,72,.25))}
.empty h2{margin-bottom:8px}
.empty .btn{margin-top:18px}
/* kid */
.khead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.khead .av{font-size:34px}
.khead .nm{font-size:26px;font-weight:800;flex:1}
.jarbox{display:flex;flex-direction:column;align-items:center;margin:4px 0 14px}
#jarwrap{position:relative;width:min(240px,62vw);transition:filter .4s}
#jarwrap svg.jar{width:100%;height:auto;display:block}
#jarwrap.glow{filter:drop-shadow(0 0 26px rgba(247,201,72,.75))}
#jarwrap.reached{animation:glowloop 2.2s ease-in-out infinite}
@keyframes glowloop{0%,100%{filter:drop-shadow(0 0 8px rgba(247,201,72,.3))}50%{filter:drop-shadow(0 0 30px rgba(247,201,72,.85))}}
.fallcoin{position:absolute;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f7c948 45%,#c98a00);border:1.5px solid #a8740a;box-shadow:0 0 6px rgba(247,201,72,.6);pointer-events:none;z-index:3}
.total{font-size:44px;font-weight:900;margin-top:8px;line-height:1}
.fillnote{font-size:12px;color:var(--muted);margin-top:4px}
.streak{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:999px;background:rgba(255,159,28,.14);border:1px solid rgba(255,159,28,.4);font-size:13px;font-weight:700;color:#ffc46b}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.tile .ic{font-size:22px}
.tile .tn{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tile .ta{font-size:19px;font-weight:800;margin-top:2px}
.tile .tp{font-size:11px;color:var(--muted)}
.tile.spend{border-bottom:3px solid var(--spend)}.tile.spend .ta{color:var(--spend)}
.tile.save{border-bottom:3px solid var(--save)}.tile.save .ta{color:var(--save)}
.tile.give{border-bottom:3px solid var(--give)}.tile.give .ta{color:var(--give)}
.bar{height:16px;background:#0a0c10;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7be08f,#f7c948);border-radius:999px;transition:width .8s}
.goalname{font-size:18px;font-weight:800}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.tab.on{color:#1a1200;background:linear-gradient(135deg,#ffe08a,#f7c948);border-color:transparent}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.row .ri{font-size:22px;width:30px;text-align:center}
.row .rt{flex:1;min-width:0}
.row .rt b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.row .rt span{font-size:12px;color:var(--muted)}
.row .ra{font-weight:800;font-size:16px}
.row .ra.plus{color:var(--save)}.row .ra.minus{color:var(--give)}
.row.urgent{border-color:rgba(255,107,107,.6);animation:urg 1.6s ease-in-out infinite}
.row.urgent .rt span{color:var(--danger)}
@keyframes urg{50%{box-shadow:0 0 14px rgba(255,107,107,.35)}}
.row.expired{opacity:.5}
.donebtn{padding:10px 16px;border-radius:999px;background:linear-gradient(135deg,#ffe08a,#f7c948 50%,#ff9f1c);color:#1a1200;font-weight:800;font-size:14px}
.x{color:var(--muted);font-size:18px;padding:6px}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none}
#modal.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.72)}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#0d0f14;border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.sheet h2{margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;background:var(--card2);border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chip.sel{border-color:var(--gold);background:rgba(247,201,72,.14)}
.chip.av{font-size:24px;padding:6px 10px}
.chip.col{width:38px;height:38px;padding:0;border-radius:50%;border-width:3px}
.chip.col.sel{border-color:#fff}
.actions{display:flex;gap:10px;margin-top:20px}
.actions .btn{flex:1}
.err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}
input[type=range]{padding:0;height:34px;border:none;background:none;accent-color:#f7c948}
.slrow{display:flex;justify-content:space-between;font-size:14px;margin-top:10px}
.splitbar{display:flex;height:22px;border-radius:999px;overflow:hidden;margin:8px 0}
.splitbar i{display:block;height:100%}
.sumcard h3{color:var(--gold)}
.sumgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0 12px}
.sumgrid b{display:block;font-size:17px}.sumgrid span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
/* celebrate */
.celebrate{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;overflow:hidden}
.cel-box{text-align:center;padding:28px 24px;max-width:340px;position:relative;z-index:2}
.cel-box .cel-emoji{font-size:64px;animation:bounce 1s infinite}
.cel-box h2{font-size:30px;margin:10px 0 6px;background:linear-gradient(90deg,#ffe9a3,#f7c948,#ff9f1c);-webkit-background-clip:text;background-clip:text;color:transparent}
.cel-box p{color:var(--text);margin-bottom:20px;line-height:1.5}
@keyframes bounce{50%{transform:translateY(-12px) scale(1.08)}}
.conf{position:absolute;left:50%;top:38%;pointer-events:none;z-index:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b1f28;border:1px solid var(--line);padding:11px 18px;border-radius:999px;font-weight:700;z-index:90;font-size:14px}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:16px;text-align:center}
@media (min-width:520px){.tile .ta{font-size:22px}}
</style>
</head>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=c=>'$'+(c/100).toFixed(2);
const toCents=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100):0};
const DAY=864e5;
const AVATARS=['🦊','🐼','🦄','🐸','🐯','🐙','🦋','🐶','🐱','🐢','🦁','🐰'];
const COLORS=['#f7c948','#5ec8ff','#7be08f','#ff8fb8','#b794f6','#ff9f5a'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const CAUSES=[['🐾','Animal shelter'],['🍎','Food bank'],['🌳','Plant trees'],['🏥',"Children's hospital"],['🐨','Wildlife rescue'],['🌊','Clean oceans'],['📚','Books for kids'],['💛','Help a neighbour']];
const TIERS=[20,50,100,200,500,1000,2000,5000];
const MILES=[1000,2500,5000,10000,25000,50000,100000];
const ICON={job:'✅',allowance:'📅',deposit:'🪙',interest:'✨',spend:'🛍️',give:'💝',buy:'🎁',expired:'⌛',gift:'🎀'};

/* ---------- state ---------- */
const KEY='money-jar-v1';
function defaults(){return{kids:[],jobs:[],settings:{split:{spend:30,save:50,give:20},allowanceDay:6,interest:1,sound:true,pin:'',lastCheck:''}}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);const d=defaults();o.settings=Object.assign(d.settings,o.settings||{});o.kids=o.kids||[];o.jobs=o.jobs||[];o.kids.forEach(k=>{if(k.mileFam==null){const t=k.jars.spend+k.jars.save+k.jars.give;k.mileFam=MILES.filter(m=>m<=t).length}});return o}}catch(e){}return defaults()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let ui={screen:'home',kidId:null,tab:'jobs',parent:false,month:ymOf(new Date())};
let jarShown=null;
let draft={};
let pending=null;
function ymOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
const kidById=id=>S.kids.find(k=>k.id===id);
const totalOf=k=>k.jars.spend+k.jars.save+k.jars.give;

/* ---------- money logic ---------- */
function splitAmt(a){const p=S.settings.split;const give=Math.round(a*p.give/100),spend=Math.round(a*p.spend/100);return{spend,give,save:a-give-spend}}
function deposit(k,a,label,type,t){const sp=splitAmt(a);k.jars.spend+=sp.spend;k.jars.save+=sp.save;k.jars.give+=sp.give;k.history.push({id:uid(),t:t||Date.now(),type,label,amount:a,split:sp})}
function withdraw(k,jar,a,label,type){if(a<=0||a>k.jars[jar])return false;k.jars[jar]-=a;k.history.push({id:uid(),t:Date.now(),type,label,amount:a,jar});return true}
function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function runAllowances(){
  const now=new Date();now.setHours(0,0,0,0);
  const lc=S.settings.lastCheck;
  if(!lc){S.settings.lastCheck=dkey(now);save();return}
  const [y,m,d]=lc.split('-').map(Number);
  let cur=new Date(y,m-1,d);let n=0;
  while(cur<now&&n<60){cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+1);n++;
    if(cur.getDay()===S.settings.allowanceDay){S.kids.forEach(k=>{if(k.allowance>0)deposit(k,k.allowance,'Weekly allowance','allowance',cur.getTime()+43200000)})}}
  S.settings.lastCheck=dkey(now);save();
}
function runInterest(){
  const r=S.settings.interest/100;const now=Date.now();
  S.kids.forEach(k=>{
    if(!k.lastInterest)k.lastInterest=now;
    let w=Math.min(52,Math.floor((now-k.lastInterest)/(7*DAY)));
    if(w>0){if(r>0){for(let i=0;i<w;i++){const a=Math.round(k.jars.save*r);if(a>0){k.jars.save+=a;k.history.push({id:uid(),t:k.lastInterest+(i+1)*7*DAY,type:'interest',label:'Weekly savings bonus',amount:a})}}}
      k.lastInterest+=Math.floor((now-k.lastInterest)/(7*DAY))*7*DAY}
  });save();
}
function runExpiry(){
  const now=Date.now();let ch=false;
  S.jobs=S.jobs.filter(j=>{if(j.due&&j.due<now){const k=kidById(j.kidId);if(k)k.history.push({id:uid(),t:j.due,type:'expired',label:j.title,amount:j.amount});ch=true;return false}return true});
  if(ch)save();return ch;
}
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function weekStreak(k){
  const set=new Set(k.history.filter(h=>h.type==='job').map(h=>weekStart(h.t)));
  let cur=new Date(weekStart(Date.now()));
  if(!set.has(cur.getTime()))cur.setDate(cur.getDate()-7);
  let n=0;while(set.has(cur.getTime())){n++;cur.setDate(cur.getDate()-7)}return n;
}
function mileIdx(t){return MILES.filter(m=>m<=t).length}
const mileTxt=c=>'$'+(c/100);
function capFor(total){const t=TIERS.find(x=>total<x*100);return(t||TIERS[TIERS.length-1])*100}
function leftTxt(due){const ms=due-Date.now();if(ms<=0)return'Expired';const m=Math.floor(ms/6e4);if(m<60)return m+' min left';const h=Math.floor(m/60);if(h<24)return h+'h left';const d=Math.round(h/24);return d+' day'+(d>1?'s':'')+' left'}
const dateTxt=t=>new Date(t).toLocaleDateString('en-AU',{day:'numeric',month:'short'});

/* ---------- jar drawing ---------- */
const JAR='M60 44 L160 44 L160 58 Q200 68 200 102 L200 262 Q200 288 174 288 L46 288 Q20 288 20 262 L20 102 Q20 68 60 58 Z';
let SL=null,jid=0;
function slots(){if(SL)return SL;SL=[];for(let row=0;row<12;row++){const per=row%2?6:7,x0=row%2?44.5:32;for(let c=0;c<per;c++){const k=SL.length;SL.push({x:x0+c*25+Math.sin(k*12.9)*1.4,y:274-row*17+Math.cos(k*7.7)*1.2,r:Math.round(Math.sin(k*3.1)*25)})}}return SL}
function coinCount(total){if(total<=0)return 0;const f=Math.min(1,total/capFor(total));return Math.max(2,Math.round(f*slots().length))}
function jarSVG(total,color){
  const id='jc'+(++jid),sl=slots(),n=coinCount(total);let coins='';
  for(let i=0;i<n;i++){const s=sl[i];coins+='<g transform="translate('+s.x.toFixed(1)+','+s.y.toFixed(1)+') rotate('+s.r+')"><use href="#coin"/></g>'}
  return '<svg class="jar" viewBox="0 0 220 300" aria-hidden="true"><defs><clipPath id="'+id+'"><path d="'+JAR+'"/></clipPath></defs>'+
  '<path d="'+JAR+'" fill="rgba(255,255,255,.05)"/><g clip-path="url(#'+id+')">'+coins+'</g>'+
  '<path d="'+JAR+'" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="3"/>'+

/* ---------- sound ---------- */
let AC=null,OUT=null;
function ac(){if(!S.settings.sound)return null;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=12;comp.ratio.value=6;comp.attack.value=.002;comp.release.value=.15;const mg=AC.createGain();mg.gain.value=1.6;mg.connect(comp);comp.connect(AC.destination);OUT=mg}if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,dur,type,vol){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(OUT||a.destination);o.start(t);o.stop(t+dur+.03)}
function clink(){const b=2200+Math.random()*800;tone(b,0,.28,'triangle',.7);tone(b*1.51,.012,.2,'sine',.4);tone(b*2.2,.02,.12,'sine',.22);tone(b*.5,0,.12,'square',.12)}
function fanfare(){[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,i*.11,.55,'triangle',.5))}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- animation ---------- */
function playDeposit(k,oldTotal,amount){
  const wrap=$('jarwrap');
  if(!wrap||ui.screen!=='kid'||ui.kidId!==k.id){jarShown=null;return}
  const color=k.color,newTotal=totalOf(k);
  const count=Math.max(1,Math.min(8,Math.ceil(amount/200)));
  const h=wrap.clientHeight,w=wrap.clientWidth;
  const sl=slots(),oldN=coinCount(oldTotal);
  const landY=oldN>0?(sl[Math.min(oldN,sl.length)-1].y-14):276;
  ac();
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const c=document.createElement('div');c.className='fallcoin';
      const x=w/2-12+(Math.random()-.5)*w*.34;c.style.left=x+'px';c.style.top='0px';wrap.appendChild(c);
      const dy=(landY/300)*h-8;
      const a=c.animate([{transform:'translateY(-6px) rotate(0deg)'},{transform:'translateY('+dy+'px) rotate('+(240+Math.random()*200)+'deg)'}],{duration:520,easing:'cubic-bezier(.45,0,.9,.55)',fill:'forwards'});
      a.onfinish=()=>{c.remove();clink();if(i===count-1)finish()};
    },i*170);
  }
  function finish(){
    jarShown=null;const w2=$('jarwrap');if(!w2)return;
    const s=w2.querySelector('svg.jar');if(s)s.outerHTML=jarSVG(newTotal,color);
    w2.classList.add('glow');setTimeout(()=>w2.classList.remove('glow'),700);
    const tt=$('totalTxt');if(tt)tt.textContent=fmt(newTotal);
    if(mileIdx(newTotal)>mileIdx(oldTotal))toast('✨ '+k.name+"'s jar passed "+mileTxt(MILES[mileIdx(newTotal)-1])+'!');
    checkGoal(k);
  }
}
function checkGoal(k){
  if(k.goal&&!k.goal.reached&&k.jars.save>=k.goal.price){
    k.goal.reached=true;save();
    setTimeout(()=>{celebrate('Goal reached!',k.name+', you saved enough for '+k.goal.name+'! Ask a grown-up to help you get it.');if(ui.screen==='kid')render()},350);
  }
}

function summarize(k,ym){
  const [y,m]=ym.split('-').map(Number),a=new Date(y,m-1,1).getTime(),b=new Date(y,m,1).getTime();
  const r={earned:0,saved:0,spent:0,given:0,jobs:[]};
  k.history.forEach(x=>{if(x.t<a||x.t>=b)return;
    if(x.type==='deposit'||x.type==='job'||x.type==='allowance'||x.type==='gift'){r.earned+=x.amount;r.saved+=x.split?x.split.save:0;if(x.type==='job')r.jobs.push(x)}
    else if(x.type==='interest')r.saved+=x.amount;
    else if(x.type==='spend'||x.type==='buy')r.spent+=x.amount;
    else if(x.type==='give')r.given+=x.amount});
  r.jobs.sort((p,q)=>p.t-q.t);return r;
}

  pending=fn;modal('<h2>Parent PIN</h2><p class="sub">Enter your PIN to continue.</p><input id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" style="margin-top:14px;text-align:center;font-size:24px;letter-spacing:8px"><div class="err" id="pinErr"></div><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn gold" data-act="pinCheck">Unlock</button></div>');
  setTimeout(()=>{const i=$('pinIn');if(i)i.focus()},60);
}
function kidDlg(k){
  draft={avatar:k?k.avatar:AVATARS[0],color:k?k.color:COLORS[0],id:k?k.id:null};
  modal('<h2>'+(k?'Edit child':'Add a child')+'</h2><label>Name</label><input id="f_name" maxlength="20" value="'+esc(k?k.name:'')+'" autocomplete="off">'+
  '<label>Pick a character</label><div class="chips" id="avs">'+AVATARS.map(a=>'<button class="chip av'+(a===draft.avatar?' sel':'')+'" data-act="pickAvatar" data-v="'+a+'">'+a+'</button>').join('')+'</div>'+
  '<label>Jar lid colour</label><div class="chips" id="cols">'+COLORS.map(c=>'<button class="chip col'+(c===draft.color?' sel':'')+'" style="background:'+c+'" data-act="pickColor" data-v="'+c+'" aria-label="Colour"></button>').join('')+'</div>'+
  '<label>Weekly allowance ($)</label><input id="f_allow" inputmode="decimal" placeholder="0.00" value="'+(k&&k.allowance?(k.allowance/100).toFixed(2):'')+'">'+
  '<div class="err" id="err"></div><div class="actions">'+(k?'<button class="btn danger" data-act="delKid" data-id="'+k.id+'">Delete</button>':'<button class="btn" data-act="close">Cancel</button>')+'<button class="btn gold" data-act="saveKid">Save</button></div>');
}
function depositDlg(type){
  const k=kidById(ui.kidId),P={allowance:['Weekly allowance',k.allowance||500],chore:['Chore',200],bonus:['Bonus',500],custom:['',0]}[type];
  draft={type};
  modal('<h2>Add money for '+esc(k.name)+'</h2><p class="sub">It will be shared between spend, save and give automatically.</p><label>What for?</label><input id="f_label" maxlength="40" value="'+esc(P[0])+'" placeholder="e.g. Helped with dinner"><label>Amount ($)</label><input id="f_amt" inputmode="decimal" placeholder="0.00" value="'+(P[1]?(P[1]/100).toFixed(2):'')+'"><div class="err" id="err"></div><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn gold" data-act="doDeposit">Drop it in 🪙</button></div>');
}
function jobDlg(){
  modal('<h2>Add a job</h2><label>Job</label><input id="f_title" maxlength="40" placeholder="e.g. Feed the dog"><label>Reward ($)</label><input id="f_amt" inputmode="decimal" placeholder="2.00"><label>Do it by</label><select id="f_due"><option value="0">Tonight</option><option value="1">Tomorrow night</option><option value="3">In 3 days</option><option value="7">In a week</option><option value="none">No deadline</option></select><p class="sub" style="margin-top:8px">If the deadline passes, the job disappears.</p><div class="err" id="err"></div><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn gold" data-act="saveJob">Add job</button></div>');
}
function goalDlg(){
  const k=kidById(ui.kidId);
  modal('<h2>My savings goal</h2><label>What do you want?</label><input id="f_name" maxlength="30" placeholder="e.g. Lego set" value="'+esc(k.goal?k.goal.name:'')+'"><label>How much does it cost? ($)</label><input id="f_amt" inputmode="decimal" placeholder="0.00" value="'+(k.goal?(k.goal.price/100).toFixed(2):'')+'"><div class="err" id="err"></div><div class="actions">'+(k.goal?'<button class="btn danger" data-act="clearGoal">Remove</button>':'<button class="btn" data-act="close">Cancel</button>')+'<button class="btn gold" data-act="saveGoal">Save goal</button></div>');
}
function takeDlg(jar){
  const k=kidById(ui.kidId),isGive=jar==='give';draft={jar,cause:''};
  let h='<h2>'+(isGive?'💝 Give':'🛍️ Spend')+' jar</h2><p class="sub" style="margin:4px 0 10px">'+esc(k.name)+' has <b style="color:var(--'+(isGive?'give':'spend')+')">'+fmt(k.jars[jar])+'</b> here.</p>';
  if(isGive)h+='<label>Ideas for giving</label><div class="chips">'+CAUSES.map(c=>'<button class="chip" data-act="pickCause" data-v="'+esc(c[1])+'">'+c[0]+' '+esc(c[1])+'</button>').join('')+'</div>';
  if(ui.parent)h+='<label>'+(isGive?'Who or what is it going to?':'What was it spent on?')+'</label><input id="f_label" maxlength="40" placeholder="'+(isGive?'e.g. Animal shelter':'e.g. Ice cream')+'"><label>Amount ($)</label><input id="f_amt" inputmode="decimal" placeholder="0.00"><div class="err" id="err"></div><div class="actions"><button class="btn" data-act="close">Close</button><button class="btn gold" data-act="doTake">Record it</button></div>';
  else h+='<p class="sub" style="margin-top:14px">'+(isGive?'When you are ready to give, ask a grown-up to help you.':'When you want to spend some, ask a grown-up.')+'</p><div class="actions"><button class="btn gold" data-act="close">Got it</button></div>';
  modal(h);
}
function pinDlg(){
  modal('<h2>Set a parent PIN</h2><p class="sub">4 digits. Kids will need it to open parent mode.</p><input id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" style="margin-top:14px;text-align:center;font-size:24px;letter-spacing:8px"><div class="err" id="pinErr"></div><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn gold" data-act="pinSave">Save PIN</button></div>');
}
/* ---------- family gifts ---------- */
const OCC=['🎂 Birthday','🎄 Christmas','🐣 Easter','🎓 Special day','💛 Just because'];
function b64e(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';return JSON.parse(decodeURIComponent(escape(atob(t))))}
function appURL(){return location.origin+location.pathname}
function shareText(text){
  if(navigator.share){navigator.share({text}).catch(()=>{});return}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('Copied – now paste it into a message'),()=>showText(text));return}
  showText(text);
}
function showText(text){modal('<h2>Copy this message</h2><textarea id="f_txt" rows="6" readonly style="margin-top:10px">'+esc(text)+'</textarea><div class="actions"><button class="btn gold" data-act="close">Done</button></div>');setTimeout(()=>{const t=$('f_txt');if(t){t.focus();t.select()}},60)}
function giftMenu(){
  modal('<h2>🎁 Family &amp; friends gifts</h2><p class="sub" style="margin:6px 0 14px">Did Nana, a relative or a friend send a gift? Add it to the jar, then send them a thank-you picture of the full jar.</p>'+
  '<button class="btn gold block" data-act="giftParent" style="margin-bottom:10px">🎀 Add a gift to a jar</button>'+
  '<button class="btn block" data-act="importDlg" style="margin-bottom:10px">📥 Paste a gift note I was sent</button>'+
  '<button class="btn block" data-act="giftNoteDlg">💌 Relative with the app link? Write a gift note</button>'+
  '<div class="actions"><button class="btn" data-act="close">Close</button></div>');
}
function occChips(sel){return '<div class="chips" id="occs">'+OCC.map(o=>'<button class="chip'+(o===sel?' sel':'')+'" data-act="pickOcc" data-v="'+o+'">'+o+'</button>').join('')+'</div>'}
function giftNoteDlg(){
  draft={occ:OCC[0]};
  modal('<h2>💌 Write a gift note</h2><p class="sub" style="margin:6px 0">Send the money to the parents as you normally would. This note just lets them add it to the jar.</p>'+
  '<label>Your name (e.g. Nana)</label><input id="f_who" maxlength="20" autocomplete="off"><label>Who is it for?</label><input id="f_kid" maxlength="20" autocomplete="off" placeholder="Child\'s name">'+
  '<label>What for?</label>'+occChips(draft.occ)+'<label>Amount ($)</label><input id="f_amt" inputmode="decimal" placeholder="0.00"><label>A little message (optional)</label><input id="f_msg" maxlength="80" placeholder="Love you lots!">'+
  '<div class="err" id="err"></div><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn gold" data-act="makeNote">Make gift note</button></div>');
}
function importDlg(){
  askParent(()=>{ui.parent=true;modal('<h2>📥 Add a gift note</h2><p class="sub" style="margin:6px 0">Paste the message you were sent. Money Jar finds the gift code inside it.</p><textarea id="f_code" rows="4" placeholder="Paste here"></textarea><div class="err" id="err"></div><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn gold" data-act="readNote">Read note</button></div>')});
}
function giftDlg(){
  if(!S.kids.length){modal('<h2>Add a child first</h2><p class="sub" style="margin:8px 0">Then you can add gifts to their jar.</p><div class="actions"><button class="btn gold" data-act="close">OK</button></div>');return}
  const cur=kidById(ui.kidId)||S.kids[0];draft={occ:OCC[0]};
  modal('<h2>🎀 Gift from family</h2><label>Whose jar?</label><select id="f_kidsel">'+S.kids.map(k=>'<option value="'+k.id+'"'+(k.id===cur.id?' selected':'')+'>'+k.avatar+' '+esc(k.name)+'</option>').join('')+'</select><label>Who is it from?</label><input id="f_who" maxlength="20" autocomplete="off" placeholder="e.g. Nana"><label>What for?</label>'+occChips(draft.occ)+
  '<label>Amount ($)</label><input id="f_amt" inputmode="decimal" placeholder="0.00"><label>Message (optional)</label><input id="f_msg" maxlength="80"><p class="sub" style="margin-top:8px">Add it once the money has arrived in the children\'s account.</p><div class="err" id="err"></div><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn gold" data-act="doGift">Add to jar</button></div>');
}
function addGift(k,who,occ,a,msg){
  const old=totalOf(k);
  deposit(k,a,occ.replace(/^\S+\s/,'')+' gift from '+who,'gift');
  const e=k.history[k.history.length-1];e.giver=who;e.occ=occ;e.msg=msg||'';
  ui.screen='kid';ui.kidId=k.id;ui.tab='history';closeModal();jarShown=old;after();playDeposit(k,old,a);
  setTimeout(()=>{modal('<h2>🎀 Gift added!</h2><p class="sub" style="margin:8px 0">Would you like to send '+esc(who)+' a picture of '+esc(k.name)+'\'s jar so they can see it?</p><div class="actions"><button class="btn" data-act="close">Not now</button><button class="btn gold" data-act="thankDlg" data-id="'+e.id+'">💌 Send thank-you jar</button></div>')},2600);
}
function thankMsg(k,e){
  const link=appURL()+'#thanks='+b64e({n:k.name,a:k.avatar,c:k.color,t:totalOf(k),w:e.giver,o:e.occ,v:e.amount,m:e.msg||''});
  return 'Thank you, '+e.giver+'! 💛 '+k.name+' has put your gift in their Money Jar. Tap to see it: '+link;
}
function thanksView(){
  const T=THANKS;
  return '<div class="empty" style="padding-top:30px"><p class="sub">A thank-you from '+esc(T.n)+'</p>'+jarSVG(T.t,T.c)+
  '<h2 class="gold-text" style="margin-top:10px">Thank you, '+esc(T.w)+'!</h2><p class="sub" style="margin:8px 0">Your '+esc(String(T.o||'').replace(/^\S+\s/,'').toLowerCase())+' gift of <b>'+fmt(T.v)+'</b> went into '+esc(T.n)+'\'s jar. 🪙</p>'+
  (T.m?'<div class="tip">“'+esc(T.m)+'”</div>':'')+
  '<button class="btn gold block" data-act="thanksClink" style="margin-top:6px">🪙 Hear the coins drop</button>'+
  '<button class="btn block" data-act="thanksMore" style="margin-top:10px">💌 Send another gift note</button></div><p class="note">Money Jar – a family pocket-money jar</p>';
}
function parseThanks(){try{const m=/[#&]thanks=([^&]+)/.exec(location.hash);if(!m)return null;const o=b64d(m[1]);if(!o||typeof o.t!=='number')return null;return o}catch(e){return null}}
const THANKS=parseThanks();

function setErr(m){const e=$('err');if(e)e.textContent=m}

/* ---------- actions ---------- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function after(){save();render()}
const ACT={
  giftMenu(){giftMenu()},
  giftNoteDlg(){giftNoteDlg()},
  importDlg(){importDlg()},
  giftDlg(){giftDlg()},
  giftParent(){askParent(()=>{ui.parent=true;closeModal();giftDlg()})},
  pickOcc(el){draft.occ=el.dataset.v;document.querySelectorAll('#occs .chip').forEach(c=>c.classList.toggle('sel',c===el))},
  makeNote(){
    const who=$('f_who').value.trim(),kid=$('f_kid').value.trim(),a=toCents($('f_amt').value),msg=$('f_msg').value.trim();
    if(!who){setErr('Please add your name.');return}if(!kid){setErr('Who is the gift for?');return}if(a<=0){setErr('Enter an amount.');return}
    const code='MJGIFT1:'+b64e({i:uid(),w:who,k:kid,o:draft.occ,a,m:msg});
    const text='🎁 Gift note for '+kid+' from '+who+': '+draft.occ.replace(/^\S+\s/,'')+' '+fmt(a)+'.\nParents: open Money Jar → Family & friends gifts → "I\'m a parent" → paste this message.\n'+code;
    shareText(text);
  },
  readNote(){
    const t=$('f_code').value,m=/MJGIFT1:([A-Za-z0-9_-]+)/.exec(t);
    if(!m){setErr('I could not find a gift code in that message.');return}
    let n;try{n=b64d(m[1]);if(!n||!n.i||!(n.a>0))throw 0}catch(e){setErr('That gift code looks incomplete – try pasting the whole message.');return}
    S.giftsSeen=S.giftsSeen||[];
    if(S.giftsSeen.includes(n.i)){setErr('That gift has already been added.');return}
    const guess=S.kids.find(k=>k.name.toLowerCase()===String(n.k).trim().toLowerCase())||S.kids[0];
    if(!guess){setErr('Add a child first.');return}
    draft={note:n};
    modal('<h2>🎁 From '+esc(n.w)+'</h2><p class="sub" style="margin:6px 0">'+esc(String(n.o).replace(/^\S+\s/,''))+' gift of <b>'+fmt(n.a)+'</b>'+(n.m?'<br>“'+esc(n.m)+'”':'')+'</p><label>Add to which jar?</label><select id="f_kidsel">'+S.kids.map(k=>'<option value="'+k.id+'"'+(k.id===guess.id?' selected':'')+'>'+k.avatar+' '+esc(k.name)+'</option>').join('')+'</select><p class="sub" style="margin-top:10px">Only add it once the money has arrived in the children\'s account.</p><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn gold" data-act="acceptNote">Add to jar</button></div>');
  },
  acceptNote(){
    const n=draft.note,k=kidById($('f_kidsel').value);if(!n||!k)return;
    S.giftsSeen=S.giftsSeen||[];S.giftsSeen.push(n.i);
    ui.screen='kid';ui.kidId=k.id;ui.tab='history';
    addGift(k,n.w,n.o,n.a,n.m);
  },
  doGift(){
    const k=kidById($('f_kidsel').value),who=$('f_who').value.trim(),a=toCents($('f_amt').value),msg=$('f_msg').value.trim();
    if(!who){setErr('Who is the gift from?');return}if(a<=0){setErr('Enter an amount.');return}
    addGift(k,who,draft.occ,a,msg);
  },
  thankDlg(el){
    const k=S.kids.find(x=>x.history.some(h=>h.id===el.dataset.id));if(!k)return;
    const e=k.history.find(h=>h.id===el.dataset.id);
    shareText(thankMsg(k,e));
  },
  thanksClink(){ac();clink();setTimeout(clink,140);setTimeout(clink,300)},
  thanksMore(){history.replaceState(null,'',location.pathname);location.reload()},
  close(){closeModal()},
  family(){ui.famNew={};S.kids.forEach(k=>{const idx=mileIdx(totalOf(k));if(idx>(k.mileFam||0))ui.famNew[k.id]=idx;k.mileFam=idx});save();ui.screen='family';render();window.scrollTo(0,0);familyFX()},
  heroSound(el){const v=$('heroVid');if(!v)return;v.muted=!v.muted;if(!v.muted){v.volume=1;const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{})}el.textContent=v.muted?'🔇 Tap for sound':'🔊 Sound on';el.setAttribute('aria-label',v.muted?'Turn video sound on':'Turn video sound off')},
  closeCel(el){const o=el.closest('.celebrate');if(o)o.remove()},
  home(){ui.screen='home';render();window.scrollTo(0,0)},
  openKid(el){ui={...ui,screen:'kid',kidId:el.dataset.id,tab:'jobs'};render();window.scrollTo(0,0)},
  sound(){S.settings.sound=!S.settings.sound;save();if(S.settings.sound){ac();clink()}render()},
  parent(){if(ui.parent){ui.parent=false;render();toast('Parent mode off')}else askParent(()=>{ui.parent=true;closeModal();render();toast('Parent mode on')})},
  settings(){ui.screen='settings';render()},
  summary(){ui.screen='summary';render()},
  tab(el){ui.tab=el.dataset.t;render()},
  addKid(){askParent(()=>{ui.parent=true;kidDlg(null)})},
  editKid(el){kidDlg(kidById(el.dataset.id))},
  pickAvatar(el){draft.avatar=el.dataset.v;document.querySelectorAll('#avs .chip').forEach(c=>c.classList.toggle('sel',c===el))},
  pickColor(el){draft.color=el.dataset.v;document.querySelectorAll('#cols .chip').forEach(c=>c.classList.toggle('sel',c===el))},
  saveKid(){
    const name=$('f_name').value.trim();if(!name){setErr('Please enter a name.');return}
    const allow=toCents($('f_allow').value);
    if(draft.id){const k=kidById(draft.id);k.name=name;k.avatar=draft.avatar;k.color=draft.color;k.allowance=allow}
    else{const nk={id:uid(),name,avatar:draft.avatar,color:draft.color,allowance:allow,jars:{spend:0,save:0,give:0},goal:null,history:[],lastInterest:Date.now(),mileFam:0};S.kids.push(nk);ui.screen='kid';ui.kidId=nk.id;ui.tab='jobs'}
    closeModal();after();window.scrollTo(0,0);
  },
  delKid(el){const k=kidById(el.dataset.id);confirmDlg('Delete '+k.name+' and all their money history? This cannot be undone.','Delete',()=>{S.kids=S.kids.filter(x=>x.id!==k.id);S.jobs=S.jobs.filter(j=>j.kidId!==k.id);ui.screen='home';closeModal();after()})},
  depositDlg(el){depositDlg(el.dataset.type)},
  doDeposit(){
    const k=kidById(ui.kidId),a=toCents($('f_amt').value),label=$('f_label').value.trim()||'Pocket money';
    if(a<=0){setErr('Enter an amount.');return}
    const old=totalOf(k);deposit(k,a,label,draft.type==='allowance'?'allowance':'deposit');
    closeModal();jarShown=old;after();playDeposit(k,old,a);
  },
  jobDlg(){jobDlg()},
  saveJob(){
    const title=$('f_title').value.trim(),a=toCents($('f_amt').value),dv=$('f_due').value;
    if(!title){setErr('Name the job.');return}if(a<=0){setErr('Enter a reward.');return}
    let due=null;if(dv!=='none'){const d=new Date();d.setHours(23,59,59,999);d.setDate(d.getDate()+Number(dv));due=d.getTime()}
    S.jobs.push({id:uid(),kidId:ui.kidId,title,amount:a,due,created:Date.now()});ui.tab='jobs';closeModal();after();
  },
  delJob(el){S.jobs=S.jobs.filter(j=>j.id!==el.dataset.id);after()},
  doneJob(el){
    const j=S.jobs.find(x=>x.id===el.dataset.id);if(!j)return;
    if(j.due&&j.due<Date.now()){runExpiry();render();return}
    const k=kidById(j.kidId),old=totalOf(k);S.jobs=S.jobs.filter(x=>x.id!==j.id);
    deposit(k,j.amount,j.title,'job');jarShown=old;after();playDeposit(k,old,j.amount);
  },
  goalDlg(){goalDlg()},
  saveGoal(){
    const k=kidById(ui.kidId),name=$('f_name').value.trim(),p=toCents($('f_amt').value);
    if(!name){setErr('What are you saving for?');return}if(p<=0){setErr('Enter the price.');return}
    k.goal={name,price:p,reached:false};closeModal();after();checkGoal(k);
  },
  clearGoal(){const k=kidById(ui.kidId);k.goal=null;closeModal();after()},
  buyGoal(){
    const k=kidById(ui.kidId);if(!k.goal)return;
    confirmDlg('Take '+fmt(k.goal.price)+' out of '+k.name+'\'s Save jar for '+k.goal.name+'?','Yes, bought it',()=>{
      if(withdraw(k,'save',k.goal.price,'Bought: '+k.goal.name,'buy')){k.goal=null;closeModal();after();toast('Enjoy it! 🎁')}else{closeModal()}});
  },
  spendDlg(){takeDlg('spend')},
  giveDlg(){takeDlg('give')},
  pickCause(el){const i=$('f_label');if(i)i.value=el.dataset.v;document.querySelectorAll('.sheet .chip').forEach(c=>c.classList.toggle('sel',c===el))},
  doTake(){
    const k=kidById(ui.kidId),a=toCents($('f_amt').value),label=$('f_label').value.trim();
    if(a<=0){setErr('Enter an amount.');return}
    if(a>k.jars[draft.jar]){setErr('That is more than is in the jar.');return}
    withdraw(k,draft.jar,a,label||(draft.jar==='give'?'Gift':'Spent'),draft.jar);closeModal();after();
  },
  saveInfo(){const r=S.settings.interest;modal('<h2>🌱 Save jar</h2><p class="sub" style="margin-top:8px;line-height:1.6">Money in here is for something big. Leave it alone and it grows'+(r>0?' – a little bonus ('+r+'%) is added every week.':'.')+' Set a savings goal and watch the bar fill up!</p><div class="actions"><button class="btn gold" data-act="close">Got it</button></div>')},
  confirmYes(){const f=pending;pending=null;if(f)f()},
  pinCheck(){const v=$('pinIn').value;if(v===S.settings.pin){const f=pending;pending=null;closeModal();ui.parent=true;if(f&&f!==ACT_NOOP)f();render()}else{$('pinErr').textContent='That PIN is not right.';$('pinIn').value=''}},
  pinDlg(){pinDlg()},
  pinSave(){const v=$('pinIn').value;if(!/^\d{4}$/.test(v)){$('pinErr').textContent='Use exactly 4 digits.';return}S.settings.pin=v;closeModal();after();toast('PIN saved')},
  clearPin(){S.settings.pin='';after()},
  exportData(){download('money-jar-backup-'+dkey(new Date())+'.json',JSON.stringify(S,null,1),'application/json')},
  importData(){$('importFile').click()},
  resetDlg(){confirmDlg('This erases every child, job and jar on this device.','Erase',()=>{S=defaults();ui={screen:'home',kidId:null,tab:'jobs',parent:false,month:ymOf(new Date())};closeModal();after()})},
  downloadSummary(){
    const names=['','January','February','March','April','May','June','July','August','September','October','November','December'];
    const [y,m]=ui.month.split('-').map(Number);
    let t='MONEY JAR – '+names[m]+' '+y+'\n\n';
    S.kids.forEach(k=>{const r=summarize(k,ui.month);t+=k.name.toUpperCase()+'\nEarned '+fmt(r.earned)+' · Saved '+fmt(r.saved)+' · Spent '+fmt(r.spent)+' · Given '+fmt(r.given)+'\nJobs completed: '+r.jobs.length+'\n'+r.jobs.map(x=>'  - '+x.label+' ('+dateTxt(x.t)+', '+fmt(x.amount)+')').join('\n')+'\n\n'});
    download('money-jar-'+ui.month+'.txt',t);
  }
};
const ACT_NOOP=function(){};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.split){
    const sp=S.settings.split;let v=Number(t.value);
    if(t.dataset.split==='spend'){v=Math.min(v,100-sp.give);sp.spend=v}else{v=Math.min(v,100-sp.spend);sp.give=v}
    t.value=v;sp.save=100-sp.spend-sp.give;
    $('vSpend').textContent=sp.spend+'%';$('vGive').textContent=sp.give+'%';$('vSave').textContent=sp.save+'%';
    const b=$('splitbar').children;b[0].style.width=sp.spend+'%';b[1].style.width=sp.save+'%';b[2].style.width=sp.give+'%';save();
  }else if(t.id==='interest'){const v=parseFloat(t.value);S.settings.interest=isFinite(v)?Math.max(0,Math.min(20,v)):0;save()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='allowDay'){S.settings.allowanceDay=Number(t.value);save()}
  else if(t.id==='sumMonth'){if(t.value){ui.month=t.value;render()}}
  else if(t.id==='importFile'){
    const f=t.files&&t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.kids))throw 0;const d=defaults();o.settings=Object.assign(d.settings,o.settings||{});o.jobs=o.jobs||[];S=o;save();ui.screen='home';render();toast('Backup restored')}catch(x){toast('That file could not be read')}t.value=''};
    r.readAsText(f);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('modal').classList.contains('open')){const b=document.querySelector('.sheet .btn.gold');if(b&&document.activeElement&&document.activeElement.tagName==='INPUT')b.click()}});

/* ---------- start ---------- */
if(THANKS){ui.screen='thanks';render()}else{runAllowances();runInterest();runExpiry();render()}
setInterval(()=>{if(!THANKS&&runExpiry()&&jarShown==null&&!$('modal').classList.contains('open'))render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!THANKS){runAllowances();runInterest();if(runExpiry()||true){if(jarShown==null&&!$('modal').classList.contains('open'))render()}}});
try{const man={name:'Money Jar',short_name:'Money Jar',start_url:'.',display:'standalone',background_color:'#000000',theme_color:'#000000',icons:[{src:'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#000"/><circle cx="50" cy="50" r="30" fill="#f7c948"/><text x="50" y="62" font-size="38" text-anchor="middle" fill="#8a5a00" font-family="Georgia" font-weight="bold">$</text></svg>'),sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(l)}catch(e){}
})();
</script>
</body>
