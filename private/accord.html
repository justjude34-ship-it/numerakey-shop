*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;line-height:1.55;min-height:100dvh}
body{background-image:radial-gradient(1200px 600px at 20% -10%, rgba(91,61,154,.28), transparent 55%), radial-gradient(900px 500px at 110% 10%, rgba(26,107,107,.22), transparent 50%);}
body{padding-bottom:calc(88px + var(--safe-b))}
button,textarea,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:430px;margin:0 auto;padding:0 18px 28px}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,10,22,.88);backdrop-filter:blur(14px);padding:12px 0 10px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px}
.wordmark{font-family:"Great Vibes",cursive;font-size:34px;font-weight:400;letter-spacing:.01em;color:var(--gold);line-height:1;text-shadow:0 1px 10px rgba(228,197,106,.35)}
.sub{color:var(--muted);font-size:12px}
h1{font-family:"Great Vibes",cursive;font-weight:400;font-size:48px;line-height:1.05;margin:4px 0 12px;color:var(--gold);text-shadow:0 2px 18px rgba(228,197,106,.28)}
h2{font-family:"Great Vibes",cursive;font-weight:400;font-size:36px;line-height:1.1;margin:0 0 10px;color:var(--gold2)}
h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:20px;line-height:1.2;margin:0 0 8px}
.lead{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-style:italic;color:#efe7d4;line-height:1.35;margin:0 0 14px}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:230px;margin:0 0 16px;background:var(--silk) center 38%/cover no-repeat;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,22,.08) 20%,rgba(11,10,22,.55) 100%);pointer-events:none}
.hero .hero-copy{position:relative;z-index:1;padding:96px 18px 18px}
.hero h1{margin:0;font-size:64px;color:#f3de9a;text-shadow:0 2px 16px rgba(0,0,0,.35),0 0 24px rgba(228,197,106,.35)}
.hero .subline{color:#f4efe6;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px}
p{margin:0 0 12px}
.muted{color:var(--muted);font-size:13px}
.tiny{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card.gold{border-color:#3d3420}
.card.teal{border-color:#1b3d38}
.card.violet{border-color:#32284a}
.card.rose{border-color:#3d2a28}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.gold{color:var(--gold)} .teal{color:var(--teal)} .violet{color:var(--violet)} .rose{color:var(--rose)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 14px;font-weight:500;text-align:center;margin:0 0 8px}
.btn-gold{background:linear-gradient(90deg,#e8c872,#f0a89a);color:#1a1408}
.btn-ink{background:#ece6d8;color:#1a1408}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-soft{background:var(--card2);border:1px solid var(--line);color:var(--ink);text-align:left}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rooms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.door{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 12px;min-height:92px;text-align:left}
.door b{display:block;font-family:"Great Vibes",cursive;font-size:28px;font-weight:400}
.door span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.door.on{outline:1px solid var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:7px 11px;font-size:13px}
.chip.on{background:#ece6d8;color:#1a1408;border-color:#ece6d8}
textarea{width:100%;min-height:88px;background:#0c0b10;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;margin:0 0 10px}
.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 12px;margin:0 -4px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 12px;font-size:13px}
.tab.on{background:#ece6d8;color:#1a1408;border-color:#ece6d8}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#100e1c;border-top:1px solid var(--line);z-index:40;padding-bottom:var(--safe-b)}
nav.bottom .inner{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom button{background:none;border:0;color:var(--muted);font-size:10px;padding:10px 2px 12px;letter-spacing:.02em}
nav.bottom button.on{color:var(--gold)}
nav.bottom button em{display:block;font-style:normal;font-size:16px;margin-bottom:2px}
.fab{position:fixed;right:16px;bottom:calc(78px + var(--safe-b));z-index:35;border:0;border-radius:999px;padding:12px 16px;background:linear-gradient(90deg,#e8c872,#f0a89a);color:#1a1408;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.overlay{position:fixed;inset:0;background:rgba(11,10,22,.94);z-index:80;display:none;align-items:center;justify-content:center;padding:24px}
.overlay.show{display:flex}
.overlay .panel{width:min(100%,400px)}
.breath{width:120px;height:120px;border-radius:50%;margin:18px auto;border:2px solid var(--gold);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.86);opacity:.55}50%{transform:scale(1);opacity:1}}
.lesson{display:none}
.lesson.on{display:block}
.list button{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px}
.list button small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.saved{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.saved .item{background:var(--card2);border-radius:12px;padding:10px 12px;margin:0 0 8px;font-size:14px}
.saved .item time{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
hr.quiet{border:0;border-top:1px solid var(--line);margin:16px 0}
.progress{height:6px;background:#1c1824;border-radius:99px;overflow:hidden;margin:8px 0 14px}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,#e8c872,#f0a89a);width:0}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 14px}
.daygrid button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--muted)}
.daygrid button.done{background:#ece6d8;color:#1a1408;border-color:#ece6d8}
.daygrid button.today{outline:1px solid var(--gold)}
.cardline{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-style:italic;line-height:1.3;margin:8px 0 14px}
.hide{display:none !important}
.ok{color:var(--teal);font-size:13px}
</style>
</head>
<body>
<button class="fab" id="fabSting" type="button">I slipped</button>

<div class="overlay" id="sting" aria-hidden="true">
  <div class="panel">
    <p class="kicker gold">Twenty seconds</p>
    <h2>Name it. Breathe. Choose a room.</h2>
    <div class="breath" aria-hidden="true"></div>
    <p class="muted" id="stingCount">A slip is not a verdict.</p>
    <div class="chips" id="stingChips"></div>
    <div class="row">
      <button class="btn btn-ghost" id="stingSkip" type="button">I’m back</button>
      <button class="btn btn-gold" id="stingGo" type="button">Open that room</button>
    </div>
  </div>
</div>

<div class="wrap">

<script>
const KEY = "accord-v1";
const ROOMS = [
  {id:"word", name:"Word", hue:"gold", promise:"Speak so you do not betray yourself.", door:"The sentence you live in."},
  {id:"mine", name:"Not mine", hue:"teal", promise:"Their weather is not your name.", door:"Put the story back."},
  {id:"ask", name:"Ask", hue:"violet", promise:"A question is braver than a story.", door:"Do not furnish the blank."},
  {id:"best", name:"Best", hue:"rose", promise:"Today’s best is allowed to be small.", door:"Enough is a complete word."}
];

const LESSONS = [
  {id:"old", title:"Old agreements", kicker:"The house you inherited", body:[
    "An agreement is a promise you live as if it were true. Most of the ones running your day were never chosen. They were trained in — reward, punishment, the look on someone’s face when you were small.",

  ], insight:"You are not broken. You are well-trained. Training can be rewritten.", action:"Notice one old rule that still runs your morning. You do not have to replace it yet. See it."},
  {id:"judge", title:"Judge and victim", kicker:"Two chairs, one mind", body:[
    "There is a judge in the mind and a victim who believes the judge. Together they keep an old courtroom open after the original case is long over.",
    "The four rooms do not argue with them. Argument is their sport. The rooms give you another place to stand.",
    "When the judge starts a sentence, you do not have to finish it. That is already freedom."
  ], insight:"The judge is loud because it was once how you stayed safe. Loud is not the same as true.", action:"The next time the inner case begins, say: I am leaving the courtroom."},
  {id:"word", title:"Word", kicker:"Room one", body:[
    "Speech is a tool that builds worlds. The sentence you repeat to yourself becomes the room you sleep in.",
    "Clean speech means: say what you mean, keep the promises you can keep, and do not dress cruelty as honesty. Gossip is handing someone else a knife and calling it conversation.",
    "The first audience for your word is you. When the inner voice says you are a failure, that is also a misuse of the tool. Rewrite it until it is true and not cruel. Truth without care is still a weapon."
  ], insight:"A rewritten sentence is not vanity. It is how you stop feeding the old judge.", action:"Catch the last harsh line you said to yourself. Write a version you could live in."},
  {id:"mine", title:"Not mine", kicker:"Room two", body:[
    "People speak from their weather. A storm is not a verdict on the tree it hits.",
    "When you take a remark as proof of your worth, you sign a contract you never read. Their opinion is a snapshot of their dream that day — fear, hunger, an old wound, a need to be right.",
    "This room matters after years of being made responsible for another person’s moods. You can feel the sting and still put the story back. Compassion stays. Ownership of their dream does not.",
    "Not personal is not “nothing happened.” It is “their story is not my name.” Real harm still gets a boundary. The weather does not get your address."
  ], insight:"You may listen. You do not have to move in. Your peace is not rude.", action:"Think of the last comment that landed. Ask: whose dream is this?"},
  {id:"ask", title:"Ask", kicker:"Room three", body:[
    "The mind hates a blank and will paint one rather than wait. That painting is an assumption: they are angry, they don’t care, I already know how this ends.",
    "Assumptions feel like facts because they are vivid. They are still guesses. Most wars at home begin as an unread sentence.",
    "The way out is courage in small pieces — ask the question, say what you want, admit what you do not know. One clean question can end a war that three weeks of mind-reading could not.",
    "Asking is not interrogating. One question, asked without a trap, is enough."
  ], insight:"If you do not know, you do not know. That humility is a form of love.", action:"Write one assumption you are treating as fact. Write the question that would test it."},
  {id:"best", title:"Best", kicker:"Room four", body:[
    "Best is not a trophy and it is not yesterday. Ill best, foggy best, tired-and-the-orders-piled-up best — all count.",
    "This room is what makes the other three livable. If you break Word, Not mine, or Ask, you do not owe the judge a beating. You did what you could with the body and brain you had. Then you come back.",

  ], insight:"Enough is a complete word. You can put the scoreboard down.", action:"Name today’s capacity in one word. Name one thing that already counted."},
  {id:"hold", title:"How they hold each other", kicker:"One house", body:[
    "Word without Best becomes a whip. Not-mine without Ask becomes numbness. Ask without Word becomes a courtroom. Best without the others becomes a slogan.",
    "Word keeps you from poisoning the well. Not-mine keeps other people’s poison out of your cup. Ask stops you inventing poison. Best is the daily kindness that lets you practice the first three without turning the house into another trial.",
    "Walk all four. That is the architecture of a freer day."
  ], insight:"Four rooms. One house. You do not have to live in the hallway of old training.", action:"Pick the room you avoid. That is probably the one that would help today."},
  {id:"slip", title:"When you slip", kicker:"Mercy is the method", body:[
    "You will gossip. You will take the text personally. You will invent a story and defend the furniture. You will call a tired day a failure.",
    "A slip is information, not a verdict. The sting button exists because returning is the practice.",
    "Do not start a new case against yourself. Name the room. Take twenty seconds. Walk back in. That is how a new agreement becomes the one that actually runs the house."
  ], insight:"Freedom is a practice, not a mood.", action:"The next slip, skip the speech. Breathe. Choose a room."}
];

const HARD = {
  word:[
    "ADHD and a tired brain will blurt. Repair is part of Word, not proof you failed it.",
    "Honesty without kindness is often the old judge wearing a better coat.",
    "If you were punished for speaking, saying a clean no can feel like danger. Start with one true sentence to yourself."
  ],
  mine:[
    "After narcissistic abuse, “don’t take it personally” can sound like gaslighting. It is not. Their projection is still their projection. Your safety plan is still yours.",
    "You can name harm without taking the story as your identity.",
    "RSD can turn a short email into a trial. Pause before the meaning hardens."
  ],
  ask:[
    "Trauma taught some of us that asking was how we got hurt. A question to a safe person is different from a question to an unsafe one.",
    "You may not be able to ask them. You can still stop treating the invented story as evidence.",
    "One question. Not a cross-examination."
  ],
  best:[
    "Capacity changes with sleep, pain, hormones, grief, and age. The agreement is with the day you actually have.",
    "Perfectionism will try to move into this room and rebrand itself as standards. Send it out.",
    "If all you did was feed the animals and keep a promise to lie down, that can be a complete best."
  ]
};

const EXAMPLES = {
  word:[
    {t:"Inner critic", d:"“I always ruin things.” → “I made a mess of that one task. I can mend the next piece.”"},
    {t:"Gossip", d:"Passing on a story that makes someone smaller. Word asks: would I say this if they were in the room?"},
    {t:"False yes", d:"Saying yes to keep the peace. A clean no is also impeccable."}
  ],
  mine:[
    {t:"Someone’s mood", d:"They walk in cold. The old agreement says you caused it. The new one says you can ask, or you can let their weather pass."},
    {t:"A short reply", d:"A two-word text is not a character assessment. It is a two-word text."},
    {t:"An old voice", d:"The person who used to make everything your fault is gone. The habit of taking the blame can still be sitting in the chair."}
  ],
  ask:[
    {t:"Silence", d:"They haven’t written back. The novel says abandoned. The question is: I don’t know yet."},
    {t:"A look", d:"You invent contempt. You could ask, “Have I read your face right?” Or wait until you have more than a glance."},
    {t:"Mind-reading love", d:"Hoping they will notice without being told. Say the want. It is kinder than the test."}
  ],
  best:[
    {t:"Foggy day", d:"You answered what you could and left the rest. That is best, not laziness."},
    {t:"After a slip", d:"You took the comment personally, then came back twenty minutes later. Returning is best."},
    {t:"Small life", d:"Watered the plants. Spoke one true sentence. Went to bed. Complete."}
  ]
};

const CARDS = [
  "Your word is a seed. Plant only what you want to live in.",
  "The sentence you repeat becomes the room you sleep in.",
  "Say the true thing without the extra bruise.",
  "Gossip is a knife that cuts the hand that holds it.",
  "Their weather is not your name.",
  "A storm is not a verdict on the house it hits.",
  "You may listen. You do not have to move in.",
  "Put it back. It was never yours.",
  "A question is braver than a story.",
  "A blank is not a fact. Do not furnish it.",
  "If you do not know, you do not know. Ask.",
  "One clean question can end a war.",
  "Today’s best is allowed to be small.",
  "Enough is a complete word.",
  "Foggy-day best still counts.",
  "You do not have to finish the sentence the old judge started.",
  "Freedom is a practice, not a mood.",
  "Mastery is returning, not never slipping.",
  "You can keep the old agreement, or you can walk into another room.",
  "Peace is not rude.",
  "Repair belongs to Word. Shame does not.",
  "Compassion stays. Their dream does not get your address.",
  "You were trained. Training can be rewritten.",
  "Four rooms. One house. Come back."
];

const PATH = [];
(function buildPath(){
  const weeks = [
    {room:"word", days:[
      ["The tool","Your word builds the room you live in. Today, notice one sentence you say only to yourself."],
      ["True, not cruel","Honesty without care is still a weapon. Rewrite one harsh line."],
      ["The first audience","You hear you all day. Speak to that listener as someone you are willing to live with."],
      ["Gossip","If it makes a person smaller, it is not information. It is poison with a story attached."],
      ["Promises","Impeccable includes the yes you can keep and the no you need."],
      ["Repair","A clean apology is Word. A self-beating is the old judge."],
      ["Keep one sentence","Choose a sentence for the week that does not turn against you. Repeat it when the other voice starts."]
    ]},
    {room:"mine", days:[
      ["Weather","People speak from their weather. You do not have to take the storm home."],
      ["The contract","Taking it personally is signing a contract you never read."],
      ["Whose dream","When something lands, ask whose dream this is."],
      ["Not numbness","This room is not “nothing happened.” It is “their story is not my name.”"],
      ["Old blame","If you were trained to carry someone’s moods, putting it back will feel like rebellion. It is health."],
      ["The short text","Do not build a trial on two words."],
      ["Peace","Your peace is not rude."]
    ]},
    {room:"ask", days:[
      ["The blank","The mind hates a gap and will paint one. See the painting as a painting."],
      ["Vivid is not true","Assumptions feel like facts because they are detailed. Detail is not evidence."],
      ["One question","Write the question you could actually ask. Asking is not interrogating."],
      ["Say the want","Hoping they will notice is an assumption wearing hope’s clothes. Tell them."],
      ["I don’t know yet","Three words that end a war."],
      ["Unsafe to ask","If you cannot ask them, you can still stop treating the story as proof."],
      ["Wait without the novel","Waiting is allowed. The furniture in the blank is not."]
    ]},
    {room:"best", days:[
      ["Weather report","Best is a report of capacity, not a score."],
      ["Yesterday is closed","You do not owe yesterday’s best to today."],
      ["Fog counts","A small complete thing is still a complete thing."],
      ["The other three","Best is what makes Word, Not mine, and Ask livable."],
      ["Slip and return","Returning is the practice. The judge will call it failure. Do not hire that judge."],
      ["Repair when you can","Mercy is not an excuse to skip a mend you have the energy for."],
      ["Enough","Say it out loud: that was enough. End the week without a trial."]
    ]}
  ];
  let n=1;
  weeks.forEach(w=>w.days.forEach(d=>{
    PATH.push({day:n++, room:w.room, title:d[0], body:d[1]});
  }));
})();

const CATCH = {
  word:["I used my word against myself","I gossiped","I said yes when I meant no","I called cruelty honesty"],
  mine:["I made their mood mean I am the problem","I took a short reply as a verdict","I carried weather that wasn’t mine","I made their dream my name"],
  ask:["I filled a blank and treated it as fact","I ran a three-week story on one look","I expected them to know","I interrogated instead of asking"],
  best:["I punished myself for not being yesterday","I called a tired day a failure","I kept the scoreboard open after enough","I skipped rest and called it standards"]
};

const CAPACITY = ["foggy","tired","sore","hurting","full","clear","griefy","wired","steady"];

function load(){
  try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}
}
function save(p){
  const s=Object.assign(load(),p);
  localStorage.setItem(KEY,JSON.stringify(s));
  return s;
}
function state(){return load();}
function todayRoom(){
  const i=Math.floor((Date.now()/86400000)%4);
  return ROOMS[i];
}
function stamp(){return new Date().toLocaleString("en-AU",{dateStyle:"medium",timeStyle:"short"});}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

let screen="home", roomId="word", roomTab="teach", learnId="old", moreTab="cards", stingPick=null, stingTimer=null;

function go(id){
  screen=id;
  document.querySelectorAll("nav.bottom button").forEach(b=>b.classList.toggle("on",b.dataset.s===id));
  window.scrollTo(0,0);
  render();
}

document.querySelector("nav.bottom").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(b) go(b.dataset.s);
});
document.getElementById("btnAbout").onclick=()=>{moreTab="about";go("more");};
document.getElementById("fabSting").onclick=openSting;
document.getElementById("stingSkip").onclick=closeSting;
document.getElementById("stingGo").onclick=()=>{
  closeSting();
  if(stingPick){roomId=stingPick;roomTab="live";go("rooms");}
};

function openSting(){
  stingPick=null;
  const box=document.getElementById("stingChips");
  box.innerHTML=ROOMS.map(r=>`<button class="chip" data-r="${r.id}" type="button">${r.name}</button>`).join("");
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    stingPick=b.dataset.r;
    box.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
  });
  document.getElementById("sting").classList.add("show");
  let n=20;
  const el=document.getElementById("stingCount");
  el.textContent="A slip is not a verdict. 20";
  clearInterval(stingTimer);
  stingTimer=setInterval(()=>{
    n--; el.textContent = n>0 ? `A slip is not a verdict. ${n}` : "Come back when you are ready.";
    if(n<=0) clearInterval(stingTimer);
  },1000);
}
function closeSting(){
  document.getElementById("sting").classList.remove("show");
  clearInterval(stingTimer);
  const notes=state().stings||[];
  notes.unshift({t:stamp(), room:stingPick});
  save({stings:notes.slice(0,40)});
}

function addNote(note){
  const notes=state().notes||[];
  notes.unshift(note);
  save({notes:notes.slice(0,200)});
}

function render(){
  const root=document.getElementById("app");
  if(screen==="home") root.innerHTML=viewHome();
  else if(screen==="learn") root.innerHTML=viewLearn();
  else if(screen==="rooms") root.innerHTML=viewRooms();
  else if(screen==="path") root.innerHTML=viewPath();
  else root.innerHTML=viewMore();
  bind();
}

function viewHome(){
  const room=todayRoom();
  const s=state();
  const done=(s.pathDone||[]).length;
  return `
    <div class="hero" aria-hidden="true">
      <video autoplay muted loop playsinline poster="" preload="metadata">
        <source src="accord-hero.mp4" type="video/mp4">
      </video>
      <div class="hero-copy">
        <h1>Accord</h1>
        <div class="subline">four rooms · one house</div>
      </div>
    </div>
    <p class="kicker ${room.hue}">Today’s room · ${room.name}</p>
    <h1>Four agreements you can keep today.</h1>
    <p class="lead">${room.promise}</p>
    <p>You were trained into old agreements before you had a say. This is a house for four new ones you choose on purpose. Walk in when something stings. Close the day when you are tired.</p>
    <div class="rooms">
      ${ROOMS.map(r=>`<button class="door ${r.id===room.id?"on":""}" data-open="${r.id}" type="button"><b class="${r.hue}">${r.name}</b><span>${r.door}</span></button>`).join("")}
    </div>
    <button class="btn btn-gold" data-open="${room.id}" type="button">Enter ${room.name}</button>
    <div class="row">
      <button class="btn btn-ghost" data-go="learn" type="button">Learn the house</button>
      <button class="btn btn-ghost" data-go="path" type="button">28-day path</button>
    </div>
    <div class="card">
      <p class="kicker">This house</p>
      <p class="muted" style="margin:0">Inspired by don Miguel Ruiz. Original teaching and practice — not a reprint. ${done} of 28 path days kept. Missed days are covered by Best.</p>
    </div>
  `;
}

function viewLearn(){
  const L=LESSONS.find(x=>x.id===learnId)||LESSONS[0];
  return `
    <p class="kicker gold">Learn</p>
    <h1>How the house works</h1>
    <p>Short lessons. One insight. One tiny action. Read a single room when you have the energy for a single room.</p>
    <div class="list">
      ${LESSONS.map(x=>`<button type="button" data-lesson="${x.id}"><b>${x.title}</b><small>${x.kicker}</small></button>`).join("")}
    </div>
    <div class="card">
      <p class="kicker ${["word","mine","ask","best"].includes(L.id)?({word:"gold",mine:"teal",ask:"violet",best:"rose"}[L.id]):"gold"}">${L.kicker}</p>
      <h2>${L.title}</h2>
      ${L.body.map(p=>`<p>${p}</p>`).join("")}
      <div class="card" style="background:#1a1722;margin-top:8px">
        <p class="kicker">Keep this</p>
        <p class="lead" style="font-size:20px;margin:0">${L.insight}</p>
      </div>
      <p class="muted">${L.action}</p>
      <button class="btn btn-ink" data-keep-lesson="${L.id}" type="button">Keep this lesson</button>
      <div class="ok" id="lessonSaved"></div>
    </div>
  `;
}

function viewRooms(){
  const r=ROOMS.find(x=>x.id===roomId)||ROOMS[0];
  const inner = roomTab==="teach"?roomTeach(r):roomTab==="live"?roomLive(r):roomTab==="hard"?roomHard(r):roomNotes(r);
  return `
    <p class="kicker ${r.hue}">The four rooms</p>
    <div class="rooms">
      ${ROOMS.map(x=>`<button class="door ${x.id===r.id?"on":""}" data-room="${x.id}" type="button"><b class="${x.hue}">${x.name}</b><span>${x.door}</span></button>`).join("")}
    </div>
    <h1 class="${r.hue}">${r.name}</h1>
    <p class="lead">${r.promise}</p>
    <div class="tabs">
      <button class="tab ${roomTab==="teach"?"on":""}" data-rtab="teach" type="button">Teach</button>
      <button class="tab ${roomTab==="live"?"on":""}" data-rtab="live" type="button">Practice</button>
      <button class="tab ${roomTab==="hard"?"on":""}" data-rtab="hard" type="button">When it’s hard</button>
      <button class="tab ${roomTab==="notes"?"on":""}" data-rtab="notes" type="button">Notes</button>
    </div>
    ${inner}
  `;
}

function roomTeach(r){
  const L=LESSONS.find(x=>x.id===r.id);
  const ex=EXAMPLES[r.id]||[];
  return `
    <div class="card ${r.hue}">
      ${L.body.map(p=>`<p>${p}</p>`).join("")}
      <p class="lead" style="font-size:20px;margin-bottom:0">${L.insight}</p>
    </div>
    <h3>How it shows up</h3>
    ${ex.map(e=>`<div class="card"><p class="kicker">${e.t}</p><p style="margin:0">${e.d}</p></div>`).join("")}
    <button class="btn btn-gold" data-rtab="live" type="button">Practise ${r.name}</button>
  `;
}

function roomLive(r){
  if(r.id==="word") return liveForm(r,"What did I just say — out loud or inside?","Rewrite it so it is true and not cruel.","Keep this wording",CATCH.word);
  if(r.id==="mine") return liveForm(r,"What landed?","Whose dream is this? What would I keep if it isn’t about me?","Put it back",CATCH.mine);
  if(r.id==="ask") return liveForm(r,"What am I assuming?","One question I could actually ask — or one fact I still don’t have.","I’ll ask, or I’ll wait",CATCH.ask);
  return liveBest(r);
}

function liveForm(r,p1,p2,saveLabel,chips){
  return `
    <div class="card ${r.hue}">
      <p class="muted">Catch what just happened. No essay required.</p>
      <div class="chips" id="catchChips">${chips.map(c=>`<button class="chip" type="button">${c}</button>`).join("")}</div>
      <p class="kicker">First</p>
      <textarea id="a1" placeholder="${p1}"></textarea>
      <p class="kicker">Then</p>
      <textarea id="a2" placeholder="${p2}"></textarea>
      <button class="btn btn-gold" id="savePractice" type="button">${saveLabel}</button>
      <div class="ok" id="savedMsg"></div>
    </div>
  `;
}

function liveBest(r){
  return `
    <div class="card ${r.hue}">
      <p>What was my capacity today?</p>
      <div class="chips" id="capChips">${CAPACITY.map(c=>`<button class="chip" type="button">${c}</button>`).join("")}</div>
      <p class="kicker">One thing that counted as enough</p>
      <textarea id="a2" placeholder="A complete small thing is still complete."></textarea>
      <button class="btn btn-gold" id="savePractice" type="button">That was my best</button>
      <div class="ok" id="savedMsg"></div>
    </div>
  `;
}

function roomHard(r){
  return `
    <div class="card ${r.hue}">
      ${(HARD[r.id]||[]).map(p=>`<p>${p}</p>`).join("")}
    </div>
    <p class="muted">This app is self-help, not therapy. If you are in danger in Australia call 000. Lifeline 13 11 14. Blue Knot 1300 657 380.</p>
  `;
}

function roomNotes(r){
  const notes=(state().notes||[]).filter(n=>n.room===r.id);
  if(!notes.length) return `<p class="muted">Nothing saved in ${r.name} yet. Practice stays on this phone.</p>`;
  return `<div class="saved">${notes.map(n=>`<div class="item"><time>${escapeHtml(n.t)}</time>${escapeHtml(n.text)}</div>`).join("")}</div>`;
}

function viewPath(){
  const s=state();
  const done=new Set(s.pathDone||[]);
  const start=s.pathStart||null;
  const current = currentPathDay(s);
  const P=PATH[current-1]||PATH[0];
  const room=ROOMS.find(r=>r.id===P.room);
  return `
    <p class="kicker ${room.hue}">28 days · one week per room</p>
    <h1>Walk the house</h1>
    <p>Week of Word, then Not mine, then Ask, then Best. Missed days do not reset anything. Best covers them.</p>
    <div class="progress"><i style="width:${Math.round(done.size/28*100)}%"></i></div>
    <p class="tiny">${done.size} kept · day ${P.day} available</p>
    <div class="daygrid">
      ${PATH.map(d=>`<button type="button" data-pday="${d.day}" class="${done.has(d.day)?"done":""} ${d.day===P.day?"today":""}">${d.day}</button>`).join("")}
    </div>
    <div class="card ${room.hue}">
      <p class="kicker">${room.name} · Day ${P.day}</p>
      <h2>${P.title}</h2>
      <p>${P.body}</p>
      <textarea id="pathNote" placeholder="One line from today."></textarea>
      <button class="btn btn-gold" id="keepDay" data-day="${P.day}" type="button">Keep this day</button>
      <div class="ok" id="pathMsg"></div>
    </div>
    ${start?"":`<button class="btn btn-ghost" id="startPath" type="button">Begin the path today</button>`}
  `;
}

function currentPathDay(s){
  if(s.pathView) return s.pathView;
  if(!s.pathStart) return 1;
  const start=new Date(s.pathStart);
  const days=Math.floor((Date.now()-start.getTime())/86400000)+1;
  return Math.min(28, Math.max(1,days));
}

function viewMore(){
  const tabs=`<div class="tabs">
    <button class="tab ${moreTab==="cards"?"on":""}" data-mtab="cards" type="button">Cards</button>
    <button class="tab ${moreTab==="journal"?"on":""}" data-mtab="journal" type="button">Journal</button>
    <button class="tab ${moreTab==="evening"?"on":""}" data-mtab="evening" type="button">Evening</button>
    <button class="tab ${moreTab==="about"?"on":""}" data-mtab="about" type="button">About</button>
  </div>`;
  if(moreTab==="cards") return tabs+viewCards();
  if(moreTab==="journal") return tabs+viewJournal();
  if(moreTab==="evening") return tabs+viewEvening();
  return tabs+viewAbout();
}

function viewCards(){
  const i=state().cardIndex||0;
  const loved=new Set(state().loved||[]);
  const line=CARDS[i%CARDS.length];
  return `
    <p class="kicker gold">Living lines</p>
    <h1>Keep one in your pocket</h1>
    <div class="card gold">
      <p class="cardline">${line}</p>
      <div class="row">
        <button class="btn btn-ghost" id="cardPrev" type="button">Previous</button>
        <button class="btn btn-ink" id="cardNext" type="button">Another</button>
      </div>
      <button class="btn btn-ghost" id="loveCard" type="button">${loved.has(line)?"Kept":"Keep this card"}</button>
    </div>
    ${loved.size?`<h3>Kept</h3>${[...loved].map(c=>`<div class="card"><p class="cardline" style="font-size:20px;margin:0">${escapeHtml(c)}</p></div>`).join("")}`:""}
  `;
}

function viewJournal(){
  const notes=state().notes||[];
  if(!notes.length) return `<p class="muted">Practices and evenings you save will live here. On this phone only.</p>`;
  return `<h1>Private notes</h1><p class="muted">Saved on this device. Nothing is sent away.</p>
    <div class="saved">${notes.map(n=>`<div class="item"><time>${escapeHtml(n.t)} · ${escapeHtml(n.room||"")}</time>${escapeHtml(n.text)}</div>`).join("")}</div>
    <button class="btn btn-ghost" id="wipeNotes" type="button">Clear notes on this phone</button>`;
}

function viewEvening(){
  return `
    <p class="kicker rose">Close the day</p>
    <h1>What was enough</h1>
    <p>Which room did I live in. Where did I slip. What counted.</p>
    <div class="chips" id="eveRooms">${ROOMS.map(r=>`<button class="chip" data-r="${r.id}" type="button">${r.name}</button>`).join("")}</div>
    <textarea id="eveSlip" placeholder="Where did I slip — if I did."></textarea>
    <textarea id="eveEnough" placeholder="What was enough."></textarea>
    <button class="btn btn-gold" id="saveEve" type="button">Close the day</button>
    <div class="ok" id="eveMsg"></div>
  `;
}

function viewAbout(){
  return `
    <h1>About Accord</h1>
    <p class="lead">A practice companion inspired by don Miguel Ruiz’s Four Agreements.</p>
    <div class="card">
      <p>Accord teaches the ideas in original language and gives you a place to practise them. It is not a reprint of the book, not affiliated with Amber-Allen Publishing, and not a substitute for reading Ruiz if you want his voice.</p>
      <p>Self-help, not therapy, not diagnosis, not crisis support. If you are in danger in Australia call <a href="tel:000" style="color:#e8c872">000</a>. Lifeline <a href="tel:131114" style="color:#e8c872">13 11 14</a>. Blue Knot 1300 657 380. 1800RESPECT 1800 737 732.</p>
      <p>Everything you write stays on this device. No account. Add to Home Screen and it is yours offline.</p>
      <p class="muted" style="margin:0">NumeraKey · buy once, own forever · not medical advice.</p>
    </div>
    <div class="card">
      <p class="kicker">How to keep it</p>
      <p>Android: browser menu → Add to Home screen. iPhone: Share → Add to Home Screen.</p>
    </div>
  `;
}

function bind(){
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{roomId=b.dataset.open;roomTab="teach";go("rooms");});
  document.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{roomId=b.dataset.room;render();});
  document.querySelectorAll("[data-rtab]").forEach(b=>b.onclick=()=>{roomTab=b.dataset.rtab;render();});
  document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{learnId=b.dataset.lesson;render();window.scrollTo(0,200);});
  document.querySelectorAll("[data-mtab]").forEach(b=>b.onclick=()=>{moreTab=b.dataset.mtab;render();});
  document.querySelectorAll("[data-pday]").forEach(b=>b.onclick=()=>{save({pathView:Number(b.dataset.pday)});render();});

  document.querySelectorAll("#catchChips .chip, #capChips .chip").forEach(c=>{
    c.onclick=()=>c.classList.toggle("on");
  });

  const saveBtn=document.getElementById("savePractice");
  if(saveBtn) saveBtn.onclick=()=>{
    const chips=[...document.querySelectorAll("#catchChips .chip.on, #capChips .chip.on")].map(x=>x.textContent);
    const a1=(document.getElementById("a1")||{}).value||"";
    const a2=(document.getElementById("a2")||{}).value||"";
    const text=[chips.join(" · "),a1,a2].filter(Boolean).join(" — ");
    if(!text.trim()){document.getElementById("savedMsg").textContent="Write one line, or tap a catch.";return;}
    addNote({t:stamp(), room:roomId, text});
    document.getElementById("savedMsg").textContent="Saved on this phone.";
    if(document.getElementById("a1")) document.getElementById("a1").value="";
    if(document.getElementById("a2")) document.getElementById("a2").value="";
  };

  const keepL=document.querySelector("[data-keep-lesson]");
  if(keepL) keepL.onclick=()=>{
    const L=LESSONS.find(x=>x.id===keepL.dataset.keepLesson);
    addNote({t:stamp(), room:"learn", text:L.title+": "+L.insight});
    document.getElementById("lessonSaved").textContent="Kept in your journal.";
  };

  const startP=document.getElementById("startPath");
  if(startP) startP.onclick=()=>{save({pathStart:new Date().toISOString(), pathView:1});render();};

  const keepDay=document.getElementById("keepDay");
  if(keepDay) keepDay.onclick=()=>{
    const day=Number(keepDay.dataset.day);
    const done=new Set(state().pathDone||[]);
    done.add(day);
    const line=(document.getElementById("pathNote").value||"").trim();
    const P=PATH[day-1];
    addNote({t:stamp(), room:P.room, text:`Day ${day} · ${P.title}${line?" — "+line:""}`});
    save({pathDone:[...done]});
    document.getElementById("pathMsg").textContent="Kept. Missed days stay forgiven.";
  };

  const next=document.getElementById("cardNext");
  const prev=document.getElementById("cardPrev");
  if(next) next.onclick=()=>{save({cardIndex:((state().cardIndex||0)+1)%CARDS.length});render();};
  if(prev) prev.onclick=()=>{save({cardIndex:(CARDS.length+((state().cardIndex||0)-1))%CARDS.length});render();};
  const love=document.getElementById("loveCard");
  if(love) love.onclick=()=>{
    const line=CARDS[(state().cardIndex||0)%CARDS.length];
    const loved=new Set(state().loved||[]);
    if(loved.has(line)) loved.delete(line); else loved.add(line);
    save({loved:[...loved]}); render();
  };

  const wipe=document.getElementById("wipeNotes");
  if(wipe) wipe.onclick=()=>{if(confirm("Clear journal notes on this phone?")){save({notes:[]});render();}};

  const saveEve=document.getElementById("saveEve");
  if(saveEve) saveEve.onclick=()=>{
    const rooms=[...document.querySelectorAll("#eveRooms .chip.on")].map(x=>x.textContent);
    const slip=document.getElementById("eveSlip").value.trim();
    const enough=document.getElementById("eveEnough").value.trim();
    const text=[rooms.join(", "),slip,enough].filter(Boolean).join(" — ");
    if(!text){document.getElementById("eveMsg").textContent="Tap a room or write one line.";return;}
    addNote({t:stamp(), room:"evening", text});
    document.getElementById("eveMsg").textContent="Day closed. That was enough.";
  };
  document.querySelectorAll("#eveRooms .chip").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
}

render();
</script>
</body>
</html>
