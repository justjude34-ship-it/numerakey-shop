<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shop.css">

<body>

<section class="nk-hero-video" aria-label="NumeraKey globe">
  <video
    class="nk-hero-video__el"
    autoplay
    muted
    loop
    playsinline
    poster="https://numerakey-media-host.vercel.app/images/hero.jpg"
  >
    <source src="https://numerakey-media-host.vercel.app/video/hero.mp4" type="video/mp4">
  </video>
</section>

<header class="bar">
  <div class="wrap">
    <a class="mark" href="#/"><span class="spectrum">NumeraKey</span></a>
    <span class="by">By Judith</span>
    <nav>
      <a href="#/">Shop</a>
      <a href="#/how">How it works</a>
      <a href="#/support">Support</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <a href="#/licence">Licence</a>
    <a href="#/how">How it works</a>
    <a href="#/support">Support</a>
    <a id="mailto" href="#">Email</a>
    <span class="copy">© <span id="yr"></span> NumeraKey · By Judith</span>
  </div>

<script src="/s1.js" defer></script>

<style>
/* heading sweep: teal, purple, magenta (matches the hero video) */
:root{--g1:#2EC4B6;--g2:#9B5DE5;--g3:#E040B0}
.by{font-family:var(--ui);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#C9CCD6;white-space:nowrap}
@media(max-width:480px){.bar .by{display:none}}
/* the one piece of motion on the site: the key cuts rise once, on load */
@keyframes cut { from { transform: scaleY(.04); } to { transform: scaleY(1); } }
.kb { transform-origin: 50% 100%; animation: cut .62s cubic-bezier(.2,.8,.25,1) both; }
@media (prefers-reduced-motion: reduce){ .kb { animation: none; } }
</style>


<style>
.nk-hero-video{position:relative;width:100%;max-width:100%;overflow:hidden;background:#0a0b10;line-height:0;border-bottom:1px solid rgba(255,255,255,.06);box-sizing:border-box}
.nk-hero-video__el{display:block;width:100%;max-width:100%;height:auto;max-height:min(56vh,520px);object-fit:cover;object-position:center center;background:#0a0b10;min-width:0}
@media(max-width:640px){.nk-hero-video__el{max-height:40vh}}
@media(prefers-reduced-motion:reduce){.nk-hero-video__el{/* keep poster via paused state */} }
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    var v=document.querySelector('.nk-hero-video__el');
    if(v){try{v.pause();}catch(e){}}
  }
});
</script>

</body>
</html>
