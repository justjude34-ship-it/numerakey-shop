<body>

<!-- Welcome cover: shown on every visit; the Enter button is the greeting that starts the beach video and harp music. -->
<style>
html.nk-cover-open,html.nk-cover-open body{overflow:hidden}
.nk-cover{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:max(28px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));
  background:#0B0910;color:#F4EFE7;overflow:hidden;opacity:1;transition:opacity .8s ease,visibility 0s linear 0s}
.nk-cover::before{content:"";position:absolute;inset:-60px;background:url(/images/hero.jpg) center 30%/cover no-repeat;filter:blur(24px) saturate(1.15) brightness(.9);transform:scale(1.06)}
.nk-cover::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(11,9,16,.38),rgba(11,9,16,.62) 80%)}
.nk-cover__inner{position:relative;z-index:1;max-width:34rem;width:100%}
.nk-cover__mark{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:600;font-size:clamp(3rem,11vw,5.4rem);line-height:1;letter-spacing:-.01em;margin:0;color:#F4EFE7;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.nk-cover__by{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(1.35rem,4.6vw,1.8rem);line-height:1.2;margin:.35em 0 0;color:#F4EFE7;opacity:.92;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.nk-cover__line{font-family:'Outfit',ui-sans-serif,system-ui,sans-serif;font-weight:300;font-size:clamp(1.05rem,3.6vw,1.25rem);line-height:1.5;margin:1.6em auto 2em;max-width:30ch;text-wrap:balance;color:#F4EFE7;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.nk-cover__btn{font-family:'Outfit',ui-sans-serif,system-ui,sans-serif;font-weight:500;font-size:1.15rem;letter-spacing:.02em;
  min-height:60px;min-width:min(17rem,100%);padding:16px 36px;border:0;border-radius:999px;cursor:pointer;
  background:#D9A441;color:#120C04;box-shadow:0 8px 28px rgba(0,0,0,.35);transition:transform .15s ease,background .15s ease;-webkit-tap-highlight-color:transparent}
.nk-cover__btn:hover{background:#E6B455}
.nk-cover__btn:active{transform:scale(.98)}
.nk-cover__btn:focus-visible{outline:2px solid rgba(244,239,231,.85);outline-offset:4px}
.nk-cover[hidden]{display:none}
.nk-cover.is-leaving{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .8s ease,visibility 0s linear .8s}
@media (prefers-reduced-motion:reduce){.nk-cover,.nk-cover.is-leaving{transition:none}.nk-cover__btn{transition:none}}
</style>
<div class="nk-cover" role="dialog" aria-modal="true" aria-labelledby="nk-cover-title" aria-describedby="nk-cover-line">
  <div class="nk-cover__inner">
    <h1 class="nk-cover__mark" id="nk-cover-title">NumeraKey</h1>
    <p class="nk-cover__by">Apps by Judith</p>
    <p class="nk-cover__line" id="nk-cover-line">Gentle apps you buy once and keep forever.</p>
    <button type="button" class="nk-cover__btn" autofocus>Enter the Shop</button>
  </div>
</div>
<script>document.documentElement.classList.add('nk-cover-open');</script>

<style>
/* heading sweep: teal, purple, magenta (matches the hero video) */
:root{--g1:#2EC4B6;--g2:#9B5DE5;--g3:#E040B0}
.by{font-family:var(--ui);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#C9CCD6;white-space:nowrap}
@media(max-width:480px){.bar .by{display:none}}
/* the one piece of motion on the site: the key cuts rise once, on load */
@keyframes cut { from { transform: scaleY(.04); } to { transform: scaleY(1); } }
.kb { transform-origin: 50% 100%; animation: cut .62s cubic-bezier(.2,.8,.25,1) both; }
@media (prefers-reduced-motion: reduce){ .kb { animation: none; } }
</style>

<style>
/* Full globe visible: contain + black letterbox (no crop). Portrait 1152x1668. */
.nk-hero-video{position:relative;width:100%;max-width:100%;overflow:hidden;background:#0a0b10;line-height:0;border-bottom:1px solid rgba(255,255,255,.06);box-sizing:border-box;display:flex;justify-content:center;align-items:center}
.nk-hero-video__el{display:block;width:100%;max-width:100%;height:auto;max-height:min(85vh,900px);object-fit:contain;object-position:center center;background:#0a0b10;min-width:0}
@media(max-width:640px){
  /* Let natural portrait aspect show on phone — no 40vh crop */
  .nk-hero-video__el{max-height:none;width:100%;height:auto}
}
@media (prefers-reduced-motion:reduce){.nk-hero-video__el{/* keep poster via paused state */}}
</style>
<audio class="nk-hero-music" preload="auto" src="/audio/hero-music.m4a?v=2"></audio>
<script>
/* Hero: the beach video loops muted; the music is a separate track
   ("Calm Lullaby For Irish Harp", MountainDweller, Pixabay, 1:33).
   Both wait behind the welcome cover. Tapping "Enter the Shop" fades the cover,
   starts the video (unless reduced motion is on: poster stays) and plays the music once.
   It never restarts when the picture loops. */
document.addEventListener('DOMContentLoaded',function(){
  var v=document.querySelector('.nk-hero-video__el');
  var m=document.querySelector('.nk-hero-music');
  var c=document.querySelector('.nk-cover');
  var btn=c&&c.querySelector('.nk-cover__btn');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rest=[].filter.call(document.body.children,function(el){return el!==c&&el.tagName!=='SCRIPT'&&el.tagName!=='STYLE';});
  if(v){ v.muted=true; try{v.pause();}catch(e){} }
  if(m) m.loop=false;
  function setInert(on){ rest.forEach(function(el){ if(on){el.setAttribute('inert','');} else {el.removeAttribute('inert');} }); }
  function play(el){ try{ var p=el.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
  function enter(){
    if(!c||c.classList.contains('is-leaving')) return;
    if(m){ m.volume=0.9; play(m); }
    if(v&&!reduce) play(v);
    c.classList.add('is-leaving');
    c.setAttribute('aria-hidden','true');
    c.setAttribute('inert','');
    btn.blur();
    setInert(false);
    document.documentElement.classList.remove('nk-cover-open');
    setTimeout(function(){ c.hidden=true; }, reduce?0:800);
  }
  if(!c||!btn){ if(v&&!reduce) play(v); return; }
  setInert(true);
  btn.addEventListener('click',enter);
  try{ btn.focus({preventScroll:true}); }catch(e){}
});
</script>
