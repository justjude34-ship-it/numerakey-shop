<style>
/* heading sweep: teal, purple, magenta (matches the hero video) */
:root{--g1:#2EC4B6;--g2:#9B5DE5;--g3:#E040B0}
.by{font-family:var(--ui);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:#C9CCD6;white-space:nowrap}
@media(max-width:480px){.bar .by{display:none}}
/* the one piece of motion on the site: the key cuts rise once, on load */
@keyframes cut { from { transform: scaleY(.04); } to { transform: scaleY(1); } }
.kb { transform-origin: 50% 100%; animation: cut .62s cubic-bezier(.2,.8,.25,1) both; }
@media (prefers-reduced-motion: reduce){ .kb { animation: none; } }
</style>

<style>
/* Full globe visible: contain + black letterbox (no crop). Portrait 1152x1668. */
.nk-hero-video{position:relative;width:100%;max-width:100%;overflow:hidden;background:#0a0b10;line-height:0;border-bottom:1px solid rgba(255,255,255,.06);box-sizing:border-box;display:flex;justify-content:center;align-items:center}
.nk-hero-video__el{display:block;width:100%;max-width:100%;height:auto;max-height:min(85vh,900px);object-fit:contain;object-position:center center;background:#0a0b10;min-width:0}
@media(max-width:640px){
  /* Let natural portrait aspect show on phone — no 40vh crop */
  .nk-hero-video__el{max-height:none;width:100%;height:auto}
}
@media (prefers-reduced-motion:reduce){.nk-hero-video__el{/* keep poster via paused state */}}
</style>
<audio class="nk-hero-music" preload="auto" src="/audio/hero-music.m4a"></audio>
<script>
/* Hero: the beach video always loops muted; the music is a separate track
   ("Calm Lullaby For Irish Harp", MountainDweller, Pixabay, 1:33).
   It starts with sound if the browser allows it, otherwise on the first tap, click or key press,
   plays the full track once and stops. It never restarts when the picture loops. */
document.addEventListener('DOMContentLoaded',function(){
  var v=document.querySelector('.nk-hero-video__el');
  var m=document.querySelector('.nk-hero-music');
  if(!v) return;
  v.muted=true;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    try{v.pause();}catch(e){}
    return;
  }
  var pv=v.play(); if(pv&&pv.catch) pv.catch(function(){});
  if(!m) return;
  m.loop=false;
  m.volume=0.9;
  var started=false;
  var EVTS=['pointerup','touchend','click','keydown'];
  function done(){ EVTS.forEach(function(e){document.removeEventListener(e,onGesture,true);}); }
  function startMusic(){
    if(started) return;
    try{
      var p=m.play();
      if(p&&typeof p.then==='function'){
        p.then(function(){ started=true; done(); }).catch(function(){ /* still blocked: wait for a gesture */ });
      } else { started=true; done(); }
    }catch(e){}
  }
  /* Browsers only allow sound after a real tap/click/key press (touchstart and scroll don't count). */
  function onGesture(){ startMusic(); }
  EVTS.forEach(function(e){document.addEventListener(e,onGesture,true);});
  startMusic();
});
</script>
